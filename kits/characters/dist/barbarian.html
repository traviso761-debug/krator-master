/* ---- 30-rig.js ---- */
/* ============================== the shared rig ==============================
   One skeleton topology for every character: Mixamo's names (without the colon,
   as three's FBXLoader writes them) and Mixamo's rest convention: every bone has
   identity rotation, legs point -Y, spine +Y, arms along +/-X (a T-pose), +X is
   the character's LEFT. Only the rest positions differ per character, through a
   proportions table, so a Mixamo clip's local quaternions apply to all of them.
*/
var PROPORTIONS_DEFAULT = { hip: 1.12, spine: 1.26, spine1: 1.38, spine2: 1.50, neck: 1.86, head: 1.98, headTop: 2.22,
  shoulderX: 0.16, shoulderY: 1.80, armX: 0.40, armY: 1.74, elbowX: 0.74, wristX: 1.06, handTipX: 1.20,
  hipX: 0.17, kneeX: 0.18, kneeY: 0.62, kneeZ: 0.02, ankleY: 0.12, footTipZ: 0.24 };
var P = PROPORTIONS_DEFAULT;

function defineBones(p){
  P = Object.assign({}, PROPORTIONS_DEFAULT, p || {});
  defBone('mixamorigHips',   null,             0, P.hip, 0);
  defBone('mixamorigSpine',  'mixamorigHips',  0, P.spine, 0);
  defBone('mixamorigSpine1', 'mixamorigSpine', 0, P.spine1, 0);
  defBone('mixamorigSpine2', 'mixamorigSpine1',0, P.spine2, 0);
  defBone('mixamorigNeck',   'mixamorigSpine2',0, P.neck, 0);
  defBone('mixamorigHead',   'mixamorigNeck',  0, P.head, 0, [0, P.headTop, 0]);
  [1, -1].forEach(function(s){
    var S = s > 0 ? 'Left' : 'Right';
    defBone('mixamorig' + S + 'Shoulder', 'mixamorigSpine2',            s * P.shoulderX, P.shoulderY, 0);
    defBone('mixamorig' + S + 'Arm',      'mixamorig' + S + 'Shoulder', s * P.armX, P.armY, 0);
    defBone('mixamorig' + S + 'ForeArm',  'mixamorig' + S + 'Arm',      s * P.elbowX, P.armY, 0);
    defBone('mixamorig' + S + 'Hand',     'mixamorig' + S + 'ForeArm',  s * P.wristX, P.armY, 0, [s * P.handTipX, P.armY, 0]);
    defBone('mixamorig' + S + 'UpLeg',    'mixamorigHips',              s * P.hipX, P.hip - 0.04, 0);
    defBone('mixamorig' + S + 'Leg',      'mixamorig' + S + 'UpLeg',    s * P.kneeX, P.kneeY, P.kneeZ);
    defBone('mixamorig' + S + 'Foot',     'mixamorig' + S + 'Leg',      s * P.kneeX, P.ankleY, 0, [s * P.kneeX, 0.02, P.footTipZ]);
  });
}
/* short aliases used by the body builders and the poses */
function B(side, part){ return 'mixamorig' + (side > 0 ? 'Left' : 'Right') + part; }
/* arm landmarks for a side, in the T-pose */
function armPts(s){ return { sh: V3(s * P.armX, P.armY, 0), el: V3(s * P.elbowX, P.armY, 0), wr: V3(s * P.wristX, P.armY, 0), fist: V3(s * (P.wristX + 0.07), P.armY, 0.01) }; }
function legPts(s){ return { hp: V3(s * P.hipX, P.hip - 0.04, 0), kn: V3(s * P.kneeX, P.kneeY, P.kneeZ), an: V3(s * P.kneeX, P.ankleY, 0) }; }

/* A rigid prop in a hand. pos and euler are authored with the arm HANGING (the old
   A-pose convention: -Y down the shaft, +Z forward); the hand bone rests in the
   T-pose, so both are rotated by q_hang^-1 (see applyPose in 40-walk.js). */
var PROPS = [];
function attachProp(side, group, pos, euler){ PROPS.push({ side: side, group: group, pos: pos, euler: euler }); }
function mountProps(){
  hangQuats();
  PROPS.forEach(function(pr){ var s = pr.side;
    pr.group.position.copy(pr.pos).applyQuaternion(_qHangInv[s]);
    pr.group.quaternion.setFromEuler(new THREE.Euler(pr.euler[0], pr.euler[1], pr.euler[2])).premultiply(_qHangInv[s]);
    BONES[pr.bone || B(s, 'Hand')].add(pr.group); });
}
/* common materials for props */
function propMat(hex, metal, rough){ return new THREE.MeshStandardMaterial({ color: C(hex), metalness: metal || 0, roughness: rough == null ? 0.8 : rough }); }
function propMesh(group, geo, mat, x, y, z){ var m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; group.add(m); return m; }

/* the character registry: key -> {name, proportions, build(), clips, defaultClip} */
var CHARACTERS = [];
function registerCharacter(c){ CHARACTERS.push(c); }

/* shared parts */
function fist(s, color, bones){
  var a = armPts(s);
  addPiece(ellipsoid(a.fist.x, a.fist.y, a.fist.z, 0.085, 1.15, 0.95, 0.95), color, bones);
  addPiece(ellipsoid(a.fist.x - s * 0.01, a.fist.y + 0.04, a.fist.z + 0.04, 0.04, 1.1, 0.9, 1.0), color, bones);
}

/* ============================== the barbarian ==============================
   Bald, pink handlebar mustache, bare chest, leather trousers with pink fur
   trim at the belt and the boot cuffs, a bearded axe in each hand.
   Rest pose: standing, facing +Z, arms down and a little out. Units: metres.
   He is 2.2 m tall.
*/
var SKIN = 0xd4927a, SKIN_DARK = 0xc4826a, PINK = 0xd84aa0, LEATHER = 0x7a5838, LEATHER_LIGHT = 0x957046,
    LEATHER_DARK = 0x4b3621, STEEL = 0xb9bec6, WOOD = 0x6a4a2b, EYE_WHITE = 0xf6f1e8, EYE_DARK = 0x2a1a14;
/* 31: the barbarian. Uses the default proportions. */

function buildBarbarianBody(){
  var R = rng(7);
  /* torso: pelvis to neck, V-shaped */
  addPiece(bodyTube([
    { y: 1.02, rx: 0.21, rz: 0.15 }, { y: 1.10, rx: 0.225, rz: 0.16 }, { y: 1.20, rx: 0.215, rz: 0.15 },
    { y: 1.32, rx: 0.235, rz: 0.165 }, { y: 1.44, rx: 0.29, rz: 0.20 }, { y: 1.56, rx: 0.345, rz: 0.235 },

  ], 20), SKIN, ['mixamorigHips', 'mixamorigSpine', 'mixamorigSpine1', 'mixamorigSpine2', 'mixamorigNeck']);
  /* pecs, abs, traps, lats */
  [1, -1].forEach(function(s){

    addPiece(ellipsoid(s * 0.07, 1.36, 0.165, 0.06, 1.1, 0.85, 0.5), SKIN, ['mixamorigSpine1', 'mixamorigSpine2']);

  addPiece(limbTube(V3(0, 1.82, 0), V3(0, 2.00, 0.01), [{ t: 0, r: 0.125 }, { t: 0.5, r: 0.11 }, { t: 1, r: 0.10 }], 14), SKIN, ['mixamorigSpine2', 'mixamorigNeck', 'mixamorigHead']);

/* The axe: built once in its own frame (grip at the origin, shaft along Y,
   blade toward +X), as a plain Group that is parented to a hand bone. */
function buildAxe(mirror){
  var g = new THREE.Group(), m = mirror ? -1 : 1;
  var metal = new THREE.MeshStandardMaterial({ color: C(STEEL), metalness: 0.85, roughness: 0.38 });
  var wood = new THREE.MeshStandardMaterial({ color: C(WOOD), roughness: 0.85 });
  var pink = new THREE.MeshStandardMaterial({ color: C(PINK), roughness: 0.9 });
  function add(geo, mat, x, y, z){ var mesh = new THREE.Mesh(geo, mat); mesh.position.set(x || 0, y || 0, z || 0); mesh.castShadow = true; g.add(mesh); return mesh; }
  add(new THREE.CylinderGeometry(0.02, 0.024, 0.98, 10), wood, 0, -0.10);
  add(new THREE.CylinderGeometry(0.03, 0.03, 0.05, 10), metal, 0, 0.37);               /* pommel */
  add(new THREE.CylinderGeometry(0.029, 0.029, 0.14, 10), pink, 0, 0.22);              /* wrap, butt end */
  add(new THREE.CylinderGeometry(0.03, 0.03, 0.12, 10), pink, 0, -0.30);               /* wrap, head end */
  add(new THREE.CylinderGeometry(0.034, 0.034, 0.04, 10), metal, 0, -0.38);            /* collar */
  var pts = [[-0.02, -0.12], [0.03, -0.12], [0.09, -0.19], [0.19, -0.23], [0.29, -0.12], [0.33, 0.02], [0.28, 0.15],
             [0.18, 0.21], [0.08, 0.18], [0.03, 0.12], [-0.02, 0.12], [-0.02, 0.06], [-0.13, 0.025], [-0.02, -0.02]];
  var shape = new THREE.Shape(pts.map(function(p){ return new THREE.Vector2(p[0] * 0.85 * m, p[1] * 0.85); }));
  var blade = new THREE.ExtrudeGeometry(shape, { depth: 0.028, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 });
  blade.translate(0, 0, -0.014);
  add(blade, metal, 0, -0.50);
  /* a pink filigree band across the blade root, as in the painting */
  add(new THREE.BoxGeometry(0.06, 0.26, 0.036), pink, m * 0.05, -0.50);
  return g;
}

function spikesOnBody(profile, n, len, bones, R, cx){

   the spine and both legs, so it sways with a walk. The textile is a vertex-

   'raise', the right hand held up.

var PR_BLACK = 0x15131a, PR_PAL = [0xff2a8a, 0xff8a1a, 0x1ad0b0, 0xffe02a, 0x9a3cff, 0x3ad0ff];

  var black = C(PR_BLACK), pal = PR_PAL.map(C);

    var th = Math.atan2(p.z, p.x), band = Math.floor(p.y * scale), chev = Math.abs(((th * 10 / Math.PI + band * 0.5) % 2 + 2) % 2 - 1);
    var k = (band * 3 + Math.floor(chev * 8) + seed) % 13;
    if(k > 4) return black;
    if(Math.abs(th - Math.PI / 2) < 0.18 && p.y < 1.9) return pal[(band + seed) % pal.length];       /* the front panel stripe */
    return pal[k % pal.length];
  };
}

  var rim = new THREE.DirectionalLight(0xc0d4ff, 0.7); rim.position.set(-4, 3, -5); scene.add(rim);
  /* environment for reflections: a small room with a warm sky, a cool floor and two bright panels, pre-filtered */
  var env = new THREE.Scene(); env.background = new THREE.Color(0xbfc8d8);
  function panel(x, y, z, w, h, c, ry){ var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.y = ry || 0; env.add(m); }
  panel(0, 8, 0, 40, 40, 0xf4ead8, 0); env.children[env.children.length - 1].rotation.x = Math.PI / 2;      /* ceiling, warm */
  panel(0, -2, 0, 40, 40, 0x8a8478, 0); env.children[env.children.length - 1].rotation.x = Math.PI / 2;     /* floor, dim */
  panel(6, 4, 5, 4, 3, 0xfff6e0, -0.9); panel(-7, 3, -4, 3, 5, 0xdfe8ff, 0.7); panel(0, 2, -12, 24, 8, 0x9aa4b4, 0);
  var pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(env, 0.04).texture; pmrem.dispose();

  /* ground: a scrolling grid so the walk reads as travel */
  var cv = document.createElement('canvas'); cv.width = cv.height = 256; var cx = cv.getContext('2d');
  cx.fillStyle = '#d8d2c6'; cx.fillRect(0, 0, 256, 256); cx.strokeStyle = '#c4bdb0'; cx.lineWidth = 2;
  cx.strokeRect(1, 1, 254, 254); cx.beginPath(); cx.moveTo(128, 0); cx.lineTo(128, 256); cx.moveTo(0, 128); cx.lineTo(256, 128); cx.stroke();
  var gtex = new THREE.CanvasTexture(cv); gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(40, 40); gtex.encoding = THREE.sRGBEncoding;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: gtex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  /* the character: picked by the URL hash (#puffer), default the first registered */
  var key = (location.hash || '').replace('#', ''), def = CHARACTERS.find(function(c){ return c.key === key; }) || CHARACTERS[0];
  CUR_DEF = def;
  defineBones(def.proportions);
  if(def.extraBones) def.extraBones(P);
  var bones = buildSkeleton();
  bones.forEach(function(b){ b.userData.rest = b.position.clone(); });
  def.build();
  var geo = mergePieces(bones, false), geoMetal = mergePieces(bones, true);
  var mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.0, skinning: true });   /* r128: skinning must be opted into per material */
  var matMetal = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.85, skinning: true });
  var mesh = new THREE.SkinnedMesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  var rig = new THREE.Group(); rig.add(mesh); mesh.add(bones[0]);
  var skeleton = new THREE.Skeleton(bones); mesh.bind(skeleton);
  var meshMetal = null;
  if(geoMetal.attributes.position.count){ meshMetal = new THREE.SkinnedMesh(geoMetal, matMetal); meshMetal.castShadow = true; meshMetal.frustumCulled = false; rig.add(meshMetal); meshMetal.bind(skeleton, mesh.bindMatrix); }
  scene.add(rig);
  mountProps();
  document.getElementById('cap').textContent = def.name + ': procedural skinned rig, Mixamo-named bones. Drag to orbit, wheel to zoom.';
  var skel = new THREE.SkeletonHelper(mesh); skel.visible = false; scene.add(skel);

  /* clips through the mixer: this is the path a game would use */
  var clips = { walk: bakeClip('walk', walkPose, 1 / WALK.freq, 32), idle: bakeClip('idle', idlePose, 3.2, 24), attack: bakeClip('attack', attackPose, 1.1, 36),
                mixamo: mixamoClip(MIXAMO_WALK, 'mixamo walk'), run: mixamoClip(MIXAMO_RUN, 'mixamo run'), midle: mixamoClip(MIXAMO_IDLE, 'mixamo idle') };
  if(def.extraClips) Object.assign(clips, def.extraClips());
  var mixer = new THREE.AnimationMixer(mesh), actions = {};
  for(var k in clips){ actions[k] = mixer.clipAction(clips[k]); }
  var current = null;
  function play(name){ var a = actions[name]; if(current === a) return; a.reset().setEffectiveWeight(1).fadeIn(0.3).play(); if(current) current.fadeOut(0.3); current = a; for(var k in actions) if(ui[k]) ui[k].classList.toggle('on', k === name); }
  /* step length from the thigh swing; the ground scrolls at that speed */
  var legLen = 0.96, stepLen = 2 * legLen * Math.sin(WALK.thigh), walkSpeed = stepLen * 2 * WALK.freq;

  var state = { turntable: false, wire: false, dist: 0 };
  var ui = {}, uiBox = document.getElementById('ui');
  function button(key, label, fn){ var b = document.createElement('button'); b.textContent = label; b.onclick = fn; uiBox.appendChild(b); ui[key] = b; return b; }
  var sel = document.createElement('select'); sel.id = 'charsel';
  CHARACTERS.forEach(function(c){ var o = document.createElement('option'); o.value = c.key; o.textContent = c.name; if(c === def) o.selected = true; sel.appendChild(o); });
  sel.onchange = function(){ location.hash = sel.value; location.reload(); }; uiBox.appendChild(sel);
  var LABELS = { walk: 'Walk (procedural)', mixamo: 'Walk (Mixamo)', run: 'Run (Mixamo)', idle: 'Idle', midle: 'Idle (Mixamo)', attack: 'Attack', raise: 'Raise hand' };
  var order = (def.clips || []).concat(['attack']).filter(function(k, i, arr){ return clips[k] && arr.indexOf(k) === i; });
  order.forEach(function(k){ button(k, LABELS[k] || k, function(){ play(k); }); });
  button('turn', 'Turntable', function(){ state.turntable = !state.turntable; ui.turn.classList.toggle('on', state.turntable); });
  button('bones', 'Bones', function(){ skel.visible = !skel.visible; ui.bones.classList.toggle('on', skel.visible); });
  button('wire', 'Wireframe', function(){ state.wire = !state.wire; mat.wireframe = state.wire; ui.wire.classList.toggle('on', state.wire); });
  button('front', 'Front', function(){ orbit.yaw = 0; orbit.pitch = 0.1; placeCamera(); });
  button('side', 'Side', function(){ orbit.yaw = Math.PI / 2; orbit.pitch = 0.08; placeCamera(); });
  button('face', 'Face', function(){ orbit.yaw = 0.35; orbit.pitch = 0.05; orbit.dist = 1.6; orbit.target.set(0, 1.95, 0); placeCamera(); });
  button('reset', 'Reset view', function(){ orbit.yaw = 0.45; orbit.pitch = 0.12; orbit.dist = 5.6; orbit.target.set(0, 1.08, 0); placeCamera(); });

  var drag = null;
  renderer.domElement.addEventListener('pointerdown', function(e){ drag = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointerup', function(){ drag = null; });
  addEventListener('pointermove', function(e){ if(!drag) return; orbit.yaw -= (e.clientX - drag.x) * 0.008; orbit.pitch = clamp(orbit.pitch + (e.clientY - drag.y) * 0.006, -0.2, 1.2); drag = { x: e.clientX, y: e.clientY }; placeCamera(); });
  addEventListener('wheel', function(e){ orbit.dist = clamp(orbit.dist * (1 + e.deltaY * 0.001), 0.8, 14); placeCamera(); }, { passive: true });
  addEventListener('resize', function(){ W = innerWidth; H = innerHeight; camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H); });

  var hud = document.getElementById('hud'), clock = new THREE.Clock(), frames = 0, fpsT = 0, fps = 0;
  function tick(){
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.1);
    if(!CHAR.frozen){
      mixer.update(dt);
      if(current === actions.walk || current === actions.mixamo || current === actions.run){ state.dist += walkSpeed * (current === actions.run ? 2.2 : 1) * dt; gtex.offset.y = (state.dist / 1.0) % 1; }
      if(state.turntable) rig.rotation.y += dt * 0.5;
    }
    renderer.render(scene, camera);
    frames++; fpsT += dt; if(fpsT > 0.5){ fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'tris ' + Math.round(geo.userData.tris + geoMetal.userData.tris) + ' body + ' + axeTris + ' props\nbones ' + bones.length + '  draw calls ' + renderer.info.render.calls + '\n' + fps + ' fps  clip ' + (current ? current.getClip().name + ' ' + current.getClip().duration.toFixed(2) + 's' : '-');
  }
  var axeTris = 0; rig.traverse(function(o){ if(o.isMesh && !o.isSkinnedMesh){ var a = o.geometry.attributes.position; axeTris += (o.geometry.index ? o.geometry.index.count : a.count) / 3; } }); axeTris = Math.round(axeTris);
  play(def.defaultClip || order[0]);
  tick();

  /* deterministic hooks for screenshots */
  CHAR.mesh = mesh; CHAR.bones = BONES; CHAR.clips = clips; CHAR.mixer = mixer; CHAR.orbit = orbit; CHAR.rig = rig; CHAR.renderer = renderer; CHAR.scene = scene; CHAR.camera = camera;
  CHAR.play = play;
  CHAR.setPhase = function(name, u){
    for(var k in actions) actions[k].stop();
    var a = actions[name]; a.reset().setEffectiveWeight(1).play(); a.time = u * clips[name].duration; current = a;
    mixer.update(0); CHAR.frozen = true; renderer.render(scene, camera); };
  CHAR.view = function(yaw, pitch, dist, ty){ orbit.yaw = yaw; orbit.pitch = pitch; orbit.dist = dist; orbit.target.set(0, ty == null ? 1.08 : ty, 0); placeCamera(); renderer.render(scene, camera); };
  CHAR.setRigYaw = function(y){ rig.rotation.y = y; };
  window._ready = true;
}

window._krGo();
</script>
