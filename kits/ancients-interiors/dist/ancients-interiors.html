/* error panel: verify.py fails the run when this has any text */
(function(){
  const el=document.getElementById('errs');
  window.reportErr=function(m){el.style.display='block';el.textContent+=String(m).slice(0,600)+'\n';};
  window.onerror=function(m,s,l,c,e){reportErr((e&&e.stack)||(m+' @'+l+':'+c));};
  window.addEventListener('unhandledrejection',function(e){reportErr('promise: '+(e.reason&&e.reason.stack||e.reason));});
  const ce=console.error.bind(console);
  console.error=function(){ce.apply(null,arguments);reportErr([].map.call(arguments,function(a){return a&&a.stack?a.stack:String(a);}).join(' '));};
})();
</script>

/* ---------- kits/interiors/src/10-core.js ---------- */
/* ======================== Interiors core: namespace, rng, geometry ========================

   page, in a worker or in node (build.py also writes them alone as dist/interiors-core.js).
   Everything hangs off one namespace, KratorInteriors; the only other globals are the two
   names kits/interiors/SPEC.md asks for, ROOM() and furnishRoom() (bound in 49-exports.js).

   Coordinates are the polygon tool's: world x and z in metres, y up. A piece's frame is the
   catalog's (kits/catalog/README.md "Frame"): origin = footprint centre on the floor, +z the
   front, and rotation ry maps local (lx, lz) to world (x + lx cos ry + lz sin ry,

var KratorInteriors = (typeof KratorInteriors !== 'undefined' && KratorInteriors) || {};

  'use strict';
  IX.version = 1;

  /* ---------- seeded randomness (same LCG as the catalog's frame and Yuni's intRng) */
  IX.hash = function (s) {                      /* FNV-1a over a string -> uint32 */

    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

  G.area = function (poly) {                    /* signed: > 0 when counter-clockwise in (x, z) */
    let a = 0;
    for (let i = 0, n = poly.length; i < n; i++) { const p = poly[i], q = poly[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }

    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > z) !== (b[1] > z) && x < (b[0] - a[0]) * (z - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }

  G.segDist = function (x, z, a, b) {           /* distance from (x,z) to segment a-b */
    const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz;
    let t = L2 ? ((x - a[0]) * dx + (z - a[1]) * dz) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - a[0] - dx * t, z - a[1] - dz * t);

  G.edgeDist = function (poly, x, z) {
    let d = Infinity;

    return d;

  function cross(ax, az, bx, bz) { return ax * bz - az * bx; }
  G.segsCross = function (p, q, r, s) {         /* proper crossing of p-q and r-s (touching does not count) */
    const d1 = cross(q[0] - p[0], q[1] - p[1], r[0] - p[0], r[1] - p[1]);
    const d2 = cross(q[0] - p[0], q[1] - p[1], s[0] - p[0], s[1] - p[1]);
    const d3 = cross(s[0] - r[0], s[1] - r[1], p[0] - r[0], p[1] - r[1]);
    const d4 = cross(s[0] - r[0], s[1] - r[1], q[0] - r[0], q[1] - r[1]);
    const e = 1e-9;
    return ((d1 > e && d2 < -e) || (d1 < -e && d2 > e)) && ((d3 > e && d4 < -e) || (d3 < -e && d4 > e));
  };

  G.offset = function (poly, d) {
    const n = poly.length, s = G.area(poly) > 0 ? 1 : -1, out = [];
    for (let i = 0; i < n; i++) {
      const p0 = poly[(i + n - 1) % n], p1 = poly[i], p2 = poly[(i + 1) % n];
      const e1 = norm(p1[0] - p0[0], p1[1] - p0[1]), e2 = norm(p2[0] - p1[0], p2[1] - p1[1]);
      const o1 = [e1[1] * s, -e1[0] * s], o2 = [e2[1] * s, -e2[0] * s];    /* outward normals */
      const bx = o1[0] + o2[0], bz = o1[1] + o2[1], bl = Math.hypot(bx, bz) || 1;
      const k = d / Math.max(0.2, (bx * o1[0] + bz * o1[1]) / bl);

  G.convexAt = function (poly, i) {
    const n = poly.length, s = G.area(poly) > 0 ? 1 : -1, a = poly[(i + n - 1) % n], b = poly[i], c = poly[(i + 1) % n];
    return s * cross(b[0] - a[0], b[1] - a[1], c[0] - b[0], c[1] - b[1]) > 0;

  G.rect = function (x, z, ry, w, d) { return { x: x, z: z, ry: ry, hw: w / 2, hd: d / 2 }; };
  G.axes = function (r) { const c = Math.cos(r.ry), s = Math.sin(r.ry); return [[c, -s], [s, c]]; };  /* local x, local z in world */
  G.corners = function (r) {
    const A = G.axes(r), out = [];
    for (const sg of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      out.push([r.x + A[0][0] * r.hw * sg[0] + A[1][0] * r.hd * sg[1], r.z + A[0][1] * r.hw * sg[0] + A[1][1] * r.hd * sg[1]]);
    }
    return out;
  };
  G.grow = function (r, m) { return { x: r.x, z: r.z, ry: r.ry, hw: Math.max(0, r.hw + m), hd: Math.max(0, r.hd + m) }; };
  /* a rectangle given in a piece's LOCAL frame (lx0..lx1, lz0..lz1), returned in world terms */
  G.localRect = function (px, pz, ry, lx0, lx1, lz0, lz1) {
    const cx = (lx0 + lx1) / 2, cz = (lz0 + lz1) / 2, c = Math.cos(ry), s = Math.sin(ry);
    return { x: px + cx * c + cz * s, z: pz - cx * s + cz * c, ry: ry, hw: (lx1 - lx0) / 2, hd: (lz1 - lz0) / 2 };
  };
  G.containsPt = function (r, x, z, m) {        /* point inside the rectangle grown by m */
    const A = G.axes(r), dx = x - r.x, dz = z - r.z;
    return Math.abs(dx * A[0][0] + dz * A[0][1]) <= r.hw + (m || 0) && Math.abs(dx * A[1][0] + dz * A[1][1]) <= r.hd + (m || 0);
  };
  /* separating-axis overlap depth: > tol means the two rectangles truly overlap */
  G.overlap = function (a, b, tol) {
    const axes = G.axes(a).concat(G.axes(b));
    let minPen = Infinity;
    for (const ax of axes) {
      const pa = proj(a, ax), pb = proj(b, ax);
      const pen = Math.min(pa[1], pb[1]) - Math.max(pa[0], pb[0]);
      if (pen <= (tol || 0)) return false;
      if (pen < minPen) minPen = pen;
    }
    return minPen;
  };
  function proj(r, ax) {
    const A = G.axes(r), c = r.x * ax[0] + r.z * ax[1];
    const e = r.hw * Math.abs(A[0][0] * ax[0] + A[0][1] * ax[1]) + r.hd * Math.abs(A[1][0] * ax[0] + A[1][1] * ax[1]);
    return [c - e, c + e];
  }
  /* ---------- convex polygons (door swing quarter-discs, fixtures): SAT overlap depth > tol */
  G.rectPoly = function (r) { return G.corners(r); };
  G.convexOverlap = function (A, B, tol) {
    let minPen = Infinity;
    for (const P of [A, B]) for (let i = 0, n = P.length; i < n; i++) {
      const p = P[i], q = P[(i + 1) % n], ex = q[0] - p[0], ez = q[1] - p[1], l = Math.hypot(ex, ez);
      if (l < 1e-9) continue;
      const ax = -ez / l, az = ex / l;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const v of A) { const d = v[0] * ax + v[1] * az; if (d < a0) a0 = d; if (d > a1) a1 = d; }
      for (const v of B) { const d = v[0] * ax + v[1] * az; if (d < b0) b0 = d; if (d > b1) b1 = d; }
      const pen = Math.min(a1, b1) - Math.max(a0, b0);
      if (pen <= (tol || 0)) return false;
      if (pen < minPen) minPen = pen;
    }
    return minPen;
  };
  /* a quarter disc (a door leaf's sweep): hinge h, radius r, from unit direction c (closed leaf)
     to unit direction o (open leaf), as a convex polygon that CONTAINS the true arc (n segments,
     vertices pushed out to r / cos(step / 2)) */
  G.quarterDisc = function (h, r, c, o, n) {
    n = n || 6;
    const step = Math.PI / 2 / n, R = r / Math.cos(step / 2), out = [[h[0], h[1]]];
    out.push([h[0] + c[0] * r, h[1] + c[1] * r]);
    for (let i = 0; i < n; i++) {
      const a = (i + 0.5) * step, ca = Math.cos(a), sa = Math.sin(a);
      out.push([h[0] + (c[0] * ca + o[0] * sa) * R, h[1] + (c[1] * ca + o[1] * sa) * R]);
    }
    out.push([h[0] + o[0] * r, h[1] + o[1] * r]);
    return out;
  };
  G.polyInside = function (poly, pts, m) {      /* every point inside poly, m metres clear of its edges */
    for (const c of pts) {
      if (!G.inside(poly, c[0], c[1])) return false;
      if (m && G.edgeDist(poly, c[0], c[1]) < m - 1e-9) return false;
    }
    return true;
  };

  /* a rectangle lies inside a polygon: its corners are inside (by margin m from every edge)
     and no polygon edge crosses it (an L-shaped room's reflex corner cannot poke into it) */
  G.rectInPoly = function (poly, r, m) {
    const cs = G.corners(r);
    for (const c of cs) {

      if (m && G.edgeDist(poly, c[0], c[1]) < m - 1e-9) return false;
    }
    for (let i = 0, n = poly.length; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      if (G.containsPt(r, p[0], p[1], -1e-6)) return false;    /* a reflex vertex strictly inside */
      for (let k = 0; k < 4; k++) if (G.segsCross(p, q, cs[k], cs[(k + 1) % 4])) return false;
    }
    return true;
  };

/* ---------- kits/interiors/src/20-rooms.js ---------- */
/* ======================== ROOM(): room registration ========================
   kits/interiors/SPEC.md "What a building exposes":

     ROOM({ building, kind, poly: [[x,z],...], y, h,
            doors:   [{ at:[x,z], w, to: 'street' | '<room id>', swing?, hinge? }],
            windows: [{ at:[x,z], w, sill, h? }],
            culture, wealth, id?, seed?, level?, fixtures? })

   poly is the floor outline at the INNER face of the walls, either winding. A door or window
   is snapped onto the nearest wall of the polygon; `at` may sit anywhere within 0.6 m of it (a door's
   `snap` widens that: the planner gives a street door on the OUTER face of a thick wall snap = wall + 0.6).
   Door extras this kit adds (all optional): swing 'in' (default) | 'out' | 'none' (an open
   doorway or curtain), hinge 'left' | 'right' (seen from inside, looking out; default 'left'),
   h (opening height, 2.1), leaf: false (another room draws this door's leaf: a shared door).

   fixtures: [{ id?, kind, x, z, ry, w, d, h?, clearance: { front, ... }, reach? }] are things the
   building already put in the room (a stair's flight, the well a stair rises through): the placer
   keeps furniture off them and out of their clearance, and keeps their front reachable unless
   reach: false. The planner (46-planner.js) writes them; level is the storey (0 = ground).

   ROOM() returns the normalised room. What the placer reads from it:
     id, building, kind, culture, wealth, y, h, seed
     poly            as given (copied), area, centroid, bbox
     walls[]         { i, a, b, len, t:[tx,tz] (a->b), n:[nx,nz] (INWARD unit normal), ry (a piece
                       backed onto this wall faces the room at this heading) }
     doors[]         { at, w, to, swing, hinge, wall, u (metres along the wall from a), n, ry }
     windows[]       { at, w, sill, h, wall, u, n }
     fixtures[]      { id, kind, x, z, ry, w, d, h, clearance, reach, stair?, end?, bed (0, or the sleepers a carved bed holds) }
   Registered rooms live in KratorInteriors.rooms / roomById; IX.normRoom() normalises without
   registering (the placer accepts either).
   ====================================================================== */
(function (IX) {
  'use strict';
  const G = IX.geom;

    'study', 'barracks', 'court', 'yard', 'rooftop', 'antechamber'];

  function snap(room, at, what, tol) {
    let best = null, bd = Infinity;
    for (const W of room.walls) {
      const d = G.segDist(at[0], at[1], W.a, W.b);
      if (d < bd) { bd = d; best = W; }
    }
    if (!best || bd > (tol || 0.6)) throw new Error('ROOM ' + room.id + ': ' + what + ' at [' + at + '] is ' + bd.toFixed(2) + ' m from every wall');
    const u = Math.max(0, Math.min(best.len, (at[0] - best.a[0]) * best.t[0] + (at[1] - best.a[1]) * best.t[1]));
    return { W: best, u: u, at: [best.a[0] + best.t[0] * u, best.a[1] + best.t[1] * u] };
  }

  IX.normRoom = function (o) {
    if (!o || !Array.isArray(o.poly) || o.poly.length < 3) throw new Error('ROOM needs poly: [[x,z], ...] with 3+ points');
    const poly = o.poly.map(function (p) { return [+p[0], +p[1]]; });
    const sa = G.area(poly);
    if (Math.abs(sa) < 0.5) throw new Error('ROOM ' + (o.id || o.building) + ': polygon area ' + sa.toFixed(2) + ' m2 is too small');
    const sign = sa > 0 ? 1 : -1;
    const R = {
      id: o.id || ((o.building || 'room') + '.room.' + IX.rooms.length),
      building: o.building || null, kind: o.kind || 'hall', culture: o.culture || null,
      wealth: o.wealth == null ? 0.5 : Math.max(0, Math.min(1, +o.wealth)),
      y: +(o.y || 0), h: +(o.h || 3.0),
      poly: poly, area: Math.abs(sa), centroid: G.centroid(poly), bbox: G.bbox(poly),
      walls: [], doors: [], windows: [], fixtures: [], level: o.level == null ? 0 : +o.level, src: o
    };
    R.seed = o.seed != null ? (o.seed >>> 0) : IX.hash(R.id);
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);

  /* ---------------------------------------------------------------- DATA CENTRE, the Vault (72-datacenter.js)

     |x| < 121.8, |z| < 65.4. INTACT IT IS A SOLID boxD (W .94 x H x Dp .94 at (0, 39, 0)): hollow. The ruin's bite
     (the south-east corner, x > 52, z > -18) shows four server floors 15.5 m apart (slabs at 8 + 15.5 j, .8 thick,
     shrinking upward by lim 1, .75, .57, .39) with rack rows along x every 8.5 m in z; the rest of the ruin is the dark
     mass in two boxes (hollow). So: four server levels, y 8.8 + 15.5 j, clear 14.7, each an open floor of server bays

     the west block, the north-east block, and the bite. On level 0 the west end is an office block: three storeys of
     5.17 m (offices, stores, a stair core at each end). The entrance slit (boxD 9 x 18 x 16 at (0, 17, 63.8)) keeps
     clear of bays. The bite is its own building: floors true intact, false in a ruin (the builder's slabs); where a

    buildings: function (d) {
      const XE = 121.8, ZE = 65.4, XI = 52, ZI = -18, FY = 15.5, Y0 = 8.8, H = 14.7;
      const slit = (x, z, y) => y < 26 && Math.abs(x) < 14.5 && z > 50;   /* a bay's centre within its half-size of the slit */
      const kinds = (i, n, row) => ((i + row) % 3 === 0 ? 'store' : 'workshop');
      const grid = (id, lv, x0, x1, z0, z1) => AI.gridPlate({ id, level: lv, y: Y0 + FY * lv, h: H, x0, x1, z0, z1, bay: [18, 9], aisle: 3.5, along: 'x',

     RD .6 = 42 from the centre (inside the dome) with a vault of half-width w = 38 (1 - .55 t) and height
     h = 30 (1 - .6 t) + 6, profile y = h (1 - q^2)^.55; the ruin lines each with guts at .985 (about the origin) and
     3 + .9 (y - 3) up. The arms' inner ends cut the dome's middle into a pentagon of inradius 42 (41.4 in the ruin):
     that is the concourse, an open floor of bays (seating halls, shops, waiting rooms) on aisles. Inside the drum the
     arm vaults cross the dome skin: no rooms there. Each arm outside the drum (from 82 m out to 214, short of the mouth's
     door apron) is a hangar: a strip of stores along each vault side (h 4, kept under the vault) and open maintenance
     bays down the middle, narrowing with the arm. In the ruin arm 2 has pancaked beyond its break (v > .5): those
     rooms fall in. The control needle (from y 38) has no room. */
  AI.KIT.port = { name: 'Starport (the Starfish)', frag: '44-starport.js', culture: 'ancient', wealth: 0.6, types: ['civic', 'industrial'],
    buildings: function (d) {
      const RD = 70, HD = 40, NA = 5, L = 210, U0 = RD * 0.6, Y = 0.3;
      const TH = i => i / NA * TAU + 0.3;
      /* the half-width of arm floor under which a room of top yTop fits, at u metres from the centre, intact and ruined */
      const sect = t => ({ w: 38 * (1 - 0.55 * t), h: HD * 0.75 * (1 - 0.6 * t) + 6 });
      const half = (t, y) => { if (t < 0 || t > 1) return 0; const s = sect(t), k = y / s.h; return k >= 1 ? 0 : s.w * Math.sqrt(1 - Math.pow(k, 1 / 0.55)); };
      const avail = (u, yTop) => Math.min(half((u - U0) / L, yTop), 0.985 * half((u / 0.985 - U0) / L, (yTop - 3) / 0.9 + 3));

      /* the concourse: the pentagon left by the arms' inner ends, inradius 40.5 */

      const BW = 10, BD = 8;

        skip: (x, z) => !(pent(x - BW / 2, z - BD / 2) && pent(x + BW / 2, z - BD / 2) && pent(x + BW / 2, z + BD / 2) && pent(x - BW / 2, z + BD / 2)) });

      const UA = U0 + 40, UB = U0 + 172, SD = 6, SH = 4, BH = 9;

          kinds: (k, n, row) => (k % 4 === 3 ? 'store' : 'workshop'),
          skip: (u, v) => { const ua = u - 6, ub = u + 6, o = Math.abs(v) + 4.5;
            return o > availOn(ua, ub, Y + BH + 0.2) - 0.5 || o > Math.min(edge(ua), edge(ub)) - SD - 0.6; } }), f);
        arms.push({ id: 'port-arm' + i, name: 'hangar arm ' + (i + 1), storeys: strips.concat([bays]), floors: true, hollow: [],
          inside: (x, z) => { const u = x * cx + z * cz, v = -x * cz + z * cx; return u > U0 - 1 && u < U0 + L && Math.abs(v) < sect((u - U0) / L).w; },
          collapse: d > 0 && i === 2 ? (x, z) => x * cx + z * cz > U0 + 0.5 * L - 5 : null });

/* ---------- src/40-ai-audit.js ---------- */
/* ======================== Ancients interiors: the audit ========================
   AI.audit(res, cat) -> { ok, fails: [text], n }: a recipe's result checked again from scratch, the way verify.py
   reads it. Every key is in the catalog; every piece stands inside the room; no two solid pieces share floor at an
   overlapping height (a piece on another's surface, and flat rugs, excepted); nothing solid below 2 m stands in the
   door's way or on reserved floor; the recipe's minimum counts are met; no role of the dress is missing.
   ====================================================================== */
(function (AI) {
  'use strict';
  const G = AI._geo, TOL = 0.03;
  AI.audit = function (res, cat) {
    const fails = [], known = {};
    for (const e of cat.list()) known[e.key] = true;
    const P = res.placements, quads = [];
    for (const p of P) {
      if (!known[p.key]) { fails.push(p.role + ': no catalog key ' + p.key); quads.push(null); continue; }
      const dm = cat.dims(p.key, p.v), q = G.corners(p.x, p.z, dm.w, dm.d, p.ry);
      quads.push(q);
      for (const c of q) if (Math.abs(c[0]) > res.w / 2 + TOL || Math.abs(c[1]) > res.d / 2 + TOL) { fails.push(p.role + ' (' + p.key + ') outside the room'); break; }
    }
    for (let i = 0; i < P.length; i++) {
      if (!quads[i] || P[i].flat) continue;
      if (res.door && P[i].y < 2.0) {
        const dr = res.door, dq = G.rectQuad(dr.x - dr.w / 2 - 0.2, dr.x + dr.w / 2 + 0.2, res.d / 2 - 1.4, res.d / 2 + 1);
        if (G.overlap(quads[i], dq, 0.01)) fails.push(P[i].role + ' in the doorway');
      }
      for (const r of res.reserved) if (G.overlap(quads[i], G.rectQuad(r.x0, r.x1, r.z0, r.z1), 0.01)) fails.push(P[i].role + ' on the ' + r.what);
      for (let j = i + 1; j < P.length; j++) {
        if (!quads[j] || P[j].flat || P[i].on === j || P[j].on === i) continue;
        if (G.yOverlap(P[i], P[j]) && G.overlap(quads[i], quads[j], 0.01)) fails.push(P[i].role + ' #' + i + ' overlaps ' + P[j].role + ' #' + j);
      }
    }
    const R = AI.RECIPES[Object.keys(AI.RECIPES).find(k => AI.RECIPES[k].name === res.name)];
    if (R && R.min) for (const role in R.min) if ((res.counts[role] || 0) < R.min[role]) fails.push(role + ': ' + (res.counts[role] || 0) + ' < ' + R.min[role]);
    for (const role of res.missing) fails.push('dress role ' + role + ' has no catalog piece');
    return { ok: !fails.length, fails, n: P.length };
  };
})(KratorAncientsInteriors);
/* ---------- src/70-ai-demo.js ---------- */
/* ======================== Demo sheet: the Ancients' ship interiors ========================
   The demo, not the kit. Rows on one sheet, the camera at +z:
     1. the halls as the Ancients fitted them (dress 'ancient'), each recipe at its default size
     2. the same halls as the pirates hold them (dress 'occupied')
     3. the ship's rooms (AI.SHIP_ROOMS), trapezoids off a corridor, furnished by kits/interiors' placer with the
        ship's programmes (AI.install)
     4. cabins: a bedroom, a bunkroom and a store at each class width
   Halls stand in kits/interiors shells (IX.view.shell) with the cut-away; the plaza and the quay are open decks.
   The engine room's reserved floor holds a stand-in machinery block (a host draws its own engines there).
   Exposes window._ancientsInteriors (halls, rooms, gotoHall, gotoRoom) and sets window._ready.
   ====================================================================== */
(function () {
  'use strict';
  const IX = KratorInteriors, AI = KratorAncientsInteriors;
  AI.install(IX);
  const catalog = IX.catalogAdapter({ lights: 'strip' });
  const FLOOR_Y = 0.2, GAP = 7, ROW_GAP = 12;
  const halls = [], rooms = [], plans = [], labels = [];

  /* ---------- a label on the ground */
  function label(text, sub, x, z, w) {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
    const g = cv.getContext('2d');
    g.fillStyle = 'rgba(40,36,26,0.86)'; g.fillRect(0, 0, 512, 128);
    g.fillStyle = '#f3ecd8'; g.font = 'bold 44px Georgia'; g.fillText(text, 18, 56);
    g.fillStyle = '#d8c89a'; g.font = '30px Georgia'; g.fillText(sub || '', 18, 102);
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.05, z); scene.add(m); labels.push(m);
  }
  function slab(x, z, w, d, col) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, FLOOR_Y, d), new THREE.MeshLambertMaterial({ color: col }));
    m.position.set(x, FLOOR_Y / 2, z); scene.add(m); return m;
  }
  function rect(cx, cz, w, d) { return [[cx - w / 2, cz - d / 2], [cx + w / 2, cz - d / 2], [cx + w / 2, cz + d / 2], [cx - w / 2, cz + d / 2]]; }

  /* ---------- rows 1-2: the halls */
  const NAMES = Object.keys(AI.RECIPES);
  let z = 0;
  for (const dress of ['ancient', 'occupied']) {
    const deep = Math.max.apply(null, NAMES.map(n => AI.RECIPES[n].d));
    let x = 0;
    label(dress === 'ancient' ? 'Halls as built' : 'Halls as held', dress === 'ancient' ? "the Ancients' fit" : "the pirates' fit", -16, z, 24);
    NAMES.forEach(function (name, i) {
      const R = AI.RECIPES[name], res = AI.recipe(name, { dress, seed: 7 + i }, catalog);
      const cx = x + res.w / 2, cz = z - (deep - res.d) / 2;
      if (res.outdoor) slab(cx, cz, res.w, res.d, 0xcfc9bb);
      else {
        const room = ROOM({ id: 'hall.' + dress + '.' + name, kind: 'hall', culture: 'ancient', wealth: 0.5, y: FLOOR_Y, h: res.h, poly: rect(cx, cz, res.w, res.d),
          doors: [{ at: [cx + res.door.x, cz + res.d / 2], w: res.door.w }], windows: name === 'bridge' ? [{ at: [cx, cz - res.d / 2], w: res.w - 2, sill: 0.9, h: 2.4 }] : [] });
        const s = IX.view.shell(room); scene.add(s); IX.view.cutaway.add(s);
      }
      for (const r of res.reserved) {
        const m = slab(cx + (r.x0 + r.x1) / 2, cz + (r.z0 + r.z1) / 2, r.x1 - r.x0 - 0.4, r.z1 - r.z0 - 0.4, 0x4a5056);
        m.scale.y = 14; m.position.y = FLOOR_Y * 7;   /* the stand-in engines: a 2.8 m block */
      }
      const objs = [];
      res.placements.forEach(function (p, k) {
        const g = catalog.build({ key: p.key, x: cx + p.x, z: cz + p.z, ry: p.ry, variant: p.v, seed: 11 + k, y: FLOOR_Y + p.y, id: name + '.' + k }, { id: name, wealth: 0.5 });
        if (g) objs.push(g);
      });
      const audit = AI.audit(res, catalog);
      halls.push({ name, dress, title: R.name, x: cx, z: cz, res, audit, objects: objs.length });
      label(R.name, res.placements.length + ' pieces' + (audit.ok ? '' : ' · AUDIT FAILS'), cx, cz + res.d / 2 + 2.6, Math.min(14, res.w));
      x += res.w + GAP;
    });
    z -= deep + ROW_GAP;
  }

  /* ---------- row 3: the ship's rooms, furnished by the placer */
  {
    let x = 0;
    const depth = 6.4;
    label("Ship's rooms", 'the placer, with the ship programmes', -16, z, 24);
    AI.SHIP_ROOMS.forEach(function (S) {
      const spec = AI.shipRoom(S, { depth, y: FLOOR_Y }), wb = spec.poly[1][0] - spec.poly[0][0], cx = x + wb / 2;
      spec.id = 'ship.' + S.id;
      spec.poly = spec.poly.map(p => [p[0] + cx, p[1] + z]);
      spec.doors = spec.doors.map(dr => Object.assign({}, dr, { at: [dr.at[0] + cx, dr.at[1] + z] }));
      spec.windows = spec.windows.map(wn => Object.assign({}, wn, { at: [wn.at[0] + cx, wn.at[1] + z] }));
      const R = ROOM(spec), s = IX.view.shell(R); scene.add(s); IX.view.cutaway.add(s);
      const P = furnishRoom(R, catalog, { seed: 5 }); IX.buildRoom(P, catalog, R);
      rooms.push({ id: S.id, name: S.name, kind: S.kind, room: R, plan: P, audit: IX.audit(R, P, catalog) });
      label(S.name, P.placements.length + ' pieces', cx, z + depth / 2 + 2.4, Math.min(12, wb));
      x += wb + 3;
    });
    z -= 6.4 + ROW_GAP;
  }

  /* ---------- row 4: cabins */
  {
    let x = 0;
    label('Cabins', 'by kind and class width', -16, z, 24);
    for (const kind of ['bedroom', 'bunkroom', 'store']) for (const w of AI.CABIN_CLASSES) {
      const spec = AI.cabin(kind, w, 6.0, { y: FLOOR_Y, id: 'cabin.' + kind + '.' + w }), cx = x + w / 2;
      spec.poly = spec.poly.map(p => [p[0] + cx, p[1] + z]);
      spec.doors = spec.doors.map(dr => Object.assign({}, dr, { at: [dr.at[0] + cx, dr.at[1] + z] }));
      spec.windows = spec.windows.map(wn => Object.assign({}, wn, { at: [wn.at[0] + cx, wn.at[1] + z] }));
      const R = ROOM(spec), s = IX.view.shell(R); scene.add(s); IX.view.cutaway.add(s);
      const P = furnishRoom(R, catalog, { seed: 3 }); IX.buildRoom(P, catalog, R);
      rooms.push({ id: spec.id, name: kind + ' ' + w + ' m', kind, room: R, plan: P, audit: IX.audit(R, P, catalog) });
      label(kind, w + ' m · ' + P.placements.length + ' pieces', cx, z + 5.4, 6);
      x += w + 2;
    }
  }

  /* ---------- the bar, the camera, the frame hook */
  const $ = id => document.getElementById(id);
  const sel = $('hallSel');
  halls.forEach((H, i) => { const o = document.createElement('option'); o.value = 'h' + i; o.textContent = H.title + ' · ' + H.dress; sel.appendChild(o); });
  rooms.forEach((R, i) => { const o = document.createElement('option'); o.value = 'r' + i; o.textContent = R.name; sel.appendChild(o); });
  function look(x, zz, span) { if (ctl.walk) window._setWalk(false); ctl.target.set(x, 1, zz); ctl.dist = Math.max(10, span * 1.25); ctl.az = 0.3; ctl.el = 0.85; updateCamera(); }
  function gotoHall(i) { const H = halls[i]; if (H) { look(H.x, H.z, Math.max(H.res.w, H.res.d)); report(H); } }
  function gotoRoom(i) { const R = rooms[i]; if (!R) return; const b = R.room.bbox; look((b[0] + b[2]) / 2, (b[1] + b[3]) / 2, Math.max(b[2] - b[0], b[3] - b[1]) + 4); report(null, R); }
  function overview() { look(150, -40, 260); report(); }
  sel.onchange = function () { const v = sel.value; if (!v) overview(); else if (v[0] === 'h') gotoHall(+v.slice(1)); else gotoRoom(+v.slice(1)); };
  $('cutBtn').onclick = function () { IX.view.cutaway.next(); $('cutBtn').textContent = 'Cut-away: ' + IX.view.cutaway.mode + ' (C)'; };
  addEventListener('keydown', function (e) { if (e.key === 'c' || e.key === 'C') $('cutBtn').onclick(); });
  function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function report(H, R) {
    const bad = halls.filter(h => !h.audit.ok).length + rooms.filter(r => !r.audit.ok).length;
    const n = halls.reduce((a, h) => a + h.res.placements.length, 0) + rooms.reduce((a, r) => a + r.plan.placements.length, 0);
    let s = '<span class="' + (bad ? 'miss' : 'ok') + '">' + halls.length + ' halls, ' + rooms.length + ' rooms, ' + n + ' pieces · ' + (bad ? bad + ' fail the audit' : 'every audit passes') + '</span>';
    if (H) s += '<br><b>' + esc(H.title) + '</b> (' + H.dress + ', ' + H.res.w + ' × ' + H.res.d + ' m): ' + esc(Object.keys(H.res.counts).map(k => k + ' ' + H.res.counts[k]).join(', ')) +
      (H.audit.ok ? '' : '<br><span class="miss">' + esc(H.audit.fails.join('; ')) + '</span>');
    if (R) s += '<br><b>' + esc(R.name) + '</b> (' + R.kind + '): ' + esc(R.plan.placements.map(p => p.key).join(', ')) +
      (R.audit.ok ? '' : '<br><span class="miss">' + esc(R.audit.fails.map(f => f.msg || f).join('; ')) + '</span>');
    $('rep').innerHTML = s;
  }
  (window._frameHooks = window._frameHooks || []).push(function () { IX.view.cutaway.update(camera); });
  $('count').textContent = halls.length + ' halls · ' + rooms.length + ' rooms';
  overview();
  window._ancientsInteriors = { halls, rooms, gotoHall, gotoRoom, overview, AI };
  window._ready = true;
})();
