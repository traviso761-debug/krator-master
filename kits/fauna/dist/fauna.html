/* error panel: verify.py fails the run when this has any text */
(function(){
  const el=document.getElementById('errs');
  window.reportErr=function(m){el.style.display='block';el.textContent+=String(m).slice(0,600)+'\n';};
  window.onerror=function(m,s,l,c,e){reportErr((e&&e.stack)||(m+' @'+l+':'+c));};
  window.addEventListener('unhandledrejection',function(e){reportErr('promise: '+(e.reason&&e.reason.stack||e.reason));});
  const ce=console.error.bind(console);
  console.error=function(){ce.apply(null,arguments);reportErr([].map.call(arguments,function(a){return a&&a.stack?a.stack:String(a);}).join(' '));};
})();

<script>if(!window.THREE)document.write('<script src="../three.min.js"><\/script>');</script>
<script>
/* ---------- krator-asset-engine.js ---------- */
/* ======================================================================
   Krator Asset Engine
   Shared contract + geometry kit for the ASSET (building) / FURN / PLANT
   registries harvested from Voth, Iziz, Mav's Refuge, Girder, Yuni and the
   Ancients kit. Include this file (or the equivalent globals from your own
   build) before krator-master-furniture.js, krator-master-plants.js and/or
   krator-master-buildings-*.js.

   (2026-10: the registries, palettes, frame and geometry kit are in
   krator-furniture-core.js, loaded BEFORE this file; this file is the page:
   scene, camera, renderer, controls, ground, labels and the frame loop.)

   Provides: scene/camera/renderer, orbit + WASD/walk camera control, a
   geometry kit (box/cyl/cone/dome/blob/ball/beam/rod/frustum/pyrRoof, and
   decal: a painted canvas panel for emblems and hangings), a
   procedural F.tree() helper, the three registries with per-variant
   variantDims support, buildAsset/buildFurn/buildPlant (each returning a
   selectable THREE.Group), rebuildInstance() and measureInstance(), the
   per-culture furniture palette FPAL (F.col / F.cols / key-aware F.pick and
   F.shade) and the building type vocabulary BUILDING_TYPES.

   Conventions that matter:
     - box/cyl/cone/dome sit with their BOTTOM at y; blob/ball are CENTRED at y.
     - The build frame's origin is the footprint centre on the ground, +z FRONT.
     - F.frustum's r is a HALF-WIDTH: the block spans 2*r. With sides:4 the flat
       faces are square to the frame, so the front face sits at local z = +r.
       It is square in plan and cannot make a rectangular trough — use boxes.
     - F.pyrRoof covers EXACTLY w by d at the eaves and meets at one point;
       F.hipRoof covers the same w by d but rises to a RIDGE along the longer
       side — use it for any roof that is not square.
     - A vertical-axis F.cyl cannot be tilted; use F.rod/F.beam between two
       points for anything leaning, arching or horizontal.
     - For a block placed at (cos a, sin a) * r, ry = -a points its long axis
       RADIALLY; for a tangential ring segment you want ry = -a - PI/2.
     - measureInstance() measures transformed vertices, not Box3.expandByObject,
       which takes the AABB of an AABB and overstates anything rotated off-axis.
   ====================================================================== */

/* ---------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8dccb);
scene.fog = new THREE.Fog(0xc9cdbb, 700, 2800);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 70, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

scene.add(new THREE.HemisphereLight(0xcfd9f2, 0x3d3a2c, 0.42));
const sun = new THREE.DirectionalLight(0xffeccb, 1.55);
sun.position.set(160, 260, 90);
scene.add(sun);
/* low cool fill from the opposite side so unlit faces read as form, not flat white */
const fill = new THREE.DirectionalLight(0x8ea6cc, 0.28);
fill.position.set(-140, 90, -120);
scene.add(fill);

/* subdivided: one 8 km quad interpolates depth badly in software GL (SwiftShader), and
   hid anything within ~3 cm of the ground (labels, rugs, mats) a few metres off the origin */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8000, 8000, 100, 100),
  new THREE.MeshLambertMaterial({ color: 0x9b9472 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(8000, 400, 0x333333, 0x333333);
grid.material.opacity = 0.05;
grid.material.transparent = true;
scene.add(grid);

/* ------------------------------------------------------- camera control
   Minimal self-contained orbit/pan/zoom + WASD fly/walk, no external dependency.
   Two modes share one anchor (ctl.target) and one heading (az/el):
     orbit  — camera sits ctl.dist away, orbiting the anchor
     walk   — camera sits AT the anchor looking along the heading (first person)
   WASD moves the anchor in both, so it pans the sheet in orbit and walks in walk. */
const ctl = {
  target: new THREE.Vector3(0, 6, 0), dist: 150, az: 0.9, el: 0.55,
  dragging: false, panning: false, lastX: 0, lastY: 0,
  walk: false, eyeHeight: 1.7, speed: 1,
  keys: Object.create(null)
};
function _headingVecs() {
  /* fwd = the way the camera faces, flattened to the ground; right = the camera's right hand
     (fwd turned clockwise seen from above: facing -z, right is +x) */
  const fwd = new THREE.Vector3(-Math.sin(ctl.az), 0, -Math.cos(ctl.az));
  const right = new THREE.Vector3(Math.cos(ctl.az), 0, -Math.sin(ctl.az));
  return { fwd, right };
}
function updateCamera() {
  if (ctl.walk) {
    const el = Math.max(-1.35, Math.min(1.35, ctl.el));
    camera.position.copy(ctl.target);
    const dir = new THREE.Vector3(-Math.cos(el) * Math.sin(ctl.az), -Math.sin(el), -Math.cos(el) * Math.cos(ctl.az));
    camera.lookAt(camera.position.clone().add(dir));
  } else {
    const el = Math.max(0.05, Math.min(1.45, ctl.el));
    const x = ctl.target.x + ctl.dist * Math.cos(el) * Math.sin(ctl.az);
    const y = ctl.target.y + ctl.dist * Math.sin(el);
    const z = ctl.target.z + ctl.dist * Math.cos(el) * Math.cos(ctl.az);
    camera.position.set(x, y, z);
    camera.lookAt(ctl.target);
  }
}
updateCamera();
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 2) ctl.panning = true; else ctl.dragging = true;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
});
window.addEventListener('mouseup', () => { ctl.dragging = false; ctl.panning = false; });
window.addEventListener('mousemove', (e) => {
  const dx = e.clientX - ctl.lastX, dy = e.clientY - ctl.lastY;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
  if (ctl.dragging) {
    ctl.az -= dx * 0.006;
    ctl.el += (ctl.walk ? dy * 0.005 : dy * 0.006);     /* walk: drag down to look down, as drag right looks right */
    updateCamera();
  } else if (ctl.panning) {
    const { fwd, right } = _headingVecs();
    const k = ctl.walk ? 0.05 : ctl.dist * 0.0015;
    ctl.target.addScaledVector(right, -dx * k);          /* right-drag pans: the ground follows the pointer */
    ctl.target.addScaledVector(fwd, -dy * k);
    updateCamera();
  }
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  if (ctl.walk) { ctl.speed = Math.max(0.15, Math.min(8, ctl.speed * (1 - e.deltaY * 0.001))); }
  else { ctl.dist = Math.max(3, Math.min(2000, ctl.dist * (1 + e.deltaY * 0.001))); }
  updateCamera(); e.preventDefault();
}, { passive: false });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --------------------------------------------------------- WASD movement */
const _MOVE_KEYS = { w: 1, a: 1, s: 1, d: 1, q: 1, e: 1, ' ': 1, shift: 1, control: 1 };
function _isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}
window.addEventListener('keydown', (e) => {
  if (_isTyping(e)) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  ctl.keys[k] = true;
  if (_MOVE_KEYS[k]) e.preventDefault();
  if (k === 'f') { window._setWalk(!ctl.walk); }
});
window.addEventListener('keyup', (e) => { ctl.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { ctl.keys = Object.create(null); });

window._setWalk = function (on) {
  if (on === ctl.walk) return;
  const { fwd } = _headingVecs();
  if (on) {
    /* step into the scene: stand where the camera was looking, at eye height */
    ctl.target.copy(camera.position);
    ctl.target.y = ctl.eyeHeight;
    ctl.walk = true;
    ctl.el = Math.max(-0.2, Math.min(0.35, ctl.el * 0.3));
  } else {
    ctl.walk = false;
    ctl.dist = Math.max(30, ctl.dist);
    ctl.target.addScaledVector(fwd, ctl.dist * 0.35);
    ctl.target.y = 6;
    ctl.el = 0.55;
  }
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(ctl.walk);
};

let _lastT = performance.now();
function _moveStep(now) {
  const dt = Math.min((now - _lastT) / 1000, 0.1);
  _lastT = now;
  const k = ctl.keys;
  let mx = 0, mz = 0, my = 0;
  if (k['w']) mz += 1;
  if (k['s']) mz -= 1;
  if (k['d']) mx += 1;
  if (k['a']) mx -= 1;
  if (k['e'] || k[' ']) my += 1;
  if (k['q']) my -= 1;
  if (!mx && !mz && !my) return;
  /* base speed: metres/sec. In orbit it scales with how far out you are, so it
     feels the same whether you're reading a whole row or one doorway. */
  let base = ctl.walk ? 9 * ctl.speed : Math.max(12, ctl.dist * 0.55);
  if (k['shift']) base *= 3.4;
  if (k['control'] || k['alt']) base *= 0.28;
  const step = base * dt;
  const { fwd, right } = _headingVecs();
  if (mz) ctl.target.addScaledVector(fwd, mz * step);
  if (mx) ctl.target.addScaledVector(right, mx * step);
  if (my) ctl.target.y += my * step;
  if (ctl.walk) ctl.target.y = Math.max(0.4, ctl.target.y);
  updateCamera();
}

window._gotoRow = function (z, width) {
  ctl.walk = false;
  ctl.target.set(width ? width / 2 - 20 : 0, 6, z);
  ctl.dist = Math.max(70, (width || 140) * 0.7);
  ctl.az = 0.75; ctl.el = 0.55;
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(false);
};

/* --------------------------------------------------------------- labels */
function groundLabel(text, x, z, big) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = big ? 160 : 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = big ? 'rgba(30,26,18,0.92)' : 'rgba(255,255,255,0.88)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = big ? '#f5efdd' : '#20201a';
  ctx.font = (big ? 'bold 64px' : '40px') + ' Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 512, big ? 100 : 82);
  const tex = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(big ? 34 : 15, big ? 5.3 : 1.9);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, big ? 0.08 : 0.06, z);
  scene.add(m);
  return m;
}
function scaleFigure(x, z) {
  mkCyl(x, 0, z, 0.22, 1.5, 0, 0x3a5a7a, 'cloth');
  mkBall(x, 1.68, z, 0.22, 0xe0b090, 'skin');
}

function animate(now) {
  requestAnimationFrame(animate);
  _moveStep(now || performance.now());
  if (window._inspectorTick) window._inspectorTick();
  if (window._frameHooks) for (const fh of window._frameHooks) fh(now || performance.now());
  renderer.render(scene, camera);
}
animate();
/* ---------- 50-fauna-bundle.js ---------- */
/* kits/fauna bundle (fauna_bundle.py): fauna-core.js, krator-fauna-abyss.js, krator-fauna-bay.js, krator-fauna-crawlers.js, krator-fauna-desert.js, krator-fauna-farm.js, krator-fauna-flyers.js, krator-fauna-hyperjungle.js, krator-fauna-livestock.js, krator-fauna-mounts.js, krator-fauna-voth.js, krator-fauna-runtime.js. GENERATED; edit the kit files. */
var KratorFauna = (function () {
/* ---- kits/fauna/fauna-core.js ---- */
/* ======================================================================
   Krator Fauna: the kit core (kits/fauna/fauna-core.js)

   ONE kit for every animal of Krator (biomes/README.md, "a fauna kit": the owner's call, 2026-10), the way furniture
   is one catalog. An animal is an ANIMAL({...}) entry: data first (tags by biome and climate, harvest and edibility,
   the life layer's numbers), then a build(A) that draws it as PARTS a host can move (body, head, tail, legs), each
   with its own pivot. fauna_bundle.py wraps this file, the species files (krator-fauna-<group>.js) and
   krator-fauna-runtime.js in ONE closure exposing only `KratorFauna`; nothing here meets a host's globals.
   It needs only a global THREE (r128).

   The entry:
     ANIMAL({
       key, name, group,                    group: the species file's group (livestock, mounts ...)
       tags: { biomes:[...], koppen:[...], aridity:[...], climate:[...], riparian:'non'|'riparian'|'both', abyssal:false,
               domestic:true|false, herdedBy:[cultures],
               diet:'herbivore'|'carnivore'|'omnivore', feeding:'grazer'|'browser'|'mixed'|'predator'|'scavenger'|'insectivore'|...,
               activity:'diurnal'|'nocturnal'|'crepuscular'|'cathemeral',
               temperament:'skittish'|'wary'|'docile'|'defensive'|'aggressive' },   (README: tag by biome, harvest, edibility)
       traits: { edible, milkable, tameable, rideable, draught, eggs },   booleans: what a people can do with it (eggs: edible eggs)
       yields: { meat, milk, eggs, hide, hair, wool, feathers, ivory, horn },   amounts per adult, the unit in the key's rule
               (FAUNA_YIELDS): meat kg dressed; milk L a day in milk; eggs a year; hide count a year (the animal's own: 1
               when slaughtered) and its area in m2 as hideM2; hair, wool, feathers kg a year (shorn or moulted); ivory,
               horn kg each animal. 0 or absent: none. A value may be an object { amount, note }.
       life: { maturity (years to breeding age), lifespan (years), litter (young per birth), gestation (days) },
       tags.habitat: [ground, rock, canopy, trunks, sky, water, shallows, deep water, marsh, burrow, pen],
       tags.locomotion: [walks, runs, climbs, flies, glides, swims, wades, burrows, leaps],
       size: { length, height, span } metres of an adult (span for a flyer); data.sizeRange [min, max] scale a world may vary
       source: [{ build, file, lines, note }]   where the animal came from (the build that first drew it), for the port
       data.gait: { type (FAUNA_VOCAB.gait), freq, stride }; data.legs (number of leg parts, default 4); data.wings (pairs);
       data.flap: { freq, amp, glide }; data.swim: { freq, amp }
       temperament: also data: fleeDistance (m: a skittish animal bolts at this range), aggression 0..1,
       variants, variantNames, variantDims: [{w,d,h}],               per variant (a kid is smaller)
       breeds: { name: { scale, ...data } },                         optional: one build at several sizes (salamanders)
       w, d, h,                              the overall box (metres) of variant 0 / breed 1.0
       data: { mass, speed:{walk,run}, gait:{type:'quadruped'|'sprawl', stride, freq}, herd, activity, schedule[24] },
       build(A)                              A: the animal frame (below); A.variant, A.breed, A.S (scale), A.pose, A.rnd
     })

   The animal frame: origin on the ground under the middle of the body, +z FORWARD (the snout), y up, x its left
   (three.js yaw). Metres. Colours are sRGB hex or [r,g,b] 0..1 sRGB; the builder writes LINEAR floats.
     A.part(name, pivot[x,y,z], fn)     geometry drawn inside fn belongs to part `name`, which turns about `pivot`.
                                        Names the runtime animates: body, head, tail, jaw, earL, earR; legs leg0..legN
                                        (pairs front to back, left then right: 0 front left, 1 front right, 2 next left ...);
                                        wings wingL, wingR (a second pair wing2L, wing2R), flapping about z at their roots;
                                        body segments seg0..segN (a millipede, a swimmer's tail), weaving about y. Unnamed: body.
     A.tube(fam, c(t)->[x,y,z], rad(t)->[hw,hh], nt, ns, col, o)   a skin along a curve (o.caps, o.colf(t, angle))
     A.ellip(fam, x,y,z, rx,ry,rz, col, o)   o.rx/o.ry/o.rz: rotation (YXZ); o.seg
     A.cone(fam, a, b, r0, r1, col, seg)     a tapered rod from a to b
     A.locks(fam, list)                      hanging hair: list of {at:[x,y,z], dir:[x,y,z], len, w, col}: each a tapered
                                             double-sided strip that curls a little at its tip
     A.sheet(fam, f(u,v)->[x,y,z], nu, nv, col, o)   a free surface (a coat's skirt), o.colf(u,v)
     A.anchor(name, [x,y,z])                 a point a host fits tack to (saddle, bridle ...), in the animal frame
     A.profile(fn)                           a body profile function a host reads (the salamander's, for its saddles)
   Families (materials): coat (short fur), hair (long hair, double-sided), skin, horn, hoof, eye, mouth, plain.
   ====================================================================== */
const TAU = Math.PI * 2;
const FAUNA_FAMILIES = ['coat', 'hair', 'skin', 'horn', 'hoof', 'eye', 'mouth', 'plain', 'chitin', 'membrane', 'glow'];
/* the vocabularies a tag is checked against (verify.py --assert) */
const FAUNA_VOCAB = {
  aridity: ['arid', 'semiarid', 'subhumid', 'humid'],
  climate: ['hypertropic', 'tropic', 'temperate', 'cold'],
  riparian: ['non', 'riparian', 'both'],
  diet: ['herbivore', 'carnivore', 'omnivore'],
  feeding: ['grazer', 'browser', 'mixed', 'frugivore', 'predator', 'scavenger', 'insectivore', 'filter feeder', 'detritivore'],
  activity: ['diurnal', 'nocturnal', 'crepuscular', 'cathemeral'],
  temperament: ['skittish', 'wary', 'docile', 'defensive', 'aggressive'],   /* from bolting first to attacking first */
  habitat: ['ground', 'rock', 'canopy', 'trunks', 'sky', 'water', 'shallows', 'deep water', 'marsh', 'burrow', 'pen'],
  locomotion: ['walks', 'runs', 'climbs', 'flies', 'glides', 'swims', 'wades', 'burrows', 'leaps'],

   each as one vertex-coloured instanced body in a unit frame (+x forward), scaled per instance (the scale is metres:
   the kit is in metres) and tinted per instance; here each is drawn at its typical scale, the instance tints are the
   variants, and the colour is the kit's vertex colour times the tint (both linear, as the kit's shader did).
   The spore motes of the same pass are not ported: they are additive billboard discs of drifting spores, not animals

  const a = new THREE.Color(hex).convertSRGBToLinear();
  if (tint != null) { const b = new THREE.Color(tint).convertSRGBToLinear(); a.r *= b.r; a.g *= b.g; a.b *= b.b; }
  if (k) { a.r = Math.min(1, a.r * k); a.g = Math.min(1, a.g * k); a.b = Math.min(1, a.b * k); }
  return a;

/* ======================================================================

     KratorFauna.entry(key)                  the entry (data: tags, traits, yields, life, data)
     KratorFauna.build(key, { variant, breed, pose, seed })   -> a THREE.Group: one child group per PART turned about its

                                             anchors, tris, w, d, h }. Origin under the body on the ground, +z the snout.

                                             It only turns the part groups (and bobs the body): the geometry never changes.
     KratorFauna.profile(key, breed, pose)   the body profile a host fits tack to (the salamander's: at(t) -> {z,y,hw,hh})
     KratorFauna.lifeOf(key)                 the life layer's record: faction-free data a world gives a faction and a job
     KratorFauna.setTextures(on), textures() the library detail maps (FA_TEX, packed by fauna_bundle.py): { pending, families }
     KratorFauna.warm()                      start every detail map decoding now

   it as a triplanar DETAIL map in the part's own frame (the pattern rides on a moving leg); the vertex colour keeps

const KratorFaunaAPI = (function () {

/* ---------- 90-sheet.js ---------- */
/* ======================== Fauna kit sheet ========================

   catalog engine's scene (kits/catalog/krator-asset-engine.js), built ONLY through the bundle's public API
   (KratorFauna.build), exactly as a host world builds them. Each stands at ry = 0 (+z its snout), on y = 0, with a
   1.75 m figure at the head of the row for scale.
   Toolbar: Idle (I), Graze (G), Walk (K), Fly (Y), Swim (U) set what every animal is doing (KratorFauna.animate); Night (N).
   Fly shows an animal's 'fly' pose build where it has one (wings folded into the perched shape cannot unfold by turning).
   ?mode=fly (or any mode) starts in that mode; ?only=key,key lays out just those animals (a species file's own check).
   Exposes window._sheet (rows, instances, view(i, kind), setMode, setNight) and sets window._ready.

const INSTANCES = [];
(function () {
  'use strict';
  const KF = KratorFauna;

  if (/[?&]mat=proc\b/.test(location.search)) KF.setTextures(false);

      if (E.poses && E.poses.indexOf('fly') >= 0) { const f = KF.build(E.key, { variant: k.v, breed: k.breed, seed: 7 + k.v, pose: 'fly' });
        f.position.copy(g.position); f.userData.phase = u.phase; f.visible = false; scene.add(f); u.alt = f; }
      label(E.name + (k.breed ? ' · ' + k.breed : '') + ' #' + (k.v + 1), (E.variantNames[k.v] || '') + ' · ' + u.tris + ' tris', cx, z + u.d / 2 + 0.5, Math.max(u.w * 1.3, 1.8), false);

  function show(g, on) { const alt = g.userData.alt, fly = mode === 'fly' && !!alt; g.visible = on && !fly; if (alt) alt.visible = on && fly; }
  const hemi = scene.children.filter(function (o) { return o.isHemisphereLight; })[0];
  const base = { sun: sun.intensity, fill: fill.intensity, hemi: hemi ? hemi.intensity : 0 };
  if (window.KratorSky) { KratorSky.attach(scene, 4200); KratorSky.update(camera.position, hour, 200, 1.6); scene.fog.color.copy(KratorSky.lighting().fog); }
  function setMode(m) {
    mode = m;
    for (const g of INSTANCES) if (g.userData.alt) show(g, g.visible || g.userData.alt.visible);
    for (const [id, mm] of [['idleBtn', 'idle'], ['grazeBtn', 'graze'], ['walkBtn', 'walk'], ['flyBtn', 'fly'], ['swimBtn', 'swim']]) document.getElementById(id).classList.toggle('on', mm === m);
  }

    sun.intensity = night ? 0.03 : base.sun; fill.intensity = night ? 0.05 : base.fill; if (hemi) hemi.intensity = night ? 0.12 : base.hemi;
    if (window.KratorSky) { KratorSky.update(camera.position, hour, 200, 1.6); scene.fog.color.copy(KratorSky.lighting().fog); }

  }
  const pin = /[?&]t=([\d.]+)/.exec(location.search);
  (window._frameHooks = window._frameHooks || []).push(function (now) {
    if (window.KratorSky) KratorSky.update(camera.position, hour, 200, 1.6);
    const t = pin ? +pin[1] : (now - t0) / 1000;
    for (const g of INSTANCES) { KF.animate(g, t, mode, { phase: g.userData.phase }); if (g.userData.alt) KF.animate(g.userData.alt, t, mode, { phase: g.userData.phase }); }

  /* --- toolbar */
  document.getElementById('count').textContent = KF.list().length + ' animals · ' + INSTANCES.length + ' on the sheet';
  const rs = document.getElementById('rowSel');
  rows.forEach(function (r, i) { const o = document.createElement('option'); o.value = String(i); o.textContent = r.title; rs.appendChild(o); });
  rs.onchange = function () { gotoRow(+rs.value); };
  document.getElementById('idleBtn').onclick = function () { setMode('idle'); };
  document.getElementById('grazeBtn').onclick = function () { setMode('graze'); };
  document.getElementById('walkBtn').onclick = function () { setMode('walk'); };
  document.getElementById('flyBtn').onclick = function () { setMode('fly'); };
  document.getElementById('swimBtn').onclick = function () { setMode('swim'); };
  document.getElementById('nightBtn').onclick = function () { setNight(!night); };
  window.addEventListener('keydown', function (e) {
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const k = e.key.toLowerCase();
    if (k === 'i') setMode('idle'); else if (k === 'g') setMode('graze'); else if (k === 'k') setMode('walk'); else if (k === 'y') setMode('fly'); else if (k === 'u') setMode('swim'); else if (k === 'n') setNight(!night);
  });

  function showAll() { for (const g of INSTANCES) show(g, true); }
  function gotoRow(i) {
    const r = rows[i]; if (!r) return;
    showAll(); if (ctl.walk) window._setWalk(false);
    ctl.target.set(r.width / 2 - GAP / 2, 0.6, r.z); ctl.dist = Math.max(5, r.width * 0.85); ctl.az = 0.5; ctl.el = 0.3;
    updateCamera();
  }
  /* one animal, close and alone: kind = front34 | side | rear34 | front | top */
  const VIEWS = { front34: [0.75, 0.2, 3.2], side: [Math.PI / 2, 0.1, 3.4], rear34: [Math.PI - 0.75, 0.25, 3.2], front: [0, 0.12, 3.0], top: [0.3, 1.3, 3.6] };
  function view(i, kind) {
    const g = INSTANCES[i], V = VIEWS[kind] || VIEWS.front34; if (!g) return null;
    if (ctl.walk) window._setWalk(false);
    for (const o of INSTANCES) show(o, o === g);
    const k = Math.max(0.5, g.userData.d / 1.3);
    ctl.target.set(g.position.x, Math.max(0.4, g.userData.h * 0.45), g.position.z); ctl.az = V[0]; ctl.el = V[1]; ctl.dist = V[2] * k;
    updateCamera();
    return g.userData.key + ' #' + (g.userData.variant + 1);
  }
  { const m0 = (/[?&]mode=(\w+)/.exec(location.search) || [])[1]; if (m0) setMode(m0); }
  if (rows.length) gotoRow(0);
  window._sheet = { rows: rows, instances: INSTANCES, width: maxW, gotoRow: gotoRow, view: view, showAll: showAll, views: Object.keys(VIEWS),
    setMode: setMode, setNight: setNight };
  window._texPending = function () { return KF.textures().pending; };
  (function wait() { if (KF.textures().pending > 0) return setTimeout(wait, 50); window._ready = true; })();
})();
/* ---------- 92-hover.js ---------- */
/* ======================== Hover inspector ========================
   Hover inspector (repo README "DEV TOOLS"): toggle with T or the toolbar button.
   When on, the pointer names the animal under it: name, variant, breed, its tags (biome, climate, diet,
   activity, temperament), its traits, its yields with their units and its life.
   Adapted from kits/motor-vehicles/src/92-hover.js for animal groups (userData from
   KratorFauna.build). Off by default.
   ====================================================================== */
(function () {
  'use strict';
  const tip = document.getElementById('hover');
  const btn = document.getElementById('hoverBtn');
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let on = false, pending = null;

  /* the animal's record: its tags (biome, climate, diet, activity, temperament), its traits, its yields with units, its life */
  function fmt(v) { return Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object') ? (v.amount != null ? v.amount : JSON.stringify(v)) : String(v); }
  function tagsOf(u) {
    const T = u.tags || {}, t = [];
    for (const k of Object.keys(T)) t.push(k + ': ' + fmt(T[k]));
    const tr = Object.keys(u.traits || {}).filter(k => u.traits[k]);
    t.push('can be: ' + (tr.length ? tr.join(', ') : 'none'));
    const Y = u.yields || {}, Un = KratorFauna.YIELDS;
    for (const k of Object.keys(Y)) { const y = Y[k]; t.push(k + ' ' + fmt(y) + ' ' + (Un[k] || '') + (y && y.hideM2 ? ' (' + y.hideM2 + ' m2)' : '')); }
    const L = u.life || {};
    t.push('mature at ' + L.maturity + ' y', 'lives ' + L.lifespan + ' y', 'young ' + L.litter + (L.gestation ? ' after ' + L.gestation + ' d' : ''), u.tris + ' tris');
    return t;
  }
  function describe(g) {
    const u = g.userData;
    return '<div class="cls">fauna · ' + (u.breed ? u.breed + ' breed' : 'animal') + '</div><b>' + u.name + '</b>' +
      ' <span style="opacity:.6">#' + (u.variant + 1) + (u.variantName ? ' ' + u.variantName : '') + '</span>' +
      '<br>' + tagsOf(u).map(s => '<span class="tag">' + s + '</span>').join('');
  }
  function pick(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(INSTANCES, true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o && INSTANCES.indexOf(o) < 0) o = o.parent;
    return o;
  }
  function setOn(v) {
    on = v; btn.classList.toggle('on', on);
    if (!on) tip.style.display = 'none';
  }
  renderer.domElement.addEventListener('mousemove', function (e) {
    if (!on) return;
    pending = [e.clientX, e.clientY];
  });
  (window._frameHooks = window._frameHooks || []).push(function () {
    if (!on || !pending) return;
    const [x, y] = pending; pending = null;
    const g = pick(x, y);
    if (!g) { tip.style.display = 'none'; return; }
    tip.innerHTML = describe(g);
    tip.style.display = 'block';
    tip.style.left = Math.min(x + 16, innerWidth - 360) + 'px';
    tip.style.top = (y + 16) + 'px';
  });
  btn.onclick = function () { setOn(!on); };
  window.addEventListener('keydown', function (e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 't') setOn(!on);
  });
  window._hover = { setOn: setOn, describe: describe, tagsOf: tagsOf };
})();
/* ---------- 93-polygon.js ---------- */
/* ======================== Polygon tool ========================
   Polygon tool (repo README "DEV TOOLS"), the mechanism of the settlements'
   92-camera.js: toggle with P or the toolbar button, click the ground to lay
   a vertex, right-click to drop the last one. The panel holds copy-pasteable
   world coordinates ([x,z] or {x:,z:}), the format kits/interiors ROOM() takes
   for `poly`. It also names the nearest animal and the last vertex in that
   animal's local frame (+z forward), for placing things against it.
   (Copied from kits/catalog/src/93-polygon.js; only the nearest-instance line differs.)
   While it is on, a click adds a vertex instead of selecting in the inspector.
   ====================================================================== */
(function () {
  'use strict';
  const POLY = { on: false, pts: [], fmt: 0, grp: new THREE.Group() };
  scene.add(POLY.grp);
  const panel = document.getElementById('poly'), out = document.getElementById('polyout');
  const near = document.getElementById('polynear'), btn = document.getElementById('polyBtn');
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xff5060 }), lineMat = new THREE.LineBasicMaterial({ color: 0xffe060 });
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  const r2 = (t) => Math.round(t * 100) / 100;

  function nearest(x, z) {
    let best = null, bd = 1e9;
    for (const g of INSTANCES) {
      const u = g.userData, dd = Math.hypot(u.x - x, u.z - z);
      if (dd < bd) { bd = dd; best = g; }
    }
    return best;
  }
  function redraw() {
    while (POLY.grp.children.length) POLY.grp.remove(POLY.grp.children[0]);
    for (const p of POLY.pts) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), dotMat);
      m.position.set(p[0], 0.3, p[1]); POLY.grp.add(m);
    }
    if (POLY.pts.length > 1) {
      const geo = new THREE.BufferGeometry().setFromPoints(POLY.pts.map(p => new THREE.Vector3(p[0], 0.05, p[1])));
      POLY.grp.add(new THREE.Line(geo, lineMat));
    }
    const f = p => POLY.fmt ? '{x:' + r2(p[0]) + ',z:' + r2(p[1]) + '}' : '[' + r2(p[0]) + ',' + r2(p[1]) + ']';
    out.value = '[' + POLY.pts.map(f).join(',') + ']';
    const last = POLY.pts[POLY.pts.length - 1], g = last && nearest(last[0], last[1]);
    if (g) {
      const u = g.userData, c = Math.cos(u.ry), s = Math.sin(u.ry), dx = last[0] - u.x, dz = last[1] - u.z;
      /* inverse of the frame's toWorld: lx = dx cos - dz sin, lz = dx sin + dz cos */
      near.textContent = 'nearest: ' + u.key + ' #' + (u.variant + 1) + ' — last vertex in its frame: [' +
        r2(dx * c - dz * s) + ',' + r2(dx * s + dz * c) + ']';
    } else near.textContent = '';
    window._poly = POLY.pts.slice();
  }
  function add(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) { POLY.pts.push([hit.x, hit.z]); redraw(); }
  }
  function setOn(v) {
    POLY.on = v; btn.classList.toggle('on', v); panel.style.display = v ? 'block' : 'none'; POLY.grp.visible = v;
  }
  /* a click (not a drag) adds or removes a vertex; captured before the inspector's own mouseup */
  let down = null;
  renderer.domElement.addEventListener('mousedown', (e) => { down = [e.clientX, e.clientY, e.button]; }, true);
  renderer.domElement.addEventListener('mouseup', (e) => {
    if (!POLY.on || !down) return;
    const click = Math.abs(e.clientX - down[0]) < 4 && Math.abs(e.clientY - down[1]) < 4;
    down = null;
    if (!click) return;
    if (e.button === 0) add(e.clientX, e.clientY);
    else if (e.button === 2) { POLY.pts.pop(); redraw(); }
    e.stopImmediatePropagation();
    ctl.dragging = false; ctl.panning = false;
  }, true);
  btn.onclick = () => setOn(!POLY.on);
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 'p') setOn(!POLY.on);
  });
  document.getElementById('polyundo').onclick = () => { POLY.pts.pop(); redraw(); };
  document.getElementById('polyclear').onclick = () => { POLY.pts = []; redraw(); };
  document.getElementById('polyclose').onclick = () => { if (POLY.pts.length > 2) { POLY.pts.push(POLY.pts[0].slice()); redraw(); } };
  document.getElementById('polyfmt').onclick = (e) => { POLY.fmt ^= 1; e.target.textContent = POLY.fmt ? 'Format: {x,z}' : 'Format: [x,z]'; redraw(); };
  document.getElementById('polycopy').onclick = () => {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (err) { document.execCommand('copy'); }
  };
  window._polyTool = { setOn: setOn, add: add, state: POLY };
})();
