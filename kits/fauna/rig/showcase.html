<title>Krator Arthropod Bestiary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* A specimen cabinet at night: the animal stands on a ruled metre grid under one lamp, the index runs down the side like a drawer of labels. One dark look, by choice. */
:root {
  --ground: #1f2826; --panel: #27312f; --rule: #3a4744; --ink: #ece7d8; --dim: #a3ada4; --amber: #dcaa4a;
  --display: 'Alegreya', 'Iowan Old Style', Georgia, serif; --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; display: grid; grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; }
#stage { position: relative; min-width: 0; min-height: 0; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#plate { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; right: 16px; pointer-events: none; }
#plate h1 { font: 700 clamp(26px, 3.6vw, 42px)/1.05 var(--display); margin: 0; text-wrap: balance; }
#plate .sub { color: var(--dim); max-width: 60ch; }
#facts { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; font-variant-numeric: tabular-nums; }
#facts b { color: var(--amber); font-weight: 500; }
#tools { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#tools .note { color: var(--dim); font-size: 14px; margin-left: 6px; }
button, select, input[type=color] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; }
button { padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button[aria-pressed=true] { background: var(--amber); border-color: var(--amber); color: #1f2826; font-weight: 700; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
#side { min-width: 0; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--rule); padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
#side h2 { font: 700 19px/1.2 var(--display); margin: 0 0 6px; }
.index { display: flex; flex-direction: column; }
.index h3 { font: 500 13px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--amber); margin: 12px 0 2px; }
.index h3:first-child { margin-top: 0; }
.index button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; text-align: left; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: none; padding: 6px 2px; }
.index button span { min-width: 0; }
.index .v { grid-column: 1; color: var(--dim); font-size: 14px; }
.index .len { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; }
.index button[aria-pressed=true] { background: none; color: var(--amber); font-weight: 500; }
.index button[aria-pressed=true] .v, .index button[aria-pressed=true] .len { color: var(--amber); }
#mix { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 7px 10px; align-items: center; }
#mix label { color: var(--dim); font-size: 15px; }
#mix select { width: 100%; padding: 4px; }
#mix input[type=color] { width: 100%; height: 30px; padding: 2px; }
#mix input[type=range] { width: 100%; accent-color: var(--amber); }
#side p { margin: 0 0 8px; color: var(--dim); font-size: 15px; }
@media (max-width: 760px) {
  body { display: block; overflow: auto; }
  #stage { height: 62vh; min-height: 340px; }
  #plate .sub { display: none; }
  #side { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
<div id="stage">
  <canvas id="c" aria-label="The selected animal, drawn in 3D. Drag to turn it, scroll to zoom."></canvas>
  <div id="plate"><h1 id="name"></h1><div class="sub" id="sub"></div><div id="facts"></div></div>
  <div id="tools">
    <button id="lineup">All together</button>
    <button id="m-idle">Rest</button><button id="m-walk">Walk</button><button id="m-strike">Strike</button>
    <span class="note">Grid squares are 1 m. The figure is 1.75 m tall.</span>
  </div>
</div>
<aside id="side">
  <section><h2>Specimens</h2><div class="index" id="index"></div></section>
  <section id="mixer"><h2>Mix a spider</h2><p>Every spider here is one file of parts. Choose any combination.</p>
    <div id="mix">
      <label for="p-body">Legs</label><select id="p-body"></select>
      <label for="p-abd">Abdomen</label><select id="p-abd"></select>
      <label for="p-jaw">Fangs</label><select id="p-jaw"></select>
      <label for="p-eyes">Eyes</label><select id="p-eyes"></select>
      <label for="p-bodyc">Body</label><input type="color" id="p-bodyc" value="#2a241c">
      <label for="p-legsc">Legs</label><input type="color" id="p-legsc" value="#3a3024">
      <label for="p-abdc">Abdomen</label><input type="color" id="p-abdc" value="#c89a30">
      <label for="p-size">Size</label><input type="range" id="p-size" min="0.4" max="4" step="0.05" value="1">
    </div>
  </section>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="models.js"></script>
