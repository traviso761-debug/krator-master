<html lang="en">
<head>

<title>Krator Interiors</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d8dccb;font-family:Georgia,serif}
  #app{position:fixed;inset:0}
  #bar{position:fixed;left:14px;top:14px;z-index:30;background:rgba(24,21,15,0.88);color:#f3ecd8;
       border-radius:8px;padding:9px 12px;font-size:12px;max-width:min(600px,calc(100vw - 28px));line-height:1.5}
  #bar b{color:#e0c98a;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
  #bar select,#bar button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;
       padding:4px 8px;font:inherit;font-size:11.5px;margin:3px 3px 0 0;cursor:pointer}
  #bar select option{background:#2a2518}
  #bar button.on{background:#c9a227;color:#2a2416}
  #bar .n{opacity:.6;font-size:11px}

  #rep .fb{color:#e3b55e} #rep .miss{color:#e88a7a} #rep .ok{color:#8fca7a}

  #hover b{font-size:13px}
  #hover .cls{color:#9fe8ff;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  #hover .tag{display:inline-block;background:rgba(184,232,160,.16);color:#b8e8a0;border-radius:3px;padding:0 5px;margin:2px 3px 0 0;font-size:11px}
  #poly{position:fixed;right:14px;bottom:14px;z-index:30;display:none;background:rgba(24,21,15,0.9);color:#f3ecd8;border-radius:8px;
       padding:8px 10px;font:11.5px ui-monospace,monospace;max-width:420px;white-space:pre-wrap;word-break:break-all}
  #errs{position:fixed;right:10px;top:10px;max-width:60vw;max-height:30vh;overflow:auto;background:rgba(120,0,0,.88);color:#fff;

<pre id="errs"></pre>
<script>
/* error panel: verify.py fails the run when this has any text */
(function(){
  const el=document.getElementById('errs');
  window.reportErr=function(m){el.style.display='block';el.textContent+=String(m).slice(0,600)+'\n';};
  window.onerror=function(m,s,l,c,e){reportErr((e&&e.stack)||(m+' @'+l+':'+c));};
  window.addEventListener('unhandledrejection',function(e){reportErr('promise: '+(e.reason&&e.reason.stack||e.reason));});
  const ce=console.error.bind(console);
  console.error=function(){ce.apply(null,arguments);reportErr([].map.call(arguments,function(a){return a&&a.stack?a.stack:String(a);}).join(' '));};
})();
</script>

<script>
/* ---------- src/10-core.js ---------- */
/* ======================== Interiors core: namespace, rng, geometry ========================
   ENGINE-NEUTRAL. Fragments 10-49 use no THREE, no DOM and no host global: they run in a
   page, in a worker or in node (build.py also writes them alone as dist/interiors-core.js).
   Everything hangs off one namespace, KratorInteriors; the only other globals are the two
   names kits/interiors/SPEC.md asks for, ROOM() and furnishRoom() (bound in 49-exports.js).

   Coordinates are the polygon tool's: world x and z in metres, y up. A piece's frame is the
   catalog's (kits/catalog/README.md "Frame"): origin = footprint centre on the floor, +z the
   front, and rotation ry maps local (lx, lz) to world (x + lx cos ry + lz sin ry,
   z - lx sin ry + lz cos ry), so the front faces (sin ry, cos ry).
   ====================================================================== */
var KratorInteriors = (typeof KratorInteriors !== 'undefined' && KratorInteriors) || {};
(function (IX) {
  'use strict';
  IX.version = 1;

  /* ---------- seeded randomness (same LCG as the catalog's frame and Yuni's intRng) */
  IX.hash = function (s) {                      /* FNV-1a over a string -> uint32 */
    s = String(s);
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  };
  IX.rng = function (seed) {
    let st = ((seed >>> 0) * 2654435761 + 97) >>> 0;
    const r = function () { st = (Math.imul(st, 1664525) + 1013904223) >>> 0; return st / 4294967296; };
    r.int = function (n) { return Math.floor(r() * n) % n; };
    r.pick = function (a) { return a[r.int(a.length)]; };
    r.shuffle = function (a) { for (let i = a.length - 1; i > 0; i--) { const j = r.int(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
    return r;
  };
  IX.round = function (v, n) { const k = Math.pow(10, n == null ? 3 : n); return Math.round(v * k) / k; };

  /* ---------- polygons: [[x,z], ...], either winding */
  const G = IX.geom = {};
  G.area = function (poly) {                    /* signed: > 0 when counter-clockwise in (x, z) */
    let a = 0;
    for (let i = 0, n = poly.length; i < n; i++) { const p = poly[i], q = poly[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
    return a / 2;
  };
  G.centroid = function (poly) {
    let cx = 0, cz = 0, a = 0;
    for (let i = 0, n = poly.length; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n], c = p[0] * q[1] - q[0] * p[1];
      a += c; cx += (p[0] + q[0]) * c; cz += (p[1] + q[1]) * c;
    }
    if (Math.abs(a) < 1e-9) return [poly[0][0], poly[0][1]];
    return [cx / (3 * a), cz / (3 * a)];
  };
  G.bbox = function (pts) {
    let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
    for (const p of pts) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < z0) z0 = p[1]; if (p[1] > z1) z1 = p[1]; }
    return [x0, z0, x1, z1];
  };
  G.inside = function (poly, x, z) {            /* even-odd ray cast */
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > z) !== (b[1] > z) && x < (b[0] - a[0]) * (z - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  };
  G.segDist = function (x, z, a, b) {           /* distance from (x,z) to segment a-b */
    const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz;
    let t = L2 ? ((x - a[0]) * dx + (z - a[1]) * dz) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - a[0] - dx * t, z - a[1] - dz * t);
  };
  G.edgeDist = function (poly, x, z) {
    let d = Infinity;
    for (let i = 0, n = poly.length; i < n; i++) d = Math.min(d, G.segDist(x, z, poly[i], poly[(i + 1) % n]));
    return d;
  };
  function cross(ax, az, bx, bz) { return ax * bz - az * bx; }
  G.segsCross = function (p, q, r, s) {         /* proper crossing of p-q and r-s (touching does not count) */
    const d1 = cross(q[0] - p[0], q[1] - p[1], r[0] - p[0], r[1] - p[1]);
    const d2 = cross(q[0] - p[0], q[1] - p[1], s[0] - p[0], s[1] - p[1]);
    const d3 = cross(s[0] - r[0], s[1] - r[1], p[0] - r[0], p[1] - r[1]);
    const d4 = cross(s[0] - r[0], s[1] - r[1], q[0] - r[0], q[1] - r[1]);
    const e = 1e-9;
    return ((d1 > e && d2 < -e) || (d1 < -e && d2 > e)) && ((d3 > e && d4 < -e) || (d3 < -e && d4 > e));
  };

  /* polygon offset with mitred corners: d > 0 moves every edge OUTWARD by d */
  G.offset = function (poly, d) {
    const n = poly.length, s = G.area(poly) > 0 ? 1 : -1, out = [];
    for (let i = 0; i < n; i++) {
      const p0 = poly[(i + n - 1) % n], p1 = poly[i], p2 = poly[(i + 1) % n];
      const e1 = norm(p1[0] - p0[0], p1[1] - p0[1]), e2 = norm(p2[0] - p1[0], p2[1] - p1[1]);
      const o1 = [e1[1] * s, -e1[0] * s], o2 = [e2[1] * s, -e2[0] * s];    /* outward normals */
      const bx = o1[0] + o2[0], bz = o1[1] + o2[1], bl = Math.hypot(bx, bz) || 1;
      const k = d / Math.max(0.2, (bx * o1[0] + bz * o1[1]) / bl);
      out.push([p1[0] + bx / bl * k, p1[1] + bz / bl * k]);
    }
    return out;
  };
  function norm(x, z) { const l = Math.hypot(x, z) || 1; return [x / l, z / l]; }
  /* is vertex i convex (interior angle < 180)? */
  G.convexAt = function (poly, i) {
    const n = poly.length, s = G.area(poly) > 0 ? 1 : -1, a = poly[(i + n - 1) % n], b = poly[i], c = poly[(i + 1) % n];
    return s * cross(b[0] - a[0], b[1] - a[1], c[0] - b[0], c[1] - b[1]) > 0;
  };

  /* ---------- oriented rectangles: { x, z, ry, hw, hd } (centre, heading, half extents along local x / z) */
  G.rect = function (x, z, ry, w, d) { return { x: x, z: z, ry: ry, hw: w / 2, hd: d / 2 }; };
  G.axes = function (r) { const c = Math.cos(r.ry), s = Math.sin(r.ry); return [[c, -s], [s, c]]; };  /* local x, local z in world */
  G.corners = function (r) {
    const A = G.axes(r), out = [];
    for (const sg of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      out.push([r.x + A[0][0] * r.hw * sg[0] + A[1][0] * r.hd * sg[1], r.z + A[0][1] * r.hw * sg[0] + A[1][1] * r.hd * sg[1]]);
    }
    return out;
  };
  G.grow = function (r, m) { return { x: r.x, z: r.z, ry: r.ry, hw: Math.max(0, r.hw + m), hd: Math.max(0, r.hd + m) }; };
  /* a rectangle given in a piece's LOCAL frame (lx0..lx1, lz0..lz1), returned in world terms */
  G.localRect = function (px, pz, ry, lx0, lx1, lz0, lz1) {
    const cx = (lx0 + lx1) / 2, cz = (lz0 + lz1) / 2, c = Math.cos(ry), s = Math.sin(ry);
    return { x: px + cx * c + cz * s, z: pz - cx * s + cz * c, ry: ry, hw: (lx1 - lx0) / 2, hd: (lz1 - lz0) / 2 };
  };
  G.containsPt = function (r, x, z, m) {        /* point inside the rectangle grown by m */
    const A = G.axes(r), dx = x - r.x, dz = z - r.z;
    return Math.abs(dx * A[0][0] + dz * A[0][1]) <= r.hw + (m || 0) && Math.abs(dx * A[1][0] + dz * A[1][1]) <= r.hd + (m || 0);
  };
  /* separating-axis overlap depth: > tol means the two rectangles truly overlap */
  G.overlap = function (a, b, tol) {
    const axes = G.axes(a).concat(G.axes(b));
    let minPen = Infinity;
    for (const ax of axes) {
      const pa = proj(a, ax), pb = proj(b, ax);
      const pen = Math.min(pa[1], pb[1]) - Math.max(pa[0], pb[0]);
      if (pen <= (tol || 0)) return false;
      if (pen < minPen) minPen = pen;
    }
    return minPen;
  };
  function proj(r, ax) {
    const A = G.axes(r), c = r.x * ax[0] + r.z * ax[1];
    const e = r.hw * Math.abs(A[0][0] * ax[0] + A[0][1] * ax[1]) + r.hd * Math.abs(A[1][0] * ax[0] + A[1][1] * ax[1]);
    return [c - e, c + e];
  }
  /* a rectangle lies inside a polygon: its corners are inside (by margin m from every edge)
     and no polygon edge crosses it (an L-shaped room's reflex corner cannot poke into it) */
  G.rectInPoly = function (poly, r, m) {
    const cs = G.corners(r);
    for (const c of cs) {
      if (!G.inside(poly, c[0], c[1])) return false;
      if (m && G.edgeDist(poly, c[0], c[1]) < m - 1e-9) return false;
    }
    for (let i = 0, n = poly.length; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      if (G.containsPt(r, p[0], p[1], -1e-6)) return false;    /* a reflex vertex strictly inside */
      for (let k = 0; k < 4; k++) if (G.segsCross(p, q, cs[k], cs[(k + 1) % 4])) return false;
    }
    return true;
  };
})(KratorInteriors);
/* ---------- src/20-rooms.js ---------- */
/* ======================== ROOM(): room registration ========================
   kits/interiors/SPEC.md "What a building exposes":

     ROOM({ building, kind, poly: [[x,z],...], y, h,
            doors:   [{ at:[x,z], w, to: 'street' | '<room id>', swing?, hinge? }],
            windows: [{ at:[x,z], w, sill, h? }],
            culture, wealth, id?, seed? })

   poly is the floor outline at the INNER face of the walls, either winding. A door or window
   is snapped onto the nearest wall of the polygon; `at` may sit anywhere within 0.6 m of it.
   Door extras this kit adds (all optional): swing 'in' (default) | 'out' | 'none' (an open
   doorway or curtain), hinge 'left' | 'right' (seen from inside, looking out; default 'left'),
   h (opening height, 2.1), leaf: false (another room draws this door's leaf: a shared door).

   ROOM() returns the normalised room. What the placer reads from it:
     id, building, kind, culture, wealth, y, h, seed
     poly            as given (copied), area, centroid, bbox
     walls[]         { i, a, b, len, t:[tx,tz] (a->b), n:[nx,nz] (INWARD unit normal), ry (a piece
                       backed onto this wall faces the room at this heading) }
     doors[]         { at, w, to, swing, hinge, wall, u (metres along the wall from a), n, ry }
     windows[]       { at, w, sill, h, wall, u, n }
   Registered rooms live in KratorInteriors.rooms / roomById; IX.normRoom() normalises without
   registering (the placer accepts either).
   ====================================================================== */
(function (IX) {
  'use strict';
  const G = IX.geom;
  IX.rooms = [];
  IX.roomById = {};
  IX.ROOM_KINDS_KNOWN = ['hall', 'bedroom', 'kitchen', 'store', 'workshop', 'shrine', 'tavern', 'library', 'school',
    'study', 'barracks', 'court', 'yard', 'rooftop', 'antechamber'];

  function snap(room, at, what) {
    let best = null, bd = Infinity;
    for (const W of room.walls) {
      const d = G.segDist(at[0], at[1], W.a, W.b);
      if (d < bd) { bd = d; best = W; }
    }
    if (!best || bd > 0.6) throw new Error('ROOM ' + room.id + ': ' + what + ' at [' + at + '] is ' + bd.toFixed(2) + ' m from every wall');
    const u = Math.max(0, Math.min(best.len, (at[0] - best.a[0]) * best.t[0] + (at[1] - best.a[1]) * best.t[1]));
    return { W: best, u: u, at: [best.a[0] + best.t[0] * u, best.a[1] + best.t[1] * u] };
  }

  IX.normRoom = function (o) {
    if (!o || !Array.isArray(o.poly) || o.poly.length < 3) throw new Error('ROOM needs poly: [[x,z], ...] with 3+ points');
    const poly = o.poly.map(function (p) { return [+p[0], +p[1]]; });
    const sa = G.area(poly);
    if (Math.abs(sa) < 0.5) throw new Error('ROOM ' + (o.id || o.building) + ': polygon area ' + sa.toFixed(2) + ' m2 is too small');
    const sign = sa > 0 ? 1 : -1;
    const R = {
      id: o.id || ((o.building || 'room') + '.room.' + IX.rooms.length),
      building: o.building || null, kind: o.kind || 'hall', culture: o.culture || null,
      wealth: o.wealth == null ? 0.5 : Math.max(0, Math.min(1, +o.wealth)),
      y: +(o.y || 0), h: +(o.h || 3.0),
      poly: poly, area: Math.abs(sa), centroid: G.centroid(poly), bbox: G.bbox(poly),
      walls: [], doors: [], windows: [], src: o
    };
    R.seed = o.seed != null ? (o.seed >>> 0) : IX.hash(R.id);
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
      if (len < 1e-6) continue;
      const t = [dx / len, dz / len], n = [-t[1] * sign, t[0] * sign];
      R.walls.push({ i: R.walls.length, a: a, b: b, len: len, t: t, n: n, ry: Math.atan2(n[0], n[1]) });
    }
    (o.doors || []).forEach(function (d, k) {
      const s = snap(R, d.at, 'door ' + k);
      R.doors.push({ i: k, at: s.at, w: +(d.w || 1.0), to: d.to || 'street', swing: d.swing || 'in', hinge: d.hinge || 'left',
        h: +(d.h || 2.1), leaf: d.leaf !== false, wall: s.W.i, u: s.u, n: s.W.n, ry: s.W.ry });
    });
    (o.windows || []).forEach(function (w, k) {
      const s = snap(R, w.at, 'window ' + k);
      R.windows.push({ i: k, at: s.at, w: +(w.w || 0.9), sill: w.sill == null ? 0.9 : +w.sill, h: +(w.h || 1.1), wall: s.W.i, u: s.u, n: s.W.n });
    });
    return R;
  };

  IX.ROOM = function (o) {
    const R = IX.normRoom(o);
    if (IX.roomById[R.id]) throw new Error('ROOM ' + R.id + ' registered twice');
    IX.rooms.push(R); IX.roomById[R.id] = R;
    return R;
  };
  IX.clearRooms = function () { IX.rooms.length = 0; for (const k in IX.roomById) delete IX.roomById[k]; };
})(KratorInteriors);
/* ---------- src/30-programs.js ---------- */
/* ======================== Room programs: what each room kind needs ========================
   The data the placer reads. Swap or extend any table here without touching the placer.

   PROGRAMS[kind] = {
     require: [{ need, types:[...], n }]   placed FIRST, in this order (SPEC "Placement" 2).
                                           need names the slot in reports; types are catalog
                                           FURN types (kits/catalog krator-asset-engine.js FURN_TYPES)
     optional:[{ types:[...], max }]       filled after, while there is room, from the room's
                                           culture and its family only (never 'any')
     extra:    m2 per optional piece       wealth scales it: a rich room fills more
   }
   A candidate for either list must pass SPEC "Placement" 1: setting in {indoor, both}, rooms
   contains the kind, and it fits under the ceiling. Culture is tried in FALLBACK order.

   ROLES says where a piece of a type goes (Yuni's LAYOUT anchors, generalised):
     back    against a wall, preferring the wall farthest from the doors (Yuni 'back')
     wall    against any wall, side walls and corners first (Yuni 'left' 'right' 'corner' 'run-*')
     centre  free-standing, near the middle (Yuni 'centre'), repeated pieces on a grid ('grid')
     seat    beside a placed table, desk or counter, facing it; else against a wall
     ceiling hung from the ceiling;  surface  on a placed table, counter, shelf or desk top
   A piece's anchor overrides its type: anchor 'wall' always backs onto a wall.
   ====================================================================== */
(function (IX) {
  'use strict';
  const SEATS = ['seating', 'bench', 'chair'];
  IX.SEAT_TYPES = SEATS;
  IX.TABLE_TYPES = ['table', 'desk', 'counter'];           /* a seat may stand in these pieces' clearance */
  IX.SURFACE_HOSTS = ['table', 'counter', 'shelf', 'desk', 'storage'];
  /* types that need no walk-up access (decor, light, partitions); everything else must be reachable */
  IX.NO_ACCESS_TYPES = ['rug', 'screen', 'lamp', 'banner', 'debris', 'planter', 'monument'];

  IX.PROGRAMS = {
    hall:     { require: [{ need: 'table', types: ['table'], n: 1 }, { need: 'seats', types: SEATS, n: 2 }],
                optional: [{ types: ['lamp', 'brazier'], max: 2 }, { types: ['storage', 'shelf', 'rack'], max: 2 }, { types: ['screen', 'statue', 'banner'], max: 1 }],
                extra: 7 },
    bedroom:  { require: [{ need: 'bed', types: ['bed'], n: 1 }],
                optional: [{ types: ['storage'], max: 2 }, { types: ['lamp'], max: 1 }, { types: ['screen'], max: 1 }, { types: ['chair', 'desk'], max: 1 }],
                extra: 5 },
    kitchen:  { require: [{ need: 'hearth', types: ['stove'], n: 1 }, { need: 'storage', types: ['storage', 'shelf', 'vessel'], n: 1 }],
                optional: [{ types: ['storage', 'shelf', 'rack', 'stack'], max: 2 }, { types: ['table'], max: 1 }],
                extra: 5 },
    tavern:   { require: [{ need: 'counter', types: ['counter'], n: 1 }, { need: 'table', types: ['table'], n: 1 }, { need: 'seats', types: SEATS, n: 2 }],
                optional: [{ types: ['table'], max: 2 }, { types: SEATS, max: 4 }, { types: ['storage', 'stack', 'rack'], max: 1 }, { types: ['lamp', 'brazier'], max: 2 }],

/* ---------- src/75-audit.js ---------- */
/* ======================== Page audit: plan + measured geometry ========================
   window._interiors.audit() is what verify.py --assert runs. For every demo room it runs
   IX.audit() (48-audit.js: declared footprints, doors, clearance, reach, required pieces,
   determinism by furnishing again), then measures the BUILT pieces:
     measured-inside   every vertex, taken into the piece's own frame, gives a box whose four
                       corners lie inside the room polygon (within TOL of its edges)
     measured-height   that box spans floor - TOL .. ceiling + TOL
     builds            the catalog built it without error, with at least one mesh, no NaN
   TOL = max(0.06 m, 4 % of the dimension): the catalog's own declared-size tolerance
   (kits/catalog verify.py) plus a centimetre.
   ====================================================================== */
(function () {
  'use strict';
  const IX = KratorInteriors, G = IX.geom;
  const v = new THREE.Vector3();
  function localBox(g, p) {
    g.updateMatrixWorld(true);
    const c = Math.cos(p.ry), s = Math.sin(p.ry);
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, y0 = Infinity, y1 = -Infinity, n = 0, nan = false;
    g.traverse(function (o) {
      const geo = o.geometry;
      if (!geo || !geo.attributes || !geo.attributes.position || o.isPoints || o.isLine) return;
      n++;
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
        if (!isFinite(v.x) || !isFinite(v.y) || !isFinite(v.z)) { nan = true; continue; }
        const dx = v.x - p.x, dz = v.z - p.z, lx = dx * c - dz * s, lz = dx * s + dz * c;
        if (lx < x0) x0 = lx; if (lx > x1) x1 = lx; if (lz < z0) z0 = lz; if (lz > z1) z1 = lz;
        if (v.y < y0) y0 = v.y; if (v.y > y1) y1 = v.y;
      }
    });
    return { n: n, nan: nan, x0: x0, x1: x1, z0: z0, z1: z1, y0: y0, y1: y1 };
  }
  function audit() {
    const I = window._interiors, out = { rooms: 0, pieces: 0, usable: 0, reached: 0, fails: [], perRoom: [], fallbacks: 0, missing: [] };
    I.rooms.forEach(function (R, i) {
      const P = I.plans[i];
      const A = IX.audit(R, P, I.catalog);
      const fails = A.fails.slice();
      P.placements.forEach(function (p, k) {
        const g = P.objects && P.objects[k];
        if (!g || g.userData.error) { fails.push({ check: 'builds', msg: R.id + ': ' + p.id + ' ' + p.key + ' did not build' + (g ? ': ' + g.userData.error : '') }); return; }
        const B = localBox(g, p);
        if (!B.n || B.nan) { fails.push({ check: 'builds', msg: R.id + ': ' + p.id + ' ' + p.key + (B.nan ? ' has NaN geometry' : ' has no mesh') }); return; }
        const tw = Math.max(0.06, 0.04 * p.w / 2 * 2), td = Math.max(0.06, 0.04 * p.d), th = Math.max(0.06, 0.04 * p.h);
        if (p.anchor !== 'surface') {
          /* the measured box, shrunk by the tolerance, must sit inside the polygon */

          for (const c of G.corners(r)) if (!G.inside(R.poly, c[0], c[1]))
            fails.push({ check: 'measured-inside', msg: R.id + ': ' + p.id + ' ' + p.key + ' built geometry leaves the room near [' + c[0].toFixed(2) + ', ' + c[1].toFixed(2) + ']' });
        }
        if (B.y0 < R.y - th || B.y1 > R.y + R.h + th)
          fails.push({ check: 'measured-height', msg: R.id + ': ' + p.id + ' ' + p.key + ' built y ' + B.y0.toFixed(2) + '..' + B.y1.toFixed(2) + ' vs room ' + R.y + '..' + (R.y + R.h) });
      });
      out.rooms++; out.pieces += P.placements.length; out.usable += A.usable; out.reached += A.reached;
      out.fallbacks += P.report.fallbacks.length;
      P.report.missing.forEach(function (m) { out.missing.push(R.id + ': ' + m.need + ' (' + m.reason + ')'); });
      out.perRoom.push({ id: R.id, kind: R.kind, culture: R.culture, pieces: P.placements.length, usable: A.usable, reached: A.reached,
        required: P.report.required.map(function (q) { return q.need + ' ' + q.placed + '/' + q.n; }).join(', '),
        fallbacks: P.report.fallbacks.map(function (f) { return f.need + '<-' + f.used; }).join(', '),
        missing: P.report.missing.map(function (m) { return m.need + ':' + m.reason; }).join(', '),
        thin: P.report.thin, fails: fails.length });

    });

  }

  window._interiors.localBox = localBox;
})();
