<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d8dccb;font-family:Georgia,serif}

  #bar{position:fixed;left:14px;top:14px;z-index:30;background:rgba(24,21,15,0.88);color:#f3ecd8;
       border-radius:8px;padding:9px 12px;font-size:12px;max-width:min(560px,calc(100vw - 28px));line-height:1.5}

  #bar select,#bar button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;
       padding:4px 8px;font:inherit;font-size:11.5px;margin:3px 3px 0 0;cursor:pointer}

  #bar button.on{background:#c9a227;color:#2a2416}

  #hover{position:fixed;z-index:40;pointer-events:none;display:none;background:rgba(24,21,15,0.92);color:#f3ecd8;
       border-radius:6px;padding:6px 9px;font:12px/1.45 Georgia,serif;max-width:340px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
  #hover b{font-size:13px}
  #hover .cls{color:#9fe8ff;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  #hover .tag{display:inline-block;background:rgba(184,232,160,.16);color:#b8e8a0;border-radius:3px;padding:0 5px;margin:2px 3px 0 0;font-size:11px}
  #poly{position:fixed;right:14px;bottom:112px;z-index:35;display:none;background:rgba(24,21,15,0.9);color:#f3ecd8;
       border-radius:8px;padding:8px 10px;font:12px/1.45 Georgia,serif;width:min(420px,calc(100vw - 28px))}
  #poly textarea{width:100%;box-sizing:border-box;height:64px;margin:5px 0;background:rgba(255,255,255,0.08);color:#f3ecd8;
       border:none;border-radius:4px;font:11px ui-monospace,monospace}
  #poly button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;padding:3px 8px;
       font:inherit;font-size:11.5px;margin:0 3px 3px 0;cursor:pointer}
  #poly .n{opacity:.7;font-size:11px}
  #errs{position:fixed;right:10px;top:10px;max-width:60vw;max-height:30vh;overflow:auto;background:rgba(120,0,0,.88);color:#fff;

<body>
<div id="app"></div>
<div id="bar">
  <b>Krator motor vehicles</b> <span class="n" id="count"></span><br>
  <select id="rowSel"><option value="">go to vehicle…</option></select>
  <button id="driveBtn" title="R: drive (the wheels roll, the front pair steers)">Drive (R)</button>

  <button id="hoverBtn" title="T: hover inspector (name, culture, tags, data)">Hover tags (T)</button>

world x,z in metres</span><textarea id="polyout" readonly></textarea><div class="n" id="polynear"></div>
<button id="polycopy">Copy</button><button id="polyclose">Close loop</button><button id="polyundo">Undo</button><button id="polyclear">Clear</button><button id="polyfmt">Format: [x,z]</button></div>
<div id="hover"></div>
<pre id="errs"></pre>
<script>
/* error panel: verify.py fails the run when this has any text */
(function(){
  const el=document.getElementById('errs');
  window.reportErr=function(m){el.style.display='block';el.textContent+=String(m).slice(0,600)+'\n';};
  window.onerror=function(m,s,l,c,e){reportErr((e&&e.stack)||(m+' @'+l+':'+c));};
  window.addEventListener('unhandledrejection',function(e){reportErr('promise: '+(e.reason&&e.reason.stack||e.reason));});
  const ce=console.error.bind(console);
  console.error=function(){ce.apply(null,arguments);reportErr([].map.call(arguments,function(a){return a&&a.stack?a.stack:String(a);}).join(' '));};
})();
document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"'+(location.protocol==='file:'?'':' crossorigin="anonymous"')+'><\/script>');
</script>
<script>if(!window.THREE)document.write('<script src="../three.min.js"><\/script>');</script>
<script>
/* ---------- krator-asset-engine.js ---------- */
/* ======================================================================
   Krator Asset Engine
   Shared contract + geometry kit for the ASSET (building) / FURN / PLANT
   registries harvested from Voth, Iziz, Mav's Refuge, Girder, Yuni and the
   Ancients kit. Include this file (or the equivalent globals from your own
   build) before krator-master-furniture.js, krator-master-plants.js and/or
   krator-master-buildings-*.js.

   (2026-10: the registries, palettes, frame and geometry kit are in
   krator-furniture-core.js, loaded BEFORE this file; this file is the page:
   scene, camera, renderer, controls, ground, labels and the frame loop.)

   Provides: scene/camera/renderer, orbit + WASD/walk camera control, a
   geometry kit (box/cyl/cone/dome/blob/ball/beam/rod/frustum/pyrRoof, and
   decal: a painted canvas panel for emblems and hangings), a
   procedural F.tree() helper, the three registries with per-variant
   variantDims support, buildAsset/buildFurn/buildPlant (each returning a
   selectable THREE.Group), rebuildInstance() and measureInstance(), the
   per-culture furniture palette FPAL (F.col / F.cols / key-aware F.pick and
   F.shade) and the building type vocabulary BUILDING_TYPES.

   Conventions that matter:
     - box/cyl/cone/dome sit with their BOTTOM at y; blob/ball are CENTRED at y.
     - The build frame's origin is the footprint centre on the ground, +z FRONT.
     - F.frustum's r is a HALF-WIDTH: the block spans 2*r. With sides:4 the flat
       faces are square to the frame, so the front face sits at local z = +r.
       It is square in plan and cannot make a rectangular trough — use boxes.
     - F.pyrRoof covers EXACTLY w by d at the eaves and meets at one point;
       F.hipRoof covers the same w by d but rises to a RIDGE along the longer
       side — use it for any roof that is not square.
     - A vertical-axis F.cyl cannot be tilted; use F.rod/F.beam between two
       points for anything leaning, arching or horizontal.
     - For a block placed at (cos a, sin a) * r, ry = -a points its long axis
       RADIALLY; for a tangential ring segment you want ry = -a - PI/2.
     - measureInstance() measures transformed vertices, not Box3.expandByObject,
       which takes the AABB of an AABB and overstates anything rotated off-axis.
   ====================================================================== */

/* ---------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8dccb);
scene.fog = new THREE.Fog(0xc9cdbb, 700, 2800);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 70, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

scene.add(new THREE.HemisphereLight(0xcfd9f2, 0x3d3a2c, 0.42));
const sun = new THREE.DirectionalLight(0xffeccb, 1.55);
sun.position.set(160, 260, 90);
scene.add(sun);
/* low cool fill from the opposite side so unlit faces read as form, not flat white */
const fill = new THREE.DirectionalLight(0x8ea6cc, 0.28);
fill.position.set(-140, 90, -120);
scene.add(fill);

/* subdivided: one 8 km quad interpolates depth badly in software GL (SwiftShader), and
   hid anything within ~3 cm of the ground (labels, rugs, mats) a few metres off the origin */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8000, 8000, 100, 100),
  new THREE.MeshLambertMaterial({ color: 0x9b9472 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(8000, 400, 0x333333, 0x333333);
grid.material.opacity = 0.05;
grid.material.transparent = true;
scene.add(grid);

/* ------------------------------------------------------- camera control
   Minimal self-contained orbit/pan/zoom + WASD fly/walk, no external dependency.
   Two modes share one anchor (ctl.target) and one heading (az/el):
     orbit  — camera sits ctl.dist away, orbiting the anchor
     walk   — camera sits AT the anchor looking along the heading (first person)
   WASD moves the anchor in both, so it pans the sheet in orbit and walks in walk. */
const ctl = {
  target: new THREE.Vector3(0, 6, 0), dist: 150, az: 0.9, el: 0.55,
  dragging: false, panning: false, lastX: 0, lastY: 0,
  walk: false, eyeHeight: 1.7, speed: 1,
  keys: Object.create(null)
};
function _headingVecs() {
  /* fwd = the way the camera faces, flattened to the ground; right = the camera's right hand
     (fwd turned clockwise seen from above: facing -z, right is +x) */
  const fwd = new THREE.Vector3(-Math.sin(ctl.az), 0, -Math.cos(ctl.az));
  const right = new THREE.Vector3(Math.cos(ctl.az), 0, -Math.sin(ctl.az));
  return { fwd, right };
}
function updateCamera() {
  if (ctl.walk) {
    const el = Math.max(-1.35, Math.min(1.35, ctl.el));
    camera.position.copy(ctl.target);
    const dir = new THREE.Vector3(-Math.cos(el) * Math.sin(ctl.az), -Math.sin(el), -Math.cos(el) * Math.cos(ctl.az));
    camera.lookAt(camera.position.clone().add(dir));
  } else {
    const el = Math.max(0.05, Math.min(1.45, ctl.el));
    const x = ctl.target.x + ctl.dist * Math.cos(el) * Math.sin(ctl.az);
    const y = ctl.target.y + ctl.dist * Math.sin(el);
    const z = ctl.target.z + ctl.dist * Math.cos(el) * Math.cos(ctl.az);
    camera.position.set(x, y, z);
    camera.lookAt(ctl.target);
  }
}
updateCamera();
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 2) ctl.panning = true; else ctl.dragging = true;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
});
window.addEventListener('mouseup', () => { ctl.dragging = false; ctl.panning = false; });
window.addEventListener('mousemove', (e) => {
  const dx = e.clientX - ctl.lastX, dy = e.clientY - ctl.lastY;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
  if (ctl.dragging) {
    ctl.az -= dx * 0.006;
    ctl.el += (ctl.walk ? dy * 0.005 : dy * 0.006);     /* walk: drag down to look down, as drag right looks right */
    updateCamera();
  } else if (ctl.panning) {
    const { fwd, right } = _headingVecs();
    const k = ctl.walk ? 0.05 : ctl.dist * 0.0015;
    ctl.target.addScaledVector(right, -dx * k);          /* right-drag pans: the ground follows the pointer */
    ctl.target.addScaledVector(fwd, -dy * k);
    updateCamera();
  }
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  if (ctl.walk) { ctl.speed = Math.max(0.15, Math.min(8, ctl.speed * (1 - e.deltaY * 0.001))); }
  else { ctl.dist = Math.max(3, Math.min(2000, ctl.dist * (1 + e.deltaY * 0.001))); }
  updateCamera(); e.preventDefault();
}, { passive: false });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --------------------------------------------------------- WASD movement */
const _MOVE_KEYS = { w: 1, a: 1, s: 1, d: 1, q: 1, e: 1, ' ': 1, shift: 1, control: 1 };
function _isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}
window.addEventListener('keydown', (e) => {
  if (_isTyping(e)) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  ctl.keys[k] = true;
  if (_MOVE_KEYS[k]) e.preventDefault();
  if (k === 'f') { window._setWalk(!ctl.walk); }
});
window.addEventListener('keyup', (e) => { ctl.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { ctl.keys = Object.create(null); });

window._setWalk = function (on) {
  if (on === ctl.walk) return;
  const { fwd } = _headingVecs();
  if (on) {
    /* step into the scene: stand where the camera was looking, at eye height */
    ctl.target.copy(camera.position);
    ctl.target.y = ctl.eyeHeight;
    ctl.walk = true;
    ctl.el = Math.max(-0.2, Math.min(0.35, ctl.el * 0.3));
  } else {
    ctl.walk = false;
    ctl.dist = Math.max(30, ctl.dist);
    ctl.target.addScaledVector(fwd, ctl.dist * 0.35);
    ctl.target.y = 6;
    ctl.el = 0.55;
  }
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(ctl.walk);
};

let _lastT = performance.now();
function _moveStep(now) {
  const dt = Math.min((now - _lastT) / 1000, 0.1);
  _lastT = now;
  const k = ctl.keys;
  let mx = 0, mz = 0, my = 0;
  if (k['w']) mz += 1;
  if (k['s']) mz -= 1;
  if (k['d']) mx += 1;
  if (k['a']) mx -= 1;
  if (k['e'] || k[' ']) my += 1;
  if (k['q']) my -= 1;
  if (!mx && !mz && !my) return;
  /* base speed: metres/sec. In orbit it scales with how far out you are, so it
     feels the same whether you're reading a whole row or one doorway. */
  let base = ctl.walk ? 9 * ctl.speed : Math.max(12, ctl.dist * 0.55);
  if (k['shift']) base *= 3.4;
  if (k['control'] || k['alt']) base *= 0.28;
  const step = base * dt;
  const { fwd, right } = _headingVecs();
  if (mz) ctl.target.addScaledVector(fwd, mz * step);
  if (mx) ctl.target.addScaledVector(right, mx * step);
  if (my) ctl.target.y += my * step;
  if (ctl.walk) ctl.target.y = Math.max(0.4, ctl.target.y);
  updateCamera();
}

window._gotoRow = function (z, width) {
  ctl.walk = false;
  ctl.target.set(width ? width / 2 - 20 : 0, 6, z);
  ctl.dist = Math.max(70, (width || 140) * 0.7);
  ctl.az = 0.75; ctl.el = 0.55;
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(false);
};

/* --------------------------------------------------------------- labels */
function groundLabel(text, x, z, big) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = big ? 160 : 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = big ? 'rgba(30,26,18,0.92)' : 'rgba(255,255,255,0.88)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = big ? '#f5efdd' : '#20201a';
  ctx.font = (big ? 'bold 64px' : '40px') + ' Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 512, big ? 100 : 82);
  const tex = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(big ? 34 : 15, big ? 5.3 : 1.9);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, big ? 0.08 : 0.06, z);
  scene.add(m);
  return m;
}
function scaleFigure(x, z) {
  mkCyl(x, 0, z, 0.22, 1.5, 0, 0x3a5a7a, 'cloth');
  mkBall(x, 1.68, z, 0.22, 0xe0b090, 'skin');
}

function animate(now) {
  requestAnimationFrame(animate);
  _moveStep(now || performance.now());
  if (window._inspectorTick) window._inspectorTick();
  if (window._frameHooks) for (const fh of window._frameHooks) fh(now || performance.now());
  renderer.render(scene, camera);
}
animate();
/* ---------- 50-vehicles-bundle.js ---------- */
/* kits/motor-vehicles bundle (vehicle_bundle.py): kits/catalog/krator-furniture-core.js, kits/motor-vehicles/vehicles-core.js, kits/motor-vehicles/krator-vehicles-geomancer.js, kits/motor-vehicles/krator-vehicles-runtime.js. GENERATED; edit the kit files. */
var KratorVehicles = (function () {
/* ---- kits/catalog/krator-furniture-core.js ---- */
/* ======================================================================
   Krator Furniture Core: the half of the catalog engine with no page in it
   (split out of krator-asset-engine.js, 2026-10, so any build can carry the
   catalog's furniture). It needs only THREE. It holds TAU and shade(), the
   material cache mat() and its family looks, the geometry kit mk* (mkDecal included: a painted canvas panel; all add
   to _target, else to a global `scene` when one exists), the FURN / PLANT /
   ASSET registries and their vocabularies, CATALOG_MATERIALS, the furniture
   palettes FPAL and furnCol(), the build frame makeFrame(), the instantiation
   helpers buildFurn / buildPlant / buildAsset (which add to the global
   `scene`), rebuildInstance() and measureInstance().
   A catalog page loads this file, then krator-asset-engine.js (the scene,
   camera, controls, labels and frame loop). Another build carries it inside a
   closure with the furniture files (kits/catalog/furniture_bundle.py), so its
   names never meet the host's: kits/catalog/README.md "Furniture in a kit".
   ====================================================================== */
/* ======================================================================
   Krator Master Catalog Engine
   Shared by the master furniture and master plant catalog viewers.
   Provides: scene/camera/renderer setup, a small geometry kit, the
   FURN/PLANT registry contract (same shape as Yuni's own src/53-assets.js),
   and label/layout helpers. Culture-specific FURN(...)/PLANT(...) calls are
   loaded as separate <\x73cript> files after this one.
   ====================================================================== */

const TAU = Math.PI * 2;

function shade(hex, amt) {
  let r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const f = (c) => Math.max(0, Math.min(255, Math.round(c + (amt >= 0 ? (255 - c) * amt : c * amt))));
  return (f(r) << 16) | (f(g) << 8) | f(b);
}


/* ------------------------------------------------------------ material */
const _matCache = new Map();
/* per-family [roughness, metalness]; anything not listed is matte (0.85, 0).
   The furniture kit's cultural materials (nacre, gold, lacquer, glazed ceramic, obsidian, jade)
   read as what they are only through these: CATALOG_MATERIALS below names each. */
const MAT_FAMILY_LOOK = {
  metal: [0.4, 0.7], gold: [0.22, 0.9], bronze: [0.42, 0.75], rust: [0.85, 0.35],
  nacre: [0.18, 0.35], lacquer: [0.22, 0.05], ceramic: [0.3, 0.05], obsidian: [0.12, 0.15], jade: [0.35, 0.05],
  plastic: [0.5, 0.0], bone: [0.6, 0.0]
};
function mat(color, family) {
  const key = color + '|' + (family || '');
  if (_matCache.has(key)) return _matCache.get(key);
  let roughness = 0.85, metalness = 0.0, transparent = false, opacity = 1;
  const fam = MAT_FAMILY_LOOK[family];
  if (fam) { roughness = fam[0]; metalness = fam[1]; }
  else if (family === 'glass') { roughness = 0.05; metalness = 0.1; transparent = true; opacity = 0.55; }
  else if (family === 'glow') { roughness = 1; }
  const m = family === 'glow'
    ? new THREE.MeshBasicMaterial({ color, transparent, opacity })
    : new THREE.MeshStandardMaterial({ color, roughness, metalness, transparent, opacity });
  m.userData.family = family || '';
  _matCache.set(key, m);
  return m;
}

/* ----------------------------------------------------------- geo kit
   All *world*-space; the frame wrapper (F.*) below resolves local -> world.
   Convention: box/cyl/cone/dome sit with their BOTTOM at y; blob/ball are
   CENTRED at y.
   Every primitive goes into _target when one is set, so buildAsset/buildFurn/
   buildPlant can collect an instance's meshes into a single selectable group.
   _target stays null for scenery (ground, labels), which lands straight in the scene. */
let _target = null;
/* level of detail for round primitives: 1 = the catalog's own (every page); a build that places thousands
   of pieces (krator-furniture-runtime.js: KF.setDetail) lowers it, so cylinders, cones, domes, balls and rods
   get fewer segments. Boxes, and frustums of 8 sides or fewer (square and hexagonal blocks), never change. */
let _LOD = 1;
function _seg(n, min) { return _LOD === 1 ? n : Math.max(min, Math.round(n * _LOD)); }
function _add(m) { (_target || scene).add(m); return m; }
function mkBox(x, y, z, w, h, d, ry, color, family) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.02), Math.max(h, 0.02), Math.max(d, 0.02)), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkCyl(x, y, z, r, h, ry, color, family) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r, 0.01), Math.max(r, 0.01), Math.max(h, 0.02), _seg(16, 6)), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkCone(x, y, z, r, h, ry, color, family) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(Math.max(r, 0.01), Math.max(h, 0.02), _seg(14, 6)), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkDome(x, y, z, r, h, ry, color, family) {
  const geo = new THREE.SphereGeometry(Math.max(r, 0.02), _seg(16, 6), _seg(10, 3), 0, TAU, 0, Math.PI / 2);
  geo.scale(1, Math.max(h, 0.02) / Math.max(r, 0.02), 1);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkBlob(x, y, z, r, h, ry, color, family) {
  const geo = new THREE.SphereGeometry(Math.max(r, 0.02), _seg(10, 6), _seg(8, 4));
  geo.scale(1, Math.max(h, 0.02) / (2 * Math.max(r, 0.02)), 1);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkBall(x, y, z, r, color, family) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(r, 0.02), _seg(14, 6), _seg(10, 4)), mat(color, family));
  m.position.set(x, y, z);
  return _add(m);
}
function mkBeam(ax, ay, az, bx, by, bz, w, d, color, family) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.max(Math.hypot(dx, dy, dz), 0.02);
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.02), len, Math.max(d, 0.02)), mat(color, family));

function furnCol(culture, key) {
  if (typeof key === 'number') return key;
  const p = FPAL[culture];
  if (p && p[key] != null) return p[key];

/* local frame: origin at footprint centre on the ground; +z is FRONT */
function makeFrame(x, z, ry, opt) {

  F.cols = (keys) => keys.map(F.col);
  F.pick = (arr) => {
    const v = arr[Math.floor(F.rnd() * arr.length) % arr.length];
    return (typeof v === 'string' && F.asset && FPAL[F.asset.culture] && FPAL[F.asset.culture][v] != null) ? F.col(v) : v;
  };

  F.box = (lx, ly, lz, w, h, d, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkBox(x2, F.y + ly, z2, w, h, d, F.ry + (ry2 || 0), color, family); };

     setFromUnitVectors on the world direction picks the shortest rotation,

  F.beam = (ax, ay, az, bx, by, bz, w, d, color, family) => {

  F.furn = (key, lx, ly, lz, lry, o) => {

  cypress: [0x1e4a28, 0x2a5a34], shrub: [0x556b2f, 0x4a5e28], trunk: [0x5d5140, 0x6a5c48, 0x4e4536, 0x5a4028]

/* A generic tree. Builds an actual woody structure — tapered bole in stacked segments,
   primary limbs, branchlets, and foliage clustered at the limb ends — rather than a
   stick with a ball on it, and tops out at very close to h so the declared height is

    }

    for (let s = 0; s < 2; s++) if (F.chance(0.7)) {
      const a = F.rnd() * TAU;
      F.rod(lx, ly, lz, lx + Math.cos(a) * h * 0.12, ly + h * 0.2, lz + Math.sin(a) * h * 0.12, 0.03 + h * 0.008, bark, 'bark');
    }

  } else if (kind === 'palm') {
    const c = F.pick(PAL.palm);
    /* curving segmented stipe with leaf-scar rings */
    const segs = 6, tilt = F.rr(-0.06, 0.06), top = h * 0.80;
    let x = lx, z = lz, y = ly;
    for (let i = 0; i < segs; i++) {
      const t = i / segs;
      const r = (0.17 + h * 0.012) * (1 - t * 0.35);
      const nx = x + tilt * h * 0.06 * (1 + t), nz = z + tilt * h * 0.03;
      F.rod(x, y, z, nx, y + top / segs, nz, r, i % 2 ? shade(bark, 0.06) : bark, 'bark');
      F.cyl(nx, y + top / segs - h * 0.006, nz, r * 1.18, h * 0.012, 0, shade(bark, -0.12), 'bark');
      x = nx; z = nz; y += top / segs;
    }
    /* fronds: each an arching chain that droops at the tip */
    const nf = 9;
    for (let f = 0; f < nf; f++) {
      const a = (f / nf) * TAU + F.rr(-0.15, 0.15);
      const len = h * F.rr(0.30, 0.40), lift = F.rr(0.10, 0.30) * len;
      const c1x = x + Math.cos(a) * len * 0.38, c1z = z + Math.sin(a) * len * 0.38, c1y = y + lift;
      const c2x = x + Math.cos(a) * len * 0.75, c2z = z + Math.sin(a) * len * 0.75, c2y = y + lift * 1.05;
      const tx = x + Math.cos(a) * len, tz = z + Math.sin(a) * len, ty = y + lift * 0.35;
      const fc = f % 2 ? c : shade(c, 0.08);
      F.beam(x, y, z, c1x, c1y, c1z, h * 0.035, 0.05, fc, 'leafy');
      F.beam(c1x, c1y, c1z, c2x, c2y, c2z, h * 0.055, 0.05, fc, 'leafy');
      F.beam(c2x, c2y, c2z, tx, ty, tz, h * 0.040, 0.04, shade(fc, -0.05), 'leafy');
    }
    /* spent fronds hanging under the crown, and a nut cluster */
    for (let f = 0; f < 3; f++) {
      const a = F.rnd() * TAU, len = h * 0.2;
      F.beam(x, y - h * 0.01, z, x + Math.cos(a) * len * 0.5, y - len * 0.8, z + Math.sin(a) * len * 0.5, h * 0.03, 0.04, shade(bark, 0.12), 'leafy');
    }
    F.ball(x, y - h * 0.03, z, h * 0.045, shade(c, -0.15), 'leafy');
    for (let k = 0; k < 4; k++) F.ball(x + F.rr(-0.4, 0.4) * h * 0.1, y - h * 0.05, z + F.rr(-0.4, 0.4) * h * 0.1, h * 0.022, 0xb8893c, 'leafy');

  } else if (kind === 'shrub') {
    const c = F.pick(PAL.shrub);
    /* a mound built from many stems and tufts rather than one blob */
    const n = 9 + Math.floor(F.rnd() * 5);
    for (let i = 0; i < n; i++) {
      const a = F.rnd() * TAU, rr = F.rr(0.1, 0.95) * h;
      const ex = lx + Math.cos(a) * rr, ez = lz + Math.sin(a) * rr;
      const ey = ly + F.rr(0.35, 1.0) * h * 0.95;
      F.rod(lx + F.rr(-0.1, 0.1) * h, ly, lz + F.rr(-0.1, 0.1) * h, ex, ey, ez, h * 0.035, shade(bark, 0.08), 'bark');
      F.blob(ex, ey, ez, h * F.rr(0.28, 0.45), h * F.rr(0.22, 0.36), F.rnd() * TAU, shade(c, F.rr(-0.08, 0.12)), 'leafy');
    }
    F.blob(lx, ly + h * 0.30, lz, h * 0.62, h * 0.5, 0, shade(c, -0.06), 'leafy');

  } else {
    /* cypress: dense columnar spire, built from stacked tapering tiers */
    const c = F.pick(PAL.cypress), R = h * 0.105 + 0.28;
    F.rod(lx, ly, lz, lx, ly + h * 0.22, lz, 0.12 + h * 0.008, bark, 'bark');
    const tiers = 6;
    for (let i = 0; i < tiers; i++) {
      const t = i / tiers;
      const y = ly + h * (0.08 + 0.80 * t);
      const r = R * (1.05 - 0.75 * t) * F.rr(0.92, 1.08);
      const hh = h * 0.26 * (1 - t * 0.35);
      F.cone(lx + F.rr(-0.06, 0.06) * R, y, lz + F.rr(-0.06, 0.06) * R, r, hh, F.rnd() * TAU,
        i % 2 ? c : shade(c, 0.07), 'leafy');
      /* a few sprigs breaking the outline so it isn't a smooth cone */
      if (F.chance(0.7)) {
        const a = F.rnd() * TAU;
        F.blob(lx + Math.cos(a) * r * 0.9, y + hh * 0.4, lz + Math.sin(a) * r * 0.9, r * 0.3, r * 0.4, 0, shade(c, 0.1), 'leafy');
      }
    }
    F.cone(lx, ly + h * 0.86, lz, R * 0.30, h * 0.16, 0, shade(c, 0.12), 'leafy');
  }
}

/* ---------------------------------------------------------- instantiation
   Each build goes into its own Group so the inspector can pick it, measure it,
   isolate it and rebuild it in place. Groups sit at the origin with an identity
   transform, so the world-space maths in the geo kit is unaffected. */
const INSTANCES = [];
function _buildInstance(kind, registry, key, x, z, ry, opt) {
  const A = registry[key];
  if (!A) { console.error('no such ' + kind, key); return null; }
  opt = opt || {};
  const g = new THREE.Group();
  g.name = kind + ':' + key;
  const prev = _target;
  _target = g;
  const F = makeFrame(x, z, ry, opt);
  F.asset = A;
  let failed = null;
  try { A.build(F); } catch (e) { failed = e; console.error(kind + ' build error', key, e); }
  _target = prev;
  g.userData = {
    kind: kind, key: key, asset: A, x: x, z: z, ry: ry || 0,
    opt: { variant: opt.variant || 0, seed: opt.seed || 1, wealth: opt.wealth == null ? 0.5 : opt.wealth, y: opt.y || 0 },
    error: failed ? String(failed && failed.message || failed) : null,
    furniture: F.furniture || [], missingFurniture: F.missing || []
  };
  scene.add(g);
  INSTANCES.push(g);
  return g;
}
function buildFurn(key, x, z, ry, opt) { return _buildInstance('furniture', FURN_BY_KEY, key, x, z, ry, opt); }
function buildPlant(key, x, z, ry, opt) { return _buildInstance('plant', PLANT_BY_KEY, key, x, z, ry, opt); }
function buildAsset(key, x, z, ry, opt) { return _buildInstance('building', ASSET_BY_KEY, key, x, z, ry, opt); }

/* rebuild an existing instance in place with changed options (variant/seed/wealth) */
function rebuildInstance(g, changes) {
  const u = g.userData;
  const registry = u.kind === 'building' ? ASSET_BY_KEY : (u.kind === 'plant' ? PLANT_BY_KEY : FURN_BY_KEY);
  const opt = Object.assign({}, u.opt, changes || {});
  const i = INSTANCES.indexOf(g);
  if (i >= 0) INSTANCES.splice(i, 1);
  scene.remove(g);
  g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  return _buildInstance(u.kind, registry, u.key, u.x, u.z, u.ry, opt);
}

/* measured world-space size of an instance, and how much of it got built.
   Measures actual transformed VERTICES, not Box3.expandByObject — that takes the
   AABB of each mesh's own AABB, which inflates anything rotated off-axis by up to
   sqrt(2) and would quietly overstate every tapered tower and turned roof here. */
const _mv = new THREE.Vector3();
function measureInstance(g) {
  g.updateMatrixWorld(true);
  const box = new THREE.Box3();
  let meshes = 0, tris = 0;
  g.traverse((o) => {
    const geo = o.geometry;
    if (!geo || !geo.attributes || !geo.attributes.position) return;
    meshes++;
    const idx = geo.index, pos = geo.attributes.position;
    tris += idx ? idx.count / 3 : pos.count / 3;
    for (let i = 0; i < pos.count; i++) {
      _mv.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      box.expandByPoint(_mv);
    }
  });
  if (!meshes || box.isEmpty()) return { empty: true, meshes: 0, tris: 0, w: 0, d: 0, h: 0, box: box };
  const size = box.getSize(new THREE.Vector3());
  return { empty: false, meshes: meshes, tris: Math.round(tris), w: size.x, d: size.z, h: size.y, box: box, min: box.min.clone(), max: box.max.clone() };
}


/* ---- kits/motor-vehicles/vehicles-core.js ---- */
/* ======================================================================
   Krator Motor Vehicles: the kit core (kits/motor-vehicles/vehicles-core.js)

   A VEHICLE({...}) registry on top of the master catalog's engine-neutral core
   (kits/catalog/krator-furniture-core.js: makeFrame(), F.box/cyl/cone/dome/blob/
   ball/beam/rod/frustum, F.col over FPAL, mat(), _target). vehicle_bundle.py
   wraps that core, this file, the culture files (krator-vehicles-<culture>.js)
   and krator-vehicles-runtime.js in ONE closure exposing only `KratorVehicles`,
   so every name here (VEHICLE, VEHICLES, vehicleFrame ...) stays private.

   Why a registry of its own, not the catalog's ASSET: an ASSET is a building
   (its cultures are checked against ASSET_CULTURES, it has districts and
   building types) and is drawn as one static group. A vehicle has MOVING PARTS
   (wheels a host spins and steers, lamps it switches) and SIMULATION DATA (top
   speed, seats, cargo, fuel, wheel layout) that a host reads without drawing
   anything. So: the catalog's frame and primitives for the body, this registry
   for the entry, and the runtime for assembly (body merged per material, each
   wheel its own named child).

   The entry (data first; only build and wheel draw):
     VEHICLE({
       key, name, culture,                 culture: a key of VEHICLE_CULTURES (register with VEHICLE_CULTURE)
       tags: { class:'motor vehicle', type:[...], drive, seats, fuel, terrain:[...] },
       variants, variantNames: [...],
       w, d, h,                            overall box in metres (x across, z along, y up), aerials included
       data: { speed, accel, turnRadius, maxSteer, seats, cargo, mass, fuel, tank, range,
               wheelbase, track, clearance, cageH, drive,
               wheels: [{ name, x, z, r, w, front, steer, drive }] },     (data, not code: a sim reads it)
       variantData: [ {overrides}, ... ],  per variant, merged over data
       lamps: (built, see F.lamp below)
       build(F)                            the body, in the vehicle frame
       wheel(F, W)                         ONE wheel at the origin, axle along x, W = the wheel record + side (+1/-1)
     })
   The vehicle frame: origin at the footprint centre on the ground, +z FORWARD
   (the front), y up, +x the driver's left (three.js yaw: rotation.y > 0 turns +z
   toward +x). Wheels touch y = 0; a wheel's hub is at (W.x, W.r, W.z).
   ====================================================================== */

/* the classes and vocabularies a vehicle's tags are checked against (verify.py --assert) */
const VEHICLE_CLASSES = ['motor vehicle'];
const VEHICLE_TYPES = ['vehicle', 'transport', 'cargo', 'utility', 'patrol', 'survey'];
const VEHICLE_DRIVES = ['wheeled', 'tracked', 'half-track'];
const VEHICLE_FUELS = ['refined oil', 'crude oil', 'battery', 'wood gas', 'alcohol'];
const VEHICLE_TERRAIN = ['sand', 'salt flat', 'track', 'road', 'mud', 'rock', 'snow'];

/* a culture: its palette goes into the catalog core's FPAL (inside this closure only),
   so F.col('paint') resolves against the vehicle's own culture as furniture does */
const VEHICLE_CULTURES = {};
function VEHICLE_CULTURE(key, info) {
  VEHICLE_CULTURES[key] = { name: info.name || key, lore: info.lore || '', sign: info.sign || '' };
  FPAL[key] = Object.assign(FPAL[key] || {}, info.palette || {});
}

const VEHICLES = [], VEHICLE_BY_KEY = {};
function VEHICLE(o) {
  if (VEHICLE_BY_KEY[o.key]) { console.error('duplicate vehicle key', o.key); return; }
  if (!VEHICLE_CULTURES[o.culture]) { console.error('vehicle ' + o.key + ': unregistered culture ' + o.culture); return; }
  o.variants = o.variants || 1;
  o.variantNames = o.variantNames || [];
  o.variantData = o.variantData || [];
  o.data = o.data || {};
  VEHICLES.push(o); VEHICLE_BY_KEY[o.key] = o;
}
/* the data of one variant: the entry's data with that variant's overrides merged on top (wheels copied) */
function vehicleData(A, v) {
  const d = Object.assign({}, A.data, A.variantData[v || 0] || {});
  d.wheels = (d.wheels || []).map(function (w) { return Object.assign({}, w); });
  return d;
}

/* ---------------------------------------------------------------- the vehicle frame
   makeFrame() at the origin plus the helpers a vehicle needs that the furniture frame
   lacks: discs and rings on any axis, bent tube, a triangle (a pennant), a lamp lens
   (recorded as data), and a wheel built into the body (the spare). Everything goes,
   like every catalog primitive, into the core's _target. */
const _vUp = new THREE.Vector3(0, 1, 0), _vDir = new THREE.Vector3();
function _orient(m, ax, ay, az) {
  _vDir.set(ax, ay, az);
  if (_vDir.lengthSq() < 1e-12) _vDir.set(0, 1, 0);
  m.quaternion.setFromUnitVectors(_vUp, _vDir.normalize());
}
/* lamp families: the runtime gives each its own texel of the emissive map (krator-vehicles-runtime.js) */
const VEHICLE_LAMP_FAMILIES = { lamp: 1, lampTail: 2, lampAmber: 3, lampBlue: 4 };
function vehicleFrame(opt) {
  const F = makeFrame(0, 0, 0, opt);
  F.lamps = [];
  /* the vehicle frame always sits at the origin, unturned (the host moves the finished group), so local = world here.
     F.rod is replaced by a leaner one: a vehicle is mostly tube, and the catalog's 8-sided rods would spend half the
     triangle budget on it. Sides by radius: under 2 cm 4, under 6 cm 6, else 8; end caps only from 3.5 cm up (a thin
     tube's ends are buried in the joint it meets, and the caps would be a third of its triangles). */
  F.rod = function (ax, ay, az, bx, by, bz, r, color, family) {
    const dx = bx - ax, dy = by - ay, dz = bz - az, len = Math.max(Math.hypot(dx, dy, dz), 0.01);
    const n = r < 0.02 ? 4 : r < 0.06 ? 6 : 8;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r, 0.004), Math.max(r, 0.004), len, n, 1, r < 0.035), mat(color, family));
    m.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2); _orient(m, dx, dy, dz);
    return _add(m);
  };
  /* a small low-poly ball (a knob, a flame's body): the catalog's ball is 240 triangles */
  F.knob = function (x, y, z, r, color, family) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 5), mat(color, family));
    m.position.set(x, y, z);
    return _add(m);
  };
  /* a solid disc (a short cylinder) of radius r and thickness t, centred at (x, y, z), its axis along (ax, ay, az) */
  F.disc = function (x, y, z, ax, ay, az, r, t, color, family, segs) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, Math.max(t, 0.005), _seg(segs || 12, 5)), mat(color, family));
    m.position.set(x, y, z); _orient(m, ax, ay, az);
    return _add(m);
  };
  /* a flat one-sided circle of radius r at (x, y, z), facing (ax, ay, az): a lens, a gauge face */
  F.face = function (x, y, z, ax, ay, az, r, color, family, segs) {
    const g = new THREE.CircleGeometry(r, segs || 10);
    g.rotateX(-Math.PI / 2);                              /* the circle faces +z; now +y, then oriented */
    const m = new THREE.Mesh(g, mat(color, family));
    m.position.set(x, y, z); _orient(m, ax, ay, az);
    return _add(m);
  };
  /* a frustum on any axis: radius r0 at the start, r1 at the end, length len from (x, y, z) along the axis */
  F.taper = function (x, y, z, ax, ay, az, r0, r1, len, color, family, segs) {
    const g = new THREE.CylinderGeometry(Math.max(r1, 0.003), Math.max(r0, 0.003), len, _seg(segs || 10, 5));
    g.translate(0, len / 2, 0);
    const m = new THREE.Mesh(g, mat(color, family));
    m.position.set(x, y, z); _orient(m, ax, ay, az);
    return _add(m);
  };
  /* a ring (torus) of radius r and tube radius tube, centred at (x, y, z), its axis along (ax, ay, az) */
  F.ring = function (x, y, z, ax, ay, az, r, tube, color, family, segs) {
    const g = new THREE.TorusGeometry(r, tube, 3, _seg(segs || 10, 6));
    g.rotateX(Math.PI / 2);                               /* torus axis: z -> y, then oriented */
    const m = new THREE.Mesh(g, mat(color, family));
    m.position.set(x, y, z); _orient(m, ax, ay, az);
    return _add(m);
  };
  /* bent tube: a rod between each pair of points (the rods' end caps close the joints) */
  F.tube = function (pts, r, color, family) {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      F.rod(a[0], a[1], a[2], b[0], b[1], b[2], r, color, family);
    }
  };
  /* a flat triangle, both faces (a pennant): corners a, b, c */
  F.tri = function (a, b, c, color, family) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([].concat(a, b, c, a, c, b), 3));
    g.computeVertexNormals();
    return _add(new THREE.Mesh(g, mat(color, family)));
  };
  /* a lamp: a housing and a lens facing (dx, dy, dz) at (x, y, z), the lens centre recorded in F.lamps.
     kind: 'head' (family lamp), 'tail' (lampTail), 'bar' (lamp), 'amber' (lampAmber), 'cell' (lampBlue) */
  F.lamp = function (x, y, z, dx, dy, dz, r, kind, housing, bezel) {
    const fam = kind === 'tail' ? 'lampTail' : kind === 'amber' ? 'lampAmber' : kind === 'cell' ? 'lampBlue' : 'lamp';
    const lens = kind === 'tail' ? 'lensRed' : kind === 'amber' ? 'lensAmber' : kind === 'cell' ? 'glowBlue' : 'lensWarm';
    const n = Math.hypot(dx, dy, dz) || 1, ux = dx / n, uy = dy / n, uz = dz / n;
    if (housing != null) F.taper(x - ux * r * 1.6, y - uy * r * 1.6, z - uz * r * 1.6, ux, uy, uz, r * 0.7, r * 1.15, r * 1.6, housing, 'metal', 8);
    if (bezel != null) F.disc(x - ux * r * 0.02, y - uy * r * 0.02, z - uz * r * 0.02, ux, uy, uz, r * 1.2, r * 0.1, bezel, 'metal', 8);
    F.face(x + ux * r * 0.04, y + uy * r * 0.04, z + uz * r * 0.04, ux, uy, uz, r, F.col(lens), fam, 10);
    F.lamps.push({ x: x + ux * r * 0.1, y: y + uy * r * 0.1, z: z + uz * r * 0.1, dx: ux, dy: uy, dz: uz, kind: kind || 'head' });
  };
  /* a wheel of this vehicle built INTO the body (a spare), hub at (x, y, z), axle along (ax, ay, az) */
  F.spareWheel = function (x, y, z, ax, ay, az, W) {
    const g = new THREE.Group(), prev = _target;
    _target = g;
    try { F.asset.wheel(F, Object.assign({ side: 1, spare: true }, W)); } finally { _target = prev; }
    g.position.set(x, y, z);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), new THREE.Vector3(ax, ay, az).normalize());
    return _add(g);
  };
  return F;
}

/* ---------------------------------------------------------------- shared wheel builder
   A balloon sand tyre with chunky chevron lugs, a dished rim and hub, axle along x, hub at the
   origin. Culture files call it from their wheel(F, W) with their own colours and counts.
   o: { r (overall, lugs included), w (tread width), lugs (per row), lugH, rim (radius), side (+1 left / -1 right),
        tyre, rimCol, hubCol, nutCol: colours; nuts (count, default none); segs (around the tyre) }                                         */
function vehicleBalloonTyre(o) {
  const r = o.r, w = o.w, lh = o.lugs ? o.lugH : 0, rt = r - lh, hw = w / 2, side = o.side || 1;
  const segs = _seg(o.segs || 16, 8);
  /* the tyre: a lathe profile (radius, axial position), round-shouldered like a low-pressure sand tyre */
  const P = [], rb = o.rim * 1.04;
  const prof = [[rb, -hw * 0.86], [rt - w * 0.28, -hw * 1.0], [rt - w * 0.06, -hw * 0.9],
    [rt, -hw * 0.45], [rt, hw * 0.45], [rt - w * 0.06, hw * 0.9], [rt - w * 0.28, hw * 1.0], [rb, hw * 0.86]];
  for (const p of prof) P.push(new THREE.Vector2(p[0], p[1]));
  const tg = new THREE.LatheGeometry(P, segs);
  tg.rotateZ(-Math.PI / 2);                            /* lathe axis y -> x */
  _add(new THREE.Mesh(tg, mat(o.tyre, 'rubber')));
  /* chunky lugs: two staggered rows of blocks, angled into a chevron; one lug sits at the bottom, so the wheel touches y = -r */
  if (o.lugs) {
    const n = o.lugs, lw = w * 0.44, lt = (TAU * rt / n) * 0.42;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + i * TAU / n;                 /* i = 0 straight down */
      for (const s of [-1, 1]) {
        const a2 = a + (s > 0 ? TAU / n / 2 : 0);
        const m = new THREE.Mesh(new THREE.BoxGeometry(lw, lh * 2, lt), mat(o.tyre, 'rubber'));
        /* radial at angle a2: Rx(a2) takes the box's y (its height) to (0, cos a2, sin a2); Ry, applied first,
           yaws the block about that radial axis, opposite ways in the two rows: the chevron */
        m.position.set(s * w * 0.24, Math.cos(a2) * rt, Math.sin(a2) * rt);
        m.rotation.order = 'XYZ'; m.rotation.x = a2; m.rotation.y = s * 0.32;
        _add(m);
      }
    }
  }
  /* the rim: an open drum, a dished face toward the outside (side), a hub cone; nuts only when asked */
  const rimW = w * 0.80;
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(o.rim, o.rim, rimW, _seg(12, 8), 1, true), mat(o.rimCol, 'metal'));
  drum.rotation.z = Math.PI / 2; _add(drum);
  /* the dish: one face, looking outward (a circle faces +z; turned to face +x or -x) */
  const face = new THREE.Mesh(new THREE.CircleGeometry(o.rim, _seg(12, 8)), mat(o.rimCol, 'metal'));
  face.rotation.y = side * Math.PI / 2; face.position.x = side * rimW * 0.12; _add(face);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(o.rim * 0.30, o.rim * 0.42, rimW * 0.5, 6), mat(o.hubCol, 'metal'));
  hub.rotation.z = -side * Math.PI / 2; hub.position.x = side * rimW * 0.34; _add(hub);
  if (o.nutCol != null) for (let i = 0; i < (o.nuts || 0); i++) {

/* ---------- 90-sheet.js ---------- */
/* ======================== Motor vehicles kit sheet ========================
   Lays out every registered vehicle, every variant, in labelled rows on the catalog
   engine's scene (kits/catalog/krator-asset-engine.js), built ONLY through the bundle's
   public API (KratorVehicles.build), exactly as a host world builds them. Each row is
   one vehicle; each variant stands at ry = 0 (+z forward), wheels on y = 0, with a
   1.75 m figure beside the row for scale.
   Toolbar: Drive (R) rolls every wheel and swings the front pair; Lights (L) switches
   the lamps; Night (N) darkens the sky to judge them.
   Exposes window._sheet (rows, instances, view(i, kind), setDrive, setLights, setNight)
   and sets window._ready.
   ====================================================================== */
const INSTANCES = [];
(function () {
  'use strict';
  const KV = KratorVehicles;
  const GAP = 2.2;

  /* --- labels on the ground */
  function label(text, sub, x, z, w, dark) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = sub ? 112 : 72;
    const g = c.getContext('2d');
    g.fillStyle = dark ? 'rgba(30,26,18,0.94)' : 'rgba(58,52,40,0.86)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = dark ? '#e0c98a' : '#f5efdd';
    g.textAlign = 'center';
    let fs = 40;
    g.font = (dark ? 'bold ' : '') + fs + 'px Georgia, serif';
    while (g.measureText(text).width > 490 && fs > 14) { fs -= 2; g.font = (dark ? 'bold ' : '') + fs + 'px Georgia, serif'; }
    g.fillText(text, 256, 50);
    if (sub) { g.font = '26px Georgia, serif'; g.globalAlpha = 0.7; g.fillText(sub, 256, 92); }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * c.height / c.width), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.03, z);
    scene.add(m);
    return m;
  }
  /* a 1.75 m figure for scale (plain THREE: the page has no catalog core of its own) */
  function figure(x, z) {
    const g = new THREE.Group(), cloth = new THREE.MeshStandardMaterial({ color: new THREE.Color(0x6a4a2c).convertSRGBToLinear(), roughness: 0.9 });
    const skin = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xc89a74).convertSRGBToLinear(), roughness: 0.8 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 1.45, 10), cloth); body.position.y = 0.725; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 8), skin); head.position.y = 1.62; g.add(head);
    g.position.set(x, 0, z); g.name = 'scale-figure';
    scene.add(g);
    return g;
  }

  /* --- lay out: rows run along +x; vehicles stack toward -z */
  const rows = [];
  let z = 0, maxW = 0;
  for (const E of KV.list()) {
    let x = 0, depth = E.d;
    const placed = [];
    figure(-1.2, z);
    for (let v = 0; v < E.variants; v++) {
      const cx = x + E.w / 2;
      const g = KV.build(E.key, { variant: v, seed: 1 });
      g.position.set(cx, 0, z);
      g.userData.x = cx; g.userData.z = z; g.userData.ry = 0;
      scene.add(g); INSTANCES.push(g); placed.push(g);
      label(E.name + ' #' + (v + 1) + (E.variantNames[v] ? ' ' + E.variantNames[v] : ''),
        E.culture + ' · ' + KV.dataOf(E.key, v).seats + ' seats · ' + g.userData.tris + ' tris', cx, z + E.d / 2 + 0.7, Math.max(E.w * 1.4, 2.6), false);
      x += E.w + GAP;
    }
    label(E.name, E.culture + ' · ' + E.variants + ' variants', -5.5, z, 5, true);
    rows.push({ key: E.key, title: E.name, z: z, width: x, depth: depth, instances: placed });
    maxW = Math.max(maxW, x);
    z -= depth + 4;
  }

  /* --- the standard Krator sky (vendored 81-sky.js), fixed at mid-morning; Night drops it to 21:30 */
  let hour = 10.5;
  const hemi = scene.children.filter(function (o) { return o.isHemisphereLight; })[0];
  const base = { sun: sun.intensity, fill: fill.intensity, hemi: hemi ? hemi.intensity : 0, exp: renderer.toneMappingExposure };
  if (window.KratorSky) {
    KratorSky.attach(scene, 4200);
    KratorSky.update(camera.position, hour, 200, 1.6);
    scene.fog.color.copy(KratorSky.lighting().fog);
  }
  let night = false;
  function setNight(on) {
    night = !!on; hour = night ? 21.5 : 10.5;
    sun.intensity = night ? 0.03 : base.sun; fill.intensity = night ? 0.05 : base.fill;
    if (hemi) hemi.intensity = night ? 0.12 : base.hemi;
    scene.background = new THREE.Color(night ? 0x0c0f18 : 0xd8dccb);
    if (window.KratorSky) { KratorSky.update(camera.position, hour, 200, 1.6); scene.fog.color.copy(KratorSky.lighting().fog); }
    document.getElementById('nightBtn').classList.toggle('on', night);
  }

  /* --- drive and lights */
  let drive = false, lightsOn = false, t0 = 0;
  function setDrive(on) { drive = !!on; document.getElementById('driveBtn').classList.toggle('on', drive); }
  function setLights(on) {
    lightsOn = !!on;
    for (const g of INSTANCES) KV.lights(g, lightsOn);
    document.getElementById('lightsBtn').classList.toggle('on', lightsOn);
  }
  (window._frameHooks = window._frameHooks || []).push(function (now) {
    if (window.KratorSky) KratorSky.update(camera.position, hour, 200, 1.6);
    if (!drive) { t0 = now; return; }
    const dt = Math.min((now - t0) / 1000, 0.1); t0 = now;
    for (const g of INSTANCES) { KV.roll(g, 4 * dt); KV.steer(g, 0.45 * Math.sin(now / 900)); }
  });

  /* --- toolbar */
  document.getElementById('count').textContent = KV.list().length + ' vehicles · ' + INSTANCES.length + ' instances · cultures: ' + KV.cultures().join(', ');
  const rs = document.getElementById('rowSel');
  rows.forEach(function (r, i) { const o = document.createElement('option'); o.value = String(i); o.textContent = r.title; rs.appendChild(o); });
  rs.onchange = function () { gotoRow(+rs.value); };
  document.getElementById('driveBtn').onclick = function () { setDrive(!drive); };
  document.getElementById('lightsBtn').onclick = function () { setLights(!lightsOn); };
  document.getElementById('nightBtn').onclick = function () { setNight(!night); };
  window.addEventListener('keydown', function (e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const k = e.key.toLowerCase();
    if (k === 'r') setDrive(!drive); else if (k === 'l') setLights(!lightsOn); else if (k === 'n') setNight(!night);
  });

  function showAll() { for (const g of INSTANCES) g.visible = true; }
  function gotoRow(i) {
    const r = rows[i];
    if (!r) return;
    showAll();
    if (ctl.walk) window._setWalk(false);
    ctl.target.set(r.width / 2 - GAP / 2, 0.9, r.z);
    ctl.dist = Math.max(8, r.width * 0.9);
    ctl.az = 0.5; ctl.el = 0.32;
    updateCamera();
  }
  /* one vehicle, close and alone (its neighbours hidden until the next gotoRow or showAll):
     kind = front34 | side | rear34 | front | top */
  const VIEWS = { front34: [0.75, 0.22, 6.4], side: [Math.PI / 2, 0.08, 6.8], rear34: [Math.PI - 0.75, 0.25, 6.4],
    front: [0, 0.12, 6.4], top: [0.3, 1.3, 7] };
  function view(i, kind) {
    const g = INSTANCES[i], V = VIEWS[kind] || VIEWS.front34;
    if (!g) return null;
    if (ctl.walk) window._setWalk(false);
    for (const o of INSTANCES) o.visible = o === g;
    ctl.target.set(g.position.x, 1.0, g.position.z);
    ctl.az = V[0]; ctl.el = V[1]; ctl.dist = V[2];
    updateCamera();
    return g.userData.key + ' #' + (g.userData.variant + 1);
  }
  if (rows.length) gotoRow(0);

  window._sheet = { rows: rows, instances: INSTANCES, width: maxW, gotoRow: gotoRow, view: view, showAll: showAll, views: Object.keys(VIEWS),
    setDrive: setDrive, setLights: setLights, setNight: setNight };
  window._ready = true;
})();
/* ---------- 92-hover.js ---------- */
/* ======================== Hover inspector ========================
   Hover inspector (repo README "DEV TOOLS"): toggle with T or the toolbar button.
   When on, the pointer names the vehicle under it: name, variant, class, culture,
   its tags, and the simulation data a host reads (speed, seats, cargo, fuel, wheels).
   Adapted from kits/catalog/src/92-hover.js for vehicle groups (userData from
   KratorVehicles.build). Off by default.
   ====================================================================== */
(function () {
  'use strict';
  const tip = document.getElementById('hover');
  const btn = document.getElementById('hoverBtn');
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let on = false, pending = null;

  function tagsOf(u) {
    const T = u.tags || {}, D = u.data || {}, t = ['culture: ' + u.culture];
    for (const k of Object.keys(T)) t.push(k + ': ' + (Array.isArray(T[k]) ? T[k].join(', ') : T[k]));
    t.push('top speed ' + D.speed + ' m/s', 'seats ' + D.seats, 'cargo ' + D.cargo + ' kg', 'tank ' + D.tank + ' L',
      'wheels ' + (u.wheels || []).length + ' (' + (D.drive || '?') + ' drive)', u.tris + ' tris');
    return t;
  }
  function describe(g) {
    const u = g.userData;
    return '<div class="cls">' + ((u.tags && u.tags.class) || 'vehicle') + '</div><b>' + u.name + '</b>' +
      ' <span style="opacity:.6">#' + (u.variant + 1) + (u.variantName ? ' ' + u.variantName : '') + '</span>' +
      '<br>' + tagsOf(u).map(s => '<span class="tag">' + s + '</span>').join('');
  }
  function pick(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(INSTANCES, true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o && INSTANCES.indexOf(o) < 0) o = o.parent;
    return o;
  }
  function setOn(v) {
    on = v; btn.classList.toggle('on', on);
    if (!on) tip.style.display = 'none';
  }
  renderer.domElement.addEventListener('mousemove', function (e) {
    if (!on) return;
    pending = [e.clientX, e.clientY];
  });
  (window._frameHooks = window._frameHooks || []).push(function () {
    if (!on || !pending) return;
    const [x, y] = pending; pending = null;
    const g = pick(x, y);
    if (!g) { tip.style.display = 'none'; return; }
    tip.innerHTML = describe(g);
    tip.style.display = 'block';
    tip.style.left = Math.min(x + 16, innerWidth - 360) + 'px';
    tip.style.top = (y + 16) + 'px';
  });
  btn.onclick = function () { setOn(!on); };
  window.addEventListener('keydown', function (e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 't') setOn(!on);
  });
  window._hover = { setOn: setOn, describe: describe, tagsOf: tagsOf };
})();
/* ---------- 93-polygon.js ---------- */
/* ======================== Polygon tool ========================
   Polygon tool (repo README "DEV TOOLS"), the mechanism of the settlements'
   92-camera.js: toggle with P or the toolbar button, click the ground to lay
   a vertex, right-click to drop the last one. The panel holds copy-pasteable
   world coordinates ([x,z] or {x:,z:}), the format kits/interiors ROOM() takes
   for `poly`. It also names the nearest vehicle and the last vertex in that
   vehicle's local frame (+z forward), for placing things against it.
   (Copied from kits/catalog/src/93-polygon.js; only the nearest-instance line differs.)
   While it is on, a click adds a vertex instead of selecting in the inspector.
   ====================================================================== */
(function () {
  'use strict';
  const POLY = { on: false, pts: [], fmt: 0, grp: new THREE.Group() };
  scene.add(POLY.grp);
  const panel = document.getElementById('poly'), out = document.getElementById('polyout');
  const near = document.getElementById('polynear'), btn = document.getElementById('polyBtn');
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xff5060 }), lineMat = new THREE.LineBasicMaterial({ color: 0xffe060 });
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  const r2 = (t) => Math.round(t * 100) / 100;

  function nearest(x, z) {
    let best = null, bd = 1e9;
    for (const g of INSTANCES) {
      const u = g.userData, dd = Math.hypot(u.x - x, u.z - z);
      if (dd < bd) { bd = dd; best = g; }
    }
    return best;
  }
  function redraw() {
    while (POLY.grp.children.length) POLY.grp.remove(POLY.grp.children[0]);
    for (const p of POLY.pts) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), dotMat);
      m.position.set(p[0], 0.3, p[1]); POLY.grp.add(m);
    }
    if (POLY.pts.length > 1) {
      const geo = new THREE.BufferGeometry().setFromPoints(POLY.pts.map(p => new THREE.Vector3(p[0], 0.05, p[1])));
      POLY.grp.add(new THREE.Line(geo, lineMat));
    }
    const f = p => POLY.fmt ? '{x:' + r2(p[0]) + ',z:' + r2(p[1]) + '}' : '[' + r2(p[0]) + ',' + r2(p[1]) + ']';
    out.value = '[' + POLY.pts.map(f).join(',') + ']';
    const last = POLY.pts[POLY.pts.length - 1], g = last && nearest(last[0], last[1]);
    if (g) {
      const u = g.userData, c = Math.cos(u.ry), s = Math.sin(u.ry), dx = last[0] - u.x, dz = last[1] - u.z;
      /* inverse of the frame's toWorld: lx = dx cos - dz sin, lz = dx sin + dz cos */
      near.textContent = 'nearest: ' + u.key + ' #' + (u.variant + 1) + ' — last vertex in its frame: [' +
        r2(dx * c - dz * s) + ',' + r2(dx * s + dz * c) + ']';
    } else near.textContent = '';
    window._poly = POLY.pts.slice();
  }
  function add(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) { POLY.pts.push([hit.x, hit.z]); redraw(); }
  }
  function setOn(v) {
    POLY.on = v; btn.classList.toggle('on', v); panel.style.display = v ? 'block' : 'none'; POLY.grp.visible = v;
  }
  /* a click (not a drag) adds or removes a vertex; captured before the inspector's own mouseup */
  let down = null;
  renderer.domElement.addEventListener('mousedown', (e) => { down = [e.clientX, e.clientY, e.button]; }, true);
  renderer.domElement.addEventListener('mouseup', (e) => {
    if (!POLY.on || !down) return;
    const click = Math.abs(e.clientX - down[0]) < 4 && Math.abs(e.clientY - down[1]) < 4;
    down = null;
    if (!click) return;
    if (e.button === 0) add(e.clientX, e.clientY);
    else if (e.button === 2) { POLY.pts.pop(); redraw(); }
    e.stopImmediatePropagation();
    ctl.dragging = false; ctl.panning = false;
  }, true);
  btn.onclick = () => setOn(!POLY.on);
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 'p') setOn(!POLY.on);
  });
  document.getElementById('polyundo').onclick = () => { POLY.pts.pop(); redraw(); };
  document.getElementById('polyclear').onclick = () => { POLY.pts = []; redraw(); };
  document.getElementById('polyclose').onclick = () => { if (POLY.pts.length > 2) { POLY.pts.push(POLY.pts[0].slice()); redraw(); } };
  document.getElementById('polyfmt').onclick = (e) => { POLY.fmt ^= 1; e.target.textContent = POLY.fmt ? 'Format: {x,z}' : 'Format: [x,z]'; redraw(); };
  document.getElementById('polycopy').onclick = () => {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (err) { document.execCommand('copy'); }
  };
  window._polyTool = { setOn: setOn, add: add, state: POLY };
})();
