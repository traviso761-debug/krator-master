  `;
  document.head.appendChild(css);

  const panel = document.createElement('div');
  panel.id = 'insp';
  panel.innerHTML = '<div class="hd"><b>Inspector</b><span>click an object</span></div><div class="bd"></div>';
  document.body.appendChild(panel);
  const body = panel.querySelector('.bd');
  const hdNote = panel.querySelector('.hd span');
  panel.querySelector('.hd').onclick = () => panel.classList.toggle('collapsed');

  const nav = document.createElement('div');
  nav.id = 'nav';
  document.body.appendChild(nav);

  /* -------------------------------------------------------------- state */
  const S = {
    sel: null,          /* selected instance group */
    measured: null,
    boxHelper: null,
    footprint: null,
    ruler: null,
    isolate: false,
    wireframe: false,
    showBox: true,
    hidden: [],         /* objects hidden by isolate */
    auditRows: null
  };

  /* ------------------------------------------------------------ helpers */
  function kindLabel(g) {
    const A = g.userData.asset;
    if (g.userData.kind === 'plant') return A.climate + ' / ' + A.aridity;
    if (g.userData.kind === 'building') return (A.culture || '') + ' · ' + (A.family || '');
    return A.culture + (A.type ? ' · ' + A.type : '') + (A.setting ? ' · ' + A.setting : '') +
      (A.rooms ? '<br>rooms: ' + A.rooms.join(', ') : (A.room ? ' · ' + A.room : '')) +
      (A.anchor ? '<br>anchor: ' + A.anchor : '') + (A.materials ? '<br>materials: ' + A.materials.join(', ') : '');
  }
  function pctClass(p) { const a = Math.abs(p); return a < 10 ? 'ok' : (a < 25 ? 'warn' : 'bad'); }
  function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }

  function clearHelpers() {
    for (const k of ['boxHelper', 'footprint', 'ruler']) {
      if (S[k]) { scene.remove(S[k]); S[k] = null; }
    }
  }

  /* the measured bounding box, and the box the entry SAYS it occupies, drawn
     together on the ground so a mismatch is visible rather than theoretical */
  function drawHelpers() {
    clearHelpers();
    if (!S.sel || !S.showBox) return;
    const m = S.measured;
    if (!m || m.empty) return;

    S.boxHelper = new THREE.Box3Helper(m.box, new THREE.Color(0xffcf4a));
    if (S.boxHelper.material) { S.boxHelper.material.depthTest = false; S.boxHelper.material.transparent = true; }
    scene.add(S.boxHelper);

    const u = S.sel.userData;
    const dims = entryDims(u.asset, u.opt.variant);
    const hw = dims.w / 2, hd = dims.d / 2, y = 0.05;
    const c = Math.cos(u.ry), s = Math.sin(u.ry);
    const corners = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd], [-hw, -hd]].map(p => {
      /* same local->world mapping the build frame uses */
      const x = u.x + p[0] * c + p[1] * s;
      const z = u.z - p[0] * s + p[1] * c;
      return new THREE.Vector3(x, y, z);
    });
    const geo = new THREE.BufferGeometry().setFromPoints(corners);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x5ab0e0, depthTest: false, transparent: true }));
    S.footprint = line;
    scene.add(line);

    /* a 10 m graduated pole beside the selection, so height reads honestly */
    const ruler = new THREE.Group();
    const rx = m.max.x + 1.2, rz = m.min.z;
    for (let i = 0; i < 10; i++) {
      const band = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 1, 0.16),
        new THREE.MeshBasicMaterial({ color: i % 2 ? 0xf0efe6 : 0x2b2721 })
      );
      band.position.set(rx, i + 0.5, rz);
      ruler.add(band);
    }
    S.ruler = ruler;
    scene.add(ruler);
  }

  /* ----------------------------------------------------------- selection */
  function select(g, focusIt) {
    if (S.isolate) setIsolate(false);
    S.sel = g;
    S.measured = g ? measureInstance(g) : null;
    drawHelpers();
    render();
    if (g && focusIt) focus();
  }

  function focus() {
    if (!S.sel || !S.measured || S.measured.empty) return;
    const m = S.measured;
    const c = m.box.getCenter(new THREE.Vector3());
    const size = Math.max(m.w, m.d, m.h);
    if (ctl.walk) {
      /* stand back from it at eye height rather than flying to the centre */
      ctl.target.set(c.x, ctl.eyeHeight, c.z + size * 1.1 + 3);
      ctl.az = 0; ctl.el = 0.1;
    } else {
      ctl.target.copy(c);
      ctl.dist = Math.max(size * 2.0, 6);
    }
    updateCamera();
  }

  function setIsolate(on) {
    if (on === S.isolate) return;
    S.isolate = on;
    if (on && S.sel) {
      S.hidden = [];
      for (const o of scene.children) {
        if (o === S.sel || o === S.boxHelper || o === S.footprint || o === S.ruler) continue;
        if (o.isLight || o === ground || o === grid) continue;
        if (o.visible) { o.visible = false; S.hidden.push(o); }
      }
    } else {
      for (const o of S.hidden) o.visible = true;
      S.hidden = [];
    }
    render();
  }

  function setWireframe(on) {
    S.wireframe = on;
    _matCache.forEach((m) => { m.wireframe = on; });
    render();
  }

  function rebuild(changes) {
    if (!S.sel) return;
    const wasIsolated = S.isolate;
    if (wasIsolated) setIsolate(false);
    const g = rebuildInstance(S.sel, changes);
    S.sel = g;
    S.measured = measureInstance(g);
    drawHelpers();
    if (wasIsolated) setIsolate(true);
    render();
  }

  /* --------------------------------------------------------------- audit */
  function runAudit() {
    const rows = [];
    for (const g of INSTANCES) {
      const u = g.userData;
      const m = measureInstance(g);
      const d = entryDims(u.asset, u.opt.variant);
      const dw = d.w ? (m.w / d.w - 1) * 100 : 0;
      const dd = d.d ? (m.d / d.d - 1) * 100 : 0;
      const dh = d.h ? (m.h / d.h - 1) * 100 : 0;
      const worst = [dw, dd, dh].reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0);
      rows.push({ g: g, name: u.asset.name, variant: u.opt.variant, variants: u.asset.variants || 1,
                  worst: worst, dw: dw, dd: dd, dh: dh, meshes: m.meshes });
    }
    rows.sort((a, b) => Math.abs(b.worst) - Math.abs(a.worst));
    S.auditRows = rows;
    render();
    const off = rows.filter(r => Math.abs(r.worst) > 25).length;
    const sparse = rows.filter(r => r.meshes < 8).length;
    console.log('[audit] ' + rows.length + ' instances, ' + off + ' over 25% off declared size, ' + sparse + ' under 8 meshes');
    return rows;
  }

  /* --------------------------------------------------------------- render */
  function render() {
    const sparkle = [];
    if (!S.sel) {
      hdNote.textContent = 'click an object';
      body.innerHTML =
        '<input type="search" id="inspq" placeholder="Search by name or key…">' +
        '<div class="row"><button data-act="audit">Audit sizes</button>' +
        '<button data-act="wire" class="' + (S.wireframe ? 'on' : '') + '">Wireframe</button></div>' +
        (S.auditRows ? auditHtml() : '<div class="hint">Click any object in the sheet to inspect it: its declared size against what it actually builds, its variants, and its mesh count.<br><br>' +
          '<b>WASD</b> move · <b>Q/E</b> down/up · <b>Shift</b> sprint · <b>F</b> walk mode<br>' +
          'Drag orbit · right-drag pan · scroll zoom</div>');
      wire();
      return;
    }
    const u = S.sel.userData, A = u.asset, m = S.measured;
    const d = entryDims(A, u.opt.variant);
    const dw = d.w ? (m.w / d.w - 1) * 100 : 0;
    const dd = d.d ? (m.d / d.d - 1) * 100 : 0;
    const dh = d.h ? (m.h / d.h - 1) * 100 : 0;
    hdNote.textContent = u.kind;

    body.innerHTML =
      '<h3>' + A.name + (A.variants > 1 ? ' <span style="opacity:.55;font-size:12px">' + (u.opt.variant + 1) + '/' + A.variants + '</span>' : '') + '</h3>' +
      '<div class="key">' + u.key + '</div>' +
      '<div class="meta">' + kindLabel(S.sel) +
        (A.districts && A.districts.length ? '<br>districts: ' + A.districts.join(', ') : '') +
        (A.wealth ? '<br>wealth band: ' + A.wealth[0] + '–' + A.wealth[1] : '') + '</div>' +
      '<table>' +
        '<tr><td class="l">declared</td><td class="n">' + d.w + ' × ' + d.d + ' × ' + d.h + ' m</td></tr>' +
        '<tr><td class="l">measured</td><td class="n">' + fmt(m.w) + ' × ' + fmt(m.d) + ' × ' + fmt(m.h) + ' m</td></tr>' +
        '<tr><td class="l">difference</td><td class="n">' +
          '<span class="' + pctClass(dw) + '">' + (dw >= 0 ? '+' : '') + dw.toFixed(0) + '%</span> ' +
          '<span class="' + pctClass(dd) + '">' + (dd >= 0 ? '+' : '') + dd.toFixed(0) + '%</span> ' +
          '<span class="' + pctClass(dh) + '">' + (dh >= 0 ? '+' : '') + dh.toFixed(0) + '%</span></td></tr>' +
        '<tr><td class="l">meshes</td><td class="n">' + m.meshes + ' <span style="opacity:.5">(' + m.tris.toLocaleString() + ' tris)</span></td></tr>' +
        '<tr><td class="l">sits at</td><td class="n">y = ' + fmt(m.min.y) + '</td></tr>' +
        '<tr><td class="l">seed</td><td class="n">' + u.opt.seed + '</td></tr>' +
      '</table>' +
      '<div class="row">' +
        (A.variants > 1 ? '<button data-act="prev">‹ variant</button><button data-act="next">variant ›</button>' : '') +
        '<button data-act="reseed">Re-seed</button>' +
      '</div>' +
      (u.kind === 'building' ? '<div style="margin-bottom:8px"><div style="opacity:.6;font-size:11px;margin-bottom:2px">wealth ' +
        u.opt.wealth.toFixed(2) + '</div><input type="range" id="inspw" min="0" max="1" step="0.05" value="' + u.opt.wealth + '"></div>' : '') +
      '<div class="row">' +
        '<button data-act="focus">Zoom to</button>' +
        '<button data-act="iso" class="' + (S.isolate ? 'on' : '') + '">Isolate</button>' +
        '<button data-act="box" class="' + (S.showBox ? 'on' : '') + '">Bounds</button>' +
        '<button data-act="wire" class="' + (S.wireframe ? 'on' : '') + '">Wireframe</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-act="v1">Front</button><button data-act="v2">Side</button>' +
        '<button data-act="v3">Top</button><button data-act="v4">Iso</button>' +
        '<button data-act="walkto">Walk here</button>' +
      '</div>' +
      '<div class="row"><button data-act="clear">Deselect</button><button data-act="audit">Audit sizes</button></div>' +
      (S.auditRows ? auditHtml() : '');
    wire();
  }

  function auditHtml() {
    const rows = S.auditRows.slice(0, 60);
    return '<div style="opacity:.6;font-size:11px;margin-top:6px">worst size mismatches — click to inspect</div><div class="list">' +
      rows.map((r, i) =>
        '<div data-audit="' + i + '"><span class="g">' + r.name + (r.variants > 1 ? ' #' + (r.variant + 1) : '') + '</span>' +
        '<span class="v ' + pctClass(r.worst) + '">' + (r.worst >= 0 ? '+' : '') + r.worst.toFixed(0) + '%</span>' +
        '<span class="v" style="opacity:.45">' + r.meshes + 'm</span></div>').join('') +
      '</div>';
  }

  function setView(az, el) {
    ctl.walk = false;
    ctl.az = az; ctl.el = el;
    if (window._onWalkChange) window._onWalkChange(false);
    focus(); updateCamera(); navRender();
  }

  function wire() {
    body.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const a = b.getAttribute('data-act');
        const u = S.sel && S.sel.userData;
        if (a === 'prev') rebuild({ variant: (u.opt.variant - 1 + u.asset.variants) % u.asset.variants });
        else if (a === 'next') rebuild({ variant: (u.opt.variant + 1) % u.asset.variants });
        else if (a === 'reseed') rebuild({ seed: Math.floor(Math.random() * 9999) + 1 });
        else if (a === 'focus') focus();
        else if (a === 'iso') setIsolate(!S.isolate);
        else if (a === 'box') { S.showBox = !S.showBox; drawHelpers(); render(); }
        else if (a === 'wire') setWireframe(!S.wireframe);
        else if (a === 'v1') setView(0, 0.08);
        else if (a === 'v2') setView(Math.PI / 2, 0.08);
        else if (a === 'v3') setView(0, 1.44);
        else if (a === 'v4') setView(0.75, 0.55);
        else if (a === 'walkto') { if (!ctl.walk) window._setWalk(true); focus(); navRender(); }
        else if (a === 'clear') select(null);
        else if (a === 'audit') runAudit();
      };
    });
    body.querySelectorAll('[data-audit]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); select(S.auditRows[+el.getAttribute('data-audit')].g, true); };
    });
    const w = body.querySelector('#inspw');
    if (w) w.oninput = () => rebuild({ wealth: parseFloat(w.value) });
    const q = body.querySelector('#inspq');
    if (q) {
      q.oninput = () => {
        const t = q.value.trim().toLowerCase();
        if (t.length < 2) return;
        const hit = INSTANCES.find(g => g.userData.key.toLowerCase().includes(t) ||
          (g.userData.asset.name || '').toLowerCase().includes(t));
        if (hit) { const keep = q.value; select(hit, true); const q2 = body.querySelector('#inspq'); if (q2) { q2.value = keep; q2.focus(); } }
      };
    }
  }

  function navRender() {
    nav.innerHTML = ctl.walk
      ? '<span class="mode">WALK</span> eye 1.7 m<br><b>WASD</b> walk · <b>Q/E</b> down/up<br><b>Shift</b> run · <b>scroll</b> speed<br>drag to look · <b>F</b> back to orbit'
      : '<span class="mode">ORBIT</span><br><b>WASD</b> pan · <b>Q/E</b> down/up<br><b>Shift</b> fast · <b>scroll</b> zoom<br>drag orbit · right-drag pan · <b>F</b> walk';
  }
  window._onWalkChange = navRender;
  navRender();

  /* ----------------------------------------------------------- picking */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let downX = 0, downY = 0;
  renderer.domElement.addEventListener('mousedown', (e) => { downX = e.clientX; downY = e.clientY; });
  renderer.domElement.addEventListener('mouseup', (e) => {
    if (e.button !== 0) return;
    if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return; /* was a drag */
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(INSTANCES, true);
    if (!hits.length) { select(null); return; }
    let o = hits[0].object;
    while (o && INSTANCES.indexOf(o) < 0) o = o.parent;
    if (o) select(o, e.detail > 1);
  });

  /* ------------------------------------------------------------- keys */
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const k = e.key.toLowerCase();
    if (k === 'escape') select(null);
    else if (k === 'i') setIsolate(!S.isolate);
    else if (k === 'g') setWireframe(!S.wireframe);
    else if (k === 'b') { S.showBox = !S.showBox; drawHelpers(); render(); }
    else if (k === 'z') focus();
    else if (k === 'r' && S.sel) rebuild({ seed: Math.floor(Math.random() * 9999) + 1 });
    else if (k === '[' && S.sel && S.sel.userData.asset.variants > 1) {
      const u = S.sel.userData; rebuild({ variant: (u.opt.variant - 1 + u.asset.variants) % u.asset.variants });
    } else if (k === ']' && S.sel && S.sel.userData.asset.variants > 1) {
      const u = S.sel.userData; rebuild({ variant: (u.opt.variant + 1) % u.asset.variants });
    } else if (k === '1') setView(0, 0.08);
    else if (k === '2') setView(Math.PI / 2, 0.08);
    else if (k === '3') setView(0, 1.44);
    else if (k === '4') setView(0.75, 0.55);
    else if (k === 'h') { panel.classList.toggle('collapsed'); nav.style.display = nav.style.display === 'none' ? '' : 'none'; }
  });

  /* keep the selection highlight pinned to the object if it moves/rebuilds */
  window._inspectorTick = function () { /* helpers are static; hook kept for future use */ };

  window._inspect = { select: select, audit: runAudit, state: S };
  render();
})();

/* ======================== h3 hash for KratorSky ========================
   h3: the hash KratorSky (81-sky.js, vendored from settlements/iziz/src)
   reads for its star field and gas-giant bands. In the Ancients-lineage
   builds it lives in 10-core.js; the catalog has no core, so it is here.
   ====================================================================== */
function h3(x, y, z) { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); }
/* ---------- 81-sky.js ---------- */
// ================================================================= KratorSky — the Krator skybox module (from claude/krator-sky.html, verbatim logic)
// Canon (krator-notes): tidally-locked moon of a Neptune–Saturn-class giant, 24 h day, ~40° S, giant fixed at
// altitude 25° azimuth 66° (NE, over Korona), obliquity ~23°, eclipse seasons round each equinox.
// Coordinates: x = east, y = up, z = south (north is −z). Azimuth clockwise from north.
// A target that wants it calls KratorSky.attach(scene,R) once and KratorSky.update(camPos,hour,day,dens) per frame,
// then applies KratorSky.lighting() to its sun / hemi / fog. A target that does not call attach pays nothing.
const KratorSky=(function(){
 const D=Math.PI/180;const LAT=-40*D,OBL=23*D,YEAR=360;
 const GIANT_ALT=25*D,GIANT_AZ=66*D,GIANT_ANG=14*D;
 const giantDir=new THREE.Vector3(Math.sin(GIANT_AZ)*Math.cos(GIANT_ALT),Math.sin(GIANT_ALT),-Math.cos(GIANT_AZ)*Math.cos(GIANT_ALT));
 function sunDir(hour,day){const dec=OBL*Math.sin(2*Math.PI*(day-80)/YEAR);const H=(hour-12)*15*D;
  const e=-Math.cos(dec)*Math.sin(H),n=Math.sin(dec)*Math.cos(LAT)-Math.cos(dec)*Math.sin(LAT)*Math.cos(H),u=Math.sin(dec)*Math.sin(LAT)+Math.cos(dec)*Math.cos(LAT)*Math.cos(H);
  return new THREE.Vector3(e,u,-n).normalize();}
 function altAz(v){return{alt:Math.asin(v.y)/D,az:((Math.atan2(v.x,-v.z)/D)+360)%360};}
 const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sun:{value:new THREE.Vector3(0,1,0)},giant:{value:giantDir.clone()},dens:{value:1.6},ecl:{value:0},night:{value:0}},

/* ======================== Catalog contact sheet ========================
   Catalog contact sheet
   Lays out every registered FURN / PLANT / ASSET entry, every variant, in
   labelled rows on the engine's own scene. ?sheet=furniture|plants|buildings
   shows one section; no parameter (or ?sheet=all) shows all three, stacked
   front to back. Each instance is built at ry = 0, so local axes are world
   axes and verify.py can audit it against its declared box directly.
   Exposes window._catalog (rows, sections, audit()) and sets window._ready.
   ====================================================================== */
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const SHEETS = ['all', 'furniture', 'plants', 'buildings'];
  let sheet = (qs.get('sheet') || 'all').toLowerCase();
  if (SHEETS.indexOf(sheet) < 0) sheet = 'all';

  /* --- labels: a ground plane sized to its slot, readable from the default orbit */
  const _labelCache = new Map();
  function labelTex(text, sub, dark) {
    const k = text + '|' + (sub || '') + '|' + (dark ? 1 : 0);
    if (_labelCache.has(k)) return _labelCache.get(k);
    const c = document.createElement('canvas');
    c.width = 512; c.height = sub ? 112 : 72;
    const g = c.getContext('2d');
    g.fillStyle = dark ? 'rgba(30,26,18,0.94)' : 'rgba(58,52,40,0.86)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = dark ? '#e0c98a' : '#f5efdd';
    g.textAlign = 'center';
    let fs = 40;
    g.font = (dark ? 'bold ' : '') + fs + 'px Georgia, serif';
    while (g.measureText(text).width > 490 && fs > 14) { fs -= 2; g.font = (dark ? 'bold ' : '') + fs + 'px Georgia, serif'; }
    g.fillText(text, 256, 50);
    if (sub) { g.font = '26px Georgia, serif'; g.globalAlpha = 0.7; g.fillText(sub, 256, 92); }

    _labelCache.set(k, t);

    const tex = labelTex(text, sub, dark);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * aspect),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.03, z);
    m.userData.label = true;
    scene.add(m);
    return m;
  }

  /* --- grouping */
  function groups(kind) {
    const out = [];
    if (kind === 'furniture') {
      for (const c of FURN_CULTURES) {
        const list = FURNS.filter(A => A.culture === c)
          .sort((a, b) => (a.type || '').localeCompare(b.type || '') || a.key.localeCompare(b.key));
        if (list.length) out.push({ title: 'Furniture · ' + c, items: list });
      }
    } else if (kind === 'plants') {
      for (const c of PLANT_CLIMATES) for (const a of PLANT_ARIDITY) {
        const list = PLANTS.filter(A => A.climate === c && A.aridity === a).sort((x, y) => x.key.localeCompare(y.key));
        if (list.length) out.push({ title: 'Plants · ' + c + ' / ' + a, items: list });
      }
    } else {
      for (const c of ASSET_CULTURES) {
        const list = ASSETS.filter(A => A.culture === c)
          .sort((x, y) => (x.family || '').localeCompare(y.family || '') || x.key.localeCompare(y.key));
        if (list.length) out.push({ title: 'Buildings · ' + c, items: list });

  const GAP = { furniture: 1.6, plants: 2.5, buildings: 6 };

      for (const A of grp.items) {

          const d = entryDims(A, v);

          if (g) placed.push(g);

          label(nm, subLine(kind, A), cx, z + 0.25 + Math.min(slot, 8) * 0.07, Math.min(slot, 8), false);
          x += slot + GAP[kind];
          depth = Math.max(depth, d.d);

      KratorSky.update(camera.position, 10.5, 200, 1.6);
    });
  }

  /* --- toolbar */
  const count = document.getElementById('count');
  const per = {};
  for (const g of INSTANCES) per[g.userData.kind] = (per[g.userData.kind] || 0) + 1;
  count.textContent = FURNS.length + ' furniture · ' + PLANTS.length + ' plants · ' + ASSETS.length +
    ' buildings — ' + INSTANCES.length + ' instances';
  const ss = document.getElementById('sheetSel');
  for (const s of SHEETS) {
    const o = document.createElement('option'); o.value = s; o.textContent = 'sheet: ' + s;
    if (s === sheet) o.selected = true; ss.appendChild(o);
  }
  ss.onchange = function () { location.search = ss.value === 'all' ? '' : '?sheet=' + ss.value; };
  const rs = document.getElementById('rowSel');
  rows.forEach(function (r, i) {
    const o = document.createElement('option'); o.value = String(i); o.textContent = r.title; rs.appendChild(o);
  });
  /* frame the first stretch of a row, close enough to read its pieces */
  function gotoRow(i) {
    const r = rows[i];
    if (!r) return;
    if (ctl.walk) window._setWalk(false);
    const span = Math.min(r.width, r.kind === 'furniture' ? 40 : 120);
    ctl.target.set(span / 2, Math.min(r.depth, 8) * 0.3, r.z - r.depth / 2);
    ctl.dist = Math.max(10, span * 0.75);

  /* --- start on the first row */
  if (rows.length) gotoRow(0);

  window._catalog = { sheet: sheet, rows: rows, sections: sections, width: maxW, perKind: per, gotoRow: gotoRow };
  window._ready = true;
})();

/* ======================== Hover inspector ========================
   Hover inspector (repo README "DEV TOOLS"): toggle with T or the toolbar
   button. When on, the pointer names the instance under it, its class
   (furniture / flora / building) and its tags. Off by default; the click
   inspector (inspector.js) is always available for measuring and auditing.
   ====================================================================== */
(function () {
  'use strict';

  const btn = document.getElementById('hoverBtn');
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let on = false, pending = null;
  const CLASS = { furniture: 'furniture', plant: 'flora', building: 'building' };

  function tagsOf(u) {
    const A = u.asset, t = [];
    if (u.kind === 'furniture') {
      t.push('culture: ' + A.culture);
      if (A.type) t.push('type: ' + A.type);
      if (A.setting) t.push(A.setting);
      if (A.rooms) t.push('rooms: ' + A.rooms.join(', '));
      if (A.anchor) t.push('anchor: ' + A.anchor);
      if (A.materials) t.push('materials: ' + A.materials.join(', '));
    } else if (u.kind === 'plant') {
      t.push('climate: ' + A.climate, 'aridity: ' + A.aridity);
    } else {
      t.push('culture: ' + A.culture, 'family: ' + (A.family || '?'));
      if (A.types && A.types.length) t.push('types: ' + A.types.join(', '));
      if (A.districts && A.districts.length) t.push('districts: ' + A.districts.join(', '));
    }
    return t;
  }
  function describe(g) {
    const u = g.userData, A = u.asset;
    return '<div class="cls">' + (CLASS[u.kind] || u.kind) + '</div><b>' + A.name + '</b>' +
      (A.variants > 1 ? ' <span style="opacity:.6">#' + (u.opt.variant + 1) + '/' + A.variants + '</span>' : '') +
      '<br>' + tagsOf(u).map(s => '<span class="tag">' + s + '</span>').join('');
  }
  function pick(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(INSTANCES, true);
    if (!hits.length) return null;

    tip.innerHTML = describe(g);
    tip.style.display = 'block';
    tip.style.left = Math.min(x + 16, innerWidth - 360) + 'px';
    tip.style.top = (y + 16) + 'px';

})();

  scene.add(POLY.grp);
  const panel = document.getElementById('poly'), out = document.getElementById('polyout');
  const near = document.getElementById('polynear'), btn = document.getElementById('polyBtn');
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xff5060 }), lineMat = new THREE.LineBasicMaterial({ color: 0xffe060 });
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  const r2 = (t) => Math.round(t * 100) / 100;

  function nearest(x, z) {
    let best = null, bd = 1e9;
    for (const g of INSTANCES) {
      const u = g.userData, dd = Math.hypot(u.x - x, u.z - z);
      if (dd < bd) { bd = dd; best = g; }
    }
    return best;
  }
  function redraw() {
    while (POLY.grp.children.length) POLY.grp.remove(POLY.grp.children[0]);
    for (const p of POLY.pts) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), dotMat);
      m.position.set(p[0], 0.3, p[1]); POLY.grp.add(m);
    }
    if (POLY.pts.length > 1) {
      const geo = new THREE.BufferGeometry().setFromPoints(POLY.pts.map(p => new THREE.Vector3(p[0], 0.05, p[1])));
      POLY.grp.add(new THREE.Line(geo, lineMat));
    }
    const f = p => POLY.fmt ? '{x:' + r2(p[0]) + ',z:' + r2(p[1]) + '}' : '[' + r2(p[0]) + ',' + r2(p[1]) + ']';
    out.value = '[' + POLY.pts.map(f).join(',') + ']';
    const last = POLY.pts[POLY.pts.length - 1], g = last && nearest(last[0], last[1]);
    if (g) {
      const u = g.userData, c = Math.cos(u.ry), s = Math.sin(u.ry), dx = last[0] - u.x, dz = last[1] - u.z;
      /* inverse of the frame's toWorld: lx = dx cos - dz sin, lz = dx sin + dz cos */
      near.textContent = 'nearest: ' + u.key + ' #' + (u.opt.variant + 1) + ' — last vertex in its frame: [' +
        r2(dx * c - dz * s) + ',' + r2(dx * s + dz * c) + ']';
    } else near.textContent = '';
    window._poly = POLY.pts.slice();
  }
  function add(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) { POLY.pts.push([hit.x, hit.z]); redraw(); }
  }
  function setOn(v) {
    POLY.on = v; btn.classList.toggle('on', v); panel.style.display = v ? 'block' : 'none'; POLY.grp.visible = v;
  }
  /* a click (not a drag) adds or removes a vertex; captured before the inspector's own mouseup */
  let down = null;
  renderer.domElement.addEventListener('mousedown', (e) => { down = [e.clientX, e.clientY, e.button]; }, true);
  renderer.domElement.addEventListener('mouseup', (e) => {
    if (!POLY.on || !down) return;
    const click = Math.abs(e.clientX - down[0]) < 4 && Math.abs(e.clientY - down[1]) < 4;
    down = null;
    if (!click) return;
    if (e.button === 0) add(e.clientX, e.clientY);
    else if (e.button === 2) { POLY.pts.pop(); redraw(); }
    e.stopImmediatePropagation();
    ctl.dragging = false; ctl.panning = false;
  }, true);
  btn.onclick = () => setOn(!POLY.on);
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 'p') setOn(!POLY.on);
  });
  document.getElementById('polyundo').onclick = () => { POLY.pts.pop(); redraw(); };
  document.getElementById('polyclear').onclick = () => { POLY.pts = []; redraw(); };
  document.getElementById('polyclose').onclick = () => { if (POLY.pts.length > 2) { POLY.pts.push(POLY.pts[0].slice()); redraw(); } };
  document.getElementById('polyfmt').onclick = (e) => { POLY.fmt ^= 1; e.target.textContent = POLY.fmt ? 'Format: {x,z}' : 'Format: [x,z]'; redraw(); };
  document.getElementById('polycopy').onclick = () => {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (err) { document.execCommand('copy'); }
  };
  window._polyTool = { setOn: setOn, add: add, state: POLY };
})();
</script>
</body>
</html>
