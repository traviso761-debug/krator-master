<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krator Catalog</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d8dccb;font-family:Georgia,serif}
  #app{position:fixed;inset:0}
  #bar{position:fixed;left:14px;top:14px;z-index:30;background:rgba(24,21,15,0.88);color:#f3ecd8;
       border-radius:8px;padding:9px 12px;font-size:12px;max-width:min(560px,calc(100vw - 28px));line-height:1.5}
  #bar b{color:#e0c98a;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
  #bar select,#bar button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;
       padding:4px 8px;font:inherit;font-size:11.5px;margin:3px 3px 0 0;cursor:pointer}
  #bar select option{background:#2a2518}
  #bar button.on{background:#c9a227;color:#2a2416}
  #bar .n{opacity:.6;font-size:11px}
  #hover{position:fixed;z-index:40;pointer-events:none;display:none;background:rgba(24,21,15,0.92);color:#f3ecd8;
       border-radius:6px;padding:6px 9px;font:12px/1.45 Georgia,serif;max-width:340px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
  #hover b{font-size:13px}
  #hover .cls{color:#9fe8ff;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  #hover .tag{display:inline-block;background:rgba(184,232,160,.16);color:#b8e8a0;border-radius:3px;padding:0 5px;margin:2px 3px 0 0;font-size:11px}
  #poly{position:fixed;right:14px;bottom:112px;z-index:35;display:none;background:rgba(24,21,15,0.9);color:#f3ecd8;
       border-radius:8px;padding:8px 10px;font:12px/1.45 Georgia,serif;width:min(420px,calc(100vw - 28px))}
  #poly textarea{width:100%;box-sizing:border-box;height:64px;margin:5px 0;background:rgba(255,255,255,0.08);color:#f3ecd8;
       border:none;border-radius:4px;font:11px ui-monospace,monospace}
  #poly button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;padding:3px 8px;
       font:inherit;font-size:11.5px;margin:0 3px 3px 0;cursor:pointer}
  #poly .n{opacity:.7;font-size:11px}
  #errs{position:fixed;right:10px;top:10px;max-width:60vw;max-height:30vh;overflow:auto;background:rgba(120,0,0,.88);color:#fff;
       padding:6px 9px;border-radius:4px;font:12px ui-monospace,monospace;white-space:pre-wrap;display:none;z-index:50}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar">
  <b>Krator catalog</b> <span class="n" id="count"></span><br>
  <select id="sheetSel"></select>
  <select id="rowSel"><option value="">go to row…</option></select>
  <button id="hoverBtn" title="T: hover inspector (name, class, tags)">Hover tags (T)</button>
  <button id="polyBtn" title="P: polygon tool (click the ground for world x,z coordinates)">Polygon (P)</button>
</div>
<div id="poly"><b>Polygon tool</b> <span class="n">click the ground to add a vertex · right-click removes the last ·
world x,z in metres</span><textarea id="polyout" readonly></textarea><div class="n" id="polynear"></div>
<button id="polycopy">Copy</button><button id="polyclose">Close loop</button><button id="polyundo">Undo</button><button id="polyclear">Clear</button><button id="polyfmt">Format: [x,z]</button></div>
<div id="hover"></div>
<pre id="errs"></pre>
<script>
/* error panel: verify.py fails the run when this has any text */
(function(){
  const el=document.getElementById('errs');
  window.reportErr=function(m){el.style.display='block';el.textContent+=String(m).slice(0,600)+'\n';};
  window.onerror=function(m,s,l,c,e){reportErr((e&&e.stack)||(m+' @'+l+':'+c));};
  window.addEventListener('unhandledrejection',function(e){reportErr('promise: '+(e.reason&&e.reason.stack||e.reason));});
  const ce=console.error.bind(console);
  console.error=function(){ce.apply(null,arguments);reportErr([].map.call(arguments,function(a){return a&&a.stack?a.stack:String(a);}).join(' '));};
})();
document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"'+(location.protocol==='file:'?'':' crossorigin="anonymous"')+'><\/script>');
</script>
<script>if(!window.THREE)document.write('<script src="../three.min.js"><\/script>');</script>
<script>
/* ---------- krator-asset-engine.js ---------- */
/* ======================================================================
   Krator Asset Engine
   Shared contract + geometry kit for the ASSET (building) / FURN / PLANT
   registries harvested from Voth, Iziz, Mav's Refuge, Girder, Yuni and the
   Ancients kit. Include this file (or the equivalent globals from your own
   build) before krator-master-furniture.js, krator-master-plants.js and/or
   krator-master-buildings-*.js.

   Provides: scene/camera/renderer, orbit + WASD/walk camera control, a
   geometry kit (box/cyl/cone/dome/blob/ball/beam/rod/frustum/pyrRoof), a
   procedural F.tree() helper, the three registries with per-variant
   variantDims support, buildAsset/buildFurn/buildPlant (each returning a
   selectable THREE.Group), rebuildInstance() and measureInstance(), the
   per-culture furniture palette FPAL (F.col / F.cols / key-aware F.pick and
   F.shade) and the building type vocabulary BUILDING_TYPES.

   Conventions that matter:
     - box/cyl/cone/dome sit with their BOTTOM at y; blob/ball are CENTRED at y.
     - The build frame's origin is the footprint centre on the ground, +z FRONT.
     - F.frustum's r is a HALF-WIDTH: the block spans 2*r. With sides:4 the flat
       faces are square to the frame, so the front face sits at local z = +r.
       It is square in plan and cannot make a rectangular trough — use boxes.
     - F.pyrRoof covers EXACTLY w by d at the eaves and meets at one point;
       F.hipRoof covers the same w by d but rises to a RIDGE along the longer
       side — use it for any roof that is not square.
     - A vertical-axis F.cyl cannot be tilted; use F.rod/F.beam between two
       points for anything leaning, arching or horizontal.
     - For a block placed at (cos a, sin a) * r, ry = -a points its long axis
       RADIALLY; for a tangential ring segment you want ry = -a - PI/2.
     - measureInstance() measures transformed vertices, not Box3.expandByObject,
       which takes the AABB of an AABB and overstates anything rotated off-axis.
   ====================================================================== */

/* ======================================================================
   Krator Master Catalog Engine
   Shared by the master furniture and master plant catalog viewers.
   Provides: scene/camera/renderer setup, a small geometry kit, the
   FURN/PLANT registry contract (same shape as Yuni's own src/53-assets.js),
   and label/layout helpers. Culture-specific FURN(...)/PLANT(...) calls are
   loaded as separate <script> files after this one.
   ====================================================================== */

const TAU = Math.PI * 2;

function shade(hex, amt) {
  let r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const f = (c) => Math.max(0, Math.min(255, Math.round(c + (amt >= 0 ? (255 - c) * amt : c * amt))));
  return (f(r) << 16) | (f(g) << 8) | f(b);
}

/* ---------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8dccb);
scene.fog = new THREE.Fog(0xc9cdbb, 700, 2800);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 70, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

scene.add(new THREE.HemisphereLight(0xcfd9f2, 0x3d3a2c, 0.42));
const sun = new THREE.DirectionalLight(0xffeccb, 1.55);
sun.position.set(160, 260, 90);
scene.add(sun);
/* low cool fill from the opposite side so unlit faces read as form, not flat white */
const fill = new THREE.DirectionalLight(0x8ea6cc, 0.28);
fill.position.set(-140, 90, -120);
scene.add(fill);

/* subdivided: one 8 km quad interpolates depth badly in software GL (SwiftShader), and
   hid anything within ~3 cm of the ground (labels, rugs, mats) a few metres off the origin */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8000, 8000, 100, 100),
  new THREE.MeshLambertMaterial({ color: 0x9b9472 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(8000, 400, 0x333333, 0x333333);
grid.material.opacity = 0.05;
grid.material.transparent = true;
scene.add(grid);

/* ------------------------------------------------------- camera control
   Minimal self-contained orbit/pan/zoom + WASD fly/walk, no external dependency.
   Two modes share one anchor (ctl.target) and one heading (az/el):
     orbit  — camera sits ctl.dist away, orbiting the anchor
     walk   — camera sits AT the anchor looking along the heading (first person)
   WASD moves the anchor in both, so it pans the sheet in orbit and walks in walk. */
const ctl = {
  target: new THREE.Vector3(0, 6, 0), dist: 150, az: 0.9, el: 0.55,
  dragging: false, panning: false, lastX: 0, lastY: 0,
  walk: false, eyeHeight: 1.7, speed: 1,
  keys: Object.create(null)
};
function _headingVecs() {
  /* fwd = the way the camera faces, flattened to the ground; right = fwd rotated -90deg */
  const fwd = new THREE.Vector3(-Math.sin(ctl.az), 0, -Math.cos(ctl.az));
  const right = new THREE.Vector3(-Math.cos(ctl.az), 0, Math.sin(ctl.az));
  return { fwd, right };
}
function updateCamera() {
  if (ctl.walk) {
    const el = Math.max(-1.35, Math.min(1.35, ctl.el));
    camera.position.copy(ctl.target);
    const dir = new THREE.Vector3(-Math.cos(el) * Math.sin(ctl.az), -Math.sin(el), -Math.cos(el) * Math.cos(ctl.az));
    camera.lookAt(camera.position.clone().add(dir));
  } else {
    const el = Math.max(0.05, Math.min(1.45, ctl.el));
    const x = ctl.target.x + ctl.dist * Math.cos(el) * Math.sin(ctl.az);
    const y = ctl.target.y + ctl.dist * Math.sin(el);
    const z = ctl.target.z + ctl.dist * Math.cos(el) * Math.cos(ctl.az);
    camera.position.set(x, y, z);
    camera.lookAt(ctl.target);
  }
}
updateCamera();
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 2) ctl.panning = true; else ctl.dragging = true;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
});
window.addEventListener('mouseup', () => { ctl.dragging = false; ctl.panning = false; });
window.addEventListener('mousemove', (e) => {
  const dx = e.clientX - ctl.lastX, dy = e.clientY - ctl.lastY;
  ctl.lastX = e.clientX; ctl.lastY = e.clientY;
  if (ctl.dragging) {
    ctl.az -= dx * 0.006;
    ctl.el += (ctl.walk ? -dy * 0.005 : dy * 0.006);
    updateCamera();
  } else if (ctl.panning) {
    const { fwd, right } = _headingVecs();
    const k = ctl.walk ? 0.05 : ctl.dist * 0.0015;
    ctl.target.addScaledVector(right, dx * k);
    ctl.target.addScaledVector(fwd, -dy * k);
    updateCamera();
  }
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  if (ctl.walk) { ctl.speed = Math.max(0.15, Math.min(8, ctl.speed * (1 - e.deltaY * 0.001))); }
  else { ctl.dist = Math.max(3, Math.min(2000, ctl.dist * (1 + e.deltaY * 0.001))); }
  updateCamera(); e.preventDefault();
}, { passive: false });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --------------------------------------------------------- WASD movement */
const _MOVE_KEYS = { w: 1, a: 1, s: 1, d: 1, q: 1, e: 1, ' ': 1, shift: 1, control: 1 };
function _isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}
window.addEventListener('keydown', (e) => {
  if (_isTyping(e)) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  ctl.keys[k] = true;
  if (_MOVE_KEYS[k]) e.preventDefault();
  if (k === 'f') { window._setWalk(!ctl.walk); }
});
window.addEventListener('keyup', (e) => { ctl.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { ctl.keys = Object.create(null); });

window._setWalk = function (on) {
  if (on === ctl.walk) return;
  const { fwd } = _headingVecs();
  if (on) {
    /* step into the scene: stand where the camera was looking, at eye height */
    ctl.target.copy(camera.position);
    ctl.target.y = ctl.eyeHeight;
    ctl.walk = true;
    ctl.el = Math.max(-0.2, Math.min(0.35, ctl.el * 0.3));
  } else {
    ctl.walk = false;
    ctl.dist = Math.max(30, ctl.dist);
    ctl.target.addScaledVector(fwd, ctl.dist * 0.35);
    ctl.target.y = 6;
    ctl.el = 0.55;
  }
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(ctl.walk);
};

let _lastT = performance.now();
function _moveStep(now) {
  const dt = Math.min((now - _lastT) / 1000, 0.1);
  _lastT = now;
  const k = ctl.keys;
  let mx = 0, mz = 0, my = 0;
  if (k['w']) mz += 1;
  if (k['s']) mz -= 1;
  if (k['d']) mx += 1;
  if (k['a']) mx -= 1;
  if (k['e'] || k[' ']) my += 1;
  if (k['q']) my -= 1;
  if (!mx && !mz && !my) return;
  /* base speed: metres/sec. In orbit it scales with how far out you are, so it
     feels the same whether you're reading a whole row or one doorway. */
  let base = ctl.walk ? 9 * ctl.speed : Math.max(12, ctl.dist * 0.55);
  if (k['shift']) base *= 3.4;
  if (k['control'] || k['alt']) base *= 0.28;
  const step = base * dt;
  const { fwd, right } = _headingVecs();
  if (mz) ctl.target.addScaledVector(fwd, mz * step);
  if (mx) ctl.target.addScaledVector(right, mx * step);
  if (my) ctl.target.y += my * step;
  if (ctl.walk) ctl.target.y = Math.max(0.4, ctl.target.y);
  updateCamera();
}

window._gotoRow = function (z, width) {
  ctl.walk = false;
  ctl.target.set(width ? width / 2 - 20 : 0, 6, z);
  ctl.dist = Math.max(70, (width || 140) * 0.7);
  ctl.az = 0.75; ctl.el = 0.55;
  updateCamera();
  if (window._onWalkChange) window._onWalkChange(false);
};

/* ------------------------------------------------------------ material */
const _matCache = new Map();
function mat(color, family) {
  const key = color + '|' + (family || '');
  if (_matCache.has(key)) return _matCache.get(key);
  let roughness = 0.85, metalness = 0.0, transparent = false, opacity = 1;
  if (family === 'metal') { roughness = 0.4; metalness = 0.7; }
  else if (family === 'glass') { roughness = 0.05; metalness = 0.1; transparent = true; opacity = 0.55; }
  else if (family === 'glow') { roughness = 1; }
  const m = family === 'glow'
    ? new THREE.MeshBasicMaterial({ color, transparent, opacity })
    : new THREE.MeshStandardMaterial({ color, roughness, metalness, transparent, opacity });
  m.userData.family = family || '';
  _matCache.set(key, m);
  return m;
}

/* ----------------------------------------------------------- geo kit
   All *world*-space; the frame wrapper (F.*) below resolves local -> world.
   Convention: box/cyl/cone/dome sit with their BOTTOM at y; blob/ball are
   CENTRED at y.
   Every primitive goes into _target when one is set, so buildAsset/buildFurn/
   buildPlant can collect an instance's meshes into a single selectable group.
   _target stays null for scenery (ground, labels), which lands straight in the scene. */
let _target = null;
function _add(m) { (_target || scene).add(m); return m; }
function mkBox(x, y, z, w, h, d, ry, color, family) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.02), Math.max(h, 0.02), Math.max(d, 0.02)), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkCyl(x, y, z, r, h, ry, color, family) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r, 0.01), Math.max(r, 0.01), Math.max(h, 0.02), 16), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkCone(x, y, z, r, h, ry, color, family) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(Math.max(r, 0.01), Math.max(h, 0.02), 14), mat(color, family));
  m.position.set(x, y + h / 2, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkDome(x, y, z, r, h, ry, color, family) {
  const geo = new THREE.SphereGeometry(Math.max(r, 0.02), 16, 10, 0, TAU, 0, Math.PI / 2);
  geo.scale(1, Math.max(h, 0.02) / Math.max(r, 0.02), 1);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkBlob(x, y, z, r, h, ry, color, family) {
  const geo = new THREE.SphereGeometry(Math.max(r, 0.02), 10, 8);
  geo.scale(1, Math.max(h, 0.02) / (2 * Math.max(r, 0.02)), 1);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y, z); m.rotation.y = ry || 0;
  return _add(m);
}
function mkBall(x, y, z, r, color, family) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(r, 0.02), 14, 10), mat(color, family));
  m.position.set(x, y, z);
  return _add(m);
}
function mkBeam(ax, ay, az, bx, by, bz, w, d, color, family) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.max(Math.hypot(dx, dy, dz), 0.02);
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.02), len, Math.max(d, 0.02)), mat(color, family));
  m.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, dz).normalize());
  return _add(m);
}
function mkRod(ax, ay, az, bx, by, bz, r, color, family) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.max(Math.hypot(dx, dy, dz), 0.02);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r, 0.005), Math.max(r, 0.005), len, 8), mat(color, family));
  m.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, dz).normalize());
  return _add(m);
}
/* a tapering block/tower segment: HALF-WIDTH rBottom at y, rTop at y+h, i.e. the
   block spans 2*rBottom across at its base — r reads as a radius/half-width in every
   case. sides=4 is a tapered SQUARE block with its faces square to the frame, sides=8
   a tapered octagonal mass, higher for a rounder tower drum.
   (For sides=4 the geometry is a diamond in plan, so it is over-sized by sqrt(2) and
   turned 45 deg to put the faces — not the corners — on the axes.) */
function mkFrustum(x, y, z, rBottom, rTop, h, ry, color, family, sides) {
  const n = sides || 8;
  const k = (n === 4) ? Math.SQRT2 : 1;
  const geo = new THREE.CylinderGeometry(Math.max(rTop, 0.02) * k, Math.max(rBottom, 0.02) * k, Math.max(h, 0.02), n);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y + h / 2, z);
  m.rotation.y = (ry || 0) + (n === 4 ? Math.PI / 4 : 0);
  return _add(m);
}
/* a pyramidal / hip roof covering EXACTLY w (x) by d (z) at its eaves, peak h above y.
   The 4-sided cone is a diamond in plan, so the geometry is turned 45 deg first and
   then scaled, which makes the covered footprint exactly w by d rather than w+d over
   root two — and keeps a non-square roof square to its building. */
function mkPyrRoof(x, y, z, w, h, d, ry, color, family) {
  const geo = new THREE.ConeGeometry(0.5, Math.max(h, 0.02), 4);
  geo.rotateY(Math.PI / 4);
  const k = Math.SQRT2; /* plan extent after the turn is 1/sqrt(2) */
  geo.scale(Math.max(w, 0.02) * k, 1, Math.max(d, 0.02) * k);
  const m = new THREE.Mesh(geo, mat(color, family));
  m.position.set(x, y + h / 2, z);
  m.rotation.y = ry || 0;
  return _add(m);
}

/* a true hip roof: covers EXACTLY w (x) by d (z) at the eaves, rises h to a
   RIDGE along the longer side (ridge length |w - d|), with triangular hipped
   ends. pyrRoof always meets at one point, which reads as a stretched pyramid
   on any long building; use this instead. w == d gives a pyramid. */
function mkHipRoof(x, y, z, w, h, d, ry, color, family) {
  w = Math.max(w, 0.02); d = Math.max(d, 0.02); h = Math.max(h, 0.02);
  const hw = w / 2, hd = d / 2, along = w >= d;
  const r = along ? (w - d) / 2 : (d - w) / 2;
  const A = [-hw, 0, -hd], B = [hw, 0, -hd], C = [hw, 0, hd], D = [-hw, 0, hd];
  const P = along ? [-r, h, 0] : [0, h, -r], Q = along ? [r, h, 0] : [0, h, r];
  const tris = along
    ? [[A, P, Q], [A, Q, B], [D, C, Q], [D, Q, P], [A, D, P], [B, Q, C], [A, B, C], [A, C, D]]
    : [[A, P, B], [B, P, Q], [B, Q, C], [D, Q, P], [D, C, Q], [A, D, P], [A, B, C], [A, C, D]];
  const pos = [];
  tris.forEach((t) => t.forEach((v) => pos.push(v[0], v[1], v[2])));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  /* wind every face outward (normal away from the roof's centre line) */
  const p = geo.attributes.position, a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 3) {
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
    const m = new THREE.Vector3().addVectors(a, b).add(c).divideScalar(3);

/* The furniture entry (kits/furniture/SPEC.md "The entry"):

   Every piece is authored in the FLOOR frame (origin = footprint centre at the
   bottom of the piece, +z front); anchor tells a placer where it mounts:
     floor   — stands on the floor at y = floorY
     wall    — stands at floor level, back face (local z = -d/2) flush to a wall
     ceiling — hangs: its top (local y = h) meets the ceiling, see furnAnchorY()
     surface — stands on a table, shelf or counter top at y = surfaceY

   room always holds rooms[0] for code that still reads it. */

  'ladder', 'board', 'stack', 'brazier', 'book', 'tool'];

  if (!o.culture || FURN_CULTURES.indexOf(o.culture) < 0) { console.error('furniture ' + o.key + ': bad culture ' + o.culture); return; }

/* local frame: origin at footprint centre on the ground; +z is FRONT */
function makeFrame(x, z, ry, opt) {
  opt = opt || {};
  const F = { x, z, ry: ry || 0, y: opt.y || 0, seed: opt.seed || 1, variant: opt.variant || 0, wealth: opt.wealth == null ? 0.5 : opt.wealth };
  let st = (F.seed * 2654435761) >>> 0;
  F.rnd = () => { st = (Math.imul(st, 1664525) + 1013904223) >>> 0; return st / 4294967296; };
  F.rr = (a, b) => a + (b - a) * F.rnd();
  F.col = (key) => furnCol(F.asset ? F.asset.culture : '', key);
  F.cols = (keys) => keys.map(F.col);
  F.pick = (arr) => {
    const v = arr[Math.floor(F.rnd() * arr.length) % arr.length];
    return (typeof v === 'string' && F.asset && FPAL[F.asset.culture] && FPAL[F.asset.culture][v] != null) ? F.col(v) : v;
  };
  F.chance = (p) => F.rnd() < p;

  F.shade = (c, amt) => shade(typeof c === 'string' ? F.col(c) : c, amt); F.TAU = TAU;

    const c = Math.cos(F.ry), s = Math.sin(F.ry);
    return [F.x + lx * c + lz * s, F.z - lx * s + lz * c];

     F.shift(-cx, -cz) first, so its footprint centre lands on the origin. */
  F.shift = (lx, lz) => { const [x2, z2] = toWorld(lx, lz); F.x = x2; F.z = z2; };
  F.box = (lx, ly, lz, w, h, d, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkBox(x2, F.y + ly, z2, w, h, d, F.ry + (ry2 || 0), color, family); };
  F.cyl = (lx, ly, lz, r, h, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkCyl(x2, F.y + ly, z2, r, h, F.ry + (ry2 || 0), color, family); };
  F.cone = (lx, ly, lz, r, h, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkCone(x2, F.y + ly, z2, r, h, F.ry + (ry2 || 0), color, family); };
  F.dome = (lx, ly, lz, r, h, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkDome(x2, F.y + ly, z2, r, h, F.ry + (ry2 || 0), color, family); };
  F.blob = (lx, ly, lz, r, h, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkBlob(x2, F.y + ly, z2, r, h, F.ry + (ry2 || 0), color, family); };
  F.ball = (lx, ly, lz, r, color, family) => { const [x2, z2] = toWorld(lx, lz); mkBall(x2, F.y + ly, z2, r, color, family); };
  F.frustum = (lx, ly, lz, rBottom, rTop, h, ry2, color, family, sides) => { const [x2, z2] = toWorld(lx, lz); mkFrustum(x2, F.y + ly, z2, rBottom, rTop, h, F.ry + (ry2 || 0), color, family, sides); };
  F.pyrRoof = (lx, ly, lz, w, h, d, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkPyrRoof(x2, F.y + ly, z2, w, h, d, F.ry + (ry2 || 0), color, family); };
  F.hipRoof = (lx, ly, lz, w, h, d, ry2, color, family) => { const [x2, z2] = toWorld(lx, lz); mkHipRoof(x2, F.y + ly, z2, w, h, d, F.ry + (ry2 || 0), color, family); };
  /* a beam's roll must come from the LOCAL frame, then turn with the building:
     setFromUnitVectors on the world direction picks the shortest rotation,
     whose roll depends on heading, so a sloped slab (roof, canopy, tent side)
     built at ry = 0 twisted about its own axis at any other ry. Identical at ry = 0. */
  const _bUp = new THREE.Vector3(0, 1, 0), _bDir = new THREE.Vector3(), _bQy = new THREE.Quaternion(), _bAxY = new THREE.Vector3(0, 1, 0);
  F.beam = (ax, ay, az, bx, by, bz, w, d, color, family) => {
    const [ax2, az2] = toWorld(ax, az), [bx2, bz2] = toWorld(bx, bz);
    const m = mkBeam(ax2, F.y + ay, az2, bx2, F.y + by, bz2, w, d, color, family);
    if (F.ry && m) {
      _bDir.set(bx - ax, by - ay, bz - az);
      if (_bDir.lengthSq() > 1e-12) {
        m.quaternion.setFromUnitVectors(_bUp, _bDir.normalize()).premultiply(_bQy.setFromAxisAngle(_bAxY, F.ry));
      }
    }
  };
  F.rod = (ax, ay, az, bx, by, bz, r, color, family) => { const [ax2, az2] = toWorld(ax, az), [bx2, bz2] = toWorld(bx, bz); mkRod(ax2, F.y + ay, az2, bx2, F.y + by, bz2, r, color, family); };
  F.lamp = (lx, ly, lz, amp, rad) => { const [x2, z2] = toWorld(lx, lz); const l = new THREE.PointLight(0xffb066, amp || 1, rad || 10); l.position.set(x2, F.y + ly, z2); _add(l); };
  F.tree = (lx, lz, kind, h, ly) => treeHelper(F, lx, lz, kind, h, ly || 0);
  return F;
}

const PAL = {
  pine: [0x1f3d24, 0x254a2a], olive: [0x6f7d42, 0x7d8a4a], palm: [0x2c8a5e, 0x3a9a68],
  cypress: [0x1e4a28, 0x2a5a34], shrub: [0x556b2f, 0x4a5e28], trunk: [0x5d5140, 0x6a5c48, 0x4e4536, 0x5a4028]
};
/* A generic tree. Builds an actual woody structure — tapered bole in stacked segments,
   primary limbs, branchlets, and foliage clustered at the limb ends — rather than a
   stick with a ball on it, and tops out at very close to h so the declared height is
   the real height. kind: pine | olive | palm | shrub | cypress (default). */
function treeHelper(F, lx, lz, kind, h, ly) {
  h = Math.max(h || 6, 0.5);
  ly = ly || 0;
  const bark = F.pick(PAL.trunk);
  /* a tapering bole in n segments, each leaning a little off the last */
  function bole(baseR, topR, top, n, lean) {
    let x = lx, z = lz, y = ly;
    const segH = top / n;
    for (let i = 0; i < n; i++) {
      const t = i / n, r = baseR + (topR - baseR) * t;
      const nx = x + F.rr(-lean, lean) * h * 0.02, nz = z + F.rr(-lean, lean) * h * 0.02;
      F.rod(x, y, z, nx, y + segH, nz, r, i % 2 ? shade(bark, 0.04) : bark, 'bark');
      x = nx; z = nz; y += segH;
    }
    return { x: x, z: z, y: y, r: topR };
  }
  /* a leafy cluster: a few overlapping blobs, jittered, so the crown has a silhouette */
  function cluster(cx, cy, cz, R, c, n) {
    for (let i = 0; i < (n || 3); i++) {
      const s = i === 0 ? 1 : F.rr(0.5, 0.82);
      F.blob(cx + F.rr(-R, R) * 0.4, cy + F.rr(-R, R) * 0.3, cz + F.rr(-R, R) * 0.4,
        R * s, R * s * F.rr(0.75, 1.0), F.rnd() * TAU, i % 2 ? c : shade(c, F.rr(-0.06, 0.1)), 'leafy');
    }
  }

  if (kind === 'pine') {
    const c = F.pick(PAL.pine);
    const clear = h * 0.40;                         /* bare trunk before the first whorl */
    const top = bole(0.18 + h * 0.020, 0.07 + h * 0.006, h * 0.94, 4, 1);
    /* whorls of limbs, longest low down, carrying needle masses */
    const whorls = 5;
    for (let wi = 0; wi < whorls; wi++) {
      const t = wi / (whorls - 1);
      const y = ly + clear + (h * 0.92 - clear) * t;
      const len = h * (0.30 - 0.20 * t);
      const n = 4 + (wi % 2);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + wi * 0.7 + F.rr(-0.2, 0.2);
        const ex = lx + Math.cos(a) * len, ez = lz + Math.sin(a) * len;
        const ey = y + len * F.rr(0.10, 0.28);
        F.rod(lx, y, lz, ex, ey, ez, 0.05 + h * 0.006, bark, 'bark');
        cluster(ex * 0.96 + lx * 0.04, ey, ez * 0.96 + lz * 0.04, len * 0.42, c, 2);
      }
    }
    F.cone(lx, ly + h * 0.86, lz, h * 0.055 + 0.2, h * 0.16, 0, shade(c, 0.1), 'leafy');
    if (F.chance(0.6)) F.cone(lx + F.rr(-0.3, 0.3), ly, lz + F.rr(-0.3, 0.3), h * 0.05, h * 0.06, 0, shade(bark, -0.1), 'bark');

  } else if (kind === 'olive') {
    const c = F.pick(PAL.olive);
    /* short gnarled bole that forks low into a vase of limbs */
    const top = bole(0.16 + h * 0.055, 0.10 + h * 0.030, h * 0.34, 3, 3);
    const n = 4 + (F.chance(0.5) ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + F.rr(-0.3, 0.3);
      const len = h * F.rr(0.30, 0.44);
      const ex = top.x + Math.cos(a) * len * 0.8, ez = top.z + Math.sin(a) * len * 0.8;
      const ey = top.y + len * F.rr(0.55, 0.95);
      F.rod(top.x, top.y, top.z, ex, ey, ez, 0.06 + h * 0.022, shade(bark, 0.05), 'bark');
      /* two branchlets off each limb, then leaf mass at the tips */
      for (let b = 0; b < 2; b++) {
        const a2 = a + F.rr(-0.8, 0.8);
        const l2 = len * F.rr(0.3, 0.5);
        const bx = ex + Math.cos(a2) * l2, bz = ez + Math.sin(a2) * l2, by = ey + l2 * F.rr(0.1, 0.6);
        F.rod(ex, ey, ez, bx, by, bz, 0.04 + h * 0.010, bark, 'bark');
        cluster(bx, by, bz, h * F.rr(0.13, 0.19), c, 3);
      }
      cluster(ex, ey, ez, h * 0.15, c, 2);
    }
    /* a couple of suckers at the base, as olives do */
    for (let s = 0; s < 2; s++) if (F.chance(0.7)) {
      const a = F.rnd() * TAU;
      F.rod(lx, ly, lz, lx + Math.cos(a) * h * 0.12, ly + h * 0.2, lz + Math.sin(a) * h * 0.12, 0.03 + h * 0.008, bark, 'bark');
    }

  } else if (kind === 'palm') {
    const c = F.pick(PAL.palm);
    /* curving segmented stipe with leaf-scar rings */
    const segs = 6, tilt = F.rr(-0.06, 0.06), top = h * 0.80;
    let x = lx, z = lz, y = ly;
    for (let i = 0; i < segs; i++) {
      const t = i / segs;
      const r = (0.17 + h * 0.012) * (1 - t * 0.35);
      const nx = x + tilt * h * 0.06 * (1 + t), nz = z + tilt * h * 0.03;
      F.rod(x, y, z, nx, y + top / segs, nz, r, i % 2 ? shade(bark, 0.06) : bark, 'bark');
      F.cyl(nx, y + top / segs - h * 0.006, nz, r * 1.18, h * 0.012, 0, shade(bark, -0.12), 'bark');
      x = nx; z = nz; y += top / segs;
    }
    /* fronds: each an arching chain that droops at the tip */
    const nf = 9;
    for (let f = 0; f < nf; f++) {
      const a = (f / nf) * TAU + F.rr(-0.15, 0.15);
      const len = h * F.rr(0.30, 0.40), lift = F.rr(0.10, 0.30) * len;
      const c1x = x + Math.cos(a) * len * 0.38, c1z = z + Math.sin(a) * len * 0.38, c1y = y + lift;
      const c2x = x + Math.cos(a) * len * 0.75, c2z = z + Math.sin(a) * len * 0.75, c2y = y + lift * 1.05;
      const tx = x + Math.cos(a) * len, tz = z + Math.sin(a) * len, ty = y + lift * 0.35;
      const fc = f % 2 ? c : shade(c, 0.08);
      F.beam(x, y, z, c1x, c1y, c1z, h * 0.035, 0.05, fc, 'leafy');
      F.beam(c1x, c1y, c1z, c2x, c2y, c2z, h * 0.055, 0.05, fc, 'leafy');
      F.beam(c2x, c2y, c2z, tx, ty, tz, h * 0.040, 0.04, shade(fc, -0.05), 'leafy');
    }
    /* spent fronds hanging under the crown, and a nut cluster */
    for (let f = 0; f < 3; f++) {
      const a = F.rnd() * TAU, len = h * 0.2;
      F.beam(x, y - h * 0.01, z, x + Math.cos(a) * len * 0.5, y - len * 0.8, z + Math.sin(a) * len * 0.5, h * 0.03, 0.04, shade(bark, 0.12), 'leafy');
    }
    F.ball(x, y - h * 0.03, z, h * 0.045, shade(c, -0.15), 'leafy');
    for (let k = 0; k < 4; k++) F.ball(x + F.rr(-0.4, 0.4) * h * 0.1, y - h * 0.05, z + F.rr(-0.4, 0.4) * h * 0.1, h * 0.022, 0xb8893c, 'leafy');

  } else if (kind === 'shrub') {
    const c = F.pick(PAL.shrub);
    /* a mound built from many stems and tufts rather than one blob */
    const n = 9 + Math.floor(F.rnd() * 5);
    for (let i = 0; i < n; i++) {
      const a = F.rnd() * TAU, rr = F.rr(0.1, 0.95) * h;
      const ex = lx + Math.cos(a) * rr, ez = lz + Math.sin(a) * rr;
      const ey = ly + F.rr(0.35, 1.0) * h * 0.95;
      F.rod(lx + F.rr(-0.1, 0.1) * h, ly, lz + F.rr(-0.1, 0.1) * h, ex, ey, ez, h * 0.035, shade(bark, 0.08), 'bark');
      F.blob(ex, ey, ez, h * F.rr(0.28, 0.45), h * F.rr(0.22, 0.36), F.rnd() * TAU, shade(c, F.rr(-0.08, 0.12)), 'leafy');
    }
    F.blob(lx, ly + h * 0.30, lz, h * 0.62, h * 0.5, 0, shade(c, -0.06), 'leafy');

  } else {
    /* cypress: dense columnar spire, built from stacked tapering tiers */
    const c = F.pick(PAL.cypress), R = h * 0.105 + 0.28;
    F.rod(lx, ly, lz, lx, ly + h * 0.22, lz, 0.12 + h * 0.008, bark, 'bark');
    const tiers = 6;
    for (let i = 0; i < tiers; i++) {
      const t = i / tiers;
      const y = ly + h * (0.08 + 0.80 * t);
      const r = R * (1.05 - 0.75 * t) * F.rr(0.92, 1.08);
      const hh = h * 0.26 * (1 - t * 0.35);
      F.cone(lx + F.rr(-0.06, 0.06) * R, y, lz + F.rr(-0.06, 0.06) * R, r, hh, F.rnd() * TAU,
        i % 2 ? c : shade(c, 0.07), 'leafy');
      /* a few sprigs breaking the outline so it isn't a smooth cone */
      if (F.chance(0.7)) {
        const a = F.rnd() * TAU;
        F.blob(lx + Math.cos(a) * r * 0.9, y + hh * 0.4, lz + Math.sin(a) * r * 0.9, r * 0.3, r * 0.4, 0, shade(c, 0.1), 'leafy');
      }
    }
    F.cone(lx, ly + h * 0.86, lz, R * 0.30, h * 0.16, 0, shade(c, 0.12), 'leafy');
  }
}

/* ---------------------------------------------------------- instantiation
   Each build goes into its own Group so the inspector can pick it, measure it,
   isolate it and rebuild it in place. Groups sit at the origin with an identity
   transform, so the world-space maths in the geo kit is unaffected. */
const INSTANCES = [];
function _buildInstance(kind, registry, key, x, z, ry, opt) {
  const A = registry[key];
  if (!A) { console.error('no such ' + kind, key); return null; }
  opt = opt || {};
  const g = new THREE.Group();
  g.name = kind + ':' + key;
  const prev = _target;
  _target = g;
  const F = makeFrame(x, z, ry, opt);
  F.asset = A;
  let failed = null;
  try { A.build(F); } catch (e) { failed = e; console.error(kind + ' build error', key, e); }
  _target = prev;
  g.userData = {
    kind: kind, key: key, asset: A, x: x, z: z, ry: ry || 0,
    opt: { variant: opt.variant || 0, seed: opt.seed || 1, wealth: opt.wealth == null ? 0.5 : opt.wealth, y: opt.y || 0 },
    error: failed ? String(failed && failed.message || failed) : null
  };
  scene.add(g);
  INSTANCES.push(g);
  return g;
}
function buildFurn(key, x, z, ry, opt) { return _buildInstance('furniture', FURN_BY_KEY, key, x, z, ry, opt); }
function buildPlant(key, x, z, ry, opt) { return _buildInstance('plant', PLANT_BY_KEY, key, x, z, ry, opt); }
function buildAsset(key, x, z, ry, opt) { return _buildInstance('building', ASSET_BY_KEY, key, x, z, ry, opt); }

/* rebuild an existing instance in place with changed options (variant/seed/wealth) */
function rebuildInstance(g, changes) {
  const u = g.userData;
  const registry = u.kind === 'building' ? ASSET_BY_KEY : (u.kind === 'plant' ? PLANT_BY_KEY : FURN_BY_KEY);
  const opt = Object.assign({}, u.opt, changes || {});
  const i = INSTANCES.indexOf(g);
  if (i >= 0) INSTANCES.splice(i, 1);
  scene.remove(g);
  g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  return _buildInstance(u.kind, registry, u.key, u.x, u.z, u.ry, opt);
}

/* measured world-space size of an instance, and how much of it got built.
   Measures actual transformed VERTICES, not Box3.expandByObject — that takes the
   AABB of each mesh's own AABB, which inflates anything rotated off-axis by up to
   sqrt(2) and would quietly overstate every tapered tower and turned roof here. */
const _mv = new THREE.Vector3();
function measureInstance(g) {
  g.updateMatrixWorld(true);
  const box = new THREE.Box3();
  let meshes = 0, tris = 0;
  g.traverse((o) => {
    const geo = o.geometry;
    if (!geo || !geo.attributes || !geo.attributes.position) return;
    meshes++;
    const idx = geo.index, pos = geo.attributes.position;
    tris += idx ? idx.count / 3 : pos.count / 3;
    for (let i = 0; i < pos.count; i++) {
      _mv.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      box.expandByPoint(_mv);
    }
  });
  if (!meshes || box.isEmpty()) return { empty: true, meshes: 0, tris: 0, w: 0, d: 0, h: 0, box: box };
  const size = box.getSize(new THREE.Vector3());
  return { empty: false, meshes: meshes, tris: Math.round(tris), w: size.x, d: size.z, h: size.y, box: box, min: box.min.clone(), max: box.max.clone() };
}

/* --------------------------------------------------------------- labels */
function groundLabel(text, x, z, big) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = big ? 160 : 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = big ? 'rgba(30,26,18,0.92)' : 'rgba(255,255,255,0.88)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = big ? '#f5efdd' : '#20201a';
  ctx.font = (big ? 'bold 64px' : '40px') + ' Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 512, big ? 100 : 82);
  const tex = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(big ? 34 : 15, big ? 5.3 : 1.9);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, big ? 0.08 : 0.06, z);
  scene.add(m);
  return m;
}
function scaleFigure(x, z) {
  mkCyl(x, 0, z, 0.22, 1.5, 0, 0x3a5a7a, 'cloth');
  mkBall(x, 1.68, z, 0.22, 0xe0b090, 'skin');
}

function animate(now) {
  requestAnimationFrame(animate);
  _moveStep(now || performance.now());
  if (window._inspectorTick) window._inspectorTick();
  if (window._frameHooks) for (const fh of window._frameHooks) fh(now || performance.now());
  renderer.render(scene, camera);
}
animate();
/* ---------- krator-master-furniture.js ---------- */
/* ======================================================================
   Krator Master Furniture Registry — 122 pieces
   Harvested from Voth, Iziz, Mav's Refuge, Girder, Yuni and the Ancients kit.
   Requires krator-asset-engine.js to be loaded first (defines FURN(), F.*, etc).
   Every piece is tagged with culture: one of ancient, ancients-salvage,
   yuni-court, yuni-common, yuni-poor, sahelian, order, nomad, voth, iziz, beast-rider.
   Colours are palette keys of that culture (F.col / F.cols / F.pick([...keys]) /
   F.shade(key, amt)), resolved through FPAL in the engine; helpers are F.shade, F.TAU.
   Build any instance with: buildFurn(key, x, z, ry, {variant, seed, y, wealth})

   Every entry carries the kits/furniture/SPEC.md fields: type, setting
   (indoor|outdoor|both), rooms [...], anchor (floor|wall|ceiling|surface),
   clearance {front,back,left,right} in metres, materials [...] (canonical
   names, CATALOG_MATERIALS in the engine). verify.py --assert checks them,
   and that the built geometry fits w x d x h centred on the origin.
   ====================================================================== */

/* ================= Voth (35 pieces) ================= */

FURN({
  key: 'voth_bench', name: 'Street Bench', culture: 'voth', type: 'bench', setting: 'outdoor',
  rooms: ['street', 'plaza', 'yard'], anchor: 'floor', clearance: { front: 0.7 },
  materials: ['timber'],
  w: 3.4, d: 1.0, h: 1.2, variants: 2,
  variantDims: [{ w: 3.4, d: 1.0, h: 0.66 }, { w: 3.4, d: 1.0, h: 1.2 }],
  build: function (F) {
    const backed = F.variant === 1;
    const c = F.pick(['timberTaupeLight', 'timberGrey', 'timberTaupe']);
    const legC = F.shade(c, -0.25), pegC = F.shade(c, -0.42);
    const seatH = 0.5, seatT = 0.12;
    /* two trestle ends: slab leg, splayed foot, knee brace up to the seat */
    for (let s = -1; s <= 1; s += 2) {
      const lx = s * 1.45 + F.rr(-0.03, 0.03);
      F.box(lx, 0.08, 0, 0.26, seatH - 0.08, 0.76, 0, legC, 'wood');
      F.box(lx, 0, 0, 0.34, 0.1, 0.96, 0, F.shade(legC, -0.14), 'wood');
      F.beam(lx - s * 0.1, seatH - 0.07, 0, lx + s * 0.34, 0.24, 0, 0.09, 0.5, legC, 'wood');
    }
    /* aprons front and back, one low stretcher tying the ends */
    F.box(0, seatH - 0.17, -0.34, 3.02, 0.15, 0.08, 0, F.shade(c, -0.15), 'wood');
    F.box(0, seatH - 0.17, 0.34, 3.02, 0.15, 0.08, 0, F.shade(c, -0.15), 'wood');
    F.box(0, 0.21, 0, 2.86, 0.11, 0.13, 0, F.shade(c, -0.2), 'wood');
    /* seat: three planks, each laid a hair differently */
    for (let i = 0; i < 3; i++) {
      F.box(0, seatH + F.rr(0, 0.012), -0.3 + i * 0.3, 3.4, seatT, 0.28, 0,
        F.shade(c, F.rr(-0.05, 0.05)), 'wood');
    }
    /* draw-pegs through the seat into the leg tenons, both ends */
    for (let s = -1; s <= 1; s += 2) F.cyl(s * 1.45, seatH + seatT - 0.01, 0.27, 0.032, 0.035, 0, pegC, 'wood');
    F.blob(F.rr(-0.9, 0.9), seatH + seatT, F.rr(-0.2, 0.2), 0.11, 0.022, F.rr(0, F.TAU), F.shade(c, -0.3), 'wood');
    if (backed) {
      for (let s = -1; s <= 1; s += 2) {
        F.box(s * 1.45, seatH + seatT, -0.34, 0.13, 0.46, 0.12, 0, legC, 'wood');

    const stalkCols = [0xbdb49c, 0xaca38c, 0xc8bfa6];
    const capCols = [0x8d6a5e, 0x9a7a5c, 0x8a7a52];
    /* one fruiting body: basal bulb, segmented leaning stipe, annulus, gilled cap */
    const one = function (cx, cz, h, leanA, leanK, ng, annulus, warts) {
      const sC = F.pick(stalkCols), cC = F.pick(capCols);
      const sr = h * 0.072, stipeTop = h * 0.80;

      F.blob(cx, sr * 1.3, cz, sr * 2.0, sr * 2.8, 0, shade(sC, -0.1), 'stone');

          sr * (1.18 - s * 0.19), shade(sC, s * 0.04), 'stone');

      }

      for (let i = 0; i < ng; i++) {   /* radial gills under the cap */
        const a = (i / ng) * TAU;
        F.box(tx + Math.cos(a) * R * 0.53, cy - h * 0.042, tz + Math.sin(a) * R * 0.53,
          R * 0.88, h * 0.042, sr * 0.3, -a, shade(cC, -0.28), 'plaster');
      }
      F.cyl(tx, cy - h * 0.05, tz, R * 0.98, h * 0.055, 0, shade(cC, -0.15), 'plaster');
      F.dome(tx, cy, tz, R, h * 0.20, 0, cC, 'plaster');
      F.dome(tx, cy + h * 0.015, tz, R * 0.54, h * 0.135, 0, shade(cC, 0.08), 'plaster');
      for (let i = 0; i < warts; i++) {
        const a = F.rr(0, TAU), rr = F.rr(0.22, 0.78) * R;

      F.rod((cx + tx) / 2, stipeTop * 0.55, (cz + tz) / 2, tx, stipeTop, tz, sr * 0.82, shade(sC, 0.05), 'stone');
      const R = h * 0.36;
      for (let g = 0; g < 5; g++) {
        const ga = (g / 5) * TAU + a;
        F.box(tx + Math.cos(ga) * R * 0.52, stipeTop - h * 0.05, tz + Math.sin(ga) * R * 0.52,
          R * 0.86, h * 0.05, sr * 0.3, -ga, shade(cC, -0.28), 'plaster');
      }
      F.cyl(tx, stipeTop - h * 0.06, tz, R * 0.96, h * 0.06, 0, shade(cC, -0.14), 'plaster');
      F.dome(tx, stipeTop, tz, R, h * 0.22, 0, cC, 'plaster');
    }
    for (let i = 0; i < 5; i++) {          /* young pins around the edge */
      const a = F.rr(0, TAU) + i * 1.3, rad = F.rr(1.7, 2.35);
      const cx = Math.cos(a) * rad, cz = Math.sin(a) * rad;
      const h = F.rr(0.3, 0.75);
      F.rod(cx, 0, cz, cx + F.rr(-0.08, 0.08), h, cz + F.rr(-0.08, 0.08), 0.055, F.pick(stalkCols), 'stone');
      F.blob(cx, h + 0.06, cz, F.rr(0.13, 0.24), F.rr(0.14, 0.26), 0, F.pick(capCols), 'plaster');
    }
  }
});

PLANT({
  key: 'voth_bulbous_trama', name: 'Bulbous Trama Stalk', climate: 'temperate', aridity: 'semiarid',
  w: 4, d: 4, h: 7, variants: 1,
  build: function (F) {
    const capCols = [0x8d6a5e, 0x9a7a5c, 0x8a7a52];
    const c = F.pick(capCols);
    const H = F.rr(6.4, 7.0);
    /* a lumpy fungal column: stacked swellings of shrinking radius, leaning slightly */
    const la = F.rr(0, TAU), lean = F.rr(0.03, 0.09);
    const n = 7;
    let py = 0.1;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const cx = Math.cos(la) * lean * H * t, cz = Math.sin(la) * lean * H * t;
      const r = (1.75 - 1.25 * t) * F.rr(0.9, 1.08);
      const segH = H * 0.126 * F.rr(0.9, 1.1);
      F.blob(cx, py + segH * 0.5, cz, r, segH * 1.5, F.rr(0, TAU), shade(c, (i % 2 ? 0.05 : -0.03)), 'plaster');
      /* lateral lobe budding off the swelling */
      if (i > 0 && i < n - 1) {
        const a2 = F.rr(0, TAU);
        F.blob(cx + Math.cos(a2) * r * 0.85, py + segH * 0.45, cz + Math.sin(a2) * r * 0.85,
          r * F.rr(0.32, 0.5), segH * 0.9, 0, shade(c, 0.09), 'plaster');
      }
      py += segH;
    }
    /* puckered apex */
    F.dome(Math.cos(la) * lean * H, py - 0.05, Math.sin(la) * lean * H, 0.55, 0.45, 0, shade(c, -0.14), 'plaster');
    F.blob(Math.cos(la) * lean * H, py + 0.32, Math.sin(la) * lean * H, 0.22, 0.3, 0, shade(c, 0.2), 'plaster');
    /* basal volva and a few satellite stalks */
    F.blob(0, 0.28, 0, 1.95, 0.7, 0, shade(c, -0.2), 'plaster');
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU), rad = F.rr(1.1, 1.7);
      const sx = Math.cos(a) * rad, sz = Math.sin(a) * rad;
      const sh = F.rr(0.8, 2.0);
      F.rod(sx, 0, sz, sx + F.rr(-0.15, 0.15), sh, sz + F.rr(-0.15, 0.15), 0.16, shade(c, -0.05), 'plaster');
      F.blob(sx, sh * 0.62, sz, 0.36, sh * 0.5, 0, shade(c, 0.04), 'plaster');
      F.dome(sx, sh, sz, 0.3, 0.22, 0, shade(c, -0.12), 'plaster');
    }
  }
});

PLANT({
  key: 'voth_ashland_scrub', name: 'Ashland Scrub', climate: 'temperate', aridity: 'semiarid',
  w: 5.1, d: 5, h: 2, variants: 1,
  build: function (F) {
    const cols = [0x4e5a34, 0x616a41, 0x6a6c46];
    const woodC = 0x5a4e40;
    const H = F.rr(1.8, 2.0), R = F.rr(1.75, 2.0);
    const nStem = 5;
    const a0 = F.rr(0, TAU);
    for (let i = 0; i < nStem; i++) {
      const a = a0 + (i / nStem) * TAU + F.rr(-0.25, 0.25);
      const lean = F.rr(0.45, 0.75);
      const kx = Math.cos(a) * R * lean, kz = Math.sin(a) * R * lean;
      const ky = H * F.rr(0.45, 0.62);
      F.rod(0, 0, 0, kx * 0.45, ky * 0.6, kz * 0.45, 0.075, woodC, 'wood');
      F.rod(kx * 0.45, ky * 0.6, kz * 0.45, kx, ky, kz, 0.05, shade(woodC, 0.06), 'wood');
      /* two or three twigs off each stem, one of them bare ashen deadwood */
      const nt = 3;
      for (let j = 0; j < nt; j++) {
        const a2 = a + F.rr(-0.8, 0.8);
        const tr = R * F.rr(0.25, 0.42);
        const tx = kx + Math.cos(a2) * tr, tz = kz + Math.sin(a2) * tr;
        const ty = ky + F.rr(0.05, 0.4);
        F.rod(kx, ky, kz, tx, ty, tz, 0.032, j === 2 ? 0xa39c8e : woodC, 'wood');
        if (j !== 2) F.blob(tx, ty + 0.06, tz, F.rr(0.28, 0.46), F.rr(0.24, 0.4), F.rr(0, TAU), F.pick(cols), 'plaster');
      }
    }
    /* crown fill so the silhouette reads as a scrub, not a wire frame */
    for (let i = 0; i < 4; i++) {
      const a = F.rr(0, TAU), rad = F.rr(0.1, R * 0.55);
      F.blob(Math.cos(a) * rad, F.rr(0.45, H * 0.8), Math.sin(a) * rad, F.rr(0.35, 0.55), F.rr(0.3, 0.5), F.rr(0, TAU), F.pick(cols), 'plaster');
    }
    /* ash litter at the base */
    for (let i = 0; i < 2; i++) {
      const a = F.rr(0, TAU);
      F.blob(Math.cos(a) * F.rr(0.4, 1.1), 0.07, Math.sin(a) * F.rr(0.4, 1.1), F.rr(0.4, 0.7), 0.16, 0, 0x8e8878, 'plaster');
    }
  }
});

PLANT({
  key: 'voth_ashland_tree', name: 'Ashland Tree', climate: 'temperate', aridity: 'semiarid',
  w: 7, d: 7, h: 17, variants: 2,
  variantDims: [{ w: 4.2, d: 4.2, h: 7.5 }, { w: 7, d: 7, h: 17 }],
  build: function (F) {
    const trunkCols = [0x5d5140, 0x6a5c48, 0x4e4536];
    const trunkC = F.pick(trunkCols);
    const tierC = 0x4e5a34;
    const big = F.variant === 1;
    const H = big ? F.rr(16, 17) : F.rr(7.0, 7.5);
    const CR = big ? 3.5 : 2.1;            /* crown radius incl. foliage */
    const br = H * 0.052;                  /* base trunk radius */
    /* root flare */
    for (let i = 0; i < 4; i++) {
      const a = F.rr(0, TAU);
      F.rod(Math.cos(a) * br * 2.1, 0, Math.sin(a) * br * 2.1, 0, br * 2.3, 0, br * 0.4, shade(trunkC, -0.1), 'wood');
    }
    /* three tapering trunk segments with a slight sweep */
    const swA = F.rr(0, TAU), sw = H * F.rr(0.01, 0.035);
    const topY = H * 0.74;
    F.frustum(0, 0, 0, br, br * 0.72, topY * 0.42, 0, trunkC, 'wood', 10);
    F.frustum(Math.cos(swA) * sw * 0.5, topY * 0.42, Math.sin(swA) * sw * 0.5, br * 0.72, br * 0.48, topY * 0.32, 0, shade(trunkC, 0.05), 'wood', 10);
    F.frustum(Math.cos(swA) * sw, topY * 0.74, Math.sin(swA) * sw, br * 0.48, br * 0.22, topY * 0.26, 0, shade(trunkC, 0.1), 'wood', 10);
    /* three whorls of limbs, each ending in a tuft of ash-green needle cones */
    const wh = 3;
    for (let w = 0; w < wh; w++) {
      const t = w / (wh - 1);
      const y = H * (0.36 + 0.28 * t);
      const reach = CR * (1.0 - 0.34 * t);
      const nb = 5 - w;
      const a0 = F.rr(0, TAU);
      for (let i = 0; i < nb; i++) {
        const a = a0 + (i / nb) * TAU + F.rr(-0.22, 0.22);
        const cr = H * (big ? 0.055 : 0.075);
        const len = reach - cr;
        const tipx = Math.cos(a) * len, tipz = Math.sin(a) * len;
        const tipy = y + H * F.rr(0.02, 0.07);
        F.rod(0, y, 0, tipx * 0.5, y + (tipy - y) * 0.35, tipz * 0.5, br * 0.24, trunkC, 'wood');
        F.rod(tipx * 0.5, y + (tipy - y) * 0.35, tipz * 0.5, tipx, tipy, tipz, br * 0.13, shade(trunkC, 0.07), 'wood');
        F.cone(tipx, tipy - cr * 0.3, tipz, cr, H * F.rr(0.1, 0.15), 0, shade(tierC, F.rr(-0.06, 0.09)), 'plaster');
        if (w < 2) F.cone(tipx * 0.62, tipy - cr * 0.2, tipz * 0.62, cr * 0.72, H * 0.09, 0, shade(tierC, F.rr(-0.04, 0.06)), 'plaster');
      }
    }
    /* leader */
    F.cone(Math.cos(swA) * sw, H * 0.70, Math.sin(swA) * sw, H * 0.075, H * 0.17, 0, shade(tierC, 0.08), 'plaster');
    F.cone(Math.cos(swA) * sw, H * 0.84, Math.sin(swA) * sw, H * 0.05, H * 0.16, 0, shade(tierC, 0.13), 'plaster');
  }
});

PLANT({

      const mx = bx + Math.cos(a) * out * 0.45, mz = bz + Math.sin(a) * out * 0.45;

PLANT({

      }

PLANT({
  key: 'voth_tree_fern', name: 'Tree Fern', climate: 'temperate', aridity: 'humid',
  w: 6, d: 6, h: 9, variants: 1,
  build: function (F) {
    const trunkC = 0x5d5140;
    const fernCols = [0x2e5a2a, 0x3a6a30, 0x27502a];
    const H = F.rr(8.5, 9.0);
    const crown = H * 0.70;
    const la = F.rr(0, TAU), lean = F.rr(0.02, 0.05);
    const cx = Math.cos(la) * lean * H, cz = Math.sin(la) * lean * H;
    /* fibrous trunk in four segments, with leaf-scar rings */
    for (let s = 0; s < 4; s++) {
      const t0 = s / 4, t1 = (s + 1) / 4;
      F.frustum(cx * t0, crown * t0, cz * t0, 0.34 - 0.05 * s, 0.34 - 0.05 * (s + 1), crown * (t1 - t0), 0, shade(trunkC, s * 0.03), 'wood', 10);
      F.cyl(cx * t1, crown * t1 - 0.06, cz * t1, 0.38 - 0.05 * s, 0.12, 0, shade(trunkC, -0.14), 'wood');
    }
    /* arching fronds: three segments each, rising then drooping */
    const n = 9, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * TAU + F.rr(-0.15, 0.15);
      const len = F.rr(2.55, 2.95);
      const rise = F.rr(0.9, 1.5), drop = F.rr(1.0, 1.9);
      const c = F.pick(fernCols);
      let px = cx, py = crown, pz = cz;
      for (let s = 1; s <= 3; s++) {
        const t = s / 3;
        const nx = cx + Math.cos(a) * len * t, nz = cz + Math.sin(a) * len * t;
        const ny = crown + rise * Math.sin(t * Math.PI * 0.58) - drop * t * t;
        F.beam(px, py, pz, nx, ny, nz, 0.42 - 0.1 * s, 0.07, shade(c, (s - 2) * 0.05), 'plaster');
        px = nx; py = ny; pz = nz;
      }
    }
    /* dead fronds hanging as a skirt below the crown */
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU);
      const ox = cx + Math.cos(a) * 0.9, oz = cz + Math.sin(a) * 0.9;
      F.beam(cx, crown - 0.15, cz, ox, crown - 0.9, oz, 0.3, 0.06, 0x7a6a48, 'plaster');
      F.beam(ox, crown - 0.9, oz, ox * 1.15, crown - 2.0, oz * 1.15, 0.2, 0.05, 0x6a5c40, 'plaster');
    }
    /* croziers uncurling at the centre */
    F.blob(cx, crown + 0.2, cz, 0.36, 0.5, 0, shade(fernCols[0], -0.1), 'plaster');
    for (let i = 0; i < 2; i++) {
      const a = F.rr(0, TAU);
      F.rod(cx, crown + 0.1, cz, cx + Math.cos(a) * 0.3, crown + F.rr(0.9, 1.5), cz + Math.sin(a) * 0.3, 0.07, fernCols[1], 'plaster');
      F.ball(cx + Math.cos(a) * 0.35, crown + F.rr(1.0, 1.6), cz + Math.sin(a) * 0.35, 0.16, shade(fernCols[1], 0.12), 'plaster');
    }
  }
});

PLANT({
  key: 'voth_giant_groundsel', name: 'Giant Groundsel', climate: 'temperate', aridity: 'subhumid',
  w: 4.8, d: 5.1, h: 7, variants: 1,
  build: function (F) {
    const trunkC = 0x5a4b3a;
    const leafC = 0x5a6a34;
    const deadC = 0x9a8a63;
    const H = F.rr(6.4, 7.0);
    const forked = F.chance(0.45);
    /* rosette head: a whorl of thick paddle leaves plus an inflorescence */
    const head = function (hx, hy, hz, sc) {
      const n = Math.floor(14 * sc);
      const a0 = F.rr(0, TAU);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i / n) * TAU;
        const out = F.rr(1.72, 1.98) * sc;
        const droop = (i % 3 === 0) ? F.rr(0.35, 0.7) : F.rr(-0.25, 0.15);
        F.beam(hx + Math.cos(a) * 0.18, hy, hz + Math.sin(a) * 0.18,
          hx + Math.cos(a) * out, hy + 0.35 * sc - droop, hz + Math.sin(a) * out,
          0.4 * sc, 0.07, shade(leafC, F.rr(-0.1, 0.12)), 'plaster');
      }
      F.blob(hx, hy + 0.2 * sc, hz, 0.42 * sc, 0.5 * sc, 0, shade(leafC, -0.14), 'plaster');
      F.rod(hx, hy + 0.2, hz, hx, hy + 0.95 * sc, hz, 0.07, shade(trunkC, 0.1), 'wood');
      F.blob(hx, hy + 1.1 * sc, hz, 0.22 * sc, 0.5 * sc, 0, 0xd8d08a, 'plaster');
    };
    const mainTop = forked ? H * 0.68 : H * 0.80;
    F.frustum(0, 0, 0, 0.58, 0.44, mainTop * 0.5, 0, trunkC, 'wood', 10);
    F.frustum(0, mainTop * 0.5, 0, 0.44, 0.34, mainTop * 0.5, 0, shade(trunkC, 0.06), 'wood', 10);
    /* persistent skirt of dead leaves clothing the trunk */
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU * 1.61803;
      const y = mainTop * F.rr(0.12, 0.92);
      F.beam(Math.cos(a) * 0.4, y, Math.sin(a) * 0.4,
        Math.cos(a) * 0.72, y - F.rr(0.5, 0.9), Math.sin(a) * 0.72, 0.3, 0.06, shade(deadC, F.rr(-0.15, 0.05)), 'plaster');
    }
    if (forked) {
      for (let b = 0; b < 2; b++) {
        const a = F.rr(0, TAU) + b * Math.PI;
        const bx = Math.cos(a) * F.rr(0.75, 1.1), bz = Math.sin(a) * F.rr(0.75, 1.1);
        const by = H * F.rr(0.88, 1.0) - 0.9;
        F.rod(0, mainTop - 0.3, 0, bx, by, bz, 0.26, trunkC, 'wood');
        head(bx, by, bz, 0.78);
      }
    } else {
      head(0, mainTop, 0, 1.0);
    }
  }
});

PLANT({

      F.rod(lx * 0.5, y0 + (ly - y0) * 0.55, lz * 0.5, lx, ly, lz, 0.06, shade(barkC, 0.0), 'wood');
      for (let j = 0; j < 2; j++) {
        const a2 = a + F.rr(-0.8, 0.8);
        const tr = F.rr(0.3, 0.75);
        const tx = lx + Math.cos(a2) * tr, tz = lz + Math.sin(a2) * tr;
        const ty = ly + F.rr(-0.5, 0.7);

  }

PLANT({

PLANT({

    const base = F.rr(0, TAU);

      const a = base + (i - 1) * F.rr(1.0, 1.4);

    for (let i = 0; i < 3; i++) {
      const t = tips[i];
      const a = base + (i - 1) * F.rr(1.1, 1.5) + F.rr(-0.4, 0.4);
      const px = t[0] + Math.cos(a) * 0.42, pz = t[2] + Math.sin(a) * 0.42;
      const top = pad(px, t[1], pz, F.rr(0.36, 0.48), F.rr(0.34, 0.46), a, F.pick(cols));
      if (i !== 1) F.ball(top[0], top[1] + 0.06, top[2], 0.1, F.pick([0xe8c84a, 0xd8603a]), 'plaster');

PLANT({
  key: 'voth_park_dragon_tree', name: 'Park Exotic - Dragon Tree', climate: 'temperate', aridity: 'subhumid',
  w: 8.4, d: 8.3, h: 12, variants: 1,
  build: function (F) {
    const trunkC = 0x6a5c48;
    const leafC = 0x2e4a2e;
    const H = F.rr(11.4, 12.0);
    /* rosette of stiff sword leaves at the end of every terminal branch */
    const rosette = function (rx, ry2, rz, sc) {
      F.blob(rx, ry2, rz, 0.3 * sc, 0.35 * sc, 0, shade(trunkC, 0.08), 'wood');
      const n = 6, a0 = F.rr(0, TAU);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i / n) * TAU;
        const out = F.rr(0.85, 1.25) * sc;
        F.beam(rx, ry2, rz, rx + Math.cos(a) * out, ry2 + F.rr(0.35, 0.8) * sc, rz + Math.sin(a) * out,
          0.26 * sc, 0.05, shade(leafC, F.rr(-0.06, 0.1)), 'plaster');
      }
    };
    F.frustum(0, 0, 0, 0.62, 0.46, 3.2, 0, trunkC, 'wood', 12);
    F.frustum(0, 3.2, 0, 0.46, 0.38, 2.4, 0, shade(trunkC, 0.05), 'wood', 12);
    /* dichotomous forking: 3 primaries, each splitting into 2 */
    const a0 = F.rr(0, TAU);
    for (let i = 0; i < 3; i++) {
      const a = a0 + (i / 3) * TAU + F.rr(-0.2, 0.2);
      const lx = Math.cos(a) * F.rr(1.0, 1.5), lz = Math.sin(a) * F.rr(1.0, 1.5);
      const ly = F.rr(7.4, 8.4);
      F.rod(0, 5.4, 0, lx, ly, lz, 0.28, trunkC, 'wood');
      for (let j = 0; j < 2; j++) {
        const a2 = a + (j ? 1 : -1) * F.rr(0.45, 0.85);
        const reach = F.rr(1.1, 1.7);
        const tx = lx + Math.cos(a2) * reach, tz = lz + Math.sin(a2) * reach;
        const ty = ly + F.rr(1.5, 2.4);
        F.rod(lx, ly, lz, tx, ty, tz, 0.16, shade(trunkC, 0.06), 'wood');
        rosette(tx, ty, tz, F.rr(0.95, 1.2));
      }
    }
    /* one lower, older rosette on a side branch */
    const sa = F.rr(0, TAU);
    const sx = Math.cos(sa) * 1.9, sz = Math.sin(sa) * 1.9;
    F.rod(0, 5.0, 0, sx, 6.6, sz, 0.14, trunkC, 'wood');
    rosette(sx, 6.6, sz, 0.8);
  }
});

PLANT({

    const stalkC = 0xc8bfa6;

    F.blob(0, 1.3, 0, 3.7, 3.0, 0, shade(stalkC, -0.14), 'stone');
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + F.rr(-0.25, 0.25);
      F.rod(Math.cos(a) * F.rr(3.6, 4.6), 0, Math.sin(a) * F.rr(3.6, 4.6), 0, 2.6, 0, F.rr(0.4, 0.62), shade(stalkC, -0.2), 'stone');
    }
    /* four-segment tapering stipe */
    F.frustum(0, 1.6, 0, 2.9, 2.4, 6.0, 0, stalkC, 'stone', 12);
    F.frustum(0, 7.6, 0, 2.4, 2.0, 5.6, 0, shade(stalkC, 0.03), 'stone', 12);
    F.frustum(0, 13.2, 0, 2.0, 1.7, 5.0, 0, shade(stalkC, 0.06), 'stone', 12);
    F.frustum(0, 18.2, 0, 1.7, 1.5, 3.8, 0, shade(stalkC, 0.09), 'stone', 12);

    F.dome(0, 16.4, 0, 3.5, 0.9, 0, shade(stalkC, -0.18), 'stone');

    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * TAU;
      F.box(Math.cos(a) * R * 0.56, stipeTop - 1.1, Math.sin(a) * R * 0.56,
        R * 0.82, 1.1, 0.34, -a, shade(capC, -0.3), 'plaster');
    }
    F.cyl(0, stipeTop - 1.25, 0, R * 0.99, 1.3, 0, shade(capC, -0.15), 'plaster');
    F.dome(0, stipeTop, 0, R, 6.2, 0, capC, 'plaster');
    F.dome(0, stipeTop + 0.5, 0, R * 0.52, 4.6, 0, shade(capC, 0.08), 'plaster');
    /* veil warts scattered over the cap */
    for (let i = 0; i < 8; i++) {
      const a = F.rr(0, TAU), rr = F.rr(0.15, 0.85) * R;
      const yy = stipeTop + 6.2 * Math.sqrt(Math.max(0, 1 - (rr / R) * (rr / R))) * 0.92;
      F.blob(Math.cos(a) * rr, yy, Math.sin(a) * rr, F.rr(0.45, 0.8), F.rr(0.3, 0.55), 0, shade(capC, 0.34), 'plaster');
    }
    /* a court of lesser fungi at its foot */
    const stalkCols = [0xbdb49c, 0xaca38c, 0xc8bfa6];
    const capCols = [0x8d6a5e, 0x9a7a5c, 0x8a7a52];
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU) + i * 2.1, rad = F.rr(5.0, 7.2);

      const h = F.rr(3.4, 5.6);
      const sC = F.pick(stalkCols), cC = F.pick(capCols);
      const lx = cx + F.rr(-0.3, 0.3), lz = cz + F.rr(-0.3, 0.3);
      F.blob(cx, 0.28, cz, 0.5, 0.7, 0, shade(sC, -0.12), 'stone');

      F.rod((cx + lx) / 2, h * 0.45, (cz + lz) / 2, lx, h * 0.8, lz, h * 0.058, shade(sC, 0.05), 'stone');
      const r2 = h * 0.33;
      for (let g = 0; g < 4; g++) {
        const ga = (g / 4) * TAU + a;

      F.dome(lx, h * 0.8, lz, r2, h * 0.2, 0, cC, 'plaster');
    }
    for (let i = 0; i < 4; i++) {
      const a = F.rr(0, TAU), rad = F.rr(4.2, 8.0);
      const cx = Math.cos(a) * rad, cz = Math.sin(a) * rad;
      const h = F.rr(0.7, 1.5);
      F.rod(cx, 0, cz, cx + F.rr(-0.15, 0.15), h, cz + F.rr(-0.15, 0.15), 0.1, F.pick(stalkCols), 'stone');
      F.dome(cx, h, cz, F.rr(0.3, 0.55), F.rr(0.2, 0.4), 0, F.pick(capCols), 'plaster');
    }
  }
});

PLANT({
  key: 'iziz_palm',
  name: 'Jungle Palm',
  climate: 'tropic',
  aridity: 'subhumid',
  w: 8.4, d: 8.2, h: 14,
  variants: 1,
  build: function (F) {
    const trunkColor = 0x5a3d26;
    const frondColors = [0x2c8a5e, 0x1f8f8a, 0x27906a];
    const H = F.rr(13.2, 14.0);
    const crownY = H * 0.90;
    /* a slightly leaning, ringed trunk in five segments */
    const la = F.rr(0, TAU), lean = F.rr(0.03, 0.08) * H;
    const cx = Math.cos(la) * lean, cz = Math.sin(la) * lean;
    for (let s = 0; s < 5; s++) {
      const t0 = s / 5, t1 = (s + 1) / 5;
      F.frustum(cx * t0 * t0, crownY * t0, cz * t0 * t0, 0.42 - 0.035 * s, 0.42 - 0.035 * (s + 1), crownY * 0.2, 0,
        shade(trunkColor, s * 0.03), 'wood', 10);
      F.cyl(cx * t1 * t1, crownY * t1 - 0.09, cz * t1 * t1, 0.46 - 0.035 * s, 0.18, 0, shade(trunkColor, -0.12), 'wood');  /* leaf-scar ring */
    }
    F.frustum(cx, crownY, cz, 0.28, 0.34, 0.5, 0, shade(trunkColor, 0.12), 'wood', 10);   /* crownshaft */
    /* eight arching fronds, each a three-segment blade that rises then droops */
    const n = 8, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * TAU + F.rr(-0.18, 0.18);
      const len = F.rr(2.9, 3.5);
      const rise = F.rr(0.7, 1.3), drop = F.rr(2.4, 3.8);
      const c = F.pick(frondColors);
      let px = cx, py = crownY + 0.5, pz = cz;
      for (let s = 1; s <= 3; s++) {
        const t = s / 3;
        const nx = cx + Math.cos(a) * len * t, nz = cz + Math.sin(a) * len * t;
        const ny = crownY + 0.5 + rise * Math.sin(t * Math.PI * 0.55) - drop * t * t;
        F.beam(px, py, pz, nx, ny, nz, 0.62 - 0.16 * s, 0.08, shade(c, (s - 2) * 0.06), 'leafy');
        px = nx; py = ny; pz = nz;
      }
    }
    /* dead fronds hanging under the crown */
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU);
      const ox = cx + Math.cos(a) * 1.1, oz = cz + Math.sin(a) * 1.1;
      F.beam(cx, crownY + 0.35, cz, ox, crownY - 0.5, oz, 0.45, 0.07, 0x7a6a44, 'leafy');
      F.beam(ox, crownY - 0.5, oz, ox * 1.1, crownY - 2.3, oz * 1.1, 0.3, 0.06, 0x6a5c38, 'leafy');
    }
    /* nut cluster in the crown */
    F.rod(cx, crownY + 0.5, cz, cx + F.rr(-0.5, 0.5), crownY + 0.1, cz + F.rr(-0.5, 0.5), 0.07, shade(trunkColor, 0.1), 'wood');
    for (let i = 0; i < 4; i++) {
      const a = F.rr(0, TAU);
      F.ball(cx + Math.cos(a) * F.rr(0.3, 0.7), crownY + F.rr(-0.1, 0.35), cz + Math.sin(a) * F.rr(0.3, 0.7), F.rr(0.2, 0.3), F.pick([0x9a7a3a, 0x8a6a30]), 'leafy');
    }
  }
});

PLANT({
  key: 'iziz_fern',
  name: 'Jungle Fern',
  climate: 'tropic',
  aridity: 'humid',
  w: 3, d: 3, h: 3,
  variants: 2,
  build: function (F) {
    const glow = F.variant === 1;
    const colors = glow ? [0xe8e04a, 0xd9d233, 0xf2ea6a, 0xc6d63a] : [0x1f8f6a, 0x2c8a5e, 0x24805e];
    const fam = glow ? 'glow' : 'leafy';
    const R = F.rr(1.44, 1.56);
    F.blob(0, 0.12, 0, 0.26, 0.3, 0, glow ? 0xc6d63a : 0x2a5a3a, fam);
    /* nine arching fronds of three segments each */
    const n = 9, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * TAU + F.rr(-0.16, 0.16);
      const len = R * F.rr(0.9, 1.0);
      const rise = F.rr(2.75, 3.2), drop = F.rr(0.4, 0.85);
      const c = F.pick(colors);
      let px = 0, py = 0.14, pz = 0;
      for (let s = 1; s <= 3; s++) {
        const t = s / 3;
        const nx = Math.cos(a) * len * t, nz = Math.sin(a) * len * t;
        const ny = 0.14 + rise * Math.sin(t * Math.PI * 0.62) - drop * t * t;
        F.beam(px, py, pz, nx, ny, nz, 0.34 - 0.08 * s, 0.05, shade(c, (s - 2) * 0.06), fam);
        px = nx; py = ny; pz = nz;
      }
      /* a pair of pinnae to thicken the blade */
      if (i % 3 === 0) {
        F.beam(px * 0.55, 0.14 + rise * 0.55, pz * 0.55, px * 0.8 + Math.cos(a + 1.4) * 0.3, 0.14 + rise * 0.4, pz * 0.8 + Math.sin(a + 1.4) * 0.3, 0.16, 0.04, shade(c, 0.08), fam);
      }
    }
    /* fiddleheads uncurling from the crown */
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU);
      const hh = F.rr(1.5, 2.4);
      F.rod(0, 0.12, 0, Math.cos(a) * 0.22, hh, Math.sin(a) * 0.22, 0.045, F.pick(colors), fam);
      F.ball(Math.cos(a) * 0.24, hh + 0.08, Math.sin(a) * 0.24, 0.1, F.pick(colors), fam);
    }
    if (glow) {
      F.lamp(F.rr(-0.4, 0.4), 0.9, F.rr(-0.4, 0.4), 0.4, 4);
      F.lamp(F.rr(-0.4, 0.4), 2.1, F.rr(-0.4, 0.4), 0.35, 3.5);
    }
  }
});

      const ky = H * F.rr(0.4, 0.62);
      F.rod(0, 0, 0, kx * 0.5, ky * 0.55, kz * 0.5, 0.06, woodC, 'wood');
      F.rod(kx * 0.5, ky * 0.55, kz * 0.5, kx, ky, kz, 0.04, shade(woodC, 0.08), 'wood');

PLANT({
  key: 'iziz_spike',
  name: 'Desert Spike',
  climate: 'tropic',
  aridity: 'arid',
  w: 5, d: 5, h: 6,
  variants: 1,
  build: function (F) {
    const col = 0x7e9a6a;
    const H = F.rr(5.7, 6.0), R = F.rr(2.45, 2.6);
    F.cyl(0, 0, 0, 0.62, 0.9, 0, shade(col, -0.14), 'stone');
    /* basal rosette of stiff sword leaves, longest at the outside */
    const n = 13, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + i * 2.39996;
      const t = 1 - i / n;
      const out = R * (0.48 + 0.52 * t) * F.rr(0.93, 1.0);
      const up = H * (0.16 + 0.3 * (1 - t));
      const c = shade(col, (i % 3 - 1) * 0.06);
      F.beam(Math.cos(a) * 0.3, 0.7, Math.sin(a) * 0.3, Math.cos(a) * out, 0.7 + up, Math.sin(a) * out, 0.32, 0.07, c, 'plaster');
      if (i % 2 === 0) F.rod(Math.cos(a) * out, 0.7 + up, Math.sin(a) * out, Math.cos(a) * (out + 0.16), 0.7 + up + 0.18, Math.sin(a) * (out + 0.16), 0.03, 0x6a5a3a, 'plaster');
    }
    /* the stacked spike itself */
    let y = 1.6, r = 1.25, hh = 1.5;
    for (let i = 0; i < 3; i++) {
      F.cone(0, y, 0, r, hh, F.rr(0, TAU), shade(col, i * -0.05), 'plaster');
      /* a ring of bracts at the base of each tier */
      for (let j = 0; j < 5; j++) {
        const a = (j / 5) * TAU + i;
        F.beam(Math.cos(a) * r * 0.5, y + 0.1, Math.sin(a) * r * 0.5, Math.cos(a) * r * 1.25, y + 0.5, Math.sin(a) * r * 1.25, 0.2, 0.05, shade(col, 0.1), 'plaster');
      }
      y += hh * 0.92; r *= 0.7; hh *= 0.88;
    }
    F.cone(0, y, 0, 0.3, H - y, 0, shade(col, 0.14), 'plaster');
  }
});

PLANT({

PLANT({
  key: 'br_giant_fern', name: 'Giant Fern', climate: 'hypertropic', aridity: 'humid',
  w: 5, d: 5, h: 5, variants: 1,
  build: function (F) {
    const greens = [0x2e5a2a, 0x3a6a30, 0x274e26];
    const H = F.rr(4.7, 5.0), R = F.rr(2.2, 2.45);
    const stemH = F.rr(0.9, 1.4);
    F.frustum(0, 0, 0, 0.3, 0.24, stemH, 0, 0x4a3f30, 'bark', 10);
    F.cyl(0, stemH - 0.08, 0, 0.32, 0.14, 0, shade(0x4a3f30, -0.15), 'bark');
    /* ten fronds, each a three-segment arch that peaks well above the crown */
    const n = 10, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * TAU + F.rr(-0.16, 0.16);
      const len = R * F.rr(0.8, 1.0);
      const rise = (H - stemH) * F.rr(1.05, 1.2);
      const drop = rise * F.rr(0.45, 0.75);
      const c = F.pick(greens);
      let px = 0, py = stemH + 0.15, pz = 0;
      for (let s = 1; s <= 3; s++) {
        const t = s / 3;
        const nx = Math.cos(a) * len * t, nz = Math.sin(a) * len * t;
        const ny = stemH + 0.15 + rise * Math.sin(t * Math.PI * 0.6) - drop * t * t;
        F.beam(px, py, pz, nx, ny, nz, 0.52 - 0.13 * s, 0.07, shade(c, (s - 2) * 0.06), 'leafy');
        px = nx; py = ny; pz = nz;
      }
      if (i % 2 === 0) {   /* a pinna spreading off the mid-rachis */
        F.beam(Math.cos(a) * len * 0.45, stemH + 0.15 + rise * 0.6, Math.sin(a) * len * 0.45,
          Math.cos(a + 1.3) * len * 0.62, stemH + 0.15 + rise * 0.45, Math.sin(a + 1.3) * len * 0.62,
          0.22, 0.05, shade(c, 0.08), 'leafy');
      }
    }
    /* croziers at the centre */
    F.blob(0, stemH + 0.25, 0, 0.42, 0.5, 0, shade(greens[2], -0.08), 'leafy');
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU);
      const hh = stemH + F.rr(2.4, 3.4);
      F.rod(0, stemH + 0.1, 0, Math.cos(a) * 0.3, hh, Math.sin(a) * 0.3, 0.07, greens[1], 'leafy');
      F.ball(Math.cos(a) * 0.33, hh + 0.12, Math.sin(a) * 0.33, 0.17, shade(greens[1], 0.1), 'leafy');
    }
  }
});

PLANT({

    const H = F.rr(5.6, 6.0), R = F.rr(1.75, 1.95);

    const n = 7, a0 = F.rr(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * TAU * 1.61803 + F.rr(-0.15, 0.15);
      const rad = F.rr(0.1, 0.55);
      const x0 = Math.cos(a) * rad, z0 = Math.sin(a) * rad;

      for (let j = 0; j < 2; j++) {
        const a2 = a + (j ? 1 : -1) * F.rr(0.4, 1.0);
        const out = R * F.rr(0.55, 1.0);
        const ty = sh + F.rr(0.3, 1.1);
        const bx = x0 + Math.cos(a2) * 0.2, bz = z0 + Math.sin(a2) * 0.2;

          0.72, 0.06, shade(c, F.rr(-0.08, 0.12)), 'leafy');

    }
    /* three inflorescences: a stalk with alternating boat-shaped bracts */
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU), rad = F.rr(0.2, 0.6);
      const x0 = Math.cos(a) * rad, z0 = Math.sin(a) * rad;
      const top = H * F.rr(0.78, 1.0);
      F.rod(x0, 0.2, z0, x0 + Math.cos(a) * 0.25, top, z0 + Math.sin(a) * 0.25, 0.055, 0x2a6a38, 'leafy');
      for (let j = 0; j < 3; j++) {
        const t = 0.45 + j * 0.18;
        const bx = x0 + Math.cos(a) * 0.25 * t, bz = z0 + Math.sin(a) * 0.25 * t;
        const side = (j % 2 ? 1 : -1);
        F.beam(bx, top * t, bz, bx + Math.cos(a + side * 1.5) * 0.5, top * t + 0.18, bz + Math.sin(a + side * 1.5) * 0.5,

      }
    }
  }

PLANT({

    /* the rotting stub the brackets grow on */
    const la = F.rr(0, TAU), lean = F.rr(0.1, 0.28);
    const tx = Math.cos(la) * lean, tz = Math.sin(la) * lean;
    F.blob(0, 0.12, 0, 0.5, 0.3, 0, 0x4a3a2a, 'bark');
    F.frustum(0, 0.05, 0, 0.3, 0.2, H * 0.62, 0, woodC, 'bark', 8);

    F.blob(tx, H * 0.95, tz, 0.21, 0.2, 0, 0x3a2e22, 'bark');   /* splintered top */
    /* nine shelves stepping up the stub, alternating sides */
    const n = 9;
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996;
      const t = (i + 0.6) / n;
      const y = 0.12 + H * 0.78 * t;
      const stub = 0.3 - 0.1 * t;

    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, TAU), rad = F.rr(0.3, 0.85);

    }
    for (let i = 0; i < 2; i++) {
      const a = F.rr(0, TAU), rad = F.rr(0.4, 0.9);
      const px = Math.cos(a) * rad, pz = Math.sin(a) * rad;
      F.rod(px, 0, pz, px, 0.18, pz, 0.025, 0xbdb49c, 'leafy');
      F.dome(px, 0.18, pz, 0.1, 0.07, 0, F.pick(tones), 'leafy');

PLANT({

PLANT({
  key: 'br_vine_curtain', name: 'Vine Curtain', climate: 'hypertropic', aridity: 'humid',
  w: 5.2, d: 1.9, h: 13.1, variants: 1,
  build: function (F) {
    const greens = [0x2e5a2a, 0x3a6a30, 0x274e26, 0x4a7a36, 0x1e4220];
    const accentTones = [0xd8a23a, 0xc9442a, 0x8d6a5e];
    const H = 13;
    /* nine strands of differing length, each wandering as it falls */
    const n = 9;
    for (let i = 0; i < n; i++) {
      const lx = -1.62 + i * (3.24 / (n - 1)) + F.rr(-0.08, 0.08);
      const lz = F.rr(-0.35, 0.35);
      const len = F.rr(6.5, 13);
      const c = F.pick(greens);
      const midX = lx + F.rr(-0.25, 0.25), midZ = lz + F.rr(-0.2, 0.2);
      const endX = midX + F.rr(-0.3, 0.3), endZ = midZ + F.rr(-0.2, 0.2);
      F.rod(lx, H, lz, midX, H - len * 0.55, midZ, 0.055, c, 'leafy');
      F.rod(midX, H - len * 0.55, midZ, endX, H - len, endZ, 0.04, shade(c, 0.06), 'leafy');
      /* leaf clusters strung along the strand */
      const nl = 2;
      for (let j = 0; j < nl; j++) {
        const t = (j + 0.5) / nl * F.rr(0.6, 1.0);
        const px = lx + (endX - lx) * t, pz = lz + (endZ - lz) * t;
        F.blob(px, H - len * t, pz, F.rr(0.3, 0.5), F.rr(0.35, 0.65), F.rr(0, TAU), F.pick(greens), 'leafy');
      }
      if (i % 3 === 0) F.blob(endX, H - len - 0.2, endZ, F.rr(0.22, 0.34), F.rr(0.3, 0.5), F.rr(0, TAU), F.pick(greens), 'leafy');
    }
    /* fine tendrils spiralling clear of the curtain */
    for (let i = 0; i < 4; i++) {
      const lx = F.rr(-1.8, 1.8);
      const y0 = F.rr(3, 11);
      let px = lx, py = y0, pz = F.rr(-0.3, 0.3);
      for (let s = 0; s < 2; s++) {
        const nx = px + F.rr(-0.5, 0.5), nz = pz + F.rr(-0.25, 0.25);
        const ny = py - F.rr(0.6, 1.4);
        F.rod(px, py, pz, nx, ny, nz, 0.022, F.pick(greens), 'leafy');
        px = nx; py = ny; pz = nz;
      }
    }
    /* flowers and a dead leaf caught in the strands */
    for (let i = 0; i < 4; i++) {
      F.blob(F.rr(-1.8, 1.8), F.rr(1, 11.5), F.rr(-0.35, 0.35), 0.13, 0.1, F.rr(0, TAU), F.pick(accentTones), 'leafy');
    }
  }
});

PLANT({

    const tone = 0x8a9a5a, wood = 0x6d6a4a, thorn = 0xd8cba0;
    const H = size * 0.92, R = size * 0.68;
    const stems = 4 + F.variant;
    for (let s = 0; s < stems; s++) {
      const a = (s / stems) * TAU + F.rr(-0.35, 0.35);
      const bx = Math.cos(a) * R * 0.14, bz = Math.sin(a) * R * 0.14;
      const lean = F.rr(0.30, 0.55);

      const my = H * F.rr(0.42, 0.62);
      F.rod(bx, 0, bz, mx, my, mz, size * 0.038, shade(wood, F.rr(-0.08, 0.08)), 'wood');
      /* each stem forks twice near its middle */
      for (let f = 0; f < 2; f++) {

        const bx = ex + Math.cos(a2) * l2, bz = ez + Math.sin(a2) * l2;
        const by = ey + h * F.rr(0.02, 0.10);

PLANT({
  key: 'yuni_canal_poplar', name: 'Canal poplar', climate: 'temperate', aridity: 'humid',

  ],

    const h = [13, 19][F.variant];
    const bark = 0x8a7a5a, leaf = 0x4a7a4a;
    const R = h * 0.068;
    /* tapering bole all the way up inside the column */
    const segs = 4, boleTop = h * 0.80;
    let px = 0, pz = 0, py = 0;
    for (let i = 0; i < segs; i++) {
      const r = (0.20 + h * 0.011) * (1 - 0.68 * (i / segs));
      const nx = px + F.rr(-0.04, 0.04) * h, nz = pz + F.rr(-0.02, 0.02) * h;
      F.rod(px, py, pz, nx, py + boleTop / segs, nz, r, i % 2 ? shade(bark, 0.06) : bark, 'bark');
      px = nx; pz = nz; py += boleTop / segs;
    }
    /* whorls of steeply upswept branches, each with its own foliage layer */
    const whorls = 5, per = 3;
    for (let w = 0; w < whorls; w++) {
      const t = w / (whorls - 1);
      const by = h * (0.12 + 0.66 * t);
      const spread = R * (1.02 - 0.40 * t) * F.rr(0.85, 1.05);
      for (let i = 0; i < per; i++) {
        const a = (i / per) * TAU + w * 0.9 + F.rr(-0.15, 0.15);
        const ex = Math.cos(a) * spread, ez = Math.sin(a) * spread;
        const ey = by + h * F.rr(0.08, 0.13);
        F.rod(px * (by / h), by, pz * (by / h), ex, ey, ez, 0.035 + h * 0.0035, bark, 'bark');
        F.blob(ex * 0.88, ey, ez * 0.88, spread * F.rr(0.62, 0.80), h * F.rr(0.09, 0.13),
          F.rnd() * TAU, shade(leaf, F.rr(-0.09, 0.11)), 'plant');
      }
    }
    /* the spire: the column closes to a point at h */
    F.blob(px * 0.8, h * 0.82, pz * 0.8, R * 0.60, h * 0.14, 0, shade(leaf, 0.05), 'plant');
    F.cone(px * 0.8, h * 0.90, pz * 0.8, R * 0.42, h * 0.10, 0, shade(leaf, 0.11), 'plant');
    /* a couple of low water shoots, as canal-bank poplars throw */
    for (let i = 0; i < 2; i++) {
      const a = F.rnd() * TAU;
      F.rod(0, 0, 0, Math.cos(a) * R * 0.5, h * 0.10, Math.sin(a) * R * 0.5, 0.04, shade(bark, -0.1), 'bark');
    }
  }
});

    function W(cx, cy, cz, ww, wh, s, wallC, trim) {

ASSET({
  key: 'br_bldg_deck_lot', name: 'Platform building (deck lot)', culture: 'beast-rider',
  family: 'housing', types: ['dwelling-single'], districts: ['mavs-refuge'], wealth: [0, 1],
  w: 17, d: 13, h: 9.5, variants: 5,
  build: function (F) {
    const w = 14, d = 10, hw = 7, hd = 5, wallT = 0.22;
    const postColor = 0x5e4630, rope = 0x9a8a62;
    const wallTones = [0xb89a6c, 0xa88a5e, 0xc4a878];
    let wallC;
    if (F.variant === 1) wallC = shade(F.pick(wallTones), 0.16);
    else if (F.variant === 2) wallC = F.pick([0x6e5238, 0x5e4630]);
    else if (F.variant === 3) wallC = 0x453a2a;
    else if (F.variant === 4) wallC = shade(0xc4a878, 0.28);
    else wallC = F.pick(wallTones);

    const deckY = 0.22;
    const wallH = 4.3;
    const doorW = 1.7, doorH = 2.5;
    const roofW = 16.6, roofD = 12.6;
    const openC = 0x241d15, shutC = shade(wallC, -0.26);

    const lash = (x, y, z, r) => F.cyl(x, y, z, r + 0.055, 0.14, 0, rope, 'cloth');
    /* hip roof + eave fascia + hip rafters + a thatch course line, so the
       slope is not one blank plane and the overhang past the walls reads */
    const ring = (y, rw, rd, t, c) => {
      F.beam(-rw / 2, y, -rd / 2, rw / 2, y, -rd / 2, t, t, c, 'wood');
      F.beam(-rw / 2, y, rd / 2, rw / 2, y, rd / 2, t, t, c, 'wood');
      F.beam(-rw / 2, y, -rd / 2, -rw / 2, y, rd / 2, t, t, c, 'wood');
      F.beam(rw / 2, y, -rd / 2, rw / 2, y, rd / 2, t, t, c, 'wood');

    const hipRoof = (y, rw, rd, rh, c, light) => {
      F.pyrRoof(0, y, 0, rw, rh, rd, 0, c, 'thatch');
      ring(y, rw, rd, 0.2, shade(c, -0.2));
      if (light !== false) {
        for (const s of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          F.rod(s[0] * rw / 2, y + 0.05, s[1] * rd / 2, 0, y + rh, 0, 0.07, shade(c, -0.3), 'wood');
        }
        const f = 1 - 0.42;
        ring(y + rh * 0.42, rw * f + 0.16, rd * f + 0.16, 0.13, shade(c, -0.26));

    };

    /* deck platform the lot sits on, with its board edges showing all round */
    F.box(0, 0, 0, w + 1.4, deckY, d + 1.4, 0, 0x8a7550, 'wood');

      F.beam(-(hw + 0.7), 0.12, s * (hd + 0.62), hw + 0.7, 0.12, s * (hd + 0.62), 0.2, 0.2, shade(0x8a7550, -0.2), 'wood');
      F.beam(s * (hw + 0.62), 0.12, -(hd + 0.7), s * (hw + 0.62), 0.12, hd + 0.7, 0.2, 0.2, shade(0x8a7550, -0.2), 'wood');

    const segW = (w - doorW) / 2;

    F.box(doorW / 2 + segW / 2, deckY, hd - wallT / 2, segW, wallH, wallT, 0, wallC, 'wood');

    F.box(-doorW * 0.3, deckY + 1.1, hd - wallT / 2 - 0.1, 0.12, 0.12, 0.1, 0, 0x2a2620, 'metal');

    /* openings and shutters on all four elevations, so it reads in the round */

    for (let i = 0; i < 2; i++) {

    for (let i = 0; i < 4; i++) {

    const wallTop = deckY + wallH;

      F.cyl(-1.0, deckY, hd + 0.85, 0.1, 2.6, 0, postColor, 'wood');

      lash(1.0, deckY + 2.2, hd + 0.85, 0.1);

      for (let i = 0; i < 6; i++) F.box(chimX, deckY + i * 0.9, -hd + 0.5, 0.55, 0.85, 0.55, F.rr(-0.05, 0.05), shade(0x8a857a, F.rr(-0.05, 0.05)), 'stone');

       border-radius:8px;padding:8px 11px;font-family:Georgia,serif;font-size:11.5px;line-height:1.6;max-width:230px;}
