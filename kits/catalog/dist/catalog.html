    const n = Math.floor(H / 0.3);
    for (let i = 1; i <= n; i++) { const t = i / (n + 0.5); F.rod(-W / 2 + 0.05, 0.03 + t * (H - 0.06), zb - t * (zb - zt), W / 2 - 0.05, 0.03 + t * (H - 0.06), zb - t * (zb - zt), 0.018, P.wood, P.wf); }
  };

  B.board = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h;
    const kind = S.board || 'slate', zb = -D / 2;
    F.box(0, 0.4, zb + 0.03, W, H - 0.4, 0.06, 0, P.woodD, P.wf);
    const face = kind === 'slate' ? P.stone : kind === 'hide' ? P.cloth[0] : kind === 'bark' ? P.woodD : kind === 'plastic' ? P.clothL : P.woodL;
    const ff = kind === 'slate' ? P.sf : kind === 'hide' ? P.cf : kind === 'plastic' ? 'plastic' : P.wf;
    F.box(0, 0.46, zb + 0.065, W - 0.12, H - 0.52, 0.01, 0, face, ff);
    for (let i = 0; i < 5; i++) F.box(-W * 0.3 + F.rr(0, W * 0.5), 0.6 + i * (H - 0.9) / 5, zb + 0.072, F.rr(0.15, W * 0.5), 0.015, 0.004, 0, P.clothL, 'plaster');
    K.motifAt(F, P, S, W * 0.3, H - 0.25, zb + 0.072, 0.14, 0);
    for (const s of [-1, 1]) F.box(s * (W / 2 - 0.05), 0, zb + 0.05, 0.08, 0.45, 0.1, 0, P.woodD, P.wf);
    F.box(0, 0.42, zb + 0.09, W - 0.2, 0.03, 0.06, 0, P.wood, P.wf);                   /* chalk ledge */
  };

/* ======== Role builders: surface pieces (bowl, jug, books) ======== */
  B.bowl = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, H = o.h, v = o.variant || 0;
    const R = W / 2;
    F.cyl(0, 0, 0, R * 0.45, 0.015, 0, F.shade(P.clay, -0.12), P.clf);
    F.frustum(0, 0.015, 0, R * 0.5, R * 0.98, H * 0.42, 0, P.clay, P.clf, 14);
    F.cyl(0, H * 0.43, 0, R * 0.9, 0.01, 0, o.court ? P.acc : P.clothL, o.court ? P.af : P.clf);
    if (v === 0) {
      for (let i = 0; i < 5; i++) { const a = i / 5 * F.TAU + F.rr(-0.2, 0.2), r = i ? R * 0.42 : 0; F.ball(Math.cos(a) * r, H * 0.5 + (i ? 0 : R * 0.2), Math.sin(a) * r, R * 0.22, P.pick(), 'plant'); }
    } else {
      for (let i = 0; i < 3; i++) F.cyl(F.rr(-0.02, 0.02), H * 0.44 + i * 0.015, F.rr(-0.02, 0.02), R * 0.7, 0.014, 0, F.shade(P.clothL, F.rr(-0.1, 0.05)), 'plant');
    }
  };

  B.jug = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h;
    const tray = o.court;
    let y = 0;
    if (tray) { F.cyl(0, 0, 0, Math.min(W, D) / 2, 0.012, 0, P.acc, P.af); y = 0.012; }
    const jx = -W * 0.2, jh = H - y - 0.02;
    F.frustum(jx, y, 0, 0.055, 0.09, jh * 0.3, 0, P.clay, P.clf, 12);
    F.frustum(jx, y + jh * 0.3, 0, 0.09, 0.045, jh * 0.3, 0, F.shade(P.clay, 0.05), P.clf, 12);
    F.cyl(jx, y + jh * 0.6, 0, 0.04, jh * 0.32, 0, F.shade(P.clay, -0.05), P.clf);
    F.cyl(jx, y + jh * 0.92, 0, 0.05, jh * 0.08, 0, o.court ? P.acc : F.shade(P.clay, -0.12), o.court ? P.af : P.clf);
    F.beam(jx, y + jh * 0.85, -0.045, jx, y + jh * 0.42, -0.1, 0.022, 0.012, F.shade(P.clay, -0.08), P.clf);
    for (const [x, z] of [[W * 0.2, D * 0.15], [W * 0.34, -D * 0.2]]) F.frustum(x, y, z, 0.028, 0.038, jh * 0.22, 0, o.court ? P.acc : F.shade(P.clay, 0.1), o.court ? P.af : P.clf, 10);
  };

  B.books = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h;
    const fill = S.shelfFill || 'books';
    if (fill === 'scrolls' || fill === 'bundles') {
      let y = 0;
      const rr = Math.min(0.035, H / 6);
      for (let row = 0; row < 3; row++) {
        for (let i = 0; i < 3 - row; i++) F.rod(-W * 0.25 + i * rr * 2.1 + row * rr, y + rr, -D / 2 + 0.02, -W * 0.25 + i * rr * 2.1 + row * rr, y + rr, D / 2 - 0.02, rr, F.shade(P.clothL, F.rr(-0.12, 0.04)), 'plaster');
        y += rr * 1.75;
      }
      F.box(W * 0.28, 0, 0, 0.09, 0.02, D * 0.8, 0.1, P.pick(), P.cf);
      F.cyl(W * 0.28, 0.02, 0, 0.012, 0.012, 0, P.acc, P.af);
    } else if (fill === 'tablets') {
      for (let i = 0; i < 3; i++) F.box(-W * 0.2 + i * 0.03, i * 0.025, 0, W * 0.5, 0.025, D * 0.7, F.rr(-0.15, 0.15), F.shade(P.stone, F.rr(-0.1, 0.1)), P.sf);
    } else {
      let y = 0;
      for (let i = 0; i < 5; i++) {
        const w = F.rr(W * 0.55, W * 0.8), d = F.rr(D * 0.55, D * 0.8), t = Math.min(0.06, H / 5.5) * F.rr(0.7, 1), r = F.rr(-0.25, 0.25);
        F.box(0, y, 0, w, t, d, r, P.pick(), P.cf);
        F.box(0, y + 0.005, 0.006, w - 0.02, t - 0.01, d - 0.005, r, P.clothL, 'plaster');
        y += t;
      }
      if (o.court) F.box(0, y, 0, W * 0.2, 0.01, D * 0.3, 0, P.acc, P.af);
    }
  };

/* ======== Role builders: tapestry, wall art, statues ======== */
  /* tapestry: a rod, a field, borders and the culture's device in the middle. Wall anchor. */
  B.tapestry = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, v = o.variant || 0;
    const zb = -D / 2;
    const sym = K.symbolOf(S, o.culture);
    if (v !== 2) {
      /* painted: the emblem on the pack colours (v 0), on the sheet's second cloth (v 1), or a banded field with a row of small emblems (v 3) */
      F.rod(-W / 2, H - 0.04, zb + 0.05, W / 2, H - 0.04, zb + 0.05, 0.02, P.woodD, P.wf);
      for (const s of [-1, 1]) K.finial(F, P, S, s * (W / 2 - 0.03), H - 0.08, zb + 0.05, 0.03);
      const E = K.emblemCols(F, S);
      if (v === 1) { const t = E.field; E.field = F.css(P.cloth[1 % P.cloth.length]); E.band = t; }
      const top = H - 0.08, bot = 0.12, fh = top - bot;
      const key = 'tap:' + o.culture + ':' + (sym || 'none') + ':' + v + ':' + W.toFixed(2) + 'x' + fh.toFixed(2) + ':' + E.field + E.ink;
      F.decal(0, bot, zb + 0.03, W - 0.1, fh, 0, key, function (g, cw, ch) {
        if (v === 3) {
          const n = 7, bh = ch / n;
          for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? E.band : E.field; g.fillRect(0, i * bh, cw, bh + 1); }
          g.fillStyle = E.edge; g.fillRect(0, 0, cw, bh * 0.4); g.fillRect(0, ch - bh * 0.4, cw, bh * 0.4);
          const R = Math.min(bh * 1.3, cw / 8);
          for (let i = 0; i < 3; i++) if (K.hasSym(sym)) SYMBOLS[sym](g, cw * (0.2 + i * 0.3), ch * 0.5, R, E.ink, E.ink2);
        } else K.paintBanner(g, cw, ch, E, sym, { bands: true });
      }, P.cf);
      const fr = F.col(S.emblem && S.emblem.band ? S.emblem.band : S.cloth[2 % S.cloth.length]);
      for (let i = 0; i < Math.floor((W - 0.2) / 0.1); i++) F.box(-W / 2 + 0.15 + i * 0.1, 0.03, zb + 0.03, 0.04, 0.09, 0.01, 0, fr, P.cf);   /* fringe */
      return;
    }
    const kind = S.tapestry || 'medallion';
    const field = P.cloth[v % P.cloth.length], edge = P.cloth[(v + 1) % P.cloth.length], band = P.cloth[(v + 2) % P.cloth.length];
    const ink = P.acc, inkF = P.af;
    F.rod(-W / 2, H - 0.04, zb + 0.05, W / 2, H - 0.04, zb + 0.05, 0.02, P.woodD, P.wf);
    for (const s of [-1, 1]) K.finial(F, P, S, s * (W / 2 - 0.03), H - 0.08, zb + 0.05, 0.03);
    const top = H - 0.08, bot = 0.12, cy = (top + bot) / 2, fh = top - bot;
    F.box(0, bot, zb + 0.02, W - 0.1, fh, 0.02, 0, field, P.cf);
    F.box(0, bot, zb + 0.032, W - 0.1, 0.1, 0.004, 0, band, P.cf);
    F.box(0, top - 0.1, zb + 0.032, W - 0.1, 0.1, 0.004, 0, band, P.cf);
    for (const s of [-1, 1]) F.box(s * (W / 2 - 0.1), bot, zb + 0.032, 0.1, fh, 0.004, 0, edge, P.cf);
    const zf = zb + 0.038, R = Math.min(W - 0.4, fh - 0.4) / 2;
    if (kind === 'stripes') {
      for (let i = 0; i < Math.floor(fh / 0.24); i++) F.box(0, bot + 0.12 + i * 0.24, zf, W - 0.3, 0.1, 0.004, 0, i % 2 ? band : ink, i % 2 ? P.cf : inkF);
    } else if (kind === 'chevrons') {
      for (let i = 0; i < Math.floor(fh / 0.3); i++) K.motifAt(F, P, S, 0, bot + 0.25 + i * 0.3, zf, Math.min(W - 0.4, 0.5), 0, 'chevron');
    } else if (kind === 'grid') {
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) F.box(-R * 0.6 + i * R * 0.6, cy - R * 0.6 + j * R * 0.6 - 0.05, zf, R * 0.3, R * 0.3, 0.004, 0, (i + j) % 2 ? ink : band, (i + j) % 2 ? inkF : P.cf);
    } else if (kind === 'sun') {
      K.disc(F, 0, cy, zf, zf + 0.004, R * 0.42, ink, inkF);

      for (let i = 0; i < 3; i++) K.motifAt(F, P, S, -R * 0.55 + i * R * 0.55, H / 2, zb + 0.06, R * 0.5, 0);

  /* floor ornament: a figure, an idol, a totem pole, an urn, a globe, a skull pole, an obelisk, a vase, a guardian beast */

    K.band(F, P, S, 0, plinthH / 2, D / 2, W - 0.2, plinthH * 0.4, 0);

      for (const s of [-1, 1]) F.cone(s * R * 0.5, y0 + bh * 0.78, 0, R * 0.2, bh * 0.2, 0, F.shade(P.acc, -0.1), P.af);

    } else if (kind === 'totem' || kind === 'skullpole') {
      F.cyl(0, y0, 0, R * 0.45, bh, 0, P.wood, P.wf);
      for (let i = 0; i < 3; i++) {
        const y = y0 + bh * (0.15 + i * 0.3);
        if (kind === 'skullpole') { F.ball(0, y + R * 0.4, R * 0.08, R * 0.4, P.acc, 'bone'); F.box(0, y, R * 0.2, R * 0.5, R * 0.3, R * 0.4, 0, F.shade(P.acc, -0.1), 'bone'); }
        else { F.box(0, y, 0, R * 1.6, bh * 0.22, R * 1.1, 0, i % 2 ? P.woodL : P.acc, i % 2 ? P.wf : P.af); K.motifAt(F, P, S, 0, y + bh * 0.11, R * 0.55, R * 0.8, 0); }
      }
      for (const s of [-1, 1]) F.beam(0, y0 + bh * 0.9, 0, s * (W / 2 - 0.02), y0 + bh * 0.98, 0, 0.08, 0.1, P.acc, P.af);
    } else if (kind === 'urn' || kind === 'vase') {
      F.frustum(0, y0, 0, R * 0.4, R * 0.9, bh * 0.45, 0, P.clay, P.clf, 16);
      F.frustum(0, y0 + bh * 0.45, 0, R * 0.9, R * 0.35, bh * 0.35, 0, F.shade(P.clay, 0.05), P.clf, 16);
      F.cyl(0, y0 + bh * 0.8, 0, R * 0.45, bh * 0.2, 0, F.shade(P.clay, -0.08), P.clf);
      F.cyl(0, y0 + bh * 0.42, 0, R * 0.91, bh * 0.06, 0, P.acc, P.af);
      K.band(F, P, S, 0, y0 + bh * 0.45, R * 0.88, R * 1.2, bh * 0.08, 0);
      if (kind === 'vase') for (let i = 0; i < 4; i++) { const a = i * 1.6; F.rod(0, y0 + bh * 0.9, 0, Math.cos(a) * R * 0.5, y0 + bh * 1.0, Math.sin(a) * R * 0.5, 0.01, P.rope, 'plant'); F.ball(Math.cos(a) * R * 0.5, y0 + bh * 1.0, Math.sin(a) * R * 0.5, R * 0.12, P.pick(), 'plant'); }
    } else if (kind === 'globe') {
      F.cyl(0, y0, 0, R * 0.5, bh * 0.1, 0, P.wood, P.wf);
      F.cyl(0, y0 + bh * 0.1, 0, R * 0.12, bh * 0.35, 0, P.wood, P.wf);
      F.ball(0, y0 + bh * 0.72, 0, R * 0.82, P.acc, P.af);
      F.rod(-R * 0.6, y0 + bh * 0.2, 0, R * 0.6, y0 + bh * 0.99, 0, 0.02, P.metal, P.mf);
    } else if (kind === 'obelisk') {
      F.frustum(0, y0, 0, R * 0.5, R * 0.3, bh * 0.85, 0, P.stone, P.sf, 4);
      F.cone(0, y0 + bh * 0.85, 0, R * 0.42, bh * 0.15, Math.PI / 4, P.acc, P.af);
      for (let i = 0; i < 3; i++) K.motifAt(F, P, S, 0, y0 + bh * (0.2 + i * 0.25), R * 0.48 - i * R * 0.06, R * 0.5, 0);

      F.frustum(0, y0, 0, R * 0.7, R * 0.4, bh * 0.55, 0, P.stone, P.sf, 10);
      F.cyl(0, y0 + bh * 0.55, 0, R * 0.42, bh * 0.22, 0, P.stone, P.sf);

      F.dome(0, y0 + bh * 0.95, 0, R * 0.28, bh * 0.05, 0, P.acc, P.af);
      for (const s of [-1, 1]) F.beam(s * R * 0.35, y0 + bh * 0.72, 0, s * R * 0.2, y0 + bh * 0.45, R * 0.4, R * 0.18, R * 0.18, P.stone, P.sf);

    }

FURN({
  key: 'voth_bench', name: 'Street Bench', culture: 'voth', type: 'bench', setting: 'outdoor',
  rooms: ['street', 'plaza', 'yard'], anchor: 'floor', clearance: { front: 0.7 },
  materials: ['timber'],
  w: 3.4, d: 1.0, h: 1.2, variants: 2,

  build: function (F) {

    const c = F.pick(['timberTaupeLight', 'timberGrey', 'timberTaupe']);
    const legC = F.shade(c, -0.25), pegC = F.shade(c, -0.42);
    const seatH = 0.5, seatT = 0.12;
    /* two trestle ends: slab leg, splayed foot, knee brace up to the seat */
    for (let s = -1; s <= 1; s += 2) {
      const lx = s * 1.45 + F.rr(-0.03, 0.03);
      F.box(lx, 0.08, 0, 0.26, seatH - 0.08, 0.76, 0, legC, 'wood');
      F.box(lx, 0, 0, 0.34, 0.1, 0.96, 0, F.shade(legC, -0.14), 'wood');
      F.beam(lx - s * 0.1, seatH - 0.07, 0, lx + s * 0.34, 0.24, 0, 0.09, 0.5, legC, 'wood');
    }
    /* aprons front and back, one low stretcher tying the ends */
    F.box(0, seatH - 0.17, -0.34, 3.02, 0.15, 0.08, 0, F.shade(c, -0.15), 'wood');
    F.box(0, seatH - 0.17, 0.34, 3.02, 0.15, 0.08, 0, F.shade(c, -0.15), 'wood');
    F.box(0, 0.21, 0, 2.86, 0.11, 0.13, 0, F.shade(c, -0.2), 'wood');
    /* seat: three planks, each laid a hair differently */
    for (let i = 0; i < 3; i++) {
      F.box(0, seatH + F.rr(0, 0.012), -0.3 + i * 0.3, 3.4, seatT, 0.28, 0,
        F.shade(c, F.rr(-0.05, 0.05)), 'wood');
    }
    /* draw-pegs through the seat into the leg tenons, both ends */
    for (let s = -1; s <= 1; s += 2) F.cyl(s * 1.45, seatH + seatT - 0.01, 0.27, 0.032, 0.035, 0, pegC, 'wood');
    F.blob(F.rr(-0.9, 0.9), seatH + seatT, F.rr(-0.2, 0.2), 0.11, 0.022, F.rr(0, F.TAU), F.shade(c, -0.3), 'wood');
    if (backed) {
      for (let s = -1; s <= 1; s += 2) {
        F.box(s * 1.45, seatH + seatT, -0.34, 0.13, 0.46, 0.12, 0, legC, 'wood');
        F.cone(s * 1.45, seatH + seatT + 0.46, -0.34, 0.09, 0.1, 0, F.shade(legC, 0.1), 'wood');
      }
      F.box(0, 1.02, -0.34, 3.06, 0.14, 0.09, 0, c, 'wood');
      F.box(0, 0.74, -0.34, 2.96, 0.09, 0.07, 0, F.shade(c, -0.1), 'wood');
      for (let i = 0; i < 3; i++) {

FURN({

  build: function (F) {
    const ornate = F.variant === 1;
    const iron = F.col('iron'), bowlC = ornate ? F.col('steelLight') : F.col('steel');
    const coalC = F.cols(['ember', 'amber', 'coal']);
    let bowlTop;
    if (!ornate) {
      /* forged stand: four splayed legs to a hub, tied by a mid ring */
      for (let i = 0; i < 4; i++) {
        const a = i * F.TAU / 4;
        const fx = Math.cos(a) * 0.55, fz = Math.sin(a) * 0.55;
        F.rod(fx, 0.04, fz, Math.cos(a) * 0.14, 0.72, Math.sin(a) * 0.14, 0.045, iron, 'metal');
        F.box(fx, 0, fz, 0.19, 0.06, 0.19, a, F.shade(iron, -0.15), 'metal');
        const b = (i + 1) % 4 * F.TAU / 4;
        F.rod(Math.cos(a) * 0.36, 0.33, Math.sin(a) * 0.36,
          Math.cos(b) * 0.36, 0.33, Math.sin(b) * 0.36, 0.022, F.shade(iron, 0.08), 'metal');
      }
      F.frustum(0, 0.6, 0, 0.26, 0.5, 0.3, 0, bowlC, 'metal', 10);
      F.cyl(0, 0.9, 0, 0.52, 0.07, 0, F.shade(bowlC, 0.1), 'metal');
      F.cyl(0, 0.84, 0, 0.44, 0.06, 0, F.col('stoneSoot'), 'stone');
      bowlTop = 0.94;
    } else {
      /* guild brazier: stepped stone foot, fluted column, chased brass bowl */
      F.box(0, 0, 0, 1.2, 0.16, 1.2, 0, F.col('stoneTaupe'), 'stone');
      F.frustum(0, 0.16, 0, 0.5, 0.34, 0.2, 0, F.col('stoneGrey'), 'stone', 8);
      F.cyl(0, 0.36, 0, 0.19, 0.78, 0, F.shade(bowlC, -0.2), 'metal');
      for (let i = 0; i < 4; i++) {
        const a = i * F.TAU / 4 + 0.78;
        F.rod(Math.cos(a) * 0.2, 0.4, Math.sin(a) * 0.2, Math.cos(a) * 0.2, 1.1, Math.sin(a) * 0.2, 0.026, F.shade(bowlC, 0.12), 'metal');
      }
      F.cyl(0, 1.14, 0, 0.24, 0.08, 0, F.shade(bowlC, -0.1), 'metal');
      F.frustum(0, 1.22, 0, 0.24, 0.56, 0.32, 0, bowlC, 'metal', 12);
      F.cyl(0, 1.5, 0, 0.6, 0.08, 0, F.shade(bowlC, 0.12), 'metal');
      F.cyl(0, 1.44, 0, 0.5, 0.06, 0, F.col('stoneSoot'), 'stone');
      /* four cast lugs, one to each side, so it reads from every angle */
      for (let i = 0; i < 4; i++) {
        const a = i * F.TAU / 4;
        F.rod(Math.cos(a) * 0.56, 1.46, Math.sin(a) * 0.56, Math.cos(a) * 0.69, 1.34, Math.sin(a) * 0.69, 0.035, F.shade(bowlC, -0.15), 'metal');
      }
      bowlTop = 1.56;
    }
    const sc = ornate ? 1.25 : 1;
    for (let i = 0; i < 3; i++) {
      const a = F.rr(0, F.TAU), r = F.rr(0, 0.3 * sc);
      F.blob(Math.cos(a) * r, bowlTop - 0.02, Math.sin(a) * r, F.rr(0.07, 0.11), 0.09, 0, F.pick(coalC), 'glow');
    }
    F.cone(0, bowlTop - 0.04, 0, 0.24 * sc, 0.32 * sc, 0, F.col('ember'), 'glow');
    F.cone(0, bowlTop + 0.1, 0, 0.13 * sc, 0.3 * sc, 0, F.col('flame'), 'glow');
    F.ball(F.rr(-0.05, 0.05), bowlTop + (ornate ? 0.5 : 0.44), F.rr(-0.05, 0.05), 0.05, F.col('candle'), 'glow');

  }
});

    if (S.boxHelper.material) { S.boxHelper.material.depthTest = false; S.boxHelper.material.transparent = true; }

    const u = S.sel.userData;

    const hw = dims.w / 2, hd = dims.d / 2, y = 0.05;
    const c = Math.cos(u.ry), s = Math.sin(u.ry);

    if (ctl.walk) {

      ctl.target.set(c.x, ctl.eyeHeight, c.z + size * 1.1 + 3);

      const dd = d.d ? (m.d / d.d - 1) * 100 : 0;
      const dh = d.h ? (m.h / d.h - 1) * 100 : 0;
      const worst = [dw, dd, dh].reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0);

   for a page that loads them. Furniture rows are one per culture and tier; ?cultures=a,b
   shows only those cultures' furniture. Each instance is built at ry = 0, so local axes are world

  let sheet = (qs.get('sheet') || 'furniture').toLowerCase();
  if (sheet === 'all') sheet = 'furniture';
  if (SHEETS.indexOf(sheet) < 0) sheet = 'furniture';
  /* ?cultures=xanadu,voth lays out only those cultures' furniture: a light page for one set */

    g.fillRect(0, 0, c.width, c.height);

  count.textContent = FURNS.length + ' furniture' + (PLANTS.length ? ' · ' + PLANTS.length + ' plants' : '') +
    (ASSETS.length ? ' · ' + ASSETS.length + ' buildings' : '') + ' — ' + INSTANCES.length + ' instances';
  const ss = document.getElementById('sheetSel');

  function gotoRow(i) {
    const r = rows[i];
    if (!r) return;
    if (ctl.walk) window._setWalk(false);
    const span = Math.min(r.width, r.kind === 'furniture' ? 40 : 120);
    ctl.target.set(span / 2, Math.min(r.depth, 8) * 0.3, r.z - r.depth / 2);

  window._ready = true;
})();

/* ======================== Hover inspector ========================
   Hover inspector (repo README "DEV TOOLS"): toggle with T or the toolbar
   button. When on, the pointer names the instance under it, its class
   (furniture / flora / building) and its tags. Off by default; the click
   inspector (inspector.js) is always available for measuring and auditing.

(function () {

      if (A.type) t.push('type: ' + A.type);
      if (A.setting) t.push(A.setting);
      if (A.rooms) t.push('rooms: ' + A.rooms.join(', '));
      if (A.anchor) t.push('anchor: ' + A.anchor);
      if (A.materials) t.push('materials: ' + A.materials.join(', '));
    } else if (u.kind === 'plant') {
      t.push('climate: ' + A.climate, 'aridity: ' + A.aridity);
    } else {
      t.push('culture: ' + A.culture, 'family: ' + (A.family || '?'));
      if (A.types && A.types.length) t.push('types: ' + A.types.join(', '));
      if (A.districts && A.districts.length) t.push('districts: ' + A.districts.join(', '));
    }
    return t;
  }

    const u = g.userData, A = u.asset;
    return '<div class="cls">' + (CLASS[u.kind] || u.kind) + '</div><b>' + A.name + '</b>' +
      (A.variants > 1 ? ' <span style="opacity:.6">#' + (u.opt.variant + 1) + '/' + A.variants + '</span>' : '') +
      '<br>' + tagsOf(u).map(s => '<span class="tag">' + s + '</span>').join('');

      POLY.grp.add(new THREE.Line(geo, lineMat));
    }
    const f = p => POLY.fmt ? '{x:' + r2(p[0]) + ',z:' + r2(p[1]) + '}' : '[' + r2(p[0]) + ',' + r2(p[1]) + ']';
    out.value = '[' + POLY.pts.map(f).join(',') + ']';
    const last = POLY.pts[POLY.pts.length - 1], g = last && nearest(last[0], last[1]);
    if (g) {
      const u = g.userData, c = Math.cos(u.ry), s = Math.sin(u.ry), dx = last[0] - u.x, dz = last[1] - u.z;
      /* inverse of the frame's toWorld: lx = dx cos - dz sin, lz = dx sin + dz cos */
      near.textContent = 'nearest: ' + u.key + ' #' + (u.opt.variant + 1) + ' — last vertex in its frame: [' +
        r2(dx * c - dz * s) + ',' + r2(dx * s + dz * c) + ']';
    } else near.textContent = '';
    window._poly = POLY.pts.slice();
  }
  function add(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) { POLY.pts.push([hit.x, hit.z]); redraw(); }
  }
  function setOn(v) {
    POLY.on = v; btn.classList.toggle('on', v); panel.style.display = v ? 'block' : 'none'; POLY.grp.visible = v;
  }
  /* a click (not a drag) adds or removes a vertex; captured before the inspector's own mouseup */
  let down = null;
  renderer.domElement.addEventListener('mousedown', (e) => { down = [e.clientX, e.clientY, e.button]; }, true);
  renderer.domElement.addEventListener('mouseup', (e) => {
    if (!POLY.on || !down) return;
    const click = Math.abs(e.clientX - down[0]) < 4 && Math.abs(e.clientY - down[1]) < 4;
    down = null;
    if (!click) return;
    if (e.button === 0) add(e.clientX, e.clientY);
    else if (e.button === 2) { POLY.pts.pop(); redraw(); }
    e.stopImmediatePropagation();
    ctl.dragging = false; ctl.panning = false;
  }, true);
  btn.onclick = () => setOn(!POLY.on);
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.toLowerCase() === 'p') setOn(!POLY.on);
  });
  document.getElementById('polyundo').onclick = () => { POLY.pts.pop(); redraw(); };
  document.getElementById('polyclear').onclick = () => { POLY.pts = []; redraw(); };
  document.getElementById('polyclose').onclick = () => { if (POLY.pts.length > 2) { POLY.pts.push(POLY.pts[0].slice()); redraw(); } };
  document.getElementById('polyfmt').onclick = (e) => { POLY.fmt ^= 1; e.target.textContent = POLY.fmt ? 'Format: {x,z}' : 'Format: [x,z]'; redraw(); };
  document.getElementById('polycopy').onclick = () => {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (err) { document.execCommand('copy'); }
  };
  window._polyTool = { setOn: setOn, add: add, state: POLY };
})();
</script>
</body>
</html>
