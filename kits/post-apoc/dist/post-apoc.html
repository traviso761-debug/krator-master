/* tireRing(): courses of flat tyres round a circle of radius R on a rammed-earth core (wells, planters) */
function PA_tyreRing(F, R, courses) {
  const d = 0.7056, n = Math.max(3, Math.round(F.TAU * R / d)), step = F.TAU / n;
  F.cyl(0, 0, 0, R + 0.24, courses * 0.22, 0, F.col('earthRammed'), 'plaster');
  for (let c = 0; c < courses; c++) {
    const half = (c % 2) ? 0.5 : 0;
    for (let k = 0; k < n; k++) { const a = (k + half) * step; PA_tyre(F, Math.cos(a) * R, c * 0.22 + 0.12, Math.sin(a) * R, 0.36, 0.12, F.col('tyreBlack'), 'h', 8, F.rr(0, F.TAU)); }
  }
}

/* ---- kits/interiors/src/20-rooms.js ---- */
/* ======================== ROOM(): room registration ========================
   kits/interiors/SPEC.md "What a building exposes":

     ROOM({ building, kind, poly: [[x,z],...], y, h,
            doors:   [{ at:[x,z], w, to: 'street' | '<room id>', swing?, hinge? }],
            windows: [{ at:[x,z], w, sill, h? }],
            culture, wealth, id?, seed?, level?, fixtures? })

   poly is the floor outline at the INNER face of the walls, either winding. A door or window
   is snapped onto the nearest wall of the polygon; `at` may sit anywhere within 0.6 m of it (a door's
   `snap` widens that: the planner gives a street door on the OUTER face of a thick wall snap = wall + 0.6).
   Door extras this kit adds (all optional): swing 'in' (default) | 'out' | 'none' (an open
   doorway or curtain), hinge 'left' | 'right' (seen from inside, looking out; default 'left'),
   h (opening height, 2.1), leaf: false (another room draws this door's leaf: a shared door).

   fixtures: [{ id?, kind, x, z, ry, w, d, h?, clearance: { front, ... }, reach? }] are things the
   building already put in the room (a stair's flight, the well a stair rises through): the placer
   keeps furniture off them and out of their clearance, and keeps their front reachable unless
   reach: false. The planner (46-planner.js) writes them; level is the storey (0 = ground).

   ROOM() returns the normalised room. What the placer reads from it:
     id, building, kind, culture, wealth, y, h, seed
     poly            as given (copied), area, centroid, bbox
     walls[]         { i, a, b, len, t:[tx,tz] (a->b), n:[nx,nz] (INWARD unit normal), ry (a piece
                       backed onto this wall faces the room at this heading) }
     doors[]         { at, w, to, swing, hinge, wall, u (metres along the wall from a), n, ry }
     windows[]       { at, w, sill, h, wall, u, n }
     fixtures[]      { id, kind, x, z, ry, w, d, h, clearance, reach, stair?, end? }
   Registered rooms live in KratorInteriors.rooms / roomById; IX.normRoom() normalises without
   registering (the placer accepts either).
   ====================================================================== */
(function (IX) {
  'use strict';
  const G = IX.geom;
  IX.rooms = [];
  IX.roomById = {};
  IX.ROOM_KINDS_KNOWN = ['hall', 'bedroom', 'kitchen', 'store', 'workshop', 'shrine', 'tavern', 'library', 'school',
    'study', 'barracks', 'court', 'yard', 'rooftop', 'antechamber'];

  function snap(room, at, what, tol) {
    let best = null, bd = Infinity;
    for (const W of room.walls) {
      const d = G.segDist(at[0], at[1], W.a, W.b);
      if (d < bd) { bd = d; best = W; }
    }
    if (!best || bd > (tol || 0.6)) throw new Error('ROOM ' + room.id + ': ' + what + ' at [' + at + '] is ' + bd.toFixed(2) + ' m from every wall');
    const u = Math.max(0, Math.min(best.len, (at[0] - best.a[0]) * best.t[0] + (at[1] - best.a[1]) * best.t[1]));
    return { W: best, u: u, at: [best.a[0] + best.t[0] * u, best.a[1] + best.t[1] * u] };
  }

  IX.normRoom = function (o) {
    if (!o || !Array.isArray(o.poly) || o.poly.length < 3) throw new Error('ROOM needs poly: [[x,z], ...] with 3+ points');
    const poly = o.poly.map(function (p) { return [+p[0], +p[1]]; });
    const sa = G.area(poly);
    if (Math.abs(sa) < 0.5) throw new Error('ROOM ' + (o.id || o.building) + ': polygon area ' + sa.toFixed(2) + ' m2 is too small');
    const sign = sa > 0 ? 1 : -1;
    const R = {
      id: o.id || ((o.building || 'room') + '.room.' + IX.rooms.length),
      building: o.building || null, kind: o.kind || 'hall', culture: o.culture || null,
      wealth: o.wealth == null ? 0.5 : Math.max(0, Math.min(1, +o.wealth)),
      y: +(o.y || 0), h: +(o.h || 3.0),
      poly: poly, area: Math.abs(sa), centroid: G.centroid(poly), bbox: G.bbox(poly),
      walls: [], doors: [], windows: [], fixtures: [], level: o.level == null ? 0 : +o.level, src: o
    };
    R.seed = o.seed != null ? (o.seed >>> 0) : IX.hash(R.id);
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
      if (len < 1e-6) continue;

      R.doors.push({ i: k, id: d.id || null, at: s.at, w: +(d.w || 1.0), to: d.to || 'street', swing: d.swing || 'in', hinge: d.hinge || 'left',
        h: +(d.h || 2.1), leaf: d.leaf !== false, wall: s.W.i, u: s.u, n: s.W.n, ry: s.W.ry });
    });
    (o.windows || []).forEach(function (w, k) {
      const s = snap(R, w.at, 'window ' + k);
      R.windows.push({ i: k, at: s.at, w: +(w.w || 0.9), sill: w.sill == null ? 0.9 : +w.sill, h: +(w.h || 1.1), wall: s.W.i, u: s.u, n: s.W.n });
    });

      R.fixtures.push({ i: k, id: f.id || (R.id + '.fx' + k), kind: f.kind || 'fixture', x: +f.x, z: +f.z, ry: +(f.ry || 0),
        w: +f.w, d: +f.d, h: f.h == null ? R.h : +f.h, clearance: f.clearance || {}, reach: f.reach !== false,
        stair: f.stair || null, end: f.end || null });

    IX.rooms.push(R); IX.roomById[R.id] = R;
    return R;
  };
  IX.clearRooms = function () { IX.rooms.length = 0; for (const k in IX.roomById) delete IX.roomById[k]; };
})(KratorInteriors);

/* ======================== Occupancy grid and walk search ========================

   room polygon, at least `agent` metres from every wall (except in a doorway's mouth), and
   not under a floor piece's footprint grown by `agent`. Ceiling and surface pieces do not
   block. The placer keeps every door connected to every usable piece on this grid; a life
   layer takes the same grid for its nav (API.md "Reading the grid", 47-life.js).

     const g = IX.makeGrid(room, { cell: 0.1, agent: 0.2, nbr: 8, cutCorners: false });
     g.nx, g.nz, g.cell, g.nbr               cell (i, j) has centre (x0 + (i + .5) cell, z0 + (j + .5) cell)
     g.k(i, j) / g.ij(k) / g.centre(k) / g.at(x, z)  index helpers (at() is -1 outside the grid)
     g.walkable(k)                            base free and no footprint on it
     g.stamp(rect, +1 | -1)                   block / unblock a footprint (rect: IX.geom.rect)
     g.cellsIn(rect)                          cells whose centre lies in rect
     g.doorCells(door)                        the walkable cells just inside a door (walk starts)
     g.bfs(starts) -> { dist: Int32Array (-1 = unreached, in moves), prev: Int32Array }
     g.path(bfs, k) -> [[x, z], ...]          start -> cell k, along the BFS tree
     g.reaches(starts, groups) -> bool        every group (an array of cells) has a cell reached
                                              (early exit, no allocation: what the placer calls)
     g.route(starts, goals) -> [k, ...]|null  cheapest path (octile cost) from any start to any goal
     g.smooth([[x, z], ...]) -> [[x, z], ...] drops waypoints a straight walk can skip
     g.toJSON()                               { cell, x0, z0, nx, nz, nbr, rows: ['0101..', ...] } 1 = blocked

   Moves: nbr 8 (default) moves diagonally only when both cells it passes between are walkable
   (no corner cutting), so what is CONNECTED is exactly what 4-neighbour moves connect: the
   reach checks run 4-neighbour and nbr only shapes the paths. cutCorners: true lets a diagonal
   squeeze past a corner (then reach runs 8-neighbour too). { cell: 0.2, nbr: 4 } is the old grid.
   ====================================================================== */

  'use strict';
  const G = IX.geom;

          [i > 0 && j < nz - 1, k + nx - 1, W, Nn], [i < nx - 1 && j < nz - 1, k + nx + 1, E, Nn]];
        for (const c of cand) {

      let h = 0, t = 0;

    for (let i = 0; i < QF.length; i++) for (let j = i + 1; j < QF.length; j++) {
      const A = QF[i], B = QF[j];

      if (A.layer === 'surface' && B.layer === 'surface' && A.host === B.host && G.overlap(A.fp, B.fp, EPS))
        fail('overlap', A.p.id + ' overlaps ' + B.p.id + ' on one top');

      const pair = (A.pairedHost && A.host === B.p.id) || (B.pairedHost && B.host === A.p.id);

      for (const z of B.declared) if (G.overlap(A.fp, z, EPS)) fail('clearance', A.p.id + ' ' + A.p.key + " is in the clearance of " + B.p.id + ' ' + B.p.key);

      if (!G.rectInPoly(lo.poly, G.rect(ff.x, ff.z, ff.ry, ff.w, ff.d), 0)) fail('stairs', S.id + ' flight leaves ' + lo.id);
      if (!G.rectInPoly(up.poly, G.rect(ft.x, ft.z, ft.ry, ft.w, ft.d), 0)) fail('stairs', S.id + ' well leaves ' + up.id);

    if (B.levels.length > 1 && B.stairs.length < B.levels.length - 1) fail('stairs', (B.levels.length - 1 - B.stairs.length) + ' storey(s) without a stair up');
    (B.report.unreached || []).forEach(function (r) { fail('reach-graph', r + ' cannot be reached from the street'); });
    (B.report.warnings || []).forEach(function (w) { fail('plan', w); });

   planned buildings and rooms in world metres, ready for furnishRoom().

       types: [...],                   the building's types (the set's tags); a dwelling type makes it a residence

                                       face of the walls; program as planBuilding takes it)

       like: '<key>',                  copy another item's bodies and rooms (a reclaimed variant)
       skip: 'reason',                 no interior: open structure, a field, or GEOMETRY THAT PRECLUDES

       note: 'free text'               caveats worth keeping

       { item, id, buildings: [B], specs: [{ shell, program }], rooms: [R] (every room, world metres) }

        culture: r.culture || item.culture, wealth: r.wealth == null ? item.wealth : r.wealth, level: r.level || 0,

//                  listOf() instead makes it only when a record lands, for a build whose owners start without one);
//                  dry places nothing anywhere else (a throwaway build: Post-Apoc's frontOf)

//                                               summarised as data ({ item, rooms, pieces, residence }); pushed on R.buildings

// ================================================================= CORE FURNISH — the draw adapter's helpers ([draw])
// The three.js side of core/furnish: a placement record into the catalog's batch (KratorFurniture), and the one
// colour step every build needs when the batch becomes meshes. The catalog writes its colours as sRGB bytes; a
// build that renders in linear light converts them once, either in the vertex shader or into a float attribute.
// Each build keeps its own flush (it ties the meshes to its night lights and shadows); these are the parts the
// six copies shared.
//
//   KFURN.useBatch(R, KF, KI)            -> R.batch (a KratorFurniture batch) and R.adapter (KratorInteriors' runtime
//                                           adapter over it, for the interiors hook); call again for a fresh batch
//   KFURN.drawRec(R, rec, wealth, opt)   -> the batch's result for one record ({ lights, error, ... }); opt.detail
//                                           sets KratorFurniture's detail for this piece and restores it
//   KFURN.srgbHook(shader)               -> an onBeforeCompile body: linearise vColor in the vertex shader
//   KFURN.linearColours(geometry)        -> the colour attribute's sRGB bytes as linear floats (KFURN.SRGB_LIN)
(function(){
'use strict';
if(typeof KFURN === 'undefined') throw new Error('52-core-furnish-draw: load 50-core-furnish.js first');
KFURN.useBatch = function(R, KF, KI){ R.batch = KF.batch(); R.adapter = KI ? KI.runtimeAdapter(KF, R.batch) : null; R.KF = KF; return R.batch; };
KFURN.drawRec = function(R, rec, wealth, opt){
  const KF = R.KF, d = opt && opt.detail;
  if(d != null) KF.setDetail(d);
  const r = R.batch.place(rec.key, rec.x, rec.y, rec.z, rec.ry, { variant: rec.variant, seed: rec.seed, wealth: wealth,
    building: rec.building, setting: rec.setting });
  if(d != null) KF.setDetail(opt.after == null ? .5 : opt.after);
  return r;
};
KFURN.srgbHook = function(sh){
  sh.vertexShader = sh.vertexShader.replace('#include <color_vertex>',
    '#include <color_vertex>\n#ifdef USE_COLOR\n  vColor.rgb = pow(max(vColor.rgb, vec3(0.0)), vec3(2.2));\n#endif');
};
KFURN.linearColours = function(geo){
  const a = geo.getAttribute('color'); if(!a || a.array instanceof Float32Array) return;
  const src = a.array, out = new Float32Array(src.length), L = KFURN.SRGB_LIN;
  for(let i=0;i<src.length;i++) out[i] = L[src[i]];
  geo.setAttribute('color', new THREE.BufferAttribute(out, a.itemSize || 3));
};
})();

 insp.style.display='block';insp.innerHTML='<b>'+r.name+'</b>\n<span class="cls">'+(r.cls||'?')+'</span>'+(r.key?'  ·  '+r.key:'')+'\n'+tagLines+'\n<span style="opacity:.6">'+p.x.toFixed(1)+', '+p.y.toFixed(1)+', '+p.z.toFixed(1)+'</span>';}
uiButton('Inspector',true,()=>{INSP.on=!INSP.on;if(!INSP.on)insp.style.display='none';return INSP.on;});
uiButton('Shadows',true,()=>{renderer.shadowMap.enabled=!renderer.shadowMap.enabled;groundMat.needsUpdate=true;for(const k in MAT)MAT[k].needsUpdate=true;return renderer.shadowMap.enabled;});
{const cs=document.createElement('select');cs.id='cultsel';cs.title='cultural marker pack';for(const k in CULT.packs){const o=document.createElement('option');o.value=k;o.textContent='Culture: '+CULT.packs[k].name;cs.appendChild(o);}cs.value=CULT.cur.key;cs.onchange=()=>{buildWorld(cs.value);};ui.appendChild(cs);}

// ---- polygon tool: click the ground to lay out a polygon; copy-pasteable world coordinates
const POLY={on:false,pts:[],fmt:0,grp:new THREE.Group(),line:null};POLY.grp.userData.probeSkip=true;scene.add(POLY.grp);
const polyEl=document.getElementById('poly'),polyOut=document.getElementById('polyout');
const polyMat=new THREE.MeshBasicMaterial({color:0xff5060}),polyLineMat=new THREE.LineBasicMaterial({color:0xffe060});
function polyRedraw(){while(POLY.grp.children.length)POLY.grp.remove(POLY.grp.children[0]);
 for(const p of POLY.pts){const m=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,3,8),polyMat);m.position.set(p[0],terrainH(p[0],p[1])+1.5,p[1]);m.userData.probeSkip=true;POLY.grp.add(m);}
 if(POLY.pts.length>1){const g=new THREE.BufferGeometry().setFromPoints(POLY.pts.map(p=>new THREE.Vector3(p[0],terrainH(p[0],p[1])+.4,p[1])));const l=new THREE.Line(g,polyLineMat);l.userData.probeSkip=true;POLY.grp.add(l);}
 const f=p=>POLY.fmt?'{x:'+p[0].toFixed(1)+',z:'+p[1].toFixed(1)+'}':'['+p[0].toFixed(1)+','+p[1].toFixed(1)+']';

function polyAdd(cx,cy){const v=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);const hit=new THREE.Vector3();
 const gh=ray.intersectObjects(WORLD.children.concat([groundM]),true).find(h=>h.object===groundM||(h.object.userData&&h.object.userData.isGround));if(gh){POLY.pts.push([gh.point.x,gh.point.z]);polyRedraw();}else if(ray.ray.intersectPlane(pl,hit)){POLY.pts.push([hit.x,hit.z]);polyRedraw();}}
uiButton('Polygon',false,()=>{POLY.on=!POLY.on;polyEl.style.display=POLY.on?'block':'none';return POLY.on;});
document.getElementById('polyundo').onclick=()=>{POLY.pts.pop();polyRedraw();};
document.getElementById('polyclear').onclick=()=>{POLY.pts=[];polyRedraw();};
document.getElementById('polyclose').onclick=()=>{if(POLY.pts.length>2){POLY.pts.push(POLY.pts[0].slice());polyRedraw();}};
document.getElementById('polyfmt').onclick=e=>{POLY.fmt^=1;e.target.textContent=POLY.fmt?'Format: {x,z}':'Format: [x,z]';polyRedraw();};
document.getElementById('polycopy').onclick=()=>{polyOut.select();try{navigator.clipboard.writeText(polyOut.value);}catch(e){document.execCommand('copy');}};

// ---- walk mode (F): eye height 1.7 m, WASD, drag to look. The set is meant to be judged from here.

uiButton('Walk (F)',false,()=>{toggleWalk();return WALK.on;});
function toggleWalk(){WALK.on=!WALK.on;if(WALK.on){const d=new THREE.Vector3();camera.getWorldDirection(d);WALK.yaw=Math.atan2(-d.x,-d.z);WALK.pitch=0;
 WALK.x=camera.position.x;WALK.z=camera.position.z;WALK.y=terrainH(WALK.x,WALK.z)+1.7;}else{setView(WALK.x-Math.sin(WALK.yaw)*-30,20,WALK.z-Math.cos(WALK.yaw)*-30,WALK.x-Math.sin(WALK.yaw)*10,4,WALK.z-Math.cos(WALK.yaw)*10);}

document.title=TITLE;
document.getElementById('cap').textContent=TITLE+' — hover to inspect · drag to orbit · wheel to zoom · right-drag / WASD to move · F walk at eye height · Polygon to mark coordinates';
// input
const cv=renderer.domElement;let drag=null;const keys={};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,b:e.button};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{if(drag&&Math.abs(e.clientX-drag.sx)<4&&Math.abs(e.clientY-drag.sy)<4){if(drag.b===0&&POLY.on)polyAdd(e.clientX,e.clientY);else if(drag.b===2&&POLY.on){POLY.pts.pop();polyRedraw();}else if(drag.b===0&&!INSP.on)inspectAt(e.clientX,e.clientY);}drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!drag){if(INSP.on&&performance.now()-INSP.last>90){INSP.last=performance.now();inspectAt(e.clientX,e.clientY);}return;}

 if(drag.b===0){ctl.theta-=dx*.005;ctl.phi=clamp(ctl.phi-dy*.005,.05,Math.PI-.05);}
 else{const f=ctl.radius*.0015;const rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta));ctl.target.addScaledVector(rt,-dx*f).addScaledVector(fw,-dy*f);}});
cv.addEventListener('wheel',e=>{if(WALK.on){WALK.speed=clamp((WALK.speed||6)*(e.deltaY>0?.85:1.18),1,40);}else ctl.radius=clamp(ctl.radius*(e.deltaY>0?1.1:.9),2,2500);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='f')toggleWalk();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hud=document.getElementById('hud');let last=performance.now(),renderErr=false;
function frame(){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 if(WALK.on){const sp=(WALK.speed||6)*(keys.shift?2.5:1)*dt;const fw=new THREE.Vector3(-Math.sin(WALK.yaw),0,-Math.cos(WALK.yaw)),rt=new THREE.Vector3(Math.cos(WALK.yaw),0,-Math.sin(WALK.yaw));
  if(keys.w){WALK.x+=fw.x*sp;WALK.z+=fw.z*sp;}if(keys.s){WALK.x-=fw.x*sp;WALK.z-=fw.z*sp;}if(keys.d){WALK.x+=rt.x*sp;WALK.z+=rt.z*sp;}if(keys.a){WALK.x-=rt.x*sp;WALK.z-=rt.z*sp;}
  if(keys.e)WALK.y+=sp;if(keys.q)WALK.y-=sp;const ge=terrainH(WALK.x,WALK.z)+1.7;if(!keys.e&&!keys.q)WALK.y=ge;else WALK.y=Math.max(ge,WALK.y);}
 else{const sp=ctl.radius*.6*dt;const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta)),rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));
  if(keys.w)ctl.target.addScaledVector(fw,sp);if(keys.s)ctl.target.addScaledVector(fw,-sp);if(keys.d)ctl.target.addScaledVector(rt,sp);if(keys.a)ctl.target.addScaledVector(rt,-sp);
  if(keys.q)ctl.target.y-=sp;if(keys.e)ctl.target.y+=sp;}
 for(const f of FRAME_HOOKS)f(dt,now);
 applyCam();sky.position.copy(camera.position);giant.position.copy(camera.position).addScaledVector(giantDir,4200);sunDisc.position.copy(camera.position).addScaledVector(SUNDIR,4800);
 {const tg=WALK.on?new THREE.Vector3(WALK.x,0,WALK.z):ctl.target;sun.target.position.set(tg.x,0,tg.z);sun.position.set(tg.x+LIGHTDIR.x*300,LIGHTDIR.y*300,tg.z+LIGHTDIR.z*300);sun.target.updateMatrixWorld();}
 try{renderer.render(scene,camera);}catch(e){if(!renderErr){renderErr=true;reportErr('render: '+e.stack);}}
 hud.textContent=`cam ${camera.position.x|0},${camera.position.y|0},${camera.position.z|0}  tgt ${ctl.target.x|0},${ctl.target.y|0},${ctl.target.z|0}${WALK.on?'  WALK':''}\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles/1e6).toFixed(2)}M  reg ${REG.length}`;
 requestAnimationFrame(frame);}
frame();window._ready=true;
// ---------------------------------------------------------------- ANIMATION: the clock, smoke, light volumes
// Everything that moves is a pure function of the animation time t (seconds): t = seconds since load, or pinned by ?t=12.5 (screenshots) or ?anim=0 (t = 0).
// window._anim = {time(), pin(t), play(), stats()}. Cloth flutter and glow flicker live in the shaders (22-mat.js animPatch), the pool lights flicker in
// 91n-night.js, spinners turn in 90-scene.js. Nothing here moves a building vertex, so bboxes and footprints stay what the builders drew.
// SMOKE: one instanced billboard mesh (one draw call): puffs rise, drift downwind, grow and fade above every SMOKES source (stovepipe(), fire(), the two
//   big stacks). It hangs off the scene, not WORLD, and is not in any bbox or the registry.
// LIGHT VOLUMES (night): additive, depth-tested, unshadowed shells, one instanced mesh each: a cone of light under every lamp bulb, and a spill wedge out of
//   every front door (rec.front) that the evening schedule has lit (the same uWinFrac as the windows).
// This fragment runs after the first buildWorld() (92-camera.js builds it), so it builds its own pieces once at the end; later builds call animRebuild().
var ANIM_READY=false;
const ANIM={t0:performance.now(),pin:null,smoke:null,cones:null,spills:null};
{const q=new URLSearchParams(location.search);const t=parseFloat(q.get('t'));if(isFinite(t))ANIM.pin=t;if(q.get('anim')==='0')ANIM.pin=0;}
function animTime(now){return ANIM.pin!==null?ANIM.pin:(now-ANIM.t0)/1000;}
ANIMU.uTime.value=animTime(performance.now());
// ---- smoke
const SMOKE_N={stove:10,fire:10,stack:16},SMOKE_KIND={stove:0,fire:1,stack:2};
const smokeMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,
 uniforms:{uTime:ANIMU.uTime,uCol:{value:new THREE.Color(.7,.68,.64)},uWind:{value:new THREE.Vector2(.5,-.22)}},
 vertexShader:`attribute vec4 aSrc;attribute vec3 aPuff;uniform float uTime;uniform vec2 uWind;varying vec2 vUv;varying float vA;varying float vSeed;varying float vShade;
void main(){float kind=aPuff.z;float period=(5.5+2.5*fract(sin(dot(aSrc.xyz,vec3(12.9898,78.233,37.719)))*43758.5453))*(kind>1.5?1.5:1.);float life=fract(uTime/period+aPuff.x);
 float H=kind>1.5?11.:kind>.5?5.5:4.5;float rise=life*H;float s=aPuff.y*20.;
 vec3 c=aSrc.xyz-vec3(0.,.15,0.)+vec3(uWind.x,0.,uWind.y)*rise*.6+vec3(sin(uTime*.7+s)*.3*life,rise,cos(uTime*.6+s*.65)*.3*life);
 float size=aSrc.w*2.6*(1.+life*(kind>1.5?2.8:2.2));vShade=kind>1.5?.62:kind>.5?.8:.88;vec4 mv=modelViewMatrix*vec4(c,1.);
 float a=aPuff.y*6.2832+uTime*.25*(fract(aPuff.y*3.7)-.5);mv.xy+=mat2(cos(a),sin(a),-sin(a),cos(a))*position.xy*size;
 vUv=uv;vSeed=aPuff.y;vA=smoothstep(0.,.03,life)*pow(1.-life,1.3)*(1.4-.7*life)*(kind>1.5?.6:kind>.5?.5:.45)*exp(-length(mv.xyz)*.002);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform vec3 uCol;varying vec2 vUv;varying float vA;varying float vSeed;varying float vShade;
void main(){vec2 p=vUv*2.-1.;float r=dot(p,p);float n=.72+.28*sin(p.x*4.3+vSeed*41.)*sin(p.y*3.7+vSeed*17.);float a=smoothstep(1.,.1,r)*n*vA;if(a<.004)discard;gl_FragColor=vec4(uCol*vShade*(.9+.1*p.y),a);}`});
function smokeBuild(){const list=SMOKES;let n=0;for(const s of list)n+=SMOKE_N[s.kind]||6;if(!n)return null;
 const base=new THREE.PlaneGeometry(1,1);const g=new THREE.InstancedBufferGeometry();g.index=base.index;g.setAttribute('position',base.attributes.position);g.setAttribute('uv',base.attributes.uv);
 const src=new Float32Array(n*4),puff=new Float32Array(n*3);let i=0;
 for(const s of list){const m=SMOKE_N[s.kind]||6,ph=h3(s.x*.71,s.y*.37,s.z*.53);for(let k=0;k<m;k++){src.set([s.x,s.y,s.z,Math.max(.18,s.r)],i*4);puff.set([(k+ph)/m,h3(s.x+k*1.7,s.y,s.z-k*.9),SMOKE_KIND[s.kind]||0],i*3);i++;}}
 g.setAttribute('aSrc',new THREE.InstancedBufferAttribute(src,4));g.setAttribute('aPuff',new THREE.InstancedBufferAttribute(puff,3));g.instanceCount=n;
 const mesh=new THREE.Mesh(g,smokeMat);mesh.frustumCulled=false;mesh.renderOrder=4;mesh.userData.probeSkip=true;return mesh;}
// ---- light volumes
const volMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
 uniforms:{uNightK:ANIMU.uNightK,uWinFrac:ANIMU.uWinFrac,uTime:ANIMU.uTime},
 vertexShader:`attribute float aK;attribute vec3 aC;uniform float uWinFrac;varying float vT;varying float vF;varying float vD;varying vec3 vC;varying float vLit;
void main(){vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.);vec3 n=normalize(mat3(modelMatrix*instanceMatrix)*normal);vec3 vd=cameraPosition-wp.xyz;vD=length(vd);
 vF=abs(dot(n,vd/vD));vT=uv.y;vC=aC;vLit=aK<0.?1.:step(aK,uWinFrac);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`uniform float uNightK;uniform float uTime;varying float vT;varying float vF;varying float vD;varying vec3 vC;varying float vLit;
void main(){float a=pow(vF,1.2)*pow(1.-vT,1.3)*.3*uNightK*vLit*exp(-vD*.006);if(a<.002)discard;gl_FragColor=vec4(vC,a);}`});
// a cone under a lamp: apex at the bulb (y=0), open base on the ground (y=-1); uv.y runs 0 at the bulb to 1 at the ground
function volConeGeo(){const g=new THREE.CylinderGeometry(.08,1,1,18,1,true);g.translate(0,-.5,0);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setY(i,1-uv.getY(i));return g;}
// a spill wedge out of a doorway: the door opening at z=0 (1.1 x 2.05 m), flaring to 2.6 m wide at z=3, sloping to the ground; uv.y 0 at the door, 1 at the far end
function volSpillGeo(){const P=[],U=[],I=[];const nr=[[-.55,0,0],[.55,0,0],[.55,2.05,0],[-.55,2.05,0]],fr=[[-1.3,0,3],[1.3,0,3],[1.3,.2,3],[-1.3,.2,3]];
 const quad=(a,b,c,d,ta,tb,tc,td)=>{const s=P.length/3;P.push(...a,...b,...c,...d);U.push(0,ta,1,tb,1,tc,0,td);I.push(s,s+1,s+2,s,s+2,s+3);};
 quad(nr[3],nr[2],fr[2],fr[3],0,0,1,1);quad(nr[1],fr[1],fr[2],nr[2],0,1,1,0);quad(fr[0],nr[0],nr[3],fr[3],1,0,0,1);quad(nr[0],nr[1],fr[1],fr[0],0,0,1,1);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);g.computeVertexNormals();return g;}
function volMesh(geo,items){if(!items.length)return null;const m=new THREE.InstancedMesh(geo,volMat,items.length);const k=new Float32Array(items.length),c=new Float32Array(items.length*3);
 items.forEach((it,i)=>{m.setMatrixAt(i,it.m);k[i]=it.k;c.set(it.c,i*3);});geo.setAttribute('aK',new THREE.InstancedBufferAttribute(k,1));geo.setAttribute('aC',new THREE.InstancedBufferAttribute(c,3));
 m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;m.renderOrder=3;m.userData.probeSkip=true;return m;}
function volBuild(){const cones=[],spills=[];const _q=new THREE.Quaternion(),_y=new THREE.Vector3(0,1,0);
 for(const q of HALOS){if(q.kind!=='SphereGeometry'||q.big||q.g<q.r*.5)continue;const h=q.y-terrainH(q.x,q.z);if(h<1.4)continue;const R=clamp(h*.42,.8,2.2);   /* lamp bulbs: warm-white spheres up off the ground */
  cones.push({m:new THREE.Matrix4().compose(new THREE.Vector3(q.x,q.y-.05,q.z),_q.identity(),new THREE.Vector3(R,h-.05,R)),k:-1,c:[1,.72,.4]});}
 for(const r of REG){const f=r.front;if(!f||!f.world||f.source==='default'||!r.doorCount)continue;const w=f.world;
  spills.push({m:new THREE.Matrix4().compose(new THREE.Vector3(w.x+Math.sin(w.yaw)*.12,w.y,w.z+Math.cos(w.yaw)*.12),_q.setFromAxisAngle(_y,w.yaw),new THREE.Vector3(1,1,1)),k:h3(w.x*.29+5.1,w.y,w.z*.31-2.7)*.9,c:[1,.6,.26]});}
 return {cones:volMesh(volConeGeo(),cones),spills:volMesh(volSpillGeo(),spills)};}
// ---- (re)build with the world
function animRebuild(){if(!ANIM_READY)return;for(const k of ['smoke','cones','spills']){const o=ANIM[k];if(o){scene.remove(o);o.geometry.dispose();if(o.dispose)o.dispose();ANIM[k]=null;}}
 ANIM.smoke=smokeBuild();const v=volBuild();ANIM.cones=v.cones;ANIM.spills=v.spills;for(const k of ['smoke','cones','spills'])if(ANIM[k])scene.add(ANIM[k]);}
const _smD=new THREE.Color(.7,.68,.64),_smN=new THREE.Color(.075,.08,.1),_smK=new THREE.Color(.62,.42,.3);
FRAME_HOOKS.push((dt,now)=>{ANIMU.uTime.value=animTime(now);const k=ANIMU.uNightK.value,v=NIGHT.v;
 smokeMat.uniforms.uCol.value.copy(_smD).lerp(_smK,Math.sin(clamp(v,0,1)*PI)*.35).lerp(_smN,k);   /* pale by day, dusk-tinted, dark against the night sky */
 for(const o of [ANIM.cones,ANIM.spills])if(o)o.visible=k>.02;});
window._anim={time:()=>ANIMU.uTime.value,pin(t){ANIM.pin=t;ANIMU.uTime.value=t;},play(){ANIM.t0=performance.now()-ANIMU.uTime.value*1000;ANIM.pin=null;},
 stats:()=>({t:ANIMU.uTime.value,smokeSources:SMOKES.length,puffs:ANIM.smoke?ANIM.smoke.geometry.instanceCount:0,lampCones:ANIM.cones?ANIM.cones.count:0,doorSpills:ANIM.spills?ANIM.spills.count:0,
  winFrac:ANIMU.uWinFrac.value,clock:NIGHT.clock,cloth:Object.keys(MAT).filter(k=>MAT[k].userData.anim==='cloth').length})};
ANIM_READY=true;animRebuild();
