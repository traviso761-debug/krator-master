const C=h=>new BIO.host.THREE.Color(h);

// ---------------------------------------------------------------- colour
// Everything handed to the core is sRGB. vary() jitters a palette entry in
// HSL -- hue by up to ±dh -- because undergrowth mixed within a tenth of a
// hue reads as one plant repeated; bright() scales the LINEAR value (a card
// texture's greys average ~0.6, so a card colour goes in 1.3-1.7x). Solids
// (rods, lobes, brackets) are untextured and lit by a sun+hemisphere of ~2:
// they take the designer's colour a shade DOWN, never a texture tint.
const _hsl={h:0,s:0,l:0};
function vary(hex,dh,ds,dl){const c=hex.isColor?hex.clone():C(hex);c.getHSL(_hsl);
 c.setHSL(((_hsl.h+rr(-dh,dh))%1+1)%1,clamp(_hsl.s+rr(-ds,ds),0,1),clamp(_hsl.l+rr(-dl,dl),.03,.97));return c;}
function bright(col,k){const c=col.isColor?col.clone():C(col);c.convertSRGBToLinear();c.r=Math.min(1,c.r*k);c.g=Math.min(1,c.g*k);c.b=Math.min(1,c.b*k);return c.convertLinearToSRGB();}
function shade(hex,f){const c=hex.isColor?hex.clone():C(hex);if(f>=0)c.lerp(C(0xffffff),f);else c.lerp(C(0x120f0a),-f);return c;}
// a leaf colour from a palette set: wide hue jitter, then brightened for a card
function leafCol(set,k,dh){return bright(vary(pick(set),dh==null?.05:dh,.14,.07),k==null?1.3:k);}
// mean LINEAR colour of a canvas texture (fallback for a texture without a canvas)
function texMean(tex,fb){const im=tex&&tex.image;if(!im||!im.getContext)return fb;
 const d=im.getContext('2d').getImageData(0,0,im.width,im.height).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<d.length;i+=4*13){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
 if(!n)return fb;const c=C(0).setRGB(r/n/255,g/n/255,b/n/255).convertSRGBToLinear();return[c.r,c.g,c.b];}
let MEAN=null;
function means(){if(MEAN)return MEAN;MEAN={trunk:texMean(HYPERJUNGLE.BARKTEX[4],[.30,.21,.14]),rock:texMean(HYPERJUNGLE.ROCKTEX,[.156,.147,.127]),wood:texMean(HYPERJUNGLE.WOODTEX,[.09,.06,.035])};return MEAN;}
// the sRGB tint that renders `hex` (scaled by k) on a texture of linear mean m
function tint(hex,m,k){const c=hex.isColor?hex.clone():C(hex);c.convertSRGBToLinear();k=k==null?1:k;
 c.setRGB(Math.min(1,c.r*k/Math.max(.02,m[0])),Math.min(1,c.g*k/Math.max(.02,m[1])),Math.min(1,c.b*k/Math.max(.02,m[2])));return c.convertLinearToSRGB();}
const DEADWOOD=[0x5a4a3a,0x4a3c30,0x6a5846,0x5e4638];
const SHRUB=[0x1e3a20,0x27482a,0x305a30,0x224426,0x3a5a2c,0x2c4a3a,0x4a6a2e,0x3d5a2a];     // dark broad-leaf understorey
const PALM=[0x3a6a2e,0x467a36,0x2e5a28,0x4a7a3a,0x3f6a44,0x5a8a3a];
const AROID=[0x27482a,0x305a30,0x1e3a20,0x3a5a2c,0x4a3a4a,0x5a3a3e,0x2c5a44,0x3a6a3a];      // some burgundy undersides
const BRACKET=[0xa08464,0x8d6a5e,0xb89a70,0xd8b878,0x8a5a44,0xc89a60,0x9a7060];
const stalkTint=()=>tint(pick([0xc8b090,0xb8a080,0xd8c8a8]),means().wood,1);
const woodTint=k=>tint(pick(DEADWOOD),means().wood,k==null?1:k);
const trunkTint=(hex,k)=>tint(hex,means().trunk,k==null?1:k);
const rockTint=k=>tint(vary(pick(PAL.rock),.02,.06,.06),means().rock,k==null?rr(.32,.6):k);
const rodCol=()=>shade(vary(pick(DEADWOOD),.02,.08,.06),rr(-.45,-.2));                      // untextured: a shade down
const fungusCol=()=>shade(vary(pick(BRACKET),.03,.12,.08),rr(-.35,-.1));

// ---------------------------------------------------------------- keep-clear
// Boles (hero and impostor), saplings and logs all keep the floor off them.
// A hash of horizontal discs; a query tests only its own cell, so every disc
// is entered into every cell it (plus the largest pad) touches.
const HC=140,HASH={},PADMAX=18;
function hkey(x,z){return Math.floor(x/HC)+','+Math.floor(z/HC);}
function hadd(o){const R=o.r+PADMAX;for(let z=Math.floor((o.z-R)/HC);z<=Math.floor((o.z+R)/HC);z++)for(let x=Math.floor((o.x-R)/HC);x<=Math.floor((o.x+R)/HC);x++){const k=x+','+z;(HASH[k]||(HASH[k]=[])).push(o);}}
function blockedAt(x,z,pad){const L=HASH[hkey(x,z)];if(!L)return false;for(let i=0;i<L.length;i++){const o=L[i];if(Math.hypot(x-o.x,z-o.z)<o.r+pad)return true;}return false;}
const LOGS=[];
function logNear(x,z,pad){for(let i=0;i<LOGS.length;i++){const G=LOGS[i];if(Math.hypot(x-G.cx,z-G.cz)>G.cr+pad+20)continue;
 for(let j=0;j<G.pts.length-1;j++){const a=G.pts[j],b=G.pts[j+1];if(segDist(x,z,a.x,a.z,b.x,b.z)<Math.max(a.r,b.r)+pad)return true;}}return false;}
function segDist(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1;const t=clamp(((px-ax)*dx+(pz-az)*dz)/l2,0,1);return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));}
function okGround(x,z,pad){return !blockedAt(x,z,pad)&&!logNear(x,z,pad+.4);}

// ---------------------------------------------------------------- bole profiles
// The tree pass wrote each hero's fluted, buttressed bole into its bark bucket;
// brackets, moss and liana feet sit on THAT surface, not on the analytic
// trunkR (a buttress lobe exceeds it by half again). The bucket's vertices in
// the lower 34 m are binned by ring height and 24 angular bins. `ground` is
// the bole's footprint radius at ground level over all angles (the fins).
function boleProfile(T){const K=BIO.buckets['bark'+T.sp],P=K?K.pos:[],NB=24,rows={},rmax=trunkR(T,T.y0+3)*3;
 for(let i=0;i<P.length;i+=3){const yy=P[i+1]-T.y0;if(yy<-1||yy>34)continue;const dx=P[i]-T.x,dz=P[i+2]-T.z,d=Math.hypot(dx,dz);if(d>rmax)continue;
  const key=Math.round(yy*4);let row=rows[key];if(!row)row=rows[key]={yy:yy,r:new Float32Array(NB)};
  const b=Math.floor((((Math.atan2(dz,dx)%TAU)+TAU)%TAU)/TAU*NB)%NB;if(d>row.r[b])row.r[b]=d;}
 const rings=Object.keys(rows).map(k=>rows[k]).sort((a,b)=>a.yy-b.yy);
 rings.forEach(rw=>{for(let k=0;k<NB;k++)if(!rw.r[k]){for(let s=1;s<NB;s++){if(rw.r[(k+s)%NB]){rw.r[k]=rw.r[(k+s)%NB];break;}if(rw.r[(k-s+NB)%NB]){rw.r[k]=rw.r[(k-s+NB)%NB];break;}}if(!rw.r[k])rw.r[k]=trunkR(T,T.y0+rw.yy);}});
 let ground=0;rings.forEach(rw=>{if(rw.yy<5)for(let k=0;k<NB;k++)ground=Math.max(ground,rw.r[k]);});
 if(!rings.length)ground=trunkR(T,T.y0+2)*1.7;
 const at=function(a,yy){if(!rings.length)return trunkR(T,T.y0+yy);const ang=((a%TAU)+TAU)%TAU,fb=ang/TAU*NB,b0=Math.floor(fb)%NB,b1=(b0+1)%NB,f=fb-Math.floor(fb);
  let i=0;while(i<rings.length-2&&rings[i+1].yy<yy)i++;const A=rings[i],B=rings[Math.min(rings.length-1,i+1)];
  const t=B.yy>A.yy?clamp((yy-A.yy)/(B.yy-A.yy),0,1):0;return mix(mix(A.r[b0],A.r[b1],f),mix(B.r[b0],B.r[b1],f),t);};
 return{ground:ground,at:at,foot:function(a){return at(a,1.5);}};}

// ---------------------------------------------------------------- fields
// openings: a slow field that leaves stretches of thinner litter between the
// thickets (never bare); damp: where the mushrooms and ground moss are
function openK(x,z){return .38+.62*smooth(.32,.62,fbm(x*.0105+5,z*.0105-9,4242,2));}
function dampK(x,z){return fbm(x*.0052+21,z*.0052+13,777,2);}

// ---------------------------------------------------------------- the plants
// lv: 2 = near (full detail), 1 = mid (fewer parts), 0 = far (one or two cards)
const Y=(x,z)=>BIO.terrainH(x,z);
function frondAt(x,y,z,a,L,pitch,col){BIO.put('frond',[x,y,z],qEuler(rr(-.18,.18),-a,pitch),[L,L*rr(.85,1.05),L*rr(1.1,1.5)],col);}
function frondCrown(x,y,z,Rf,n,pitch0,pitch1,col){const a0=rr(0,TAU);
 for(let k=0;k<n;k++){const a=a0+k/n*TAU+rr(-.25,.25);frondAt(x,y,z,a,Rf*rr(.8,1.1),rr(pitch0,pitch1),bright(col,rr(.86,1.1)));}}
function card(x,y,z,s,sy,col,tilt){BIO.put('ucard',[x,y,z],qEuler(rr(-(tilt||.2),tilt||.2),rr(0,TAU),rr(-(tilt||.2),tilt||.2)),[s,sy==null?s:sy,s],col);}
function tuft(x,y,z,s,col){card(x,y+s*.3,z,s,s*.75,col||leafCol(rng()<.5?PAL.fern:SHRUB,1.4,.06),.2);}
function groundMoss(x,y,z,r){BIO.put('mossmat',[x,y+.06,z],qEuler(rr(-.06,.06),rr(0,TAU),rr(-.06,.06)),r,leafCol(PAL.moss,.95,.04));}
function blooms(x,y,z,r,n,set){const c=bright(vary(pick(set||PAL.bloom),.03,.1,.08),1.15);
 for(let i=0;i<n;i++){const a=rr(0,TAU),d=r*Math.sqrt(rng()),s=rr(.14,.32);BIO.put('bloom',[x+Math.cos(a)*d,y+rr(0,.4),z+Math.sin(a)*d],qEuler(rr(-.4,.4),rr(0,TAU),rr(-.4,.4)),s,c);}}

function fern(x,y,z,lv){const hc=vary(pick(PAL.fern),.06,.14,.07);
 if(lv>=1){let ty=y-.1,Rf=rr(2.2,4.8);
  const tree=lv===2&&rng()<.16;
  if(tree){const H=rr(1.5,4),r=rr(.16,.3);BIO.put('trunk',[x,y-.3,z],qUp([rr(-.08,.08),1,rr(-.08,.08)]),[r/.4,H+.3,r/.4],trunkTint(pick(DEADWOOD),.8));ty=y+H;Rf*=1.15;}
  frondCrown(x,ty,z,Rf,lv===2?ri(5,7):ri(4,5),tree?-.05:.08,tree?.35:.45,bright(hc,1.7));}
 else{frondCrown(x,y-.1,z,rr(2.5,4.5),3,.1,.4,bright(hc,1.6));}}
function shrub(x,y,z,lv,big){const hc=vary(pick(SHRUB),.07,.14,.07);
 if(lv===2||(big&&lv===1)){const Rs=rr(1.8,4)*(big?1.3:1);
  if(rng()<.4)BIO.put('lobe',[x,y-.3,z],qEuler(0,rr(0,TAU),0),[Rs,Rs*rr(.7,1.05),Rs],shade(vary(hc,.03,.1,.05),-.15));
  const n=big?3:2;for(let i=0;i<n;i++){const a=rr(0,TAU),d=i?Rs*rr(.3,.7):0;card(x+Math.cos(a)*d,y+Rs*rr(.45,.7),z+Math.sin(a)*d,Rs*rr(1.5,1.9),Rs*rr(1.1,1.5),bright(vary(hc,.04,.1,.06),1.45),.25);}
  if(rng()<.3)blooms(x,y+Rs*.85,z,Rs*.7,ri(2,5));}
 else if(lv===1){const s=rr(3.5,6.5);card(x,y+s*.35,z,s,s*.75,bright(hc,1.4));if(rng()<.5)card(x+rr(-1,1),y+s*.25,z+rr(-1,1),s*.8,s*.6,bright(vary(hc,.05,.1,.06),1.4));}
 else{const s=rr(4,7);card(x,y+s*.3,z,s,s*.65,bright(hc,1.4));}}
function aroid(x,y,z,lv){const up=rng()<.45,hc=vary(pick(up?PALM:AROID),.06,.14,.07);
 if(lv>=1){const S=up?rr(4,7.5):rr(2.8,5.2),n=lv===2?ri(3,4):2,a0=rr(0,TAU);
  for(let k=0;k<n;k++){const a=a0+k/n*TAU+rr(-.4,.4),s=S*rr(.75,1.15),c=bright(vary(hc,.03,.08,.06),up?1.35:1.5);
   if(up)BIO.put('ucard',[x+Math.cos(a)*s*.22,y+s*.5,z+Math.sin(a)*s*.22],qEuler(rr(-.15,.15),rr(0,TAU),rr(-.15,.15)),[s*.55,s*1.05,s*.55],c);
   else BIO.put('ucard',[x+Math.cos(a)*s*.35,y+s*.3,z+Math.sin(a)*s*.35],qEuler(rr(-.25,.25),rr(0,TAU),rr(-.25,.25)),[s,s*.55,s],c);}
  if(up&&lv===2&&rng()<.35)blooms(x,y+S*.75,z,S*.3,ri(1,3),[0xbe4632,0xc98d2e,0xd0a848]);}
 else{const s=rr(3.5,6);card(x,y+s*.3,z,s,s*.7,bright(hc,1.4));}}
function palm(x,y,z,lv){const cyc=rng()<.3,H=cyc?rr(1.2,3):rr(5,14),r=cyc?rr(.4,.7):.18+H*.016,la=rr(0,TAU),lk=cyc?0:rr(.05,.22);
 const tx=x+Math.cos(la)*lk*H,tz=z+Math.sin(la)*lk*H,ty=y+H*(1-lk*lk*.5);
 BIO.put('trunk',[x,y-.6,z],qUp([Math.cos(la)*lk,1,Math.sin(la)*lk]),[r/.4*1.15,H+.6,r/.4*1.15],trunkTint(pick(DEADWOOD),.9));
 const hc=vary(pick(PALM),.05,.12,.06);
 frondCrown(tx,ty,tz,cyc?rr(2.6,4.4):rr(4,7),lv===2?ri(7,8):5,cyc?.1:-.2,cyc?.45:.3,bright(hc,1.5));
 if(lv===2&&rng()<.6)frondCrown(tx,ty+.3,tz,cyc?2:3,4,.55,1.0,bright(shade(hc,.08),1.5));}
function subTree(x,y,z,lv){const H=rr(15,40),r=.3+H*.03,la=rr(0,TAU),lk=rr(0,.07),near=lv===2,vnear=near&&BIO.lodD(x,z)<300;
 const col=rng()<.5?pick(DEADWOOD):pick([0x8a7a66,0x7a6c5a,0x6a5a4a]);
 BIO.put('trunk',[x,y-1,z],qUp([Math.cos(la)*lk,1,Math.sin(la)*lk]),[r/.4,H*.86+1,r/.4],trunkTint(col,rr(.55,.9)));
 const cx=x+Math.cos(la)*lk*H*.86,cz=z+Math.sin(la)*lk*H*.86,cy=y+H*.78,cr=H*rr(.22,.32);
 const set=pick([PAL.fern,SHRUB,PALM,PAL.vine]),hc=vary(pick(set),.06,.12,.06);
 const n=near?ri(5,7):4;
 for(let k=0;k<n;k++){const a=rr(0,TAU),d=k?cr*rr(.3,.75):0,s=cr*rr(.8,1.25);
  BIO.put('ucard',[cx+Math.cos(a)*d,cy+rr(-.35,.3)*cr,cz+Math.sin(a)*d],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),[s,s*.75,s],bright(vary(hc,.04,.1,.07),1.35*rr(.85,1.1)));}
 if(near){const rc=rodCol();
  if(vnear){const nb=ri(1,2);for(let b=0;b<nb;b++){const a=rr(0,TAU),d=cr*rr(.5,.9);BIO.beam('rod',[cx,cy-cr*.6,cz],[cx+Math.cos(a)*d,cy+rr(-.3,.3)*cr,cz+Math.sin(a)*d],r*.35,r*.15,rc);}}
  const nm=ri(1,2);for(let m=0;m<nm;m++){const a=rr(0,TAU),d=cr*rr(.3,.8);BIO.put('ribbon',[cx+Math.cos(a)*d,cy-cr*.2,cz+Math.sin(a)*d],qEuler(0,rr(0,TAU),0),[rr(2.5,5),rr(4,9),1.5],leafCol(PAL.moss,1.5));}
  if(rng()<.35){const a=rr(0,TAU),d=cr*rr(.4,.8),lx=cx+Math.cos(a)*d,lz=cz+Math.sin(a)*d,gx=lx+rr(-2,2),gz=lz+rr(-2,2);
   BIO.beam('rod',[lx,cy-cr*.3,lz],[gx,Y(gx,gz)-.3,gz],rr(.05,.11),rr(.05,.11),rc);}}}
function fungi(x,y,z,lv,st){const n=lv===2?ri(2,4):2,giant=rng()<.3;
 for(let i=0;i<n;i++){const a=rr(0,TAU),d=i?rr(.5,2.2):0,fx=x+Math.cos(a)*d,fz=z+Math.sin(a)*d,fy=Y(fx,fz);
  const cr=(giant&&i===0)?rr(1,1.9):rr(.3,.85),stk=cr*rr(.9,1.9),hc=fungusCol();
  const top=stk>.5?fy+stk:fy+.05;
  if(stk>.5)BIO.tube('wood',[{x:fx,y:fy-.25,z:fz,r:cr*.2},{x:fx+rr(-.1,.1),y:top,z:fz+rr(-.1,.1),r:cr*.16}],stalkTint(),{seg:4});
  if(giant&&i===0)BIO.put('fungus',[fx,top-.08,fz],qEuler(0,rr(0,TAU),0),[cr,cr*rr(.4,.7),cr],hc);
  else{const h=cr*rr(.45,.8),t=tint(shade(hc,.3),means().wood,1.25),ph=rr(0,TAU);
   BIO.lathe('wood',[{x:fx,y:top-.05,z:fz,yy:0,col:shade(t,-.25)},{x:fx,y:top+h*.45,z:fz,yy:.5,col:t},{x:fx,y:top+h,z:fz,yy:1,col:shade(t,.1)}],6,1,1,(R,ang)=>cr*(R.yy===0?1:R.yy<.6?.85:.12)*(1+.06*Math.sin(5*ang+ph)));}
  st.fungi++;}
 if(lv===2&&rng()<.5)groundMoss(x+rr(-1,1),y,z+rr(-1,1),rr(1.5,3));}
function boulder(x,y,z,lv,st){const n=lv===2?ri(1,2):1,Rb=rr(1.2,3.4);
 for(let i=0;i<n;i++){const a=rr(0,TAU),d=i?Rb*rr(.7,1.2):0,r=Rb*(i?rr(.35,.7):1),bx=x+Math.cos(a)*d,bz=z+Math.sin(a)*d,by=Y(bx,bz),h=r*rr(.55,.95);
  BIO.put('boulder',[bx,by+h*.35,bz],qEuler(rr(-.25,.25),rr(0,TAU),rr(-.25,.25)),[r*rr(.9,1.3),h*.8,r*rr(.9,1.3)],rockTint());st.boulders++;
  if(lv>=1){BIO.put('mossmat',[bx+rr(-.15,.15)*r,by+h*1.08,bz+rr(-.15,.15)*r],qEuler(rr(-.2,.2),rr(0,TAU),rr(-.2,.2)),r*rr(.6,.9),leafCol(PAL.moss,.95));st.moss++;}
  if(lv===2&&i===0&&rng()<.6){frondCrown(bx+r*.5,by+h*.5,bz+r*.3,rr(1.2,2.2),5,.1,.45,leafCol(PAL.fern,1.7));st.ferns++;}}}

// ---------------------------------------------------------------- fallen hypertrees
function facingTri(a,b,c,dir,col){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
 const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*dir[0]+ny*dir[1]+nz*dir[2]>=0)BIO.tri('wood',a,b,c,col);else BIO.tri('wood',a,c,b,col);}
function buildLog(o,st,q){const n=Math.ceil(o.L/7)+1,pts=[],px=-o.hz,pz=o.hx;
 for(let i=0;i<n;i++){const t=i/(n-1),s=t*o.L,off=o.bow*Math.sin(Math.PI*t),x=o.bx+o.hx*s+px*off,z=o.bz+o.hz*s+pz*off,r=mix(o.r0,o.r1,Math.pow(t,.9));
  const g0=Y(x,z),g1=Y(x-o.hx*12,z-o.hz*12),g2=Y(x+o.hx*12,z+o.hz*12);
  pts.push({x:x,y:(g0*2+g1+g2)/4+r*.30,z:z,r:r,s:s});}
 const wm=means().wood,base=rr(.75,1.05);
 pts.forEach((p,k)=>{const m=fbm(p.x*.05+3,p.z*.05-2,55,2);
  p.col=m>.55?C(0).setRGB(base*.7,base*1.05,base*.55).convertLinearToSRGB():C(0).setRGB(base*(1-.25*m),base*(.95-.25*m),base*(.85-.2*m)).convertLinearToSRGB();});
 const seed0=rr(0,10);
 BIO.tube('wood',pts,pts[0].col,{seg:11,cap:true,capCol:shade(woodTint(1.3),-.1),rfn:(qq,ang)=>1+.05*Math.sin(3*ang+qq*.7+seed0)+.035*Math.sin(7*ang+qq*1.3)});
 // the root plate at the butt: a ragged disc of splayed dead wood, then short root tubes
 const P0=pts[0],tdir=[-o.hx,0,-o.hz],n1=[px,0,pz],rim=[],ring=[],nr=14;
 for(let i=0;i<nr;i++){const a=i/nr*TAU,rrim=o.r0*(1.15+.6*rng()),ca=Math.cos(a),sa=Math.sin(a),back=rr(.6,2.4);
  rim.push([P0.x+n1[0]*ca*rrim+tdir[0]*back,P0.y+sa*rrim,P0.z+n1[2]*ca*rrim+tdir[2]*back,i/nr*4,1]);
  ring.push([P0.x+n1[0]*ca*o.r0*.98-tdir[0]*.8,P0.y+sa*o.r0*.98,P0.z+n1[2]*ca*o.r0*.98-tdir[2]*.8,i/nr*4,0]);}
 const ctr=[P0.x+tdir[0]*2,P0.y,P0.z+tdir[2]*2,.5,.5];
 for(let i=0;i<nr;i++){const j=(i+1)%nr,a2=(i+.5)/nr*TAU,rad=[n1[0]*Math.cos(a2),Math.sin(a2),n1[2]*Math.cos(a2)];
  const dc=woodTint(rr(.55,.9)),sc=tint(pick(PAL.litter),wm,1.2);
  facingTri(ctr,rim[i],rim[j],tdir,rng()<.4?sc:dc);facingTri(ring[i],rim[i],rim[j],rad,dc);facingTri(ring[i],rim[j],ring[j],rad,dc);}

// ================================================================= AMPHITHEATER — "the Bowl"
function buildAmphitheater(scene,gx,gz,d){reseed(9960+d);KOFF=[gx,0,gz];const G=new THREE.Group();G.position.set(gx,0,gz);scene.add(G);const skin=SHELL(d);
 REGISTER({name:'Amphitheater — the Bowl ('+STATE(d)+')',x:0,z:0,r:110,h:60});
 // SIGHTLINES. Two separate things decided whether a seat could see the stage.
 //
 // 1. THE SWEEP. The acoustic shell is a half-dome occupying z<0 and opening
 //    toward +z, so a seat looks INTO the shell only while its own z>0 — that
 //    is, while |a| < PI/2. The bowl used to sweep +/-2.2 rad (252 deg), which
 //    left the outer 29% of every row sitting behind the shell looking at its
 //    back. The sweep is now +/-1.5 rad (172 deg), a Roman semicircle: every
 //    seat is in front of the opening.
 //
 // 2. THE RAKE. A constant rise per row does NOT give a constant view. The
 //    clearance C — how far a row's sightline passes above the eye of the row
 //    in front — decays roughly as 1/n. With the old flat 1.5 m rise it was
 //    0.58 m at row 1 and 0.071 m by row 15, well under the ~0.12 m a person
 //    needs to see past the head in front, so the back third of the bowl was
 //    looking at the back of someone's skull. Solving
 //        E(n+1) = (D(n+1)/D(n)) * (E(n) + C)
 //    for a fixed C gives the classic parabolic rake, where the rise grows with
 //    the row. E is eye height above the focus, D is eye distance from it.
 //    Rescaled so the top row still lands at y=24 where the rim wall meets it,
 //    so the bowl keeps its old silhouette and the rim and struts still fit.
 const a0=-1.5,a1=1.5;
 const NR=16,TRD=4.2,R0=24,EYE=1.2,SEATIN=2,FOCR=24,FOCY=2.4,CVAL=.18;
 const rowR=t=>R0+t*TRD;                              // inner radius of row t
 const eyeD=t=>rowR(t)+SEATIN-FOCR;                   // eye distance from the focus
 const TH=[1.5];                                      // tread height, row by row
 for(let t=1;t<NR;t++)TH.push((eyeD(t)/eyeD(t-1))*(TH[t-1]+EYE-FOCY+CVAL)+FOCY-EYE);
 {const k=(24+EYE-FOCY)/(TH[NR-1]+EYE-FOCY);          // scale E, not the height
  for(let t=0;t<NR;t++)TH[t]=(TH[t]+EYE-FOCY)*k+FOCY-EYE;}
 const rakeY=r=>{const t=clamp((r-R0)/TRD,0,NR-1);const i=Math.min(Math.floor(t),NR-2);return lerp(TH[i],TH[i+1],t-i);};
 // THE SLUMP. In the ruin one sector of the upper cavea has slid: up to seven
 // top rows, the outer wall and the rim over u=.60-.82 are gone and lie as a
 // talus down the seating. The ruin used to be the intact bowl with holes and
 // two fallen struts, which is the same silhouette. `gone(u)` is how many top
 // rows are missing at u; 0 everywhere in the intact bowl.
 const gone=u=>d>0?Math.round(7*Math.pow(clamp(1-Math.abs(u-.71)/.11,0,1),.6)*(.75+.5*fbm(u*9,.3,805,2))):0;
 const ROUT=rowR(NR-1)+TRD;
 // seating: one mesh for every tread and one for every riser, not two per row
 const treads=[],risers=[];
 for(let t=0;t<NR;t++){const r0=rowR(t),r1=r0+TRD;const yb=t?TH[t-1]:0,yt=TH[t];
  const hole=d>0?(u,v)=>fbm(u*6+t,2,800+t,2)<.16||t>=NR-gone(u):null;
  treads.push(gridSurface((u,v)=>{const a=lerp(a0,a1,u);const r=lerp(r0,r1-.3,v);return[Math.sin(a)*r,yt,Math.cos(a)*r];},80,1,{hole}));
  risers.push(gridSurface((u,v)=>{const a=lerp(a0,a1,u);return[Math.sin(a)*r0,yb+v*(yt-yb),Math.cos(a)*r0];},80,1,{hole}));
  if(t%4===3)for(let k=0;k<12;k++){const a=lerp(a0,a1,(k+.5)/12);const lit=d>0?rng()<.12:true;if(t>=NR-gone((k+.5)/12))continue;kput('strip',[Math.sin(a)*(r0+2),yt+.1,Math.cos(a)*(r0+2)],qEuler(0,a,0),[2.5,1,1],lit?CYAN:DEAD);}}
 // THE CAVEA WALL AND ITS ENDS. The seating was a stepped skin on nothing: the
 // rim wall only ran from 24 to 30 m, so from outside, or past either end of
 // the sweep, you looked straight under the whole rake. An outer wall now
 // carries the top row down to the ground, pierced by 24 arched vomitoria, and
 // each end of the sweep is closed by a wall that follows the rake.
 {const NB=24,topY=TH[NR-1];
  treads.push(gridSurface((u,v)=>{const a=lerp(a0,a1,u);return[Math.sin(a)*ROUT,v*topY,Math.cos(a)*ROUT];},NB*8,20,{uS:40,vS:3,
   hole:(u,v)=>{const f=(u*NB)%1-.5,y=v*topY;const arch=Math.abs(f)<.2&&y<3.5+5*Math.sqrt(clamp(1-Math.pow(f/.2,2),0,1));
    const g=gone(u);return arch||(g>0&&y>TH[NR-1-g]+2*(fbm(u*20,1,806,2)-.5))||(d>0&&fbm(u*7,v*2,807,2)<.14);}}));
  for(const a of [a0,a1])treads.push(gridSurface((u,v)=>{const r=lerp(R0,ROUT,u);return[Math.sin(a)*r,v*rakeY(r),Math.cos(a)*r];},40,4,{uS:12,vS:2}));}
 meshMerged(treads,CONC(d),G);meshMerged(risers,MAT.dark,G);
 // aisles: a ramp that follows the rake. The old one was a single straight box
 // laid across the bowl, which only sat on the steps while the rise was constant.
 const aisles=[];
 for(let k=0;k<5;k++){const a=lerp(a0,a1,k/4);const ca=Math.cos(a),sa=Math.sin(a);
  const g=gone(k/4);
  aisles.push(gridSurface((u,v)=>{const r=lerp(R0,rowR(NR-1)+TRD,u),w=(v-.5)*3;
   return[sa*r+ca*w,rakeY(r)+.15,ca*r-sa*w];},48,1,{uS:20,hole:g?(u,v)=>lerp(R0,ROUT,u)>rowR(NR-g):null}));}
 meshMerged(aisles,skin,G);
 // outer rim: leaning struts and a flared rim wall (Tange). Strut count follows
 // the sweep, so they stay at the same spacing now the bowl is narrower.

 tick((dt,now)=>{
  for(let i=0;i<N;i++){const ag=A[i];
   let x,y,z,hd=ag.hd||0,moving=true,hide=false;
   if(ag.kind==='shuttle'){
    if(ag.wait>0)ag.wait-=dt;
    else{ag.t+=ag.dir*ag.sp*dt;
     if(ag.t>=1){ag.t=1;ag.dir=-1;ag.wait=rr(3,9);}
     else if(ag.t<=0){ag.t=0;ag.dir=1;ag.wait=rr(4,14);}}
    moving=ag.wait<=0;
    x=ag.a[0]+(ag.b[0]-ag.a[0])*ag.t;y=ag.a[1]+(ag.b[1]-ag.a[1])*ag.t;
    z=ag.a[2]+(ag.b[2]-ag.a[2])*ag.t;
    hd=Math.atan2(ag.b[2]-ag.a[2],ag.b[0]-ag.a[0])+(ag.dir<0?Math.PI:0);
   }else if(ag.kind==='patrol'){
    ag.u=(ag.u+ag.dir*ag.sp*dt+ag.tot)%ag.tot;
    let k=0;while(k<ag.cum.length-2&&ag.cum[k+1]<ag.u)k++;
    const a=ag.loop[k],b=ag.loop[(k+1)%ag.loop.length];
    const f=(ag.u-ag.cum[k])/Math.max(1e-6,ag.cum[k+1]-ag.cum[k]);
    x=a[0]+(b[0]-a[0])*f;y=a[1]+(b[1]-a[1])*f;z=a[2]+(b[2]-a[2])*f;
    hd=Math.atan2(b[2]-a[2],b[0]-a[0])+(ag.dir<0?Math.PI:0);
   }else if(ag.kind==='post'){
    const th=ag.ph+now*ag.sp;
    x=ag.c[0]+Math.cos(th)*ag.r;y=ag.c[1];z=ag.c[2]+Math.sin(th)*ag.r;
    hd=th+Math.PI/2;
   }else{                                              // party
    const r=partyPos(ag,now);
    if(!r){hide=true;x=y=z=0;}
    else{const p=r[0];x=p[0]+ag.off[0];y=p[1];z=p[2]+ag.off[2];moving=!!r[1];
     if(ag.lp){const dx=x-ag.lp[0],dz=z-ag.lp[2];
      if(dx*dx+dz*dz>1e-6)hd=Math.atan2(dz,dx);else hd=ag.hd||0;}
     ag.lp=[x,y,z];}}
   ag.hd=hd;
   if(hide){M.compose(P.set(0,-9999,0),Q,S0);bIM.setMatrixAt(i,M);hIM.setMatrixAt(i,M);continue;}
   const bob=moving?Math.abs(Math.sin(now*4.4+ag.bob))*.22:0;
   Q.setFromAxisAngle(UP,-hd+Math.PI/2);
   P.set(x,y+bob,z);M.compose(P,Q,S);bIM.setMatrixAt(i,M);
   P.set(x,y+bob+3.5,z);M.compose(P,Q,S);hIM.setMatrixAt(i,M);}
  bIM.instanceMatrix.needsUpdate=true;hIM.instanceMatrix.needsUpdate=true;});
 // ---- the millipede herd ----------------------------------------------------
 // A moving level of its own. Each animal is a chain of segments that follow
 // the head through a trail buffer, so the body genuinely snakes instead of
 // rotating rigidly: sample the head's own past at increasing lag and the tail
 // traces the path the head took.
 (function(){const RN=SCREAM.ranch;if(!RN)return;
  const NM=8,SEG=13,LAG=5;                       // frames of lag per segment
  const HIST=SEG*LAG+2;
  const herd=[];
  for(let i=0;i<NM;i++){
   const a0=rng()*TAU,r0=rng()*RN[3]*.6;
   herd.push({x:RN[0]+Math.cos(a0)*r0,z:RN[2]+Math.sin(a0)*r0,
    hd:rng()*TAU,sp:rr(2.2,4.6),turn:rr(-.4,.4),tt:0,
    len:rr(13,25),buf:[],bi:0});}
  const bodyG=new THREE.SphereGeometry(1,9,7);
  const legG=new THREE.BoxGeometry(.22,1,.22);legG.translate(0,-.5,0);
  const mBody=new THREE.InstancedMesh(bodyG,
   new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,metalness:.04}),NM*SEG);
  const mLeg=new THREE.InstancedMesh(legG,
   new THREE.MeshStandardMaterial({color:0x3a241c,roughness:.95,metalness:0}),NM*SEG*2);
  [mBody,mLeg].forEach(m=>{m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
   m.frustumCulled=false;m.userData.probeSkip=true;scene.add(m);});
  {const c=new THREE.Color();
   for(let i=0;i<NM;i++)for(let k=0;k<SEG;k++){
    c.setHex(k%3===0?0xb8683e:0x4a2e22);mBody.setColorAt(i*SEG+k,c);}}
  if(mBody.instanceColor)mBody.instanceColor.needsUpdate=true;
  REGISTER({name:'Screamer village — the millipede herd ('+NM+')',
   x:RN[0],z:RN[2],r:RN[3]+10,h:8});
  const MM=new THREE.Matrix4(),QQ=new THREE.Quaternion(),PP=new THREE.Vector3(),
   SS=new THREE.Vector3(),UPV=new THREE.Vector3(0,1,0);
  tick(function(dt){
   for(let i=0;i<NM;i++){const H=herd[i];
    H.tt-=dt;if(H.tt<=0){H.turn=rr(-.5,.5);H.tt=rr(1.5,4);}
    H.hd+=H.turn*dt;
    let nx=H.x+Math.cos(H.hd)*H.sp*dt,nz=H.z+Math.sin(H.hd)*H.sp*dt;
    // turn back at the stockade rather than walking through it
    const dx=nx-RN[0],dz=nz-RN[2],m2=Math.hypot(dx,dz);
    if(m2>RN[3]*.78){H.hd=Math.atan2(RN[2]-H.z,RN[0]-H.x)+rr(-.6,.6);
     nx=H.x+Math.cos(H.hd)*H.sp*dt;nz=H.z+Math.sin(H.hd)*H.sp*dt;}
    H.x=nx;H.z=nz;
    H.buf[H.bi]=[H.x,H.z,H.hd];H.bi=(H.bi+1)%HIST;
    for(let k=0;k<SEG;k++){
     const b=H.buf[(H.bi-1-k*LAG+HIST*3)%HIST]||[H.x,H.z,H.hd];
     const t=k/(SEG-1),r=H.len*.085*(1-.45*Math.abs(t*2-1));
     const idx=i*SEG+k;
     QQ.setFromAxisAngle(UPV,-b[2]);
     PP.set(b[0],RN[1]+r*.85,b[1]);SS.set(r*1.2,r,r*1.1);
     MM.compose(PP,QQ,SS);mBody.setMatrixAt(idx,MM);
     for(let sd=0;sd<2;sd++){
      const off=(sd?1:-1)*r*1.15;
      PP.set(b[0]-Math.sin(b[2])*off,RN[1]+r*.75,b[1]+Math.cos(b[2])*off);
      SS.set(r*.9,r*1.5,r*.9);
      QQ.setFromAxisAngle(UPV,-b[2]);
      MM.compose(PP,QQ,SS);mLeg.setMatrixAt(idx*2+sd,MM);}}}
   mBody.instanceMatrix.needsUpdate=true;mLeg.instanceMatrix.needsUpdate=true;});
  window._millipedes=NM;})();

 window._agents=N;window._life={agents:A,bodies:bIM};
})();
// ================================================================= PATH TRACKER
// Shows what the life layer is actually doing. Two overlays, toggled from the
// tools panel:
//
//   routes  the fixed geometry every agent is bound to -- shuttle legs, the
//           wall circuit, guard posts, and the arriving party's whole itinerary
//           -- colour-coded by population.
//   tracks  a rolling trail behind each agent, sampled a few times a second,
//           which is what tells you whether they are going where you think.
//
// One LineSegments for each, rebuilt in place, so the overlay costs two draw
// calls whether there are ten agents or a thousand.
reseed(9495);
(function(){
 const box=document.getElementById('tools');
 if(!box||typeof window._life==='undefined'||!window._life)return;
 const A=window._life.agents,N=A.length;
 const BST=window._toolBtnStyle||'';
 const ON=';background:rgba(255,179,71,.30);border-color:#ffb347';
 const mk=t=>{const b=document.createElement('button');b.textContent=t;b.style.cssText=BST;
  box.insertBefore(b,box.lastChild);return b;};
 const bR=mk('Routes'),bT=mk('Tracks');

 const COL={shuttle:0x7fe0a0,patrol:0xff7f7f,post:0xffb347,party:0xd76f9c};
 const mat=new THREE.LineBasicMaterial({vertexColors:true,fog:false,depthTest:false});
 const routeG=new THREE.BufferGeometry(),trackG=new THREE.BufferGeometry();
 const routes=new THREE.LineSegments(routeG,mat),tracks=new THREE.LineSegments(trackG,mat);
 [routes,tracks].forEach(o=>{o.renderOrder=998;o.userData.probeSkip=true;
  o.visible=false;scene.add(o);});

 // ---- the fixed routes ------------------------------------------------------
 {const P=[],C=[],c=new THREE.Color();
  const seg=(a,b,k)=>{c.setHex(COL[k]);
   P.push(a[0],a[1],a[2],b[0],b[1],b[2]);
   C.push(c.r,c.g,c.b,c.r,c.g,c.b);};
  for(const ag of A){
   if(ag.kind==='shuttle')seg(ag.a,ag.b,'shuttle');
   else if(ag.kind==='post'){
    let pv=null;
    for(let i=0;i<=16;i++){const th=i/16*TAU;
     const p=[ag.c[0]+Math.cos(th)*ag.r,ag.c[1],ag.c[2]+Math.sin(th)*ag.r];
     if(pv)seg(pv,p,'post');pv=p;}}
   else if(ag.kind==='party'){
    if(ag.role==='escort')seg(ag.PEN,ag.LOB,'party');
    else{seg(ag.OUT,ag.GT,'party');seg(ag.GT,ag.PEN,'party');
     if(ag.role==='captive')seg(ag.PEN,ag.LOB,'party');}}}
  // the patrol circuit once, not once per patrol
  const pat=A.find(a=>a.kind==='patrol');
  if(pat)for(let i=0;i<pat.loop.length;i++)
   seg(pat.loop[i],pat.loop[(i+1)%pat.loop.length],'patrol');
  routeG.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  routeG.setAttribute('color',new THREE.Float32BufferAttribute(C,3));}

 // ---- the rolling tracks ----------------------------------------------------
 const T=34,SAMPLE=.18;
 const hist=new Float32Array(N*T*3);let filled=0,head=0,acc=0;
 const tp=new Float32Array(N*(T-1)*2*3),tc=new Float32Array(N*(T-1)*2*3);
 {const c=new THREE.Color();
  for(let i=0;i<N;i++){c.setHex(COL[A[i].kind]||0xffffff);
   for(let j=0;j<(T-1)*2;j++){const o=(i*(T-1)*2+j)*3;
    tc[o]=c.r;tc[o+1]=c.g;tc[o+2]=c.b;}}}
 trackG.setAttribute('position',new THREE.BufferAttribute(tp,3));
 trackG.setAttribute('color',new THREE.BufferAttribute(tc,3));
 trackG.setDrawRange(0,0);

 const M=new THREE.Matrix4(),V=new THREE.Vector3();
 tick(dt=>{
  if(!tracks.visible)return;
  acc+=dt;if(acc<SAMPLE)return;acc=0;
  for(let i=0;i<N;i++){window._life.bodies.getMatrixAt(i,M);
   V.setFromMatrixPosition(M);const o=(i*T+head)*3;
   hist[o]=V.x;hist[o+1]=V.y;hist[o+2]=V.z;}
  head=(head+1)%T;if(filled<T)filled++;
  let n=0;
  for(let i=0;i<N;i++)for(let j=0;j<filled-1;j++){
   const a=(i*T+(head-filled+j+T*2)%T)*3,b=(i*T+(head-filled+j+1+T*2)%T)*3;
   // an agent that was hidden parks at y=-9999; do not draw the jump
   if(hist[a+1]<-5000||hist[b+1]<-5000)continue;
   tp[n*3]=hist[a];tp[n*3+1]=hist[a+1];tp[n*3+2]=hist[a+2];n++;
   tp[n*3]=hist[b];tp[n*3+1]=hist[b+1];tp[n*3+2]=hist[b+2];n++;}
  trackG.setDrawRange(0,n);
  trackG.attributes.position.needsUpdate=true;});

 const sync=()=>{bR.style.cssText=BST+(routes.visible?ON:'');
  bT.style.cssText=BST+(tracks.visible?ON:'');
  insp.textContent='tracker: routes '+(routes.visible?'on':'off')
   +' · tracks '+(tracks.visible?'on':'off')+'\n'
   +N+' agents — green shuttle, red patrol, amber post, pink party';};
 bR.onclick=()=>{routes.visible=!routes.visible;sync();};
 bT.onclick=()=>{tracks.visible=!tracks.visible;if(!tracks.visible){filled=0;head=0;}sync();};
 window._tracker={routes:routes,tracks:tracks};
})();
// ================================================================= LOD: take over the finished scene (core/lod)
// Sorts after every build's scene, camera and frame loop, and before 99-tail. It reads the build's `scene`, `camera`
// and `renderer` (every Krator build names them so) and the build's options from window.LOD_OPTIONS, if it set any.
// A build that calls LOD.init itself (LOD.root already made) is left alone; so is one that sets LOD_OPTIONS=false.
(function(){
 if(typeof LOD==='undefined'||LOD.root)return;
 const opt=(typeof window.LOD_OPTIONS==='undefined')?{}:window.LOD_OPTIONS;if(opt===false)return;
 try{LOD.init(Object.assign({THREE,scene,camera,renderer},opt));LOD.applied=LOD.apply();}
 catch(e){const m='LOD: '+(e&&e.stack||e);if(typeof reportErr==='function')reportErr(m);else if(typeof ERR==='function')ERR(m);else console.error(m);}
})();
</script>
