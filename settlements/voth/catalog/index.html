<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voth Building Catalog</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d8dccb;font-family:Georgia,serif}
  #app{position:fixed;inset:0}
  #bar{position:fixed;left:14px;top:14px;z-index:30;background:rgba(24,21,15,0.88);color:#f3ecd8;
       border-radius:8px;padding:9px 12px;font-size:12px;max-width:min(520px,calc(100vw - 28px));line-height:1.5}
  #bar b{color:#e0c98a;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
  #bar select,#bar button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;
       padding:4px 8px;font:inherit;font-size:11.5px;margin:3px 3px 0 0;cursor:pointer}
  #bar select option{background:#2a2518}
  #bar button.on{background:#c9a227;color:#2a2416}
  #bar .n{opacity:.6;font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar">
  <b>Voth — building catalog</b> <span class="n" id="count"></span><br>
  <select id="fam"><option value="">all families</option></select>
  <select id="src"><option value="">all sources</option></select>
  <button id="lodBtn">LOD: auto</button>
  <button id="goBtn">go to row</button>
</div>

<script src="../three.min.js"></script>
<script src="../../../kits/catalog/krator-asset-engine.js"></script>
<script src="lod.js"></script>
<script src="../../../kits/catalog/krator-master-buildings-voth.js"></script>
<script src="registry/voth-city-captured.data.js"></script>
<script src="registry/voth-city-captured.js"></script>
<script src="registry/voth-housing.js"></script>
<script src="registry/voth-manors.js"></script>
<script src="registry/voth-shops.js"></script>
<script src="registry/voth-taverns.js"></script>
<script src="registry/voth-warehouses.js"></script>
<script src="registry/voth-civic.js"></script>
<script src="registry/voth-military.js"></script>
<script src="../../../kits/catalog/inspector.js"></script>
<script src="layout.js"></script>
</body>
</html>
