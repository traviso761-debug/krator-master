<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voth City Plan</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfcfd8;font-family:Georgia,serif}
  #app{position:fixed;inset:0}
  .pnl{position:fixed;z-index:30;background:rgba(24,21,15,0.88);color:#f3ecd8;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45}
  #bar{left:14px;top:14px;width:min(390px,calc(100vw - 28px))}
  #bar h1{font-size:13px;margin:0 0 6px;color:#e0c98a;letter-spacing:.06em;text-transform:uppercase}
  .pnl button{background:rgba(255,255,255,0.1);color:#f3ecd8;border:none;border-radius:5px;padding:4px 8px;font:inherit;font-size:11.5px;margin:3px 3px 0 0;cursor:pointer}
  .pnl button.on{background:#c9a227;color:#2a2416}
  #bar input[type=range]{width:100%;margin:6px 0 2px}
  #stats{right:14px;top:14px;width:min(320px,calc(100vw - 28px));max-height:calc(100vh - 60px);overflow:auto}
  #stats b{color:#e0c98a}
  #stats table{width:100%;border-collapse:collapse;margin-top:6px}
  #stats th{text-align:left;color:#e0c98a;font-weight:normal;padding-top:6px}
  #stats td:last-child{text-align:right}
  #stats tr.ln{cursor:pointer}
  #stats tr.ln td{text-align:left!important;padding:4px 0;border-top:1px solid rgba(255,255,255,0.08)}
  #stats tr.ln.sel td{background:rgba(201,162,39,0.16)}
  .lg{opacity:.78;font-size:11px;margin-top:4px}
  .k{opacity:.6;font-size:11px}
  i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
  #legend span{display:inline-block;margin:3px 8px 0 0;font-size:11px}
  #khost-tip .sec,#insp-text .sec{color:#e0c98a;margin-top:5px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  #khost-tip .mt,#insp-text .mt{display:inline-block;width:64px;height:7px;background:rgba(255,255,255,0.12);border-radius:3px;vertical-align:0;margin:0 5px 0 3px;overflow:hidden}
  #khost-tip .mt b,#insp-text .mt b{display:block;height:100%}
  #khost-tip{background:rgba(24,21,15,0.97)!important}
  #loading{left:50%;top:45%;transform:translate(-50%,-50%);font-size:15px}
  #pathvizSel{margin-top:3px;background:rgba(255,255,255,0.08);color:#f3ecd8;border:1px solid rgba(255,255,255,0.18);border-radius:4px;font:inherit;font-size:11.5px}
  .pnl-min{position:absolute;top:6px;right:6px;margin:0!important;padding:0 7px!important;line-height:18px}
  .pnl.min{width:auto!important;max-height:none!important;padding-right:40px}
  .pnl.min > :not(.pnl-min){display:none!important}
  .pnl.min::before{content:attr(data-title);color:#e0c98a;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #ix{left:50%;top:60px;transform:translateX(-50%);width:min(960px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;display:none}
  #ix table{border-collapse:collapse;margin:6px 0 10px;font-size:11.5px}
  #ix th{text-align:left;color:#e0c98a;font-weight:normal;padding:3px 8px 3px 0;border-bottom:1px solid rgba(255,255,255,0.15);vertical-align:bottom}
  #ix td{padding:2px 8px 2px 0;border-bottom:1px solid rgba(255,255,255,0.06);vertical-align:top}
  #ix td.n{text-align:right;font-variant-numeric:tabular-nums}
  #ix .bad{color:#ff9a7a} #ix .ok{color:#9fd49a}
  #ix h2{font-size:12.5px;color:#e0c98a;margin:10px 0 2px;font-weight:normal;letter-spacing:.04em;text-transform:uppercase}
  #ixlegend{left:14px;bottom:14px;display:none;width:min(300px,calc(100vw - 28px))}
  #ixlegend .ramp{height:10px;border-radius:3px;margin:4px 0 2px}
  .low{color:#e8c25a} .out{color:#ff9a7a} .up{color:#9fd49a} .dn{color:#ff9a7a}
  #khost-tip table.ct,#insp-text table.ct{border-collapse:collapse;margin:2px 0;font-size:11.5px} #khost-tip table.ct td,#insp-text table.ct td{padding:0 8px 0 0;vertical-align:top}
  @media (max-width:760px){#stats{top:auto;bottom:14px;max-height:30vh}}
</style>
<script>window.KRATOR_HOST = true;   /* core/host takes the camera and the loop (targets/voth-city/97-vc-host-take.js) */</script>
</head>
<body>
<div id="app"></div>
<div id="bar" class="pnl" data-title="Voth &middot; city plan">
  <input id="step" type="range" min="0" max="14" step="1" value="14">
  <button id="prev">&larr; step</button><button id="next">step &rarr;</button><button id="play">play</button><br>
  <button id="ly-buildings">buildings</button><button id="ly-lots">lots</button><button id="ly-wealth">wealth</button><button id="ly-labels">labels</button><button id="ly-transit">transit</button><button id="ly-flora">flora</button><button id="ly-density" title="residents per hectare, workplaces per hectare, work posts against the 90% rule, off (n)">density (n)</button><button id="ly-ixrep" title="the interiors report and the job table">interiors report</button> <span id="cut-status" class="k"></span><br>
  <button id="clk-pause" title="freeze everything where it is: people, animals, carts, boats, the clock and the sky (k)">pause (k)</button><span id="wx"></span><br><span id="clk-sim" class="k"></span><br>
  <button id="pathvizToggle">Paths: Off</button><select id="pathvizSel" style="display:none"></select>
  <button id="v-map">map</button><button id="v-city">city</button><button id="v-street">street level</button><button id="export">export plan JSON</button>
</div>
<div id="stats" class="pnl" data-title="Step and counts"><div id="stats-body"></div></div>
<div id="ix" class="pnl" data-title="Interiors report"><b>Interiors report</b> <span class="k">(every lot building: 41-vc-building-interiors.js)</span> <button id="ix-close" style="float:right">&#10005;</button><div id="ix-body"></div></div>
<div id="ixlegend" class="pnl"></div>
<!-- the inspector and its hover tip, the stocks, the marks, the editor, the picture menu and the cutaway's bar are core/host's (97-vc-host-take.js) -->
<div id="loading" class="pnl">Laying out the city on the site...</div>
