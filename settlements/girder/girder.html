<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girder</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1720;
    font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8e2d6}
  canvas{display:block}
  #ui{position:fixed;left:10px;top:10px;z-index:10;max-width:250px;max-height:96vh;overflow-y:auto}
  #ui h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px;
    font-weight:600;color:#d8c89a;text-shadow:0 1px 3px #000}
  #ui button{display:inline-block;margin:0 4px 4px 0;padding:5px 9px;cursor:pointer;
    background:rgba(22,20,26,.78);color:#e8e2d6;border:1px solid rgba(216,200,154,.32);
    border-radius:3px;font:11px/1 inherit;letter-spacing:.03em}
  #ui button:hover{background:rgba(216,200,154,.22);border-color:rgba(216,200,154,.7)}
  #ui button.on{background:rgba(200,60,50,.55);border-color:#e08070}
  #hint{margin-top:8px;color:#a89e8c;font-size:10.5px;text-shadow:0 1px 2px #000;line-height:1.5}
  #polyBox{margin-top:8px;display:none}
  #polyOut{width:100%;box-sizing:border-box;height:64px;resize:vertical;margin-top:4px;
    background:rgba(10,9,12,.78);color:#c9c0ac;border:1px solid rgba(216,200,154,.28);
    border-radius:3px;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px}
  #dnControls{margin-top:8px}
  #dnControls input[type=range]{width:100%;accent-color:#d8c89a;display:block;margin:2px 0 6px}
  #dnLabel{display:flex;justify-content:space-between}
  #weatherToggle,#dnPause{width:100%;box-sizing:border-box;margin-bottom:4px}
  #hud{position:fixed;right:10px;top:10px;z-index:10;padding:6px 9px;border-radius:3px;
    background:rgba(22,20,26,.7);border:1px solid rgba(216,200,154,.2);
    font:10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9c0ac;white-space:pre;text-align:right}
  #errs{position:fixed;left:10px;bottom:10px;right:10px;z-index:20;max-height:32%;overflow:auto;
    padding:0;color:#ffb4a2;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
  #errs:not(:empty){padding:8px 10px;background:rgba(48,12,12,.9);border:1px solid #a33;border-radius:3px}
  #inspectToggle{width:100%;box-sizing:border-box;margin-bottom:4px}
  #pathvizToggle{width:100%;box-sizing:border-box;margin-bottom:4px}
  #pathvizSel{width:100%;box-sizing:border-box;margin-bottom:4px;display:none;
    background:rgba(22,20,26,.78);color:#e8e2d6;border:1px solid rgba(216,200,154,.32);
    border-radius:3px;font:11px/1.4 inherit;padding:4px}
  #inspectTip{position:fixed;z-index:25;display:none;pointer-events:none;padding:4px 8px;
    background:rgba(16,14,18,.88);border:1px solid rgba(216,200,154,.5);border-radius:3px;
    font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#f0e6cc;white-space:nowrap}
  #inspectTip b{color:#d8c89a}
  #load{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:#0f1a14;color:#d8c89a;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
</style>
</head>
<body>
<div id="load">Raising the ruin…</div>
<div id="ui">
  <h1>Girder</h1>
  <div id="views"></div>
  <div id="hint">Drag&nbsp;= orbit · Wheel&nbsp;= zoom · WASD/QE&nbsp;= pan · Shift&nbsp;= fast<br>Click anything to print its coordinates (x, z and height).</div>
  <div id="dnControls">
    <div id="dnLabel"><span>Time of day</span><span id="dnHourOut">10:00</span></div>
    <input type="range" id="dnSlider" min="0" max="24" step="0.1" value="10">
    <button id="dnPause">Pause</button>
  </div>
  <button id="inspectToggle">Inspector: Off</button>
  <button id="pathvizToggle">Paths: Off</button>
  <select id="pathvizSel"></select>
  <div>
    <button id="polyToggle">Mark polygon</button>
    <button id="polyUndo">Undo point</button>
    <button id="polyClear">Clear</button>
  </div>
  <div id="polyBox">
    <div id="hint">Click any surface to drop a corner, in order. The box below is a ready-to-paste [[x,y,z],...] array; click it to select all.</div>
    <textarea id="polyOut" readonly onclick="this.select()"></textarea>
  </div>
</div>
<div id="hud"></div>
<div id="inspectTip"></div>
<div id="errs"></div>
<script>
(function(){
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  if(location.protocol!=='file:') s.crossOrigin='anonymous';
  /* Handshake (as in Locus): a viewer that injects the page's scripts one by one after the document has loaded
     (Claude's about:srcdoc frame) reports readyState 'complete' while the BUILD script is still to come, so waiting
     for DOMContentLoaded is not enough. three.js's onload and the BUILD script's tail (window._krGo, 99-tail.html)
     each call go(); whichever arrives second starts the build, exactly once. */
  var threeOK=false, started=false;
  function go(){ if(started || !threeOK || typeof BUILD!=='function') return; started=true; try{ BUILD(); }catch(e){ ERR('build: '+(e&&e.stack||e)); } }
  window._krGo=go;
  s.onload=function(){ threeOK=true; go(); };
  s.onerror=function(){ ERR('Could not load three.js from the CDN.'); };
  document.head.appendChild(s);
})();
var _errBox=document.getElementById('errs'), _errN=0;
function ERR(m){ if(_errN++>14) return; _errBox.textContent += (_errBox.textContent?'\n':'')+m;
  /* the loading screen covers the error panel: take it down so an error during the build shows instead of a hang */
  var L=document.getElementById('load'); if(L && L.style.display!=='none') L.style.display='none'; }
window.onerror=function(m,u,l,c,e){ ERR('error: '+m+' @'+l+':'+c+(e&&e.stack?'\n'+e.stack:'')); };
window.addEventListener('unhandledrejection',function(e){ ERR('promise: '+(e.reason&&e.reason.stack||e.reason)); });
</script>
<script>
function BUILD(){
'use strict';

/* ============================== 0. PALETTE ==============================
   FROZEN, planner-owned. All colour, material families and budgets for
   Girder live here. build.py rejects colour arrays declared anywhere
   else. sRGB hexes unless a comment says LINEAR.

   Setting: Krator, the hypertropic (XA) jungle on the SE, lee shore of the
   Ring Sea — ~1.9 atm, 33 C, red soil, iridescent violet/green canopy. */
var PAL = {
  /* --- atmosphere (read by 20-stage / 21-sky / 82-daynight) --- */
  haze      : 0xb7c4ae,     /* humid green-white jungle haze */
  hazeNight : 0x141d24,
  fogDensity: 0.00040,      /* FogExp2 at the 1.6 atm reference; the sky model scales it up for 1.9 atm */
  sunColor  : 0xfff0d2,
  sunIntensity : 1.18,
  hemiSky   : 0xbcd0c8,
  hemiGround: 0x3d3a26,
  hemiIntensity : 0.50,
  ambient   : 0x6f8078,
  ambientIntensity : 0.20,

  /* --- ground --- */
  soil   : [0x7a3a26, 0x6a3222, 0x8a452c],          /* Tharnish red soil where bare */
  litter : [0x4a3a24, 0x3e321f, 0x574428],          /* leaf litter on the forest floor */
  moss   : [0x3e5a2c, 0x34502a, 0x496632],
  rock   : [0x6d665c, 0x5c574f, 0x7b7468, 0x4f4a44],
  riverShallow : 0x6f8f6a, riverDeep : 0x2b4a3c, foam : 0xe6efe2,

  /* --- hypertree species: bark tint sets and foliage ---
     0 Ironbark   : fibrous red-brown, dark needle tiers
     1 Ghostwood  : birch-white with dark flecks, airy yellow-green, violet flower racemes
     2 Prism gum  : rainbow-eucalyptus streaks, iridescent violet/green canopy (canon XA canopy)
     3 Gate baobab: smooth swollen grey-brown bottle trunk, sparse flat crown, orange pod fruit */
  bark : [
    [0x7a4630, 0x6a3a28, 0x8a5236],
    [0xe6e2d4, 0xd8d3c2, 0xf0ece0],
    [0x9a8f6a, 0x6f9a6a, 0xb8683e, 0x5a6fa0, 0x8a4f78, 0xc2a24e],
    [0x8a7a66, 0x7a6c5a, 0x9a8a74]
  ],
  barkFleck : [0x3a362e, 0x4a453a],
  leaf : [
    [0x1f3d24, 0x254a2a, 0x1a3520, 0x2c5230],
    [0x8aa83e, 0x9ab848, 0x7a9a3a, 0xa8c456],
    [0x2c8a5e, 0x3a9a68, 0x5a3690, 0x6a46a0],       /* green on sun-facing, violet away: shader mixes [0..1] with [2..3] */
    [0x4a6a2a, 0x567a30, 0x3e5e26]
  ],
  flower : [0x9a6ad8, 0xb48af0, 0x7a4ac0],          /* ghostwood racemes */
  fruit  : [0xe0862a, 0xd06a20, 0xf0a040],          /* baobab pods */
  under  : [0x1e3a20, 0x27482a, 0x18301c, 0x305a30, 0x224426],   /* dark understorey */
  fern   : [0x2e5a2a, 0x3a6a30, 0x274e26],
  palm   : [0x3a6a2e, 0x467a36, 0x2e5a28],
  fungus : [0x8d6a5e, 0xa08464, 0xc8a070, 0x7a4a6a],
  sapling: [0x3a6a34, 0x2e5a2c],
  deadwood : [0x5a4a3a, 0x4a3c30, 0x6a5846],

  /* --- the ancients' ruin: weathering steel and stained concrete --- */
  rust     : [0x7a3b22, 0x8a4526, 0x6a311e, 0x94522c, 0x5a2a1a],     /* girders, columns, deck edges */
  rustStain: [0x4a2a1c, 0x3a2218],
  concrete : [0x8a857a, 0x7c786e, 0x969084, 0x6e6a62],                /* floor plates, core walls */
  vine     : [0x2e5a2a, 0x3a6a30, 0x274e26, 0x4a7a36, 0x1e4220],
  /* --- built fabric: everything is timber, thatch, rope, hide --- */
  plank  : [0x9a7a52, 0x8a6c48, 0xa8865c, 0x7c6040],      /* decking */
  timber : [0x5e4630, 0x6a5038, 0x4e3a28, 0x745a3e],      /* posts, beams, struts */
  wall   : [0xb89a6c, 0xa88a5e, 0xc4a878, 0x9a7e56, 0xd0b88a],   /* woven / plank walls */
  wallDark : [0x6e5238, 0x5e4630, 0x7a5c40],              /* stave-style tarred walls */
  carved : [0x8c6a48, 0x7c5c3e, 0x9a7650],                /* rooms cut into living baobab wood */
  thatch : [0xb09a5a, 0xa08a4e, 0xc0aa68, 0x8e7a44, 0x9a8a52],
  shingle: [0x6a5a44, 0x5a4c3a, 0x7a684e, 0x4e4234],
  ornate : [0x8a2f2a, 0xb08432, 0x2f6a5a, 0x7a2028],      /* council hall trim: red lacquer, gilt, verdigris */
  rope   : [0xa8966a, 0x98865c],
  cloth  : [0x7a2028, 0x8a5a2a, 0x2f5a3a, 0xc2a24e, 0x4a3a6a, 0xb8683e],
  awning : [0xb8683e, 0x8a9a5a, 0xc2a24e, 0x7a4a6a, 0xa85040],
  web    : [0xe8ecec, 0xd8dede],
  crop   : [0x5c8a3a, 0x7a9a3e, 0x9aa848, 0x4e7a32],
  crate  : [0x7a6a4e, 0x877558, 0x6d5e45],
  uniform: { green:0x4a5e34, brown:0x5a4630, trim:0xb08432 },    /* Refuge soldiers */
  people : { skin:[0xc99a72, 0x9a6a48, 0xe0b890, 0x7a5236, 0xb8845a],
             garb:[0x8a5a2a, 0x6a7a4a, 0xa88a5e, 0x7a2028, 0x4a5a6a, 0xc2a24e, 0x5e4630, 0x8a6c8a],
             hair:[0x241f1c, 0x4a3426, 0x8a6a3a, 0xd8d0c0] },
  beast  : { quetz:[0xc8b48a, 0x8a5a3a, 0xd86a3a],   /* body, wing membrane, crest */
             dragonfly:[0x2f8a7a, 0x3a5a9a, 0xd8f0f0],
             bat:[0x3a2e2a, 0x5a4238, 0x8a6a5a],
             archae:[0x2a4a7a, 0xb8683e, 0xe8d8a0],
             spider:[0x2a2622, 0x7a2028, 0xc2a24e],
             millipede:[0x4a2e22, 0xb8683e] },

  /* LINEAR-space flame colours (multiplied into reflected light before the sRGB encode) */
  flame : { warm:[1.00, 0.55, 0.21], cool:[0.35, 0.80, 1.00] },
  glowWarm : 0xffb347, glowCool : 0x7fd8ff,
  windowLit : 0xffc878, windowDark : 0x1a140e,

  /* --- sky (Krator sky model, shared canon with Voth) --- */
  sky : {
    zenDeep : 0x35619c, zenHazy : 0x93a6bb,
    horDeep : 0xa9b3bd, horHazy : 0xd6dccb,
    sunset  : 0xc8703a, twilight: 0x35304a,
    nightZen: 0x101a2a, nightHor: 0x1e2a34,
    star    : 0xdfe7ff,
    sunCore : 0xfff6e2, sunGlare: 0xffe0a4, sunLow: 0xff9d55,
    shine   : 0x86b6c6,
    eclRim  : 0xc98a6a,
    soil    : 0x8c4a31
  },
  giant : { zone:0x3c7e91, belt:0xd6c9a8, storm:0xb98a63, rim:0x9fd4ea, night:0x4b6f86, ring:0xbcb09a },

  pathviz : [0x46c8e6, 0xd76f9c, 0x86d24a, 0xd8a0ff, 0xffb347, 0x7fe0c0, 0xc2b280, 0xff7f7f]
};

/* Material families. The family picks the material bucket, so ADDING A FAMILY
   ADDS A DRAW CALL (x2 if it is used by both the instanced kit and the merged
   mesh builder). `scale` is the world-unit tile size of its texture;
   47-texture.js fills `tex`. */
var FAMMAT = {
  plank  : { tex:null, scale:[3.0,3.0] },
  timber : { tex:null, scale:[2.0,4.0] },
  wall   : { tex:null, scale:[3.0,3.0] },
  thatch : { tex:null, scale:[2.5,2.5] },
  shingle: { tex:null, scale:[2.0,2.0] },
  rope   : { tex:null, scale:[0.6,0.6] },
  cloth  : { tex:null, scale:[2.0,2.0] },
  rock   : { tex:null, scale:[6.0,6.0] },
  rust   : { tex:null, scale:[5.0,5.0] },
  concrete:{ tex:null, scale:[8.0,8.0] },
  web    : { tex:null, scale:[3.0,3.0], alpha:true },
  leafy  : { tex:null, scale:[3.0,3.0] },          /* solid understorey blobs, crops */
  bark0  : { tex:null, scale:[10,20] }, bark1:{ tex:null, scale:[10,20] },
  bark2  : { tex:null, scale:[12,24] }, bark3:{ tex:null, scale:[14,14] },
  glowmat: { tex:null, scale:[1,1], basic:true }   /* unlit emissive bits */
};

var BUDGET = { drawCalls: 110, triangles: 4200000, instances: 260000 };

/* aliases */
var PLANKC = PAL.plank, TIMBERC = PAL.timber, WALLC = PAL.wall, WALLDARKC = PAL.wallDark,
    CARVEDC = PAL.carved, THATCHC = PAL.thatch, SHINGLEC = PAL.shingle, ORNATEC = PAL.ornate,
    ROPEC = PAL.rope, CLOTHC = PAL.cloth, AWNINGC = PAL.awning, WEBC = PAL.web, CROPC = PAL.crop,
    CRATEC = PAL.crate, ROCKC = PAL.rock, UNDERC = PAL.under, FERNC = PAL.fern, PALMC = PAL.palm,
    RUSTC = PAL.rust, CONCRETEC = PAL.concrete, VINEC = PAL.vine, FUNGC = PAL.fungus, DEADWOODC = PAL.deadwood, FLOWERC = PAL.flower, FRUITC = PAL.fruit;
/* ============================== 1. CORE ==============================
   Units are METRES. x runs east, z runs south, y up. A person is 1.75 tall.
   The river flows from the east edge to the west edge (downstream = -x),
   GIRDER: an outlying beast-rider village built into an ancient ruin. A small
   brook runs past the settlement from the north to the south-east. */

var SEED = 20260920;
var seed = SEED;
function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
function rr(a,b){ return a + (b-a)*rnd(); }
function ri(a,b){ return Math.floor(a + (b-a+1)*rnd()); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function chance(p){ return rnd() < p; }
function reseed(s){ seed = s; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smooth(e0,e1,x){ var t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function mix(a,b,t){ return a+(b-a)*t; }
function smin(a,b,k){ var h=clamp(0.5+0.5*(b-a)/k,0,1); return mix(b,a,h) - k*h*(1-h); }
var TAU = Math.PI*2;
function wrapPi(a){ while(a> Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; }
function angDist(a,b){ return Math.abs(wrapPi(a-b)); }

/* value noise */
function h2(i,j){ var n=(i*374761393 + j*668265263)|0; n=(n^(n>>13))|0; n=Math.imul(n,1274126177); n=(n^(n>>16))>>>0; return n/4294967295; }
function vn(x,z){
  var i=Math.floor(x), j=Math.floor(z), fx=x-i, fz=z-j;
  var u=fx*fx*(3-2*fx), v=fz*fz*(3-2*fz);
  var a=h2(i,j), b=h2(i+1,j), c=h2(i,j+1), d=h2(i+1,j+1);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x,z){
  return (0.5*vn(x,z) + 0.25*vn(x*2.03+11.3,z*2.01-7.1)
        + 0.125*vn(x*4.07-3.3,z*4.03+5.9) + 0.0625*vn(x*8.11+17,z*8.05+23)) / 0.9375;
}
function sig(x,z,f){ return (fbm(x*f, z*f) - 0.5) * 2; }   /* roughly -1 .. 1 */
/* deterministic position hash, 0..1 — NOT the rnd() stream */
function phash(x,y,z,salt){
  var v = Math.sin(x*12.9898 + z*78.233 + y*37.719 + (salt||0)*93.9898) * 43758.5453;
  return v - Math.floor(v);
}

function segDist(px,pz, ax,az, bx,bz){
  var vx=bx-ax, vz=bz-az, wx=px-ax, wz=pz-az;
  var L=vx*vx+vz*vz; var t = L>0 ? clamp((wx*vx+wz*vz)/L,0,1) : 0;
  var dx=px-(ax+vx*t), dz=pz-(az+vz*t);
  return Math.sqrt(dx*dx+dz*dz);
}
var _rv = { d:0, t:0, i:0, u:0 };
function polyNear(px,pz, pts, cum){
  var m=1e9, bt=0, bi=0, bu=0;
  for(var i=0;i<pts.length-1;i++){
    var ax=pts[i][0], az=pts[i][1], bx=pts[i+1][0], bz=pts[i+1][1];
    var vx=bx-ax, vz=bz-az, wx=px-ax, wz=pz-az;
    var LL=vx*vx+vz*vz, t = LL>0 ? clamp((wx*vx+wz*vz)/LL,0,1) : 0;
    var dx=px-(ax+vx*t), dz=pz-(az+vz*t), d=Math.sqrt(dx*dx+dz*dz);
    if(d<m){ m=d; bi=i; bu=t; bt = cum[i] + t*(cum[i+1]-cum[i]); }
  }
  _rv.d = m; _rv.t = bt; _rv.i = bi; _rv.u = bu; return _rv;   /* t is ARC LENGTH along the polyline */
}
function cumLen(pts){
  var c=[0];
  for(var i=1;i<pts.length;i++) c.push(c[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  return c;
}
function segCross(ax,az,bx,bz, cx,cz,dx,dz){
  function o(px,pz,qx,qz,rx,rz){ return (qx-px)*(rz-pz) - (qz-pz)*(rx-px); }
  var d1=o(ax,az,bx,bz,cx,cz), d2=o(ax,az,bx,bz,dx,dz);
  var d3=o(cx,cz,dx,dz,ax,az), d4=o(cx,cz,dx,dz,bx,bz);
  return ((d1>0)!==(d2>0)) && ((d3>0)!==(d4>0));
}
/* local (lx,lz) about (x,z) rotated by ry -> world. Same convention as Voth:
   local +x points along world angle -ry. */
function loc(x,z,lx,lz,ry){
  return [ x + lx*Math.cos(ry) + lz*Math.sin(ry), z - lx*Math.sin(ry) + lz*Math.cos(ry) ];
}

/* ============================== 2. WORLD CONSTANTS ============================== */

var WORLD = 7200, HW = WORLD/2;    /* terrain extent; jungle to the fog line */
var CITY_EXT = 1500;               /* the detailed box: ground texture, light volume, undergrowth */

/* ---- the brook, listed UPSTREAM (north) to DOWNSTREAM (south-east). It keeps
        the old river API (RIVER, riverAt, riverLevel, riverDist...) so every
        pass written for Mav's Refuge still reads it. ---- */
var RIVER = (function(){
  var ctrl = [[-900,-3600],[-760,-2500],[-430,-1600],[-330,-900],[-300,-380],[-268,20],[-130,262],[120,300],[430,372],[900,640],[1700,930],[2600,1500],[3600,1950]];
  var out=[];
  for(var i=0;i<ctrl.length-1;i++){
    var p0=ctrl[Math.max(0,i-1)], p1=ctrl[i], p2=ctrl[i+1], p3=ctrl[Math.min(ctrl.length-1,i+2)];
    for(var k=0;k<10;k++){
      var t=k/10, t2=t*t, t3=t2*t;

function makeSkyTexture(volc){

  canopy(mix3(rgbOf(STAGE_CANOPY),  HZC, 0.10), 0.98, 0.8, 1.7, 14, 41.7, 0.50, 0.5);

(function volcanoCycle(){
  function tick(){
    var st = VOLCANO_FORCE || (Math.random() < 0.22 ? 'active' : 'idle');

/* ============================== 5b. KRATOR SKY ==============================
   A layered BACKGROUND SCENE rendered before the city (80-camera.js), holding
   the gas giant Krator orbits, the sun, and a star field that wheels around
   the south celestial pole while the giant hangs fixed in the north.

   Why a second scene and not a cubemap: a 30-degree disc needs more detail
   than a cubemap face holds, the stars have to rotate while the giant stays
   put, and the giant's phase changes every hour. The background camera sits
   at the origin and only copies the main camera's orientation, so everything
   here is at a fixed ANGULAR size no matter where the city camera stands, and
   scene.fog (20-stage.js) can never touch it.

   What was already here and is KEPT: the baked volcano skybox from
   20-stage.js (makeSkyTexture/volcTex/skyMesh) is moved into this scene
   wholesale and becomes layer 0. Its texture swap (the eruption cycle) and
   its material.color tint (82/83) both keep working untouched; a
   pressure/sun/eclipse gradient is layered on top of it through
   onBeforeCompile so the volcano band near the horizon is never overpainted.

   This fragment also owns THE CLOCK. 82-daynight.js's dayNightHour() — read
   by the arena, the ordinator drills, the monks, the shopkeepers and the lit
   windows — now delegates here, so hour/dayOfYear/timeScale are one clock
   driving everything rather than two competing ones.

   DETERMINISM: every random choice below comes from skyRnd(), a private LCG
   seeded once from SKY_STARSEED. The shared rnd()/rr()/pick() stream is NOT

     true — "climate, day length and seasons all depend on latitude, not

     H = -subPlanetLonDeg, and the ordinary horizontal-coordinate transform
     does the rest (skyGiantGeometry below).

  giantAzOverride  : null,  /* deg, or null to derive from the two above   */
  giantAltOverride : null,
  giantAz       : 67.34,    /* READ-ONLY mirror of the derived value, so    */
  giantAlt      : 24.66,    /* 80-camera.js's presets and the panel can     */
                            /* read a plain number every frame.             */
  giantDiaDeg   : 30,       /* deg, 60 full moons across                   */
  giantSpinH    : 10,       /* h per rotation of the giant's own bands     */
  sunDiaDeg     : 0.53,     /* deg                                         */
  pressureAtm   : 1.9,      /* 0.8 plateau · 1.6 Voth lowland · 1.9 HERE (hypertropic lee shore) · 2.0 Ring Sea */
  skyModelK     : 0.86,     /* how much of the baked dome the pressure/sun model replaces above the horizon band */
  forceEclipse  : false,
  showRings     : true,
  secPerHour    : 5,        /* real seconds per sky hour (the city's own)  */

var SKYC_SUN_CORE  = PAL.sky.sunCore;
var SKYC_SUN_GLARE = PAL.sky.sunGlare;
var SKYC_SUN_LOW   = PAL.sky.sunLow;   /* sun disc reddened below ~10 deg         */

var GIANTC_BELT    = PAL.giant.belt;   /* cream belts                             */

/* ---------------------------------------------------------------- math
   az: 0 = north, 90 = east. World axes are +Y up, -Z north, +X east, which
   is the same convention API.md states for the city (x east, z south). */
function altAzToVec(altDeg, azDeg, out){
  var a = altDeg*SKY_D, z = azDeg*SKY_D, ca = Math.cos(a);
  return (out || new THREE.Vector3()).set(Math.sin(z)*ca, Math.sin(a), -Math.cos(z)*ca);
}
/* Solar declination. Positive = northern summer, so Krator's midsummer (the
   sun highest in the north) is where dec is most NEGATIVE — day ~355. */
function skyDeclination(doy){
  return SKY.tiltDeg*SKY_D * Math.sin(2*Math.PI*(doy - 80)/SKY.yearLengthD);
}
/* THE SIGN CHECK (brief, section 5, and it matters).
   The brief's sketch converts its south-referenced azimuth with
   `az = PI - azFromSouth`, which MIRRORS east and west: it puts the 06:00
   sun at azimuth 270 (west). The day-80 noon case the brief tells you to
   check against is exactly the one case that CANNOT catch it, because there
   azFromSouth is 180 and PI-180 and PI+180 both land on due north.
   The standard horizontal-coordinate form below is used instead — it needs
   no quadrant fix-up, keeps the sign of dec (the brief's tan(dec) loses it),
   and reproduces every number in the brief's own table:
     day  80 noon -> alt 50.00, az 0 (north)   day 172 noon -> alt 27.00, az 0
     day 355 noon -> alt 72.99, az 0 (north)   day  80 06:00 -> alt 0, az 90 (EAST)
   See skyCheckSigns() at the bottom of this file, which asserts all of it at
   load and prints to the error panel if it ever stops being true. */
function skySunDir(hour, doy, out){
  var dec = skyDeclination(doy);
  var H   = (360/SKY.dayLengthH)*(hour - 12)*SKY_D;
  var phi = SKY.latitude*SKY_D;
  var sinAlt = Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H);
  var alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  var az  = Math.atan2(-Math.cos(dec)*Math.sin(H),
                        Math.cos(phi)*Math.sin(dec) - Math.sin(phi)*Math.cos(dec)*Math.cos(H));
  return altAzToVec(alt/SKY_D, az/SKY_D, out);
}
function skySunAltAz(hour, doy){
  var v = skySunDir(hour, doy, _skyTmpA);
  return { alt: Math.asin(Math.max(-1,Math.min(1,v.y)))/SKY_D,

}
function skySmooth(lo, hi, x){ var t = Math.max(0, Math.min(1, (x-lo)/(hi-lo))); return t*t*(3-2*t); }

var _skyTmpA = new THREE.Vector3(), _skyTmpB = new THREE.Vector3();

/* ---------------------------------------------------------------- clock

   off it, so advancing 24 h at 600x rolls the date exactly once. 82's
   dayNightHour() delegates here, which is what keeps the arena crowd, the
   ordinator drills, the monks and the lit windows on the same time as the
   sun. */
var SKY_DAY0 = 80;                                  /* the equinox: the brief's own reference day */
var SKY_T    = 10*3600;                             /* opens at 10:00, as 82-daynight.js always did */
function skyHour(){ return (SKY_T/3600) % 24; }
function skyDayOfYear(){ return (SKY_DAY0 + Math.floor(SKY_T/86400)) % SKY.yearLengthD; }
function skyAdvance(dtReal){
  if(SKY.paused || SKY.timeScale === 0) return;
  SKY_T += dtReal * (3600/SKY.secPerHour) * SKY.timeScale;
}
function skySetHour(h){
  h = ((h % 24) + 24) % 24;

}
function skySetDayOfYear(d){
  d = ((Math.round(d) % SKY.yearLengthD) + SKY.yearLengthD) % SKY.yearLengthD;

/* ---------------------------------------------------------------- scene */
var skyScene = new THREE.Scene();
var skyCam   = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 5, 30000);

skyScene.background = scene.background;
scene.background = null;

var SKY_R_GIANT = 1000, SKY_R_STARS = 3000, SKY_R_SUN = 5000;

/* ---- layer 0: the existing baked volcano dome, moved across ------------ */
scene.remove(skyMesh);
skyMesh.position.set(0,0,0);
skyMesh.material.depthTest = false;
skyMesh.renderOrder = -10;
skyScene.add(skyMesh);

/* A pressure/sun/eclipse gradient layered ON TOP of the bake rather than
   replacing it: the volcano, its plume and the horizon haze bank all live in

   only ABOVE that band, so none of 20-stage.js's careful volcano paint is
   overwritten. */

  uSkyZen   : { value: new THREE.Color() },
  uSkyHor   : { value: new THREE.Color() },
  uSkyK     : { value: 0.0 },
  uHazeCol  : { value: new THREE.Color() },
  uHazeH    : { value: 0.10 },
  uHazeA    : { value: 0.0 },
  uSunDirS  : { value: new THREE.Vector3(0,1,0) },
  uSunGlowC : { value: new THREE.Color() },
  uSunGlowK : { value: 0.0 },
  uSunGlowP : { value: 16.0 },
  uBelowCol : { value: new THREE.Color() },      /* = the city's fog colour (82-daynight.js) */

    'uniform vec3 uHazeCol; uniform float uHazeH; uniform float uHazeA;\n' +
    'uniform vec3 uSunDirS; uniform vec3 uSunGlowC; uniform float uSunGlowK; uniform float uSunGlowP;\n' +

        '    float k = uSkyK * smoothstep(0.015, 0.34, up);',
        '    gl_FragColor.rgb = mix(gl_FragColor.rgb, modelSky, k);',

        '    gl_FragColor.rgb = mix(gl_FragColor.rgb, uBelowCol, uBelowK*smoothstep(0.004, -0.055, sd.y));',

skyMesh.material.customProgramCacheKey = function(){ return 'kratorDomeMav'; };
skyMesh.material.needsUpdate = true;

/* ---- layer 1: the stars ------------------------------------------------
   Positions from a PRIVATE LCG (skyRnd), never the shared rnd() stream —
   SUBAGENT.md section 6: any rr()/chance()/pick() call here would advance

function skyRnd(){ _skySeed = (Math.imul(_skySeed, 1664525) + 1013904223) >>> 0; return _skySeed/4294967296; }

skyScene.add(starGroup);
var SKY_POLE = altAzToVec(-SKY.latitude, 180);   /* south celestial pole: alt |lat|, due south */

    uniforms: {
      uOpacity  : { value: 0 },
      uZenK     : { value: 0 },
      uSize     : { value: 2.8 },
      uColor    : { value: new THREE.Color(SKYC_STAR).convertSRGBToLinear() },
      uGiantDir : { value: new THREE.Vector3(0,1,0) },
      uWashCos  : { value: Math.cos(20*SKY_D) }

    vertexShader: [
      'attribute float aMag;',
      'uniform float uSize; uniform float uOpacity; uniform float uZenK;',
      'uniform vec3 uGiantDir; uniform float uWashCos;',
      'varying float vB;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vec3 d = normalize(wp.xyz);',
      /* washed out within ~20 deg of the giant */
      '  float near = smoothstep(uWashCos, 1.0, dot(d, uGiantDir));',
      '  vB = aMag * uOpacity * (1.0 - 0.92*near);',

    uE2      : { value: new THREE.Vector3(0,0,1) },

    uStormC  : { value: new THREE.Color(GIANTC_STORM).convertSRGBToLinear() },
    uRimCol  : { value: new THREE.Color(GIANTC_RIM).convertSRGBToLinear() },
    uNightC  : { value: new THREE.Color(GIANTC_NIGHT).convertSRGBToLinear() },
    uS1      : { value: new THREE.Vector4(-0.36, 1.10, 0.40, 0.13) },   /* lat, lon, half-lon, half-lat */

    uSunI    : { value: 0.86 },
    uRim     : { value: 0 },
    uMoonSh  : { value: 0 },
    uShadR   : { value: 0.0433 },
    uRingSh  : { value: 0 },
    uRingLat : { value: 0 },

       under SwiftShader, which is the only thing we test on. */
    '  float ndv  = clamp(dot(N, V), 0.0, 1.0);',
    '  float limb = pow(max(ndv, 0.0015), 0.35);',
    /* 2. phase: Lambert with a ~10 degree soft terminator, faint night side */
    '  float ndl = dot(N, uSunDir);',
    '  float day = smoothstep(-0.17, 0.17, ndl);',
    '  vec3 outc = col*limb*(uSunI*day) + col*limb*uNightC*0.03;',
    /* moon shadow transiting the full disc */
    '  float ang = acos(clamp(ndl, -1.0, 1.0));',
    '  outc *= mix(1.0, 0.06 + 0.94*smoothstep(uShadR*0.55, uShadR*1.30, ang), uMoonSh);',
    /* 4. atmospheric rim — the main feature during an eclipse */
    '  float fres   = pow(max(1.0 - ndv, 0.0), 3.2);',
    '  float rimLit = mix(smoothstep(-0.35, 0.45, ndl), 1.0, uRim);',
    '  outc += uRimCol * fres * (0.14 + 3.2*uRim) * rimLit;',
    /* ATMOSPHERIC EXTINCTION ACROSS THE DISC.
       Sitting 25 degrees up and 30 degrees wide, the giant now has its lower
       limb around 10 degrees above the horizon and its upper limb around 40,
       and the light path through Krator\'s dense air is far longer for the
       first than the second — so the bottom of the disc washes toward the
       horizon haze while the top stays clean.
       Deliberately NOT done by putting scene.fog on the sky scene: that
       would satisfy the sentence and break acceptance item 8, which tests
       that the city\'s fog never dims the giant. This is per-fragment
       altitude, not distance, so a camera on a tower sees exactly the same
       gradient as one in the street. uHazeK/uHazeH come off pressureAtm, so
       an abyss city gets a strongly tinted lower limb and a plateau city
       gets none — the same way pressure drives everything else here. */
    '  float hz = uHazeK * exp(-max(vSky.y, 0.0)/max(uHazeH, 0.004));',
    '  outc = mix(outc, uHazeCol, clamp(hz, 0.0, 0.92));',
    /* soft shoulder rather than a clip, so a bright limb never flat-tops to white */
    '  outc = outc / (1.0 + outc*0.34);',
    '  gl_FragColor = vec4(outc, 1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <encodings_fragment>',
    '}' ].join('\n'),
  fog: false
});
giantMat.uniforms.uHazeCol.value = SKY_DOME_U.uSkyHor.value;   /* one object, two materials */
var giantMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), giantMat);
giantMesh.renderOrder = -8;
giantMesh.frustumCulled = false;
skyScene.add(giantMesh);

/* ---- rings: a hairline, seen from within their own plane --------------- */
var ringMat = new THREE.ShaderMaterial({
  uniforms: {
    uCol     : { value: new THREE.Color(GIANTC_RING).convertSRGBToLinear() },
    uSunDir  : { value: new THREE.Vector3(0,1,0) },
    uCentre  : { value: new THREE.Vector3() },
    uInner   : { value: 1.30 },
    uOuter   : { value: 2.12 },
    uOpacity : { value: 0.9 }
  },
  vertexShader: [
    'varying vec3 vW;',
    'void main(){',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vW = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}' ].join('\n'),
  fragmentShader: [
    'uniform vec3 uCol; uniform vec3 uCentre; uniform float uInner, uOuter, uOpacity;',
    'varying vec3 vW;',
    'void main(){',
    '  float r = length(vW - uCentre);',
    /* a handful of gaps so the hairline is not a uniform smear */
    '  float t = r;',
    '  float g = 0.62 + 0.38*sin(t*0.16) * sin(t*0.047 + 1.3);',
    '  float a = uOpacity * clamp(g, 0.06, 1.0);',
    '  gl_FragColor = vec4(uCol * a, a);',
    '  #include <tonemapping_fragment>',
    '  #include <encodings_fragment>',

/* 384 segments, not 192: seen ~1 degree off edge-on the whole annulus is
   about a pixel tall, so a coarse tessellation reads as a dotted zigzag
   rather than a hairline (worst under verify.py, which runs with
   antialias off because navigator.webdriver sets FAST). */
var ringMesh = new THREE.Mesh(new THREE.RingGeometry(1.30, 2.12, 384, 1), ringMat);
ringMesh.renderOrder = -7;
ringMesh.frustumCulled = false;
skyScene.add(ringMesh);

/* ---- layer 3: the sun -------------------------------------------------
   A hard 0.53-degree disc plus the glare sprite that was already in
   20-stage.js (reused, not duplicated: net zero draw calls for the glare).
   Both depth-test, so the giant occludes them geometrically during an
   eclipse without any separate visibility rule. */
var sunDiscMat = new THREE.MeshBasicMaterial({ color: SKYC_SUN_CORE, fog: false, depthWrite: false });
var sunDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 40), sunDiscMat);
sunDisc.renderOrder = -4;
sunDisc.frustumCulled = false;
skyScene.add(sunDisc);

/* the existing sprites move across: sun glare, and the two small moons that
   were already in this world's sky. Depth-tested now, at a radius beyond the

[sunSprite, moonSprite, moon2].forEach(function(s){

sunSprite.renderOrder  = -3;
moonSprite.renderOrder = -5;
moon2.renderOrder      = -5;

/* ---------------------------------------------------------------- state
   One object, recomputed once per frame, read by 82-daynight.js (lights,
   fog, night-light gating) and 83-weather.js (fog base). */
var SKY_STATE = {
  hour: 10, dayOfYear: 80,
  sunDir: new THREE.Vector3(0,1,0), giantDir: new THREE.Vector3(0,1,0),
  sunAlt: 0, sunAz: 0, sepDeg: 90,
  sunUp: 1, ecl: 0, lit: 0, dayK: 1, sunK: 1,
  keyDir: new THREE.Vector3(0,1,0), keyCol: new THREE.Color(0xffffff), keyI: 1,
  hemiSky: new THREE.Color(0xffffff), hemiGround: new THREE.Color(SKYC_SOIL),
  fogScale: 1, shadowSoft: 0, duskK: 0
};

var _skKey = new THREE.Vector3(), _skQ = new THREE.Quaternion(), _skQ2 = new THREE.Quaternion();
var _skWarm = new THREE.Color(PAL.sunColor), _skShine = new THREE.Color(SKYC_SHINE);
var _skLow = new THREE.Color(SKYC_SUN_LOW), _skSunC = new THREE.Color(SKYC_SUN_CORE);
var _skEclRim = new THREE.Color(SKYC_ECL_RIM), _skGlare = new THREE.Color(SKYC_SUN_GLARE);
/* a totalised eclipse keeps this fraction of daylight in the mood (fog,
   hemisphere, water, night-light gate) and this much key light from the
   giant's refracted rim — deep twilight, never black. */
var SKY_ECL_FLOOR = 0.15, SKY_ECL_KEY = 0.34, SKY_SHINE_KEY = 0.18;
/* strength of the giant's own atmospheric extinction at 2.0 atm; scaled by
   pk*pk so a plateau city (0.8 atm) gets none at all and a lowland city gets
   a visible but gentle wash on the lower limb. */
var SKY_GIANT_HAZE_K = 1.7;
var _skZenD = new THREE.Color(SKYC_ZEN_DEEP), _skZenH = new THREE.Color(SKYC_ZEN_HAZY);
var _skHorD = new THREE.Color(SKYC_HOR_DEEP), _skHorH = new THREE.Color(SKYC_HOR_HAZY);
var _skNZen = new THREE.Color(SKYC_NIGHT_ZEN), _skNHor = new THREE.Color(SKYC_NIGHT_HOR);
var _skTwi  = new THREE.Color(SKYC_TWILIGHT),  _skSet  = new THREE.Color(SKYC_SUNSET);
var _skA = new THREE.Color(), _skB = new THREE.Color();

/* Where the giant hangs, from the city's latitude and its longitude offset
   from the sub-planet meridian. The sub-planet point sits on the moon's
   equator (the moon orbits in the giant's equatorial/ring plane), so this is
   the ordinary horizontal-coordinate transform for a body at declination 0
   with hour angle H = -subPlanetLonDeg:
       sin(alt) = cos(lat) * cos(H)
       az       = atan2(-sin H, -sin(lat) * cos H)
   At lat -40: offset 0 -> 50.00 deg due north; offset 57 east -> 24.66 deg
   at azimuth 67.34 (north-east); offset 57 west -> 24.66 at 292.66. */
function skyGiantPos(){
  var H = -SKY.subPlanetLonDeg*SKY_D, phi = SKY.latitude*SKY_D;
  var alt = Math.asin(Math.max(-1, Math.min(1, Math.cos(phi)*Math.cos(H))))/SKY_D;
  var az  = ((Math.atan2(-Math.sin(H), -Math.sin(phi)*Math.cos(H))/SKY_D)%360+360)%360;
  return { alt: (SKY.giantAltOverride == null ? alt : SKY.giantAltOverride),
           az : (SKY.giantAzOverride  == null ? az  : SKY.giantAzOverride) };
}

function skyGiantGeometry(){
  altAzToVec(-SKY.latitude, 180, SKY_POLE);       /* the pole follows the latitude parameter */
  var gp = skyGiantPos();
  SKY.giantAlt = gp.alt; SKY.giantAz = gp.az;     /* published for 80-camera.js and the panel */
  altAzToVec(SKY.giantAlt, SKY.giantAz, GIANT_DIR);
  /* "up" projected into the plane of the sky at the giant, then rotated by
     the tilt inside that plane — see the comment at giantMesh above. */
  _skyTmpA.set(0,1,0).addScaledVector(GIANT_DIR, -GIANT_DIR.y).normalize();
  _skyTmpB.copy(GIANT_DIR).cross(_skyTmpA).normalize();
  GIANT_AXIS.copy(_skyTmpA).multiplyScalar(Math.cos(SKY.tiltDeg*SKY_D))
            .addScaledVector(_skyTmpB, Math.sin(SKY.tiltDeg*SKY_D));
  /* open the rings by a fraction of a degree so they are a hairline and not
     a degenerate zero-width sliver */
  GIANT_AXIS.addScaledVector(GIANT_DIR, Math.tan(SKY_RING_OPEN_DEG*SKY_D)).normalize();
  GIANT_E1.copy(GIANT_DIR).addScaledVector(GIANT_AXIS, -GIANT_DIR.dot(GIANT_AXIS)).normalize();
  GIANT_E2.copy(GIANT_AXIS).cross(GIANT_E1).normalize();

  var rad = SKY_R_GIANT * Math.tan(SKY.giantDiaDeg*0.5*SKY_D);
  giantMesh.position.copy(GIANT_DIR).multiplyScalar(SKY_R_GIANT);
  giantMesh.scale.setScalar(rad);
  ringMesh.position.copy(giantMesh.position);
  ringMesh.scale.setScalar(rad);
  _skQ.setFromUnitVectors(_skyTmpA.set(0,0,1), GIANT_AXIS);
  ringMesh.quaternion.copy(_skQ);
  ringMat.uniforms.uCentre.value.copy(ringMesh.position);
  ringMat.uniforms.uInner.value = 1.30*rad;
  ringMat.uniforms.uOuter.value = 2.12*rad;

  giantMat.uniforms.uAxis.value.copy(GIANT_AXIS);
  giantMat.uniforms.uE1.value.copy(GIANT_E1);
  giantMat.uniforms.uE2.value.copy(GIANT_E2);
  giantMat.uniforms.uShadR.value = Math.asin(Math.min(0.9, 0.65/(SKY.giantDiaDeg*0.5)));
  skyStarMat.uniforms.uGiantDir.value.copy(GIANT_DIR);
  skyStarMat.uniforms.uWashCos.value = Math.cos((SKY.giantDiaDeg*0.5 + 20)*SKY_D);
}
skyGiantGeometry();

var SKY_GIANT_KEY = '';
function updateSky(){
  var S = SKY_STATE;
  /* the giant only needs rebuilding when a parameter actually moves */
  var gk = SKY.subPlanetLonDeg+'|'+SKY.giantAzOverride+'|'+SKY.giantAltOverride+'|'+
           SKY.giantDiaDeg+'|'+SKY.tiltDeg+'|'+SKY.latitude;
  if(gk !== SKY_GIANT_KEY){ SKY_GIANT_KEY = gk; skyGiantGeometry(); }

  var hour = S.hour = skyHour(), doy = S.dayOfYear = skyDayOfYear();
  skySunDir(hour, doy, S.sunDir);
  S.giantDir.copy(GIANT_DIR);
  S.sunAlt = Math.asin(Math.max(-1,Math.min(1,S.sunDir.y)))/SKY_D;
  S.sunAz  = ((Math.atan2(S.sunDir.x, -S.sunDir.z)/SKY_D)%360+360)%360;

  /* --- eclipse: soft over the sun's own 0.53 deg width at the limb ----- */
  var half = SKY.giantDiaDeg*0.5;
  S.sepDeg = S.sunDir.angleTo(GIANT_DIR)/SKY_D;
  var ecl = 1 - skySmooth(half - SKY.sunDiaDeg, half + SKY.sunDiaDeg, S.sepDeg);
  if(SKY.forceEclipse) ecl = 1;
  S.ecl = ecl;

  /* --- phase --------------------------------------------------------- */
  S.lit   = (1 - S.sunDir.dot(GIANT_DIR))*0.5;
  S.sunUp = skySmooth(Math.sin(-6*SKY_D), Math.sin(8*SKY_D), S.sunDir.y);
  S.sunK  = S.sunUp*(1 - ecl);                /* direct sunlight only */
  /* dayK is what everything downstream reads as "how lit is the world".
     An eclipse keeps a floor of it, because the brief is explicit that total
     darkness never happens on this side of the moon: the 30-degree ring of
     refracted sunlight round the giant, plus the sky scattered in from
     beyond it, is a real light source. */
  S.dayK  = S.sunUp*(1 - (1 - SKY_ECL_FLOOR)*ecl);

  /* --- stars --------------------------------------------------------- */
  starGroup.setRotationFromAxisAngle(SKY_POLE, 2*Math.PI*hour/SKY.dayLengthH);
  /* stars come out at night, and near the ZENITH ONLY during an eclipse */
  skyStarMat.uniforms.uOpacity.value = Math.max(0, 1 - S.sunUp)*0.95 + 0.55*ecl*S.sunUp;
  skyStarMat.uniforms.uZenK.value = ecl*S.sunUp;

  /* --- the giant ----------------------------------------------------- */
  giantMat.uniforms.uSunDir.value.copy(S.sunDir);
  giantMat.uniforms.uSpin.value = (SKY_T/3600)/SKY.giantSpinH * Math.PI*2;
  /* The rim is the eclipse's main feature, but it is NOT only an eclipse
     feature: a new giant is a dark disc with a thin bright edge all round it,
     because the sun is behind it whether or not it is exactly behind it. So
     the rim is driven by the PHASE as well as by the separation, and the
     phase term is the weaker of the two. */
  giantMat.uniforms.uRim.value = Math.max(1 - skySmooth(0, half, S.sepDeg),
                                          0.45*Math.pow(1 - S.lit, 5));
  /* the moon's own shadow crosses the full disc when the sun is opposite it */
  _skyTmpA.copy(S.sunDir).negate();
  giantMat.uniforms.uMoonSh.value = 1 - skySmooth(0, half, _skyTmpA.angleTo(GIANT_DIR)/SKY_D);
  /* ring shadow drifts north and south with the season */
  var season = Math.sin(2*Math.PI*(doy-80)/SKY.yearLengthD);
  giantMat.uniforms.uRingLat.value = -0.42*season;
  giantMat.uniforms.uRingSh.value  = SKY.showRings ? Math.abs(season)*0.9 + 0.1 : 0;
  ringMesh.visible = SKY.showRings;
  ringMat.uniforms.uOpacity.value = 0.88;

  /* --- the sun ------------------------------------------------------- */
  var sunR = SKY_R_SUN*Math.tan(SKY.sunDiaDeg*0.5*SKY_D);
  sunDisc.position.copy(S.sunDir).multiplyScalar(SKY_R_SUN);
  sunDisc.scale.setScalar(sunR);
  sunDisc.lookAt(0,0,0);
  var lowK = 1 - skySmooth(0, Math.sin(11*SKY_D), Math.max(0,S.sunDir.y));
  _skA.copy(_skSunC).lerp(_skLow, lowK*0.85);
  sunDiscMat.color.copy(_skA);
  sunDisc.visible = S.sunDir.y > -0.08;
  sunSprite.userData.dir.copy(S.sunDir);
  sunSprite.scale.setScalar(SKY_R_SUN*Math.tan(2.6*SKY_D)*2*(1 + 0.45*lowK));
  sunSprite.material.color.copy(_skGlare).lerp(_skLow, lowK*0.9);
  sunSprite.material.opacity = S.sunUp*(1 - ecl)*(0.55 + 0.45*lowK);
  sunSprite.visible = sunSprite.material.opacity > 0.01;

  /* --- dome colour: pressure, sun altitude, eclipse -------------------- */
  var p = SKY.pressureAtm, pk = Math.max(0, Math.min(1, (p - 0.8)/1.2));
  _skA.copy(_skZenD).lerp(_skZenH, pk);        /* daytime zenith */
  _skB.copy(_skHorD).lerp(_skHorH, pk);        /* daytime horizon */
  var duskK = 1 - skySmooth(Math.sin(-3*SKY_D), Math.sin(16*SKY_D), S.sunDir.y);
  S.duskK = duskK*S.sunUp;
  /* a low sun reddens the horizon, and thick air holds the afterglow longer */
  _skB.lerp(_skSet, duskK*(0.35 + 0.42*pk));
  _skA.lerp(_skNZen, Math.max(0, 1 - S.sunUp));
  /* (Mav's Refuge) the HORIZON goes to night later than the zenith does: at
     1.9 atm the afterglow hangs on until the sun is ~13 deg down */
  var twiK = skySmooth(Math.sin(-13*SKY_D), Math.sin(-1*SKY_D), S.sunDir.y);
  _skB.lerp(_skNHor, Math.max(0, 1 - Math.max(S.sunUp, 0.80*twiK)));
  /* an eclipse is deep TWILIGHT, not night: the rim and the sky beyond the
     giant still light it */
  _skA.lerp(_skTwi, ecl*0.92); _skB.lerp(_skTwi, ecl*0.78);
  SKY_DOME_U.uSkyZen.value.copy(_skA).convertSRGBToLinear();
  SKY_DOME_U.uSkyHor.value.copy(_skB).convertSRGBToLinear();
  SKY_DOME_U.uSkyK.value = SKY.skyModelK;
  SKY_DOME_U.uHazeCol.value.copy(_skB).convertSRGBToLinear();
  SKY_DOME_U.uHazeH.value = 0.030 + 0.115*pk;          /* thicker band at high pressure */
  /* x0.62 against Voth: this build's bake already carries its own haze bank, and
     the canopy silhouette + far volcano have to survive the band */
  SKY_DOME_U.uHazeA.value = 0.62*(0.22 + 0.46*pk)*(0.35 + 0.65*S.dayK);
  SKY_DOME_U.uSunDirS.value.copy(S.sunDir);
  _skA.copy(_skSunC).lerp(_skSet, duskK);
  SKY_DOME_U.uSunGlowC.value.copy(_skA).convertSRGBToLinear();
  SKY_DOME_U.uSunGlowK.value = (0.22 + 0.30*duskK)*Math.max(S.sunUp, 0.55*twiK)*(1 - ecl);
  SKY_DOME_U.uSunGlowP.value = 42 - 30*duskK - 8*pk;   /* a longer afterglow in thick air */
  /* the giant's own extinction, off the same pressure the dome's haze uses.
     uHazeCol is already the same Color object as uSkyHor, so it is current. */
  giantMat.uniforms.uHazeH.value = SKY_DOME_U.uHazeH.value;
  giantMat.uniforms.uHazeK.value = SKY_GIANT_HAZE_K*pk*pk;

  /* --- the key light -------------------------------------------------
     ONE directional light, not two. The brief asks for a second
     DirectionalLight along giantDir for planetshine, but a second
     shadow-casting light means a whole second shadow-map pass, and a
     non-shadow-casting one cannot deliver the brief's own acceptance test
     ("city lit softly from the north with SOUTH-POINTING SHADOWS"). So the
     city's existing shadow-casting `sun` is slerped between the two
     directions, weighted by their relative strength: by construction
     planetshine only matters where sunlight does not, so the two are never
     both strong and the swing happens entirely in the dim. During an
     eclipse the two directions are within a few degrees of each other
     anyway, so the handover there is a no-op.

     NOTE ON THE BRIEF'S OWN PLANETSHINE FORMULA. It reads
     `0.08 * illuminatedFraction * (1 - sunUp)`, and adds "it also survives
     an eclipse, dimmed, and is the reason the eclipse is dusk rather than
     black". Those two cannot both hold: during an eclipse the giant is
     between the observer and the sun, so it is NEW by construction and
     illuminatedFraction is ~0.001 (measured). Driving eclipse light from
     planetshine gives a total blackout at noon, which the brief itself
     forbids. What actually lights an eclipse is the ring of sunlight
     refracted through the giant's limb — the same thing the brief makes the
     giant's headline visual. So the eclipse term is its own, independent of
     the phase, warm (refracted, not reflected), and still coming from the
     giant's direction, so the shadows stay northern. */
  var sunI   = S.sunK;
  /* (2026-10-01) planetshine 0.44 -> 0.18 of full sun-key units: a full giant 60 moons
     across is a strong night light, but still night light — under a fifth of the
     day key, cool, after the thick air has had its share. */
  var shineI = SKY_SHINE_KEY*S.lit*(1 - S.sunUp) + SKY_ECL_KEY*ecl;
  var w = shineI/(sunI + shineI + 1e-6);
  _skKey.copy(S.sunDir);
  S.keyDir.copy(_skKey);
  if(w > 0.0005){
    if(_skKey.angleTo(GIANT_DIR) > 1e-4){
      _skQ.setFromUnitVectors(_skKey, GIANT_DIR);     /* the full sun -> giant rotation */
      _skQ2.set(0,0,0,1).slerp(_skQ, w);              /* take the w-th part of it */
      S.keyDir.copy(_skKey).applyQuaternion(_skQ2).normalize();
    }else S.keyDir.copy(GIANT_DIR);
  }
  S.keyCol.copy(_skWarm).lerp(_skLow, lowK*0.55*(1-w)).lerp(_skShine, w).lerp(_skEclRim, ecl*0.85);
  S.keyI = sunI + shineI;

  /* --- sky ambient ---------------------------------------------------- */
  S.hemiSky.copy(SKY_DOME_U.uSkyZen.value).convertLinearToSRGB();
  S.hemiGround.setHex(SKYC_SOIL);

  /* --- pressure -> fog and shadow contrast ----------------------------
     r128's PCFSoftShadowMap ignores shadow.radius, so "hard vs soft
     shadows" is delivered the way the atmosphere actually delivers it:
     the ratio of the directional key to the scattered sky fill. Thin air
     = a hard, contrasty key; thick air = a milky, low-contrast one. */
  S.fogScale    = Math.pow(p/1.6, 1.15);
  S.shadowSoft  = pk;
}

/* The city's fog density with the local air pressure folded in — the brief's
   "scene fog density proportional to pressure". 83-weather.js multiplies its
   storm/ash factors on top of THIS rather than PAL.fogDensity, so a storm in
   an abyss city is thicker than a storm on a plateau. At the default 1.6 atm
   this returns PAL.fogDensity exactly, so nothing already tuned moves. */
function skyFogBase(){ return PAL.fogDensity * SKY_STATE.fogScale; }

/* ---------------------------------------------------------------- render
   Called from 80-camera.js's frame(), before the city pass. */
function skyRender(){
  skyCam.quaternion.copy(camera.quaternion);
  if(skyCam.fov !== camera.fov || skyCam.aspect !== camera.aspect){
    skyCam.fov = camera.fov; skyCam.aspect = camera.aspect; skyCam.updateProjectionMatrix();
  }
  renderer.render(skyScene, skyCam);
}

  domeUniforms: SKY_DOME_U,

     terminator means a position angle of +/-90. Worth having as a number
     rather than an eyeball: the brief's "vertical terminator at the half
     phases" is a property of WHERE the giant sits, not of the phase code,
     and it stops being true once the giant leaves the meridian. */

/* ------------------------------------------------- the sign check, run once
   A mirrored azimuth is silent: every screenshot still shows a sun in the
   sky, just on the wrong side, and every later test then measures garbage.
   So it is asserted at load against the brief's own table instead of trusted.
   Failures print into the page's error panel, which verify.py --assert reads. */
(function skyCheckSigns(){
  function near(a, b, tol){ return Math.abs(a-b) <= tol; }

  var cases = [
    [12,  80,  50.00,   0, 'noon day 80: due north at 50'],
    [ 6,  80,   0.00,  90, '06:00 day 80: due EAST (the case the noon test cannot catch)'],
    /* the brief author's own second acceptance point, added after they found
       the same mirrored-azimuth bug independently: 08:00 on day 80 must put
       the sun about 22 degrees up in the NORTH-EAST. Guarded here rather
       than left to coincide. */
    [ 8,  80,  22.52,  69.64, '08:00 day 80: ~22 deg up at ~70 deg, north-east'],
    [18,  80,   0.00, 270, '18:00 day 80: due west'],
    [12, 172,  27.00,   0, 'noon day 172: midwinter, 27 in the north'],
    [12, 355,  72.99,   0, 'noon day 355: midsummer, 73 in the north']
  ];
  cases.forEach(function(c){
    var r = skySunAltAz(c[0], c[1]);
    if(!near(r.alt, c[2], 0.05) || !near(((r.az - c[3] + 540)%360)-180, 0, 0.05))

  });

     south celestial pole must land exactly on the 12:00 sun. */
  var v6 = skySunDir(6, 80, new THREE.Vector3());

             v6.distanceTo(v12).toFixed(4) + ')');

     57-east city, and the original brief's own "a little east of the
     sub-planet meridian" case, which must still come out at azimuth 356.

     subPlanetLonDeg being flipped — the analogue, for the giant, of the

     [-2.57, 49.93, 356.01, "the brief's original 'a little east of the meridian'"],
     [0, 50.00, 0.00, 'on the sub-planet meridian -> due north at 90-|lat|']

/* ============================== 5. LAYOUT — GIRDER ==============================
   PLANNER-OWNED. Decides where everything is; builds no geometry.
   Girder is one ancient structure: four identical 30-storey open-floored
   towers on a perfect square, re-inhabited by the beast-riders at the bottom
   six and top five floors, ringed at the top by timber roost decks joined by
   rope bridges, standing in a palisaded terrace of farms.
   Outputs (read-only to every later fragment):
     SPECIES TREES FARTREES trunkR()         the (smaller) hypertrees round the clearing
     TOWERS[4]   T.floors[k], T.bays, T.stair, T.lift, T.deck
     SLOTS[]     dwelling lots inside the towers        HOUSES[] PLOTS[] STALLS[] HALL PALISADE GATES[]

reseed(300001);

var SLAB = 1.0;                                      /* the ancients' floor plates */

  { name:'Ironbark',    H:[215,270], rb:[15,18], crown0:0.50, crownR:[100,130] },
  { name:'Ghostwood',   H:[200,250], rb:[12,14], crown0:0.46, crownR:[90,115] },
  { name:'Prism gum',   H:[190,240], rb:[13,16], crown0:0.52, crownR:[110,140] },
  { name:'Gate baobab', H:[150,175], rb:[21,25], crown0:0.80, crownR:[70,90] }

  var yy = Math.max(0, y - T.y0), u = clamp(yy/T.H, 0, 1), r;

var COL_LINES = [-24+1.6, -8, 8, 24-1.6];                                 /* 4x4 cyclopean columns, 3.2 m square */

var TOWER_NAMES = ['North-west Tower','North-east Tower','South-east Tower','South-west Tower'];
[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(sg, i){
  var T = { id:i, name:TOWER_NAMES[i], x:sg[0]*TOWER_OFF, z:sg[1]*TOWER_OFF, sx:sg[0], sz:sg[1], half:TOWER_HALF, y0:SETTLE_Y,

/* ============================== NIGHT LIGHT VOLUME ==============================
   Voth bakes every lamp into a 2-D world-XZ light map with one height channel.
   That cannot work here: this city is STACKED — a deck, three galleries and a
   roost level share the same XZ. So the light field is a VOLUME: NLV_NS
   horizontal slabs of NLV_RES^2 texels packed into one atlas texture, sampled
   with two fetches and a lerp (manual trilinear). Every material in the
   build — kit, merged meshes, terrain, bark, foliage — calls applyNightGlow(),
   so lamp light pools on decks, climbs trunks and lights the leaves above.

   Channels: R = warm flames   G = window spill   B = cool (bioluminescent) lamps

var NL_WINDOWS = [];                  /* [x,y,z, nx,nz, w,h, hOn, hOff, allNight, cool] */

function shade(hex, f){

/* ============================== 12. STRUCTURE — GIRDER ==============================
   PLANNER-OWNED. The ancient ruin and the load-bearing timber the beast-riders

   see 55-arch.js, 58-overgrowth.js, 72-lights.js.                            */
reseed(500001);
var STRUCT = { planks:0, plates:0, columns:0, girders:0, stakes:0 };
function yawX(dx,dz){ return Math.atan2(-dz,dx); }          /* aim local +x along (dx,dz) */

function buildTower(T){

  }); });
  /* --- floor plates, bay by bay; the core bay is cut for the stair well --- */
  T.floors.forEach(function(F){
    var yb = F.y - SLAB;
    for(var bi=-1;bi<=1;bi++) for(var bj=-1;bj<=1;bj++){
      if(F.missing.indexOf(bi+','+bj) >= 0) continue;
      var pc = shade(conc, rr(-0.10,0.06));
      if(bi||bj){ BOX(T.x+bi*16, yb, T.z+bj*16, 16.02, SLAB, 16.02, 0, pc, 'concrete'); STRUCT.plates++; }
      else if(F.k < TOWER_N){
        BOX(T.x-6.2, yb, T.z, 3.6, SLAB, 16, 0, pc, 'concrete');                       /* west landing */
        BOX(T.x+1.8, yb, T.z-6.1, 12.4, SLAB, 3.8, 0, pc, 'concrete');                 /* north + south strips */
        BOX(T.x+1.8, yb, T.z+6.1, 12.4, SLAB, 3.8, 0, pc, 'concrete');

    }
    /* perimeter spandrel girders + the interior girder lines under the plate */
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(f){
      BOX(T.x+f[0]*(T.half-0.35), yb-0.9, T.z+f[1]*(T.half-0.35), f[0]?0.7:48, 1.5, f[0]?48:0.7, 0, shade(rustA, rr(-0.12,0.08)), 'rust'); STRUCT.girders++; });
    [-8,8].forEach(function(c){

      BOX(T.x, F.y+rise*1.5-0.35, T.z+2.6, 3.0, 0.5, L, [ pit, yawZ(1,0)+Math.PI, 0], shade(conc,0.05), 'concrete');

  }

    BEAM(fx, top+0.3, fz, fx+rr(-14,14), top+rr(2,7), fz+rr(-14,14), 0.7, 0.7, PAL.rustStain[fg%2], 'rust'); }

/* ------------------------------------------------------------------ roost decks */

  strip(-H,H,-H,-I); strip(-H,H,I,H);

    var lx=Lf.x-T.x, lz=Lf.z-T.z;

    BOX(T.x+f[0]*H, y-th-0.5, T.z+f[1]*H, f[0]?0.5:2*H, 0.9, f[0]?2*H:0.5, 0, TIMBERC[2], 'timber');
    for(var t=-H+4; t<=H-4; t+=8.5){
      var ex=f[0]?f[0]*(H-1.5):t, ez=f[1]?f[1]*(H-1.5):t, sx=f[0]?f[0]*T.half:clamp(t,-T.half,T.half), sz=f[1]?f[1]*T.half:clamp(t,-T.half,T.half);
      BEAM(T.x+sx, y-15, T.z+sz, T.x+ex, y-th, T.z+ez, 0.75, 0.75, TIMBERC[(Math.round(t)&3)], 'timber');
    }

    });

  });
  /* railings on the corner aprons and either side of each bridgehead */

/* ------------------------------------------------------------------ rope bridges */
function buildBridge(br){

      ROD(x0,y0+1.15,z0, x1,y1+1.15,z1, 0.05, ROPEC[0], 'rope');          /* hand rope */
      ROD(x0,y0+0.60,z0, x1,y1+0.60,z1, 0.03, ROPEC[0], 'rope');
      ROD(x1,y1-0.12,z1, x1,y1+1.15,z1, 0.025, ROPEC[1], 'rope');         /* suspender */

    });

  });

}


/* ------------------------------------------------------------------ lifts */
function buildLift(Lf){
  var ox=Lf.ox, px=0, pz=1, top=Lf.y1+7.5;

    BOX(Lf.x+ox*2.9, Lf.y1, Lf.z+sg*2.9, 0.45, 7.8, 0.45, 0, TIMBERC[0], 'timber');
    BEAM(Lf.x-ox*3.2, top, Lf.z+sg*2.9, Lf.x+ox*3.2, top, Lf.z+sg*2.9, 0.4, 0.4, TIMBERC[2], 'timber');

  });
  BEAM(Lf.x, top+0.2, Lf.z-3.2, Lf.x, top+0.2, Lf.z+3.2, 0.5, 0.5, TIMBERC[1], 'timber');
  CYL(Lf.x, top-0.8, Lf.z, 0.7, 0.5, 0, TIMBERC[3], 'timber');

  BEAM(C.x, C.y+1.6, C.z-5, C.x, C.y+1.6, C.z+5, 0.3, 0.3, TIMBERC[2], 'timber');
  ROD(C.x, C.y+2.0, C.z, Lf.x+ox*0.5, top-0.5, Lf.z, 0.06, ROPEC[0], 'rope');
  BOX(Lf.x, Lf.y0-0.25, Lf.z, 5, 0.3, 5, 0, PLANKC[1], 'plank');
  REGISTER({ name:Lf.tower.name, kind:'lift', label:'Beast-drawn lift', x:Lf.x, z:Lf.z, y:Lf.y0, h:top-Lf.y0, r:3.4 });

}

/* ------------------------------------------------------------------ palisade, wall-walk, watch posts, gates, roads */
function buildPalisade(){
  var R=PALISADE.R, n=Math.round(TAU*R/0.95), F=platFrame(0,0,0);
  for(var i=0;i<n;i++){

    if(gate) continue;
    var h=PALISADE.h+rr(-0.5,0.9), y=terrainH(x,z)-0.8, c=TIMBERC[i%4];
    push('cyl6','timber',[x,y,z,0.46,h+0.8,0.46,0,shade(c,rr(-0.15,0.1))]); CONE(x, y+h+0.8, z, 0.46, 1.1, 0, shade(c,-0.1), 'timber'); STRUCT.stakes++;
  }

function lifeHook(legPiv, armPiv){
  return function(sh){
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aPRO;\nattribute vec4 aAnim;\nattribute vec3 aGarb;\nattribute vec3 aSkin;\nattribute vec3 aHair;')
      .replace('#include <color_vertex>', 'vColor = color;\nif(aPRO.y < 0.5) vColor *= aGarb; else if(aPRO.y < 1.5) vColor *= aSkin; else if(aPRO.y < 2.5) vColor *= aHair;')
      .replace('#include <beginnormal_vertex>', [
        'vec3 objectNormal = vec3(normal);',
        'float lfPart = aPRO.x, lfAng = 0.0, lfPy = 0.0, lfAmp = max(aAnim.y, 0.0), lfBend = max(-aAnim.y, 0.0);',
        'bool lfLimb = lfPart > 0.5 && lfPart < 4.5;',
        'bool lfUpper = lfBend > 0.001 && ((lfPart < 0.5 && position.y > 0.9) || (lfPart > 2.5 && lfPart < 4.5));',
        'if(lfLimb){',
        '  float lfSw = sin(aAnim.x) * lfAmp;',
        '  if(lfPart < 2.5){ lfPy = ' + legPiv.toFixed(3) + '; lfAng = lfPart < 1.5 ? lfSw : -lfSw; }',
        '  else { lfPy = ' + armPiv.toFixed(3) + '; lfAng = (lfPart < 3.5 ? -lfSw : lfSw)*0.85 - aAnim.z; }',
        '  float lfC = cos(lfAng), lfS = sin(lfAng);',
        '  objectNormal = vec3(objectNormal.x, objectNormal.y*lfC - objectNormal.z*lfS, objectNormal.y*lfS + objectNormal.z*lfC);',
        '}',
        'if(lfUpper){ float lfCb = cos(lfBend), lfSb = sin(lfBend);',
        '  objectNormal = vec3(objectNormal.x, objectNormal.y*lfCb - objectNormal.z*lfSb, objectNormal.y*lfSb + objectNormal.z*lfCb); }'].join('\n'))
      .replace('#include <begin_vertex>', [
        'vec3 transformed = vec3(position);',
        'if(lfLimb){',
        '  float lfC2 = cos(lfAng), lfS2 = sin(lfAng); vec3 lfQ = transformed - vec3(0.0, lfPy, 0.0);',
        '  transformed = vec3(lfQ.x, lfPy + lfQ.y*lfC2 - lfQ.z*lfS2, lfQ.y*lfS2 + lfQ.z*lfC2);',
        '}',
        'if(lfUpper){ float lfCb2 = cos(lfBend), lfSb2 = sin(lfBend); vec3 lfB = transformed - vec3(0.0, 0.9, 0.0);',
        '  transformed = vec3(lfB.x, 0.9 + lfB.y*lfCb2 - lfB.z*lfSb2, lfB.y*lfSb2 + lfB.z*lfCb2); }',
        'if(lfPart > 4.5) transformed.y = aAnim.x;',
        'if(aPRO.z > 0.5){ float lfW = floor(aAnim.w + 0.5); bool lfShow = aPRO.z < 1.5 ? mod(lfW, 2.0) > 0.5 : lfW > 1.5;',
        '  if(!lfShow) transformed = vec3(0.0, 0.6, 0.0); }'].join('\n'));
  };
}

  var p = ptrs[e.pointerId]; if(!p) return;

function panStep(dt){
  var sp = (keys['shift'] ? 420 : 120) * dt * (0.25 + ctl.radius/500);
  var f=0,s=0,u=0;
  if(keys['w']) f+=1; if(keys['s']) f-=1; if(keys['a']) s-=1; if(keys['d']) s+=1; if(keys['q']) u-=1; if(keys['e']) u+=1;

  ray.setFromCamera(ndc, camera);
  var targets = scene.children.filter(function(o){ return (o.isMesh || o.isInstancedMesh) && o.visible && !o.userData.noPick; });
  return ray.intersectObjects(targets, false)[0] || null;
}

  polyMarkers.forEach(function(m){ scene.remove(m); }); polyMarkers=[];
  polyPts.forEach(function(p){ var m=new THREE.Mesh(polyMarkGeo, polyMarkMat); m.renderOrder=999; m.userData.noPick=true;
    m.position.set(p[0],p[1]+0.3,p[2]); var k=clamp(camera.position.distanceTo(m.position)/90,0.6,8); m.scale.setScalar(k); scene.add(m); polyMarkers.push(m); });

function frame(){
  requestAnimationFrame(frame);

  var hour = skyHour(), nk = DAYNIGHT_NIGHT_K;
  CLOTH_TIME.value += dt;

  waterUni.uSun.value.copy(SKY_STATE.keyDir); waterUni.uFogCol.value.copy(scene.fog.color); waterUni.uFogDen.value = scene.fog.density;
  waterUni.uDay.value = clamp(SKY_STATE.dayK,0.12,1);
  updateGlow(dt, hour, nk);
  for(var i=0;i<TICKS.length;i++){
    try{ TICKS[i](dt, hour, nk); }catch(err){ if(!tickErr[i]){ tickErr[i]=1; ERR('tick '+i+': '+(err&&err.stack||err)); } }

   PLANNER-OWNED. Bakes the light volume (45-kit.js) once every fragment has
   registered its lamps and windows, then owns the two things that visibly
   switch on at dusk:
     - halos: one additive Points cloud over every registered lamp
     - panes: one InstancedMesh of window panes, lit on a STAGGERED schedule
       (first lamps ~17:10, most lit by 21:00, going out from ~20:50 so that
       nearly all are dark by midnight; 1 in 20 burn till dawn)
   Reads DAYNIGHT_NIGHT_K (0 day .. 1 night) from the day/night fragment.   */

var haloTex = (function(){
  var S=64, c=document.createElement('canvas'); c.width=c.height=S; var g=c.getContext('2d');
  var gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.18,'rgba(255,255,255,0.55)');
  gr.addColorStop(0.5,'rgba(255,255,255,0.13)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,S,S); return new THREE.CanvasTexture(c);
})();

  uniforms:{ uTex:{value:haloTex}, uK:{value:0}, uTime:{value:0}, uScale:{value:innerHeight*0.5} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:[
    'attribute vec3 aCol; attribute float aSize; uniform float uK,uTime,uScale; varying vec3 vCol; varying float vA;',
    'void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0);',
    '  float ph=fract(sin(dot(position.xz,vec2(12.9898,78.233)))*43758.5453)*6.2832;',
    '  float fl=0.86+0.14*sin(uTime*7.0+ph)*sin(uTime*3.1+ph*1.7);',
    '  float d=-mv.z; vCol=aCol; vA=uK*fl*exp(-d*0.00035);',
    '  gl_PointSize=clamp(aSize*fl*uScale/d, 2.0, 180.0); gl_Position=projectionMatrix*mv; }'].join('\n'),

});

/* ============================== 27. DAY / NIGHT ==============================
   Ported from Voth's 82-daynight.js, lights-and-fog part only. The clock and
   all the astronomy live in 21-sky.js (SKY_STATE, recomputed by updateSky());
   this fragment turns that state into the city's key light colour/intensity,
   hemisphere + ambient fill, fog colour/density and DAYNIGHT_NIGHT_K.
   NOT here, on purpose: lamps, windows and the night light volume (45-kit.js,
   72-lights.js, 81-glow.js own those), the #dnSlider UI and the key light's
   POSITION (80-camera.js), and the river shader (80-camera.js feeds it). */
reseed(820001);

function dayNightHour(){ return skyHour(); }

/* the two small moons keep a simple arc of their own, opposite the sun */
var DN_MOON_AZ0 = Math.atan2(MOONDIR.x, MOONDIR.z);
var DN_MOON_ELEV_MAX = Math.asin(MOONDIR.y) * 1.15;
var _dnMoon = new THREE.Vector3();
function dnBodyDir(hour, az0, elevMax, out){
  var phase = (hour/24)*Math.PI*2 - Math.PI/2;
  var elev = Math.sin(phase) * elevMax;
  var az = az0 + (hour-12)/24*Math.PI*2;
  return out.set(Math.cos(elev)*Math.sin(az), Math.sin(elev), Math.cos(elev)*Math.cos(az)).normalize();
}

var DN_SUN_I = PAL.sunIntensity, DN_HEMI_I = PAL.hemiIntensity, DN_AMB_I = PAL.ambientIntensity;
/* night floors. (2026-10-01) These were 0.30 / 0.22 with a daytime-coloured
   sky fill: with the planetshine on top and the 1.9 atm multiplier, the night
   ambient came out ABOVE the day's, and 21:00 under a full giant read as an
   overcast afternoon. A night is now dark: a little cool fill so silhouettes
   survive, the giant's directional key (21-sky) for shape and shadows, and the
   lamps, fires and lanterns as the lights you actually see by. */
var DN_HEMI_NIGHT_I = 0.07, DN_AMB_NIGHT_I = 0.035;
/* extra fill under a well-lit giant (planetshine scattered by the thick air) */
var DN_SHINE_HEMI = 0.07, DN_SHINE_AMB = 0.03;
/* an eclipse is deep twilight, not night: the refracted rim and the sky beyond
   the giant keep a fill of their own (this used to ride on the night floors) */
var DN_ECL_HEMI = 0.16, DN_ECL_AMB = 0.10;
/* how much a full giant softens the city's own night lighting (lamps stay the main light) */
var DN_SHINE_NL_CUT = 0.08;
/* the night fill's colour: moonlit blue-grey above, a dark warm soil below */
var DN_HEMI_SKY_NIGHT = new THREE.Color(0x5d7194), DN_HEMI_GND_NIGHT = new THREE.Color(0x2a2220);
var DN_SKY_SAMPLE = 0.45, DN_SOIL_SAMPLE = 0.40;

var DN_HAZE_DAY = new THREE.Color(PAL.haze), DN_HAZE_NIGHT = new THREE.Color(PAL.hazeNight);
var DN_SKY_TINT_DAY = new THREE.Color(0xffffff), DN_SKY_TINT_NIGHT = new THREE.Color(0x46566c);
var _dnFog = new THREE.Color(), _dnSky = new THREE.Color(), _dnDusk = new THREE.Color();

var DAYNIGHT_NIGHT_K = 0;
function updateDayNight(){
  var S = SKY_STATE;
  dnBodyDir((S.hour+12)%24, DN_MOON_AZ0, DN_MOON_ELEV_MAX, _dnMoon);
  SUNDIR.copy(S.sunDir); MOONDIR.copy(_dnMoon);
  moonSprite.userData.dir.copy(_dnMoon);

  /* EFFECTIVE daylight (sun up AND not eclipsed): a noon eclipse reads as
     dusk everywhere at once because everything below hangs off this. */
  var daylight = S.dayK;
  var moonUp = smooth(-0.05, 0.10, _dnMoon.y);
  var shine = S.lit*(1 - daylight);                    /* planetshine strength 0..1 */

  /* one key light: sun by day, the giant by night and through an eclipse */
  sun.color.copy(S.keyCol);
  sun.intensity = DN_SUN_I * S.keyI;
  var eclK = S.ecl*S.sunUp;
  hemiLight.intensity = DN_HEMI_NIGHT_I + DN_SHINE_HEMI*shine + DN_ECL_HEMI*eclK + (DN_HEMI_I-DN_HEMI_NIGHT_I)*daylight;
  ambLight.intensity  = DN_AMB_NIGHT_I  + DN_SHINE_AMB*shine  + DN_ECL_AMB*eclK  + (DN_AMB_I-DN_AMB_NIGHT_I)*daylight + 0.01*moonUp;
  /* thick air scatters: a milky low-contrast key at ~2 atm, a hard one at 0.8 */
  sun.intensity       *= 1.16 - 0.30*S.shadowSoft;
  hemiLight.intensity *= 0.80 + 0.42*S.shadowSoft;
  ambLight.intensity  *= 0.80 + 0.42*S.shadowSoft;
  /* the hemisphere's sky half is sampled from the dome's zenith, its ground
     half leans to Krator's red soil — blended with the tuned PAL values */
  /* (sampled less at night: the night zenith is near-black and would cancel the floors) */
  hemiLight.color.setHex(PAL.hemiSky).lerp(S.hemiSky, DN_SKY_SAMPLE*(0.25 + 0.75*daylight));
  hemiLight.groundColor.setHex(PAL.hemiGround).lerp(S.hemiGround, DN_SOIL_SAMPLE);
  /* ...and at night the fill goes cool and dark, not a dimmed copy of the day's green-white */
  hemiLight.color.lerp(DN_HEMI_SKY_NIGHT, 1 - daylight);
  hemiLight.groundColor.lerp(DN_HEMI_GND_NIGHT, 1 - daylight);

  /* fog: jungle haze by day, a warm cast while the sun is low, blue-black at night */
  _dnFog.copy(DN_HAZE_NIGHT).lerp(DN_HAZE_DAY, daylight);
  _dnDusk.setHex(PAL.sky.sunset);
  _dnFog.lerp(_dnDusk, 0.22*S.duskK*daylight);
  scene.fog.color.copy(_dnFog);
  skyScene.background.copy(_dnFog);
  SKY_DOME_U.uBelowCol.value.copy(_dnFog).convertSRGBToLinear();
  scene.fog.density = skyFogBase();                    /* PAL.fogDensity x pressure */
  _dnSky.copy(DN_SKY_TINT_NIGHT).lerp(DN_SKY_TINT_DAY, daylight);
