/* ======== Role builders: tapestry, wall art, statues ======== */
  /* tapestry: a rod, a field, borders and the culture's device in the middle. Wall anchor. */
  B.tapestry = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, v = o.variant || 0;
    const kind = S.tapestry || 'medallion', zb = -D / 2;
    const field = P.cloth[v % P.cloth.length], edge = P.cloth[(v + 1) % P.cloth.length], band = P.cloth[(v + 2) % P.cloth.length];
    const ink = P.acc, inkF = P.af;
    F.rod(-W / 2, H - 0.04, zb + 0.05, W / 2, H - 0.04, zb + 0.05, 0.02, P.woodD, P.wf);
    for (const s of [-1, 1]) K.finial(F, P, S, s * (W / 2 - 0.03), H - 0.08, zb + 0.05, 0.03);
    const top = H - 0.08, bot = 0.12, cy = (top + bot) / 2, fh = top - bot;
    F.box(0, bot, zb + 0.02, W - 0.1, fh, 0.02, 0, field, P.cf);
    F.box(0, bot, zb + 0.032, W - 0.1, 0.1, 0.004, 0, band, P.cf);
    F.box(0, top - 0.1, zb + 0.032, W - 0.1, 0.1, 0.004, 0, band, P.cf);
    for (const s of [-1, 1]) F.box(s * (W / 2 - 0.1), bot, zb + 0.032, 0.1, fh, 0.004, 0, edge, P.cf);
    const zf = zb + 0.038, R = Math.min(W - 0.4, fh - 0.4) / 2;
    if (kind === 'stripes') {
      for (let i = 0; i < Math.floor(fh / 0.24); i++) F.box(0, bot + 0.12 + i * 0.24, zf, W - 0.3, 0.1, 0.004, 0, i % 2 ? band : ink, i % 2 ? P.cf : inkF);
    } else if (kind === 'chevrons') {
      for (let i = 0; i < Math.floor(fh / 0.3); i++) K.motifAt(F, P, S, 0, bot + 0.25 + i * 0.3, zf, Math.min(W - 0.4, 0.5), 0, 'chevron');
    } else if (kind === 'grid') {
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) F.box(-R * 0.6 + i * R * 0.6, cy - R * 0.6 + j * R * 0.6 - 0.05, zf, R * 0.3, R * 0.3, 0.004, 0, (i + j) % 2 ? ink : band, (i + j) % 2 ? inkF : P.cf);
    } else if (kind === 'sun') {
      K.disc(F, 0, cy, zf, zf + 0.004, R * 0.42, ink, inkF);
      for (let i = 0; i < 12; i++) { const a = i * F.TAU / 12; F.beam(Math.cos(a) * R * 0.5, cy + Math.sin(a) * R * 0.5, zf, Math.cos(a) * R * 0.9, cy + Math.sin(a) * R * 0.9, zf, 0.05, 0.004, ink, inkF); }
    } else if (kind === 'waves') {
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) K.motifAt(F, P, S, -R * 0.6 + j * R * 0.6, cy - R * 0.5 + i * R * 0.5, zf, R * 0.5, 0, 'wave');
    } else if (kind === 'diamond') {
      F.beam(-R, cy, zf, 0, cy + R, zf, 0.06, 0.004, ink, inkF); F.beam(0, cy + R, zf, R, cy, zf, 0.06, 0.004, ink, inkF);
      F.beam(R, cy, zf, 0, cy - R, zf, 0.06, 0.004, ink, inkF); F.beam(0, cy - R, zf, -R, cy, zf, 0.06, 0.004, ink, inkF);
      F.box(0, cy - R * 0.25, zf, R * 0.5, R * 0.5, 0.004, 0, band, P.cf);
    } else if (kind === 'wheel') {
      K.disc(F, 0, cy, zf, zf + 0.004, R * 0.95, ink, inkF);
      K.disc(F, 0, cy, zf + 0.004, zf + 0.008, R * 0.8, field, P.cf);
      for (let i = 0; i < 8; i++) { const a = i * F.TAU / 8; F.beam(0, cy, zf + 0.008, Math.cos(a) * R * 0.85, cy + Math.sin(a) * R * 0.85, zf + 0.008, 0.04, 0.004, ink, inkF); }
      K.disc(F, 0, cy, zf + 0.012, zf + 0.016, R * 0.18, ink, inkF);
    } else if (kind === 'claw') {
      for (let i = -1; i <= 1; i++) F.beam(i * R * 0.45 - R * 0.2, cy + R * 0.8, zf, i * R * 0.45 + R * 0.2, cy - R * 0.8, zf, 0.08, 0.004, ink, inkF);
    } else if (kind === 'moon') {
      K.disc(F, 0, cy, zf, zf + 0.004, R * 0.7, ink, inkF);
      K.disc(F, R * 0.3, cy + R * 0.1, zf + 0.004, zf + 0.008, R * 0.6, field, P.cf);
      for (let i = 0; i < 5; i++) F.ball(-R + i * R * 0.5, bot + 0.3, zf, 0.03, band, P.cf);
    } else if (kind === 'spiral') {
      for (let i = 0; i < 16; i++) { const a = i * 0.7, rr = R * 0.1 + i * R * 0.055; F.ball(Math.cos(a) * rr, cy + Math.sin(a) * rr, zf, 0.035, ink, inkF); }
    } else if (kind === 'figure') {
      K.disc(F, 0, cy + R * 0.55, zf, zf + 0.006, R * 0.18, ink, inkF);
      F.box(0, cy - R * 0.3, zf, R * 0.5, R * 0.7, 0.006, 0, ink, inkF);
      for (const s of [-1, 1]) F.beam(s * R * 0.25, cy + R * 0.3, zf, s * R * 0.7, cy + R * 0.7, zf, 0.06, 0.006, ink, inkF);
      for (const s of [-1, 1]) F.box(s * R * 0.15, cy - R * 0.95, zf, R * 0.18, R * 0.65, 0.006, 0, ink, inkF);
      for (let i = 0; i < 4; i++) F.ball(-R * 0.9 + i * R * 0.6, cy + R * 0.95, zf, 0.04, band, P.cf);
    } else {
      K.disc(F, 0, cy, zf, zf + 0.004, R * 0.9, band, P.cf);
      K.disc(F, 0, cy, zf + 0.004, zf + 0.008, R * 0.7, ink, inkF);
      K.disc(F, 0, cy, zf + 0.008, zf + 0.012, R * 0.4, field, P.cf);
      K.motifAt(F, P, S, 0, cy, zf + 0.012, R * 0.5, 0);
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) K.motifAt(F, P, S, sx * (W / 2 - 0.26), cy + sy * (fh / 2 - 0.26), zf, 0.14, 0);
    }
  };

  /* wall art: a mask, a mounted skull, a plate, a painted panel, a mosaic, a shield, antlers, a relief ... */
  B.art = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, v = o.variant || 0;
    const kind = (v === 1 && S.art2) ? S.art2 : (S.art || 'plate'), zb = -D / 2;
    const R = Math.min(W, H) / 2;
    if (kind === 'mask') {
      F.box(0, H / 2 - R * 0.9, zb + 0.01, R * 1.3, R * 1.8, 0.02, 0, P.woodD, P.wf);
      K.disc(F, 0, H / 2, zb + 0.03, zb + 0.03 + Math.min(0.1, D * 0.4), R * 0.6, P.wood, P.wf);                 /* the face */
      const zf = zb + 0.03 + Math.min(0.1, D * 0.4);
      F.ball(0, H / 2 - R * 0.1, zf, R * 0.12, P.woodD, P.wf);                                                  /* nose */
      for (const s of [-1, 1]) F.ball(s * R * 0.25, H / 2 + R * 0.2, zf, R * 0.1, P.acc, P.af);                 /* eyes */
      F.box(0, H / 2 - R * 0.5, zf - 0.01, R * 0.5, R * 0.08, 0.02, 0, P.acc, P.af);                             /* mouth */
      for (let i = 0; i < 5; i++) F.cone(-R * 0.5 + i * R * 0.25, H / 2 + R * 0.6, zb + 0.06, R * 0.08, R * 0.38, 0, i % 2 ? P.acc : P.cloth[0], i % 2 ? P.af : P.cf);
    } else if (kind === 'skull' || kind === 'horns') {
      F.box(0, H / 2 - R * 0.8, zb + 0.01, R * 1.1, R * 1.6, 0.03, 0, P.woodD, P.wf);
      const sr = Math.min(R * 0.45, D / 2 - 0.05);
      if (kind === 'skull') {
        F.ball(0, H / 2 + R * 0.1, zb + 0.04 + sr, sr, P.acc, 'bone');
        F.box(0, H / 2 - R * 0.6, zb + 0.06, sr * 1.1, sr * 0.6, sr * 0.9, 0, F.shade(P.acc, -0.08), 'bone');
        for (const s of [-1, 1]) F.ball(s * sr * 0.4, H / 2 + R * 0.15, zb + 0.04 + sr * 1.7, sr * 0.22, P.woodD, P.wf);
      }
      for (const s of [-1, 1]) {
        F.rod(s * R * 0.35, H / 2 + R * 0.45, zb + 0.1, s * R * 0.95, H / 2 + R * 0.9, zb + 0.08, 0.03, F.shade(P.acc, -0.15), 'bone');
        F.rod(s * R * 0.95, H / 2 + R * 0.9, zb + 0.08, s * R * 0.7, H / 2 + R * 0.98, zb + 0.06, 0.02, F.shade(P.acc, -0.15), 'bone');
      }
    } else if (kind === 'panel' || kind === 'relief') {
      F.box(0, H / 2 - R * 0.98, zb + 0.01, W - 0.02, R * 1.96, 0.04, 0, P.woodD, P.wf);
      F.box(0, H / 2 - R * 0.85, zb + 0.05, W - 0.16, R * 1.7, 0.01, 0, kind === 'relief' ? P.stone : P.cloth[0], kind === 'relief' ? P.sf : P.cf);
      for (let i = 0; i < 3; i++) K.motifAt(F, P, S, -R * 0.55 + i * R * 0.55, H / 2, zb + 0.06, R * 0.5, 0);
      for (let i = 0; i < 2; i++) F.box(0, H / 2 + (i ? 1 : -1) * R * 0.65, zb + 0.062, W - 0.3, 0.02, 0.004, 0, P.acc, P.af);
    } else if (kind === 'mosaic') {
      F.box(0, H / 2 - R * 0.98, zb + 0.01, W - 0.02, R * 1.96, 0.03, 0, P.stone, P.sf);
      const n = 7, cs = (Math.min(W, H) - 0.14) / n;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const d = Math.hypot(i - 3, j - 3);
        const c = d < 1 ? P.acc : d < 2.5 ? P.cloth[0] : P.cloth[1 % P.cloth.length];
        F.box(-cs * 3 + i * cs, H / 2 - cs * 3.5 + j * cs, zb + 0.04, cs * 0.85, cs * 0.85, 0.006, 0, d < 1 ? c : F.shade(c, F.rr(-0.08, 0.08)), d < 1 ? P.af : 'ceramic');
      }
    } else if (kind === 'shield') {
      K.disc(F, 0, H / 2, zb + 0.03, zb + 0.06, R * 0.95, P.wood, P.wf);
      K.disc(F, 0, H / 2, zb + 0.06, zb + 0.08, R * 0.8, P.cloth[0], P.cf);
      F.ball(0, H / 2, zb + 0.08, Math.min(R * 0.2, D / 2 - 0.09), P.metal, P.mf);
      K.motifAt(F, P, S, 0, H / 2 + R * 0.5, zb + 0.08, R * 0.35, 0);
      for (const s of [-1, 1]) F.rod(s * R * 0.8, H / 2 - R * 0.5, zb + 0.02, s * R * 0.1, H / 2 + R * 0.8, zb + 0.02, 0.02, P.woodD, P.wf);
    } else if (kind === 'antler') {
      F.box(0, H / 2 - R * 0.5, zb + 0.01, R, R, 0.03, 0, P.woodD, P.wf);
      for (const s of [-1, 1]) {
        F.rod(s * R * 0.15, H / 2, zb + 0.08, s * R * 0.7, H / 2 + R * 0.7, zb + 0.12, 0.025, P.acc, 'bone');
        F.rod(s * R * 0.4, H / 2 + R * 0.35, zb + 0.1, s * R * 0.95, H / 2 + R * 0.4, zb + 0.14, 0.018, P.acc, 'bone');
        F.rod(s * R * 0.7, H / 2 + R * 0.7, zb + 0.12, s * R * 0.6, H / 2 + R * 0.98, zb + 0.1, 0.015, P.acc, 'bone');
      }
    } else if (kind === 'sunplate') {
      K.disc(F, 0, H / 2, zb + 0.02, zb + 0.04, R * 0.98, P.acc, P.af);
      K.disc(F, 0, H / 2, zb + 0.04, zb + 0.06, R * 0.55, F.shade(P.acc, 0.2), P.af);
      for (let i = 0; i < 12; i++) { const a = i * F.TAU / 12; F.ball(Math.cos(a) * R * 0.78, H / 2 + Math.sin(a) * R * 0.78, zb + 0.06, R * 0.06, P.woodD, P.wf); }
      F.ball(0, H / 2, zb + 0.07, R * 0.12, P.cloth[0], P.cf);
    } else {
      K.disc(F, 0, H / 2, zb + 0.02, zb + 0.04, R * 0.98, P.clay, P.clf);
      K.disc(F, 0, H / 2, zb + 0.04, zb + 0.05, R * 0.78, P.cloth[0], P.cf);
      K.disc(F, 0, H / 2, zb + 0.05, zb + 0.06, R * 0.35, P.acc, P.af);
      for (let i = 0; i < 8; i++) { const a = i * F.TAU / 8; K.motifAt(F, P, S, Math.cos(a) * R * 0.57, H / 2 + Math.sin(a) * R * 0.57, zb + 0.06, R * 0.2, 0, S.motif === 'none' ? 'dots' : S.motif); }
    }
  };

  /* floor ornament: a figure, an idol, a totem pole, an urn, a globe, a skull pole, an obelisk, a vase, a guardian beast */
  B.statue = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h;
    const kind = S.statue || 'figure', R = Math.min(W, D) / 2;
    const plinthH = Math.min(0.3, H * 0.2);
    F.box(0, 0, 0, W, plinthH, D, 0, P.stone, P.sf);
    K.band(F, P, S, 0, plinthH / 2, D / 2, W - 0.2, plinthH * 0.4, 0);
    const y0 = plinthH, bh = H - plinthH;
    if (kind === 'idol' || kind === 'guardian') {
      F.box(0, y0, 0, R * 1.4, bh * 0.45, R * 1.2, 0, P.acc, P.af);
      F.blob(0, y0 + bh * 0.62, 0, R * 0.7, bh * 0.4, 0, P.acc, P.af);
      for (const s of [-1, 1]) F.cone(s * R * 0.5, y0 + bh * 0.78, 0, R * 0.2, bh * 0.2, 0, F.shade(P.acc, -0.1), P.af);
      for (const s of [-1, 1]) F.ball(s * R * 0.3, y0 + bh * 0.68, R * 0.5, R * 0.1, P.woodD, P.wf);
      F.box(0, y0 + bh * 0.45, R * 0.4, R * 0.8, bh * 0.1, R * 0.4, 0, F.shade(P.acc, -0.2), P.af);
    } else if (kind === 'totem' || kind === 'skullpole') {
      F.cyl(0, y0, 0, R * 0.45, bh, 0, P.wood, P.wf);
      for (let i = 0; i < 3; i++) {
        const y = y0 + bh * (0.15 + i * 0.3);
        if (kind === 'skullpole') { F.ball(0, y + R * 0.4, R * 0.08, R * 0.4, P.acc, 'bone'); F.box(0, y, R * 0.2, R * 0.5, R * 0.3, R * 0.4, 0, F.shade(P.acc, -0.1), 'bone'); }
        else { F.box(0, y, 0, R * 1.6, bh * 0.22, R * 1.1, 0, i % 2 ? P.woodL : P.acc, i % 2 ? P.wf : P.af); K.motifAt(F, P, S, 0, y + bh * 0.11, R * 0.55, R * 0.8, 0); }
      }
      for (const s of [-1, 1]) F.beam(0, y0 + bh * 0.9, 0, s * (W / 2 - 0.02), y0 + bh * 0.98, 0, 0.08, 0.1, P.acc, P.af);
    } else if (kind === 'urn' || kind === 'vase') {
      F.frustum(0, y0, 0, R * 0.4, R * 0.9, bh * 0.45, 0, P.clay, P.clf, 16);
      F.frustum(0, y0 + bh * 0.45, 0, R * 0.9, R * 0.35, bh * 0.35, 0, F.shade(P.clay, 0.05), P.clf, 16);
      F.cyl(0, y0 + bh * 0.8, 0, R * 0.45, bh * 0.2, 0, F.shade(P.clay, -0.08), P.clf);
      F.cyl(0, y0 + bh * 0.42, 0, R * 0.91, bh * 0.06, 0, P.acc, P.af);
      K.band(F, P, S, 0, y0 + bh * 0.45, R * 0.88, R * 1.2, bh * 0.08, 0);
      if (kind === 'vase') for (let i = 0; i < 4; i++) { const a = i * 1.6; F.rod(0, y0 + bh * 0.9, 0, Math.cos(a) * R * 0.5, y0 + bh * 1.0, Math.sin(a) * R * 0.5, 0.01, P.rope, 'plant'); F.ball(Math.cos(a) * R * 0.5, y0 + bh * 1.0, Math.sin(a) * R * 0.5, R * 0.12, P.pick(), 'plant'); }
    } else if (kind === 'globe') {
      F.cyl(0, y0, 0, R * 0.5, bh * 0.1, 0, P.wood, P.wf);
      F.cyl(0, y0 + bh * 0.1, 0, R * 0.12, bh * 0.35, 0, P.wood, P.wf);
      F.ball(0, y0 + bh * 0.72, 0, R * 0.82, P.acc, P.af);
      F.rod(-R * 0.6, y0 + bh * 0.2, 0, R * 0.6, y0 + bh * 0.99, 0, 0.02, P.metal, P.mf);
    } else if (kind === 'obelisk') {
      F.frustum(0, y0, 0, R * 0.5, R * 0.3, bh * 0.85, 0, P.stone, P.sf, 4);
      F.cone(0, y0 + bh * 0.85, 0, R * 0.42, bh * 0.15, Math.PI / 4, P.acc, P.af);
      for (let i = 0; i < 3; i++) K.motifAt(F, P, S, 0, y0 + bh * (0.2 + i * 0.25), R * 0.48 - i * R * 0.06, R * 0.5, 0);
    } else {
      /* a standing figure, robed */
      F.frustum(0, y0, 0, R * 0.7, R * 0.4, bh * 0.55, 0, P.stone, P.sf, 10);
      F.cyl(0, y0 + bh * 0.55, 0, R * 0.42, bh * 0.22, 0, P.stone, P.sf);
      F.ball(0, y0 + bh * 0.87, 0, R * 0.26, F.shade(P.stone, 0.05), P.sf);
      F.dome(0, y0 + bh * 0.95, 0, R * 0.28, bh * 0.05, 0, P.acc, P.af);
      for (const s of [-1, 1]) F.beam(s * R * 0.35, y0 + bh * 0.72, 0, s * R * 0.2, y0 + bh * 0.45, R * 0.4, R * 0.18, R * 0.18, P.stone, P.sf);
      F.ball(0, y0 + bh * 0.47, R * 0.42, R * 0.12, P.acc, P.af);
    }
  };

/* ======== Role builders: trades and households (forge, anvil, stall, vat, still, bunk, larder ...) ======== */
  /* The interiors-sets pass (2026-10, kits/interiors/sets): what shops, industries, stables and
     tenements need and the per-tier roles lack. Registered per culture by FK.set({ roles: 'trade' })
     as <culture>_trade_<role>; every one draws only with the culture's style sheet, so a culture
     gets a forge in its own stone and iron, a vat in its own wood. */
  /* smith's forge: a masonry hearth block against the wall, coals, a hood and flue, bellows, tongs */
  B.forge = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, zb = -D / 2;
    const ember = P.ember || P.acc, flame = P.flame || P.acc;
    F.box(0, 0, 0, W, 0.75, D, 0, P.stone, P.sf);                                         /* the hearth block */
    F.box(0, 0.75, zb + 0.05, W, 0.5, 0.1, 0, F.shade(P.stone, -0.1), P.sf);              /* fire-back */
    F.box(0.05, 0.75, 0.05, W * 0.55, 0.05, D * 0.55, 0, F.shade(P.stone, -0.4), P.sf);   /* the fire bed */
    for (let i = 0; i < 6; i++) F.ball(0.05 + F.rr(-W * 0.2, W * 0.2), 0.82, 0.05 + F.rr(-D * 0.18, D * 0.18), F.rr(0.04, 0.07), i % 2 ? ember : flame, 'glow');
    F.box(0, 1.25, zb + D * 0.38, W * 0.86, 0.28, D * 0.74, 0, P.metal, P.mf);              /* the hood */
    F.box(0, 1.53, zb + D * 0.3, W * 0.56, 0.24, D * 0.56, 0, F.shade(P.metal, -0.08), P.mf);
    F.box(0, 1.77, zb + 0.2, 0.34, H - 1.77, 0.34, 0, F.shade(P.metal, -0.15), P.mf);      /* flue to the ceiling */
    F.box(-W / 2 + 0.2, 0.75, D * 0.18, 0.3, 0.1, 0.46, 0, P.woodD, P.wf);                /* bellows: boards and leather */
    F.box(-W / 2 + 0.2, 0.85, D * 0.18, 0.28, 0.1, 0.4, 0, P.pick(), P.cf);
    F.box(-W / 2 + 0.2, 0.95, D * 0.18, 0.3, 0.04, 0.46, 0, P.woodD, P.wf);
    F.rod(-W / 2 + 0.2, 1.0, D * 0.18 + 0.2, -W / 2 + 0.2, 1.25, D / 2 - 0.04, 0.02, P.woodD, P.wf);
    for (const dx of [0, 0.06]) F.rod(W / 2 - 0.12 - dx, 0.75, D / 2 - 0.08, W / 2 - 0.2 - dx, 1.24, D / 2 - 0.26, 0.012, P.metal, P.mf);   /* tongs */
    F.lamp(0.05, 0.95, 0.15, 0.8, 6);
  };
  /* anvil on its stump, a hammer on the face, a bucket of tools beside */
  B.anvil = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d;
    F.cyl(0, 0, 0, Math.min(0.22, D / 2 - 0.02), 0.5, 0, P.woodD, P.wf);
    F.box(0, 0.5, 0, 0.16, 0.14, 0.14, 0, F.shade(P.metal, -0.1), P.mf);
    F.box(0.03, 0.64, 0, 0.42, 0.1, 0.15, 0, P.metal, P.mf);
    F.box(-0.25, 0.66, 0, 0.12, 0.07, 0.09, 0, P.metal, P.mf);
    F.box(-0.33, 0.68, 0, 0.06, 0.04, 0.05, 0, P.metal, P.mf);                              /* the horn, stepped */
    F.box(0.12, 0.74, -0.02, 0.04, 0.035, 0.24, 0.3, P.woodL, P.wf);                        /* hammer */
    F.box(0.08, 0.74, 0.09, 0.09, 0.05, 0.05, 0.3, F.shade(P.metal, 0.1), P.mf);
    F.cyl(W / 2 - 0.1, 0, D / 2 - 0.1, 0.08, 0.3, 0, P.wood, P.wf);                          /* tool bucket */
    for (let i = 0; i < 3; i++) F.rod(W / 2 - 0.12 + i * 0.02, 0.2, D / 2 - 0.1, W / 2 - 0.1 + i * 0.015, 0.62, D / 2 - 0.12, 0.01, P.metal, P.mf);
  };
  /* quenching or watering trough */
  B.trough = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h;
    F.box(0, 0, 0, W - 0.04, 0.06, D - 0.04, 0, P.woodD, P.wf);
    for (const s of [-1, 1]) {
      F.box(0, 0, s * (D / 2 - 0.035), W, H, 0.07, 0, P.wood, P.wf);
      F.box(s * (W / 2 - 0.035), 0, 0, 0.07, H, D - 0.14, 0, P.wood, P.wf);
      for (const t of [-1, 1]) F.box(s * (W / 2 - 0.045), H - 0.03, t * (D / 2 - 0.045), 0.09, 0.03, 0.09, 0, P.metal, P.mf);   /* iron corner caps */
    }
    F.box(0, 0.06, 0, W - 0.14, H - 0.16, D - 0.14, 0, F.shade(P.stone, -0.45), 'glass');  /* water */
  };
  /* a beast's stall: two boarded partitions, a back board with a manger, straw underfoot */
  B.stall = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, zb = -D / 2;
    const hay = F.shade(P.rope, 0.18);
    F.box(0, 0, zb + 0.03, W, H * 0.9, 0.06, 0, P.woodD, P.wf);                             /* back board, on the wall */
    for (const s of [-1, 1]) {
      F.box(s * (W / 2 - 0.04), 0, 0, 0.07, H * 0.82, D - 0.1, 0, P.wood, P.wf);
      F.box(s * (W / 2 - 0.04), 0, D / 2 - 0.06, 0.1, H, 0.1, 0, P.woodD, P.wf);             /* front post */
      F.box(s * (W / 2 - 0.04), 0, zb + 0.06, 0.1, H, 0.1, 0, P.woodD, P.wf);
      K.finial(F, P, S, s * (W / 2 - 0.04), H - 0.06, D / 2 - 0.06, 0.03);
    }
    F.box(0, 0.55, zb + 0.28, W - 0.2, 0.32, 0.44, 0, P.wood, P.wf);                         /* manger */
    F.blob(0, 0.92, zb + 0.28, Math.min(0.2, W * 0.15), 0.14, 0, hay, 'plant');
    F.box(0, 0, 0.05, W - 0.2, 0.03, D - 0.3, 0, hay, 'plant');                              /* straw */
    F.rod(-W / 2 + 0.1, H * 0.6, zb + 0.4, -W / 2 + 0.1, H * 0.35, zb + 0.9, 0.012, P.rope, 'rope');   /* tether */
  };
  /* hay rack over a feed trough, slatted, against the wall */
  B.hayrack = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, zb = -D / 2, hay = F.shade(P.rope, 0.18);
    F.box(0, 0, zb + 0.03, W, H, 0.06, 0, P.woodD, P.wf);
    F.box(0, 0, 0, W, 0.45, D - 0.02, 0, P.wood, P.wf);                                       /* the trough below */
    F.box(0, 0.4, 0.02, W - 0.12, 0.05, D - 0.16, 0, hay, 'plant');
    F.box(0, H - 0.08, zb + D * 0.5, W, 0.06, 0.06, 0, P.woodD, P.wf);                        /* the rack's front rail */
    const n = Math.max(4, Math.floor(W / 0.14));
    for (let i = 0; i < n; i++) { const x = -W / 2 + 0.07 + i * (W - 0.14) / (n - 1); F.rod(x, 0.62, zb + 0.08, x, H - 0.06, zb + D * 0.5, 0.012, P.wood, P.wf); }
    F.blob(0, H * 0.72, zb + 0.24, Math.min(0.18, D * 0.36), H * 0.3, 0, hay, 'plant');
  };
  /* a shop's stepped display of goods */
  B.display = function (F, S, o) {
    const P = K.pal(F, S), W = o.w, D = o.d, H = o.h, v = o.variant || 0;
    F.box(0, 0, 0, W, H * 0.45, D, 0, P.wood, P.wf);
    F.box(0, H * 0.45, -D * 0.18, W * 0.92, H * 0.28, D * 0.62, 0, P.woodD, P.wf);
    F.box(0, H * 0.73, -D * 0.3, W * 0.84, H * 0.15, D * 0.38, 0, P.wood, P.wf);
    K.band(F, P, S, 0, H * 0.2, D / 2 + 0.005, W - 0.3, 0.1, 0);
    const tiers = [[H * 0.45, D * 0.32], [H * 0.73, D * 0.0], [H * 0.88, -D * 0.3]];
    tiers.forEach(function (t, k) {
      const n = Math.max(2, Math.floor(W / 0.3) - k);
      for (let i = 0; i < n; i++) {
        const x = -W * 0.4 + (i + 0.5) * (W * 0.8 / n), y = t[0], z = t[1] + (k === 0 ? -0.04 : 0.04);
        const room = Math.min(H - y, 0.12);
        if (v === 1) F.rod(x - 0.1, y + 0.05, z, x + 0.1, y + 0.05, z, Math.min(0.05, room / 2), P.pick(), P.cf);   /* cloth bolts */
        else if ((i + k) % 3 === 0) F.frustum(x, y, z, 0.05, 0.06, room, 0, P.clay, P.clf, 10);

  /* the canonical materials a role's build can touch, from the style sheet's families */
  K.materialsFor = function (S, R) {
    const fams = new Set();
    for (const slot of (R.uses || [])) {
      if (slot === 'rope') fams.add('rope');
      else fams.add(S[SLOT_FAM[slot]] || SLOT_DEFAULT[SLOT_FAM[slot]]);
    }
    if (R.fire) fams.add('glow');
    if (R.glass) fams.add('glass');
    if (R.plant) fams.add('plant');
    if (R.plaster) fams.add('plaster');
    if (R.reed) fams.add('reed');
    if (R.bone) fams.add('bone');
    if (R.ceramic) fams.add('ceramic');
    if (R.plastic) fams.add('plastic');
    if (S.tile && (R.build === 'hearth' || R.build === 'art')) fams.add('ceramic');
    if ((R.uses || []).indexOf('wood') >= 0 && (S.woodFam === 'bamboo' || S.legs === 'lashed' || S.motif === 'lash')) fams.add('rope');
    const out = new Set();
    for (const f of fams) out.add(FAMILY_TO_MATERIAL[f] || 'unassigned');
    return [...out].sort();
  };

  /* FK.set({ culture, tier, S, names?, dims?, override?, skip?, rooms?, prefix?, roles? }):
     registers every role of the tier as FURN entries keyed <culture>_<tier>_<role>; with

    const culture = spec.culture, tier = spec.tier || 'common', S = spec.S;
    const prefix = spec.prefix || (culture + '_' + (spec.roles || tier) + '_');
    const names = spec.names || {}, dims = spec.dims || {}, over = spec.override || {}, skip = spec.skip || [];
    const roles = K.ROLES[spec.roles || tier];     /* spec.roles: another role list ('trade') registered at this tier */
    const made = [];
    for (const R of roles) {
      if (skip.indexOf(R.role) >= 0) continue;
      const o = over[R.role] || {};
      const d = Object.assign({ w: R.w, d: R.d, h: R.h }, dims[R.role] || {}, o.w ? { w: o.w, d: o.d, h: o.h } : {});
      const build = o.build || B[R.build];
      const opts = Object.assign({}, R.opts || {}, o.opts || {});
      const entry = {
        key: prefix + R.role, name: o.name || names[R.role] || (FURN_CULTURE_INFO[culture] ? FURN_CULTURE_INFO[culture].name : culture) + ' ' + R.role.replace(/_/g, ' '),
        culture: culture, tier: tier, type: o.type || R.type, setting: o.setting || R.setting || 'indoor',
        rooms: (o.rooms || (spec.rooms && spec.rooms[R.role]) || R.rooms).slice(), anchor: o.anchor || R.anchor || 'floor',

        materials: o.materials || K.materialsFor(S, R),

        variantNames: o.variantNames || R.variantNames,
        variantDims: o.variantDims || (R.variantDims && !o.w ? R.variantDims.map(function (vd) { return Object.assign({ w: d.w, d: d.d, h: d.h }, vd); }) : undefined),

      };
      if (entry.variantNames && entry.variantNames.length !== entry.variants) entry.variantNames = undefined;
      FURN(entry);
      made.push(entry.key);
    }

   LANTERN() (Mav's 72-lights.js), pod() and bush() (both 55-arch.js). */
const BRH = {
  /* Mav's LANTERN(): timber cage, a glowing core turned inside it, a shingle cap, an optional cord up.

  lantern: function (F, x, y, z, hang, cool, cordR) {
    F.box(x, y - 0.28, z, 0.34, 0.5, 0.34, 0, F.col('timberSmoke'), 'wood');

  bush: function (F, x, y, z, r, h, c) {

   returns this file's API as the single global `KratorFurniture` (KF below). Nothing

   the same palettes) and MERGES them: every mesh's triangles go, in world space with its
   colour as a vertex colour, into one bucket per render family, so a whole settlement's
   furniture is about 20 draw calls. Lights the pieces add (F.lamp) are kept as DATA.

     B.placements                              // every record placed since the batch began (kept after flush)

      q.forEach(function (k) { seen[k] = 1; });
      while (q.length) { const k = q.shift(); for (const m of adj[k] || []) if (!seen[m]) { seen[m] = 1; q.push(m); } }

    return {
      id: id, culture: shell.culture || null, wealth: shell.wealth == null ? 0.5 : shell.wealth, y: levels[0].y,

      outer: outer.map(function (p) { return [R3(p[0]), R3(p[1])]; }), wall: wallT, partition: partT, slab: slab,

      rooms: rooms, roomDefs: roomDefs, walls: walls, doors: doors,
      stairs: stairs.map(function (S) {

          land: S.land, foot: S.foot, top: S.top, centre: S.centre, dir: S.dir, ry: S.ry, y0: S.y0, y1: S.y1 };
      }),
      floors: floors, roof: roof, graph: graph, report: report
    };
  };

  /* the plan as plain JSON (rooms as their ROOM() inputs) */
  IX.exportBuilding = function (B) {
    return { id: B.id, culture: B.culture, wealth: B.wealth, frame: B.frame, outer: B.outer, wall: B.wall, partition: B.partition, slab: B.slab,

/* ---- kits/interiors/src/47-life.js ---- */
/* ======================== Life layer: walkers through doors ========================
   SPEC "What to build first" 3: doors joined to agents. Engine-neutral, deterministic in time:
   a walker's pose is a pure function of t (no per-frame state), so any host can draw it, skip
   frames, scrub time or run it on a server.

     const N = IX.life.nav({ rooms, plans, stairs });   rooms: normalised rooms; plans: furnishRoom()
                                                        plans (array or { roomId: plan }); stairs: the
                                                        stairs of IX.planBuilding() plans (optional)
     N.rooms[id] = { room, plan, grid, links: [...] }   one walk grid per room (the placer's own grid,
                                                        every footprint and fixture stamped)
     N.links  = [{ kind: 'door' | 'stair' | 'street', a, b, ... }]   how rooms join: interior doors
                (a door listed in both rooms, matched by id or by position), stairs (a flight's foot
                in one room, its well's top landing in the room above), street doors
     IX.life.targets(N)  -> [{ room, placement, type, cells, final }]  what a walker can go and use:
                seats, beds, workstations, counters, stoves, desks, altars (TARGET_TYPES)
     IX.life.route(N, from, to) -> { ok, pts: [{ x, y, z, room, kind }], len } | { ok: false, why }
                from / to: { street: doorId } | { room, cells: [k...], final?: [x, z] }. Rooms are
                chained by a breadth-first search over the links; inside each room the grid's
                cheapest 8-neighbour path (40-grid.js route) from the cells it enters by to the
                cells it leaves by, smoothed. kind: 'street' (outside), 'door' (a threshold),
                'stair' (on a flight), 'walk' (on the grid), 'use' (the last step onto a seat)
     IX.life.walker(N, { id, entry: streetDoorId, target, t0, speed: 1.2, dwell: 25, period? })
                -> W = { id, ok, route, t0, tArrive, tLeave, tEnd, at(t) -> { x, y, z, heading,
                   state: 'away' | 'in' | 'dwell' | 'out', room } }
                spawns outside the street door at t0, walks in, dwells at its target, walks back out
                and is 'away'; with period, the whole visit repeats every period seconds
     IX.life.populate(N, { count, seed, t0, spacing, period, speed, dwell }) -> [W, ...]
                picks targets in a fixed order from the seed, each entered by the street door
                nearest it (fewest rooms away)
   ====================================================================== */
(function (IX) {
  'use strict';
  const G = IX.geom, R3 = IX.round;
  const L = IX.life = {};
  L.TARGET_TYPES = ['chair', 'bench', 'seating', 'bed', 'workstation', 'loom', 'counter', 'stove', 'desk', 'altar', 'shrine', 'table'];
  L.SPEED = 1.2;

  function useQ(p) {                          /* the placer's piece model, rebuilt from a placement */
    return { P: { w: p.w, d: p.d }, x: p.x, z: p.z, ry: p.ry, host: p.host,
      pairedHost: !!(p.host && IX.SEAT_TYPES.indexOf(p.type) >= 0),
      zones: IX.clearanceZones({ w: p.w, d: p.d, clear: p.clearance || {}, usable: true }, p.x, p.z, p.ry) };
  }
  function fixtureCells(grid, f) {
    const P = { w: f.w, d: f.d, clear: f.clearance || {}, usable: true };
    const out = [];
    for (const z of IX.clearanceZones(P, f.x, f.z, f.ry)) if (z.side === 'front') for (const k of grid.cellsIn(z.r)) if (grid.walkable(k)) out.push(k);
    return out;
  }
  function frontEnd(f) { return [f.x + Math.sin(f.ry) * f.d / 2, f.z + Math.cos(f.ry) * f.d / 2]; }

  L.nav = function (o) {
    const N = { rooms: {}, links: [], order: [] };
    const plans = o.plans || [];
    (o.rooms || []).forEach(function (R, i) {
      const plan = Array.isArray(plans) ? plans[i] : plans[R.id];
      if (!plan || !plan.grid) return;
      N.rooms[R.id] = { room: R, plan: plan, grid: plan.grid, links: [] };
      N.order.push(R.id);
    });
    function add(Lk) { N.links.push(Lk); if (N.rooms[Lk.a]) N.rooms[Lk.a].links.push(Lk); if (Lk.b && N.rooms[Lk.b]) N.rooms[Lk.b].links.push(Lk); }
    const done = {};
    N.order.forEach(function (rid) {
      const E = N.rooms[rid], R = E.room;
      R.doors.forEach(function (d) {
        if (d.to === 'street' || !N.rooms[d.to]) {
          if (d.to === 'street') add({ kind: 'street', id: d.id || (rid + '.door' + d.i), a: rid, da: d, b: null });
          return;
        }
        const other = N.rooms[d.to].room;
        let m = null;
        for (const e of other.doors) if (e.to === rid && ((d.id && e.id === d.id) || Math.hypot(e.at[0] - d.at[0], e.at[1] - d.at[1]) < 0.6)) { m = e; break; }
        if (!m) return;
        const key = [rid, d.i, d.to, m.i].join('|'), rkey = [d.to, m.i, rid, d.i].join('|');
        if (done[rkey]) return;

        add({ kind: 'door', id: d.id || key, a: rid, da: d, b: d.to, db: m });
      });
    });
    (o.stairs || []).forEach(function (S) {
      const lo = N.rooms[S.rooms[0]], up = N.rooms[S.rooms[1]];
      if (!lo || !up) return;
      const ff = lo.room.fixtures.filter(function (f) { return f.stair === S.id && f.end === 'foot'; })[0];
      const ft = up.room.fixtures.filter(function (f) { return f.stair === S.id && f.end === 'top'; })[0];
      if (!ff || !ft) return;
      add({ kind: 'stair', id: S.id, a: lo.room.id, b: up.room.id, fa: ff, fb: ft, stair: S });
    });
    return N;
  };

  /* cells of room `rid` by which link Lk is entered or left, and the crossing points */
  function linkSide(N, Lk, rid) {
    const E = N.rooms[rid], g = E.grid;
    if (Lk.kind === 'stair') {
      const f = rid === Lk.a ? Lk.fa : Lk.fb;
      const end = frontEnd(f);
      return { cells: fixtureCells(g, f), point: [end[0], E.room.y, end[1]] };
    }
    const d = rid === Lk.a ? Lk.da : Lk.db;
    return { cells: g.doorCells(d), point: [d.at[0], E.room.y, d.at[1]], door: d };
  }

  L.targets = function (N) {
    const out = [];
    N.order.forEach(function (rid) {
      const E = N.rooms[rid];
      E.plan.placements.forEach(function (p) {
        if (L.TARGET_TYPES.indexOf(p.type) < 0 || p.anchor === 'ceiling' || p.anchor === 'surface') return;
        const cells = [];
        for (const r of IX.useZones(useQ(p))) for (const k of E.grid.cellsIn(r)) if (E.grid.walkable(k)) cells.push(k);
        if (!cells.length) return;
        const seat = IX.SEAT_TYPES.indexOf(p.type) >= 0;
        out.push({ room: rid, placement: p.id, key: p.key, type: p.type, cells: cells, final: seat ? [p.x, p.z] : null, face: [p.x, p.z],
          seatY: seat ? p.y + Math.min(0.45, p.h * 0.5) : null });
      });
    });
    return out;
  };

  /* breadth-first over rooms; ties broken by link order, so it is deterministic */
  function roomChain(N, a, b) {
    if (a === b) return [];
    const prev = {}, q = [a];
    prev[a] = null;
    while (q.length) {
      const r = q.shift();
      for (const Lk of N.rooms[r].links) {
        if (Lk.kind === 'street') continue;
        const o = Lk.a === r ? Lk.b : Lk.a;
        if (!N.rooms[o] || o in prev) continue;
        prev[o] = { from: r, link: Lk };
        if (o === b) { const out = []; for (let c = b; prev[c]; c = prev[c].from) out.push({ from: prev[c].from, to: c, link: prev[c].link }); return out.reverse(); }
        q.push(o);
      }
    }
    return null;
  }

  L.route = function (N, from, to) {
    let startRoom, startCells, pts = [];
    if (from.street) {
      const Lk = N.links.filter(function (l) { return l.kind === 'street' && l.id === from.street; })[0];
      if (!Lk) return { ok: false, why: 'no street door ' + from.street };
      const E = N.rooms[Lk.a], d = Lk.da, y = E.room.y, lat = from.offset || 0, t = [-d.n[1], d.n[0]];
      pts.push({ x: d.at[0] - d.n[0] * 2.2 + t[0] * lat, y: y, z: d.at[1] - d.n[1] * 2.2 + t[1] * lat, room: null, kind: 'street' });
      pts.push({ x: d.at[0] - d.n[0] * 0.6, y: y, z: d.at[1] - d.n[1] * 0.6, room: null, kind: 'street' });
      pts.push({ x: d.at[0], y: y, z: d.at[1], room: Lk.a, kind: 'door' });
      startRoom = Lk.a; startCells = E.grid.doorCells(d);
    } else { startRoom = from.room; startCells = from.cells; }
    let endRoom, endCells, tail = [];
    if (to.street) {
      const Lk = N.links.filter(function (l) { return l.kind === 'street' && l.id === to.street; })[0];
      if (!Lk) return { ok: false, why: 'no street door ' + to.street };
      const E = N.rooms[Lk.a], d = Lk.da, y = E.room.y;
      endRoom = Lk.a; endCells = E.grid.doorCells(d);
      tail = [{ x: d.at[0], y: y, z: d.at[1], room: Lk.a, kind: 'door' }, { x: d.at[0] - d.n[0] * 2.2, y: y, z: d.at[1] - d.n[1] * 2.2, room: null, kind: 'street' }];
    } else {
      endRoom = to.room; endCells = to.cells;
      if (to.final) tail = [{ x: to.final[0], y: N.rooms[endRoom].room.y + (to.seatY != null ? to.seatY - N.rooms[endRoom].room.y : 0), z: to.final[1], room: endRoom, kind: 'use' }];
    }
    if (!N.rooms[startRoom] || !N.rooms[endRoom]) return { ok: false, why: 'room not in the nav' };
    const chain = roomChain(N, startRoom, endRoom);
    if (!chain) return { ok: false, why: 'no chain of doors and stairs from ' + startRoom + ' to ' + endRoom };
    const legs = [];
    let cur = startRoom, cells = startCells;
    for (const step of chain) {
      const out = linkSide(N, step.link, cur), inn = linkSide(N, step.link, step.to);
      legs.push({ room: cur, from: cells, to: out.cells, exit: out, enter: inn, link: step.link });
      cur = step.to; cells = inn.cells;
    }
    legs.push({ room: cur, from: cells, to: endCells });
    for (const lg of legs) {
      const E = N.rooms[lg.room], g = E.grid, y = E.room.y;
      if (!lg.from.length || !lg.to.length) return { ok: false, why: lg.room + ': nowhere to ' + (lg.from.length ? 'leave by' : 'enter by') };
      const ks = g.route(lg.from, lg.to);
      if (!ks) return { ok: false, why: lg.room + ': the grid does not connect its way in to its way out' };
      /* smooth on the points as they will be STORED (rounded to a mm, below): the audit re-samples
         the stored route with the same clearLine, and a sample that sat a fraction of a mm inside a
         free cell before rounding could land in the blocked cell beside it after it */
      const P = g.smooth(ks.map(function (k) { const c = g.centre(k); return [R3(c[0]), R3(c[1])]; }));
      for (const c of P) pts.push({ x: c[0], y: y, z: c[1], room: lg.room, kind: 'walk' });
      if (lg.link) {
        const a = lg.exit.point, b = lg.enter.point;
        if (lg.link.kind === 'stair') {
          pts.push({ x: a[0], y: a[1], z: a[2], room: lg.room, kind: 'stair' });
          pts.push({ x: b[0], y: b[1], z: b[2], room: lg.link.a === lg.room ? lg.link.b : lg.link.a, kind: 'stair' });
        } else {
          pts.push({ x: a[0], y: a[1], z: a[2], room: lg.room, kind: 'door' });
          pts.push({ x: b[0], y: b[1], z: b[2], room: lg.link.a === lg.room ? lg.link.b : lg.link.a, kind: 'door' });
        }
      }
    }
    pts = pts.concat(tail);
    /* drop repeats; measure */
    const P2 = [];
    for (const p of pts) { const q = P2[P2.length - 1]; if (q && Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z) < 1e-6) continue; P2.push({ x: R3(p.x), y: R3(p.y), z: R3(p.z), room: p.room, kind: p.kind }); }
    const cum = [0];
    for (let i = 1; i < P2.length; i++) cum.push(cum[i - 1] + Math.hypot(P2[i].x - P2[i - 1].x, P2[i].y - P2[i - 1].y, P2[i].z - P2[i - 1].z));
    return { ok: true, pts: P2, cum: cum, len: cum[cum.length - 1], rooms: [startRoom].concat(chain.map(function (s) { return s.to; })) };
  };

  function along(Rt, s) {                       /* point and heading at arc length s */
    const P = Rt.pts, C = Rt.cum;
    if (s <= 0) return { p: P[0], i: 0, f: 0 };
    if (s >= Rt.len) return { p: P[P.length - 1], i: P.length - 2, f: 1 };
    let lo = 0, hi = C.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (C[m] <= s) lo = m; else hi = m; }
    const a = P[lo], b = P[lo + 1], f = (s - C[lo]) / Math.max(1e-9, C[lo + 1] - C[lo]);
    return { p: { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, z: a.z + (b.z - a.z) * f, room: f < 0.5 ? a.room : b.room }, i: lo, f: f };
  }
  function headingOf(Rt, i, rev) {
    const P = Rt.pts;
    for (let k = i; k >= 0 && k < P.length - 1; rev ? k-- : k++) {
      const a = P[k], b = P[k + 1], dx = (b.x - a.x) * (rev ? -1 : 1), dz = (b.z - a.z) * (rev ? -1 : 1);
      if (Math.hypot(dx, dz) > 1e-4) return Math.atan2(dx, dz);
    }
    return 0;
  }

  L.walker = function (N, o) {
    const speed = o.speed || L.SPEED, dwell = o.dwell == null ? 25 : o.dwell, t0 = o.t0 || 0;
    const T = o.target;
    const Rt = L.route(N, { street: o.entry, offset: o.offset || 0 }, { room: T.room, cells: T.cells, final: T.final, seatY: T.seatY });
    const W = { id: o.id, target: T, entry: o.entry, ok: !!Rt.ok, why: Rt.why || null, route: Rt, t0: t0, speed: speed, dwell: dwell, period: o.period || 0 };
    if (!Rt.ok) { W.at = function () { return { state: 'away' }; }; return W; }
    const dur = Rt.len / speed;
    W.tArrive = t0 + dur; W.tLeave = W.tArrive + dwell; W.tEnd = W.tLeave + dur;
    const end = Rt.pts[Rt.pts.length - 1];
    const faceH = T.face ? Math.atan2(T.face[0] - end.x, T.face[1] - end.z) : headingOf(Rt, Rt.pts.length - 2, false);
    W.at = function (tIn) {
      let t = tIn;
      if (W.period > 0) { const span = W.period; t = t0 + ((((tIn - t0) % span) + span) % span); }
      if (t < t0 || t > W.tEnd) return { state: 'away' };
      if (t <= W.tArrive) { const A = along(Rt, (t - t0) * speed); return { x: A.p.x, y: A.p.y, z: A.p.z, room: A.p.room, heading: headingOf(Rt, A.i, false), state: 'in' }; }
      if (t <= W.tLeave) return { x: end.x, y: end.y, z: end.z, room: end.room, heading: Math.hypot(T.face[0] - end.x, T.face[1] - end.z) > 0.05 ? faceH : headingOf(Rt, Rt.pts.length - 2, false), state: 'dwell' };
      const A = along(Rt, Rt.len - (t - W.tLeave) * speed);
      return { x: A.p.x, y: A.p.y, z: A.p.z, room: A.p.room, heading: headingOf(Rt, A.i, true), state: 'out' };
    };
    return W;
  };

  /* the street door fewest rooms away from a room */
  L.nearestStreet = function (N, rid) {
    const seen = {}, q = [rid];
    seen[rid] = 1;
    while (q.length) {
      const r = q.shift();
      for (const Lk of N.rooms[r].links) if (Lk.kind === 'street') return Lk.id;
      for (const Lk of N.rooms[r].links) {
        if (Lk.kind === 'street') continue;
        const o = Lk.a === r ? Lk.b : Lk.a;
        if (N.rooms[o] && !seen[o]) { seen[o] = 1; q.push(o); }
      }
    }
    return null;
  };

  L.populate = function (N, o) {
    o = o || {};
    const rng = IX.rng(o.seed || 1), all = L.targets(N).filter(function (T) { return !o.rooms || o.rooms.indexOf(T.room) >= 0; });
    rng.shuffle(all);
    const out = [], count = Math.min(o.count == null ? 8 : o.count, all.length);
    for (let i = 0; i < count; i++) {
      const T = all[i], entry = L.nearestStreet(N, T.room);
      if (!entry) continue;
      out.push(L.walker(N, { id: 'walker.' + i, entry: entry, target: T, t0: (o.t0 || 0) + i * (o.spacing == null ? 4 : o.spacing),
        speed: o.speed, dwell: o.dwell, period: o.period, offset: (rng() - 0.5) * 1.2 }));
    }
    return out;
  };

  /* does every walker reach its target, and stay on walkable cells while it walks? */
  L.audit = function (N, walkers) {
    const fails = [];
    walkers.forEach(function (W) {
      if (!W.ok) { fails.push(W.id + ': no route (' + W.why + ')'); return; }
      const end = W.route.pts[W.route.pts.length - 1], mid = W.at((W.tArrive + W.tLeave) / 2);
      if (mid.state !== 'dwell' || Math.hypot(mid.x - end.x, mid.z - end.z) > 1e-6) fails.push(W.id + ': not at its target while it dwells');
      const T = W.target, last = W.route.pts.filter(function (p) { return p.kind === 'walk'; }).pop();
      const E = N.rooms[T.room], k = E.grid.at(last.x, last.z);
      if (T.cells.indexOf(k) < 0) fails.push(W.id + ': its walk ends outside ' + T.placement + "'s use zone");
      const P = W.route.pts;
      for (let i = 0; i + 1 < P.length; i++) {
        const a = P[i], b = P[i + 1];
        if (a.kind !== 'walk' || b.kind !== 'walk' || a.room !== b.room) continue;
        if (!N.rooms[a.room].grid.clearLine([a.x, a.z], [b.x, b.z])) { fails.push(W.id + ': walks through a blocked cell in ' + a.room); break; }
      }
      const away = W.at(W.tEnd + 1), before = W.at(W.t0 - 1);
      if (!W.period && (away.state !== 'away' || before.state !== 'away')) fails.push(W.id + ': present outside its visit');
    });
    return fails;
  };
})(KratorInteriors);

/* ---- kits/interiors/src/48-audit.js ---- */
/* ======================== Plan audit (declared geometry) ========================
   IX.audit(room, plan, catalog?, opts?) re-checks a plan from its DATA alone, the way a game
   import would see it: footprints are the declared w x d at (x, z, ry). verify.py runs it on
   every demo room and adds the measured-geometry checks the page can make (75-audit.js).

     inside       every floor/ceiling footprint inside the room polygon
     height       y >= floor and y + h <= ceiling
     overlap      no two footprints on one layer overlap (a surface piece sits on its host)
     door         no floor footprint in a door's swing zone
     clearance    no footprint in another piece's DECLARED clearance zone (a seat and the table
                  it is drawn up to excepted: that zone is what the seat is for)
     reach        a fresh grid (all floor footprints stamped) connects every door to every other
                  door and to a use zone of every usable piece
     required     every PROGRAMS[kind].require slot is filled, or reported 'none-in-catalog'
     determinism  (with catalog) furnishing again gives byte-identical placements
   A room's fixtures (a stair, a stairwell) count as floor footprints for overlap, clearance and
   reach (their front must be reached from the doors).
   Returns { room, pieces, fails: [{ check, msg }], ok }.

   IX.auditBuilding(B, plansByRoom?) checks a planBuilding() plan:
     rooms-inside   every room inside the storey's inner outline, no two rooms of a storey overlap
     doors          every interior door joins two rooms of one storey, listed in both
     stairs         every stair joins storey k to k + 1, its flight and well are fixtures of a room
                    on each, inside them
     reach-graph    every room reachable from the street over doors and stairs (the walk graph)
     reach-grid     (with plans) the same on the walk GRIDS: from a street door, through every door
                    and stair, every room's grid is entered (IX.life.route to each room)
   ====================================================================== */
(function (IX) {
  'use strict';
  const G = IX.geom, EPS = 0.005;

function lifeHook(legPiv, armPiv){
  return function(sh){
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aPRO;\nattribute vec4 aAnim;\nattribute vec3 aGarb;\nattribute vec3 aSkin;\nattribute vec3 aHair;')
      .replace('#include <color_vertex>', 'vColor = color;\nif(aPRO.y < 0.5) vColor *= aGarb; else if(aPRO.y < 1.5) vColor *= aSkin; else if(aPRO.y < 2.5) vColor *= aHair;')
      .replace('#include <beginnormal_vertex>', [
        'vec3 objectNormal = vec3(normal);',
        'float lfPart = aPRO.x, lfAng = 0.0, lfPy = 0.0, lfAmp = max(aAnim.y, 0.0), lfBend = max(-aAnim.y, 0.0);',
        'bool lfLimb = lfPart > 0.5 && lfPart < 4.5;',
        'bool lfUpper = lfBend > 0.001 && ((lfPart < 0.5 && position.y > 0.9) || (lfPart > 2.5 && lfPart < 4.5));',
        'if(lfLimb){',
        '  float lfSw = sin(aAnim.x) * lfAmp;',
        '  if(lfPart < 2.5){ lfPy = ' + legPiv.toFixed(3) + '; lfAng = lfPart < 1.5 ? lfSw : -lfSw; }',
        '  else { lfPy = ' + armPiv.toFixed(3) + '; lfAng = (lfPart < 3.5 ? -lfSw : lfSw)*0.85 - aAnim.z; }',
        '  float lfC = cos(lfAng), lfS = sin(lfAng);',
        '  objectNormal = vec3(objectNormal.x, objectNormal.y*lfC - objectNormal.z*lfS, objectNormal.y*lfS + objectNormal.z*lfC);',
        '}',
        'if(lfUpper){ float lfCb = cos(lfBend), lfSb = sin(lfBend);',
        '  objectNormal = vec3(objectNormal.x, objectNormal.y*lfCb - objectNormal.z*lfSb, objectNormal.y*lfSb + objectNormal.z*lfCb); }'].join('\n'))
      .replace('#include <begin_vertex>', [
        'vec3 transformed = vec3(position);',
        'if(lfLimb){',
        '  float lfC2 = cos(lfAng), lfS2 = sin(lfAng); vec3 lfQ = transformed - vec3(0.0, lfPy, 0.0);',
        '  transformed = vec3(lfQ.x, lfPy + lfQ.y*lfC2 - lfQ.z*lfS2, lfQ.y*lfS2 + lfQ.z*lfC2);',
        '}',
        'if(lfUpper){ float lfCb2 = cos(lfBend), lfSb2 = sin(lfBend); vec3 lfB = transformed - vec3(0.0, 0.9, 0.0);',
        '  transformed = vec3(lfB.x, 0.9 + lfB.y*lfCb2 - lfB.z*lfSb2, lfB.y*lfSb2 + lfB.z*lfCb2); }',
        'if(lfPart > 4.5) transformed.y = aAnim.x;',
        'if(aPRO.z > 0.5){ float lfW = floor(aAnim.w + 0.5); bool lfShow = aPRO.z < 1.5 ? mod(lfW, 2.0) > 0.5 : lfW > 1.5;',

  };
}

var DAYNIGHT_NIGHT_K = 0;
function updateDayNight(){
  var S = SKY_STATE;
  dnBodyDir((S.hour+12)%24, DN_MOON_AZ0, DN_MOON_ELEV_MAX, _dnMoon);
  SUNDIR.copy(S.sunDir); MOONDIR.copy(_dnMoon);
  moonSprite.userData.dir.copy(_dnMoon);

  /* EFFECTIVE daylight (sun up AND not eclipsed): a noon eclipse reads as
     dusk everywhere at once because everything below hangs off this. */
  var daylight = S.dayK;
  var moonUp = smooth(-0.05, 0.10, _dnMoon.y);
  var shine = S.lit*(1 - daylight);                    /* planetshine strength 0..1 */

  /* one key light: sun by day, the giant by night and through an eclipse */
  sun.color.copy(S.keyCol);
  sun.intensity = DN_SUN_I * S.keyI;
  hemiLight.intensity = DN_HEMI_NIGHT_I + DN_SHINE_HEMI*shine + (DN_HEMI_I-DN_HEMI_NIGHT_I)*daylight;
  ambLight.intensity  = DN_AMB_NIGHT_I  + DN_SHINE_AMB*shine  + (DN_AMB_I-DN_AMB_NIGHT_I)*daylight + 0.02*moonUp;
  /* thick air scatters: a milky low-contrast key at ~2 atm, a hard one at 0.8 */
  sun.intensity       *= 1.16 - 0.30*S.shadowSoft;
  hemiLight.intensity *= 0.80 + 0.42*S.shadowSoft;
  ambLight.intensity  *= 0.80 + 0.42*S.shadowSoft;
  /* the hemisphere's sky half is sampled from the dome's zenith, its ground
     half leans to Krator's red soil — blended with the tuned PAL values */
  /* (sampled less at night: the night zenith is near-black and would cancel the floors) */
  hemiLight.color.setHex(PAL.hemiSky).lerp(S.hemiSky, DN_SKY_SAMPLE*(0.25 + 0.75*daylight));
  hemiLight.groundColor.setHex(PAL.hemiGround).lerp(S.hemiGround, DN_SOIL_SAMPLE);

  /* fog: jungle haze by day, a warm cast while the sun is low, blue-black at night */
  _dnFog.copy(DN_HAZE_NIGHT).lerp(DN_HAZE_DAY, daylight);
  _dnDusk.setHex(PAL.sky.sunset);
  _dnFog.lerp(_dnDusk, 0.22*S.duskK*daylight);
  scene.fog.color.copy(_dnFog);
  skyScene.background.copy(_dnFog);
  SKY_DOME_U.uBelowCol.value.copy(_dnFog).convertSRGBToLinear();
  scene.fog.density = skyFogBase();                    /* PAL.fogDensity x pressure */
  _dnSky.copy(DN_SKY_TINT_NIGHT).lerp(DN_SKY_TINT_DAY, daylight);
  skyMesh.material.color.copy(_dnSky);

  moonSprite.material.opacity = (0.15 + 0.55*moonUp) * (1 - daylight*0.85);
  moon2.material.opacity = (0.10 + 0.30*moonUp) * (1 - daylight*0.7);

  /* 0 day .. 1 night. An eclipse raises it (daylight is effective daylight);
     a full giant lowers it a little — the lamps are not fighting total dark. */
  DAYNIGHT_NIGHT_K = (1 - daylight) * (1 - DN_SHINE_NL_CUT*S.lit);
}

/* ------------------------------------------------------------------ obstacles
   flyHit(x,y,z, mT,mP,mB, skipTower, block) -> 0 clear | 1 trunk | 2 tower | 3 bridge | 4 crown/bough
   Each tower (with its deck and crown frames) is a box: |dx|,|dz| < 40, y < top+16.
   block=true treats the whole four-tower square (decks, slots, court, bridges) as one box: cruise legs go round it. */
var FLY_CELL = 32, flyHash = {}, flyBr = [], flyPathStatsFol = 0, flyTopY = 0, flyTwTop = 0;
var FLY_TWBOX = 40, FLY_TWCAP = 16, FLY_BLOCK = 100;
(function(){
  function put(x, y, z, r){
    var R = r + 8, i0 = Math.floor((x-R)/FLY_CELL), i1 = Math.floor((x+R)/FLY_CELL), j0 = Math.floor((z-R)/FLY_CELL), j1 = Math.floor((z+R)/FLY_CELL);
    for(var i=i0;i<=i1;i++) for(var j=j0;j<=j1;j++){ var k = i*8192+j; (flyHash[k] || (flyHash[k] = [])).push(x, y, z, r); }
  }
  BRANCHES.forEach(function(B){
    for(var i=0;i<B.pts.length-1;i++){ var a = B.pts[i], b = B.pts[i+1];
      if(Math.max(a.r, b.r) <= 2) continue;
      var L = Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z), n = Math.max(1, Math.ceil(L/4));
      for(var s=0;s<n;s++){ var t = s/n, r = mix(a.r, b.r, t); if(r > 2) put(mix(a.x,b.x,t), mix(a.y,b.y,t), mix(a.z,b.z,t), r); } }
  });
  /* leaf clumps: read the real foliage instances if the tree pass tagged them (crown ellipsoids cover the rest) */
  var flyFolN = 0;
  scene.traverse(function(o){
    if(!o.isInstancedMesh || !o.userData.trees || !/foliage/i.test(o.userData.inspectLabel || '')) return;
    var M = o.instanceMatrix.array;
    for(var i=0;i<o.count;i++){ var k = i*16, sx = Math.hypot(M[k], M[k+1], M[k+2]);
      if(sx < 6 || Math.abs(M[k+12]) > 1700 || Math.abs(M[k+14]) > 1700) continue;
      put(M[k+12], M[k+13], M[k+14], Math.max(1, sx*0.5-3)); flyFolN++; }
  });
  flyPathStatsFol = flyFolN;
  BRIDGES.forEach(function(br){ flyBr.push({ br:br, x0:Math.min(br.a.x,br.b.x), x1:Math.max(br.a.x,br.b.x), z0:Math.min(br.a.z,br.b.z), z1:Math.max(br.a.z,br.b.z),
    y0:Math.min(br.a.y,br.b.y)-br.sag-1, y1:Math.max(br.a.y,br.b.y)+3 }); });
  TREES.forEach(function(T){ flyTopY = Math.max(flyTopY, T.y0+T.H); });
  FARTREES.forEach(function(T){ flyTopY = Math.max(flyTopY, T.y0+T.H); });
  TOWERS.forEach(function(T){ flyTwTop = Math.max(flyTwTop, T.top+FLY_TWCAP); });
})();
function flyHit(x, y, z, mT, mP, mB, skipTower, block){
  var i, d;
  if(block){ if(Math.abs(x) < FLY_BLOCK+mP && Math.abs(z) < FLY_BLOCK+mP && y < flyTwTop+mP*0.5) return 2; }
  else {
    for(i=0;i<TOWERS.length;i++){ var W = TOWERS[i]; if(W === skipTower) continue;
      if(Math.abs(x-W.x) < FLY_TWBOX+mP && Math.abs(z-W.z) < FLY_TWBOX+mP && y < W.top+FLY_TWCAP+mP*0.5) return 2; }
    for(i=0;i<flyBr.length;i++){ var b = flyBr[i];
      if(x < b.x0-8 || x > b.x1+8 || z < b.z0-8 || z > b.z1+8 || y < b.y0-mB || y > b.y1+mB) continue;
      var br = b.br, ex = br.b.x-br.a.x, ez = br.b.z-br.a.z, t = clamp(((x-br.a.x)*ex+(z-br.a.z)*ez)/(ex*ex+ez*ez), 0, 1);
      if(Math.hypot(x-br.a.x-ex*t, z-br.a.z-ez*t) < br.w*0.5+4 && Math.abs(y-bridgeY(br, t)-1) < mB) return 3; }
  }
  for(i=0;i<TREES.length;i++){ var T = TREES[i], dx = x-T.x, dz = z-T.z, cr = T.crownR+mT;
    if(dx > cr || dx < -cr || dz > cr || dz < -cr || y > T.y0+T.H+4+mT) continue;
    d = Math.sqrt(dx*dx+dz*dz);
    if(d < trunkR(T, y)+mT) return 1;
    var cy = T.y0+T.H*(1+T.crown0)*0.5, ry = T.H*(1-T.crown0)*0.5+8+mT*0.5, qy = (y-cy)/ry, qd = d/(T.crownR+mT*0.5);
    if(qy*qy+qd*qd < 1) return 4; }
  var cell = flyHash[Math.floor(x/FLY_CELL)*8192+Math.floor(z/FLY_CELL)];
  if(cell) for(i=0;i<cell.length;i+=4){ var ax = x-cell[i], ay = y-cell[i+1], az = z-cell[i+2], rr2 = cell[i+3]+6;
    if(ax*ax+ay*ay+az*az < rr2*rr2) return 4; }
  return 0;
}
/* a straight cruise leg a->b: far trees in 2-D, everything near sampled (block mode), ground */
function flyLineHit(ax, ay, az, bx, by, bz, mT, mP, halfW){
  var i, d, L = Math.hypot(bx-ax, bz-az), ym = Math.min(ay, by);
  halfW = halfW || 0;
  for(i=0;i<FARTREES.length;i++){ var T = FARTREES[i]; if(ym > T.y0+T.H+4) continue;
    d = segDist(T.x, T.z, ax, az, bx, bz);
    if(d < trunkR(T, ym)+mT+halfW) return 1;
    if(ym > T.y0+T.H*T.crown0 && d < T.crownR*0.7+halfW) return 4; }
  var n = Math.max(1, Math.ceil(L/8));
  for(i=0;i<=n;i++){ var t = i/n, x = mix(ax,bx,t), z = mix(az,bz,t), y = mix(ay,by,t);
    if(Math.abs(x) < 1700 && Math.abs(z) < 1700){ var h = flyHit(x, y, z, mT+halfW, mP+halfW, 5, null, true); if(h) return h; }
    if(i%8 === 0 && y < terrainH(x, z)+28) return 5; }
  return 0;
}

/* ------------------------------------------------------------------ paths
   A path is a polyline {p:Float32Array xyz, cum:Float32Array, n, len, closed}. */
var flyV = new THREE.Vector3();
function flyPathFromPts(pts, closed){
  var n = pts.length, P = new Float32Array(n*3), C = new Float32Array(n), L = 0;
  for(var i=0;i<n;i++){ P[i*3] = pts[i][0]; P[i*3+1] = pts[i][1]; P[i*3+2] = pts[i][2];
    if(i) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1], pts[i][2]-pts[i-1][2]); C[i] = L; }
  return { p:P, cum:C, n:n, len:L, closed:!!closed };
}
function flyCurvePts(curve, step, out){
  curve.arcLengthDivisions = 300; var L = curve.getLength(), n = Math.max(8, Math.ceil(L/step));
  for(var i=0;i<=n;i++){ curve.getPointAt(i/n, flyV); out.push([flyV.x, flyV.y, flyV.z]); }
