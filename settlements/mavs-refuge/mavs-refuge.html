}
function headAt(P, ang, w){
  var r = P.R - 0.4, p = platXZ(P, r, ang);
  var h = { plat:P, ang:ang, x:p[0], y:P.y, z:p[1], w:w };
  P.heads.push(h); return h;
}
function addBridge(A, B, w){
  var aA = platAngleTo(A, B.x, B.z), aB = platAngleTo(B, A.x, A.z);
  var ha = headAt(A, aA, w), hb = headAt(B, aB, w);
  var L = Math.hypot(hb.x-ha.x, hb.z-ha.z);
  var br = { a:ha, b:hb, L:L, w:w, sag: Math.max(1.2, L*0.045), id:BRIDGES.length };
  ha.bridge = br; hb.bridge = br;
  BRIDGES.push(br); return br;
}
/* height of a bridge deck at parameter t (0 at a, 1 at b) */
function bridgeY(br, t){ return mix(br.a.y, br.b.y, t) - br.sag*4*t*(1-t); }

/* chains of way-platforms along every main link */
LINKS.forEach(function(L, li){
  var A = L[0].plat, B = L[1].plat;
  var dx=B.x-A.x, dz=B.z-A.z, D=Math.hypot(dx,dz), ux=dx/D, uz=dz/D;
  var free = D - A.R - B.R;
  var spans = Math.max(2, Math.ceil(free/92)), m = spans-1;
  var prev = A;
  for(var i=1;i<=m;i++){
    var t = (A.R + free*i/spans)/D;
    var lat = rr(-16,16), R = rr(15,24);
    var over = riverDist(A.x+dx*t, A.z+dz*t) < 30;
    var S = addSat({ name:'Waystage '+(li+1)+'.'+i, kind:'sat', use: over?'waypost':pick(['homes','homes','mixed','farm']),
                     shape: chance(0.35)?'oval':'round', sx:1, sz:1, ry:rr(0,Math.PI),
                     x:A.x+dx*t - uz*lat, z:A.z+dz*t + ux*lat, y:mix(A.y,B.y,t)+rr(-5,5), R:R,
                     below: over ? [] : (chance(0.7) ? (chance(0.4)?['apt','apt']:['apt']) : []), link:li });
    if(S.shape==='oval'){ S.sx = rr(1.15,1.45); S.sz = 1/S.sx*rr(0.95,1.1); }
    addBridge(prev, S, 3.0);
    prev = S;
  }
  addBridge(prev, B, 3.0);
});
/* leaf satellites round each main platform: homes and farms on the near branches */
MAINS.forEach(function(P){
  var want = P.kind==='central' ? 5 : P.kind==='gate' ? 2 : ri(3,4), tries=0, made=0;
  while(made < want && tries++ < 80){
    var a = rr(0,TAU), ok = true;
    P.heads.forEach(function(h){ if(angDist(h.ang,a) < 0.55) ok=false; });
    if(!ok) continue;
    var R = rr(14,30), dist = P.R + R + rr(26,58);
    var x = P.x + Math.cos(a)*dist, z = P.z + Math.sin(a)*dist;
    PLATS.forEach(function(Q){ if(Q!==P && Math.hypot(Q.x-x,Q.z-z) < Q.R + R + 22) ok=false; });
    BRIDGES.forEach(function(b){ if(segDist(x,z,b.a.x,b.a.z,b.b.x,b.b.z) < R+8) ok=false; });
    if(!ok) continue;
    var shape = pick(['round','round','oval','square']);
    var use = pick(['homes','homes','farm','farm','mixed']);
    var S = addSat({ name:P.name+' bough '+(made+1), kind:'sat', use:use, shape:shape, ry:rr(0,Math.PI),
                     x:x, z:z, y:P.y + rr(-16,20), R:R, leafOf:P,
                     below: chance(0.75) ? (chance(0.45)?['apt','apt']:['apt']).concat(chance(0.3)?['roost']:[]) : (chance(0.4)?['roost']:[]) });
    if(shape==='oval'){ S.sx = rr(1.15,1.4); S.sz = 1/S.sx; }
    addBridge(P, S, 2.2);
    made++;
  }
});
var SATS = PLATS.filter(function(p){ return p.kind==='sat'; });

/* ============================== STAIR BAYS ==============================
   Three radial slots per main platform, as far from the bridgeheads as they
   can be. Each slot runs through every level: lane A carries the stairs
   (descending INWARD from each gallery), lane B the corridor back out. */
var LANE_W = 3.2;
function laneW(P){ return P.main ? LANE_W : 1.7; }
MAINS.forEach(function(P){
  var best=null, bs=-1;
  for(var k=0;k<48;k++){
    var a0 = k/48*TAU/3, sc = 1e9;
    for(var j=0;j<3;j++){
      var a = a0 + j*TAU/3;
      P.heads.forEach(function(h){ sc = Math.min(sc, angDist(h.ang, a)); });
    }
    if(sc > bs){ bs=sc; best=a0; }
  }
  for(var j2=0;j2<3;j2++) P.bays.push({ ang: best + j2*TAU/3, plat:P });
});
SATS.forEach(function(P){
  if(P.levels.length < 2) return;
  var a = rr(0,TAU), bs=-1;
  for(var k=0;k<24;k++){ var t=k/24*TAU, sc=1e9; P.heads.forEach(function(h){ sc=Math.min(sc,angDist(h.ang,t)); }); if(sc>bs){bs=sc;a=t;} }
  P.bays.push({ ang:a, plat:P });
});
/* stair geometry for bay B between level k and k+1 of platform P */
function stairOf(P, B, k){
  var L0 = P.levels[k], L1 = P.levels[k+1];
  var rise = L0.y - L1.y;
  var rTop = L0.Rout - L0.gw, run = P.main ? rise*1.45 : Math.min(rise*1.2, rTop - P.rt - 2.2);
  var rBot = rTop - run;
  var rm = (rTop+rBot)/2, dA = (laneW(P)*0.5+0.15)/Math.max(3,rm);
  return { rTop:rTop, rBot:rBot, yTop:L0.y, yBot:L1.y, angA:B.ang - dA, angB:B.ang + dA, run:run, rise:rise };
}
function bayHalfAngle(P, r){ return (LANE_W+0.5)/Math.max(6,r); }   /* half angular width of the whole slot at radius r */

/* ============================== DECK LOTS + ROOMS ============================== */
var LOT_KINDS_RES = ['home','home','home','fancy','fancy','shrine','shop','shop','tavern'];
function arcFree(P, r, width){
  /* angular intervals of the ring at radius r NOT taken by streets (bridgeheads + bays) */
  var cuts = [];
  P.heads.forEach(function(h){ cuts.push([h.ang, (h.w*0.5+2.4)/r]); });
  P.bays.forEach(function(b){ cuts.push([b.ang, (LANE_W+1.4)/r]); });
  cuts.sort(function(a,b){ return wrapPi(a[0]) - wrapPi(b[0]); });
  var out=[];
  for(var i=0;i<cuts.length;i++){
    var c0=cuts[i], c1=cuts[(i+1)%cuts.length];
    var a0 = wrapPi(c0[0]) + c0[1], a1 = wrapPi(c1[0]) - c1[1];
    if(i===cuts.length-1) a1 += TAU;
    if(a1 - a0 > width/r) out.push([a0,a1]);
  }
  if(!cuts.length) out.push([0,TAU]);
  return out;
}
MAINS.forEach(function(P){
  /* --- deck lots: a ring of pizza-slice buildings on the outer perimeter --- */
  var prom = P.levels[0].gw;                      /* outer promenade width */
  if(P.kind !== 'central'){
    var bd = P.kind==='rook' ? 16 : rr(13,17);
    var r1 = P.R - prom, r0 = r1 - bd;
    arcFree(P, r1, 9).forEach(function(iv){
      var arc = (iv[1]-iv[0])*r1, n = Math.max(1, Math.round(arc/rr(11,16))), da=(iv[1]-iv[0])/n;
      for(var i=0;i<n;i++){
        var gap = 0.7/r1;
        var kind = P.kind==='rook' ? pick(['barracks','barracks','armoury','mess']) :
                   P.kind==='gate' ? pick(['inn','barracks','store','home','shop']) :
                   P.kind==='spider'? pick(['home','home','silkhouse','shop','shrine']) : pick(LOT_KINDS_RES);
        P.slots.push({ plat:P, lvl:0, a0:iv[0]+i*da+gap, a1:iv[0]+(i+1)*da-gap, r0:r0 + (kind==='home'?rr(0,3):0), r1:r1,
                       y:P.y, kind:kind, floors:(kind==='fancy'||kind==='tavern'||kind==='inn'||kind==='barracks')?2:(chance(0.3)?2:1) });
      }
    });
  }
  /* --- rooms on the levels below --- */
  for(var k=1;k<P.levels.length;k++){
    var Lv = P.levels[k], rr1 = Lv.Rout - Lv.gw, rr0 = Lv.Rin;
    var want = Lv.kind==='apt' ? 8.5 : Lv.kind==='hangar' ? 15 : Lv.kind==='roost' ? 10 : 12;
    /* only the bays cut the lower levels */
    var cuts = P.bays.map(function(b){ return [wrapPi(b.ang), (LANE_W+0.9)/rr1]; }).sort(function(a,b){ return a[0]-b[0]; });
    for(var c=0;c<cuts.length;c++){
      var a0 = cuts[c][0]+cuts[c][1], a1 = cuts[(c+1)%cuts.length][0]-cuts[(c+1)%cuts.length][1];
      if(c===cuts.length-1) a1 += TAU;
      var n2 = Math.max(1, Math.round((a1-a0)*rr1/want)), da2=(a1-a0)/n2;
      for(var q=0;q<n2;q++)
        P.rooms.push({ plat:P, lvl:k, a0:a0+q*da2, a1:a0+(q+1)*da2, r0:rr0, r1:rr1, y:Lv.y, H:Lv.H, kind:Lv.kind });
    }
  }
});
/* satellites: a few free-standing lots on top, whole-ring rooms below */
SATS.forEach(function(P){
  if(P.use==='homes' || P.use==='mixed'){
    var n = P.R > 22 ? 3 : P.R > 17 ? 2 : 1, a = rr(0,TAU), placed=0, tries=0;
    while(placed<n && tries++<30){
      a += TAU/n + rr(-0.3,0.3);
      var ok=true; P.heads.forEach(function(h){ if(angDist(h.ang,a) < 0.75) ok=false; });
      if(!ok) continue;
      P.subs.push({ plat:P, ang:a, r:P.R*0.52, size:rr(5.5,8), kind:'hut' }); placed++;
    }
  }
  for(var k=1;k<P.levels.length;k++){
    var Lv=P.levels[k];
    P.rooms.push({ plat:P, lvl:k, a0:0, a1:TAU, r0:Lv.Rin, r1:Lv.Rout-Lv.gw, y:Lv.y, H:Lv.H, kind:Lv.kind, whole:true });
  }
});

/* ============================== SPIRALS: gate ramps + the council stair ============================== */
var SPIRALS = [], LIFTS = [], LADDERS = [];
function helixPoint(S, t){              /* t 0..1 from bottom to top */
  var y = mix(S.y0, S.y1, t), a = S.a0 + S.dir*S.turns*TAU*t;
  var r = trunkR(S.tree, y) + S.off;
  return { x:S.tree.x + Math.cos(a)*r, y:y, z:S.tree.z + Math.sin(a)*r, a:a, r:r };
}
[P_G1,P_G2,P_G3].forEach(function(P, gi){
  var T = P.tree, ground = T.y0 + 1.5;
  var yBot = ground + rr(31,36);                       /* "a good hundred feet or so off the ground" */
  var yTop = P.levels[P.levels.length-1].y;            /* the ramp arrives at the lowest level's gallery... */
  /* the ramp must END in lane B of bay 0 (that lane is tunnelled through to
     the trunk on a gate tree's lowest level), and should START facing away
     from the city so the landing looks out at the wild: solve the number of
     turns (2..3) that does both. */
  var dir = (gi%2?1:-1), kLow = P.levels.length-1;
  var aEnd = stairOf(P, P.bays[0], kLow-1).angB;
  var want = Math.atan2(T_C.z - T.z, T_C.x - T.x) + Math.PI;
  var fr = ((dir*(aEnd - want))/TAU) % 1; if(fr < 0) fr += 1;
  var turns = 2 + fr;
  var S = { id:SPIRALS.length, kind:'gate', tree:T, plat:P, y0:yBot, y1:yTop, turns:turns, dir:dir, a0:aEnd - dir*turns*TAU, off:3.2, w:5.2 };
  P.gatePassage = { ang:aEnd, r0:trunkR(T,yTop)+1.0, y:yTop, lvl:kLow };
  SPIRALS.push(S); P.spiral = S;
  var p0 = helixPoint(S,0);
  /* landing stage at the foot of the ramp, the beast-drawn lift and the rope ladders hang from it */
  /* the lift must drop CLEAR of the baobab's root flare (the bark pass swells the base by up to ~30%),
     so the landing stage is a broad jetty reaching out from the ramp foot to the lift */
  var liftR = Math.max(p0.r + 12.5, trunkR(T, ground)*1.32 + 7);
  var landR = (liftR - p0.r)/2 + 3.5, landC = liftR - landR - 1.6;
  S.landing = { x:T.x+Math.cos(S.a0)*landC, y:yBot, z:T.z+Math.sin(S.a0)*landC, a:S.a0, r:landR };
  var lx = T.x+Math.cos(S.a0)*liftR, lz = T.z+Math.sin(S.a0)*liftR;
  LIFTS.push({ id:LIFTS.length, plat:P, x:lx, z:lz, y0:terrainH(lx,lz)+0.3, y1:yBot, a:S.a0 });
  [-1,1].forEach(function(sg){
    var la = S.a0 + sg*0.20, x = T.x+Math.cos(la)*(liftR-2), z = T.z+Math.sin(la)*(liftR-2);
    LADDERS.push({ plat:P, x:x, z:z, y0:terrainH(x,z), y1:yBot });
  });
});
/* the council stair: round the central trunk from the plaza up to the chamber */
(function(){
  var S = { id:SPIRALS.length, kind:'council', tree:T_C, plat:P_CC, from:P_C, y0:P_C.y, y1:P_CC.y, turns:1.35, dir:1,
            a0: P_C.bays[0].ang + 0.5, off:2.6, w:3.6 };
  SPIRALS.push(S); P_CC.spiral = S;
})();

/* ============================== ROOSTS ============================== */
var ROOSTS = [];
PLATS.forEach(function(P){
  P.levels.forEach(function(Lv){
    if(Lv.kind!=='roost' && Lv.kind!=='hangar') return;
    var r = Lv.Rout - 1.2, step = Lv.kind==='hangar' ? 15 : 10.5;
    var n = Math.max(1, Math.floor(TAU*r*(P.sx+P.sz)/2/step));
    if(!P.main) n = Math.min(n, 2);
    /* the gallery posts (50-structure / 56-levels lvlPostCount): each roost sits in the MIDDLE of a gap between
       two of them, so a landing lip, and a beast walking in off it, never straddles a post */
    var np = P.main ? Math.round(TAU*Lv.Rout/5.2) : Math.max(6, Math.round(TAU*Lv.Rout/3.4)), stepA = TAU/np;
    for(var i=0;i<n;i++){
      var a = Math.round((i+0.5)/n*TAU/stepA)*stepA, skip=false;
      P.bays.forEach(function(b){ if(angDist(b.ang,a) < (LANE_W+2)/r) skip=true; });
      if(skip) continue;
      var p = platXZ(P, r, a), o = platOutDir(P, a);
      ROOSTS.push({ id:ROOSTS.length, plat:P, lvl:Lv.k, ang:a, x:p[0], y:Lv.y, z:p[1], ox:o[0], oz:o[1],
                    H:Lv.H, big:Lv.kind==='hangar' });
    }
  });
});

/* ============================== NAV GRAPH ==============================
   Nodes: {id,x,y,z,plat,lvl,tag}.  Edges: {a,b,len,kind,yfn?}.
   kinds: deck stair bridge spiral ladder ground.  Every walker reads this. */
var NAV = { nodes:[], edges:[], adj:[] };
function navNode(x,y,z,P,lvl,tag){
  var n = { id:NAV.nodes.length, x:x, y:y, z:z, plat:P?P.id:-1, lvl:lvl||0, tag:tag||'' };
  NAV.nodes.push(n); NAV.adj.push([]); return n;
}
function navEdge(a,b,kind,extra){
  if(!a || !b || a===b) return null;
  var e = { id:NAV.edges.length, a:a.id, b:b.id, kind:kind||'deck',
            len:Math.hypot(a.x-b.x, a.y-b.y, a.z-b.z) };
  if(extra) for(var k in extra) e[k]=extra[k];
  NAV.edges.push(e); NAV.adj[a.id].push(e.id); NAV.adj[b.id].push(e.id); return e;
}
function navRing(P, lvl, r, y, step, tag){
  var n = Math.max(6, Math.round(TAU*r/step)), ring=[];
  for(var i=0;i<n;i++){ var a=i/n*TAU, p=platXZ(P,r,a); var nd=navNode(p[0],y,p[1],P,lvl,tag); nd.ang=a; nd.r=r; ring.push(nd); }
  for(var j=0;j<n;j++) navEdge(ring[j], ring[(j+1)%n], 'deck');
  return ring;
}
function ringNearest(ring, ang){
  var best=ring[0], bd=1e9;
  ring.forEach(function(nd){ var d=angDist(nd.ang,ang); if(d<bd){bd=d;best=nd;} });
  return best;
}
/* insert a node ON a ring at an exact angle (so spokes are straight) */
function ringInsert(P, ring, ang, lvl, y, tag){
  var r = ring[0].r, p = platXZ(P, r, ang), nd = navNode(p[0],y,p[1],P,lvl,tag); nd.ang=ang; nd.r=r;
  /* link to the two angular neighbours */
  var lo=null, hi=null, dlo=1e9, dhi=1e9;
  ring.forEach(function(q){ var d=wrapPi(q.ang-ang); if(d<0 && -d<dlo){dlo=-d;lo=q;} if(d>=0 && d<dhi){dhi=d;hi=q;} });
  navEdge(nd, lo||ring[0], 'deck'); navEdge(nd, hi||ring[ring.length-1], 'deck');
  ring.push(nd); return nd;
}

PLATS.forEach(function(P){
  P.nav = { rings:[], heads:[], doors:[] };
  var L0 = P.levels[0];
  if(P.main || P.kind==='council'){
    if(P.kind==='council') P.holeR = P.rt + 5.2;          /* the stair comes up through this gap round the trunk */
    var inner = navRing(P, 0, P.rt + (P.kind==='council' ? 7.5 : 4.5), P.y, 11, 'trunkpath');
    var outer = navRing(P, 0, P.R - L0.gw*0.5, P.y, 13, 'promenade');
    P.nav.rings[0] = { inner:inner, outer:outer };
    /* streets: every bridgehead and every bay is a radial spoke */
    P.heads.forEach(function(h){
      var o = ringInsert(P, outer, h.ang, 0, P.y, 'street'), i2 = ringInsert(P, inner, h.ang, 0, P.y, 'street');
      var mid = platXZ(P, (P.rt+4.5 + P.R-L0.gw*0.5)/2, h.ang), m = navNode(mid[0],P.y,mid[1],P,0,'street');
      navEdge(o,m,'deck'); navEdge(m,i2,'deck');
      var hn = navNode(h.x, h.y, h.z, P, 0, 'bridgehead'); navEdge(hn, o, 'deck'); h.node = hn;
    });
    P.bays.forEach(function(B){
      /* lane B is the street proper on the deck */
      var st = P.levels.length>1 ? stairOf(P,B,0) : null, ab = st ? st.angB : B.ang;
      var o = ringInsert(P, outer, ab, 0, P.y, 'street'), i2 = ringInsert(P, inner, ab, 0, P.y, 'street');
      var mid = platXZ(P, (P.rt+4.5 + P.R-L0.gw*0.5)/2, ab), m = navNode(mid[0],P.y,mid[1],P,0,'street');
      navEdge(o,m,'deck'); navEdge(m,i2,'deck'); B.deckMid = m; B.deckOuter = o;
    });
    if(P.kind==='council'){
      /* the hall fills the ring between the two paths; its four doors are the spokes */
      P.hall = { r0:P.rt+10.5, r1:P.R-5.5, doors:[] };
      for(var hd=0; hd<4; hd++){
        var ha = P.spiral.a0 + hd*TAU/4 + 0.6;
        var ho = ringInsert(P, outer, ha, 0, P.y, 'street'), hi = ringInsert(P, inner, ha, 0, P.y, 'street');
        var hp = platXZ(P, P.hall.r1, ha), hn = navNode(hp[0],P.y,hp[1],P,0,'door');
        navEdge(ho,hn,'deck'); navEdge(hn,hi,'deck'); P.hall.doors.push(ha);
      }
    }
    /* lower galleries + stairs */
    for(var k=1;k<P.levels.length;k++){
      var Lv = P.levels[k];
      P.nav.rings[k] = { outer: navRing(P, k, Lv.Rout - Lv.gw*0.5, Lv.y, 12, 'gallery') };
    }
    P.bays.forEach(function(B){
      for(var k=0;k<P.levels.length-1;k++){
        var st = stairOf(P,B,k), Lv1 = P.levels[k+1];
        var pt = platXZ(P, st.rTop+0.6, st.angA), pb = platXZ(P, st.rBot-0.6, st.angA);
        var top = navNode(pt[0], st.yTop, pt[1], P, k, 'stairtop'), bot = navNode(pb[0], st.yBot, pb[1], P, k+1, 'stairfoot');
        navEdge(top, bot, 'stair');
        /* top joins its own level: the deck street (k=0) or the gallery ring */
        if(k===0){ navEdge(top, B.deckMid, 'deck'); navEdge(top, B.deckOuter, 'deck'); }
        else navEdge(top, ringInsert(P, P.nav.rings[k].outer, st.angA, k, st.yTop, 'gallery'), 'deck');
        /* foot -> across to lane B -> out along the corridor to the gallery below */
        var pc = platXZ(P, st.rBot-0.6, st.angB), cor = navNode(pc[0], st.yBot, pc[1], P, k+1, 'corridor');
        navEdge(bot, cor, 'deck'); (B.corridor || (B.corridor=[]))[k+1] = cor;
        navEdge(cor, ringInsert(P, P.nav.rings[k+1].outer, st.angB, k+1, Lv1.y, 'gallery'), 'deck');
      }
    });
  }else{
    /* satellites: a small ring, bridgeheads straight onto it */
    var ring = navRing(P, 0, Math.max(2.5, P.R*0.62), P.y, 9, 'satdeck');
    P.nav.rings[0] = { inner:ring, outer:ring };
    P.heads.forEach(function(h){
      var o = ringInsert(P, ring, h.ang, 0, P.y, 'street');
      var hn = navNode(h.x,h.y,h.z,P,0,'bridgehead'); navEdge(hn,o,'deck'); h.node = hn;
    });
    for(var k2=1;k2<P.levels.length;k2++){
      var Lv2 = P.levels[k2];
      P.nav.rings[k2] = { outer: navRing(P, k2, Math.max(2.2, Lv2.Rout - Lv2.gw*0.5), Lv2.y, 9, 'gallery') };
    }
    P.bays.forEach(function(B){
      for(var k=0;k<P.levels.length-1;k++){
        var st = stairOf(P,B,k);
        var pt = platXZ(P, st.rTop, st.angA), pb = platXZ(P, st.rBot, st.angA);
        var top = navNode(pt[0], st.yTop, pt[1], P, k, 'stairtop'), bot = navNode(pb[0], st.yBot, pb[1], P, k+1, 'stairfoot');
        navEdge(top, bot, 'stair');
        navEdge(top, ringNearest(k===0?ring:P.nav.rings[k].outer, st.angA), 'deck');

/* ============================== NIGHT LIGHT VOLUME ==============================

      BEAM(q0[0],P.y+1.0,q0[1], q1[0],P.y+1.0,q1[1], 0.10,0.10, TIMBERC[0], 'timber');
      for(var s=0;s<=3;s++){ var qx=mix(q0[0],q1[0],s/3), qz=mix(q0[1],q1[1],s/3); BOX(qx,P.y,qz,0.14,1.05,0.14,-a,TIMBERC[1],'timber'); }
    });
    var e0=platXZ(P,st.rBot-0.1,st.angA-ha), e1=platXZ(P,st.rBot-0.1,st.angA+ha);
    BEAM(e0[0],P.y+1.0,e0[1], e1[0],P.y+1.0,e1[1], 0.10,0.10, TIMBERC[0], 'timber');
  });
  REGISTER({ name:P.name, kind:P.kind, label:'Deck', plat:P.id, x:P.x, z:P.z, y:P.y-SLAB, h:SLAB+30, r:P.R+1 });

  /* --- the levels below --- */
  for(var k=1;k<P.levels.length;k++){
    var Lv = P.levels[k], last = (k===P.levels.length-1);
    var rin = last ? Math.max(1, trunkR(T,Lv.y)-1.0) : Lv.Rin-0.4;
    RING_HOLES('plank', P, rin, Lv.Rout, Lv.y-SLAB, Lv.y, plankB, wellsFor(P,k), { colTop:shade(plankA,-0.06), step:5 });
    SECTOR('timber', P, Lv.Rout, Lv.Rout+0.3, 0, TAU, Lv.y-SLAB-0.35, Lv.y+0.08, TIMBERC[2], { step:5 });
    /* core wall behind the rooms; a gate tree's lowest level is tunnelled through at the ramp */
    var coreCol = shade(pick(WALLDARKC), -0.25);
    if(P.gatePassage && last){
      var ga = P.gatePassage.ang, gh = (LANE_W*0.5+0.4)/Lv.Rin;
      SECTOR('wall', P, Lv.Rin-0.35, Lv.Rin, ga+gh, ga-gh+TAU, Lv.y, Lv.y+Lv.H, coreCol, { faces:'os', step:5 });
      /* passage walls back to the trunk */
      [ga-gh, ga+gh].forEach(function(a){
        var w0=platXZ(P, P.gatePassage.r0-1.5, a), w1=platXZ(P, Lv.Rin, a);
        BOX((w0[0]+w1[0])/2, Lv.y, (w0[1]+w1[1])/2, Math.hypot(w1[0]-w0[0],w1[1]-w0[1]), Lv.H, 0.3, Math.atan2(-(w1[1]-w0[1]), w1[0]-w0[0]), coreCol, 'wall');
      });
    }else SECTOR('wall', P, Lv.Rin-0.35, Lv.Rin, 0, TAU, Lv.y, Lv.y+Lv.H, coreCol, { faces:'o', step:5 });
    /* gallery posts carry the floor above */
    var open = (Lv.kind==='roost' || Lv.kind==='hangar');
    var np = Math.round(TAU*Lv.Rout/(open ? 5.2 : 3.9));
    for(var i=0;i<np;i++){ var a=(i+0.5)/np*TAU, p=platXZ(P, Lv.Rout-0.35, a);
      BOX(p[0], Lv.y, p[1], open?0.55:0.30, Lv.H, open?0.55:0.30, -a, TIMBERC[i%4], 'timber'); STRUCT.posts++; }
    if(!open) railing(P, Lv.Rout-0.25, Lv.y, [], 3.9);
    /* radial partitions at every room boundary */
    var seen = {};
    P.rooms.forEach(function(R){
      if(R.lvl!==k) return;
      [R.a0, R.a1].forEach(function(a){
        var key = Math.round(wrapPi(a)*400); if(seen[key]) return; seen[key]=1;
        var th = 0.14/((R.r0+R.r1)/2);
        SECTOR('wall', P, R.r0, R.r1 - (open?3.5:0), a-th, a+th, Lv.y, Lv.y+Lv.H, pick(WALLDARKC), { faces:'os', step:30 });
      });
    });
    REGISTER({ name:P.name, kind:Lv.kind, label:Lv.label, plat:P.id, lvl:k, x:P.x, z:P.z, y:Lv.y-SLAB, h:Lv.H+SLAB, r:Lv.Rout+1 });
  }
  P.bays.forEach(function(B){ for(var k=0;k<P.levels.length-1;k++) buildStair(P,B,k); });

  /* --- under-struts: great raking timbers from the trunk up to the underside --- */
  if(P.levels.length > 1 || isCouncil){
    var Lb = P.levels[P.levels.length-1], yb = Lb.y - SLAB, ns = isCouncil ? 10 : Math.round(TAU*Lb.Rout/24);
    var drop = isCouncil ? 16 : Math.min(38, Lb.Rout*0.42);
    for(var s=0;s<ns;s++){
      var sa = (s+0.5)/ns*TAU + 0.11, rt2 = trunkR(T, yb-drop) - 0.5;
      var a0 = platXZ(P, rt2, sa), a1 = platXZ(P, Lb.Rout-3.5, sa), am = platXZ(P, (rt2+Lb.Rout)*0.5, sa);
      BEAM(a0[0], yb-drop, a0[1], a1[0], yb-0.2, a1[1], 1.1, 1.1, TIMBERC[s%4], 'timber');
      BEAM(a0[0], yb-drop*0.45, a0[1], am[0], yb-0.2, am[1], 0.7, 0.7, TIMBERC[(s+1)%4], 'timber');
      STRUCT.struts += 2;
    }
    /* a collar ring round the trunk where the struts spring from */
    var rc = trunkR(T, yb-drop);
    SECTOR('timber', platFrame(T.x,T.z,0), rc-0.4, rc+0.9, 0, TAU, yb-drop-1.2, yb-drop+0.6, TIMBERC[2], { step:6 });
  }
}

/* ------------------------------------------------------------------ satellites */
function buildSat(P){
  var plankA = pick(PLANKC), plankB = shade(plankA,-0.14);
  RING_HOLES('plank', P, 0, P.R, P.y-0.5, P.y, plankB, wellsFor(P,0), { colTop:plankA, step:3.2 });
  var gaps = P.heads.map(function(h){ return [h.ang, (h.w*0.5+0.45)/(P.R*0.9)]; });
  railing(P, P.R-0.2, P.y, gaps, 2.6);
  for(var k=1;k<P.levels.length;k++){
    var Lv=P.levels[k], open=(Lv.kind==='roost');
    RING_HOLES('plank', P, 0, Lv.Rout, Lv.y-0.5, Lv.y, plankB, wellsFor(P,k), { colTop:shade(plankA,-0.06), step:3.2 });
    var np = Math.max(6, Math.round(TAU*Lv.Rout/3.4));
    for(var i=0;i<np;i++){ var a=(i+0.5)/np*TAU, p=platXZ(P, Lv.Rout-0.3, a); BOX(p[0],Lv.y,p[1],0.24,Lv.H+0.3,0.24,-a,TIMBERC[i%4],'timber'); }
    if(!open) railing(P, Lv.Rout-0.2, Lv.y, [], 2.8);
    REGISTER({ name:P.name, kind:Lv.kind, label:Lv.label, plat:P.id, lvl:k, x:P.x, z:P.z, y:Lv.y-0.5, h:Lv.H+0.5, r:Lv.Rout+0.6 });
  }
  P.bays.forEach(function(B){ for(var k=0;k<P.levels.length-1;k++) buildStair(P,B,k); });
  /* king post and cradle */
  CYL(P.x, P.yBottom-1.2, P.z, 0.55, P.y - P.yBottom + 1.2, 0, TIMBERC[0], 'timber');
  for(var c=0;c<3;c++){ var ca=c/3*Math.PI + P.ry, R2=P.levels[P.levels.length-1].Rout*0.8;
    BEAM(P.x-Math.cos(ca)*R2, P.yBottom-0.55, P.z-Math.sin(ca)*R2, P.x+Math.cos(ca)*R2, P.yBottom-0.55, P.z+Math.sin(ca)*R2, 0.5,0.5, TIMBERC[2], 'timber'); }
  if(P.support==='over' && P.supPts){
    /* slung beneath a bough: a rope from each rim quarter up to the two hanging points, plus a king rope */
    for(var q0=0;q0<6;q0++){ var qa0=q0/6*TAU+0.3, pr0=platXZ(P,P.R*0.88,qa0), hp=P.supPts[q0%2];
      ROD(pr0[0],P.y+0.1,pr0[1], hp[0],hp[1],hp[2], 0.07, ROPEC[1], 'rope'); }
    P.supPts.forEach(function(hp){ ROD(P.x,P.y+0.2,P.z, hp[0],hp[1],hp[2], 0.10, ROPEC[0], 'rope');
      SECTOR('rope', platFrame(hp[0],hp[2],0), 0, 1, 0, TAU, hp[1]-0.4, hp[1]+0.5, ROPEC[1], {faces:'tbo', step:1}); });
  }
  if(P.support==='under'){
    /* a saddle of cribbed timbers where the platform sits on its bough */
    for(var cb=0;cb<3;cb++) BOX(P.x, P.yBottom-1.9+cb*0.45, P.z, 6-cb*1.2, 0.42, 6-cb*1.2, P.ry+cb*0.78, TIMBERC[cb], 'timber');
  }
  if(P.support==='hang'){
    /* no branch in reach: slung on four cables from the nearest crown */
    var Tn=null, bd=1e9; TREES.forEach(function(T){ var d=Math.hypot(T.x-P.x,T.z-P.z); if(d<bd){bd=d;Tn=T;} });
    var ty = Math.max(P.y+55, Tn.y0+Tn.H*0.80), tr = trunkR(Tn,ty);
    for(var q=0;q<4;q++){ var qa=q/4*TAU+0.4, pr=platXZ(P,P.R*0.85,qa);
      var dx=P.x-Tn.x, dz=P.z-Tn.z, dl=Math.hypot(dx,dz)||1;
      ROD(pr[0],P.y+0.2,pr[1], Tn.x+dx/dl*tr, ty, Tn.z+dz/dl*tr, 0.09, ROPEC[1], 'rope'); }
  }
  REGISTER({ name:P.name, kind:'sat', label:'Bough platform', plat:P.id, x:P.x, z:P.z, y:P.y-0.5, h:14, r:P.R*Math.max(P.sx,P.sz)+0.6 });
}

/* ------------------------------------------------------------------ rope bridges */
function buildBridge(br){
  var ax=br.a.x, az=br.a.z, bx=br.b.x, bz=br.b.z, dx=bx-ax, dz=bz-az, L=br.L, ux=dx/L, uz=dz/L;
  var ry = Math.atan2(ux,uz), n = Math.max(4, Math.round(L/0.55)), pc = pick(PLANKC);
  var sx = uz*(br.w*0.5), sz = -ux*(br.w*0.5);
  for(var i=0;i<n;i++){
    var t=(i+0.5)/n, y=bridgeY(br,t), slope=(bridgeY(br,t+0.01)-bridgeY(br,t-0.01))/(0.02*L);
    BOX(ax+dx*t, y-0.09, az+dz*t, br.w, 0.08, L/n*0.80, [-Math.atan(slope), ry, 0], (i%7===3)?shade(pc,-0.15):pc, 'plank'); STRUCT.planks++;
  }
  var m = Math.max(3, Math.round(L/3.2));
  for(var j=0;j<m;j++){
    var t0=j/m, t1=(j+1)/m, y0=bridgeY(br,t0), y1=bridgeY(br,t1);
    [-1,1].forEach(function(sg){
      var x0=ax+dx*t0+sx*sg, z0=az+dz*t0+sz*sg, x1=ax+dx*t1+sx*sg, z1=az+dz*t1+sz*sg;
      ROD(x0,y0-0.12,z0, x1,y1-0.12,z1, 0.07, ROPEC[1], 'rope');          /* deck cable */
      ROD(x0,y0+1.15,z0, x1,y1+1.15,z1, 0.05, ROPEC[0], 'rope');          /* hand rope */
      ROD(x0,y0+0.60,z0, x1,y1+0.60,z1, 0.03, ROPEC[0], 'rope');
      ROD(x1,y1-0.12,z1, x1,y1+1.15,z1, 0.025, ROPEC[1], 'rope');         /* suspender */
      var xm=(x0+x1)/2, zm=(z0+z1)/2, ym=(y0+y1)/2;
      ROD(xm,ym-0.12,zm, xm,ym+1.15,zm, 0.025, ROPEC[1], 'rope');
    });
  }
  /* portal posts at both heads */
  [br.a, br.b].forEach(function(h){
    [-1,1].forEach(function(sg){
      BOX(h.x+sx*sg*1.08, h.y, h.z+sz*sg*1.08, 0.34, 3.1, 0.34, ry, TIMBERC[0], 'timber');
    });
    BEAM(h.x+sx*1.08, h.y+2.9, h.z+sz*1.08, h.x-sx*1.08, h.y+2.9, h.z-sz*1.08, 0.26, 0.26, TIMBERC[2], 'timber');
    h.lampAt = [h.x, h.y+2.55, h.z];                                       /* 72-lights.js hangs a lantern here */
  });
  REGISTER({ name:'Rope bridge', kind:'bridge', label:br.a.plat.name+' ↔ '+br.b.plat.name, x:(ax+bx)/2, z:(az+bz)/2,
             y:Math.min(br.a.y,br.b.y)-br.sag-0.5, h:br.sag+3, r:Math.max(3,L*0.5), bridge:br.id, seg:[ax,az,bx,bz,br.w] });
}

/* ------------------------------------------------------------------ helical ramps */
function buildSpiral(S){
  var gate = S.kind==='gate', T=S.tree, n = Math.round(S.turns*(gate?44:36)), pc = pick(PLANKC), prev=null;
  for(var i=0;i<=n;i++){
    var t=i/n, y=mix(S.y0,S.y1,t), a=S.a0+S.dir*S.turns*TAU*t, rt=trunkR(T,y);
    var ri=rt-0.5, ro=rt+S.off+S.w*0.5;
    var cur = { y:y, a:a, i:[T.x+Math.cos(a)*ri, T.z+Math.sin(a)*ri], o:[T.x+Math.cos(a)*ro, T.z+Math.sin(a)*ro] };
    if(prev){
      var A=prev, B=cur, cw = S.dir>0;
      var ti=[A.i[0],A.y,A.i[1]], to=[A.o[0],A.y,A.o[1]], ui=[B.i[0],B.y,B.i[1]], uo=[B.o[0],B.y,B.o[1]];
      var th=0.45, bi=[A.i[0],A.y-th,A.i[1]], bo=[A.o[0],A.y-th,A.o[1]], ci=[B.i[0],B.y-th,B.i[1]], co=[B.o[0],B.y-th,B.o[1]];
      if(cw){ MQUAD('plank',ti,ui,uo,to,(i%2)?pc:shade(pc,-0.07)); MQUAD('plank',bi,bo,co,ci,shade(pc,-0.35)); MQUAD('plank',bo,to,uo,co,shade(pc,-0.2)); }
      else  { MQUAD('plank',ti,to,uo,ui,(i%2)?pc:shade(pc,-0.07)); MQUAD('plank',bi,ci,co,bo,shade(pc,-0.35)); MQUAD('plank',bo,co,uo,to,shade(pc,-0.2)); }
      /* outer rail */
      ROD(A.o[0],A.y+1.1,A.o[1], B.o[0],B.y+1.1,B.o[1], 0.045, ROPEC[0], 'rope');
      ROD(A.o[0],A.y+0.55,A.o[1], B.o[0],B.y+0.55,B.o[1], 0.03, ROPEC[0], 'rope');
      if(i%2===0) BOX(B.o[0],B.y,B.o[1],0.18,1.15,0.18,-a,TIMBERC[1],'timber');
      /* knee braces back into the trunk under the ledge */
      if(i%3===0){ var kb=trunkR(T,y-3.2)-0.4; BEAM(T.x+Math.cos(a)*kb, y-3.4, T.z+Math.sin(a)*kb, cur.o[0]-Math.cos(a)*0.6, y-th, cur.o[1]-Math.sin(a)*0.6, 0.35,0.35, TIMBERC[2], 'timber'); }
    }
    prev = cur;
  }
  if(gate){
    var Ld=S.landing, F=platFrame(Ld.x,Ld.z,0);
    SECTOR('plank', F, 0, Ld.r, 0, TAU, Ld.y-0.6, Ld.y, shade(pc,-0.12), { colTop:pc, step:3, faces:'tbo' });
    /* rail, open toward the lift (outward) and the ramp (toward the trunk) */
    railing(F, Ld.r-0.2, Ld.y, [[Ld.a, 0.55],[Ld.a+Math.PI, 0.9]], 2.4);
    /* raking struts from the trunk out under the jetty: an inner and an outer fan */
    for(var s=0;s<9;s++){ var fa=S.a0+(s-4)*0.085, fr=(s%2)?0.97:0.70, drop=(s%2)?40:26;
      var rr0=trunkR(T,Ld.y-drop)-0.4, tx=T.x+Math.cos(fa)*rr0, tz=T.z+Math.sin(fa)*rr0;
      var ex=Ld.x+Math.cos(S.a0)*Ld.r*(fr*2-1)+(-Math.sin(S.a0))*(s-4)*Ld.r*0.17, ez=Ld.z+Math.sin(S.a0)*Ld.r*(fr*2-1)+Math.cos(S.a0)*(s-4)*Ld.r*0.17;
      BEAM(tx, Ld.y-drop, tz, ex, Ld.y-0.6, ez, 0.7,0.7, TIMBERC[s%4], 'timber'); }
    REGISTER({ name:S.plat.name, kind:'landing', label:'Landing stage (lift & ladders)', x:Ld.x, z:Ld.z, y:Ld.y-0.6, h:9, r:Ld.r+0.5 });
    REGISTER({ name:S.plat.name, kind:'ramp', label:'Gate ramp', x:T.x, z:T.z, y:S.y0-1, h:S.y1-S.y0+4, r:trunkR(T,S.y0)+S.off+S.w });
  }else{
    REGISTER({ name:'Council stair', kind:'ramp', label:'Stair to the Council Chamber', x:T.x, z:T.z, y:S.y0, h:S.y1-S.y0, r:trunkR(T,S.y0)+S.off+S.w });
  }
}
function buildLift(Lf){
  /* a timber headframe cantilevered off the landing; the cage itself is animated by the life pass */
  var ox=Math.cos(Lf.a), oz=Math.sin(Lf.a), px=-oz, pz=ox, top=Lf.y1+7.5;
  [-1,1].forEach(function(sg){
    BOX(Lf.x+px*2.2*sg - ox*3.0, Lf.y1-0.4, Lf.z+pz*2.2*sg - oz*3.0, 0.45, 8.0, 0.45, -Lf.a, TIMBERC[0], 'timber');
    BEAM(Lf.x+px*2.2*sg - ox*3.0, top-0.3, Lf.z+pz*2.2*sg - oz*3.0, Lf.x+px*2.2*sg + ox*1.2, top-0.3, Lf.z+pz*2.2*sg + oz*1.2, 0.4,0.4, TIMBERC[2], 'timber');
    /* guide ropes to the ground */
    ROD(Lf.x+px*1.7*sg, Lf.y0, Lf.z+pz*1.7*sg, Lf.x+px*1.7*sg, top-0.3, Lf.z+pz*1.7*sg, 0.05, ROPEC[1], 'rope');
  });
  BEAM(Lf.x+px*2.4, top, Lf.z+pz*2.4, Lf.x-px*2.4, top, Lf.z-pz*2.4, 0.5,0.5, TIMBERC[1], 'timber');
  CYL(Lf.x, top-0.9, Lf.z, 0.7, 0.5, 0, TIMBERC[3], 'timber');               /* sheave */
  /* the windlass yard at the foot: a capstan the draught-beast walks round */
  CYL(Lf.x+ox*9, Lf.y0, Lf.z+oz*9, 1.1, 2.2, 0, TIMBERC[0], 'timber');
  BEAM(Lf.x+ox*9-px*5, Lf.y0+1.6, Lf.z+oz*9-pz*5, Lf.x+ox*9+px*5, Lf.y0+1.6, Lf.z+oz*9+pz*5, 0.3,0.3, TIMBERC[2], 'timber');
  ROD(Lf.x+ox*9, Lf.y0+2.0, Lf.z+oz*9, Lf.x+ox*0.6, top-0.6, Lf.z+oz*0.6, 0.06, ROPEC[0], 'rope');
  Lf.capstan = { x:Lf.x+ox*9, z:Lf.z+oz*9, y:Lf.y0, r:5 };
  REGISTER({ name:Lf.plat.name, kind:'lift', label:'Beast-drawn lift', x:Lf.x, z:Lf.z, y:Lf.y0, h:top-Lf.y0, r:3.2 });
  REGISTER({ name:Lf.plat.name, kind:'capstan', label:'Lift capstan', x:Lf.capstan.x, z:Lf.capstan.z, y:Lf.y0, h:4, r:6 });
}
function buildLadder(Ld){
  var a = Math.atan2(Ld.z-Ld.plat.z, Ld.x-Ld.plat.x), px=-Math.sin(a)*0.32, pz=Math.cos(a)*0.32;
  ROD(Ld.x+px,Ld.y0,Ld.z+pz, Ld.x+px,Ld.y1+0.2,Ld.z+pz, 0.05, ROPEC[0], 'rope');
  ROD(Ld.x-px,Ld.y0,Ld.z-pz, Ld.x-px,Ld.y1+0.2,Ld.z-pz, 0.05, ROPEC[0], 'rope');
  for(var y=Ld.y0+0.4; y<Ld.y1; y+=0.45) ROD(Ld.x+px,y,Ld.z+pz, Ld.x-px,y,Ld.z-pz, 0.035, TIMBERC[3], 'timber');
  REGISTER({ name:Ld.plat.name, kind:'ladder', label:'Rope ladder', x:Ld.x, z:Ld.z, y:Ld.y0, h:Ld.y1-Ld.y0, r:1.2 });
}

PLATS.forEach(function(P){ if(P.main || P.kind==='council') buildMain(P); else buildSat(P); });
BRIDGES.forEach(buildBridge);
SPIRALS.forEach(buildSpiral);
LIFTS.forEach(buildLift);
LADDERS.forEach(buildLadder);

/* ------------------------------------------------------------------ small helpers */
function v3(P,r,a,y){ var p=platXZ(P,r,a); return [p[0],y,p[1]]; }

/* general hipped frustum roof on a polar rectangle. Bottom R0..R1 x A0..A1 at yb,

/* ------------------------------------------------------------------ names */
var N_ADJ = ['Gilded','Crooked','Laughing','Drowsy','Scarlet','Hollow','Windward','Mossy','Brass','Painted','Lucky','Wandering','Seventh','Old','Singing','Tarred'];

function doorAt(P,r,a,y,sgn,w,h,colDoor,colFrame){

function buildLot(P,S,bias){
  var kind=S.kind, y=S.y, a0=S.a0, a1=S.a1, r0=S.r0, r1=S.r1, am=(a0+a1)/2, fl=S.floors;
  var FH=4.2, H=fl*FH, arcO=(a1-a0)*r1, dep=r1-r0, rm=(r0+r1)/2;
  var military=(kind==='barracks'||kind==='armoury'||kind==='mess');
  var cool=(kind==='silkhouse'||kind==='shrine'|| (P.kind==='spider' && chance(0.5)));
  var C=fr(P,rm,am);
  ARCH.byKind[kind]=(ARCH.byKind[kind]||0)+1; ARCH.buildings++;

  /* ---------- nature shrine: open pavilion, tiered stave roof ---------- */
  if(kind==='shrine'){
    ARCH.shrines++;

    faceBox(P,sr0-0.6,am,y,2.4,0.2,1.0,PLANKC[3],'plank'); faceBox(P,sr1+0.6,am,y,2.4,0.2,1.0,PLANKC[3],'plank');
    var npA=Math.max(3,Math.round((sa1-sa0)*sr1/3.4)), npR=3;
    for(var i=0;i<=npA;i++){ var pa=sa0+(sa1-sa0)*i/npA+ (i===0?0.25/sr1:i===npA?-0.25/sr1:0);
      if(npA%2===0 && i===npA/2) continue;
      faceBox(P,sr1-0.25,pa,y+0.4,0.34,PH,0.34,(i%2)?red:tc); faceBox(P,sr0+0.25,pa,y+0.4,0.34,PH,0.34,(i%2)?tc:red); }
    for(var j=1;j<npR;j++){ var pr=mix(sr0,sr1,j/npR); faceBox(P,pr,sa0+0.25/pr,y+0.4,0.3,PH,0.3,tc); faceBox(P,pr,sa1-0.25/pr,y+0.4,0.3,PH,0.3,tc); }
    SECTOR('timber',P,sr0,sr1,sa0,sa1,y+0.4+PH-0.35,y+0.4+PH,tc,{faces:'ios'});
    /* low rail between posts on the sides */
    var yb=y+0.4+PH, R0=sr0-1.0,R1=sr1+0.9,A0=sa0-0.6/rm,A1=sa1+0.6/rm, dA=A1-A0, dR=R1-R0, sc=pick(SHINGLEC), yy=yb;
    var ins=[0,0.2,0.34], hs=[2.6,2.6];
    for(var t=0;t<3;t++){
      var b0=R0+dR*ins[t]-(t?0.55:0), b1=R1-dR*ins[t]+(t?0.55:0), ba0=A0+dA*ins[t]-(t?0.55/rm:0), ba1=A1-dA*ins[t]+(t?0.55/rm:0);
      if(t<2){ var ni=ins[t+1]; roofFr('shingle',P,b0,b1,ba0,ba1,yy, R0+dR*ni,R1-dR*ni,A0+dA*ni,A1-dA*ni,yy+hs[t],shade(sc,-0.06*t),{soffit:true});
        yy+=hs[t]; SECTOR('wall',P,R0+dR*ni,R1-dR*ni,A0+dA*ni,A1-dA*ni,yy-0.05,yy+0.9,WALLDARKC[1],{faces:'ios'}); yy+=0.85; }
      else { var rA=am-dA*0.08, rB=am+dA*0.08; roofFr('shingle',P,b0,b1,ba0,ba1,yy, rm,rm,rA,rB,yy+4.4,shade(sc,-0.12),{soffit:true});
        ridgeAndFinials(P,rm,rA,rB,yy+4.4,ORNATEC[1],1.0); yy+=4.4; }
    }
    /* the living heart: a sapling or a standing stone */
    if(chance(0.55)){ CYL(C.x,y+0.4,C.z,0.16,2.2,0,TIMBERC[0],'timber'); bush(C.x,y+2.0,C.z,1.3,1.9,PAL.sapling[0]); bush(C.x+0.5,y+1.5,C.z-0.4,0.8,1.2,PAL.sapling[1]);
      SECTOR('plank',platFrame(C.x,C.z,0),1.0,1.3,0,TAU,y+0.4,y+0.75,PLANKC[2],{faces:'tio',step:1.4}); }
    else { mCone('wall',C.x,y+0.4,C.z,0.85,0.5,2.7,shade(ROCKC[0],0.05),6,am); mCone('wall',C.x,y+3.1,C.z,0.5,0.05,0.5,ROCKC[2],6,am);
      for(var k=0;k<5;k++){ var ka=k/5*TAU; pod(C.x+Math.cos(ka)*1.3,y+0.5,C.z+Math.sin(ka)*1.3,0.16,FRUITC[k%3]); } }
    lamp(C.x+C.tx*2.2,y+3.2,C.z+C.tz*2.2,0.9,14,true,0.9); lamp(C.x-C.tx*2.2,y+3.2,C.z-C.tz*2.2,0.9,14,true,0.9);
    var fo=fr(P,sr1+0.3,am+1.6/sr1); lamp(fo.x,y+2.6,fo.z,0.7,11,true,0);

  var wcol = kind==='silkhouse' ? shade(WALLC[4],0.28) : dark ? pick(WALLDARKC) : pick(WALLC);
  if(kind==='fancy') wcol=shade(pick(WALLC),0.08);
  var tcol = dark ? shade(TIMBERC[2],-0.2) : pick(TIMBERC), trim = kind==='fancy' ? ORNATEC[0] : tcol;
  if(wr0>r0 || wr1<r1){

    if(fl>1) SECTOR('wall',P,r0,r1,a0,a1,y+FH,y+H,shade(wcol,0.04),{faces:'iosb'});
  }else SECTOR('wall',P,r0,r1,a0,a1,y,y+H,wcol,{faces:'ios'});

  SECTOR('timber',P,wr0-0.1,wr1+0.1,a0-0.1/rm,a1+0.1/rm,y,y+0.34,tcol,{faces:'ios'});
  SECTOR('timber',P,r0-0.12,r1+0.12,a0-0.12/rm,a1+0.12/rm,y+H-0.32,y+H,tcol,{faces:'ios'});
  if(fl>1) SECTOR('timber',P,r0-0.14,r1+0.14,a0-0.14/rm,a1+0.14/rm,y+FH-0.15,y+FH+0.2,trim,{faces:'ios'+((veranda||shopfront)?'b':'')});

  /* posts + windows: the outer face is divided into an odd number of bays, door in the middle one */
  var nO=Math.max(3,Math.round(arcO/3.3)); if(nO%2===0) nO+= (arcO/3.3>nO?1:-1);
  var nI=3, pw=military?0.26:0.34, frameCol=shade(tcol,-0.25);
  for(var i2=0;i2<=nO;i2++){
    var pa2=a0+(a1-a0)*i2/nO; pa2 += (i2===0?0.12/r1:i2===nO?-0.12/r1:0);
    faceBox(P,r1+0.02,pa2,y,pw,H,pw,(kind==='fancy'&&i2%2)?ORNATEC[0]:tcol);
    if(military && i2<nO && i2!==(nO-1)/2){ faceBox(P,r1+0.02,pa2+(a1-a0)/nO*0.25,y,0.16,H,0.16,tcol); faceBox(P,r1+0.02,pa2+(a1-a0)/nO*0.75,y,0.16,H,0.16,tcol); }
  }
  for(var i3=0;i3<=nI;i3++){
    var pa3=a0+(a1-a0)*i3/nI; pa3 += (i3===0?0.12/r0:i3===nI?-0.12/r0:0);
    faceBox(P,r0-0.02,pa3,y,pw,H,pw,(veranda&&i3%3)?ORNATEC[0]:tcol);
  }
  for(var f2=0;f2<fl;f2++){
    var wy=y+f2*FH+2.15;
    for(var w2=0;w2<nO;w2++){

  doorAt(P,wr0,am,y,-1,bigDoor?2.2:1.25,bigDoor?2.9:2.3,dcol,trim);
  if(!shopfront) doorAt(P,wr1,am,y,1,bigDoor?2.2:1.25,bigDoor?2.9:2.3,dcol,trim);

  /* ---------- roof ---------- */
  var style = kind==='fancy' ? 'joglo' : military ? (chance(0.6)?'stave':'hip') : kind==='silkhouse' ? (chance(0.5)?'joglo':'hip')

/* rejection-sampled placement in an annulus of a main platform */
function tryPlace(P,rA,rB,ext,segs,placed,tries,test){
  for(var t=0;t<tries;t++){
    var r=Math.sqrt(rr(rA*rA,rB*rB)), a=rr(0,TAU);
    if(r-ext<rA || r+ext>rB) continue;
    if(streetHit(P,r,a,ext)) continue;
    var p=platXZ(P,r,a);
    if(segs && pathHit(segs,p[0],p[1],ext)) continue;
    if(test && !test(r,a,p)) continue;
    var ok=true; for(var i=0;i<placed.length && ok;i++) if(Math.hypot(placed[i].x-p[0],placed[i].z-p[1]) < placed[i].ext+ext+0.9) ok=false;
    if(!ok) continue;
    var o=platOutDir(P,a); placed.push({x:p[0],z:p[1],ext:ext});
    return { r:r, a:a, x:p[0], z:p[1], ox:o[0], oz:o[1] };
  }
  return null;
}

  if(mode==='in') return FRM(pl.x,pl.z,-pl.ox,-pl.oz); if(mode==='out') return FRM(pl.x,pl.z,pl.ox,pl.oz);

  if(nx*mx+ny*my+nz*mz >= 0) MTRI(fam,a,b,c,col); else MTRI(fam,a,c,b,col);
}
/* yawed box, y = base. local +x -> (cos ry, -sin ry), local +z -> (sin ry, cos ry). faces: t b f(+x) k(-x) l(+z) r(-z) */
function lvlBox(fam,x,y,z,w,h,d,ry,col,faces){
  faces = faces || 'tfklr';
  var c=Math.cos(ry), s=Math.sin(ry), hx=w/2, hz=d/2, ref=[x,y+h/2,z];
  function P(lx,ly,lz){ return [x+lx*c+lz*s, y+ly, z-lx*s+lz*c]; }
  var c2 = shade(col,-0.14);
  if(faces.indexOf('t')>=0) lvlQ(fam,P(-hx,h,-hz),P(hx,h,-hz),P(hx,h,hz),P(-hx,h,hz),col,ref);
  if(faces.indexOf('b')>=0) lvlQ(fam,P(-hx,0,-hz),P(hx,0,-hz),P(hx,0,hz),P(-hx,0,hz),shade(col,-0.3),ref);
  if(faces.indexOf('f')>=0) lvlQ(fam,P(hx,0,-hz),P(hx,0,hz),P(hx,h,hz),P(hx,h,-hz),col,ref);
  if(faces.indexOf('k')>=0) lvlQ(fam,P(-hx,0,-hz),P(-hx,0,hz),P(-hx,h,hz),P(-hx,h,-hz),c2,ref);
  if(faces.indexOf('l')>=0) lvlQ(fam,P(-hx,0,hz),P(hx,0,hz),P(hx,h,hz),P(-hx,h,hz),c2,ref);
  if(faces.indexOf('r')>=0) lvlQ(fam,P(-hx,0,-hz),P(hx,0,-hz),P(hx,h,-hz),P(-hx,h,-hz),c2,ref);
}
/* box from a to b (no roll), merged. caps optional */
function lvlBeam(fam,a,b,w,d,col,caps){
  var dx=b[0]-a[0], dy=b[1]-a[1], dz=b[2]-a[2], L=Math.hypot(dx,dy,dz); if(L<1e-4) return;
  dx/=L; dy/=L; dz/=L;
  var xx=dz, xz=-dx, xl=Math.hypot(xx,xz);              /* X = up x Y (horizontal) */
  if(xl<1e-5){ xx=1; xz=0; xl=1; } xx/=xl; xz/=xl;
  var zx = -xz*dy, zy = xz*dx - xx*dz, zz = xx*dy;      /* Z = X x Y */
  var ref=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2], hw=w/2, hd=d/2;
  function C(p,sx,sz){ return [p[0]+xx*hw*sx+zx*hd*sz, p[1]+zy*hd*sz, p[2]+xz*hw*sx+zz*hd*sz]; }
  var c2=shade(col,-0.14);
  lvlQ(fam,C(a,-1,-1),C(a,1,-1),C(b,1,-1),C(b,-1,-1),c2,ref);
  lvlQ(fam,C(a,-1,1),C(a,1,1),C(b,1,1),C(b,-1,1),col,ref);
  lvlQ(fam,C(a,-1,-1),C(a,-1,1),C(b,-1,1),C(b,-1,-1),col,ref);
  lvlQ(fam,C(a,1,-1),C(a,1,1),C(b,1,1),C(b,1,-1),c2,ref);
  if(caps){ lvlQ(fam,C(b,-1,-1),C(b,1,-1),C(b,1,1),C(b,-1,1),col,ref); lvlQ(fam,C(a,-1,-1),C(a,1,-1),C(a,1,1),C(a,-1,1),col,ref); }
}
function lvlDisc(fam,x,y,z,r,col,seg){
  seg=seg||6;
  for(var i=0;i<seg;i++){ var A=i/seg*TAU, B=(i+1)/seg*TAU;
    lvlT(fam,[x,y,z],[x+Math.cos(A)*r,y,z+Math.sin(A)*r],[x+Math.cos(B)*r,y,z+Math.sin(B)*r],col,[x,y-5,z]); }
}
function lvlDrum(fam,x,y,z,r,h,col,seg,rTop,topCol){
  seg=seg||6; var rt = rTop==null ? r : rTop, c2=shade(col,-0.12), ref=[x,y+h/2,z];
  for(var i=0;i<seg;i++){ var A=i/seg*TAU, B=(i+1)/seg*TAU;
    lvlQ(fam,[x+Math.cos(A)*r,y,z+Math.sin(A)*r],[x+Math.cos(B)*r,y,z+Math.sin(B)*r],
             [x+Math.cos(B)*rt,y+h,z+Math.sin(B)*rt],[x+Math.cos(A)*rt,y+h,z+Math.sin(A)*rt],(i%2)?col:c2,ref); }
  if(rt>0.02) lvlDisc(fam,x,y+h,z,rt,topCol!=null?topCol:shade(col,-0.2),seg);
}
/* vertical disc facing (nx,nz) — shields, funnel throats, round marks */
function lvlDiscV(fam,x,y,z,nx,nz,r,col,seg){
  seg=seg||8; var tx=-nz, tz=nx, ref=[x-nx*4,y,z-nz*4];
  for(var i=0;i<seg;i++){ var A=i/seg*TAU, B=(i+1)/seg*TAU;
    lvlT(fam,[x,y,z],[x+tx*Math.cos(A)*r,y+Math.sin(A)*r,z+tz*Math.cos(A)*r],[x+tx*Math.cos(B)*r,y+Math.sin(B)*r,z+tz*Math.cos(B)*r],col,ref); }
}
/* low-poly ellipsoid: egg sacs, cocoons, cargo nets, sacks */
function lvlSac(fam,x,y,z,rx,ryy,col,seg){
  seg=seg||5; var ref=[x,y,z], c2=shade(col,-0.10);
  var r1=rx*0.86, y1=y+ryy*0.5, y0=y-ryy*0.5, top=[x,y+ryy,z], bot=[x,y-ryy,z];
  for(var i=0;i<seg;i++){ var A=i/seg*TAU, B=(i+1)/seg*TAU, ca=Math.cos(A), sa=Math.sin(A), cb=Math.cos(B), sb=Math.sin(B);
    var a1=[x+ca*r1,y1,z+sa*r1], b1=[x+cb*r1,y1,z+sb*r1], a0=[x+ca*r1,y0,z+sa*r1], b0=[x+cb*r1,y0,z+sb*r1];
    lvlT(fam,top,a1,b1,col,ref); lvlQ(fam,a0,b0,b1,a1,(i%2)?col:c2,ref); lvlT(fam,bot,a0,b0,c2,ref); }
}
/* horizontal funnel of web along (dx,dz) from c, radius ra at c to rb at c+len */
function lvlFunnel(fam,c,dx,dz,ra,rb,len,col,seg){
  seg=seg||8; var tx=-dz, tz=dx;
  for(var i=0;i<seg;i++){ var A=i/seg*TAU, B=(i+1)/seg*TAU;
    function pt(ang,r,l){ return [c[0]+dx*l+tx*Math.cos(ang)*r, c[1]+Math.sin(ang)*r, c[2]+dz*l+tz*Math.cos(ang)*r]; }
    MQUAD(fam,pt(A,ra,0),pt(B,ra,0),pt(B,rb,len),pt(A,rb,len),col); }
}

/* ------------------------------------------------------------------ frames */
/* a frame on platform P at polar (r,a): outward normal (true surface normal, so square/oval satellites work), tangent, yaw */
function lvlFrame(P,r,a,y){
  var p=platXZ(P,r,a), e=0.5/Math.max(2,r), p0=platXZ(P,r,a-e), p1=platXZ(P,r,a+e);
  var tx=p1[0]-p0[0], tz=p1[1]-p0[1], tl=Math.hypot(tx,tz)||1; tx/=tl; tz/=tl;
  var ox=tz, oz=-tx, od=platOutDir(P,a);
  if(ox*od[0]+oz*od[1] < 0){ ox=-ox; oz=-oz; }
  return { x:p[0], z:p[1], y:y, ox:ox, oz:oz, tx:-oz, tz:ox, ry:Math.atan2(-oz,ox) };
}
function lvlTreeFrame(T,r,a,y){ var ox=Math.cos(a), oz=Math.sin(a); return { x:T.x+ox*r, z:T.z+oz*r, y:y, ox:ox, oz:oz, tx:-oz, tz:ox, ry:Math.atan2(-oz,ox) }; }
function lvlFreeFrame(x,z,y,a){ var ox=Math.cos(a), oz=Math.sin(a); return { x:x, z:z, y:y, ox:ox, oz:oz, tx:-oz, tz:ox, ry:Math.atan2(-oz,ox) }; }
function lvlAt(fr,u,v,dy){ return [fr.x+fr.ox*u+fr.tx*v, fr.y+(dy||0), fr.z+fr.oz*u+fr.tz*v]; }
/* box in a frame: u outward, v tangent; wu deep (along u), wv wide (along v) */
function lvlFBox(fam,fr,u,v,dy,wu,h,wv,col,faces){ var p=lvlAt(fr,u,v,dy); lvlBox(fam,p[0],p[1],p[2],wu,h,wv,fr.ry,col,faces); }
function lvlFBeam(fam,fr,u0,v0,y0,u1,v1,y1,w,d,col,caps){ lvlBeam(fam,lvlAt(fr,u0,v0,y0),lvlAt(fr,u1,v1,y1),w,d,col,caps); }
function lvlFRod(fr,u0,v0,y0,u1,v1,y1,r,col,fam){ var a=lvlAt(fr,u0,v0,y0), b=lvlAt(fr,u1,v1,y1); ROD(a[0],a[1],a[2],b[0],b[1],b[2],r,col,fam||'rope'); }
function lvlFCloth(fr,u,v,yTop,w,drop,col,along){      /* hung cloth; along=true -> runs along the tangent */
  var p=lvlAt(fr,u,v,0); BOX(p[0], fr.y+yTop-drop, p[2], w, drop, 0.04, along ? Math.atan2(-fr.tz,fr.tx) : fr.ry, col, 'cloth'); }

/* is the tangential extent (metres) about angle a at radius r clear of every stair bay slot? */
function lvlClear(P,r,a,halfM){
  for(var i=0;i<P.bays.length;i++) if(angDist(P.bays[i].ang,a) < (laneW(P)+0.9+halfM)/Math.max(2,r)) return false;
  return true;
}
function lvlPostCount(P,Lv){ var open=(Lv.kind==='roost'||Lv.kind==='hangar');
  return P.main ? Math.round(TAU*Lv.Rout/(open?5.2:3.9)) : Math.max(6, Math.round(TAU*Lv.Rout/3.4)); }

/* small furniture */
function lvlCrate(fr,u,v,dy,s,col){ lvlFBox('plank',fr,u,v,dy,s,s*rr(0.7,1.0),s,col||pick(CRATEC),'tfklr'); }
function lvlBarrel(fr,u,v,dy,r,h,col){ var p=lvlAt(fr,u,v,dy); lvlDrum('plank',p[0],p[1],p[2],r,h,col||pick(TIMBERC),6,r*0.88); }
function lvlBench(fr,u,v,len,along){
  var wu = along?0.42:len, wv = along?len:0.42;

  if(along){ lvlFBox('timber',fr,u,v-len*0.38,0,0.34,0.40,0.10,TIMBERC[2],'fklr'); lvlFBox('timber',fr,u,v+len*0.38,0,0.34,0.40,0.10,TIMBERC[2],'fklr'); }
  else     { lvlFBox('timber',fr,u-len*0.38,v,0,0.10,0.40,0.34,TIMBERC[2],'fklr'); lvlFBox('timber',fr,u+len*0.38,v,0,0.10,0.40,0.34,TIMBERC[2],'fklr'); }
}
function lvlTable(fr,u,v,wu,wv,h){

function lvlSpearRack(fr,u,v,n){      /* rack along the tangent with n leaning spears */

}
function lvlShield(fr,u,v,y,r,col){ var p=lvlAt(fr,u,v,y); lvlDiscV('plank',p[0],p[1],p[2],fr.ox,fr.oz,r,col,8);
  var q=lvlAt(fr,u+0.06,v,y); lvlDiscV('timber',q[0],q[1],q[2],fr.ox,fr.oz,r*0.28,shade(TIMBERC[2],-0.4),6); }

/* ====================================================================== GOAL A: LEVELS */

/* --- a shuttered window on a curved wall at polar (r,a), sill height ys --- */
function lvlWindow(P,r,a,ys,w,h,cool,shutCol){
  var ha=(w/2)/r, fa=(w/2+0.12)/r;
  SECTOR('timber',P,r,r+0.05,a-fa,a+fa,ys-0.12,ys+h+0.12,TIMBERC[2],{faces:'o',step:30});
  if(shutCol!=null){
    var sw=w*0.48/r;
    SECTOR('plank',P,r,r+0.10,a-fa-sw,a-fa-0.02/r,ys-0.05,ys+h+0.05,shutCol,{faces:'o',step:30});
    SECTOR('plank',P,r,r+0.10,a+fa+0.02/r,a+fa+sw,ys-0.05,ys+h+0.05,shutCol,{faces:'o',step:30});
  }
  var fr=lvlFrame(P,r+0.06,a,ys+h/2);
  lvlPane(fr.x,fr.y,fr.z,fr.ox,fr.oz,w,h,cool);
}
function lvlDoor(P,r,a,y,w,h,col){
  var fa=(w/2+0.14)/r, da=(w/2)/r;
  SECTOR('timber',P,r,r+0.05,a-fa,a+fa,y,y+h+0.16,TIMBERC[0],{faces:'o',step:30});
  SECTOR('plank',P,r,r+0.10,a-da,a+da,y,y+h,col,{faces:'o',step:30});
}

/* --- washing line between the two gallery posts nearest angle a --- */
function lvlWashing(P,Lv,a){
  var np=lvlPostCount(P,Lv), i=Math.floor(a/TAU*np-0.5), a0=(i+0.5)/np*TAU, a1=(i+1.5)/np*TAU, r=Lv.Rout-0.35;
  if(!lvlClear(P,r,(a0+a1)/2,2.4)) return;
  var p0=platXZ(P,r,a0), p1=platXZ(P,r,a1), yl=Lv.y+Math.min(Lv.H-0.5,2.9);
  ROD(p0[0],yl,p0[1],p1[0],yl,p1[1],0.015,ROPEC[0],'rope');
  var n=ri(2,4), ry=Math.atan2(-(p1[1]-p0[1]),p1[0]-p0[0]);
  for(var j=0;j<n;j++){ var t=(j+0.7+rr(-0.15,0.15))/(n+0.4), dr=rr(0.6,1.15);
    BOX(mix(p0[0],p1[0],t), yl-dr, mix(p0[1],p1[1],t), rr(0.5,0.85), dr, 0.03, ry, chance(0.35)?WEBC[1]:pick(CLOTHC), 'cloth'); }
  LVL.washing++;
}

/* ---------------------------------------------------------------- APARTMENTS */
function lvlApt(P,R,Lv){
  var r1=R.r1, y=R.y, H=R.H, am=(R.a0+R.a1)/2, arc=(R.a1-R.a0)*r1, th=0.14/r1;
  var rmid=(R.r0+R.r1)/2, ctr=platXZ(P,rmid,am);
  if(chance(0.125) && arc>6){
    /* shared kitchen / common room: open front, hearth at the back */
    SECTOR('timber',P,r1-0.3,r1,R.a0,R.a1,y+H-0.45,y+H,TIMBERC[1],{faces:'ob',step:5});
    [-0.3,0.3].forEach(function(f){ var fp=lvlFrame(P,r1-0.15,am+f*(R.a1-R.a0),y); lvlFBox('timber',fp,0,0,0,0.26,H-0.45,0.26,TIMBERC[0],'fklr'); });
    var fb=lvlFrame(P,R.r0+0.9,am,y);
    lvlFBox('wall',fb,0,0,0,1.1,1.0,2.2,ROCKC[1],'tflr'); lvlFBox('wall',fb,-0.15,0,1.0,0.7,H-1.0,1.3,ROCKC[3],'flr');
    var gp=lvlAt(fb,0.35,0,0.45); BOX(gp[0],gp[1],gp[2],0.5,0.4,1.2,fb.ry,PAL.glowWarm,'glowmat');
    lvlGlow(gp[0]+fb.ox*1.5,y+1.4,gp[2]+fb.oz*1.5,0.8,12,false);
    var fm=lvlFrame(P,rmid+0.8,am,y); lvlTable(fm,0,0,1.1,2.6,0.78); lvlBench(fm,-0.95,0,2.4,true); lvlBench(fm,0.95,0,2.4,true);
    lvlFBox('plank',fb,0.2,arc*0.30,0,0.5,1.7,1.4,pick(PLANKC),'tflr');
    lvlReg({ name:P.name, kind:'kitchen', label:'Shared kitchen & common room', plat:P.id, lvl:R.lvl, x:ctr[0], z:ctr[1], y:y, h:H, r:Math.min(arc,R.r1-R.r0)*0.5 });
    return;
  }
  var fin=ri(0,3), fam = fin===3 ? 'plank' : 'wall', col = fin===1 ? pick(WALLDARKC) : fin===3 ? shade(pick(PLANKC),-0.08) : pick(WALLC);
  SECTOR(fam,P,r1-0.25,r1,R.a0+th,R.a1-th,y,y+H,col,{faces:'o',step:5});
  if(chance(0.4)) SECTOR('timber',P,r1,r1+0.06,R.a0+th,R.a1-th,y+H-0.42,y+H-0.14,chance(0.5)?shade(pick(CLOTHC),-0.15):TIMBERC[2],{faces:'o',step:5});
  /* door at the nav door node */
  if(chance(0.12)){ SECTOR('timber',P,r1,r1+0.05,am-0.64/r1,am+0.64/r1,y,y+2.3,shade(TIMBERC[2],-0.5),{faces:'o',step:30});
    var fc=lvlFrame(P,r1+0.10,am,y); lvlFCloth(fc,0,0,2.25,1.1,2.1,pick(CLOTHC),true); }
  else lvlDoor(P,r1,am,y,1.0,2.12, chance(0.3)?shade(pick(CLOTHC),-0.25):shade(pick(TIMBERC),chance(0.5)?-0.2:0.12));
  /* windows */
  var nw = arc>7.2 ? (chance(0.2)?1:2) : 1, shut = chance(0.75) ? (chance(0.5)?shade(pick(AWNINGC),-0.2):shade(pick(PLANKC),-0.25)) : null;
  var side = chance(0.5)?1:-1, wpos=[];
  for(var w=0;w<nw;w++){ var wa = am + (w===0?side:-side)*arc*rr(0.26,0.32)/r1; wpos.push(wa);
    lvlWindow(P,r1,wa,y+1.15,rr(0.75,1.0),rr(0.9,1.15),false,shut); }
  /* dressing */
  if(chance(0.33)){ var fl=lvlFrame(P,r1+0.38,am+side*-1.05/r1,y); lvlLamp(fl.x,y+2.45,fl.z,0.7,10,false,0); }
  if(chance(0.30)){ var fw=lvlFrame(P,r1+0.24,wpos[0],y);
    lvlFBox('plank',fw,0,0,0.78,0.30,0.22,1.1,shade(pick(PLANKC),-0.2),'flrb'); lvlFBox('thatch',fw,0,0,1.0,0.34,0.20,1.0,chance(0.5)?pick(CROPC):pick(FLOWERC),'tflr'); }
  if(chance(0.30)){ var fs=lvlFrame(P,r1+0.34,am-side*arc*0.16/r1,y); if(chance(0.5)) lvlBench(fs,0,0,1.3,true); else lvlBarrel(fs,0,0,0,0.3,0.75); }
  if(chance(0.2)) lvlWashing(P,Lv,am);

}

/* ---------------------------------------------------------------- STOREHOUSES */
function lvlStore(P,R,Lv){
  var r1=R.r1, y=R.y, H=R.H, am=(R.a0+R.a1)/2, arc=(R.a1-R.a0)*r1, th=0.14/r1, rmid=(R.r0+R.r1)/2, ctr=platXZ(P,rmid,am);
  var col=pick(WALLDARKC), open=chance(0.36), dw=Math.min(3.4,arc*0.34), dh=3.5, da=(dw/2)/r1;
  var dcol=shade(pick(PLANKC),-0.3);
  if(open){
    SECTOR('wall',P,r1-0.25,r1,R.a0+th,am-da,y,y+H,col,{faces:'o',step:5});
    SECTOR('wall',P,r1-0.25,r1,am+da,R.a1-th,y,y+H,col,{faces:'o',step:5});
    SECTOR('wall',P,r1-0.25,r1,am-da,am+da,y+dh,y+H,col,{faces:'ob',step:5});
    /* leaves folded back flat against the wall */
    SECTOR('plank',P,r1,r1+0.14,am-da-(dw/2+0.05)/r1,am-da-0.05/r1,y+0.05,y+dh-0.05,dcol,{faces:'os',step:30});
    SECTOR('plank',P,r1,r1+0.14,am+da+0.05/r1,am+da+(dw/2+0.05)/r1,y+0.05,y+dh-0.05,dcol,{faces:'os',step:30});
    /* stock seen through the doorway */
    var fi=lvlFrame(P,r1-2.2,am,y), n=ri(5,8);
    for(var i=0;i<n;i++){ var u=-rr(0,4.5), v=rr(-dw*0.75,dw*0.75), k=ri(0,3);

  var tradeSeq = shuffle(LVL_TRADES.slice()), ti=0;
  P.rooms.forEach(function(R){

    if(R.whole){ if(R.kind==='apt'){ lvlSatApt(P,R,Lv); lvlTally('satApt'); } else if(R.kind==='roost'){ lvlSatRoost(P,R,Lv); lvlTally('roost'); } return; }

    else if(R.kind==='store'){ lvlStore(P,R,Lv); lvlTally('store'); }
    else if(R.kind==='work'){ var tr=tradeSeq[ti++%tradeSeq.length]; if(ti%tradeSeq.length===0) tradeSeq=shuffle(LVL_TRADES.slice()); lvlWork(P,R,Lv,tr); lvlTally('work'); }

    else if(R.kind==='roost' || R.kind==='hangar'){
      var am=(R.a0+R.a1)/2, c=platXZ(P,(R.r0+R.r1)/2,am);
      lvlReg({ name:P.name, kind:R.kind, label:R.kind==='hangar'?'Beast hangar bay':'Roost bay', plat:P.id, lvl:R.lvl, x:c[0], z:c[1], y:R.y, h:R.H, r:Math.min((R.a1-R.a0)*R.r1,R.r1-R.r0)*0.5 });

});

lvlTally('roost');

   passage at the ramp head. The trunk below the ramp foot is left untouched.
   NOTE the real bark is a 32-gon with +-1.7 % relief, i.e. it wanders about
   -0.85..+0.65 m round trunkR on a 38 m trunk: every carving is therefore a

/* ---------------------------------------------------------------- the ramp of one gate tree */
function gtRamp(S){
  var T=S.tree, F=platFrame(T.x,T.z,0), span=S.turns*TAU, K=(S.y1-S.y0)/span, turnGap=(S.y1-S.y0)/S.turns;
  var th=0, prevW=0, first=true;
  function lenPerRad(y){ return Math.hypot(trunkR(T,y)+1.0, K); }
  th = 12/lenPerRad(S.y0);                                  /* the gatehouse stands on the first metres */
  while(true){
    var y=S.y0+K*th, t=th/span, kind;
    var yCap = S.y1-1.2;                                      /* the lowest floor slab of the platform */
    if(y > S.y1-4.4) break;
    if(y > S.y1-7.2) kind = chance(0.6)?'guardpost':'vault';
    else if(t < 0.36) kind = gtWeighted(['barracks',5,'vault',3,'guardpost',3,'storehouse',1,'inn',0.5]);
    else if(t < 0.70) kind = gtWeighted(['storehouse',4,'inn',3,'barracks',1.2,'dorm',1.2,'vault',1,'shrine',0.5]);
    else              kind = gtWeighted(['dorm',4,'shrine',3,'inn',3,'storehouse',1,'barracks',0.5]);
    var W = kind==='dorm' ? rr(5.6,7.0) : kind==='vault' ? rr(3.0,3.7) : kind==='guardpost' ? rr(3.0,3.6) : kind==='storehouse' ? rr(4.4,6.2) : kind==='shrine' ? rr(3.6,5.0) : rr(3.8,6.4);
    var H = kind==='dorm' ? rr(2.9,3.3) : kind==='vault' ? 2.6 : kind==='guardpost' ? rr(2.6,2.9) : kind==='storehouse' ? rr(3.4,4.2) : kind==='shrine' ? rr(3.9,4.5) : rr(2.8,3.8);
    if(!first) th += (prevW/2 + W/2 + rr(2.6,5.2))/lenPerRad(y);
    first=false; prevW=W;
    y=S.y0+K*th; if(y > S.y1-4.4) break;
    if(y > S.y1-7.2 && kind!=='guardpost' && kind!=='vault'){ kind='guardpost'; W=3.2; H=2.7; prevW=W; }
    var a=S.a0+S.dir*th;
    var res=gtFacade(S,T,F,a,y,kind,W,H,K,yCap);
    lvlTally('gateFacade');
    /* the storeys above: up to the braces of the next turn (or the platform) */
    var yHi=Math.min(y+turnGap-5.0, S.y1-2.4), yLo=res.top+rr(1.3,2.2);
    if(kind==='dorm') gtUpper(T,F,a,yLo,yHi,res.cool,res.col,true,W-1.2), yLo+=7.2;
    if(chance(kind==='dorm'?0.4:0.62)) gtUpper(T,F,a,yLo+(kind==='dorm'?0:rr(0,2.5)),yHi,res.cool||chance(0.12),res.col,false,0);
    if(chance(0.42)){ var y2=y+rr(17,turnGap-12); if(y2<yHi-2) gtUpper(T,F,a+rr(-3,3)/trunkR(T,y2),y2,yHi,chance(0.25),res.col,false,0); }
    lvlTally('gateUpper');
  }
}

function lifeHook(legPiv, armPiv){
  return function(sh){
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aPRO;\nattribute vec4 aAnim;\nattribute vec3 aGarb;\nattribute vec3 aSkin;\nattribute vec3 aHair;')
      .replace('#include <color_vertex>', 'vColor = color;\nif(aPRO.y < 0.5) vColor *= aGarb; else if(aPRO.y < 1.5) vColor *= aSkin; else if(aPRO.y < 2.5) vColor *= aHair;')
      .replace('#include <beginnormal_vertex>', [
        'vec3 objectNormal = vec3(normal);',
        'float lfPart = aPRO.x, lfAng = 0.0, lfPy = 0.0;',
        'if(lfPart > 0.5 && lfPart < 4.5){',
        '  float lfSw = sin(aAnim.x) * aAnim.y;',
        '  if(lfPart < 2.5){ lfPy = ' + legPiv.toFixed(3) + '; lfAng = lfPart < 1.5 ? lfSw : -lfSw; }',
        '  else { lfPy = ' + armPiv.toFixed(3) + '; lfAng = (lfPart < 3.5 ? -lfSw : lfSw)*0.85 - aAnim.z; }',
        '  float lfC = cos(lfAng), lfS = sin(lfAng);',
        '  objectNormal = vec3(objectNormal.x, objectNormal.y*lfC - objectNormal.z*lfS, objectNormal.y*lfS + objectNormal.z*lfC);',
        '}'].join('\n'))
      .replace('#include <begin_vertex>', [
        'vec3 transformed = vec3(position);',
        'if(lfPart > 0.5 && lfPart < 4.5){',
        '  float lfC2 = cos(lfAng), lfS2 = sin(lfAng); vec3 lfQ = transformed - vec3(0.0, lfPy, 0.0);',
        '  transformed = vec3(lfQ.x, lfPy + lfQ.y*lfC2 - lfQ.z*lfS2, lfQ.y*lfS2 + lfQ.z*lfC2);',
        '}',
        'if(lfPart > 4.5) transformed.y = aAnim.x;',
        'if(aPRO.z > 0.5 && abs(aPRO.z - aAnim.w) > 0.25) transformed = vec3(0.0, 0.6, 0.0);'].join('\n'));
  };
}

/* ------------------------------------------------------------------ skeleton shader
   bones: [ {p:[x,y,z] pivot, a:[x,y,z] axis, par:index|-1, k:0 rot | 1 scale | 2 translate} ]
   Vertices on the right side (aFlyB.y = -1) use the mirrored pivot/axis, so
   one angle drives both wings symmetrically. */
function flySkinHook(bones){
  var piv = [], ax = [], pk = [];
  for(var i=0;i<16;i++){ var B = bones[i] || { p:[0,0,0], a:[1,0,0], par:-1, k:0 };
    piv.push(new THREE.Vector3(B.p[0], B.p[1], B.p[2])); ax.push(new THREE.Vector3(B.a[0], B.a[1], B.a[2]));
    pk.push(new THREE.Vector2(B.par+1, B.k||0)); }
  return function(sh){
    sh.uniforms.uFlyPiv = { value:piv }; sh.uniforms.uFlyAx = { value:ax }; sh.uniforms.uFlyPK = { value:pk };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', ['#include <common>',
        'attribute vec2 aFlyB; attribute vec4 aFlyP0; attribute vec4 aFlyP1; attribute vec4 aFlyP2; attribute vec4 aFlyP3;',
        'uniform vec3 uFlyPiv[16]; uniform vec3 uFlyAx[16]; uniform vec2 uFlyPK[16];',
        'void flySkin(inout vec3 p, inout vec3 n){',
        '  mat4 A = mat4(aFlyP0, aFlyP1, aFlyP2, aFlyP3);',
        '  int b = int(aFlyB.x + 0.5) - 1; float sd = aFlyB.y;',
        '  for(int it=0; it<7; it++){',
        '    if(b < 0) break;',
        '    vec3 pv = uFlyPiv[b]; vec3 ax = uFlyAx[b]; vec2 pk = uFlyPK[b];',
        '    int cI = b/4; float ang = A[cI][b - cI*4];',
        '    if(sd < 0.0){ pv.x = -pv.x; ax = vec3(ax.x, -ax.y, -ax.z); }',
        '    if(pk.y > 1.5){ p += uFlyAx[b]*ang; }',
        '    else if(pk.y > 0.5){ p = pv + (p - pv)*ang; }',
        '    else { float cs = cos(ang), sn = sin(ang); vec3 q = p - pv;',
        '      p = pv + q*cs + cross(ax, q)*sn + ax*dot(ax, q)*(1.0 - cs);',
        '      n = n*cs + cross(ax, n)*sn + ax*dot(ax, n)*(1.0 - cs); }',
        '    b = int(pk.x + 0.5) - 1;',
        '  }',
        '}'].join('\n'))
      .replace('#include <beginnormal_vertex>', 'vec3 flyP = position; vec3 flyN = normal; flySkin(flyP, flyN);\nvec3 objectNormal = flyN;')
      .replace('#include <begin_vertex>', 'vec3 transformed = flyP;');
  };
}
