<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jimjam City Kit</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#26282a;color:#eee;font:13px/1.4 system-ui,sans-serif}canvas{display:block}#ui{position:fixed;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:72vw;z-index:5}#ui button,#poly button{background:rgba(20,16,14,.78);color:#f0e6d8;border:1px solid #8a6a50;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12px}#ui button:hover,#poly button:hover{background:#6a4a38}#ui button.on{background:#c9773a;color:#1a1008;border-color:#e8b070}#viewsel{background:rgba(20,16,14,.85);color:#f0e6d8;border:1px solid #8a6a50;border-radius:4px;padding:5px 9px;font-size:13px}#hud{position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,.5);padding:6px 9px;border-radius:4px;font:12px ui-monospace,monospace;white-space:pre;z-index:5}#cap{position:fixed;left:10px;top:44px;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:4px;font-size:12px;color:#e8d8c8;z-index:5;max-width:70vw}#errs{position:fixed;left:10px;bottom:10px;max-width:60vw;max-height:30vh;overflow:auto;background:rgba(120,0,0,.85);color:#fff;padding:6px 9px;border-radius:4px;font:12px ui-monospace,monospace;white-space:pre-wrap;display:none;z-index:9}#insp{position:fixed;left:10px;top:78px;background:rgba(0,0,0,.6);color:#ffe2b0;padding:6px 10px;border-radius:4px;font:12px/1.45 ui-monospace,monospace;white-space:pre;z-index:5;margin:0;display:none;pointer-events:none;max-width:46vw}#insp b{color:#fff}#insp .cls{color:#9fe8ff}#insp .tag{color:#b8e8a0}#poly{position:fixed;right:10px;top:10px;width:300px;background:rgba(0,0,0,.62);color:#e8d8c8;padding:8px 10px;border-radius:4px;font:12px ui-monospace,monospace;z-index:6;display:none}#poly textarea{width:100%;height:110px;background:#111;color:#cfe;border:1px solid #555;font:11px ui-monospace,monospace;margin-top:6px;resize:vertical}#poly .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
</style></head><body><div id="ui"></div><div id="cap">Jimjam Helper Gallery — Round 1</div><pre id="insp"></pre><div id="poly"><b>Polygon tool</b> — click ground to add a vertex · right-click removes last · coordinates are x,z<textarea id="polyout" readonly></textarea><div class="row"><button id="polycopy">Copy</button><button id="polyclose">Close loop</button><button id="polyundo">Undo</button><button id="polyclear">Clear</button><button id="polyfmt">Format: [x,z]</button></div></div><div id="hud"></div><pre id="errs"></pre><script src="./three.min.js"></script><script>
// ---------------------------------------------------------------- error panel
const ERRS=document.getElementById('errs');
function reportErr(m){ERRS.style.display='block';ERRS.textContent+=m+'\n';}
window.onerror=(m,s,l,c,e)=>reportErr((e&&e.stack)||(m+' @'+l+':'+c));
window.addEventListener('unhandledrejection',e=>reportErr('promise: '+(e.reason&&e.reason.stack||e.reason)));

// ---------------------------------------------------------------- rng + noise
let _seed=1234567;
function reseed(s){_seed=s>>>0;}
function rng(){_seed|=0;_seed=_seed+0x6D2B79F5|0;let t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rng();}
function h3(x,y,z){const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
 const sm=t=>t*t*(3-2*t);const u=sm(xf),v=sm(yf),w=sm(zf);const l=(a,b,t)=>a+(b-a)*t;
 return l(l(l(h3(xi,yi,zi),h3(xi+1,yi,zi),u),l(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),u),v),
          l(l(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),u),l(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z,o){o=o||3;let a=0,f=1,s=0;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f)/f;s+=1/f;f*=2.03;}return a/s;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;

// GROUND HEIGHT HOOK. Flat everywhere for now — the whole kit stands on y=0 —
// but every piece of code that meets the ground asks here instead of assuming
// zero, so the Krator terrain pass replaces this one function and the aprons,
// the trees and the fallen fragments all follow the ground without a builder
// being touched. Keep it cheap: it is called per tree and per rubble block.
function terrainH(x,z){return 0;}

// ---------------------------------------------------------------- per-type accounting
// One global tally, filled while the builders run. 90-scene.js sets TSTAT.cur
// to the site key ('skyA/1' = Skyscraper A, ruined) before each builder call
// and clears it after, so every mesh and every instanced item is charged to the
// type that made it. This is what makes the per-type triangle budgets in
// verify.py --assert measurable at all: the kit shares one InstancedMesh per
// item across all 33 types, so after kbake() there is no way to tell whose
// triangles are whose.
//
// Nothing here emits geometry or draws from the PRNG, so switching it on does
// not move a single rock. Keep it that way.
const TSTAT={cur:null,by:{},bad:[]};
function tcur(){const k=TSTAT.cur;if(k==null)return null;return TSTAT.by[k]||(TSTAT.by[k]={tris:0,inst:0,meshes:0});}
function triOf(g){if(!g)return 0;if(g.index)return g.index.count/3;const p=g.attributes&&g.attributes.position;return p?p.count/3:0;}
const _KTRI={};
function ktri(name){if(_KTRI[name]===undefined){const def=KIT.defs[name];_KTRI[name]=def?triOf(def.geo):0;}return _KTRI[name];}
function finite3(a){return !!a&&isFinite(a[0])&&isFinite(a[1])&&isFinite(a[2]);}
// ---------------------------------------------------------------- textures
// All procedural, all generated once at load, all in world-ish units: a texture
// tile is about 8 m across, because `lathe` sets uS = rFn(0)*TAU/8 and vS = cut/8.
// At 512 px that is 64 px per metre, which is what the panel and board sizes
// below are picked against — change the tile size and they stop meaning anything.
function canvasTex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;t.encoding=THREE.sRGBEncoding;if(rep)t.repeat.set(rep,rep);return t;}
// A roughness/metalness map is DATA, not colour. Leaving it sRGB-encoded (which
// canvasTex does, correctly, for albedo) bends every value through a gamma curve
// and the surface comes back wrong.
//
// r128's MeshStandardMaterial reads roughnessMap from the GREEN channel and
// metalnessMap from the BLUE, so one texture assigned to both slots carries
// both. Both MULTIPLY the material's scalar `roughness`/`metalness`, so those
// are set to 1 and the map does all the work.
//
// This is the single biggest thing missing from the first-pass materials: with
// one flat roughness value, every panel on a 420 m tower has an identical
// highlight and the whole thing reads as moulded plastic. Breaking roughness up
// per panel and along the seams is what makes it read as metal.
function rmTex(w,h,fn){const t=canvasTex(w,h,(g,W,H)=>{const id=g.createImageData(W,H),d=id.data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;const v=fn(x,y);
  d[i]=0;d[i+1]=clamp(v[0],0,1)*255|0;d[i+2]=clamp(v[1],0,1)*255|0;d[i+3]=255;}
 g.putImageData(id,0,0);});
 t.encoding=THREE.LinearEncoding;return t;}

// Panel grid: 2 m x 1 m sheets at 64 px/m.
const PANW=128,PANH=64;
function panTone(x,y){return h3(Math.floor(x/PANW)*1.7,Math.floor(y/PANH)*2.3,5.1);}
function panSeam(x,y){const fx=x%PANW,fy=y%PANH;return Math.min(fx,PANW-1-fx,fy,PANH-1-fy);}
function panBolt(x,y){const fx=x%PANW,fy=y%PANH;
 return Math.hypot(Math.min(fx,PANW-1-fx)-7,Math.min(fy,PANH-1-fy)-7);}

const TEX={};
TEX.panel=canvasTex(512,512,(g,w,h)=>{ // white metal: panel sheets, recessed seams, fasteners
 const id=g.createImageData(w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
  let v=228+(panTone(x,y)-.5)*13;                       // sheet-to-sheet tone
  v+=(fbm(x/70,y/70,1.7,3)-.5)*15;                      // slow weathering drift
  v+=(fbm(x/3,y/30,4.4,2)-.5)*7;                        // brushed grain, running vertically
  const sd=panSeam(x,y);
  if(sd<1)v-=54; else if(sd<2)v-=25; else if(sd<4)v+=7; // groove, then its lit lip
  const bd=panBolt(x,y);
  if(bd<1.7)v-=28; else if(bd<2.7)v+=11;                // fastener at each sheet corner
  d[i]=v;d[i+1]=v-1;d[i+2]=v-7;d[i+3]=255;}
 g.putImageData(id,0,0);});
TEX.panelRM=rmTex(512,512,(x,y)=>{
 const t=panTone(x,y),sd=panSeam(x,y);
 let r=.30+(t-.5)*.11+(fbm(x/60,y/60,9.2,2)-.5)*.14;
 let m=.38+(t-.5)*.10;                                  // NOTE: modest. There is no
 if(sd<2){r+=.40;m-=.22;}                               // envMap in this scene, so a
 r+=(fbm(x/8,y/42,3.3,2)-.5)*.10;                       // near-1 metalness renders
 return[r,m];});                                        // almost black.

TEX.rust=canvasTex(512,512,(g,w,h)=>{ // tarnished steel, rust running down from every ledge
 const id=g.createImageData(w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
  // t is 0 at the top of the tile and 1 at the bottom. With world-unit UVs a
  // tile is roughly a storey, so the bottom of the tile is the underside of a
  // ledge: where water collects and where the staining is always worst. That is
  // how "keyed to overhangs" is approximated without knowing the geometry.
  const t=y/h;
  const base=fbm(x/70,y/70,4.2,3), streak=fbm(x/10,y/190,9.1,3);
  const run=clamp((streak-.40)*3,0,1)*clamp(t*1.7,0,1); // runs widen downward
  const ledge=clamp((t-.74)/.26,0,1);                   // the dark band under the ledge
  let r=126+(base-.5)*52,gg=118+(base-.5)*48,b=108+(base-.5)*44;   // dull tarnished silver
  const ru=clamp(run+ledge*.75,0,1);
  r=lerp(r,114+streak*52,ru);gg=lerp(gg,60+streak*30,ru);b=lerp(b,38+streak*16,ru);
  const dark=ledge*.42+clamp((fbm(x/40,y/150,2.2,2)-.62)*3,0,1)*.22;
  r*=1-dark;gg*=1-dark;b*=1-dark;
  if(panSeam(x,y)<1){r*=.74;gg*=.74;b*=.74;}            // the panel grid still ghosts through
  d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;}
 g.putImageData(id,0,0);});
TEX.rustRM=rmTex(512,512,(x,y)=>{const t=y/512;
 const ru=clamp(clamp((fbm(x/10,y/190,9.1,2)-.40)*3,0,1)*clamp(t*1.7,0,1)+clamp((t-.74)/.26,0,1)*.75,0,1);
 return[lerp(.55,.97,ru)+(fbm(x/25,y/25,6.6,2)-.5)*.12,lerp(.30,.04,ru)];});

// Verdigris is its own material now. It used to be blended into the rust map,
// which put copper patina on rusting STEEL everywhere in the kit — two metals
// that do not weather alike. Use MAT.verdigris only on parts meant to read as
// copper or bronze.
TEX.verdigris=canvasTex(256,256,(g,w,h)=>{
 const id=g.createImageData(w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
  const p=fbm(x/34,y/34,3.7,3),run=fbm(x/8,y/90,6.1,2),t=y/h;
  const a=clamp(clamp((p-.34)*2.4,0,1)*.72+clamp((run-.45)*2.6,0,1)*clamp(t*1.4,0,1)*.5,0,1);
  const sh=clamp((fbm(x/12,y/12,8.8,2)-.5)*.42,-.2,.2);
  d[i]=lerp(150,68,a)*(1+sh);d[i+1]=lerp(98,152,a)*(1+sh);d[i+2]=lerp(62,130,a)*(1+sh);d[i+3]=255;}
 g.putImageData(id,0,0);});
TEX.verdigrisRM=rmTex(256,256,(x,y)=>{const t=y/256;
 const a=clamp(clamp((fbm(x/34,y/34,3.7,2)-.34)*2.4,0,1)*.72+clamp((fbm(x/8,y/90,6.1,2)-.45)*2.6,0,1)*clamp(t*1.4,0,1)*.5,0,1);
 return[lerp(.32,.90,a),lerp(.34,.05,a)];});

// Water-staining decal. Grayscale and MULTIPLY-blended, so it darkens whatever
// wall it lands on rather than painting a grey rectangle over it — the same
// streak has to work on white metal, rust, concrete and brick.
TEX.stain=canvasTex(64,128,(g,w,h)=>{const id=g.createImageData(w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
  const t=y/h;                                     // 0 at the ledge, 1 at the bottom
  const run=fbm(x/7,y/40,5.3,3);
  const edge=1-Math.abs(x/w*2-1);                  // fade out at the sides
  const a=clamp(edge*1.6,0,1)*clamp(1.25-t,0,1)*clamp((run-.30)*2.2,0,1);
  const v=255-a*118;
  d[i]=v;d[i+1]=v-3;d[i+2]=v-8;d[i+3]=255;}
 g.putImageData(id,0,0);});
TEX.ground=canvasTex(1024,1024,(g,w,h)=>{ // painted later, once the sites are known
 g.fillStyle='#8a4a34';g.fillRect(0,0,w,h);});
// ---------------------------------------------------------------- materials
const DS=THREE.DoubleSide;
const MAT={
 // metalness/roughness come from the packed map (G=rough, B=metal); the scalars
 // are 1 so the map is not scaled down. See rmTex in 20-textures.js.
 white:new THREE.MeshStandardMaterial({map:TEX.panel,roughnessMap:TEX.panelRM,metalnessMap:TEX.panelRM,color:0xffffff,metalness:1,roughness:1,side:DS}),
 rust:new THREE.MeshStandardMaterial({map:TEX.rust,roughnessMap:TEX.rustRM,metalnessMap:TEX.rustRM,color:0xffffff,metalness:1,roughness:1,side:DS}),
 verdigris:new THREE.MeshStandardMaterial({map:TEX.verdigris,roughnessMap:TEX.verdigrisRM,metalnessMap:TEX.verdigrisRM,color:0xffffff,metalness:1,roughness:1,side:DS}),
 glass:new THREE.MeshStandardMaterial({color:0x3f9fe6,transparent:true,opacity:.48,metalness:.2,roughness:.08,emissive:0x0b2c4e,emissiveIntensity:.6,side:DS,depthWrite:false}),
 winIntact:new THREE.MeshStandardMaterial({color:0x143a5c,metalness:.6,roughness:.15,emissive:0x0a2238,emissiveIntensity:.8}),
 winDead:new THREE.MeshStandardMaterial({color:0x07090c,roughness:1}),
 dark:new THREE.MeshStandardMaterial({color:0x1a1d22,roughness:.95,side:DS}),
 guts:new THREE.MeshStandardMaterial({color:0x2a2622,roughness:.9,metalness:.4,side:DS}),
 pipe:new THREE.MeshStandardMaterial({color:0x7a4a2a,roughness:.55,metalness:.7}),
 pipeRust:new THREE.MeshStandardMaterial({color:0x4e3324,roughness:.9,metalness:.3}),
 strip:new THREE.MeshBasicMaterial({color:0xffffff}),
 dot:new THREE.MeshBasicMaterial({color:0xffffff}),
 moss:new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}),
 vine:new THREE.MeshStandardMaterial({color:0x2c4a22,roughness:1}),
 rubble:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95}),
 fig:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),
 ground:new THREE.MeshStandardMaterial({map:TEX.ground,roughness:1}),
 slab:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),
 stain:new THREE.MeshBasicMaterial({map:TEX.stain,transparent:true,blending:THREE.MultiplyBlending,depthWrite:false,side:DS}),
};
// GLASS FRESNEL. Real glass turns reflective and pale at grazing angles; a flat
// transparent colour reads as blue plastic, which is what these curtain walls
// were doing. Injected into the stock standard-material shader rather than
// replacing it, so lights, fog and tone mapping all still apply.
//
// r128 has no <output_fragment> chunk — that arrived later — so the anchor is
// the literal final assignment. Verified against the pinned three.min.js.
//
// The cube is written out rather than pow(): a negative base in pow() yields NaN,
// and SwiftShader silently swallows it, so it would look perfect in verify.py
// and blow up on a real GPU. Everything feeding it is clamped anyway.
MAT.glass.onBeforeCompile=sh=>{
 sh.fragmentShader=sh.fragmentShader.replace(
  'gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
  ['float _fr = 1.0 - clamp( abs( dot( normalize( normal ), normalize( vViewPosition ) ) ), 0.0, 1.0 );',
   '_fr = clamp( _fr, 0.0, 1.0 );',
   '_fr = _fr * _fr * _fr;',
   'vec3 _lit = outgoingLight + vec3( 0.30, 0.44, 0.58 ) * _fr * 0.85;',
   'gl_FragColor = vec4( _lit, clamp( diffuseColor.a + _fr * 0.42, 0.0, 1.0 ) );'].join('\n'));};
const SHELL=d=>d>0?MAT.rust:MAT.white;      // exterior skin by decay
const WIN=d=>d>0?MAT.winDead:MAT.winIntact;
const CYAN=new THREE.Color(0x7ff4ff), WARM=new THREE.Color(0xffd28a), DEAD=new THREE.Color(0x0a0c0e);

// ---------------------------------------------------------------- instancing kit
// `meshes` is filled by kbake: name -> the one InstancedMesh that item baked
// into. One kdef is one InstancedMesh, so anything that wants to switch a whole
// class of instanced detail on or off at run time (the firelight, at night) can
// do it with a single .visible, with no per-instance bookkeeping.
const KIT={defs:{},items:{},order:[],meshes:{}};
function kdef(name,geo,mat){KIT.defs[name]={geo,mat};KIT.items[name]=[];KIT.order.push(name);}
let KOFF=[0,0,0],KXF=null; // builder offset; optional {m,q} transform (leaning spire)
function kput(name,p,q,s,c){let P=p,Q=q;if(KXF){const v=new THREE.Vector3(p[0],p[1],p[2]).applyMatrix4(KXF.m);P=[v.x,v.y,v.z];Q=(q?q.clone():new THREE.Quaternion()).premultiply(KXF.q);}
 const w=[P[0]+KOFF[0],P[1]+KOFF[1],P[2]+KOFF[2]];
 const t=tcur();if(t){t.inst++;t.tris+=ktri(name);}
 // A NaN here is invisible: the instance renders nowhere and takes the whole
 // InstancedMesh's bounding sphere with it. Catch it at the source, where we
 // still know which type and which kit item produced it.
 if(!finite3(w)||!(typeof s==='number'?isFinite(s):finite3(s)))TSTAT.bad.push({type:TSTAT.cur,item:name,p:w,s:s});
 KIT.items[name].push({p:w,q:Q,s,c});}
let KIT_BAKED=false;
function kbake(parent){KIT_BAKED=true;const m=new THREE.Matrix4(),pos=new THREE.Vector3(),sc=new THREE.Vector3(),q0=new THREE.Quaternion();let tot=0;
 for(const name of KIT.order){const it=KIT.items[name];if(!it.length)continue;const def=KIT.defs[name];
  // one material clone per InstancedMesh (r128 needs it for instanceColor), but
  // Material.copy() does NOT carry onBeforeCompile, so the glass fresnel has to
  // be re-attached by hand or every instanced pane and finial loses it.
  const _m=def.mat.clone();if(def.mat.onBeforeCompile)_m.onBeforeCompile=def.mat.onBeforeCompile;
  const im=new THREE.InstancedMesh(def.geo,_m,it.length);
  it.forEach((o,i)=>{pos.set(o.p[0],o.p[1],o.p[2]);const s=typeof o.s==='number'?sc.set(o.s,o.s,o.s):sc.set(o.s[0],o.s[1],o.s[2]);
   m.compose(pos,o.q||q0,s);im.setMatrixAt(i,m);if(o.c)im.setColorAt(i,o.c);});
  if(im.instanceColor){const W=new THREE.Color(0xffffff);it.forEach((o,i)=>{if(!o.c)im.setColorAt(i,W);});}
  if(im.instanceColor)im.instanceColor.needsUpdate=true;im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;parent.add(im);KIT.meshes[name]=im;tot+=it.length;}
 window._instances=tot;}
// orientation helpers
const _M=new THREE.Matrix4(),_V0=new THREE.Vector3(),_UP=new THREE.Vector3(0,1,0),_X=new THREE.Vector3(1,0,0);
function qFacing(dir){ // quaternion whose local +z points along dir (dir horizontal-ish)
 const d=new THREE.Vector3(dir[0],dir[1],dir[2]).normalize();const up=Math.abs(d.y)>.95?_X:_UP;
 _M.lookAt(d,_V0,up);return new THREE.Quaternion().setFromRotationMatrix(_M);}
function qEuler(x,y,z){return new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));}
function qAxis(ax,ay,az,a){return new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(ax,ay,az).normalize(),a);}

// ---------------------------------------------------------------- surfaces
// fn(u,v)->[x,y,z]; opt.hole(u,v)->bool drops that quad. UVs scaled by opt.uS/vS (world-ish units).
function gridSurface(fn,nu,nv,opt){opt=opt||{};const pos=[],uv=[],idx=[];const cols=nu+1;
 for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const u=i/nu,v=j/nv;const p=fn(u,v);pos.push(p[0],p[1],p[2]);uv.push(u*(opt.uS||1),v*(opt.vS||1));}
 for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){if(opt.hole&&opt.hole((i+.5)/nu,(j+.5)/nv))continue;const a=j*cols+i,b=a+1,c=a+cols,d=c+1;idx.push(a,c,b,b,c,d);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(idx);g.computeVertexNormals();return g;}
// Lathe with flutes, twist, jagged cut and holes.  o:{rFn(y),H,cut,jag,flutes,amp,sharp,twist,nu,nv,hole(u,y),seed}
function lathe(o){const H=o.H,cut=o.cut!=null?o.cut:H,seed=o.seed||0,nu=o.nu||64,nv=o.nv||48;

// dish axis — 25 m to one side and 30 m below the panel itself — so no
// hand-picked y could put it on the ground, and it hung in the air. The fuel
// lobes, the government petal and the lab's broken spire had the same trap.

// ---------------------------------------------------------------- THE LEAF CARD
// One shared tree, because four types independently failed to make one.
//
// The kit's canopy has always been a displaced icosahedron — `moss` at detail 1,
// which is EIGHTY triangles for one blob, and `VEG.tree` hangs three or four of
// them off a trunk. That is 240-320 triangles a tree, it is the top budget line
// in two types, and at ten metres it still reads as a bag of marbles, because a
// faceted ball is a faceted ball however you texture it. The Forest Tower and
// the Forest Ring each wrote their own displaced icosahedron and each logged the
// same complaint against it; Arcbeam duplicated the kit default rather than
// reach into a neighbour's fragment. Raising the displacement amplitude was
// tried twice and is not the answer.
//
// The answer is to stop making the silhouette out of geometry. Three quads
// crossed about the vertical axis, plus one laid near-flat for the view from
// above, carry an alpha-mapped leaf mass: EIGHT triangles
// instead of eighty, and the outline comes from the texture's alpha, which can
// be as ragged as a real canopy for free. `alphaTest`, never `transparent` —
// transparent would put every clump into the sorted pass and cost more in draw
// order than it ever saved in triangles.

// normals light the three cards independently and the clump reads as three flat
// sheets; radial normals light it as one soft volume, which is the whole trick.

  const a=Math.random()*TAU,rad=Math.pow(Math.random(),.62)*w*.47;
  const x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;
  const L=w*(.10-.045*rad/(w*.47));          // leaves shrink toward the fringe

// --- sampling a structure's own surfaces -------------------------------------
// Moss belongs on what faces the sky and vines hang off real ledges, so both
// need to know where a structure's horizontal surfaces actually are. This walks
// the triangles of geometries the builder has already made, keeps the ones
// lying flat, and samples points on them weighted by area.
//
// It tests |ny| rather than ny: these shells are DoubleSide and their winding is
// not reliably outward, so a balcony floor can come back with a downward normal
// while being visibly a floor. The cost is that a true soffit can be sampled
// too, which is rare in these shapes and cheaper than missing every ledge.
// `src` may be a geometry, an array of them, or a whole Object3D — in which
// case it is traversed and each mesh's transform is baked relative to the root,
// so a finished structure can be sampled without the builder handing anything
// over. That is what lets the repaired pass dress all 33 types from one place.
// Keeps faces whose |normal.y| lands in [lo,hi]; returns points and normals.

  const P=A.array,I=g.index?g.index.array:null,nT=I?I.length/3:A.count/3;
  for(let f=0;f<nT;f++){
   const a=(I?I[f*3]:f*3)*3,b=(I?I[f*3+1]:f*3+1)*3,c=(I?I[f*3+2]:f*3+2)*3;
   let ax=P[a],ay=P[a+1],az=P[a+2],bx=P[b],by=P[b+1],bz=P[b+2],cx=P[c],cy=P[c+1],cz=P[c+2];
   if(M){v.set(ax,ay,az).applyMatrix4(M);ax=v.x;ay=v.y;az=v.z;
         v.set(bx,by,bz).applyMatrix4(M);bx=v.x;by=v.y;bz=v.z;
         v.set(cx,cy,cz).applyMatrix4(M);cx=v.x;cy=v.y;cz=v.z;}

 kput(jjName,[jjP.x,jjP.y,jjP.z],jjR,[jjSX*jjS.x,jjSY*jjS.y,jjSZ*jjS.z],jjTint===undefined?null:jjTint);}

 return ['red','turq','gold'][Math.abs(Math.floor(jjE[12]*.7+jjE[14]*1.3))%3];}

 const jjL=Math.hypot(jjD,jjDrop),jjQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.atan2(jjDrop,jjD),0,0)),jjNm='jj_cult_awn_'+jjSch;
 jjCultPut(jjNm,'box',jjM,0,-jjDrop/2,jjD/2,jjW,.045,jjL,jjQ);                                  // the canopy

 const jjN=Math.max(3,Math.round(jjW/(JJ_CULT_STRIPE/2)));for(let jjI=0;jjI<jjN;jjI++)jjCultPut(jjNm,'box',jjM,-jjW/2+(jjI+.5)*jjW/jjN,-jjDrop-.36,jjD,jjW/jjN*.82,.12,.03); // tabs

 jjCultRod('jj_cult_woodrod',jjWood,[-jjW/2,-jjDrop,jjD-.03],[jjW/2,-jjDrop,jjD-.03],.045);
 if(jjH>0){for(const jjSx of [-1,1]){jjCultRod('jj_cult_woodrod',jjWood,[jjSx*(jjW/2-.05),-jjDrop,jjD-.03],[jjSx*(jjW/2-.05),-jjDrop-jjH,jjD-.03],.055);
   jjCultPut('jj_cult_gold','ball',jjGold,jjSx*(jjW/2-.05),-jjDrop+.06,jjD-.03,.08,.1,.08);}}
 else for(const jjSx of [-1,1])jjCultRod('jj_cult_ironrod',jjIron,[jjSx*(jjW/2-.08),-jjDrop-.55,.02],[jjSx*(jjW/2-.08),-jjDrop+.01,jjD-.06],.025);}

// Jimjam housing (round 2b): nine houses, three per tier. No two share a plan or a roofline.
// Local frame: origin at the plot centre on the ground, +z is the front (entrance), y up.
//   poor A  party-wall pair: a two-storey flat roof with a canvas awning + a one-storey barrel vault
//   poor B  narrow two-storey slab with an external stair (side, then back) to the roof terrace
//   poor C  L-plan round a walled yard: terracotta dome, bread oven, water jar, ladder
//   mid A   stepped terraces (three storeys, each set back), corner turret, 3-shaft chimney stack
//   mid B   tower plus wing: four storeys, stacked oriels, a bulbous corner turret, onion cap
//   mid C   T-plan shop-house: arcaded loggia, balcony, yellow upper floors with portholes, 2 shafts
//   rich A  courtyard mansion: two-storey arcades on four sides, pishtaq gate, hall with gold dome
//   rich B  pavilion villa on a marble podium: loggias all round, gold onion on a drum, 4 chhatris
//   rich C  L-plan tower compound: round-collared 3-stage spire, slate ribbed dome, walled garden
// House-only helpers (jjHouse…) add the pieces the shared kit lacks: arched wall panels and
// colonnades with real openings, jharokha oriels, chhatri kiosks, a bulbous onion, a barrel vault,
// solid stairs, instanced portholes and a spire with round flared collars. All are instanced.

/* ==== geometry cache and small utilities ==== */
const JJHOUSE_GEO={};
function jjHouseN(jjV){return typeof jjV==='number'?jjV.toFixed(2):String(jjV);}
function jjHouseGeo(jjKey,jjMake){if(!JJHOUSE_GEO[jjKey])JJHOUSE_GEO[jjKey]=jjMake();return JJHOUSE_GEO[jjKey];}
function jjHousePutGeo(jjKey,jjGeo,jjMat,jjX,jjY,jjZ,jjSX,jjSY,jjSZ,jjQ){jjPut('jj_house_'+jjKey+'_'+jjMat,jjGeo,JMAT[jjMat],jjX,jjY,jjZ,jjSX,jjSY,jjSZ,undefined,jjQ||null);}
function jjHouseBoxQ(jjX,jjY,jjZ,jjW,jjH,jjD,jjMat,jjQ){jjPut('jj_box_'+jjMat,JJGEO.box,JMAT[jjMat],jjX,jjY,jjZ,jjW,jjH,jjD,undefined,jjQ);}
// translate everything drawn inside (like jjWithYaw, but a shift): lets a builder centre its plot
function jjHouseShift(jjDx,jjDz,jjFn){const jjPrev=JJ.frame,jjT=new THREE.Matrix4().makeTranslation(jjDx,0,jjDz);JJ.frame=jjPrev?jjPrev.clone().multiply(jjT):jjT;try{jjFn();}finally{JJ.frame=jjPrev;}}

/* ==== masses: blocks, cornices, parapets, wall runs ==== */
// a wall mass from x0..x1, z0..z1, y0..y1 with optional base course, string courses and a cap
function jjHouseBlock(jjX0,jjX1,jjZ0,jjZ1,jjY0,jjY1,jjMat,jjO){jjO=jjO||{};
  const w=jjX1-jjX0,d=jjZ1-jjZ0,cx=(jjX0+jjX1)/2,cz=(jjZ0+jjZ1)/2;
  jjBox(cx,(jjY0+jjY1)/2,cz,w,jjY1-jjY0,d,jjMat);
  if(jjO.base)jjBox(cx,jjY0+jjO.base/2,cz,w+.1,jjO.base,d+.1,jjO.baseMat||'brickDeep');
  for(const b of (jjO.bands||[]))jjBox(cx,b,cz,w+.12,jjO.bandH||.2,d+.12,jjO.bandMat||'marble');
  if(jjO.cap)jjBox(cx,jjY1+.08,cz,w+.3,.16,d+.3,jjO.cap);}
// a three-step cornice round a block top; returns the top
function jjHouseCornice(jjX0,jjX1,jjZ0,jjZ1,jjY,jjO){jjO=jjO||{};
  const w=jjX1-jjX0,d=jjZ1-jjZ0,cx=(jjX0+jjX1)/2,cz=(jjZ0+jjZ1)/2;
  jjBox(cx,jjY+.11,cz,w+.16,.22,d+.16,jjO.m1||'brick');jjBox(cx,jjY+.32,cz,w+.36,.2,d+.36,jjO.m2||'brickYellow');jjBox(cx,jjY+.52,cz,w+.6,.2,d+.6,jjO.m3||'marble');
  return jjY+.62;}
// a parapet round a rectangle (inset inside it). skip:'fblr' drops sides, gap:{side,a,b} leaves an opening,
// merlon:spacing adds kangura merlons on top
function jjHouseParapet(jjX0,jjX1,jjZ0,jjZ1,jjY,jjO){jjO=jjO||{};
  const h=jjO.h||.9,t=jjO.t||.26,m=jjO.mat||'brick',skip=jjO.skip||'',gap=jjO.gap;
  const run=(side,a0,a1,fixed,alongX)=>{let segs=[[a0,a1]];if(gap&&gap.side===side){segs=[];if(gap.a>a0)segs.push([a0,gap.a]);if(gap.b<a1)segs.push([gap.b,a1]);}
    for(const s of segs){const L=s[1]-s[0],c=(s[0]+s[1])/2;if(L<.05)continue;
      if(alongX){jjBox(c,jjY+h/2,fixed,L,h,t,m);if(jjO.cope)jjBox(c,jjY+h+.06,fixed,L+.08,.12,t+.14,jjO.cope);}
      else{jjBox(fixed,jjY+h/2,c,t,h,L,m);if(jjO.cope)jjBox(fixed,jjY+h+.06,c,t+.14,.12,L+.08,jjO.cope);}
      if(jjO.merlon){const n=Math.max(1,Math.round(L/jjO.merlon)),mw=jjO.merlon*.5,mh=jjO.merlonH||.5,top=jjY+h+(jjO.cope?.12:0)+mh/2;
        for(let i=0;i<n;i++){const p=s[0]+L*(i+.5)/n;if(alongX)jjBox(p,top,fixed,mw,mh,t,jjO.merlonMat||m);else jjBox(fixed,top,p,t,mh,mw,jjO.merlonMat||m);}}}};
  if(skip.indexOf('f')<0)run('f',jjX0,jjX1,jjZ1-t/2,true);
  if(skip.indexOf('b')<0)run('b',jjX0,jjX1,jjZ0+t/2,true);
  if(skip.indexOf('l')<0)run('l',jjZ0,jjZ1,jjX0+t/2,false);
  if(skip.indexOf('r')<0)run('r',jjZ0,jjZ1,jjX1-t/2,false);}
// a free-standing straight wall (axis-aligned) with a marble cap and merlons
function jjHouseWallRun(jjX0,jjZ0,jjX1,jjZ1,jjH,jjO){jjO=jjO||{};const t=jjO.t||.32,alongX=Math.abs(jjX1-jjX0)>Math.abs(jjZ1-jjZ0),L=alongX?Math.abs(jjX1-jjX0):Math.abs(jjZ1-jjZ0),cx=(jjX0+jjX1)/2,cz=(jjZ0+jjZ1)/2,m=jjO.mat||'brick';
  if(alongX){jjBox(cx,jjH/2,cz,L,jjH,t,m);jjBox(cx,jjH+.07,cz,L+.1,.14,t+.12,jjO.cap||'marble');}else{jjBox(cx,jjH/2,cz,t,jjH,L,m);jjBox(cx,jjH+.07,cz,t+.12,.14,L+.1,jjO.cap||'marble');}
  if(jjO.base){if(alongX)jjBox(cx,jjO.base/2,cz,L+.06,jjO.base,t+.08,jjO.baseMat||'brickDeep');else jjBox(cx,jjO.base/2,cz,t+.08,jjO.base,L+.06,jjO.baseMat||'brickDeep');}
  if(jjO.merlon){const n=Math.max(1,Math.round(L/jjO.merlon)),mw=jjO.merlon*.5;for(let i=0;i<n;i++){const p=-L/2+L*(i+.5)/n;if(alongX)jjBox(cx+p,jjH+.14+.25,cz,mw,.5,t,jjO.merlonMat||m);else jjBox(cx,jjH+.14+.25,cz+p,t,.5,mw,jjO.merlonMat||m);}}}

/* ==== arched wall panels and colonnades (real openings, instanced) ==== */
// a panel W wide and H tall (base at y=0, centred on x=0), with round-headed openings notched up from
// its bottom edge: each opening centred at cx, ow wide, straight jambs to `spring`, then an arch of `rise`
function jjHouseArchGeo(jjW,jjH,jjCxs,jjOw,jjSpring,jjRise,jjD){
  return jjHouseGeo(['aw',jjW,jjH,jjCxs.map(jjHouseN).join(':'),jjOw,jjSpring,jjRise,jjD].map(jjHouseN).join('_'),()=>{
    const s=new THREE.Shape(),N=16;s.moveTo(-jjW/2,0);
    for(const cx of jjCxs){s.lineTo(cx-jjOw/2,0);if(jjSpring>.001)s.lineTo(cx-jjOw/2,jjSpring);
      for(let i=1;i<N;i++){const a=Math.PI-Math.PI*i/N;s.lineTo(cx+Math.cos(a)*jjOw/2,jjSpring+Math.sin(a)*jjRise);}
      if(jjSpring>.001)s.lineTo(cx+jjOw/2,jjSpring);s.lineTo(cx+jjOw/2,0);}
    s.lineTo(jjW/2,0);s.lineTo(jjW/2,jjH);s.lineTo(-jjW/2,jjH);
    const g=new THREE.ExtrudeGeometry(s,{depth:jjD,bevelEnabled:false});g.translate(0,0,-jjD/2);return g;});}
// the archivolt: a ring of thickness t following an arch of width ow and rise (base at the springing)
function jjHouseRingGeo(jjOw,jjRise,jjT,jjD){
  return jjHouseGeo(['ring',jjOw,jjRise,jjT,jjD].map(jjHouseN).join('_'),()=>{
    const s=new THREE.Shape(),N=16;s.moveTo(-jjOw/2-jjT,0);
    for(let i=1;i<=N;i++){const a=Math.PI-Math.PI*i/N;s.lineTo(Math.cos(a)*(jjOw/2+jjT),Math.sin(a)*(jjRise+jjT));}
    s.lineTo(jjOw/2,0);for(let i=1;i<N;i++){const a=Math.PI*i/N;s.lineTo(Math.cos(a)*jjOw/2,Math.sin(a)*jjRise);}s.lineTo(-jjOw/2,0);
    const g=new THREE.ExtrudeGeometry(s,{depth:jjD,bevelEnabled:false});g.translate(0,0,-jjD/2);return g;});}
// draw an arched panel at (x,y,z) (y = base, z = centre of its thickness), turned by ry like jjWithYaw
function jjHouseArchWall(jjX,jjY,jjZ,jjW,jjH,jjCxs,jjOw,jjSpring,jjRy,jjO){jjO=jjO||{};
  const rise=jjO.rise||jjOw/2,d=jjO.d||.5,mat=jjO.mat||'brick';
  jjWithYaw(jjX,jjY,jjZ,jjRy,()=>{
    const g=jjHouseArchGeo(jjW,jjH,jjCxs,jjOw,jjSpring,rise,d);
    jjPut('jj_house_aw_'+[jjW,jjH,jjCxs.map(jjHouseN).join(':'),jjOw,jjSpring,rise,d].map(jjHouseN).join('_')+'_'+mat,g,JMAT[mat],jjX,jjY,jjZ,1,1,1,undefined,null);
    if(jjO.trim!==false){const t=jjO.trimT||.2,rg=jjHouseRingGeo(jjOw,rise,t,.14);
      for(const cx of jjCxs){jjPut('jj_house_ring_'+[jjOw,rise,t].map(jjHouseN).join('_')+'_'+(jjO.trimMat||'marble'),rg,JMAT[jjO.trimMat||'marble'],jjX+cx,jjY+jjSpring,jjZ+d/2+.05,1,1,1,undefined,null);
        if(jjO.key)jjBox(jjX+cx,jjY+jjSpring+rise+t*.4,jjZ+d/2+.1,.3,t+.3,.2,jjO.key);}}});}
// a column with marble base and capital; pattern is a shaft texture ('diamond' …) or 'marble'/'brick'
function jjHouseCol(jjX,jjY,jjZ,jjR,jjH,jjPat){
  jjBox(jjX,jjY+.15,jjZ,jjR*2.7,.3,jjR*2.7,'marble');jjCylinder(jjX,jjY+.38,jjZ,jjR*1.25,.16,'marble',undefined,16);
  const sh=jjH-.96;jjCylinder(jjX,jjY+.46+sh/2,jjZ,jjR,sh,jjPat==='marble'||jjPat==='brick'?jjPat:'shaft_'+jjPat,undefined,32);
  jjCylinder(jjX,jjY+jjH-.42,jjZ,jjR*1.22,.16,'marble',undefined,16);jjBox(jjX,jjY+jjH-.17,jjZ,jjR*2.8,.34,jjR*2.8,'marble');}
// n bays of width `bay` on columns colH tall, with an arched spandrel panel spH tall above them
function jjHouseColonnade(jjX,jjY,jjZ,jjN,jjBay,jjColH,jjSpH,jjRy,jjO){jjO=jjO||{};
  const r=jjO.r||.3,span=jjN*jjBay,pats=jjO.patterns||['diamond'],cw=r*2.8,ow=jjBay-cw+.02,rise=Math.min(ow/2,jjSpH-.3),d=jjO.d||.6;
  jjWithYaw(jjX,jjY,jjZ,jjRy,()=>{
    for(let i=0;i<=jjN;i++){if(jjO.ends===false&&(i===0||i===jjN))continue;jjHouseCol(jjX-span/2+i*jjBay,jjY,jjZ,r,jjColH,pats[i%pats.length]);}
    const cxs=[];for(let i=0;i<jjN;i++)cxs.push(-span/2+jjBay*(i+.5));
    jjHouseArchWall(jjX,jjY+jjColH,jjZ,span+cw,jjSpH,cxs,ow,0,0,{rise,d,mat:jjO.mat||'brick',trimMat:jjO.trimMat,key:jjO.key});
    if(jjO.cornice!==false)jjBox(jjX,jjY+jjColH+jjSpH+.1,jjZ,span+cw+.3,.2,d+.3,jjO.corniceMat||'marble');
    if(jjO.rail)for(let i=0;i<jjN;i++)if(!(jjO.railSkip&&jjO.railSkip.indexOf(i)>=0))jjBox(jjX+cxs[i],jjY+.5,jjZ,ow,.9,.22,jjO.rail);});}

/* ==== windows, doors, lamps, portholes ==== */
// y = sill, z = wall face. Frame proud of the face; sill, hood (chhajja), shutters, bars optional.
function jjHouseWin(jjX,jjY,jjZ,jjW,jjH,jjRy,jjO){jjO=jjO||{};const t=jjO.t||.2,fm=jjO.frame||'marble';
  jjWithYaw(jjX,jjY,jjZ,jjRy,()=>{
    jjBox(jjX,jjY+jjH/2,jjZ+.03,jjW,jjH,.1,jjO.lit?'glass':'dark');
    if(jjO.arch)jjHouseArchWall(jjX,jjY,jjZ+.1,jjW+2*t,jjH+t,[0],jjW,jjH-jjW/2,0,{d:.12,mat:fm,trim:false});
    else{jjBox(jjX-jjW/2-t/2,jjY+jjH/2,jjZ+.08,t,jjH,.12,fm);jjBox(jjX+jjW/2+t/2,jjY+jjH/2,jjZ+.08,t,jjH,.12,fm);jjBox(jjX,jjY+jjH+t/2,jjZ+.09,jjW+2*t+(jjO.lintelX||.1),t,.16,jjO.lintel||fm);}
    if(jjO.sill!==false)jjBox(jjX,jjY-.06,jjZ+.12,jjW+2*t+.16,.12,.26,jjO.sillMat||fm);
    if(jjO.hood)jjBox(jjX,jjY+jjH+t+.08,jjZ+.26,jjW+2*t+.3,.1,.52,jjO.hood);
    if(jjO.shutter)for(const s of [-1,1])jjBox(jjX+s*(jjW/2+t+jjW*.25),jjY+jjH*.45,jjZ+.06,jjW*.48,jjH*.9,.07,jjO.shutter);
    if(jjO.bars)for(let i=1;i<4;i++)jjBox(jjX-jjW/2+jjW*i/4,jjY+jjH/2,jjZ+.1,.04,jjH,.04,'iron');});}
// y = threshold, z = wall face. arch:true gives a round head; lamps:true hangs a lit lamp either side
function jjHouseDoor(jjX,jjY,jjZ,jjW,jjH,jjRy,jjO){jjO=jjO||{};const t=jjO.t||.28,fm=jjO.frame||'marble';

// Jimjam military: the fortress, the barracks and the modular wall system.
// Seeds 9500-9599. Top-level prefixes: jjMil…, jjWallKit…, buildJjMil…, buildJjWall….
//
// ---- WALL SYSTEM: constants and the join rule --------------------------------------------------
// Every wall piece is drawn by a jjWallKit…(ox,oz,ry) function about an ORIGIN on the wall's centre
// line at grade. Its length runs along local +x and its OUTER face (the crenellated parapet) is +z.
//  * jj_wall_seg    spans x in [-JJ_WALL_SEG_LEN/2, +JJ_WALL_SEG_LEN/2] EXACTLY: nothing in it sticks
//                   out past its two end planes, and its merlons, corbels and pilasters repeat with a
//                   period that divides the length. So two segments whose origins are JJ_WALL_SEG_LEN
//                   apart along x meet face to face (no gap, no overlap) and the rhythm runs on
//                   unbroken. The walkway top is at y = JJ_WALL_H; the core is JJ_WALL_T thick.
//  * jj_wall_gate   is exactly JJ_WALL_GATE_SEGS segment lengths long (24 m): it takes N slots of a run.
//                   Its end walls carry a door at walkway height, so the walkway continues through it.
//  * jj_wall_tower  stands ON a joint (its origin is the joint point) and adds no length. Its drum
//                   (diameter 2*JJ_WALL_TOWER_R) swallows both segment ends; doors at walkway height
//                   open onto the walkway on -x and +x.
//  * jj_wall_corner stands on the joint of a leg arriving along +x and a leg leaving towards -z (that
//                   second leg is a segment with ry = +PI/2 whose origin is JJ_WALL_SEG_LEN/2 along -z).
//                   The outer faces stay outside (+z, then +x). Doors face -x and -z.
// A straight run is: origin_i = start + (i + 1/2) * JJ_WALL_SEG_LEN along the wall line; a gate takes
// JJ_WALL_GATE_SEGS slots (its origin at the middle of them); towers and corners sit on the joints.
const JJ_WALL_SEG_LEN=12,JJ_WALL_H=10,JJ_WALL_T=5,JJ_WALL_GATE_SEGS=2,JJ_WALL_TOWER_R=4.6,JJ_WALL_CORNER_R=5.6;

// ---- local materials (prefixed keys on JMAT: jjBox with a material OBJECT would share one kit item
// 'jj_box_custom' with every other custom material, so a string key is the safe way in)
JMAT.jjMilRock=new THREE.MeshStandardMaterial({color:jjColor(0x8c7a68),roughness:1,flatShading:true});
JMAT.jjMilSand=new THREE.MeshStandardMaterial({color:jjColor(0xc8aa80),roughness:1});

// ---- geometry -------------------------------------------------------------------------------------
const JJ_MIL_GEO={};
// a frustum (top radius = taper * bottom), u premultiplied by 2PI like the kit's cylinders, so the
// world-UV brick tiles by arc length
function jjMilFrustumGeo(jjT){const jjK='fr'+jjT;if(JJ_MIL_GEO[jjK])return JJ_MIL_GEO[jjK];const jjG=new THREE.CylinderGeometry(jjT,1,1,32),jjUv=jjG.attributes.uv,jjNo=jjG.attributes.normal;for(let jjI=0;jjI<jjUv.count;jjI++)if(Math.abs(jjNo.getY(jjI))<.5)jjUv.setX(jjI,jjUv.getX(jjI)*TAU);return JJ_MIL_GEO[jjK]=jjG;}
function jjMilFrustum(jjX,jjY,jjZ,jjR,jjH,jjTaper,jjMat,jjTint){jjPut('jjMil_fr'+jjTaper+'_'+jjMat,jjMilFrustumGeo(jjTaper),JMAT[jjMat],jjX,jjY+jjH/2,jjZ,jjR,jjH,jjR,jjTint);}
function jjMilRing(jjX,jjY,jjZ,jjR,jjH,jjMat){jjCylinder(jjX,jjY+jjH/2,jjZ,jjR,jjH,jjMat,undefined,32);}
// two-centred pointed arch: radius k*w, centres on the springing line. Points run left spring -> apex
// -> right spring; grow>0 gives the concentric outer line of an archivolt.
function jjMilArchPts(jjW,jjS,jjN,jjGrow){const jjR=.8*jjW,jjC=jjR-jjW/2,jjRg=jjR+(jjGrow||0),jjTa=Math.acos(-jjC/jjRg),jjOut=[];
 for(let jjI=0;jjI<=jjN;jjI++){const jjT=Math.PI+(jjTa-Math.PI)*jjI/jjN;jjOut.push([jjC+jjRg*Math.cos(jjT),jjS+jjRg*Math.sin(jjT)]);}
 for(let jjI=jjN-1;jjI>=0;jjI--)jjOut.push([-jjOut[jjI][0],jjOut[jjI][1]]);return jjOut;}
function jjMilArchY(jjW,jjS,jjX){const jjR=.8*jjW,jjC=jjR-jjW/2,jjA=Math.abs(jjX)+jjC;return jjA>=jjR?jjS:jjS+Math.sqrt(jjR*jjR-jjA*jjA);}
function jjMilArchHalfW(jjW,jjS,jjY){if(jjY<=jjS)return jjW/2;const jjR=.8*jjW,jjC=jjR-jjW/2,jjD=jjY-jjS;return jjD>=jjR?0:Math.max(0,Math.sqrt(jjR*jjR-jjD*jjD)-jjC);}
// a wall slab jjWs wide and jjH tall with a pointed opening jjW wide springing at jjS, jjDepth thick (centred in z)
function jjMilSlabGeo(jjWs,jjH,jjW,jjS,jjDepth){const jjK=['slab',jjWs,jjH,jjW,jjS,jjDepth].join('_');if(JJ_MIL_GEO[jjK])return JJ_MIL_GEO[jjK];
 const jjSh=new THREE.Shape();jjSh.moveTo(-jjWs/2,0);jjSh.lineTo(-jjW/2,0);for(const jjP of jjMilArchPts(jjW,jjS,14))jjSh.lineTo(jjP[0],jjP[1]);jjSh.lineTo(jjW/2,0);jjSh.lineTo(jjWs/2,0);jjSh.lineTo(jjWs/2,jjH);jjSh.lineTo(-jjWs/2,jjH);jjSh.closePath();
 const jjG=new THREE.ExtrudeGeometry(jjSh,{depth:jjDepth,bevelEnabled:false});jjG.translate(0,0,-jjDepth/2);return JJ_MIL_GEO[jjK]=jjG;}
// a marble archivolt with its jambs: the band between the opening and a line jjF outside it
function jjMilArchRingGeo(jjW,jjS,jjF,jjDepth){const jjK=['ring',jjW,jjS,jjF,jjDepth].join('_');if(JJ_MIL_GEO[jjK])return JJ_MIL_GEO[jjK];
 const jjSh=new THREE.Shape();jjSh.moveTo(-jjW/2-jjF,0);for(const jjP of jjMilArchPts(jjW,jjS,14,jjF))jjSh.lineTo(jjP[0],jjP[1]);jjSh.lineTo(jjW/2+jjF,0);jjSh.lineTo(jjW/2,0);for(const jjP of jjMilArchPts(jjW,jjS,14).reverse())jjSh.lineTo(jjP[0],jjP[1]);jjSh.lineTo(-jjW/2,0);jjSh.closePath();
 const jjG=new THREE.ExtrudeGeometry(jjSh,{depth:jjDepth,bevelEnabled:false});jjG.translate(0,0,-jjDepth/2);return JJ_MIL_GEO[jjK]=jjG;}

// sock() ignores JJ.frame (it reads only CM), so a banner inside jjWithYaw lands unrotated: carry the
// frame through by hand
function jjMilSock(jjType,jjX,jjY,jjZ,jjRy,jjO){if(JJ.frame){const jjV=new THREE.Vector3(jjX,jjY,jjZ).applyMatrix4(JJ.frame),jjA=new THREE.Vector3(1,0,0).transformDirection(JJ.frame);return sock(jjType,jjV.x,jjV.y,jjV.z,(jjRy||0)+Math.atan2(-jjA.z,jjA.x),jjO||{});}return sock(jjType,jjX,jjY,jjZ,jjRy||0,jjO||{});}

// ---- vocabulary ---------------------------------------------------------------------------------------
// merlons along x (period about 2 m, dividing jjL exactly), base at jjY
function jjMilMerlons(jjX,jjY,jjZ,jjL,jjD,jjH,jjMat){const jjN=Math.max(1,Math.round(jjL/2)),jjP=jjL/jjN;for(let jjK=0;jjK<jjN;jjK++){const jjXX=jjX-jjL/2+jjP*(jjK+.5);jjBox(jjXX,jjY+jjH/2,jjZ,jjP*.55,jjH,jjD,jjMat||'brick');jjBox(jjXX,jjY+jjH+.07,jjZ,jjP*.55+.12,.14,jjD+.12,'marble');}}
// a ring of merlons on a round parapet (base jjY, radius to the merlon centres)
function jjMilMerlonRing(jjX,jjY,jjZ,jjR,jjH){const jjN=Math.max(8,Math.round(TAU*jjR/2.1));jjMilRing(jjX,jjY,jjZ,jjR+.3,.9,'brick');jjMilRing(jjX,jjY+.9,jjZ,jjR+.36,.12,'marble');for(let jjI=0;jjI<jjN;jjI++){const jjA=jjI*TAU/jjN;jjBox(jjX+Math.cos(jjA)*jjR,jjY+1.02+jjH/2,jjZ+Math.sin(jjA)*jjR,TAU*jjR/jjN*.5,jjH,.62,'brick',undefined,-jjA-Math.PI/2);}}
// a thick staged round tower (image 2 massing): tapering brick stages, each headed by a corbel, a
// yellow course and a flared marble ring; a merlon crown; a cap. Windows: o.wins=[[stage,angle,yFrac],…]
// (angle 0 = +x, PI/2 = +z). Returns {y,r} of the top platform.
function jjMilTower(jjX,jjY,jjZ,jjR,jjO){jjO=jjO||{};const jjSt=jjO.stages||[12,6],jjTap=jjO.taper||.93,jjStep=jjO.step||.8,jjMat=jjO.mat||'brick';let jjRR=jjR,jjYY=jjY;
 jjMilRing(jjX,jjY,jjZ,jjR*1.07,1.4,'brickDeep');jjMilRing(jjX,jjY+1.4,jjZ,jjR*1.04,.24,'brickYellow');
 for(let jjI=0;jjI<jjSt.length;jjI++){const jjH=jjSt[jjI],jjRT=jjRR*jjTap,jjY0=jjYY;jjMilFrustum(jjX,jjY0,jjZ,jjRR,jjH,jjTap,jjMat);
  for(const jjF of jjH>9?[.36,.7]:[.5]){const jjRm=jjRR+(jjRT-jjRR)*jjF;jjMilRing(jjX,jjY0+jjH*jjF-.14,jjZ,jjRm*1.012+.02,.28,'brickYellow');}
  for(const jjW of (jjO.wins||[]))if(jjW[0]===jjI){const jjA=jjW[1],jjYw=jjY0+jjH*(jjW[2]||.5),jjRw=jjRR+(jjRT-jjRR)*(jjYw-jjY0)/jjH,jjC=Math.cos(jjA),jjS=Math.sin(jjA),jjRy=Math.PI/2-jjA;
   jjBox(jjX+jjC*jjRw,jjYw,jjZ+jjS*jjRw,.95,1.75,.3,'brickYellow',undefined,jjRy);jjBox(jjX+jjC*(jjRw+.12),jjYw-.05,jjZ+jjS*(jjRw+.12),.5,1.35,.12,jjO.lit?'glass':'dark',undefined,jjRy);jjBox(jjX+jjC*(jjRw+.12),jjYw-.85,jjZ+jjS*(jjRw+.12),1.05,.14,.36,'marble',undefined,jjRy);}
  jjMilFrustum(jjX,jjY0+jjH-.55,jjZ,jjRT,.55,1.1,'brickYellow');jjMilRing(jjX,jjY0+jjH,jjZ,jjRT*1.07+.16,.34,'marble');
  jjYY=jjY0+jjH+.34;jjRR=jjI<jjSt.length-1?jjRT*jjStep:jjRT;}
 const jjTop=jjYY;if(jjO.crenel!==false)jjMilMerlonRing(jjX,jjTop,jjZ,jjRR*1.04,1.1);
 const jjCap=jjO.cap||'gold';
 if(jjCap==='cone'){jjMilRing(jjX,jjTop,jjZ,jjRR*.72,1.6,'brickYellow');jjMilFrustum(jjX,jjTop+1.6,jjZ,jjRR*.86,jjRR*1.7,0,'slate');jjCylinder(jjX,jjTop+1.6+jjRR*1.7+.5,jjZ,.06,1,'gold');}
 else if(jjCap!=='none'){const jjDr=jjRR*(jjO.domeR||.7);jjMilRing(jjX,jjTop,jjZ,jjDr*1.02,1.7,'brickYellow');jjMilRing(jjX,jjTop+1.7,jjZ,jjDr*1.1,.22,'marble');jjDome(jjX,jjTop+1.92,jjZ,jjDr,{kind:jjCap,shape:jjO.shape||'onion'});}
 return{y:jjTop,r:jjRR};}
// a corbelled bartizan (the small bulbous turrets clustered on image 2's flanks); base of the drum at jjY
function jjMilBartizan(jjX,jjY,jjZ,jjR,jjKind){jjMilFrustum(jjX,jjY-1.7,jjZ,jjR*.3,1.7,1/.3,'brickYellow');jjMilFrustum(jjX,jjY,jjZ,jjR,2.4,.95,'brick');jjMilRing(jjX,jjY+2.4,jjZ,jjR*1.08,.2,'marble');jjDome(jjX,jjY+2.6,jjZ,jjR*.98,{kind:jjKind||'gold',shape:'onion'});}
// a battered curtain wall along x, centred on (jjX,jjZ), outer face +z, walkway top at jjY+jjH.
// Everything stays inside x in [jjX-jjL/2, jjX+jjL/2]; every repeat divides jjL (the wall join rule).
function jjMilCurtain(jjX,jjY,jjZ,jjL,jjH,jjT){const jjF=jjZ+jjT/2,jjB=jjZ-jjT/2,jjN=Math.max(1,Math.round(jjL/2)),jjP=jjL/jjN,jjM=Math.max(1,Math.round(jjL/6)),jjQ=jjL/jjM;
 jjBox(jjX,jjY+.9,jjZ,jjL,1.8,jjT+1.4,'brickDeep');jjBox(jjX,jjY+2.3,jjZ,jjL,1,jjT+.7,'brickDeep');jjBox(jjX,jjY+2.86,jjZ,jjL,.12,jjT+.76,'brickYellow');
 jjBox(jjX,jjY+(jjH-.14)/2,jjZ,jjL,jjH-.14,jjT,'brick');
 for(const jjYY of [4.2,7.2])if(jjYY<jjH-1.5)jjBox(jjX,jjY+jjYY,jjZ,jjL,.28,jjT+.1,'brickYellow');
 jjBox(jjX,jjY+jjH-.07,jjZ,jjL,.14,jjT,'brickYellow',jjColor(0xf0e2cc));
 // machicolation: a marble course on corbels below the parapet, outer face only
 jjBox(jjX,jjY+jjH-.25,jjF+.3,jjL,.5,.6,'marble');
 for(let jjK=0;jjK<jjN;jjK++)jjBox(jjX-jjL/2+jjP*(jjK+.5),jjY+jjH-.95,jjF+.22,.5,.9,.44,'brickYellow');
 // outer parapet with merlons (arrow slit in each)
 jjBox(jjX,jjY+jjH+.55,jjF-.15,jjL,1.1,.9,'brick');jjBox(jjX,jjY+jjH+1.16,jjF-.15,jjL,.12,1.0,'marble');
 jjMilMerlons(jjX,jjY+jjH+1.22,jjF-.15,jjL,.9,1.2,'brick');
 for(let jjK=0;jjK<jjN;jjK++)jjBox(jjX-jjL/2+jjP*(jjK+.5),jjY+jjH+1.85,jjF+.31,.13,.7,.04,'dark');
 // inner kerb with a marble rail
 jjBox(jjX,jjY+jjH+.3,jjB+.2,jjL,.6,.4,'brick');jjBox(jjX,jjY+jjH+.65,jjB+.2,jjL,.1,.5,'marble');
 // inner pilasters and outer arrow slits on the 6 m rhythm
 for(let jjK=0;jjK<jjM;jjK++){const jjXX=jjX-jjL/2+jjQ*(jjK+.5);jjBox(jjXX,jjY+(jjH-.6)/2,jjB-.3,1.3,jjH-.6,.6,'brick');jjBox(jjXX,jjY+jjH-.48,jjB-.35,1.5,.24,.75,'marble');
  jjBox(jjXX,jjY+jjH*.56,jjF+.03,.2,1.6,.06,'dark');jjBox(jjXX,jjY+jjH*.56-.88,jjF+.06,.6,.14,.14,'marble');jjBox(jjXX,jjY+jjH*.56+.88,jjF+.06,.6,.14,.14,'marble');}}
// a gate block jjL long (x), jjT thick (z), jjH tall, with a pointed passage jjOw wide springing at jjS:
// the pierced slab, the side blocks, footing, courses, marble archivolts on both faces, a paved passage,
// a half-raised portcullis near the outer face and the two leaves standing open inside.
function jjMilGateBlock(jjX,jjY,jjZ,jjL,jjT,jjH,jjOw,jjS,jjO){jjO=jjO||{};const jjWs=jjOw+3.6,jjSw=(jjL-jjWs)/2,jjF=jjZ+jjT/2,jjB=jjZ-jjT/2,jjApex=jjMilArchY(jjOw,jjS,0);
 jjMesh(jjMilSlabGeo(jjWs,jjH,jjOw,jjS,jjT),JMAT.brick,jjX,jjY,jjZ,0);
 for(const jjSg of [-1,1]){jjBox(jjX+jjSg*(jjWs/2+jjSw/2),jjY+jjH/2,jjZ,jjSw,jjH,jjT,'brick');const jjFw=jjL/2-jjOw/2;jjBox(jjX+jjSg*(jjOw/2+jjFw/2),jjY+.9,jjZ,jjFw,1.8,jjT+1.4,'brickDeep');jjBox(jjX+jjSg*(jjOw/2+jjFw/2),jjY+2.3,jjZ,jjFw,1,jjT+.7,'brickDeep');}
 // yellow courses, cut round the archivolt where they would cross the opening
 for(const jjYY of (jjO.courses||[4.2,7.2,10])){if(jjYY>jjH-.5)continue;const jjHw=jjYY<jjApex+.8?jjMilArchHalfW(jjOw,jjS,jjYY)+.75:0;if(jjHw<=0){jjBox(jjX,jjY+jjYY,jjZ,jjL,.28,jjT+.1,'brickYellow');continue;}const jjLw=jjL/2-jjHw;for(const jjSg of [-1,1])jjBox(jjX+jjSg*(jjHw+jjLw/2),jjY+jjYY,jjZ,jjLw,.28,jjT+.1,'brickYellow');}
 jjMesh(jjMilArchRingGeo(jjOw,jjS,.7,.5),JMAT.marble,jjX,jjY,jjF+.2,0);jjMesh(jjMilArchRingGeo(jjOw,jjS,.7,.5),JMAT.marble,jjX,jjY,jjB-.2,0);
 jjBox(jjX,jjY+.06,jjZ,jjOw,.12,jjT+1.6,'brickYellow',jjColor(0xe6d6c0));
 // portcullis, raised to jjPy: iron bars clipped to the arch line, spiked feet
 const jjZp=jjF-1.1,jjPy=jjY+(jjO.portY||jjS*.55);for(let jjXb=-jjOw/2+.3;jjXb<=jjOw/2-.25;jjXb+=.5){const jjTop=jjY+jjMilArchY(jjOw,jjS,jjXb)-.06;jjBeam([jjX+jjXb,jjPy-.35,jjZp],[jjX+jjXb,jjTop,jjZp],.055,'iron');}
 for(let jjYb=jjPy+.15;jjYb<jjY+jjApex-.4;jjYb+=.62){const jjHw=jjMilArchHalfW(jjOw,jjS,jjYb-jjY)-.05;jjBeam([jjX-jjHw,jjYb,jjZp],[jjX+jjHw,jjYb,jjZp],.05,'iron');}
 jjBox(jjX-jjOw/2-.02,jjY+jjS/2,jjZp,.2,jjS,.3,'dark');jjBox(jjX+jjOw/2+.02,jjY+jjS/2,jjZp,.2,jjS,.3,'dark');
 for(const jjSg of [-1,1]){jjBox(jjX+jjSg*(jjOw/2-.1),jjY+jjS*.48,jjB+.6+jjOw/4,.14,jjS*.96,jjOw/2,'wood');for(const jjYs of [.25,.7])jjBox(jjX+jjSg*(jjOw/2-.19),jjY+jjS*jjYs,jjB+.6+jjOw/4,.05,.14,jjOw/2,'iron');}
 return jjApex;}

// ---- wall pieces (each takes an origin and a yaw; see the join rule at the top) -----------------------
function jjWallKitSeg(jjOx,jjOz,jjRy){jjWithYaw(jjOx,0,jjOz,jjRy,()=>{jjMilCurtain(jjOx,0,jjOz,JJ_WALL_SEG_LEN,JJ_WALL_H,JJ_WALL_T);jjReg('Wall segment',jjOx,jjOz,JJ_WALL_SEG_LEN/2,JJ_WALL_H+2.5,{part:'wall segment'});});}
function jjWallKitTower(jjOx,jjOz,jjRy){jjWithYaw(jjOx,0,jjOz,jjRy,()=>{const jjR=JJ_WALL_TOWER_R,jjS0=JJ_WALL_H+4.6,jjTap=.93;
 const jjT=jjMilTower(jjOx,0,jjOz,jjR,{stages:[jjS0,5.2],taper:jjTap,cap:'slate',shape:'onion',wins:[[0,Math.PI/2,.36],[0,Math.PI/2,.86],[0,-Math.PI/2,.86],[1,Math.PI/2],[1,Math.PI/6],[1,Math.PI*5/6],[1,-Math.PI/2]]});
 // doors onto the walkway, both sides, sill at the walkway top
 const jjRh=jjR*(1-(1-jjTap)*JJ_WALL_H/jjS0);for(const jjSg of [-1,1]){jjDoor(jjOx+jjSg*(jjRh-.06),JJ_WALL_H,jjOz,1.25,2.35,jjSg*Math.PI/2,{mat:'dark'});jjBox(jjOx+jjSg*(jjRh+.05),JJ_WALL_H+2.75,jjOz,.3,.2,1.9,'marble');}

// ---------------------------------------------------------------- CULTURE PACKS (shared: core/sockets/)
// A building never names a culture. It declares sockets (36-def.js); the ACTIVE pack draws into them. To add a culture, add one cultDef() here
// (or in its own fragment 8x-*.js): {key,name,paint:[hex..],paintShare,signBg,signFg, fill:{awning,banner,flag,emblem,sign,paint}}. Any fill a pack
// omits falls back to the generic one. Fills run in the socket frame: origin at the anchor, +z out of the surface, +x along it, y up.
// canvas-carried materials (own colours, never tinted): emblems, striped cloth, sign boards
function cvMat(key,w,h,fn,o){o=o||{};const t=canvasTex(w,h,fn);t.wrapS=t.wrapT=o.repeat?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;
 const m=new THREE.MeshStandardMaterial({map:t,vertexColors:true,roughness:o.rough||.95,side:THREE.DoubleSide,transparent:!!o.alpha,alphaTest:o.alpha?.5:0});MAT[key]=m;TILE[key]=o.tile||1;return m;}
function stripeTex(key,cols,n,tile){cvMat(key,128,64,(g,w,h)=>{const sw=w/n;for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.fillRect(i*sw,0,sw+1,h);}
 reseed(9700+key.length);for(let i=0;i<140;i++){g.fillStyle=`rgba(${rng()<.5?0:255},${rng()<.5?0:255},${rng()<.5?0:255},${rr(.03,.1)})`;g.fillRect(rng()*w,rng()*h,rr(1,4),rr(1,6));}
 for(let i=0;i<5;i++){const x=rng()*w;g.fillStyle='rgba(50,30,20,.14)';g.fillRect(x,0,rr(1,3),h);}},{repeat:true,tile:tile||1.2});}
function drawTriskele(g,cx,cy,R,cols,lw){g.lineCap='round';g.lineWidth=lw;for(let k=0;k<3;k++){g.strokeStyle=cols[k%cols.length];g.beginPath();const a0=k*TAU/3-PI/2;
 for(let i=0;i<=24;i++){const t=i/24;const a=a0+t*2.5;const r=R*(.12+.86*t);const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(i)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();

cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,b:e.button};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{if(drag&&Math.abs(e.clientX-drag.sx)<4&&Math.abs(e.clientY-drag.sy)<4){if(drag.b===0&&POLY.on)polyAdd(e.clientX,e.clientY);else if(drag.b===2&&POLY.on){POLY.pts.pop();polyRedraw();}else if(drag.b===0&&!INSP.on)inspectAt(e.clientX,e.clientY);}drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!drag){if(INSP.on&&performance.now()-INSP.last>90){INSP.last=performance.now();inspectAt(e.clientX,e.clientY);}return;}
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(WALK.on){WALK.yaw-=dx*.004;WALK.pitch=clamp(WALK.pitch-dy*.004,-1.4,1.4);return;}
 if(drag.b===0){ctl.theta-=dx*.005;ctl.phi=clamp(ctl.phi-dy*.005,.05,Math.PI-.05);}
 else{const f=ctl.radius*.0015;const rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta));ctl.target.addScaledVector(rt,-dx*f).addScaledVector(fw,-dy*f);}});
cv.addEventListener('wheel',e=>{if(WALK.on){WALK.speed=clamp((WALK.speed||6)*(e.deltaY>0?.85:1.18),1,40);}else ctl.radius=clamp(ctl.radius*(e.deltaY>0?1.1:.9),2,3000);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='f')toggleWalk();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hud=document.getElementById('hud');let last=performance.now(),renderErr=false;
function frame(){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 if(WALK.on){const sp=(WALK.speed||6)*(keys.shift?2.5:1)*dt;const fw=new THREE.Vector3(-Math.sin(WALK.yaw),0,-Math.cos(WALK.yaw)),rt=new THREE.Vector3(Math.cos(WALK.yaw),0,-Math.sin(WALK.yaw));
  if(keys.w){WALK.x+=fw.x*sp;WALK.z+=fw.z*sp;}if(keys.s){WALK.x-=fw.x*sp;WALK.z-=fw.z*sp;}if(keys.d){WALK.x+=rt.x*sp;WALK.z+=rt.z*sp;}if(keys.a){WALK.x-=rt.x*sp;WALK.z-=rt.z*sp;}
  if(keys.e)WALK.y+=sp;if(keys.q)WALK.y-=sp;const ge=terrainH(WALK.x,WALK.z)+1.7;if(!keys.e&&!keys.q)WALK.y=ge;else WALK.y=Math.max(ge,WALK.y);}
 else{const sp=ctl.radius*.6*dt;const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta)),rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));
  if(keys.w)ctl.target.addScaledVector(fw,sp);if(keys.s)ctl.target.addScaledVector(fw,-sp);if(keys.d)ctl.target.addScaledVector(rt,sp);if(keys.a)ctl.target.addScaledVector(rt,-sp);
  if(keys.q)ctl.target.y-=sp;if(keys.e)ctl.target.y+=sp;}
 for(const f of FRAME_HOOKS)f(dt,now);
 applyCam();if(sky)sky.position.copy(camera.position);if(giant)giant.position.copy(camera.position).addScaledVector(giantDir,4000);
 try{renderer.render(scene,camera);}catch(e){if(!renderErr){renderErr=true;reportErr('render: '+e.stack);}}
 hud.textContent=`cam ${camera.position.x|0},${camera.position.y|0},${camera.position.z|0}  tgt ${ctl.target.x|0},${ctl.target.y|0},${ctl.target.z|0}${WALK.on?'  WALK':''}\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles/1e6).toFixed(2)}M  inst ${window._instances}  reg ${REG.length}`;
 requestAnimationFrame(frame);}
frame();window._ready=true;
// ---------------------------------------------------------------- floating building labels (standard new-world package)
// One label per registered volume (REG), drawn once into a texture atlas and rendered as ONE mesh of camera-facing
// quads: a thousand labels cost one draw call. Labels keep a constant size on screen (150 px; landmarks 260 px)
// and fade out past 300 m, landmarks never. Toggled with the Labels button (they live in the LABELS group).
// A world that already made LABELS (the city) gets the atlas added to it; one that did not gets the group made here.
const LABEL_ATLAS={W:4096,H:4096,cw:409,ch:48};
function labelsBuild(){
 if(!LABELS){LABELS=new THREE.Group();LABELS.visible=false;LABELS.userData.probeSkip=true;scene.add(LABELS);}
 const cols=Math.floor(LABEL_ATLAS.W/LABEL_ATLAS.cw),rows=Math.floor(LABEL_ATLAS.H/LABEL_ATLAS.ch),max=cols*rows;   // whole cells: 4096/409 is not an integer, and a fractional column count misaddressed every label past the first row
 // which volumes get a label: buildings, farms and furniture; not repeated wall segments (a name seen 8+ times)
 const count={};for(const r of REG)count[r.name]=(count[r.name]||0)+1;
 let list=REG.filter(r=>r.name&&count[r.name]<8&&(!r.cls||r.cls==='building'||r.cls==='farm'||r.cls==='furniture')&&!(r.tags&&r.tags.part==='wall'));
 const isBig=r=>!!(r.tags&&(r.tags.role||r.tags.landmark));
 list.sort((a,b)=>(isBig(b)-isBig(a))||(b.r-a.r));if(list.length>max)list=list.slice(0,max);
 const cv=document.createElement('canvas');cv.width=LABEL_ATLAS.W;cv.height=LABEL_ATLAS.H;const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
 const pos=[],apos=[],uv=[],cell=[],big=[],idx=[];
 list.forEach((r,i)=>{const cx=(i%cols)*LABEL_ATLAS.cw,cy=Math.floor(i/cols)*LABEL_ATLAS.ch;const B=isBig(r);
  g.fillStyle=B?'rgba(20,12,6,.72)':'rgba(0,0,0,.55)';g.fillRect(cx+1,cy+1,LABEL_ATLAS.cw-2,LABEL_ATLAS.ch-2);
  g.font=(B?'bold 34px':'bold 28px')+' system-ui,sans-serif';g.fillStyle=B?'#ffe2b0':'#f4e8d4';g.textAlign='center';g.textBaseline='middle';
  let t=r.name;while(g.measureText(t).width>LABEL_ATLAS.cw-10&&t.length>4)t=t.slice(0,-2);if(t!==r.name)t=t.slice(0,-1)+'…';g.fillText(t,cx+LABEL_ATLAS.cw/2,cy+LABEL_ATLAS.ch/2+1);
  const y=(r.y||0)+r.h+3,b=i*4;
  for(const c of[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]]){pos.push(c[0],c[1],0);apos.push(r.x,y,r.z);uv.push((cx+(c[0]+.5)*LABEL_ATLAS.cw)/LABEL_ATLAS.W,1-(cy+(0.5-c[1])*LABEL_ATLAS.ch)/LABEL_ATLAS.H);cell.push(0,0);big.push(B?1:0);}
  idx.push(b,b+1,b+2,b,b+2,b+3);});
 if(!list.length)return null;
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('aPos',new THREE.Float32BufferAttribute(apos,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setAttribute('aBig',new THREE.Float32BufferAttribute(big,1));geo.setIndex(idx);
 // the uv above already addresses the cell, so the shader only flips nothing: cell offsets are baked in
 const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
 const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:true,fog:false,
  uniforms:{map:{value:tex},uPxToWorld:{value:1}},
  vertexShader:`attribute vec3 aPos;attribute float aBig;uniform float uPxToWorld;varying vec2 vUv;varying float vA;
   void main(){vec4 mv=modelViewMatrix*vec4(aPos,1.0);float dist=-mv.z;float w=aBig>0.5?240.0:170.0;float k=dist*uPxToWorld;
    mv.xy+=position.xy*vec2(w*k,w*k*48.0/409.0);vA=aBig>0.5?1.0:(1.0-smoothstep(320.0,560.0,dist));vUv=uv;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;varying vec2 vUv;varying float vA;void main(){vec4 c=texture2D(map,vUv);c.a*=vA;if(c.a<0.02)discard;gl_FragColor=c;}`});
 const m=new THREE.Mesh(geo,mat);m.frustumCulled=false;m.userData.probeSkip=true;m.name='labels';m.renderOrder=10;LABELS.add(m);
 FRAME_HOOKS.push(()=>{mat.uniforms.uPxToWorld.value=2*Math.tan(camera.fov*Math.PI/360)/innerHeight;});
 window._labels=list.length;return m;}
labelsBuild();
</script>
