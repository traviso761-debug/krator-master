// PAN & ZOOM STATE
var scale = 0.65;
var panX = 0;
var panY = 0;
var isDragging = false;
var dragStart = {x: 0, y: 0};
var mapW = 1549, mapH = 1393;

var viewport = document.getElementById('viewport');
var container = document.getElementById('mapContainer');
var svgPolys = document.getElementById('layerPolygons');
var svgStations = document.getElementById('layerStations');

function updateTransform() {
  container.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
}

function resetView() {
  var vw = viewport.clientWidth;
  var vh = viewport.clientHeight;
  scale = Math.min(vw / mapW, vh / mapH) * 0.95;
  panX = (vw - mapW * scale) / 2;
  panY = (vh - mapH * scale) / 2;
  updateTransform();
}

// Mouse Drag Pan
viewport.addEventListener('mousedown', function(e) {
  if (e.target.closest('button, aside, header')) return;
  isDragging = true;
  viewport.classList.add('dragging');
  dragStart.x = e.clientX - panX;
  dragStart.y = e.clientY - panY;
});

window.addEventListener('mousemove', function(e) {
  if (isDragging) {
    panX = e.clientX - dragStart.x;
    panY = e.clientY - dragStart.y;
    updateTransform();
  }
});

window.addEventListener('mouseup', function() {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Mouse Wheel Zoom
viewport.addEventListener('wheel', function(e) {
  e.preventDefault();
  var rect = viewport.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  var zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
  var newScale = Math.max(0.25, Math.min(6.0, scale * zoomFactor));

  // Zoom centered on cursor
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

  var rect = viewport.getBoundingClientRect();
  var mx = e.clientX - rect.left;

  var px = Math.round((mx - panX) / scale);
  var py = Math.round((my - panY) / scale);

  if (px >= 0 && px < mapW && py >= 0 && py < mapH) {
    document.getElementById('probeCoords').textContent = 'X:' + px + ' Y:' + py;
    
    // Physical estimation model based on Krator 4.22 master survey
    var distCenter = Math.round(Math.hypot(px - 775, py - 696) * 2.0); // 2 km/px
    document.getElementById('probeDist').textContent = distCenter + ' km';

    // Elevation model approximation
    var estH = 1200;
    if (px > 1150 && py > 650 && py < 1030) { // Region 99 Loom-Chasms
      var cDist = Math.hypot(px - 1355, py - 840);
      if (cDist < 50) estH = 4650; // Mount Caelum
      else if (px < 1260) estH = 2180; // Weavers' Cradle
      else estH = 620; // Chasm floor
    } else if (px > 1180 && py > 1050) { // Region 98 Siphon Pits
      if (px < 1240) estH = 2180;
      else estH = 3800;
    }
    document.getElementById('probeElev').textContent = '+' + estH + ' m';
    var press = (1.6 * Math.exp(-estH / 8000)).toFixed(2);
    document.getElementById('probePress').textContent = press + ' atm';
    var tempC = (16.2 - estH * 0.0065).toFixed(1);
    document.getElementById('probeTemp').textContent = tempC + ' °C';

    // Check hit region
    var hit = null;
    for (var i = 0; i < REGIONS.length; i++) {
      if (pointInPoly([px, py], REGIONS[i].points)) {
        hit = REGIONS[i];
        break;
      }
    }
    document.getElementById('probeRegion').textContent = hit ? hit.name : 'Open Basin Ground';
  }
});

function pointInPoly(pt, pts) {
  var x = pt[0], y = pt[1];
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i][0], yi = pts[i][1];
    var xj = pts[j][0], yj = pts[j][1];
    var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function polyArea(pts) {
  var s = 0.0;
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.round(Math.abs(s) / 2 * 4.0); // 4 km² per map pixel
}

// RENDER POLYGONS & STATIONS
function renderMap() {
  svgPolys.innerHTML = '';
  svgStations.innerHTML = '';

  REGIONS.forEach(function(r) {
    var ptsStr = r.points.map(function(p) { return p[0] + ',' + p[1]; }).join(' ');
    var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', ptsStr);
    poly.setAttribute('id', 'poly-' + r.id);
    poly.setAttribute('class', 'region-poly ' + (r.id === selectedReg ? 'selected' : ''));
    poly.setAttribute('fill', r.color || '#3b82f6');
    poly.setAttribute('stroke', r.color || '#60a5fa');
    
    // Highlight Region 98 & 99 with custom dashed accent
    if (r.id === 'rmvraoas90co7' || r.id === 'rmvra9zogfm9t') {
      poly.setAttribute('stroke-dasharray', '6 3');
      poly.setAttribute('stroke-width', '3');
    }

    poly.onclick = function(e) {
      e.stopPropagation();
      selectRegion(r);
    };

    var title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = r.name + ' (' + (r.kind || 'biome') + ')';
    poly.appendChild(title);

    svgPolys.appendChild(poly);
  });

  // Draw Stations
  STATIONS.forEach(function(st) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'station-pin');
    g.setAttribute('transform', 'translate(' + st.px + ',' + st.py + ')');
    
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('r', '7');
    circle.setAttribute('fill', '#f59e0b');
    circle.setAttribute('stroke', '#fff');
    circle.setAttribute('stroke-width', '2');
    
    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('y', '3.5');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '9');
    text.setAttribute('font-weight', 'bold');
    text.setAttribute('fill', '#000');
    text.textContent = st.num;

    var title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = 'Station ' + st.num + ': ' + st.name + '\nElev: ' + st.elev + ' | P: ' + st.press + '\n' + st.desc;
    
    g.appendChild(circle);
    g.appendChild(text);
    g.appendChild(title);
    
    g.onclick = function(e) {
      e.stopPropagation();
      alert('STATION ' + st.num + ': ' + st.name + '\nElevation: ' + st.elev + ' | Pressure: ' + st.press + '\nTemp: ' + st.temp + '\n\n' + st.desc);
    };

    svgStations.appendChild(g);
  });
}

// SIDEBAR REGION LIST
function renderList() {
  var container = document.getElementById('regionList');
  container.innerHTML = '';

  var q = document.getElementById('regSearch').value.toLowerCase();
  var filtered = REGIONS.filter(function(r) {
    var matchesTab = (activeTab === 'all' || r.kind === activeTab);
    var matchesQuery = !q || r.name.toLowerCase().includes(q) || r.id.includes(q);
    return matchesTab && matchesQuery;
  });

  document.getElementById('regCount').textContent = filtered.length + ' regions';

  filtered.sort(function(a, b) { return a.name.localeCompare(b.name); }).forEach(function(r) {
    var item = document.createElement('div');
    item.className = 'p-2 rounded hover:bg-[#1f2536] cursor-pointer flex items-center justify-between transition ' + (r.id === selectedReg ? 'bg-[#283147] border border-amber-400/50' : '');
    
    var left = document.createElement('div');
    left.className = 'flex items-center gap-2 overflow-hidden';
    
    var dot = document.createElement('span');
    dot.className = 'w-2.5 h-2.5 rounded-full shrink-0';
    dot.style.background = r.color || '#3b82f6';
    
    var name = document.createElement('span');
    name.className = 'truncate font-medium text-gray-200';
    name.textContent = r.name;
    
    left.appendChild(dot);
    left.appendChild(name);
    
    var kindBadge = document.createElement('span');
    kindBadge.className = 'text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-gray-800/80 text-gray-400 shrink-0';
    kindBadge.textContent = r.kind || 'biome';
    
    item.appendChild(left);
    item.appendChild(kindBadge);
    
    item.onclick = function() {
      selectRegion(r);
      focusRegion(r.id);
    };

    container.appendChild(item);
  });
}

function setTab(tab) {
  activeTab = tab;
  ['all', 'biome', 'geographic', 'political'].forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    if (t === tab) {
      el.className = 'flex-1 py-1 text-center bg-amber-900/60 text-amber-200 font-semibold border-r border-[#2a3040]';
    } else {
      el.className = 'flex-1 py-1 text-center bg-gray-900 hover:bg-gray-800 text-gray-400 border-r border-[#2a3040]';
    }
  });
  renderList();
}

function filterList() {
  renderList();
}

function selectRegion(r) {
  selectedReg = r.id;
  document.querySelectorAll('.region-poly').forEach(function(p) {
    p.classList.toggle('selected', p.id === 'poly-' + r.id);
  });

  var card = document.getElementById('selectedCard');
  card.classList.remove('hidden');
  document.getElementById('cardName').textContent = r.name;
  document.getElementById('cardKind').textContent = r.kind || 'biome';
  document.getElementById('cardId').textContent = r.id;
  document.getElementById('cardArea').textContent = polyArea(r.points).toLocaleString() + ' km²';
  document.getElementById('cardNotes').textContent = r.notes || 'No survey notes recorded yet for this region boundary.';

  renderList();
}

function focusRegion(id) {
  var r = REGIONS.find(function(item) { return item.id === id; });
  if (!r) return;
  selectRegion(r);
  zoomToRegion(r);
}

function zoomToRegion(r) {
  var xs = r.points.map(function(p) { return p[0]; });
  var ys = r.points.map(function(p) { return p[1]; });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);

  var bbW = maxX - minX;
  var bbH = maxY - minY;
  var vw = viewport.clientWidth;
  var vh = viewport.clientHeight;

  scale = Math.min(vw / bbW, vh / bbH) * 0.65;
  scale = Math.max(0.6, Math.min(3.5, scale));

  var cx = (minX + maxX) / 2;
  var cy = (minY + maxY) / 2;

  panX = vw / 2 - cx * scale;
  panY = vh / 2 - cy * scale;
  updateTransform();
}

function zoomToSelected() {
  var r = REGIONS.find(function(item) { return item.id === selectedReg; });
  if (r) zoomToRegion(r);
}

// Initialize
window.onload = function() {
  renderMap();
  renderList();
  resetView();
  // Focus on Region 99 by default
  setTimeout(function() {
    focusRegion('rmvraoas90co7');
  }, 250);
};

window.onresize = function() {
  resetView();
};
</script>
