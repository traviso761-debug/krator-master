<!doctype html>
<html><head><meta charset="utf-8"><title>verify_page fixture</title>
<style>html,body{margin:0;background:#202428}#errs{position:fixed;left:0;top:0;color:#f88;font:12px monospace}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body><div id="errs"></div>
<script>
/* The negative cases for tools/harness.py verify_page (tools/tests/test_verify_page.py): ?case=clean passes every
   universal assert; each other case breaks exactly one, which must fail. */
const CASE = new URLSearchParams(location.search).get('case') || 'clean';
const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 12, 30); camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 8, 8).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({color: 0x557744}));
ground.name = 'ground'; scene.add(ground);
const box = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshLambertMaterial({color: 0xaa8855}));
box.name = 'crate'; box.position.set(0, 2, 0); scene.add(box);
/* a decoded texture: a 4x4 canvas */
const cv = document.createElement('canvas'); cv.width = cv.height = 4;
const tex = new THREE.CanvasTexture(cv);
const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({map: tex}));
sign.position.set(5, 1, 0); scene.add(sign);
if (CASE === 'broken-shader') {
  const bad = new THREE.ShaderMaterial({vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(NaN_is_not_glsl, 0.0, 0.0, 1.0); }'});
  const m = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bad); m.position.set(-5, 1, 0); scene.add(m);
}
if (CASE === 'lfs-texture') {
  /* an LFS pointer packed as a data URL, as pack.py did from a fresh worktree */
  const ptr = btoa('version https://git-lfs.github.com/spec/v1\noid sha256:0000\nsize 3000000\n');
  const t = new THREE.TextureLoader().load('data:image/jpeg;base64,' + ptr);
  sign.material.map = t; sign.material.needsUpdate = true;
}
if (CASE === 'eye-inside') camera.position.set(0, 2, 0.5);
if (CASE === 'eye-under') camera.position.set(20, -3, 20);
if (CASE === 'nan') { const g = box.geometry.clone(); g.attributes.position.array[0] = NaN; const n = new THREE.Mesh(g, box.material); n.position.x = 9; scene.add(n); }
if (CASE === 'instance-cap') {
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.1, 0.1), new THREE.MeshBasicMaterial(), 260000);
  im.name = 'runaway lilies'; scene.add(im);
}
if (CASE === 'error-panel') document.getElementById('errs').textContent = 'Error: a fragment threw';
/* the probe the biome builds carry, enough for the NaN and registry asserts */
window._api = {
  nanSweep() { let meshes = 0; scene.traverse(o => { if (o.isMesh && o.geometry.attributes.position.array.some(v => Number.isNaN(v))) meshes++; });
    return {meshes, instances: 0, first: [], firstInstances: []}; },
  regOccupancy() { return [{name: 'crate', n: 1}].concat(CASE === 'empty-volume' ? [{name: 'a moved hut', n: 0}] : []); }
};
function frame() { renderer.render(scene, camera); requestAnimationFrame(frame); }
frame();
window._ready = true;
</script></body></html>
