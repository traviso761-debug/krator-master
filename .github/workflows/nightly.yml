# Nightly, from Sunday 2026-10-11 (owner, 2026-10-08): everything checks.yml runs, plus the furniture fingerprint,
# verify.py --assert on the critical-path builds (headless Chromium, software GL) and the Godot headless tests.
# About 20 minutes. A schedule runs on the default branch only; run it by hand from the Actions tab at any time.
name: nightly
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GODOT_VERSION: 4.7.2-stable
    steps:
      - name: Started yet?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y%m%d)" -ge 20261011 ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "The nightly job starts on 2026-10-11."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run
        with:
          lfs: false
      - name: Key the packed textures
        if: steps.gate.outputs.run
        id: tex
        run: echo "key=lfs-tex-$(git lfs ls-files -l --include='*/*/tex/*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.gate.outputs.run
        with:
          path: .git/lfs
          key: ${{ steps.tex.outputs.key }}
          restore-keys: lfs-tex-
      - name: Pull the packed textures
        if: steps.gate.outputs.run
        run: git lfs pull --include='settlements/*/tex/*,kits/*/tex/*,biomes/*/tex/*,openworld/*/tex/*'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run
        with:
          node-version: '22'
      - name: Playwright and Chromium
        if: steps.gate.outputs.run
        run: pip install playwright && python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        if: steps.gate.outputs.run
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Godot (headless)
        if: steps.gate.outputs.run
        run: |
          B=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          if [ ! -x "$B" ]; then
            mkdir -p ~/godot
            curl -sSL -o ~/godot/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o -q ~/godot/g.zip -d ~/godot && rm ~/godot/g.zip && chmod +x "$B"
          fi
          echo "GODOT=$B" >> "$GITHUB_ENV"
          "$B" --headless --path godot --import || true
      - name: tools/test_all.py --nightly
        if: steps.gate.outputs.run
        run: python3 tools/test_all.py --nightly
