# Every push: the lints, the node tests, a rebuild of every build, the hash baseline, and a clean tree after it
# (every committed page is what its sources build). tools/test_all.py is the whole job; run it locally the same way.
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'   # pages and the texture library stay pointers; only the packs the builds read are pulled
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Key the packed textures
        id: tex
        run: echo "key=lfs-tex-$(git lfs ls-files -l --include='*/*/tex/*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.tex.outputs.key }}
          restore-keys: lfs-tex-
      - name: Git LFS's filters (the checkout skipped them; without the clean filter git compares a rebuilt page with its pointer)
        run: git lfs install --local --skip-smudge
      - name: Pull the packed textures (the builds embed them)
        run: git lfs pull --include='settlements/*/tex/*,kits/*/tex/*,biomes/*/tex/*,openworld/*/tex/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python packages the builds take (Pinnacle Rock's tools/world_data.py decodes the scale model's cut)
        run: pip install numpy pillow
      - name: tools/test_all.py
        run: python3 tools/test_all.py
      - name: The tree is clean after the rebuild
        # git diff compares content through the LFS filter; git status would flag every page that was checked out as a
        # pointer and rebuilt (stat-dirty, same content). Untracked files are listed apart.
        run: |
          CHANGED="$(git diff --name-only)"; NEW="$(git ls-files --others --exclude-standard)"
          [ -n "$CHANGED" ] && printf 'changed:\n%s\n' "$CHANGED"; [ -n "$NEW" ] && printf 'untracked:\n%s\n' "$NEW"
          test -z "$CHANGED$NEW" || { echo "::error::a committed page or manifest is not what its sources build: rebuild it and commit"; exit 1; }
