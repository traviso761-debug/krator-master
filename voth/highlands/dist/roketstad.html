  lattice(ca*SVR,sa*SVR,SVY,SVY+18,4,9,-a);
  // the bridge in to the gantry mast, on the same spine
  if(!mastBroke(k)){
   beam(GRT,[ca*(SVR-11),SVY-40,sa*(SVR-11)],[ca*(MSTR+15),SVY-40,sa*(MSTR+15)],1.6,8);
   for(let e=-1;e<=1;e+=2)beam(PL,[ca*(SVR-11)-e*3.6*sa,SVY-36.4,sa*(SVR-11)+e*3.6*ca],
     [ca*(MSTR+15)-e*3.6*sa,SVY-36.4,sa*(MSTR+15)+e*3.6*ca],2.6,1.3);}}

 // ---- the tank farm ----------------------------------------------------------
 // POSITION IN THE FILE IS LOAD-BEARING. This block pushes geometry into STL,
 // so it has to run BEFORE meshMerged(STL,...) at the bottom. Sat after the
 // merge — where it was first written — the three spheres were silently
 // dropped and only their kput fittings appeared: a band ring and a set of
 // legs standing round nothing. No invariant sees this; only a render does.
 // Three spherical propellant tanks in the 56 m lane between the mast ring at
 // 305 and the service towers at 361, each on a skirt of legs with a trunk main
 // running in toward the pit. The apron needed one piece of plant that is
 // obviously not architecture: everything else on the table is either structure
 // or paving, and without these the complex reads as a monument rather than as
 // somewhere a thing is fuelled.
 for(let t2=0;t2<3;t2++){const a=SBEAR(t2*2),ca=Math.cos(a),sa=Math.sin(a),TR=404,TKR=24,TKY=APY+34;
  const burst=dd&&t2===1;                         // one of the three has gone
  REGISTER({name:'Launch Arcology — propellant tank '+(t2+1),x:ca*TR,z:sa*TR,y:APY-2,r:TKR+14,h:76});
  if(!burst){
   STL.push(lathe({rFn:yy=>TKR*Math.sqrt(clamp(1-Math.pow((yy-TKR)/TKR,2),0,1)),H:TKR*2,nu:30,nv:16,
     hole:dd?(u,yy)=>fbm(u*9,yy*.14,9522,3)<.14:null}).translate(ca*TR,TKY,sa*TR));
   for(let j=0;j<10;j++){const th=j/10*TAU;       // the equatorial band and its legs
    kput(GRT,[ca*TR+Math.cos(th)*TKR*1.01,TKY+TKR,sa*TR+Math.sin(th)*TKR*1.01],TAN(th),
     [TAU*TKR/10*1.06,3.0,2.2],null);
    beam(PL,[ca*TR+Math.cos(th)*TKR*.86,APY,sa*TR+Math.sin(th)*TKR*.86],
             [ca*TR+Math.cos(th)*TKR*.99,TKY+TKR*.42,sa*TR+Math.sin(th)*TKR*.99],3.0,3.0);}
   if(!dd)kput('strip',[ca*TR,TKY+TKR*2+2,sa*TR],TAN(a),[10,1.6,1.6],WARM.clone().multiplyScalar(.8));}
  else{
   // split open and folded down: a hemisphere of plate lying on its own legs
   STL.push(gridSurface((u,v)=>{const th=u*TAU,rr2=TKR*Math.sin(v*1.15);
     return[ca*TR+Math.cos(th)*rr2,APY+3+TKR*.30*(1-Math.cos(v*1.15)),sa*TR+Math.sin(th)*rr2];},
     30,10,{uS:14,vS:8,hole:(u,v)=>fbm(u*7,v*4,9522,3)<.30}));
   lxRubble(ca*TR,APY,sa*TR,6,54,50,3.8);
   for(let j=0;j<8;j++){const th=j/8*TAU;
    beam(PL,[ca*TR+Math.cos(th)*TKR*.9,APY,sa*TR+Math.sin(th)*TKR*.9],
             [ca*TR+Math.cos(th)*TKR*rr(1.0,1.5),APY+rr(2,14),sa*TR+Math.sin(th)*TKR*rr(1.0,1.5)],3.0,3.0);}}
  // the trunk main in toward the pit wall, on saddles
  for(let j=0;j<9;j++){const r0=lerp(TR-TKR-4,PITR+16,j/9),r1=lerp(TR-TKR-4,PITR+16,(j+1)/9);
   if(dd&&rng()<.22)continue;
   beam(PIPE,[ca*r0,APY+3.4,sa*r0],[ca*r1,APY+3.4,sa*r1],3.2,3.2);
   kput(BX,[ca*r0,APY+1.2,sa*r0],qEuler(0,-a,0),[6,2.6,7],null);}}

 let rS=null,seamF=null;
 const P=new THREE.Group();
 if(dd){P.quaternion.copy(LQ);
  P.position.set(-BY0*Math.cos(LA)*Math.sin(TILT),BY0*(1-Math.cos(TILT)),-BY0*Math.sin(LA)*Math.sin(TILT));}
 G.add(P);useGroupXF(P);
 if(!pad){

 // ---- the blast skirt -------------------------------------------------------
 const skTear=a=>dd&&Math.abs(wrapA(a-LA))<.42+.18*(fbm(a*3.3,2.1,9527,2)-.5);
 SH.push(gridSurface((u,v)=>{const a=u*TAU,r=lerp(SKRO,rB(SKY1)*flut(a,bt(SKY1)),Math.pow(v,1.12));
   return[Math.cos(a)*r,lerp(SKY0,SKY1,v),Math.sin(a)*r];},160,22,{uS:60,vS:14,
   hole:(u,v)=>skTear(u*TAU)&&v<.72}));
 // the rim: a heavy chamfered ring with the hold-down lugs on it
 SH.push(gridSurface((u,v)=>{const a=u*TAU,r=SKRO*(1+.006*Math.sin(Math.PI*v));
   return[Math.cos(a)*r,SKY0+v*7,Math.sin(a)*r];},160,3,{uS:60,vS:2,hole:u=>skTear(u*TAU)}));
 for(let k=0;k<12;k++){const a=k*TAU/12;
  if(skTear(a))continue;
  kput(PL,[Math.cos(a)*(SKRO+2.4),SKY0+4,Math.sin(a)*(SKRO+2.4)],TAN(a),[15,9,7],null);}
 // THE SKIRT IS THE BIGGEST UNBROKEN SURFACE IN THE SILHOUETTE — 127 m of
 // flare over 86 m of rise, all of it facing the camera on any ground-level
 // view — and sixteen 4.4 m strakes were not enough to stop it reading as a
 // blank white cone. Twenty-four heavier strakes, three circumferential bands
 // and a ring of access hatches between them.
 const skR=(a,v)=>lerp(SKRO,rB(SKY1)*flut(a,bt(SKY1)),Math.pow(v,1.12));
 for(let k=0;k<24;k++){const a=k/24*TAU;
  if(skTear(a))continue;
  for(let i=0;i<6;i++){const v0=i/6,v1=(i+1)/6;
   beam(PL,[Math.cos(a)*skR(a,v0)*1.013,lerp(SKY0,SKY1,v0),Math.sin(a)*skR(a,v0)*1.013],
            [Math.cos(a)*skR(a,v1)*1.013,lerp(SKY0,SKY1,v1),Math.sin(a)*skR(a,v1)*1.013],6.0,6.0);}}
 for(const bv of [.20,.48,.76]){const nb2=Math.round(TAU*skR(0,bv)/11);
  for(let j=0;j<nb2;j++){const a=(j+.5)/nb2*TAU;
   if(skTear(a))continue;
   kput(PL,[Math.cos(a)*skR(a,bv)*1.010,lerp(SKY0,SKY1,bv),Math.sin(a)*skR(a,bv)*1.010],
    TAN(a),[TAU*skR(a,bv)/nb2*1.06,3.4,2.6],null);}}
 for(let k=0;k<24;k++){const a=(k+.5)/24*TAU,bv=.34;
  if(skTear(a)||(dd&&rng()<.3))continue;
  kput(PL,[Math.cos(a)*skR(a,bv)*1.006,lerp(SKY0,SKY1,bv),Math.sin(a)*skR(a,bv)*1.006],
   qFacing([Math.cos(a),0,Math.sin(a)]),[9,7,1.2],null);
  if(!dd&&k%3===0)kput('strip',[Math.cos(a)*skR(a,.62)*1.014,lerp(SKY0,SKY1,.62),Math.sin(a)*skR(a,.62)*1.014],
   TAN(a),[8,1.6,1.6],CYAN.clone().multiplyScalar(rr(.4,.9)));}

 // ---- the thrust plug and its seven bells -----------------------------------
 // The plug is a FULL disc at y=92 running out to r=150, i.e. wider than the
 // body (112.7 at its foot). That is what closes the body's open bottom when
 // you stand in the pit and look up: an annulus stopping at the skin would show
 // you straight up the inside of a 364 m tube. The soffit meets it at r=150.
 BEL.push(gridSurface((u,v)=>{const a=u*TAU,r=lerp(SKRO*.97,150,Math.pow(v,.8));
   return[Math.cos(a)*r,lerp(SKY0+9,PLGY,v),Math.sin(a)*r];},120,8,{uS:44,vS:8,
   hole:(u,v)=>skTear(u*TAU)&&v<.4}));
 BEL.push(gridSurface((u,v)=>{const a=u*TAU,r=150*(1-v);
   return[Math.cos(a)*r,PLGY,Math.sin(a)*r];},96,10,{uS:36,vS:10}));
 for(let k=0;k<36;k++){const a=(k+.5)/36*TAU;         // the plug's rim fascia
  kput(PL,[Math.cos(a)*150,PLGY+2.2,Math.sin(a)*150],TAN(a),[TAU*150/36*1.05,5,3],null);}
 // COFFERING UNDER THE PLUG. From the pit floor this 70 000 m2 disc is the
 // whole ceiling, and blank it read as a flat brown lid. Twenty-four radial
 // beams and three concentric rings give it a structure, and they are what
 // makes the seven bells read as hung from something.
 for(let k=0;k<24;k++){const a=k/24*TAU;
  beam(PL,[Math.cos(a)*14,PLGY-3.4,Math.sin(a)*14],[Math.cos(a)*148,PLGY-3.4,Math.sin(a)*148],5.2,3.0);}
 for(const cr of [46,96,138]){const nc=Math.round(TAU*cr/16);
  for(let k=0;k<nc;k++){const a=(k+.5)/nc*TAU;
   kput(PL,[Math.cos(a)*cr,PLGY-5.6,Math.sin(a)*cr],TAN(a),[TAU*cr/nc*1.06,3.2,2.4],null);}}
 const bell=(cx,cz,r0,r1,yt,yb)=>{
  BEL.push(gridSurface((u,v)=>{const a=u*TAU,r=r0+(r1-r0)*Math.pow(v,2.1);
    return[cx+Math.cos(a)*r,lerp(yt,yb,v),cz+Math.sin(a)*r];},36,10,{uS:14,vS:8}));
  for(let k=0;k<12;k++){const a=k/12*TAU;
   for(let i=0;i<4;i++){const v0=i/4,v1=(i+1)/4;
    const ra=r0+(r1-r0)*Math.pow(v0,2.1),rb2=r0+(r1-r0)*Math.pow(v1,2.1);
    beam(PL,[cx+Math.cos(a)*ra*1.03,lerp(yt,yb,v0),cz+Math.sin(a)*ra*1.03],
             [cx+Math.cos(a)*rb2*1.03,lerp(yt,yb,v1),cz+Math.sin(a)*rb2*1.03],2.2,2.2);}}
  for(let k=0;k<18;k++){const a=k/18*TAU;                 // the mouth ring
   kput(PL,[cx+Math.cos(a)*r1*1.02,yb,cz+Math.sin(a)*r1*1.02],TAN(a),[TAU*r1/18*1.05,3.4,3],null);}
  // the turbopump collar at the throat
  for(let k=0;k<8;k++){const a=k/8*TAU;
   kput(PIPE,[cx+Math.cos(a)*(r0+4),yt-5,cz+Math.sin(a)*(r0+4)],qEuler(0,0,0),[2.2,12,2.2],null);}};
 bell(0,0,10,30,PLGY,52);
 for(let k=0;k<6;k++){const a=k*TAU/6+Math.PI/6;
  bell(Math.cos(a)*86,Math.sin(a)*86,7,24,PLGY,56);}
 for(let k=0;k<24;k++){const a=(k+.5)/24*TAU;             // the throat lighting
  kput('strip',[Math.cos(a)*140,PLGY-3,Math.sin(a)*140],TAN(a),[24,2,2],
   (dd?rng()<.12:true)?WARM.clone().multiplyScalar(rr(.4,.8)):DEAD);}

 // ---- the body --------------------------------------------------------------
 SH.push(gridSurface((u,v)=>BP(u,lerp(BY0,BY1,v),1),176,150,{uS:66,vS:48,
   hole:(u,v)=>bHole(u,lerp(BY0,BY1,v))}));
 // WHAT A HOLE IN THIS BODY LOOKS THROUGH AT. The first pass put a smooth inner
 // drum at 0.80 rB, which is close enough to the skin that the 100 m gash the
 // collar cut read as a black rectangle stuck on the outside — no depth, no
 // interior, nothing to say the thing was inhabited. The core is now pulled
 // right back to 0.52 and the FLOOR PLATES run out to 0.94, so a tear shows a
 // stack of storeys in section, which is the whole point of breaking it open.
 if(dd){
  DKG.push(gridSurface((u,v)=>BP(u,lerp(BY0+3,BY1-3,v),.52),72,64,{uS:26,vS:22}));
  // The plate is PALE and its soffit 1.6 m under it is DARK, in two materials
  // rather than one. A section made entirely of MAT.guts reads as a flat grey
  // lake with no depth in it; the pale/dark banding is the whole of what makes
  // a stack of storeys legible through a tear.
  for(let y=BY0+16;y<BY1-12;y+=9.6){
   FLR.push(gridSurface((u,v)=>{const a=u*TAU,r=rB(y)*flut(a,bt(y))*lerp(.94,.30,v);
     return[Math.cos(a)*r,y,Math.sin(a)*r];},44,2,{uS:16,vS:2,
     hole:(u,v)=>fbm(u*6,v*3+y*.06,9528,3)<.24}));
   DKG.push(gridSurface((u,v)=>{const a=u*TAU,r=rB(y)*flut(a,bt(y))*lerp(.94,.30,v);
     return[Math.cos(a)*r,y-1.6,Math.sin(a)*r];},44,2,{uS:16,vS:2,
     hole:(u,v)=>fbm(u*6,v*3+y*.06+7,9528,3)<.38}));}
  // partitions: radial cross-walls between the core and the skin, so the
  // section reads as rooms rather than as a stack of shelves
  for(let k=0;k<18;k++){const a=k/18*TAU;
   DKG.push(gridSurface((u,v)=>{const y=lerp(BY0+16,BY1-12,u),r=rB(y)*lerp(.92,.54,v);
     return[Math.cos(a)*r,y,Math.sin(a)*r];},40,3,{uS:22,vS:3,
     hole:(u,v)=>fbm(u*7+k,v*2,9528+k,3)<.46}));}}
 // cornice bands every 32 m: 512 m of extrusion read as a stack of things
 for(let y=BY0+20;y<BY1-10;y+=32)
  SH.push(gridSurface((u,w)=>BP(u,y+(2*w-1)*2.2,1.012+.016*Math.sin(Math.PI*w)),152,4,
   {uS:56,vS:3,hole:(u,w)=>bHole(u,y+(2*w-1)*2.2)}));
 // the stringers, on the flute crests — cos(16a) puts those at u = k/16 exactly
 for(let k=0;k<16;k++){const u=k/16;
  for(let y=BY0+4;y<BY1-6;y+=15){
   if(bHole(u,y)||bHole(u,y+15))continue;
   beam(PL,BP(u,y,1.028),BP(u,y+15,1.028),3.6,4.8);}}
 // the occupied storeys
 for(let y=140;y<BY1-8;y+=7.4){
  let near=false;for(let i=0;i<TERR.length;i++)if(Math.abs(y-TERR[i])<8)near=true;
  if(near)continue;
  const n=Math.round(clamp(TAU*rB(y)/7.2,24,120));
  for(let i=0;i<n;i++){const u=(i+((Math.round(y/7.4)%2)?.25:.75))/n;
   if(bHole(u,y))continue;
   if(dd&&rng()<.30)continue;
   const p=BP(u,y,1),a=u*TAU,nx=Math.cos(a),nz=Math.sin(a);
   kput(PN,[p[0]+nx*.9,y,p[2]+nz*.9],qFacing([nx,0,nz]),[4.6,3.4,1],null);
   if(dd?rng()<.05:rng()<.28)
    kput('cell',[p[0]+nx*.25,y,p[2]+nz*.25],qFacing([nx,0,nz]),[4.2,3.0,1],
     litC(true,dd?.10:.30,dd?.30:.80));
   // A balcony on roughly one bay in eighteen. Two boxes each, and they are
   // most of what stops 512 m of window grid reading as an office block: a
   // balcony is the one opening a person is obviously meant to stand in.
   if(i%6===2&&Math.round(y/7.4)%3===0&&!(dd&&rng()<.45)){
    kput(BX,[p[0]+nx*2.6,y-2.0,p[2]+nz*2.6],TAN(a),[6.6,1.1,5.2],null);
    kput(BX,[p[0]+nx*5.0,y-.3,p[2]+nz*5.0],TAN(a),[6.6,2.4,.9],null);}}}
 // ---- the six terraces ------------------------------------------------------
 // The projection is NOT a monotone taper: the second terrace is the city's
 // main promenade and the widest thing on the body, and the ones above it draw
 // in toward the shroud. A straight taper made all six read as one cone.
 for(let ti=0;ti<TERR.length;ti++){const Y=TERR[ti],pr=TPR[ti];
  const hl=u=>bHole(u,Y);
  const tR=(a,f)=>rB(Y)*flut(a,bt(Y))*crush(a,Y)+pr*f;
  SH.push(gridSurface((u,v)=>{const a=u*TAU,r=tR(a,1-v);
    return[Math.cos(a)*r,Y,Math.sin(a)*r];},152,4,{uS:56,vS:5,hole:hl}));
  SH.push(gridSurface((u,v)=>{const a=u*TAU,r=tR(a,v);
    return[Math.cos(a)*r,Y-4.4,Math.sin(a)*r];},152,3,{uS:56,vS:5,hole:hl}));
  SH.push(gridSurface((u,v)=>{const a=u*TAU,r=tR(a,1)*(1+.010*Math.sin(Math.PI*v));
    return[Math.cos(a)*r,Y-4.4+v*4.4,Math.sin(a)*r];},152,3,{uS:56,vS:2,hole:hl}));
  const rOut=rB(Y)+pr;
  {const nP=Math.round(TAU*rOut/9);
   for(let j=0;j<nP;j++){const a=(j+.5)/nP*TAU;
    if(hl(a/TAU)||(dd&&rng()<.24))continue;
    kput(BX,[Math.cos(a)*tR(a,1.01),Y+2.1,Math.sin(a)*tR(a,1.01)],TAN(a),[TAU*rOut/nP*1.06,4.2,2.4],null);}}
  {const nD=Math.round(TAU*rB(Y)/26);
   for(let j=0;j<nD;j++){const a=(j+.35)/nD*TAU;
    if(hl(a/TAU)||(dd&&rng()<.2))continue;
    const p=BP(a/TAU,Y+5,1);
    // the arch is 9 m tall, so its CENTRE has to be 4 m above the deck or the
    // doorway is half buried in the terrace it opens onto
    kput('archOpen',[p[0]+Math.cos(a)*.7,Y+4.0,p[2]+Math.sin(a)*.7],qFacing([Math.cos(a),0,Math.sin(a)]),
     [.92,.86,1.1],null);}}
  {const nL=Math.round(TAU*rOut/17);
   for(let j=0;j<nL;j++){const a=(j+.5)/nL*TAU;
    if(hl(a/TAU))continue;
    kput('strip',[Math.cos(a)*tR(a,.94),Y+4.7,Math.sin(a)*tR(a,.94)],TAN(a),[TAU*rOut/nL*.82,1.6,1.6],
     litC(dd?rng()<.12:true,.4,.95));}}
  // ---- what makes a terrace read as a promenade and not a ledge ------------
  // A kerb trough with planting in it, kiosks backed against the body, and
  // enough people to give the 4 m parapet a scale. The first pass had twenty
  // figures spread over 660 m of ring — statistically none in any frame — and
  // an on-deck shot came back as an empty white floor.
  // THE LANE. The kerb trough sits at 0.78 of the projection and the kiosks
  // back on to the body at 0.14, which leaves a clear walking lane of about
  // 7.5 m between them — and that lane is the only place on the deck a camera
  // (or a person) can stand. At 0.70 / 0.22 it was 4 m wide and an on-deck shot
  // put a kiosk 1.5 m from the lens. Heights are deliberately low too: a 2.4 m
  // hedge and an 8 m kiosk, the first values tried, filled the frame edge to
  // edge from four metres away.
  {const nT=Math.round(TAU*rOut/18);
   for(let j=0;j<nT;j++){const a=(j+.2)/nT*TAU;
    if(hl(a/TAU))continue;
    const r=tR(a,.78);
    kput(BX,[Math.cos(a)*r,Y+.7,Math.sin(a)*r],TAN(a),[TAU*rOut/nT*.50,1.4,4.2],null);
    if(!dd||rng()<.55)kput('hedge',[Math.cos(a)*r,Y+2.0,Math.sin(a)*r],TAN(a),
     [TAU*rOut/nT*.44,1.6,3.0],new THREE.Color().setHSL(rr(.20,.34),rr(.24,.46),dd?rr(.09,.19):rr(.14,.27)));}}
  // Kiosks only on the three WIDE terraces. At pr=10 the kiosk's own depth
  // covers the whole walking lane and there is nowhere on the deck a person —
  // or a camera — could stand; the upper terraces get planting and people only.
  if(pr>=16){const nK=Math.round(TAU*rB(Y)/34);
   for(let j=0;j<nK;j++){const a=(j+.62)/nK*TAU;
    if(hl(a/TAU)||(dd&&rng()<.6))continue;
    const r=tR(a,.14),hk=rr(3.8,6.2);
    kput(BX,[Math.cos(a)*r,Y+hk*.5,Math.sin(a)*r],TAN(a),[rr(7,12),hk,Math.min(6.5,pr*.40)],null);
    if(!dd&&rng()<.55)kput('strip',[Math.cos(a)*(r+3.4),Y+hk+.8,Math.sin(a)*(r+3.4)],TAN(a),
     [8,1.4,1.4],CYAN.clone().multiplyScalar(rr(.5,1)));}}
  for(let j=0;j<(dd?10:46);j++){const a=rng()*TAU;
   if(hl(a/TAU))continue;
   const r=tR(a,rr(.34,.92));
   kput('figB',[Math.cos(a)*r,Y,Math.sin(a)*r],qEuler(0,rng()*TAU,0),1,
    new THREE.Color().setHSL(rr(0,.1),rr(.2,.5),rr(.25,.5)));
   kput('figH',[Math.cos(a)*r,Y,Math.sin(a)*r],null,1,new THREE.Color(0xc9a17e));}
  // TWO OF THE SIX CARRY A GLAZED GALLERY. Not glassBand(): that helper lays a
  // ledge slab of its own at 1.16x the radius under the glass, which on a
  // terrace that already has a deck hung a 250 m brown disc six metres over the
  // promenade and roofed the whole shot. Built here instead, so the gallery
  // sits on the deck that is already there.
  if(ti===1||ti===4){
   const gy=Y+6,gh=13;
   if(d===0)mesh(lathe({rFn:yy=>rB(gy+yy)*1.045,H:gh,nu:56,nv:4}),MAT.glass,P,0,gy,0);
   SH.push(gridSurface((u,v)=>{const a=u*TAU,r=rB(lerp(gy,gy+gh,v))*flut(a,bt(gy))*1.004;
     return[Math.cos(a)*r,lerp(gy,gy+gh,v),Math.sin(a)*r];},120,4,{uS:44,vS:6,hole:u=>bHole(u,gy)}));
   const nM=Math.round(TAU*rB(gy)/9);
   for(let j=0;j<nM;j++){const a=j/nM*TAU;
    if(hl(a/TAU)||(dd&&rng()<.22))continue;
    kput(dd?'mullR':'mullW',[Math.cos(a)*rB(gy)*1.05,gy+gh*.5,Math.sin(a)*rB(gy)*1.05],
     qEuler(0,-a,0),[1.3,gh,1.3],null);}
   const nS2=Math.round(TAU*rB(gy)/16);
   for(let j=0;j<nS2;j++){const a=(j+.5)/nS2*TAU;
    if(hl(a/TAU))continue;
    kput('strip',[Math.cos(a)*rB(gy)*1.03,gy+gh-1.4,Math.sin(a)*rB(gy)*1.03],TAN(a),
     [TAU*rB(gy)/nS2*.82,1.6,1.6],litC(dd?rng()<.14:true,.5,1));}}}

 // ---- the crown: a payload shroud, not a roof --------------------------------
 // An ogive on four panels, latched to the body by two explosive bands and
 // topped by a pilot mast. Nothing here is habitable and nothing here is a
 // parapet: the point of a shroud is that it is meant to come off.
 // BARREL THEN OGIVE, not one continuous curve. The base radius is 62 against a
 // body that ends at 58 — a 4 m step that reads as a joint; at 70, the first
 // value, the shroud sat on the body like a bulb on a stick. But a single
 // (1-t^2) curve off that base is an EGG, which is what came back: 156 m of
 // blank white dome. A straight-sided barrel to y=660 carrying the latch bands
 // and the ports, with the ogive starting above it, is what makes it read as a
 // shroud — a thing with a joint, a cylinder and a nose.
 const SBAR=660;
 rS=y=>{if(y<=SBAR)return lerp(62,57.5,clamp((y-SY0)/(SBAR-SY0),0,1));
  const t=clamp((y-SBAR)/(SY1-SBAR),0,1);
  return 57.5*Math.pow(clamp(1-t*t,0,1),.55);};
 // The seams between the four panels, as a groove in the radius. At 2.8% deep
 // and 0.05 rad wide they did not survive being seen from 400 m; 5.5% over
 // 0.085 rad reads, and the rib sitting in each one reads with it.
 seamF=a=>{let m=1;for(let k=0;k<4;k++){
   const dA=Math.abs(wrapA(a-(k/4+.125)*TAU));if(dA<.085)m=Math.min(m,1-.055*(1-dA/.085));}
  return m;};
 SH.push(gridSurface((u,v)=>{const a=u*TAU,y=lerp(SY0,SY1,v),r=rS(y)*seamF(a)*(1+.008*Math.cos(12*a));
   return[Math.cos(a)*r,y,Math.sin(a)*r];},128,44,{uS:48,vS:20,
   hole:(u,v)=>shGone(u,lerp(SY0,SY1,v))}));
 // the boat-tail joint down onto the body, and the two latch bands
 SH.push(gridSurface((u,v)=>{const a=u*TAU,r=lerp(rB(BY1)*flut(a,1),62,Math.pow(v,.7));
   return[Math.cos(a)*r,lerp(BY1-9,SY0,v),Math.sin(a)*r];},128,4,{uS:48,vS:3}));
 for(let b=0;b<2;b++){const y=SY0+4+b*13;
  const nb=Math.round(TAU*rS(y)/7);
  for(let j=0;j<nb;j++){const a=(j+.5)/nb*TAU;
   if(shGone(a/TAU,y+10)&&rng()<.6)continue;
   kput(PL,[Math.cos(a)*rS(y)*1.02,y,Math.sin(a)*rS(y)*1.02],TAN(a),[TAU*rS(y)/nb*1.05,4.4,3.2],null);}}
 for(let k=0;k<4;k++){const a=(k/4+.125)*TAU;             // the seam ribs
  for(let i=0;i<20;i++){const y0=lerp(SY0,SY1-6,i/20),y1=lerp(SY0,SY1-6,(i+1)/20);
   if(shGone(a/TAU+.01,y0)||shGone(a/TAU-.01,y0))continue;
   beam(PL,[Math.cos(a)*rS(y0)*1.018,y0,Math.sin(a)*rS(y0)*1.018],
            [Math.cos(a)*rS(y1)*1.018,y1,Math.sin(a)*rS(y1)*1.018],3.0,3.6);}}
 for(let i=0;i<18;i++){const y=SY0+16+i*22;               // sensor ports
  if(y>SY1-30)break;
  for(let k=0;k<3;k++){const a=(k/3+.06*i)*TAU;
   if(shGone(a/TAU,y))continue;
   kput(dd?'ovalD':'ovalI',[Math.cos(a)*rS(y)*1.01,y,Math.sin(a)*rS(y)*1.01],
    qFacing([Math.cos(a),0,Math.sin(a)]),[2.6,2.6,1],null);}}
 // TWENTY STRINGERS AND SEVEN FRAME BANDS. The body earns its verticals from
 // sixteen flutes in the surface itself; the shroud has no flutes, so without
 // these the nose was the one part of an 838 m structure with nothing on it at
 // all — a smooth white dome sitting on a building covered in relief.
 for(let k=0;k<20;k++){const a=(k+.5)/20*TAU;
  for(let i=0;i<16;i++){const y0=lerp(SY0+2,SY1-14,i/16),y1=lerp(SY0+2,SY1-14,(i+1)/16);
   if(shGone(a/TAU,y0))continue;
   if(rS(y1)<3)break;
   beam(PL,[Math.cos(a)*rS(y0)*1.012,y0,Math.sin(a)*rS(y0)*1.012],
            [Math.cos(a)*rS(y1)*1.012,y1,Math.sin(a)*rS(y1)*1.012],2.0,2.6);}}
 for(let i=0;i<7;i++){const y=lerp(SY0+30,SY1-26,i/6),rr2=rS(y);
  if(rr2<5)continue;
  const nb=Math.max(10,Math.round(TAU*rr2/9));
  for(let j=0;j<nb;j++){const a=(j+.5)/nb*TAU;
   if(shGone(a/TAU,y)||(dd&&rng()<.2))continue;
   kput(PL,[Math.cos(a)*rr2*1.016,y,Math.sin(a)*rr2*1.016],TAN(a),[TAU*rr2/nb*1.06,2.4,2.0],null);}}
 // a lit ring at the barrel/ogive joint, so the crown has a signal on it
 {const nr=Math.round(TAU*rS(SBAR)/13);
  for(let j=0;j<nr;j++){const a=(j+.5)/nr*TAU;
   if(shGone(a/TAU,SBAR))continue;
   kput('strip',[Math.cos(a)*rS(SBAR)*1.03,SBAR,Math.sin(a)*rS(SBAR)*1.03],TAN(a),
    [TAU*rS(SBAR)/nr*.78,1.6,1.6],litC(dd?rng()<.08:true,.5,1));}}
 // the payload frame inside: ring frames and longerons, seen once a panel goes
 if(dd){
  for(let i=0;i<8;i++){const y=SY0+10+i*17;
   DKG.push(gridSurface((u,v)=>{const a=u*TAU,r=rS(y)*.78*(1-v*.14);
     return[Math.cos(a)*r,y,Math.sin(a)*r];},40,2,{uS:14,vS:2}));}
  DKG.push(gridSurface((u,v)=>{const a=u*TAU,y=lerp(SY0,SY1-24,v);
    return[Math.cos(a)*rS(y)*.62,y,Math.sin(a)*rS(y)*.62];},48,20,{uS:18,vS:12}));
  for(let k=0;k<12;k++){const a=k/12*TAU;
   for(let i=0;i<7;i++){const y0=SY0+10+i*17,y1=y0+17;
    beam(PL,[Math.cos(a)*rS(y0)*.78,y0,Math.sin(a)*rS(y0)*.78],
             [Math.cos(a)*rS(y1)*.78,y1,Math.sin(a)*rS(y1)*.78],2,2);}}}
 // the pilot mast
 if(!dd||rng()<.5){
  SH.push(gridSurface((u,v)=>{const a=u*TAU,r=lerp(rS(SY1-2),1.1,Math.pow(v,.8));
    return[Math.cos(a)*r,lerp(SY1-2,STIP,v),Math.sin(a)*r];},24,10,{uS:8,vS:8}));
  if(!dd){kput('finial',[0,STIP+4,0],null,[3.4,8,3.4],null);
   for(let k=0;k<8;k++){const a=k/8*TAU;
    kput('strip',[Math.cos(a)*3.6,STIP-10,Math.sin(a)*3.6],TAN(a),[3,1.2,1.2],CYAN);}}}

 // ---- the umbilical arms: the gantry's reach, and the city's front door ------
 // Placed here, inside P, because the ARM is part of the picture of a vehicle
 // being serviced; the ring it hangs off is outside. The two ends are computed
 // in different frames on purpose — BWP() puts the body end where the leaning
 // body actually is, which is what makes the torn arms in the ruin read.
 endGroupXF();
 for(let k=0;k<6;k++){const a=SBEAR(k),ca=Math.cos(a),sa=Math.sin(a);
  if(mastBroke(k)||ringGap(a))continue;
  for(let lev=0;lev<3;lev++){const y=CY0+lev*34;
   const B=BWP(a/TAU,y,1);
   const inr=Math.hypot(B[0],B[2]);
   beam(GRT,[ca*CRI,y,sa*CRI],[B[0]+ca*3,y+(B[1]-y)*.4,B[2]+sa*3],7,5.4);
   for(let e=-1;e<=1;e+=2)beam(PL,[ca*CRI-e*4*sa,y+3.4,sa*CRI+e*4*ca],
     [B[0]+ca*3-e*4*sa,y+(B[1]-y)*.4+3.4,B[2]+sa*3+e*4*ca],2.8,1.4);
   // the hose bundle, sagging between the ring and the plug head
   if(lev!==1)for(let h=-1;h<=1;h+=2){
    const mx=(ca*CRI+B[0])/2-h*6*sa,mz=(sa*CRI+B[2])/2+h*6*ca;
    beam(PIPE,[ca*(CRI+4)-h*6*sa,y-2,sa*(CRI+4)+h*6*ca],[mx,y-11,mz],2.4,2.4);
    beam(PIPE,[mx,y-11,mz],[B[0]+ca*4-h*6*sa,y+(B[1]-y)*.4-2,B[2]+sa*4+h*6*ca],2.4,2.4);}
   kput(PAD,[ca*(CRI-6),y+1,sa*(CRI-6)],qEuler(Math.PI/2,0,0),[8,7,8],null);
   kput(GRT,[B[0]+ca*4,y+(B[1]-y)*.4,B[2]+sa*4],qEuler(0,-a,0),[12,9,8],null);
   if(!dd)kput('strip',[(ca*CRI+B[0])/2,y+5.2,(sa*CRI+B[2])/2],TAN(a),[inr*.3,1.6,1.6],CYAN);}
  // THE TWO LOWER ACCESS BRIDGES, mast to terrace. The clear span is ~175 m —
  // the masts had to move out to r=300 to clear the skirt — so these are proper
  // Warren trusses with a bottom chord 24 m down, not a deck on props. A deck
  // beam alone at this length reads as a plank and makes the whole complex look
  // like a model.
  for(let bi=0;bi<2;bi++){const y=TERR[bi===0?0:2];
   const B=BWP(a/TAU,y,1);
   const X0=[ca*(MSTR-15),sa*(MSTR-15)],X1=[B[0]+ca*2,B[2]+sa*2];
   const px=t=>lerp(X0[0],X1[0],t),pz=t=>lerp(X0[1],X1[1],t);
   beam(GRT,[X0[0],y,X0[1]],[X1[0],y,X1[1]],1.8,11);
   beam(PL,[X0[0],y-24,X0[1]],[X1[0],y-24,X1[1]],2.6,6.0);
   for(let e=-1;e<=1;e+=2)beam(PL,[X0[0]-e*4.8*sa,y+3.4,X0[1]+e*4.8*ca],
     [X1[0]-e*4.8*sa,y+3.4,X1[1]+e*4.8*ca],2.8,1.4);
   const nS=Math.max(3,Math.round(Math.hypot(X1[0]-X0[0],X1[1]-X0[1])/22));
   for(let j=0;j<=nS;j++){const t=j/nS;
    beam(PL,[px(t),y-1,pz(t)],[px(t),y-23,pz(t)],2.6,2.6);
    if(j<nS)beam(PL,[px(t),y-23,pz(t)],[px(t+1/nS),y-1,pz(t+1/nS)],2.2,2.2);}
   if(!dd)kput('strip',[px(.5),y+4.6,pz(.5)],TAN(a),
    [Math.hypot(X1[0]-X0[0],X1[1]-X0[1])*.4,1.6,1.6],CYAN);}}
 useGroupXF(P);

 // ---- the ruin's dressing on the vehicle ------------------------------------
 // PEELED PLATE ROUND THE GASH. The tear is a hole in a 0.4 m skin; with a
 // clean edge it reads as a rectangle cut out with scissors, however ragged the
 // predicate is. These walk OUT from the centre of the gash at a given height
 // until bHole stops being true — which is the actual edge, wherever the fbm
 // put it — and hang a bent plate off it.
 if(dd)for(let i=0;i<64;i++){const y=rr(298,412);
  for(let sgn=-1;sgn<=1;sgn+=2){
   if(rng()<.42)continue;
   let u=(LA+sgn*.04)/TAU;const st=sgn*.0035;let gu=null;
   for(let s2=0;s2<50;s2++){if(!bHole(u,y))break;gu=u;u+=st;}
   if(gu===null)continue;
   const p=BP(gu,y,1),a=gu*TAU;
   beam(PL,[p[0],y,p[2]],
         [p[0]+Math.cos(a)*rr(3,13)+rr(-5,5),y-rr(4,22),p[2]+Math.sin(a)*rr(3,13)+rr(-5,5)],
    rr(2,6.5),rr(1.4,4));}}
 if(dd){mossOnSurface(SH,0,0,0,150,4.4);
  vinesFromLedge(SH,0,0,0,120,22);
  stainsFromLedge(SH,0,0,0,170,24);}
 endGroupXF();
 }
 if(SH.length)meshMerged(SH,skin,P);
 if(DKG.length)meshMerged(DKG,MAT.guts,P);
 if(FLR.length)meshMerged(FLR,CONC(dd),P);
 if(BEL.length)meshMerged(BEL,bellM,P);

 // ===========================================================================
 // BACK ON THE GROUND
 // ===========================================================================
 meshMerged(GRD,deckM,G);
 meshMerged(SCO,scorchM,G);
 meshMerged(MND,dd?MAT.mud:MAT.rock,G);
 meshMerged(STL,bellM,G);
 // Started WELL INSIDE the berm toe, not just outside it: both are MAT.rock /
 // MAT.mud so the overlap is invisible, whereas a gap is not.
 apron(G,0,0,MNDR*.86,MNDR*1.18,d,10);

 // people and vehicles on the pad
 for(let i=0;i<(dd?10:46);i++){const a=rng()*TAU,r=rr(268,APR-26);
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(inTrench(x,z,10)>=0||crushHole(x,z))continue;
  kput('figB',[x,APY,z],qEuler(0,rng()*TAU,0),1,new THREE.Color().setHSL(rr(0,.1),rr(.2,.5),rr(.25,.5)));
  kput('figH',[x,APY,z],null,1,new THREE.Color(0xc9a17e));}
 for(let i=0;i<(dd?6:16);i++){const a=rng()*TAU,r=rr(276,APR-34);
  const x=Math.cos(a)*r,z=Math.sin(a)*r;

// A bark canvas here carries TWO things: R = the relief (grey, normalised by
// its own mean in the shader so the vertex colour is the albedo), G = a MASK
// that swaps the vertex colour for the bucket's second colour. That is how a
// madrone is red with green-white flayed patches, a manzanita red with char
// streaks, a ringbark copper with pale lenticels, a cypress cinnamon with grey
// weathered strands -- one draw call per look, species colours per vertex.
// uGain folds in the light rig: sun + hemisphere render an albedo about twice
// as bright as it is written, so a designer's colour is multiplied down here
// and the palettes above stay what the bark should look like. uGloss adds a
// sun highlight (manzanita, lacquered mangrove, the ringbark's sheen).
function wrap9(W,H,fn){for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)fn(i*W,j*H);}
function blob(g,x,y,w,h,wob,sl){g.beginPath();const n=14,sd=w*1.7+h*.31;for(let k=0;k<=n;k++){const a=k/n*TAU,r=1+wob*(h3(sd,k%n,7)-.5)*2;   // shape from its size only: every wrapped copy is identical
 const px=Math.cos(a)*w*r,py=Math.sin(a)*h*r;const X=x+px+py*sl,Y=y+py;k?g.lineTo(X,Y):g.moveTo(X,Y);}g.closePath();g.fill();}

// a TUFT: three crossed vertical quads, origin at the base, up to y=1
G.tuft=function(){const pos=[],uv=[],nor=[];
 for(let k=0;k<3;k++){const a=k/3*Math.PI+.2,ca=Math.cos(a),sa=Math.sin(a);
  const P=[[-.5,0],[.5,0],[.5,1],[-.5,1]].map(q=>[ca*q[0],q[1],sa*q[0],q[0]+.5,1-q[1]]);
  [0,1,2,0,2,3].forEach(i=>{pos.push(P[i][0],P[i][1],P[i][2]);uv.push(P[i][3],P[i][4]);nor.push(-sa,0,ca);});}
 return BIO.geo._make(pos,nor,uv);};
// a FAN: one vertical quad, base at the origin, up to y=1, local +z its face
G.fan=function(){const pos=[],uv=[],nor=[];const P=[[-.5,0],[.5,0],[.5,1],[-.5,1]].map(q=>[q[0],q[1],0,q[0]+.5,1-q[1]]);
 [0,1,2,0,2,3].forEach(i=>{pos.push(P[i][0],P[i][1],P[i][2]);uv.push(P[i][3],P[i][4]);nor.push(0,0,1);});return BIO.geo._make(pos,nor,uv);};
// a DROOPING FAN: the fan card bent in three bands so it arches out and hangs (the skirt palm's wide hanging leaves)
G.droop=function(){const pos=[],uv=[],nor=[];const R=[[0,0,0],[0,.22,.30],[0,.16,.62],[0,-.22,.84]];   // (x unused, y, z) of each row's spine: out, over, and down

 for(let i=0;i<rows.length-1;i++){const a=rows[i][0],b=rows[i][1],c=rows[i+1][1],d=rows[i+1][0];
  [a,b,c,a,c,d].forEach(p=>{pos.push(p[0],p[1],p[2]);uv.push(p[3],p[4]);nor.push(0,1,0);});}
 return BIO.geo._make(pos,nor,uv);};
// a ROSETTE: three tiers of fleshy bent leaves, vertex-coloured pale at the base (agave, bromeliad)
G.rosette=function(tiers){const pos=[],nor=[],uv=[],col=[];
 tiers=tiers||[[10,1.0,.30,.55],[8,.70,.55,.40],[6,.42,.85,.28]];
 tiers.forEach((tr,ti)=>{const n=tr[0],R=tr[1],el=tr[2],wd=tr[3];const a0=ti*.31;
  for(let k=0;k<n;k++){const a=a0+k/n*TAU,ca=Math.cos(a),sa=Math.sin(a),px=-sa,pz=ca;
   const tip=[ca*R,Math.sin(el)*R*.9+.05,sa*R],mid=[ca*R*.5,Math.sin(el)*R*.35+.04,sa*R*.5],base=[ca*.08,.02,sa*.08];
   const W=wd*R;
   const q=[[base[0]-px*W*.25,base[1],base[2]-pz*W*.25],[base[0]+px*W*.25,base[1],base[2]+pz*W*.25],[mid[0]+px*W*.5,mid[1],mid[2]+pz*W*.5],[mid[0]-px*W*.5,mid[1],mid[2]-pz*W*.5],tip];
   const nrm=[-Math.sin(el)*ca,Math.cos(el),-Math.sin(el)*sa];
   const push=(p,c)=>{pos.push(p[0],p[1],p[2]);nor.push(nrm[0],nrm[1],nrm[2]);uv.push(0,0);col.push(c,c,c);};
   push(q[0],.55);push(q[1],.55);push(q[2],.85);push(q[0],.55);push(q[2],.85);push(q[3],.85);
   push(q[3],.85);push(q[2],.85);push(q[4],1.0);}});

// a LILY PAD: a flat disc with a notch, unit radius, vertex-coloured (lighter centre)
G.pad=function(){const pos=[],nor=[],uv=[],col=[];const n=11;

  const r0=1+.06*Math.sin(k*3.1),r1=1+.06*Math.sin((k+1)*3.1);

// ================================================================= NORTHWESTERN LOWLANDS — trees
// Twenty tree species and three bamboos, placed by zone from the host's climate
// fields (wet / tropic / dry / flow / upland) and terrainH. The biome's rule is
// VERTICALITY: trees ~50% taller than their Earth kin, clean boles, few low limbs,
// crowns carried high on steeply ascending limbs, spires and spindles -- the eye goes
// up. (The glow-willow is the exception, and hangs its lanterns.) BAMBOO grows in
// GROVES: patches with a hard edge where the tree passes do not plant, culms taller
// in the interior than at the rim, clumping kinds fringing it -- a sub-biome, not a
// scatter. Beyond the LOD spine the trees become blob impostors and the groves blob
// canopies.

// ---------------------------------------------------------------- zones from the fields
const Y=(x,z)=>BIO.terrainH(x,z);
function zones(x,z){const wet=BIO.field('wet',x,z),tropic=BIO.field('tropic',x,z),dry=BIO.field('dry',x,z),flow=BIO.field('flow',x,z),up=BIO.field('upland',x,z),h=Y(x,z);
 const trop=smooth(.68,.86,tropic),rain=trop*smooth(.72,.86,wet),sub=(1-trop)*(1-dry)*smooth(.45,.65,wet);
 // bamboo groves: patches of their own in the wet country, likelier by water; a hard-ish edge
 const bk=fbm(x*.0026+5,z*.0026-9,5501,2)+flow*.08+(wet-.8)*.2,bamboo=smooth(.61,.65,bk)*(rain+sub)*(1-dry*.9);
 return{wet,tropic,dry,flow,up,h,rain,sub,bamboo,
  med:dry,
  shore:smooth(3.2,.9,h)*smooth(.82,.95,wet)*(1-dry),
  gully:dry*smooth(.34,.5,wet),
  rip:flow,
  // stands: birch and spire cedar grow in stands of their own
  birchK:smooth(.55,.63,fbm(x*.0021-7,z*.0021+3,5502,2)),spireK:smooth(.56,.64,fbm(x*.0019+11,z*.0019-5,5503,2))};}
NWLOW.zones=zones;

// ---------------------------------------------------------------- colour
function shade(hex,f){const c=hex.isColor?hex.clone():C(hex);if(f>=0)c.lerp(C(0xffffff),f);else c.lerp(C(0x120f0a),-f);return c;}
function bright(col,k){const c=col.isColor?col.clone():C(col);c.convertSRGBToLinear();c.r=Math.min(1,c.r*k);c.g=Math.min(1,c.g*k);c.b=Math.min(1,c.b*k);return c.convertLinearToSRGB();}
const _hsl={h:0,s:0,l:0};
function vary(hex,dh,ds,dl){const c=hex.isColor?hex.clone():C(hex);c.getHSL(_hsl);c.setHSL(((_hsl.h+rr(-dh,dh))%1+1)%1,clamp(_hsl.s+rr(-ds,ds),0,1),clamp(_hsl.l+rr(-dl,dl),.03,.97));return c;}
function texMean(tex){const im=tex&&tex.image;if(!im||!im.getContext)return[.25,.25,.25];
 const d=im.getContext('2d').getImageData(0,0,im.width,im.height).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<d.length;i+=4*13){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
 const c=C(0).setRGB(r/n/255,g/n/255,b/n/255).convertSRGBToLinear();return[c.r,c.g,c.b];}
// the sRGB tint that renders `hex` on a greyscale texture of linear mean m (the instanced small trunks, logs, rocks)
function tint(hex,m,k){const c=hex.isColor?hex.clone():C(hex);c.convertSRGBToLinear();k=k==null?1:k;
 c.setRGB(Math.min(1,c.r*k/Math.max(.02,m[0])),Math.min(1,c.g*k/Math.max(.02,m[1])),Math.min(1,c.b*k/Math.max(.02,m[2])));return c.convertLinearToSRGB();}
let MEAN=null;
function means(){if(MEAN)return MEAN;MEAN={fibre:texMean(NWLOW.FIBRETEX),smooth:texMean(NWLOW.SMOOTHTEX),wood:texMean(NWLOW.WOODTEX),rock:texMean(NWLOW.ROCKTEX)};return MEAN;}
Object.assign(NWLOW,{means,tint,bright,shade,vary});
// the two-tone bark buckets take the designer's colour as it should look (their material does the light arithmetic)
const barkC=(S,k)=>vary(C(S.bark[(k==null?ri(0,99):k)%S.bark.length]),.01,.05,.04);
// an untextured rod in a species' bark colour, a shade down for the rig
const rodCol=(hex)=>shade(vary(hex,.01,.05,.04),-.3);
const leafCol=(set,k)=>bright(vary(pick(set),.025,.10,.06),k==null?1.3:k);

// ---------------------------------------------------------------- keep-clear between trees
const HC=120,HASH={};
function hkey(x,z){return Math.floor(x/HC)+','+Math.floor(z/HC);}
function hadd(o){const R=o.r+40;for(let z=Math.floor((o.z-R)/HC);z<=Math.floor((o.z+R)/HC);z++)for(let x=Math.floor((o.x-R)/HC);x<=Math.floor((o.x+R)/HC);x++){const k=x+','+z;(HASH[k]||(HASH[k]=[])).push(o);}}
function blocked(x,z,pad){const L=HASH[hkey(x,z)];if(!L)return false;for(let i=0;i<L.length;i++){const o=L[i];if(Math.hypot(x-o.x,z-o.z)<o.r+pad)return true;}return false;}
// the floor asks only about the bole (rt); the trees ask about each other's ground (r)
function blockedTrunk(x,z,pad){const L=HASH[hkey(x,z)];if(!L)return false;for(let i=0;i<L.length;i++){const o=L[i];if(Math.hypot(x-o.x,z-o.z)<(o.rt||o.r)+pad)return true;}return false;}
NWLOW.blocked=blockedTrunk;NWLOW.blockedGround=blocked;
const clear3=(x,y,z,rad,vr)=>BIO.clearOf3(x,y,z,rad,vr);
const okPts=pts=>{for(let i=1;i<pts.length;i++)if(!clear3(pts[i].x,pts[i].y,pts[i].z,pts[i].r+1.5,pts[i].r+1.5))return false;return true;};

// ---------------------------------------------------------------- the LIMB
// A sinuous limb from o toward azimuth a at elevation el, len metres long,
// radius r0 -> r1 over n segments. sag bends it down with distance (a live
// oak's limbs run out level and droop); rise lifts the last part again; wig
// wanders it sideways. A limb that meets the ground RESTS on it -- the
// sprawl oak's limbs lie along the ground for metres and climb again.
function limbPts(o,a,el,len,r0,r1,n,sag,wig,rise){const ca=Math.cos(a),sa=Math.sin(a),ce=Math.cos(el),se=Math.sin(el),sx=-sa,sz=ca;
 const w1=rr(-1,1)*wig,w2=rr(-1,1)*wig,v1=rr(-1,1)*wig*.6,pts=[];let rested=0;
 for(let k=0;k<=n;k++){const t=k/n,hd=len*ce*t,lat=(w1*Math.sin(t*Math.PI)+w2*Math.sin(t*TAU))*len;
  let y=o.y+len*(se*t+sag*t*t)+(rise||0)*len*Math.pow(smooth(.5,1,t),2)+v1*len*Math.sin(t*TAU)*.5;
  const x=o.x+ca*hd+sx*lat,z=o.z+sa*hd+sz*lat,r=mix(r0,r1,Math.pow(t,.8));
  const gy=Y(x,z)+r*.75;if(k>0&&y<gy){y=gy;rested++;}
  pts.push({x,y,z,r});}
 pts.rested=rested;return pts;}
// a limb's direction at point i (for secondaries)
function limbDir(pts,i){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],dx=b.x-a.x,dz=b.z-a.z;return Math.atan2(dz,dx);}

// ---------------------------------------------------------------- foliage and epiphytes
function clumpAt(item,x,y,z,size,flat,col,cx,cy,cz,ex,ey){
 const dx=(x-cx)/ex,dy=(y-cy)/ey,dz=(z-cz)/ex,qq=Math.hypot(dx,dy,dz);
 const ao=mix(.5,1,smooth(.3,.95,qq))*mix(.8,1,smooth(-.6,.35,dy))*rr(.88,1.1);
 const nx=dx*.9+rr(-.3,.3),ny=dy*.7+.75+rr(-.15,.2),nz=dz*.9+rr(-.3,.3),nn=Math.hypot(nx,ny,nz)||1;
 BIO.put(item,[x,y,z],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),[size,size*flat,size],bright(col,ao*1.3),{n:[nx/nn,ny/nn,nz/nn]});}
function frondAt(item,x,y,z,a,L,pitch,col,wid){BIO.put(item,[x,y,z],qEuler(rr(-.1,.1),-a,pitch),[L,L*rr(.85,1.05),L*(wid||rr(1.1,1.4))],col);}
// the foliage colour of a clump: the species' set, with the odd flush of bronze new growth
function crownCol(S,flush){return C(rng()<(flush||0)?pick(PAL.flush):pick(S.leaf));}
// Spanish moss off a limb point: how much depends on the species and how wet the ground is
function mossAt(p,k,wet,st,Lmax){const n=Math.round(rr(0,2.2)*k*smooth(.45,.9,wet));
 for(let i=0;i<n;i++){const L=rr(1.5,Lmax||7);BIO.put('beard',[p.x+rr(-.7,.7),p.y-(p.r||.3)*.6,p.z+rr(-.7,.7)],qEuler(0,rr(0,TAU),0),[rr(1,2.2),L,1],bright(vary(pick(PAL.mossPale),.02,.08,.06),1.02));st.moss++;}}
// a staghorn fern on a bole: a shield and antlers, facing out
function staghorn(x,y,z,a,R,s,st){const nx=Math.cos(a),nz=Math.sin(a);
 BIO.put('staghorn',[x+nx*(R+.05),y-s*.3,z+nz*(R+.05)],qFacing([nx,rr(-.1,.25),nz]),[s,s,1],leafCol(PAL.aroid,1.35));
 BIO.put('staghorn',[x+nx*(R+.1),y-s*.2,z+nz*(R+.1)],qFacing([nx,-.6,nz]),[s*.9,s*1.2,1],leafCol(PAL.aroid,1.3));st.epi++;}
// a bromeliad perched on a bough
// grey-green tank bromeliads and air plants only: a red rosette on a bough reads as a flower
// growing out of the bark, which is not how these trees flower
function brom(p,st){const R=rr(.35,.8),c=rng()<.5?vary(pick(PAL.mossPale),.02,.06,.05):vary(pick(PAL.aroid),.03,.1,.06);
 BIO.put('brom',[p.x,p.y+p.r*.8,p.z],qEuler(rr(-.2,.2),rr(0,TAU),rr(-.2,.2)),[R,R*1.1,R],bright(c,1.1));st.epi++;}
// ---------------------------------------------------------------- the crown, ON its branches
// A clump's centre sits within a third of its own size of a real branch point,
// a little above it: no foliage hangs in the air. twigs() sprouts short
// three-sided tips off a branch point where a crown needs more to carry.
function twigs(fam,S,p,a0,n,len,elLo,elHi,st,out){for(let k=0;k<n;k++){const a=a0+rr(-1.4,1.4),el=rr(elLo,elHi),L=len*rr(.7,1.2),r=Math.max(.05,(p.r||.2)*.5);
  const tip={x:p.x+Math.cos(a)*Math.cos(el)*L,y:p.y+Math.sin(el)*L,z:p.z+Math.sin(a)*Math.cos(el)*L,r:.04};
  if(!clear3(tip.x,tip.y,tip.z,1,1))continue;st.limb+=BIO.tube(fam,[{x:p.x,y:p.y,z:p.z,r},tip],barkC(S),{seg:3});out.push(tip);}}
function crownOn(item,spots,sz0,flat,colFn,T,cy,ex,ey,dens,st){let n=0;
 for(const p of spots){const m=Math.floor(dens)+(rng()<dens%1?1:0);
  for(let c=0;c<m;c++){const sz=sz0*rr(.85,1.2),a=rr(0,TAU),d=sz*.3*Math.sqrt(rng()),x=p.x+Math.cos(a)*d,z=p.z+Math.sin(a)*d,y=p.y+sz*flat*rr(.1,.35);
   if(!clear3(x,y,z,sz*.5,sz*flat*.5))continue;clumpAt(item,x,y,z,sz,flat,colFn(),T.x,cy,T.z,ex,ey);st.clumps++;n++;}}
 return n;}
// a LEADER: an upright limb from the bole to the crown's top, so the top of a crown is carried
function leader(fam,S,T,from,top,r0,st,all){const el=Math.PI/2-rr(.1,.32),len=(top-from.y)/Math.sin(el);if(len<1.5)return null;
 const pts=limbPts({x:from.x,y:from.y,z:from.z},rr(0,TAU),el,len,r0,.1,4,-.02,.05,0);if(!okPts(pts))return null;
 st.limb+=BIO.tube(fam,pts,barkC(S),{seg:5,cap:true});if(all)all.push(...pts);return pts;}
// an ARCH: a vault limb, parametrised by what it does -- out to `reach`, up to `peak` metres
// over its origin at fraction pT of the way, and down to `end` metres over the origin at the tip
function archPts(o,a,reach,peak,pT,end,r0,r1,n,wig){const ca=Math.cos(a),sa=Math.sin(a),sx=-sa,sz=ca,w1=rr(-1,1)*wig,w2=rr(-1,1)*wig,pts=[];
 for(let k=0;k<=n;k++){const t=k/n,lat=(w1*Math.sin(t*Math.PI)+w2*Math.sin(t*TAU))*reach;
  const f=t<=pT?1-Math.pow(1-t/pT,2):1-(1-end/peak)*Math.pow((t-pT)/(1-pT),2);
  const x=o.x+ca*reach*t+sx*lat,z=o.z+sa*reach*t+sz*lat,r=mix(r0,r1,Math.pow(t,.8));let y=o.y+peak*f+Math.sin(t*9+w1*7)*reach*.012;
  const gy=Y(x,z)+r*.75;if(k>0&&y<gy)y=gy;pts.push({x,y,z,r});}
 return pts;}
function spread(T,pts){let s=T.crownR*.5;for(const p of pts){const d=Math.hypot(p.x-T.x,p.z-T.z);if(d>s)s=d;}return s;}
function reg(T,S){if(typeof REGISTER==='function')REGISTER({name:S.name,kind:'tree',label:S.name,x:T.x,z:T.z,y:T.y0,r:Math.max(T.spread||0,T.crownR*.6),h:T.H});}
// the bole: a lathe with a flared, lobed foot; closed at the top with a dome ring (never an open pipe)
function bole(fam,T,S,top,rb,flare,fh,lobes,seg,vs,lean){const nl=lobes||0,L=[],ti=T.seed%3;for(let k=0;k<nl;k++)L.push({a:k/nl*TAU+rr(-.3,.3),amp:rr(.5,1.1)});
 const lobeSum=ang=>{let s=0;for(const q of L){const c=Math.cos(ang-q.a);if(c>0)s+=q.amp*Math.pow(c,5);}return s;};
 const la=rr(0,TAU),lx=Math.cos(la)*(lean||0),lz=Math.sin(la)*(lean||0);
 const rAt=u=>rb*(1-.35*u)*(1+flare*Math.exp(-u*top/fh)),rings=[],step=Math.max(.8,Math.min(vs*.5,top/7));
 for(let yy=0;yy<top;yy+=(yy<fh*1.5?Math.min(step,fh*.5):step))rings.push({x:T.x+lx*yy,y:T.y0+yy,z:T.z+lz*yy,r:rAt(yy/top),yy:yy,col:barkC(S,Math.floor(yy/9)+ti)});
 const r1=rAt(1);rings.push({x:T.x+lx*top,y:T.y0+top,z:T.z+lz*top,r:r1,yy:top,col:barkC(S,1)},{x:T.x+lx*top,y:T.y0+top+r1*.8,z:T.z+lz*top,r:.05,yy:top+1,col:barkC(S,1)});
 const tris=BIO.lathe(fam,rings,seg,Math.max(1,Math.round(TAU*rb/3)),vs,(R,ang)=>R.r*(1+(nl?flare*.9*Math.exp(-R.yy/fh)*lobeSum(ang):0)+.03*Math.sin(5*ang+R.yy*.2)),
  nl?(R,ang)=>mix(1,.6+.4*clamp(lobeSum(ang),0,1),Math.exp(-R.yy/fh)):null);
 return{tris,top:{x:T.x+lx*top,y:T.y0+top,z:T.z+lz*top},rAt,lx,lz};}


// ---------------------------------------------------------------- the builders
// Each: (T, st, lv) where T={x,z,y0,sp,H,rb,crownR,seed,wet} and lv 2 near / 1 mid
const B={};
// COLUMN: a clean bole to a high crotch, a few STEEP limbs and a leader, the crown up
// there on their secondaries. Birch comes in several stems from one foot; the gums and
// the tower ash hang ribbons of shed bark; the she-oak drapes; the wattle flowers gold.
B.column=function(T,st,lv){const S=SP[T.sp],fam=S.bk,rb0=T.rb,nS=S.stems?(lv===2?ri(S.stems[0],Math.min(4,S.stems[1])):1):1,all=[],spots=[];
 for(let si=0;si<nS;si++){const off=si?rr(.4,1.3):0,sa=rr(0,TAU),H=T.H*(si?rr(.72,.95):1),rb=rb0*(si?rr(.7,.95):1);
  const Ts=Object.assign({},T,{x:T.x+Math.cos(sa)*off,z:T.z+Math.sin(sa)*off});
  const hc=H*rr(S.crotch[0],S.crotch[1]),bt=S.buttress||0;
  const bo=bole(fam,Ts,S,hc,rb,bt?bt:.3,bt?4:1.2,bt?ri(4,6):0,lv===2?(rb>1?12:8):6,4,S.stems?rr(.01,.05):rr(0,.025));st.trunk+=bo.tris;
  const nL=lv===2?ri(S.limbs[0],S.limbs[1]):Math.max(2,S.limbs[0]-1),a0=rr(0,TAU);
  for(let k=0;k<nL;k++){const a=a0+k*GOLD+rr(-.3,.3),u=rr(.82,1),o={x:bo.top.x-bo.lx*(1-u)*hc+Math.cos(a)*rb*.3,y:T.y0+hc*u,z:bo.top.z-bo.lz*(1-u)*hc+Math.sin(a)*rb*.3};
   const el=rr(.95,1.3),len=(T.y0+H-o.y)*rr(.75,1.02)/Math.sin(el),pts=limbPts(o,a,el,len,rb*rr(.35,.5),.08,5,-.06,.07,0);if(!okPts(pts))continue;
   st.limb+=BIO.tube(fam,pts,barkC(S),{seg:lv===2?6:4,cap:true});all.push(...pts);st.limbs++;
   for(let i=2;i<pts.length;i+=(lv===2&&nS===1)?1:2){const p=pts[i],len2=T.crownR*rr(.3,.5),sp=limbPts(p,a+rr(-1.2,1.2),rr(.25,.8),len2,Math.max(.06,p.r*.5),.04,3,-.12,.1,0);
    if(!okPts(sp))continue;st.limb+=BIO.tube(fam,sp,barkC(S),{seg:3});spots.push(sp[2],sp[3]);if(lv===2)twigs(fam,S,sp[3],a,1,len2*.4,.1,.8,st,spots);}}
  const L=leader(fam,S,Ts,bo.top,T.y0+H,rb*.4,st,all);if(L){spots.push(L[3],L[4]);twigs(fam,S,L[4],rr(0,TAU),3,T.crownR*.3,0,.6,st,spots);}
  if(S.ribbons&&lv===2)for(let j=0,m=ri(3,7);j<m;j++){const u=rr(.1,.9),a=rr(0,TAU),R=bo.rAt(u);BIO.put('strand',[Ts.x+bo.lx*hc*u+Math.cos(a)*(R+.05),T.y0+hc*u,Ts.z+bo.lz*hc*u+Math.sin(a)*(R+.05)],qFacing([Math.cos(a),0,Math.sin(a)]),[rr(.25,.6),rr(2,7),1],C(0xd8d2bc));}   // ribbons of shed bark
  if(bt&&lv===2&&rng()<.7)staghorn(Ts.x,T.y0+hc*rr(.2,.5),Ts.z,rr(0,TAU),bo.rAt(.3),rr(1.2,2),st);}
 const cy=T.y0+T.H*.85,ex=T.crownR,ey=T.H*.15,sz0=T.sp===0||T.sp===12?rr(8,11):S.item==='lance'?rr(5,7):rr(4,6);
 if(S.item==='drape'){crownOn('needle',spots.filter(()=>rng()<.4),sz0*.7,.6,()=>C(pick(S.leaf)),T,cy,ex,ey,1,st);
  spots.forEach(p=>{for(let j=0,m=lv===2?ri(1,2):1;j<m;j++)BIO.put('drape',[p.x+rr(-.8,.8),p.y+rr(0,.8),p.z+rr(-.8,.8)],qEuler(0,rr(0,TAU),0),[rr(.8,1.5),rr(2,4.5),1],leafCol(S.leaf,1.25));});}
 else{const fl=S.flower?spots.filter(()=>rng()<.3):[],lf=S.flower?spots.filter(p=>fl.indexOf(p)<0):spots;
  crownOn(S.item,lf,sz0,S.item==='lance'?.8:.62,()=>C(pick(S.leaf)),T,cy,ex,ey,lv===2?1.4:.9,st);
  if(fl.length)crownOn('blossom',fl,sz0*.8,.6,()=>vary(C(pick(S.flower)),.01,.05,.04),T,cy,ex,ey,lv===2?1.4:.9,st);}
 T.spread=spread(T,all);reg(T,S);};
// FASTIGIATE: a leader to the top and many short limbs hugging it all the way up --
// a green spindle (column ginkgo, spindle poplar)
B.fastigiate=function(T,st,lv){const S=SP[T.sp],fam=S.bk,H=T.H,rb=T.rb;
 const bo=bole(fam,T,S,H*.22,rb,.3,1.2,0,lv===2?9:6,4,rr(0,.02));st.trunk+=bo.tris;const all=[],spots=[];
 const L=leader(fam,S,T,bo.top,T.y0+H,rb*.6,st,all);if(L)spots.push(L[2],L[3],L[4]);
 const nL=lv===2?ri(10,15):6;
 for(let k=0;k<nL;k++){const u=mix(.2,.86,(k+rr(0,1))/nL),y=T.y0+H*u,a=k*GOLD+rr(-.3,.3),env=Math.sin(Math.PI*mix(.1,1,u)),len=T.crownR*mix(.7,1.2,env)*rr(.9,1.1);
  const pts=limbPts({x:T.x+Math.cos(a)*rb*.3,y,z:T.z+Math.sin(a)*rb*.3},a,rr(1.15,1.38),len/Math.cos(1.2)*.35,rb*.28,.05,3,-.02,.05,0);if(!okPts(pts))continue;
  st.limb+=BIO.tube(fam,pts,barkC(S),{seg:lv===2?4:3,cap:true});all.push(...pts);spots.push(pts[1],pts[2],pts[3]);}
 crownOn(S.item,spots,rr(3.5,4.8),1.05,()=>C(pick(S.leaf)),T,T.y0+H*.55,T.crownR,H*.45,lv===2?1.3:.8,st);
 T.spread=spread(T,all);reg(T,S);};
// SPIRE: a straight tapering column to the very top and whorls of short limbs (spire
// cedar: conical from a third of the way up; needle cypress: a narrow flame; crag pine:
// a bare pole to 70% and a few flat layered pads at the top)
B.spire=function(T,st,lv){const S=SP[T.sp],fam=S.bk,H=T.H,rb=T.rb;
 const bo=bole(fam,T,S,H*.97,rb,S.flatTop?.25:.45,1.5,0,lv===2?9:6,4,rr(0,.02));st.trunk+=bo.tris;const all=[];
 const at=y=>({x:T.x+bo.lx*(y-T.y0),z:T.z+bo.lz*(y-T.y0)});
 if(S.flatTop){const spots=[],n=lv===2?ri(5,7):4,a0=rr(0,TAU);
  for(let k=0;k<n;k++){const y=T.y0+H*mix(.72,.95,k/n),c=at(y),a=a0+k*GOLD,pts=limbPts({x:c.x,y,z:c.z},a,rr(.05,.35),T.crownR*rr(.6,1),rb*.3,.06,4,-.05,.1,.12);

// Everything under the trees, by zone (NWLOW.zones). The shrub layer here is SEA PENS:
// upright feathers, clubs and whips in white, pale pink and lilac, the region's most
// alien note, and vertical like everything else in it.
//   the SHORE       reeds, sedge, iris, sea pens at the water; lotus and lilies on it
//   the RAINFOREST  teal aroids, torch ginger, ferns and forking ferns, tall feather pens, moss
//   the GROVES      bamboo leaf litter, shoots, a little moss and fern: a bare floor, so a
//                   grove reads as a grove

 BIO.tube('wood',pts,pts[0].col,{seg:8,cap:true});st.logs++;
 for(let s=2;s<L-2;s+=rr(3,6)){const t=s/L,i=Math.min(n-2,Math.floor(t*(n-1))),f=t*(n-1)-i,A=pts[i],Bq=pts[i+1],px=mix(A.x,Bq.x,f),pz=mix(A.z,Bq.z,f),py=mix(A.y,Bq.y,f),r=mix(A.r,Bq.r,f);

// ---------------------------------------------------------------- the zone planters
function plantRain(x,y,z,Z,lv,st){const t=rng();
 if(t<.18)aroid(x,y,z,lv,st);
 else if(t<.32){if(lv>=1&&okGround(x,z,2.5))giantFern(x,y,z,lv);else fern(x,y,z,lv);st.ferns++;}
 else if(t<.42){fern(x,y,z,lv,'forkfern');st.ferns++;}
 else if(t<.52)ginger(x,y,z,lv,st);
 else if(t<.66)seaPen(x,y,z,lv,st,1.6);
 else if(t<.78){shrub(x,y,z,lv,PAL.aroid);st.shrubs++;}
 else if(t<.9){if(lv>=1){groundMoss(x,y,z,rr(1.2,2.6));st.moss++;}else{fern(x,y,z,lv);st.ferns++;}}
 else blooms(x,y,z,rr(.8,1.6),ri(3,7),PAL.ginger);}
function plantShore(x,y,z,Z,lv,st){const t=rng();
 if(t<.4){reed(x,y,z,lv);st.tufts++;}
 else if(t<.6){grassTuft(x,y,z,lv,PAL.reed,.9);st.tufts++;}
 else if(t<.75){tuft('spike',x,y,z,rr(.7,1.1),.6,leafCol(PAL.reed,1.3));if(lv>=1)blooms(x,y+.8,z,.3,ri(2,4),PAL.bluebell,[.14,.22],.2);st.iris++;}
 else if(t<.9)seaPen(x,y,z,lv,st,1.1);
 else aroid(x,y,z,lv,st);}
function plantSub(x,y,z,Z,lv,st){const t=rng(),bk=bellK(x,z);
 if(t<.3*bk){bluebells(x,y,z,lv,st);if(lv===2&&rng()<.5)bluebells(x+rr(-2,2),y,z+rr(-2,2),lv,st);return;}
 if(t<.22){grassTuft(x,y,z,lv,PAL.grassGreen,1);st.tufts++;}
 else if(t<.38){fern(x,y,z,lv,rng()<.3?'forkfern':'frond');st.ferns++;}
 else if(t<.6)seaPen(x,y,z,lv,st,1.3);
 else if(t<.68)rhodo(x,y,z,lv,st);
 else if(t<.72)lilies(x,y,z,lv,st);
 else if(t<.8){shrub(x,y,z,lv,PAL.shrub);st.shrubs++;}
 else if(t<.88){if(lv>=1&&dampK(x,z)>.5){groundMoss(x,y,z,rr(1,2.2));st.moss++;}else{grassTuft(x,y,z,lv,PAL.grassGreen);st.tufts++;}}
 else if(t<.95)bluebells(x,y,z,lv,st);
 else boulder(x,y,z,lv,PAL.rock,st);}
function plantMed(x,y,z,Z,lv,st){const t=rng();
 if(t<.36){grassTuft(x,y,z,lv,PAL.grassDry,1.1);st.tufts++;if(lv===2&&rng()<.5)grassTuft(x+rr(-1.5,1.5),y,z+rr(-1.5,1.5),lv,PAL.grassDry,.9);}
 else if(t<.5)seaPen(x,y,z,lv,st,.9);
 else if(t<.6)kpaw(x,y,z,lv,st);
 else if(t<.72)saltbush(x,y,z,lv,st);
 else if(t<.8){fern(x,y,z,lv);st.ferns++;}
 else if(t<.88){BIO.put('rosette',[x,y-.02,z],qEuler(rr(-.05,.05),rr(0,TAU),rr(-.05,.05)),[rr(.5,1),rr(.4,.8),rr(.5,1)],bright(vary(pick(PAL.saltbush),.02,.08,.05),1.05));st.shrubs++;}
 else if(t<.93)blooms(x,y,z,rr(.8,1.8),ri(3,8),PAL.wattleGold,[.1,.18]);
 else boulder(x,y,z,lv,rng()<.4?PAL.rockRed:PAL.rock,st);}
function plantRip(x,y,z,Z,lv,st){const t=rng();
 if(t<.4){reed(x,y,z,lv);st.tufts++;}else if(t<.6){fern(x,y,z,lv);st.ferns++;}else if(t<.8)seaPen(x,y,z,lv,st,1.2);else{shrub(x,y,z,lv,PAL.shrub,.8);st.shrubs++;}}

// ---------------------------------------------------------------- the understorey (under the crowns)
function sapling(x,y,z,lv,set,st,col){const h=rr(2.5,6),r=h*.01+.03;

 for(let i=0,m=lv===2?ri(2,3):1;i<m;i++){const s=rr(1,1.8);BIO.put('ucard',[x+rr(-.3,.3),y+h*rr(.7,1),z+rr(-.3,.3)],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),[s,s*1.2,s],bright(vary(pick(set),.04,.1,.06),1.4));}

function underPlant(x,y,z,Z,lv,st){const t=rng();
 if(Z.rain>.4){if(t<.2)aroid(x,y,z,lv,st);else if(t<.4){if(okGround(x,z,2))giantFern(x,y,z,lv);else fern(x,y,z,lv);st.ferns++;}else if(t<.6)seaPen(x,y,z,lv,st,1.8);
  else if(t<.72)ginger(x,y,z,lv,st);else if(t<.86)sapling(x,y,z,lv,PAL.glossy,st);else{fern(x,y,z,lv,'forkfern');st.ferns++;}return;}
 if(Z.med>.5){if(t<.3)seaPen(x,y,z,lv,st,1.1);else if(t<.5)saltbush(x,y,z,lv,st);else if(t<.66)kpaw(x,y,z,lv,st);else if(t<.82)sapling(x,y,z,lv,PAL.gum,st,rodCol(0xd8d8d0));else{grassTuft(x,y,z,lv,PAL.grassDry,1);st.tufts++;}return;}
 if(t<.28)seaPen(x,y,z,lv,st,1.5);else if(t<.46){fern(x,y,z,lv,rng()<.3?'forkfern':'frond');st.ferns++;}else if(t<.58)rhodo(x,y,z,lv,st);
 else if(t<.72)sapling(x,y,z,lv,PAL.birch,st,rodCol(0xe8e8e0));else if(t<.86)bluebells(x,y,z,lv,st);else{groundMoss(x,y,z,rr(1.2,2.4));st.moss++;}}

// ---------------------------------------------------------------- the pass
NWLOW.buildFloor=function(R,q){
 reseed(610021);q=q==null?1:q;R=R||2850;means();

 function plant(x,y,z,lv){if(!okGround(x,z,.7))return;const Z=zones(x,z);
  if(Z.bamboo>.08){if(rng()<smooth(.08,.4,Z.bamboo)){groveFloor(x,y,z,lv,st);return;}}
  const w=[Z.rain*1.3,Z.shore*.9,Z.sub*1.0,Z.med*1.1,Z.rip*.5];let tot=0;for(const v of w)tot+=v;if(tot<=0)return;
  let r=rng()*Math.max(1,tot),k=0;for(;k<w.length;k++){if(r<w[k])break;r-=w[k];}if(k>=w.length)return;
  planters[k](x,y,z,Z,lv,st);}
 [[10,560,0],[19,1400,560],[40,1e9,1400]].forEach((b,bi)=>{const lv=2-bi;
  BIO.grid(b[0],0,R,(x,z,d)=>{const ld=BIO.lodD(x,z);if(ld>=b[1]||ld<b[2])return 0;return .5*q*(lv===0?.45:1);},(x,y,z,d)=>plant(x,y,z,lv),{patch:.72,patchScale:.014,pad:.5});});
 // a cheap second pass of grass: the ground cover of the plain and the hills
 [[5,480,0],[10,1200,480]].forEach((b,bi)=>{const lv=2-bi;
  BIO.grid(b[0],0,R,(x,z,d)=>{const ld=BIO.lodD(x,z);if(ld>=b[1]||ld<b[2])return 0;return q*.7;},(x,y,z,d)=>{if(blocked(x,z,.4))return;const Z=zones(x,z);
    const w=(Z.med*.9+Z.sub*.4)*(1-Z.bamboo)*.75;if(rng()>w)return;grassTuft(x,y,z,1,Z.med>.5?PAL.grassDry:PAL.grassGreen,Z.med>.5?1.1:.8);st.tufts++;},{patch:.6,patchScale:.02,pad:.3});});
 // the water: lotus and lilies on still fresh water, reeds in the shallows
 [[7,560,0],[14,1400,560]].forEach((b,bi)=>{const lv=2-bi;
  BIO.grid(b[0],0,R,(x,z,d)=>{const ld=BIO.lodD(x,z);if(ld>=b[1]||ld<b[2])return 0;const h=Y(x,z);if(h>.3||h<-3.5)return 0;
    const Z=zones(x,z);return q*(1-Z.flow*.85)*(.7*smooth(-3.5,-1,h)+.3*smooth(-.9,-.1,h));},
   (x,y,z,d)=>{if(!BIO.clearOf(x,z,1)||blocked(x,z,.5))return;if(y>-.5&&rng()<.35){reed(x,Math.max(y,-.4),z,lv);st.tufts++;}else lotus(x,z,lv,st);},{patch:.8,patchScale:.02,noMask:true,pad:.4});});
 // fallen trees
 BIO.grid(130,0,R,(x,z,d)=>{if(BIO.lodD(x,z)>1400)return 0;const Z=zones(x,z);return (Z.rain*.8+Z.sub*.35)*(1-Z.bamboo)*q;},(x,y,z,d)=>{for(let t=0;t<4;t++)if(log(x+rr(-25,25),y,z+rr(-25,25),st))break;},{patch:0,pad:3});
 // THE UNDERSTOREY under the near and mid crowns, scaled by the ground each crown covers
 for(const T of NWLOW.TREES){if(T.lv<1||T.crownR<3.5)continue;const Rc=Math.max(T.spread||T.crownR,T.crownR)*.9,area=Math.PI*Rc*Rc,n=Math.round(Math.min(T.lv===2?30:6,area*(T.lv===2?.02:.004))*q);

   if(BIO.mask(x,z)<=0||!okGround(x,z,.7))continue;const y=Y(x,z);if(y<.3)continue;const Z=zones(x,z);if(Z.bamboo>.2)continue;underPlant(x,y,z,Z,T.lv,st);st.understorey++;}}
 return{under:st};};
})();
// ================================================================= NORTHWESTERN LOWLANDS — growth on structures
// What the lowlands do to a building left in them: moss on the ledges, hanging moss off
// the edges and soffits, fig-like roots down the walls, and on the ledges this region's
// own things -- sea pens standing up in the joints, young birches, ferns. The host hands
// over its shells as BufferGeometry[] in world space; this pass samples their faces and
// grows on them. It never touches the geometry -- a plant is never part of a building.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;
const PAL=NWLOW.PAL;
const C=hex=>new BIO.host.THREE.Color(hex);
const vcol=()=>C(pick(PAL.vine)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.05,.05));
const mcol=()=>C(pick(PAL.moss)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.06,.04));
const bloomCol=()=>C(pick(rng()<.5?PAL.rhodo:PAL.lantern));
const beardCol=()=>C(pick(PAL.mossPale)).multiplyScalar(rr(1.1,1.35));

// a MOSS PATCH lying on a surface with normal n (up for a ledge, down for a soffit)
function moss(p,n,r){const q=qUp(n);const s=r*rr(.7,1.3);
 BIO.put('mossmat',[p[0]+n[0]*.06,p[1]+n[1]*.06,p[2]+n[2]*.06],q,[s,1,s],mcol());}
// a HANGING CURTAIN off a point: 2-4 ribbons side by side across w, facing (dx,dz),
// a trailing strand, and the odd flower
function curtain(p,dx,dz,len,w,opt){opt=opt||{};const m=Math.hypot(dx,dz);
 if(m<1e-6){const a=rng()*TAU;dx=Math.cos(a);dz=Math.sin(a);}else{dx/=m;dz/=m;}
 const q=qFacing([dx,0,dz]),tx=-dz,tz=dx,nrb=2+Math.floor(rng()*3),c=opt.col||vcol();
 for(let i=0;i<nrb;i++){const o=(i-(nrb-1)/2)*w/nrb+rr(-.1,.1)*w,L=len*rr(.5,1);
  BIO.put('ribbon',[p[0]+tx*o+dx*rr(.05,.35),p[1]+rr(-.15,.05),p[2]+tz*o+dz*rr(.05,.35)],q,[w/nrb*rr(1,1.8),L,1],c.clone().multiplyScalar(rr(.82,1.12)));}
 if(rng()<.75){const o=rr(-w/2,w/2);BIO.put('strand',[p[0]+tx*o+dx*.4,p[1]-rr(0,.2),p[2]+tz*o+dz*.4],q,[rr(.14,.34),len*rr(.9,1.5),1],c.clone().multiplyScalar(.85));}
 if(opt.flowers&&rng()<.55){const fc=bloomCol();for(let b=0,nb=2+Math.floor(rng()*5);b<nb;b++){const s=rr(.3,.62);
  BIO.put('bloom',[p[0]+tx*rr(-.5,.5)*w+dx*.45,p[1]-rr(.2,len*.75),p[2]+tz*rr(-.5,.5)*w+dz*.45],qEuler(0,rng()*TAU,0),[s,s,s],fc);}}}
// AERIAL ROOTS off a ceiling: thin, long, hanging straight down
function roots(p,len,w){const q=qEuler(0,rng()*TAU,0),c=vcol();
 for(let i=0,n=1+Math.floor(rng()*3);i<n;i++)BIO.put('strand',[p[0]+rr(-w,w),p[1],p[2]+rr(-w,w)],q,[rr(.1,.3),len*rr(.6,1.2),1],c.clone().multiplyScalar(rr(.8,1.1)));}
// BRACKET FUNGUS on the side of something
function bracket(p,n,s){for(let b=0,nb=2+Math.floor(rng()*3);b<nb;b++){const sb=s*rr(.4,1);
 BIO.put('fungus',[p[0]+n[0]*.2+rr(-.6,.6)*s*(1-Math.abs(n[0])),p[1]+rr(0,2.2)*s,p[2]+n[2]*.2+rr(-.6,.6)*s*(1-Math.abs(n[2]))],
  qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[sb,sb*.4,sb],C(pick(PAL.fungus)));}}
// a PLANT on a ledge: fern rosette, tuft or small bush
function plant(p,s){const k=rng();const y=p[1];
 if(k<.16){const c=C(pick(PAL.pen)),h=s*rr(.8,1.6);BIO.put('pen',[p[0],y,p[2]],qEuler(rr(-.08,.08),rng()*TAU,rr(-.08,.08)),[h*.42,h,h*.42],c);}   // a sea pen in the joint
 else if(k<.45){const n=5+Math.floor(rng()*3),c=C(pick(PAL.fern));for(let i=0;i<n;i++){const a=i/n*TAU+rr(-.25,.25),L=s*rr(.85,1.4);
  BIO.put('frond',[p[0],y+s*.12,p[2]],qEuler(rr(.05,.30),-a,0),[L,L*rr(.7,1),L*rr(.7,1)],c.clone().multiplyScalar(rr(.82,1.2)));}}
 else if(k<.8){const c=C(pick(PAL.fern)).offsetHSL(rr(-.08,.08),0,rr(-.05,.08));
  BIO.put('ucard',[p[0],y+s*.35,p[2]],qEuler(rr(-.2,.2),rng()*TAU,rr(-.2,.2)),[s*1.2,s*.9,s*1.2],c);}
 else{const c=C(pick(PAL.fern)).offsetHSL(rr(-.1,.1),.05,.02);
  BIO.put('lobe',[p[0],y,p[2]],qEuler(0,rng()*TAU,0),[s,s*.7,s],c.clone().multiplyScalar(.82));
  for(let i=0;i<2;i++)BIO.put('ucard',[p[0]+rr(-.4,.4)*s,y+s*.5,p[2]+rr(-.4,.4)*s],qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[s*1.3,s,s*1.3],c.clone().multiplyScalar(rr(.9,1.2)));}}
// a SMALL TREE on a ledge: a tree fern, 4-12 m
function smallTree(p,h){const S=NWLOW.SPECIES[6],rb=h*.035+.2,rc=C(pick(S.bark)).multiplyScalar(.7);
 BIO.put('trunk2',[p[0],p[1],p[2]],qEuler(rr(-.08,.08),0,rr(-.08,.08)),[rb/.4,h,rb/.4],rc);
 for(let i=0,n=2+Math.floor(rng()*4);i<n;i++){const a=rng()*TAU,d=rr(.5,2.5);BIO.beam('rod',[p[0]+Math.cos(a)*d*.3,p[1]+h*rr(.4,.9),p[2]+Math.sin(a)*d*.3],[p[0]+Math.cos(a)*d,p[1]-.1,p[2]+Math.sin(a)*d],rr(.04,.1),null,rc);}
 const n=4+Math.floor(rng()*4),R=h*.35;
 for(let i=0;i<n;i++){const a=rng()*TAU,d=R*Math.sqrt(rng()),s=R*rr(.8,1.2);BIO.put('glossy',[p[0]+Math.cos(a)*d,p[1]+h*rr(.75,1.05),p[2]+Math.sin(a)*d],qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[s,s*.6,s],C(pick(S.leaf)).multiplyScalar(rr(1.1,1.4)),{n:[0,1,0]});}}
// LEDGES: moss on the flat, plants toward the outer edge, lips and curtains off the edge
NWLOW.dressLedges=function(geos,opt){opt=opt||{};
 const nM=opt.moss||400,nP=opt.plants||300,nE=opt.edges||140;
 BIO.upFaces(geos,nM,.6).forEach(f=>moss(f.p,f.n,rr(1.2,opt.mossR||3.5)));
 BIO.upFaces(geos,nP,.6).forEach(f=>{if(rng()<.12)smallTree(f.p,rr(4,opt.treeH||12));else plant(f.p,rr(1,opt.size||3));});
 BIO.ledgePoints(geos,nE,2.5).forEach(l=>{const p=[l.p[0]+l.n[0]*.3,l.p[1]-.1,l.p[2]+l.n[2]*.3];
  moss([l.p[0],l.p[1],l.p[2]],[0,1,0],rr(1,2.2));
  if(rng()<.7)curtain(p,l.n[0],l.n[2],rr(4,opt.hang||16),rr(2,5),{flowers:rng()<.4});
  if(rng()<.6)for(let b=0,nb=1+Math.floor(rng()*3);b<nb;b++)BIO.put('beard',[p[0]+rr(-1,1),p[1],p[2]+rr(-1,1)],qEuler(0,rng()*TAU,0),[rr(1,2.2),rr(2,6),1],beardCol());});};
// SOFFITS: moss rolled over to face the ground, roots and beards hanging out of
// it, brackets, curtains where the rim is. Density rises toward the rim: the
// middle of a big underside is in permanent dark and grows almost nothing.
NWLOW.dressSoffits=function(geos,opt){opt=opt||{};
 const S=BIO.downFaces(geos,opt.n||400,.6);if(!S.length)return;
 let cx=0,cz=0;S.forEach(f=>{cx+=f.p[0];cz+=f.p[2];});cx/=S.length;cz/=S.length;
 let rMax=1e-6;S.forEach(f=>{f.r=Math.hypot(f.p[0]-cx,f.p[2]-cz);if(f.r>rMax)rMax=f.r;});
 S.forEach(f=>{const u=f.r/rMax,lit=.15+.85*Math.pow(u,1.4);const R=(opt.mossR||5)*(.35+.65*lit);
  const dn=[0,-1,0];moss(f.p,dn,rr(R*.6,R));
  for(let q=0,nq=1+Math.floor(rng()*3);q<nq;q++)moss([f.p[0]+rr(-1,1)*R,f.p[1]-rr(0,.2),f.p[2]+rr(-1,1)*R],dn,rr(R*.25,R*.8));
  if(rng()<lit*.85)roots([f.p[0],f.p[1]-.15,f.p[2]],rr(4,opt.hang||16)*(.35+.65*lit),rr(.5,2.2));
  if(rng()<lit*.6)BIO.put('beard',[f.p[0]+rr(-1,1),f.p[1]-.1,f.p[2]+rr(-1,1)],qEuler(0,rng()*TAU,0),[rr(1.2,2.4),rr(2,7)*(.4+.6*lit),1],beardCol());
  if(rng()<lit*.40)curtain([f.p[0],f.p[1]-.2,f.p[2]],f.p[0]-cx,f.p[2]-cz,rr(5,opt.hang||16),rr(2,6),{flowers:rng()<.5});
  if(rng()<.14)bracket([f.p[0],f.p[1]-rr(.5,2),f.p[2]],[0,0,0],rr(1,2.6));});};
// WALLS: vines climbing, brackets, moss streaks under the drips

function regAt(p){let best=null;for(const r of REG){const dx=p.x-r.x,dz=p.z-r.z;if(dx*dx+dz*dz<=r.r*r.r&&p.y>=r.y-2&&p.y<=r.y+r.h+5){if(!best||r.r<best.r)best=r;}}return best;}
function inspectAt(cx,cy){const v=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);
 const hits=ray.intersectObjects(scene.children,true).filter(h=>!(h.object.userData&&h.object.userData.probeSkip)&&h.object!==groundM&&!(h.object.userData&&h.object.userData.isGround));
 if(!hits.length){insp.style.display='none';return;}const p=hits[0].point;const r=regAt(p);
 if(!r){insp.style.display='block';insp.innerHTML='<b>unregistered '+(hits[0].object.isInstancedMesh?'instance':'mesh')+'</b>\n'+p.x.toFixed(1)+', '+p.y.toFixed(1)+', '+p.z.toFixed(1);return;}
 const t=r.tags||{};const tagLines=Object.keys(t).map(k=>'<span class="tag">'+k+'</span>: '+(Array.isArray(t[k])?t[k].join(', '):t[k])).join('\n');

const hud=document.getElementById('hud');let last=performance.now(),renderErr=false;
function frame(){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 if(WALK.on){const sp=(WALK.speed||6)*(keys.shift?2.5:1)*dt;const fw=new THREE.Vector3(-Math.sin(WALK.yaw),0,-Math.cos(WALK.yaw)),rt=new THREE.Vector3(Math.cos(WALK.yaw),0,-Math.sin(WALK.yaw));

  if(keys.e)WALK.y+=sp;if(keys.q)WALK.y-=sp;const ge=terrainH(WALK.x,WALK.z)+1.7;if(!keys.e&&!keys.q)WALK.y=ge;else WALK.y=Math.max(ge,WALK.y);}
 else{const sp=ctl.radius*.6*dt;const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta)),rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));
  if(keys.w)ctl.target.addScaledVector(fw,sp);if(keys.s)ctl.target.addScaledVector(fw,-sp);if(keys.d)ctl.target.addScaledVector(rt,sp);if(keys.a)ctl.target.addScaledVector(rt,-sp);
  if(keys.q)ctl.target.y-=sp;if(keys.e)ctl.target.y+=sp;}

// ---------------------------------------------------------------- floating building labels (standard new-world package)
// One label per registered volume (REG), drawn once into a texture atlas and rendered as ONE mesh of camera-facing
// quads: a thousand labels cost one draw call. Labels keep a constant size on screen (150 px; landmarks 260 px)
// and fade out past 300 m, landmarks never. Toggled with the Labels button (they live in the LABELS group).
// A world that already made LABELS (the city) gets the atlas added to it; one that did not gets the group made here.
const LABEL_ATLAS={W:4096,H:4096,cw:409,ch:48};
function labelsBuild(){
 if(!LABELS){LABELS=new THREE.Group();LABELS.userData.probeSkip=true;scene.add(LABELS);}
 const cols=Math.floor(LABEL_ATLAS.W/LABEL_ATLAS.cw),rows=Math.floor(LABEL_ATLAS.H/LABEL_ATLAS.ch),max=cols*rows;   // whole cells: 4096/409 is not an integer, and a fractional column count misaddressed every label past the first row
 // which volumes get a label: buildings, farms and furniture; not repeated wall segments (a name seen 8+ times)
 const count={};for(const r of REG)count[r.name]=(count[r.name]||0)+1;
 let list=REG.filter(r=>r.name&&count[r.name]<8&&(!r.cls||r.cls==='building'||r.cls==='farm'||r.cls==='furniture')&&!(r.tags&&r.tags.part==='wall'));
 const isBig=r=>!!(r.tags&&(r.tags.role||r.tags.landmark));
 list.sort((a,b)=>(isBig(b)-isBig(a))||(b.r-a.r));if(list.length>max)list=list.slice(0,max);
 const cv=document.createElement('canvas');cv.width=LABEL_ATLAS.W;cv.height=LABEL_ATLAS.H;const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
 const pos=[],apos=[],uv=[],cell=[],big=[],idx=[];
 list.forEach((r,i)=>{const cx=(i%cols)*LABEL_ATLAS.cw,cy=Math.floor(i/cols)*LABEL_ATLAS.ch;const B=isBig(r);
  g.fillStyle=B?'rgba(20,12,6,.72)':'rgba(0,0,0,.55)';g.fillRect(cx+1,cy+1,LABEL_ATLAS.cw-2,LABEL_ATLAS.ch-2);
  g.font=(B?'bold 34px':'bold 28px')+' system-ui,sans-serif';g.fillStyle=B?'#ffe2b0':'#f4e8d4';g.textAlign='center';g.textBaseline='middle';
  let t=r.name;while(g.measureText(t).width>LABEL_ATLAS.cw-10&&t.length>4)t=t.slice(0,-2);if(t!==r.name)t=t.slice(0,-1)+'…';g.fillText(t,cx+LABEL_ATLAS.cw/2,cy+LABEL_ATLAS.ch/2+1);
  const y=(r.y||0)+r.h+3,b=i*4;
  for(const c of[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]]){pos.push(c[0],c[1],0);apos.push(r.x,y,r.z);uv.push((cx+(c[0]+.5)*LABEL_ATLAS.cw)/LABEL_ATLAS.W,1-(cy+(0.5-c[1])*LABEL_ATLAS.ch)/LABEL_ATLAS.H);cell.push(0,0);big.push(B?1:0);}
  idx.push(b,b+1,b+2,b,b+2,b+3);});
 if(!list.length)return null;
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('aPos',new THREE.Float32BufferAttribute(apos,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setAttribute('aBig',new THREE.Float32BufferAttribute(big,1));geo.setIndex(idx);
 // the uv above already addresses the cell, so the shader only flips nothing: cell offsets are baked in
 const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
 const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:true,fog:false,
  uniforms:{map:{value:tex},uPxToWorld:{value:1}},
  vertexShader:`attribute vec3 aPos;attribute float aBig;uniform float uPxToWorld;varying vec2 vUv;varying float vA;
   void main(){vec4 mv=modelViewMatrix*vec4(aPos,1.0);float dist=-mv.z;float w=aBig>0.5?240.0:170.0;float k=dist*uPxToWorld;
    mv.xy+=position.xy*vec2(w*k,w*k*48.0/409.0);vA=aBig>0.5?1.0:(1.0-smoothstep(320.0,560.0,dist));vUv=uv;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;varying vec2 vUv;varying float vA;void main(){vec4 c=texture2D(map,vUv);c.a*=vA;if(c.a<0.02)discard;gl_FragColor=c;}`});
 const m=new THREE.Mesh(geo,mat);m.frustumCulled=false;m.userData.probeSkip=true;m.name='labels';m.renderOrder=10;LABELS.add(m);
 FRAME_HOOKS.push(()=>{mat.uniforms.uPxToWorld.value=2*Math.tan(camera.fov*Math.PI/360)/innerHeight;});
 window._labels=list.length;return m;}

 for(let i=0;i<CS*CS;i++){const q=rgb[kData[i*4]]||[0,0,0];d[i*4]=q[0];d[i*4+1]=q[1];d[i*4+2]=q[2];d[i*4+3]=255;}

// Runs after the scene is built. HLANIM (77b) lists groups that turn at w rad/s about their local z (or y);
// HLCLOCKS (88) lists every clock face in world space.
const HLHANDS=(function(){const n=HLCLOCKS.length;if(!n)return null;const geo=new THREE.BoxGeometry(1,1,1).translate(0,.5,0),mat=new THREE.MeshStandardMaterial({color:0x1c1a1c,roughness:.5,metalness:.3});
 const hr=new THREE.InstancedMesh(geo,mat,n),mn=new THREE.InstancedMesh(geo,mat,n);hr.frustumCulled=mn.frustumCulled=false;hr.userData.probeSkip=mn.userData.probeSkip=true;scene.add(hr);scene.add(mn);
 return{hr,mn};})();
function hlHour(){if(typeof window.HL_HOUR==='number')return((window.HL_HOUR%24)+24)%24;const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;}
const _hlM=new THREE.Matrix4(),_hlQ=new THREE.Quaternion(),_hlZ=new THREE.Vector3(0,0,1),_hlP=new THREE.Vector3(),_hlS=new THREE.Vector3();
function hlSetHands(){if(!HLHANDS)return;const h=hlHour(),am=(h%1)*TAU,ah=(h%12)/12*TAU;
 HLCLOCKS.forEach((c,i)=>{const n=_hlZ.clone().applyQuaternion(c.q);
  for(const [im,a,len,wd,off] of[[HLHANDS.hr,ah,.55,.075,.03],[HLHANDS.mn,am,.82,.045,.05]]){_hlQ.copy(c.q).multiply(new THREE.Quaternion().setFromAxisAngle(_hlZ,-a));
   _hlP.copy(c.p).addScaledVector(n,off*c.r+.02);_hlS.set(wd*c.r,len*c.r,.03*c.r+.01);_hlM.compose(_hlP,_hlQ,_hlS);im.setMatrixAt(i,_hlM);}});
 HLHANDS.hr.instanceMatrix.needsUpdate=HLHANDS.mn.instanceMatrix.needsUpdate=true;}
hlSetHands();let _hlClockT=0;
FRAME_HOOKS.push((dt)=>{for(const a of HLANIM){if(a.axis==='y')a.o.rotation.y+=a.w*dt;else a.o.rotation.z+=a.w*dt;}
 _hlClockT+=dt;if(_hlClockT>1){_hlClockT=0;hlSetHands();}});
