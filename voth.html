<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voth — City of Cantons</title>
<link rel="stylesheet" href="css/voth.css">
</head>
<body>
<div id="load">Raising the cantons…</div>
<div id="ui">
  <h1>Voth</h1>
  <div id="views"></div>
  <div id="hint">Drag&nbsp;= orbit · Wheel&nbsp;= zoom · WASD/QE&nbsp;= pan · Shift&nbsp;= fast<br>Click the world to print its coordinates.</div>
  <div id="dnControls">
    <div id="dnLabel"><span>Time of day</span><span id="dnHourOut">10:00</span></div>
    <input type="range" id="dnSlider" min="0" max="24" step="0.1" value="10">
    <button id="dnPause">Pause</button>
    <button id="weatherToggle">Weather: Clear</button>
  </div>
  <button id="inspectToggle">Inspector: Off</button>
  <button id="pathvizToggle">Paths: Off</button>
  <select id="pathvizSel"></select>
  <div>
    <button id="polyToggle">Mark polygon</button>
    <button id="polyUndo">Undo point</button>
    <button id="polyClear">Clear</button>
  </div>
  <div id="polyBox">
    <div id="hint">Click the ground to drop a corner, in order. The box below is a ready-to-paste [[x,z],...] array; click it to select all.</div>
    <textarea id="polyOut" readonly onclick="this.select()"></textarea>
  </div>
</div>
<div id="hud"></div>
<div id="inspectTip"></div>
<div id="errs"></div>
<!-- the vendored copy, like every other page here: this is served over a LAN that need not have a route out -->
<script src="vendor/three/three.min.js"></script>
<script>
var _errBox=document.getElementById('errs'), _errN=0;
// an error takes the loading screen away with it: it used to go into a box drawn underneath the loading screen,
// so a page that failed to build just said 'Raising the cantons' for ever
function ERR(m){ var l=document.getElementById('load'); if(l) l.style.display='none';
  if(_errN++>14) return; _errBox.textContent += (_errBox.textContent?'\n':'')+m; }
window.onerror=function(m,u,l,c,e){ ERR('error: '+m+' @'+l+':'+c+(e&&e.stack?'\n'+e.stack:'')); };
window.addEventListener('unhandledrejection',function(e){ ERR('promise: '+(e.reason&&e.reason.stack||e.reason)); });
</script>
<!-- The city itself: src/voth/stages/, assembled into src/voth/build.js by tools/build-page.py. It is run here and
     not by a main.js, because the fingerprint the tests check has to be taken in the same task, before the first
     frame moves anything. -->
<script type="module">
import {build} from './src/voth/build.js';
import {sceneRows} from './src/core/fingerprint.js';
import {installMenagerie} from './src/core/menagerie.js';
if(!window.THREE)ERR('Could not load vendor/three/three.min.js.');
else{
  // build() is async but awaits nothing, so the whole city is built before the next line runs
  const done=build({}).catch(e=>ERR('build: '+(e&&e.stack||e)));
  try{if(window._vothScene)(window._iz=window._iz||{}).lotList=sceneRows(THREE,window._vothScene);}catch(e){ERR('fingerprint: '+(e&&e.message||e));}
  void done;
}
// the way back to the menagerie, and into the other scenes: adds nothing unless a server answers /scenes.json
installMenagerie({standalone:true}).catch(()=>{});
</script>
</body>
</html>
