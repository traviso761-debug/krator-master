// ==================== rand/08-core-rand.js
// ================================================================= CORE — rand: one generator, one hash, one noise
// GODOT-PLAN.md Phase 2, item 1. Every number here is reproducible bit for bit in GDScript (krand.gd beside this
// file) because nothing in it calls Math.sin, Math.pow or any other library function whose last bits differ by
// engine: the stream and the hash are 32-bit integer arithmetic, and the noise is +, -, *, / and floor on doubles,
// in a fixed order. golden.json holds the vectors both engines are tested against (test-rand.js, test_rand.py).
//
//   KRAND.stream(seed)             a mulberry32 stream: the SAME numbers as the rng()/reseed() every Krator lineage
//                                  already uses (kits/ancients 10-core.js, core/biome 10-core-head.js), so a build
//                                  that moves its draws onto a stream moves no rubble
//     s.next()  [0,1)   s.u32()  integer   s.range(a,b)   s.int(a,b) inclusive   s.pick(arr)   s.chance(p)
//     s.state() / s.setState(u32)          for saving and resuming a stream
//   KRAND.hash(seed, a, b, c...)   u32 from a seed and any number of int32 values (floats are floored first)
//   KRAND.unit(u32)                [0,1)
//   KRAND.h3(x,y,z, seed)          [0,1) at an integer lattice point: the portable replacement for the lineages'
//                                  sin-based h3 (which a GDScript port cannot reproduce). Floats are floored.
//   KRAND.vnoise(x,y,z, seed)      value noise in [0,1]: the lineages' vnoise (smoothstep trilinear) on h3 above
//   KRAND.fbm(x,y,z, octaves, seed)  the lineages' fbm (octaves default 3, frequency x2.03, amplitude 1/f)
//   KRAND.cell(seed, ix, iz)       a seed for one placement cell, so a tile built alone draws what it draws in a
//                                  full build (biomes/WORLD.md: placement seeded by cell)
//   KRAND.child(seed, name)        a seed for a named sub-stream ('trees', 'rubble'...), no collisions to manage
//
// Ranges: lattice coordinates and hash inputs are int32 (|x| < 2^31). Seeds are taken as u32 (seed>>>0).
// The noise of a NEW seed is not the old sin-based noise: moving a build's terrain or textures onto it moves them
// (GODOT-PLAN.md section 7, "Moving rubble": one build at a time, with a screenshot set).
(function(root){
  'use strict';
  var imul=Math.imul;
  // murmur3's 32-bit finalizer: full avalanche
  function mix32(h){h^=h>>>16;h=imul(h,0x85ebca6b);h^=h>>>13;h=imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0;}
  function step(h,v){h=imul(h^(v|0),0x9E3779B1);return (h<<13|h>>>19);}
  function hash(seed){var h=(seed>>>0)^0x2545F491,n=arguments.length-1;
    for(var i=1;i<=n;i++)h=step(h,Math.floor(arguments[i]));
    return mix32(h^n);}
  function hash3(seed,a,b,c){return mix32(step(step(step((seed>>>0)^0x2545F491,a),b),c)^3);}  // hash(seed,a,b,c), unrolled
  var INV=1/4294967296;
  function unit(u){return (u>>>0)*INV;}
  function h3(x,y,z,seed){return hash3(seed||0,Math.floor(x),Math.floor(y),Math.floor(z))*INV;}
  function vnoise(x,y,z,seed){seed=seed||0;
    var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
    var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
    var a0=hash3(seed,xi,yi,zi)*INV,a1=hash3(seed,xi+1,yi,zi)*INV,b0=hash3(seed,xi,yi+1,zi)*INV,b1=hash3(seed,xi+1,yi+1,zi)*INV,
        c0=hash3(seed,xi,yi,zi+1)*INV,c1=hash3(seed,xi+1,yi,zi+1)*INV,d0=hash3(seed,xi,yi+1,zi+1)*INV,d1=hash3(seed,xi+1,yi+1,zi+1)*INV;
    var a=a0+(a1-a0)*u,b=b0+(b1-b0)*u,c=c0+(c1-c0)*u,d=d0+(d1-d0)*u;
    var e=a+(b-a)*v,f=c+(d-c)*v;return e+(f-e)*w;}
  function fbm(x,y,z,o,seed){o=o||3;var a=0,f=1,s=0;for(var i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f,seed)/f;s+=1/f;f*=2.03;}return a/s;}
  function cell(seed,ix,iz){return hash3(seed,ix,iz,0x51ED);}
  function child(seed,name){var h=0x811C9DC5;name=String(name);   // FNV-1a over UTF-16 code units, then mixed with the seed
    for(var i=0;i<name.length;i++)h=imul(h^name.charCodeAt(i),0x01000193);
    return hash(seed,h|0);}
  function stream(seed){
    var s=seed>>>0;
    function u32(){s|=0;s=s+0x6D2B79F5|0;var t=imul(s^s>>>15,1|s);t=t+imul(t^t>>>7,61|t)^t;return (t^t>>>14)>>>0;}
    function next(){return u32()*INV;}
    return {next:next,u32:u32,
      range:function(a,b){return a+(b-a)*next();},
      int:function(a,b){return a+Math.floor(next()*(b-a+1));},
      pick:function(arr){return arr[Math.floor(next()*arr.length)%arr.length];},
      chance:function(p){return next()<p;},
      state:function(){return s>>>0;},setState:function(v){s=v>>>0;}};
  }
  root.KRAND={version:1,stream:stream,hash:hash,unit:unit,h3:h3,vnoise:vnoise,fbm:fbm,cell:cell,child:child,mix32:mix32};
})(typeof window!=='undefined'?window:globalThis);

// ==================== tags/50-core-tags.js
// ================================================================= CORE TAGS — the registry ([G data])
// One registry of WHAT a placed thing is, for every build (GODOT-PLAN.md Phase 2 item 3, rule 4; PROPOSAL.md and
// README.md here). It holds no geometry, collision, draw or live state: only the record. No THREE, no DOM: it runs
// in node (test-tags.js), and its export is what crosses to Godot as node metadata.
//
//   const T = KTAGS.create({ build: 'yuni' })
//   T.add(rec)               -> the stored record, with its id and uid (defaults filled, tags normalised)
//   T.child(parentId, rec)   -> a record whose id is a path under its parent: 'bld_00098.room.4'
//   T.get(id)                -> the record (a removed one too), or null
//   T.remove(id)             -> the record, marked removed: true. It keeps its id; no id is ever reused
//   T.query(q)               -> the live records matching q = { class, kind, key, parent, tags: { culture: 'voth',
//                               types: 'shop' }, box: [x0, z0, x1, z1], removed: true (to include removed ones) }
//   T.at(x, z, y)            -> the smallest live record whose footprint (and height, when y is given) holds the
//                               point: the inspector's rule, once
//   T.audit()                -> { records, removed, byClass, unknownKeys, unknownValues, unknown, missingCulture,
//                               missingTypes }: unknown vocabulary is counted here, never thrown
//   T.export()               -> { format: 'krator-tags', version: 1, build, convention, vocab, records }
//   KTAGS.uid(cls, key, at)  -> the position hash, 8 hex digits (README.md, "The uid": Godot reproduces it)
//   KTAGS.instanceId(id, i)  -> 'flora_00012#37': an instance of an item's record (an instance has no record)
//   T.addSet(rec, table)     -> an item set: one record (set: true, count) for an item placed many times; its
//                               instances are rows of `table` (KTAGS.table(), or a build's own reader)
//   T.instance(set, i)       -> instance i as a record, built on demand ({id: 'flora_00012#37', uid, at, ry, size, tags...});
//                               T.get('flora_00012#37') does the same. T.uids(set) -> every instance's uid (Uint32Array)
//   KTAGS.norm(tags)         -> { tags, problems }: the input mapping (aliases, wealth names) and the checks
//
// The record: { id, uid, class, kind, key, name, parent, at: [x,y,z], ry, size: [w,d,h] | r (+ h), tags, note, src }
//   at   the base centre in world metres (+Y up, x east, z south): y is where it stands. x, y, z on input work too
//   ry   radians about +Y, three's rotation.y (the front, +z, turns to (sin ry, cos ry)); yaw is an alias on input
//   size full extents in its own frame; a round thing gives r (and h) instead
// The vocabulary (KTAGS.VOCAB) is 52-core-tags-vocab.js; the label the inspector shows is 53-core-tags-host.js.
(function(){
 'use strict';
 var root = typeof globalThis !== 'undefined' ? globalThis : this;
 var K = { version: 1 };

 function krand(){
   if (typeof KRAND !== 'undefined') return KRAND;
   if (root.KRAND) return root.KRAND;
   throw new Error('core/tags needs core/rand (08-core-rand.js) loaded first: the uid is a KRAND.hash');
 }
 function vocab(){
   if (!K.VOCAB) throw new Error('core/tags: load 52-core-tags-vocab.js before the first add');
   return K.VOCAB;
 }
 function pad5(n){ return ('0000' + n).slice(-5); }
 function r4(v){ return +(+v).toFixed(4); }

 // ---- the uid: KRAND.hash(0, str(class), str(key), cm10(x), cm10(y), cm10(z)) as 8 lowercase hex digits.
 // str(s) is FNV-1a over the UTF-16 code units of s ('' for a null key), as int32; cm10(v) = floor(v * 10 + 0.5),
 // the position in 10 cm steps (KRAND.hash floors its arguments, so it is passed v * 10 + 0.5). README.md, "The uid".
 function str32(s){
   var h = 0x811C9DC5; s = s == null ? '' : String(s);
   for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x01000193);
   return h | 0;
 }
 K.str32 = str32;
 // the uid as a u32, from the class's and key's str32 (hashed once per item set, not once per instance)
 K.uid32 = function(c32, k32, x, y, z){ return krand().hash(0, c32, k32, x * 10 + 0.5, y * 10 + 0.5, z * 10 + 0.5); };
 K.hex = function(u){ return ('0000000' + (u >>> 0).toString(16)).slice(-8); };
 K.uid = function(cls, key, at){ return K.hex(K.uid32(str32(cls), str32(key), at[0], at[1], at[2])); };
 K.instanceId = function(id, i){ return id + '#' + i; };

 // ---- the instance table of an item set (Decisions 5; README.md, "Item sets"). Anything with
 //   n               the instance count (a number, or a function returning it)
 //   pos(i, out)     -> out = [x, y, z], the instance's base centre as stored (no rounding: its uid is made from it)
 //   ry(i)           -> radians about +Y (optional, 0)
 //   size(i, out)    -> out = [w, d, h], full extents in its own frame (optional)
 // KTAGS.table() is a growable typed-array one (push(x, y, z, ry, w, d, h) -> the index); a build that keeps its
 // instances elsewhere passes its own reader (core/biome reads its instance matrices: a plant costs the registry nothing).
 K.table = function(){
   var cap = 64, P = new Float32Array(cap * 3), R = new Float32Array(cap), S = new Float32Array(cap * 3);
   var t = { n: 0 };
   t.push = function(x, y, z, ry, w, d, h){
     if (t.n === cap) {
       cap *= 2;
       var p2 = new Float32Array(cap * 3), r2 = new Float32Array(cap), s2 = new Float32Array(cap * 3);
       p2.set(P); r2.set(R); s2.set(S); P = p2; R = r2; S = s2;
     }
     var i = t.n++;
     P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z; R[i] = ry || 0;
     S[i * 3] = w || 0; S[i * 3 + 1] = d || 0; S[i * 3 + 2] = h || 0;
     return i;
   };
   t.pos = function(i, out){ out = out || []; out[0] = P[i * 3]; out[1] = P[i * 3 + 1]; out[2] = P[i * 3 + 2]; return out; };
   t.ry = function(i){ return R[i]; };
   t.size = function(i, out){ out = out || []; out[0] = S[i * 3]; out[1] = S[i * 3 + 1]; out[2] = S[i * 3 + 2]; return out; };
   return t;
 };

 // ---- tags: the input mapping and the checks. Known keys take values from the vocabulary; an unknown key or
 // value stays on the record as given and is reported as a problem, which audit() counts.
 K.norm = function(tags){
   var V = vocab(), out = {}, problems = [], k;
   tags = tags || {};
   for (k in tags) if (tags[k] !== undefined && (!V.keyAlias || !V.keyAlias[k])) out[k] = tags[k];
   if (V.keyAlias) for (k in tags) if (tags[k] !== undefined && V.keyAlias[k] && !(V.keyAlias[k] in out)) out[V.keyAlias[k]] = tags[k];
   // culture first: an old spelling may set wealth, style, state or set (PROPOSAL.md, "The culture list, cleaned")
   if (typeof out.culture === 'string' && V.cultureAlias[out.culture]) {
     var al = V.cultureAlias[out.culture];
     out.culture = al.culture;
     for (k in al) if (k !== 'culture' && !(k in out)) out[k] = al[k];   // a given value, null too, wins
   }
   if (typeof out.wealth === 'number') out.wealth = V.wealthOf(out.wealth);
   else if (typeof out.wealth === 'string' && V.wealthAlias.hasOwnProperty(out.wealth)) out.wealth = V.wealthAlias[out.wealth];
   if (typeof out.types === 'string') out.types = [out.types];
   if (Array.isArray(out.types) && V.typeAlias) {   // older spellings: one may become several; no duplicates
     var ty = [];
     for (var ti = 0; ti < out.types.length; ti++) {
       var tv = V.typeAlias[out.types[ti]] || [out.types[ti]];
       for (var tj = 0; tj < tv.length; tj++) if (ty.indexOf(tv[tj]) < 0) ty.push(tv[tj]);
     }
     out.types = ty;
   }
   if (typeof out.state === 'string' && V.stateAlias && V.stateAlias[out.state]) out.state = V.stateAlias[out.state];
   if (typeof out.riparian === 'string' && V.riparianAlias && V.riparianAlias[out.riparian]) out.riparian = V.riparianAlias[out.riparian];
   for (k in out) {
     var rule = V.keys[k], v = out[k];
     if (!rule) { problems.push({ key: k }); continue; }
     if (v === null || rule === 'free') continue;
     if (rule === 'bool') { if (typeof v !== 'boolean') problems.push({ key: k, value: v }); continue; }
     if (rule === 'object') { if (typeof v !== 'object' || Array.isArray(v)) problems.push({ key: k, value: v }); continue; }
     var list = V[rule];
     if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) if (list.indexOf(v[i]) < 0) problems.push({ key: k, value: v[i] }); }
     else if (V.ranges && V.ranges[k] && typeof v === 'string' && /^[^.]+\.\.[^.]+$/.test(v)) {   // a range: 'arid..humid'
       var ends = v.split('..');
       if (list.indexOf(ends[0]) < 0 || list.indexOf(ends[1]) < 0) problems.push({ key: k, value: v });
     }
     else if (list.indexOf(v) < 0) problems.push({ key: k, value: v });
   }
   return { tags: out, problems: problems };
 };

 K.create = function(cfg){
   cfg = cfg || {};
   var V = null, recs = [], byId = {}, counters = {}, childCount = {};
   var T = { build: cfg.build || null, records: recs };

   function prefixOf(rec){
     if (rec.prefix) return rec.prefix;
     if (rec['class'] === 'fixture' && V.fixturePrefix[rec.kind]) return V.fixturePrefix[rec.kind];
     return V.prefix[rec['class']];
   }
   // a passed-through order id moves its prefix's counter past it, so a later made id never collides
   function claim(id){

     if (m) counters[m[1]] = Math.max(counters[m[1]] || 0, parseInt(m[2], 10) + 1);
   }
   function make(rec, parent){
     V = V || vocab();
     var cls = rec['class'] != null ? rec['class'] : rec.cls;
     if (cls === 'fauna') throw new Error('core/tags: fauna is not a class; a placed animal is class "life" with its species as kind');
     if (V.classes.indexOf(cls) < 0) throw new Error('core/tags: unknown class ' + cls);
     var at = rec.at ? rec.at : [rec.x || 0, rec.y || 0, rec.z || 0];
     var o = { id: null, uid: null, 'class': cls, kind: rec.kind != null ? rec.kind : null, key: rec.key != null ? rec.key : null,
       name: rec.name != null ? rec.name : null, parent: parent || (rec.parent != null ? rec.parent : null),
       at: [r4(at[0]), r4(at[1]), r4(at[2])], ry: r4(rec.ry != null ? rec.ry : (rec.yaw || 0)) };
     if (rec.size) o.size = rec.size.map(r4);
     else if (rec.r != null) { o.r = r4(rec.r); if (rec.h != null) o.h = r4(rec.h); }
     o.tags = K.norm(rec.tags).tags;
     if (rec.note != null) o.note = String(rec.note);
     o.src = { build: T.build, frag: rec.frag || (rec.src && rec.src.frag) || null };
     if (rec.id != null) {
       if (byId[rec.id]) throw new Error('core/tags: duplicate id ' + rec.id);
       o.id = String(rec.id); claim(o.id);
     } else if (parent) {
       var seg = rec.kind || cls, ck = parent + '.' + seg;
       o.id = ck + '.' + (childCount[ck] = (childCount[ck] || 0) + 1, childCount[ck] - 1);
     } else {
       var p = prefixOf(o);
       if (!p) throw new Error('core/tags: no id prefix for class ' + cls);
       counters[p] = counters[p] || 0;
       o.id = p + '_' + pad5(counters[p]++);
     }
     o.uid = K.uid(cls, o.key, o.at);

   T.child = function(parentId, rec){
     if (!byId[parentId]) throw new Error('core/tags: child of an unknown parent ' + parentId);

   // ---- item sets: one record for an item, its instances rows of a table (README.md, "Item sets") ----
   // An instance has no record of its own (Decisions 5): T.instance builds one on demand, with the id
   // 'flora_00012#37', the set's class, kind, key, name and tags (shared, not copied), and the uid of its own position.

   T.addSet = function(rec, table){

   T.remove = function(id){ var r = byId[id]; if (r) r.removed = true; return r || null; };

   function tagMatch(r, want){

       if (q.key != null && r.key !== q.key) continue;
       if (q.parent !== undefined && r.parent !== q.parent) continue;

// ==================== simulation/77-sim-7-lod.js

//

// the place they last worked) and its animals at home, each at the efficiency it had when the town was lowered; a
// cart's trip takes the straight line times the detour at its speed, no route, and the load moves when its minutes are

// bringing a lot in, or taking an export out, while the group is on the map), and a lot landed at a carrier's
// unloading place (a site store with no recipe: the caravanserai, a quay, a pier) waiting for the carts. `storage`:

// what people wear, keep at home and work with (the items module's things). `ordered`, apart from the total: an
// import sent for by timer (no carrier on the map). A shop has no shelf of its own: it sells from the warehouses.

// snapshot; `day` is the last two snapshots' difference (from one midnight to the next; `partial` when the first began

 const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x7a8a5a}));m.name='ground';scene.add(m);}
for(const e of EXEDGES){const A=EXNODES[e.a],B=EXNODES[e.b],L=Math.hypot(B.x-A.x,B.z-A.z),r=new THREE.Mesh(new THREE.BoxGeometry(6,0.2,L),new THREE.MeshLambertMaterial({color:0x8a7a62}));
 r.position.set((A.x+B.x)/2,0.7,(A.z+B.z)/2);r.rotation.y=Math.atan2(B.x-A.x,B.z-A.z);r.name='street';scene.add(r);}
const T=KTAGS.page=KTAGS.create({build:'host-example'});
const EXSIZE={home:[12,10,6],market:[18,14,4],caravanserai:[22,18,7],field:[24,24,0.6],warehouse:[14,12,9]},EXCOL={home:0xc8a878,market:0xd8b060,caravanserai:0xb8946a,field:0x9aa860,warehouse:0x8a7a6a};
const EXBOX={};
for(const P of SIM.all('place')){const sz=EXSIZE[P.kind]||[8,8,4],y=exGround(P.x,P.z);
 const rec=T.add({'class':'building',kind:P.kind,key:P.id,name:P.name||P.id,at:[P.x,y,P.z],size:sz,tags:{culture:'generic'},frag:'60-scene.js'});
 const m=new THREE.Mesh(new THREE.BoxGeometry(sz[0],sz[2],sz[1]).translate(0,sz[2]/2,0),new THREE.MeshLambertMaterial({color:EXCOL[P.kind]||0xa09080}));
 m.position.set(P.x,y,P.z);m.name=P.id;scene.add(m);EXBOX[P.id]={rec,m};
 if(P.kind==='warehouse'){const fl=new THREE.Mesh(new THREE.BoxGeometry(sz[0]-1,0.3,sz[1]-1),new THREE.MeshLambertMaterial({color:0x6a5a4a}));fl.position.set(P.x,y+4.5,P.z);scene.add(fl);}}   // an upper floor (the cutaway's second storey)
// the people: one dot each, at SIM.pose; the instance is the actor
const EXACT=SIM.all('actor').map(a=>a.id);
const exDots=new THREE.InstancedMesh(new THREE.SphereGeometry(1.1,10,8),new THREE.MeshLambertMaterial({color:0xffffff}),EXACT.length);exDots.name='people';
{const col=new THREE.Color();EXACT.forEach((id,i)=>{const a=SIM.R.actor[id];exDots.setColorAt(i,col.set(a.cart?0x5aa6d9:a.role==='grower'?0x8fc46a:0xe0a24a));});}
scene.add(exDots);
const exM=new THREE.Matrix4();
function exDraw(){const t=SIM.time();EXACT.forEach((id,i)=>{const a=SIM.R.actor[id],p=a.present?SIM.pose(a,t):null;
 if(!p||p.hidden)exM.makeScale(0,0,0);else exM.makeTranslation(p.x,exGround(p.x,p.z)+1.2,p.z);exDots.setMatrixAt(i,exM);});exDots.instanceMatrix.needsUpdate=true;}
exDraw();

// ==================== host/example/98-take.js
// ================================================================= EXAMPLE — everything core/host is handed, in one call
// The reference for a build adopting the whole interface (core/host/README.md): the views, the ground, the records
// (KTAGS.page), what things hold (o.holds over core/simulation: the stocks panel, O, and the inspector's contents), the
// editor (o.palette and a live world adapter: every edit a core/edits op), the cutaway (the shed's two storeys), the
// minimap from the records, marks. The world clock is the host's: 98 steps the simulation one world minute at a time.
const EXPIECES={crate:{w:1.2,d:1.2,h:1,col:0x9a7a52},barrel:{r:0.5,h:1.1,col:0x7a5a3a},shrub:{r:0.9,h:1.4,col:0x4f7a3e}};
function exPiece(key){const P=EXPIECES[key];if(!P)return null;
 const g=P.r?new THREE.CylinderGeometry(P.r,P.r,P.h,12).translate(0,P.h/2,0):new THREE.BoxGeometry(P.w,P.h,P.d).translate(0,P.h/2,0);
 const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:P.col}));m.name='piece:'+key;return m;}
const EXLIVE={};   // record id -> its mesh (the pieces the editor put down)
const exWorld={
 find:(t,tol)=>KEDITS.match(t,KTAGS.page.records.filter(r=>!r.removed),tol),
 add:(rec)=>{const m=exPiece(rec.key);if(!m)return null;m.position.set(rec.at[0],rec.at[1],rec.at[2]);m.rotation.y=rec.ry||0;scene.add(m);
  const P=EXPIECES[rec.key],r=KTAGS.page.add(Object.assign({},rec,{prefix:'piece',size:P.r?undefined:[P.w,P.d,P.h],r:P.r,h:P.h}));EXLIVE[r.id]=m;return r;},
 move:(h,at,ry)=>{const m=EXLIVE[h.id];if(!m)return;m.position.set(at[0],at[1],at[2]);if(ry!=null)m.rotation.y=ry;h.at=at.slice();if(ry!=null)h.ry=ry;},
 set:(h,path,value)=>{h[path]=value;},
 remove:(h)=>{const m=EXLIVE[h.id];if(m){scene.remove(m);delete EXLIVE[h.id];}KTAGS.page.remove(h.id);}};
let exLast=null;
const EXH=KHOST.take({
 build:'host-example',title:'core/host example',hint:'a toy economy on core/simulation, the whole interface on core/host',
 scene,camera,renderer,ground:exGround,clear:1.5,maxR:1500,
 views:{'The settlement':[60,140,240,75,0,20],'The shed':[60,30,70,40,3,30],'The farm':[190,40,80,150,0,30]},
 clock:{hour:8,running:true,scale:1,speeds:[0,1,2,4,8]},
 holds:KHOST.simHolds(SIM,{idOf:(rec,hit)=>hit&&hit.object===exDots&&hit.instanceId!=null?[EXACT[hit.instanceId]]:rec&&SIM.R.place[rec.key]?[rec.key]:[]}),
 inspect:(hit,hits,rec)=>hit.object===exDots&&hit.instanceId!=null?(()=>{const a=SIM.R.actor[EXACT[hit.instanceId]];return a.id+' · '+a.role+' · '+(a.activity||'idle')+(a.place?' at '+a.place:'');})():null,
 palette:{items:[{key:'crate',name:'Crate',family:'storage'},{key:'barrel',name:'Barrel',family:'storage'},{key:'shrub',name:'Shrub',family:'flora',cls:'flora'}],build:key=>exPiece(key)},
 edits:{world:exWorld,log:typeof KHOST_EDITS!=='undefined'?KHOST_EDITS:null,template:(it,at,ry)=>({'class':it.cls||'prop',key:it.key,name:it.name,at,ry})},
 cutaway:{units:[{id:'shed',name:'The shed',x:40,z:30,w:14,d:12,levels:[{y:0,h:4.5,name:'ground floor'},{y:4.5,h:4.5,name:'loft'}]}]},
 minimap:true,
 exporters:{tags:()=>KTAGS.page.export(),stocks:()=>SIM.stocks()},
 api:{world:()=>({minute:EX.m,day:EX.d}),contents:id=>SIM.contents(id)},
});
// the world minute follows the host's clock: one minute a real second at 1x (the speeds and the pause reach it)
let exAcc=0;
KHOST.on(function simStep(dt){exAcc+=dt;while(exAcc>=1){exAcc-=1;exMinute();}exDraw();});
// the editor's ops the page was made with (a saved edits.json, or this browser's draft): applied once, as the world is made
if(typeof KHOST_EDITS!=='undefined'&&KHOST_EDITS&&KHOST_EDITS.ops)window._edits=KEDITS.apply(KHOST_EDITS,exWorld,{});
