// ==================== rand/08-core-rand.js
// ================================================================= CORE — rand: one generator, one hash, one noise
// GODOT-PLAN.md Phase 2, item 1. Every number here is reproducible bit for bit in GDScript (krand.gd beside this
// file) because nothing in it calls Math.sin, Math.pow or any other library function whose last bits differ by
// engine: the stream and the hash are 32-bit integer arithmetic, and the noise is +, -, *, / and floor on doubles,
// in a fixed order. golden.json holds the vectors both engines are tested against (test-rand.js, test_rand.py).
//
//   KRAND.stream(seed)             a mulberry32 stream: the SAME numbers as the rng()/reseed() every Krator lineage
//                                  already uses (kits/ancients 10-core.js, core/biome 10-core-head.js), so a build
//                                  that moves its draws onto a stream moves no rubble
//     s.next()  [0,1)   s.u32()  integer   s.range(a,b)   s.int(a,b) inclusive   s.pick(arr)   s.chance(p)
//     s.state() / s.setState(u32)          for saving and resuming a stream
//   KRAND.hash(seed, a, b, c...)   u32 from a seed and any number of int32 values (floats are floored first)
//   KRAND.unit(u32)                [0,1)
//   KRAND.h3(x,y,z, seed)          [0,1) at an integer lattice point: the portable replacement for the lineages'
//                                  sin-based h3 (which a GDScript port cannot reproduce). Floats are floored.
//   KRAND.vnoise(x,y,z, seed)      value noise in [0,1]: the lineages' vnoise (smoothstep trilinear) on h3 above
//   KRAND.fbm(x,y,z, octaves, seed)  the lineages' fbm (octaves default 3, frequency x2.03, amplitude 1/f)
//   KRAND.cell(seed, ix, iz)       a seed for one placement cell, so a tile built alone draws what it draws in a
//                                  full build (biomes/WORLD.md: placement seeded by cell)
//   KRAND.child(seed, name)        a seed for a named sub-stream ('trees', 'rubble'...), no collisions to manage
//
// Ranges: lattice coordinates and hash inputs are int32 (|x| < 2^31). Seeds are taken as u32 (seed>>>0).
// The noise of a NEW seed is not the old sin-based noise: moving a build's terrain or textures onto it moves them
// (GODOT-PLAN.md section 7, "Moving rubble": one build at a time, with a screenshot set).
(function(root){
  'use strict';
  var imul=Math.imul;
  // murmur3's 32-bit finalizer: full avalanche
  function mix32(h){h^=h>>>16;h=imul(h,0x85ebca6b);h^=h>>>13;h=imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0;}
  function step(h,v){h=imul(h^(v|0),0x9E3779B1);return (h<<13|h>>>19);}
  function hash(seed){var h=(seed>>>0)^0x2545F491,n=arguments.length-1;
    for(var i=1;i<=n;i++)h=step(h,Math.floor(arguments[i]));
    return mix32(h^n);}
  function hash3(seed,a,b,c){return mix32(step(step(step((seed>>>0)^0x2545F491,a),b),c)^3);}  // hash(seed,a,b,c), unrolled
  var INV=1/4294967296;
  function unit(u){return (u>>>0)*INV;}
  function h3(x,y,z,seed){return hash3(seed||0,Math.floor(x),Math.floor(y),Math.floor(z))*INV;}
  function vnoise(x,y,z,seed){seed=seed||0;
    var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
    var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
    var a0=hash3(seed,xi,yi,zi)*INV,a1=hash3(seed,xi+1,yi,zi)*INV,b0=hash3(seed,xi,yi+1,zi)*INV,b1=hash3(seed,xi+1,yi+1,zi)*INV,
        c0=hash3(seed,xi,yi,zi+1)*INV,c1=hash3(seed,xi+1,yi,zi+1)*INV,d0=hash3(seed,xi,yi+1,zi+1)*INV,d1=hash3(seed,xi+1,yi+1,zi+1)*INV;
    var a=a0+(a1-a0)*u,b=b0+(b1-b0)*u,c=c0+(c1-c0)*u,d=d0+(d1-d0)*u;
    var e=a+(b-a)*v,f=c+(d-c)*v;return e+(f-e)*w;}
  function fbm(x,y,z,o,seed){o=o||3;var a=0,f=1,s=0;for(var i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f,seed)/f;s+=1/f;f*=2.03;}return a/s;}
  function cell(seed,ix,iz){return hash3(seed,ix,iz,0x51ED);}
  function child(seed,name){var h=0x811C9DC5;name=String(name);   // FNV-1a over UTF-16 code units, then mixed with the seed
    for(var i=0;i<name.length;i++)h=imul(h^name.charCodeAt(i),0x01000193);
    return hash(seed,h|0);}
  function stream(seed){
    var s=seed>>>0;
    function u32(){s|=0;s=s+0x6D2B79F5|0;var t=imul(s^s>>>15,1|s);t=t+imul(t^t>>>7,61|t)^t;return (t^t>>>14)>>>0;}
    function next(){return u32()*INV;}
    return {next:next,u32:u32,
      range:function(a,b){return a+(b-a)*next();},
      int:function(a,b){return a+Math.floor(next()*(b-a+1));},
      pick:function(arr){return arr[Math.floor(next()*arr.length)%arr.length];},
      chance:function(p){return next()<p;},
      state:function(){return s>>>0;},setState:function(v){s=v>>>0;}};
  }
  root.KRAND={version:1,stream:stream,hash:hash,unit:unit,h3:h3,vnoise:vnoise,fbm:fbm,cell:cell,child:child,mix32:mix32};
})(typeof window!=='undefined'?window:globalThis);

// ==================== clock/20-core-clock.js
// ================================================================= CORE — the world clock: motion time and world time
// One clock for a whole world (GODOT-PLAN.md, Phase 1, "The world clock"). The host's frame loop owns it and steps
// it with the real seconds since its last frame; everything else reads it. Two axes, kept apart on purpose:
//   t     MOTION time, seconds since load: wind, particles, flags, walking, KSCHED timelines. A fast day never
//         makes anything move faster.
//   hour  WORLD time, 0..24, with a day count: the sky and sun, light schedules, weather's auto mode, SIM.step()
//         once per simulated minute, life schedules.
// One world day is 72 real minutes (Travis, Oct 2026): 20 world hours per real hour, a world hour every 3 minutes.
// The preview pages hold the hour still by default (running:false); the viewer can run time and set the hour.
// No THREE, no DOM, no wall clock. One shared object, KCLOCK. Godot: WorldClock.gd, the same fields and step().
//
//   KCLOCK.DAY_SECONDS                      4320: real seconds in one world day
//   KCLOCK.make({hour:12, day:0, dayLength:DAY_SECONDS, running:false, scale:1}) -> C
//   C.step(dt)      dt real seconds (negative or NaN count as 0; capped at 0.1). t += dt*scale; if running, the hour
//                   advances 24*dt*scale/dayLength and wraps into the next day. Returns C.
//   C.set(hour)     jump to an hour (wrapped into 0..24); the day is kept
//   C.run(on)       start or hold world time; motion time runs either way
//   C.fixed         a number pins t there and makes dt 0 (repeatable shots); null runs
//   C.t, C.dt, C.hour, C.day, C.running, C.scale, C.dayLength   read them directly
//   C.rate()        world hours per real hour (20 for a 72-minute day)
//   C.state() / C.load(s)   the clock as plain data (a saved game, the export) and back
(function(root){
  var DAY=72*60;
  function wrap(h){h=h%24;return h<0?h+24:h;}
  function make(o){
    o=o||{};
    var C={t:0,dt:0,hour:wrap(o.hour!=null?o.hour:12),day:o.day|0,dayLength:o.dayLength>0?o.dayLength:DAY,
      running:!!o.running,scale:o.scale!=null?o.scale:1,fixed:null};
    C.step=function(dt){
      var real=+dt;if(!(real>0))real=0;if(real>.1)real=.1;
      if(C.fixed!=null){C.dt=0;C.t=C.fixed;return C;}
      C.dt=real*C.scale;C.t+=C.dt;
      if(C.running&&C.dt>0){var h=C.hour+24*C.dt/C.dayLength;while(h>=24){h-=24;C.day++;}C.hour=h;}
      return C;};
    C.set=function(h){C.hour=wrap(+h||0);return C;};
    C.run=function(on){C.running=on===undefined?!C.running:!!on;return C;};
    C.rate=function(){return 24*3600/C.dayLength;};
    C.state=function(){return{t:C.t,hour:C.hour,day:C.day,dayLength:C.dayLength,running:C.running,scale:C.scale};};
    C.load=function(s){for(var k in s)if(k in C&&typeof C[k]!=='function')C[k]=s[k];C.hour=wrap(C.hour);return C;};
    return C;}
  root.KCLOCK={DAY_SECONDS:DAY,make:make};
})(typeof window!=='undefined'?window:globalThis);

// ==================== simulation/77-sim-0-core.js
// ================================================================= CORE — simulation 0: SIM, the host binding, the registries
// core/simulation/PLAN.md, Phase 1 (first consumer: settlements/mungo). The world as DATA: factions, organisations,
// relations, places that offer activities in slots, roles with hour-by-hour schedules, actors, groups, events, and
// the navigation layers they move on. Decisions are STEPPED once per simulated minute from SIM's own seeded stream;
// motion between decisions is a pure function of time (77-sim-5-motion.js). No THREE, no DOM: the build's own
// fragments (its "embodiment") read SIM and draw. Record shapes are SCHEMA.md's; SIM.export() writes them back out.
//
//   SIM.init({ seed, hour:()=>0..24, day:()=>int, t:()=>motion seconds, err:(msg)=>{} })     the host binding
//   SIM.rng                       the stream decisions draw from (KRAND.stream when core/rand is loaded)
//   SIM.minute()                  the world minute: day*1440 + floor(hour*60)
//   SIM.sched([[h, ACT], ...])    a schedule as spans -> 24 hourly activities (Shade's form); 24-arrays pass through
//   SIM.add(kind, rec)            register a record of a kind (activity faction org relation place role actor group
//                                 event port); a duplicate id throws. The typed helpers below call it.
//   SIM.get(kind, id) / SIM.all(kind)
//   SIM.load(json)                the hand-edited overlay (PLAN.md 4.2): a record with a known id overrides it field by
//                                 field, a new id is added, {id, remove:true} deletes; then every reference is checked
//   SIM.check()                   unknown references -> SIM.problems (and the host's err), returns the list
//   SIM.logEvent(kind, data)      the decision log (a ring of SIM.LOG_MAX), what the export carries
(function(root){
  'use strict';
  var KINDS = ['activity','faction','org','relation','presence','place','role','actor','group','event','port'];
  var SIM = { version:1, R:{}, order:{}, problems:[], LOG:[], LOG_MAX:6000, host:null, rng:null, routeFail:[] };
  KINDS.forEach(function(k){ SIM.R[k] = {}; SIM.order[k] = []; });

  function mulberry(seed){ var s=seed>>>0; return { next:function(){ s=(s+0x6D2B79F5)|0; var t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; },
    state:function(){ return s>>>0; }, setState:function(v){ s=v>>>0; } }; }
  function stream(seed){ var K=root.KRAND; var s = K && K.stream ? K.stream(seed) : mulberry(seed);
    if(!s.range) s.range=function(a,b){ return a+(b-a)*s.next(); };
    if(!s.int) s.int=function(a,b){ return a+Math.floor(s.next()*(b-a+1)); };
    if(!s.pick) s.pick=function(arr){ return arr[Math.floor(s.next()*arr.length)%arr.length]; };
    if(!s.chance) s.chance=function(p){ return s.next()<p; };
    return s; }
  SIM.stream = stream;

  SIM.init = function(o){
    o = o || {};
    SIM.host = { hour:o.hour||function(){ return 12; }, day:o.day||function(){ return 0; }, t:o.t||function(){ return 0; },
                 err:o.err||function(m){ if(typeof console!=='undefined') console.warn('SIM: '+m); } };
    SIM.seed = (o.seed==null ? 1 : o.seed)>>>0;
    SIM.rng = stream(SIM.seed);
    return SIM;
  };
  SIM.init({});
  SIM.err = function(m){ SIM.problems.push(m); SIM.host.err(m); };
  SIM.hour = function(){ return SIM.host.hour(); };
  SIM.minute = function(){ return SIM.host.day()*1440 + Math.floor(SIM.host.hour()*60); };
  SIM.time = function(){ return SIM.host.t(); };

  SIM.sched = function(spans){
    if(spans && spans.length===24 && typeof spans[0]==='string') return spans.slice();
    if(!spans || !spans.length) throw new Error('SIM.sched: empty schedule');
    var out=new Array(24), a=spans[spans.length-1][1];
    for(var h=0;h<24;h++){ for(var i=0;i<spans.length;i++) if(spans[i][0]===h) a=spans[i][1]; out[h]=a; }
    return out;
  };

  SIM.add = function(kind, rec){
    if(!SIM.R[kind]) throw new Error('SIM.add: unknown kind '+kind);
    if(!rec || rec.id==null) throw new Error('SIM.add('+kind+'): a record needs an id');
    if(SIM.R[kind][rec.id]) throw new Error('SIM.add('+kind+'): duplicate id '+rec.id);
    SIM.R[kind][rec.id] = rec; SIM.order[kind].push(rec.id); return rec;
  };
  SIM.get = function(kind, id){ return SIM.R[kind] ? SIM.R[kind][id] : undefined; };
  SIM.all = function(kind){ var R=SIM.R[kind]; return SIM.order[kind].filter(function(id){ return R[id]; }).map(function(id){ return R[id]; }); };
  SIM.remove = function(kind, id){ delete SIM.R[kind][id]; };

  /* the overlay: what a hand-edited world/*.json says wins over what the geometry registered */
  var PLURAL = { activities:'activity', factions:'faction', orgs:'org', organizations:'org', relations:'relation', presence:'presence',
                 places:'place', roles:'role', actors:'actor', population:'role', groups:'group', events:'event', ports:'port' };
  SIM.load = function(json){
    var n={ added:0, overridden:0, removed:0 };
    Object.keys(json||{}).forEach(function(file){
      var kind = PLURAL[file] || file; if(!SIM.R[kind]){ SIM.err('load: unknown record kind "'+file+'"'); return; }
      (json[file]||[]).forEach(function(r){
        if(r.id==null && kind==='relation' && r.a!=null && r.b!=null) r.id = r.a+'>'+r.b;            /* SCHEMA.md: the id defaults */
        if(r.id==null && kind==='presence' && r.faction!=null && r.settlement!=null) r.id = r.faction+'@'+r.settlement;
        if(r.id==null){ SIM.err('load: a '+kind+' record without an id ('+(r._src||'?')+')'); return; }
        var cur = SIM.R[kind][r.id];
        if(r.remove){ if(cur){ SIM.remove(kind, r.id); n.removed++; } else SIM.err('load: remove of unknown '+kind+' '+r.id+' ('+(r._src||'?')+')'); return; }
        if(cur){ for(var k in r) if(k!=='id') cur[k]=r[k]; if(cur.sched && !Array.isArray(cur.sched[0]) && cur.sched.length!==24) cur.sched=SIM.sched(cur.sched); n.overridden++; }
        else { var rec={}; for(var k2 in r) rec[k2]=r[k2];
          var mk={ activity:SIM.activity, faction:SIM.faction, org:SIM.org, relation:SIM.relation, presence:SIM.presence, place:SIM.place, role:SIM.role, actor:SIM.actor, group:SIM.group, event:SIM.event, port:SIM.port }[kind];
          (mk || function(o){ return SIM.add(kind, o); })(rec); n.added++; }
      });
    });
    SIM.normalize();
    SIM.lastLoad = n; return n;
  };
  /* schedules given as spans become 24-arrays; places' activities become {ACT: slots} */
  SIM.normalize = function(){
    SIM.all('role').forEach(function(R){ if(R.sched && R.sched.length && Array.isArray(R.sched[0])) R.sched = SIM.sched(R.sched); });
    SIM.all('actor').forEach(function(A){ if(A.sched && A.sched.length && Array.isArray(A.sched[0])) A.sched = SIM.sched(A.sched); });
    SIM.all('place').forEach(function(P){ if(Array.isArray(P.activities)){ var o={}; P.activities.forEach(function(a){ o[a]=P.capacity||1; }); P.activities=o; } });
  };
  /* every reference resolves, or it is a problem with a name */
  SIM.check = function(){
    var out=[], A=SIM.R.activity, F=SIM.R.faction, O=SIM.R.org, P=SIM.R.place, Ro=SIM.R.role;
    function need(ok, msg){ if(!ok) out.push(msg); }
    SIM.all('org').forEach(function(o){ need(!o.faction || F[o.faction], 'org '+o.id+': unknown faction '+o.faction); });
    SIM.all('relation').forEach(function(r){ need(F[r.a]||O[r.a], 'relation: unknown party '+r.a); need(F[r.b]||O[r.b], 'relation: unknown party '+r.b); });
    SIM.all('place').forEach(function(p){ Object.keys(p.activities||{}).forEach(function(a){ need(A[a], 'place '+p.id+': unknown activity '+a); }); need(!p.org || O[p.org], 'place '+p.id+': unknown org '+p.org); });
    SIM.all('role').forEach(function(r){ need(!r.org || O[r.org], 'role '+r.id+': unknown org '+r.org); (r.sched||[]).forEach(function(a,h){ need(A[a], 'role '+r.id+' at '+h+':00: unknown activity '+a); }); });
    SIM.all('actor').forEach(function(a){ need(Ro[a.role], 'actor '+a.id+': unknown role '+a.role); need(!a.home || P[a.home], 'actor '+a.id+': unknown home '+a.home); need(!a.work || P[a.work], 'actor '+a.id+': unknown work place '+a.work); });
    SIM.all('event').forEach(function(e){ (e.from||[]).concat(Array.isArray(e.to)?e.to:[]).forEach(function(p){ need(SIM.R.port[p], 'event '+e.id+': unknown port '+p); }); need(!e.to || Array.isArray(e.to) || e.to==='other', 'event '+e.id+': to must be a port list or "other"'); (e.legs||[]).forEach(function(l){ need(A[l.activity], 'event '+e.id+': unknown activity '+l.activity); }); });
    out.forEach(function(m){ SIM.err(m); });
    return out;
  };

  SIM.logEvent = function(kind, data){
    var e = { m:SIM.minute(), kind:kind }; if(data) for(var k in data) e[k]=data[k];
    SIM.LOG.push(e); if(SIM.LOG.length > SIM.LOG_MAX) SIM.LOG.splice(0, SIM.LOG.length-SIM.LOG_MAX);
    return e;
  };
  root.SIM = SIM;
})(typeof window!=='undefined'?window:globalThis);

// ==================== simulation/77-sim-1-world.js
// ================================================================= CORE — simulation 1: factions, organisations, relations, presence
// PLAN.md 4.3. A faction is a polity or a people (LORE.md section 6); an organisation belongs to one (a guild chapter,
// a watch, a household, a caravan company); a relation is DIRECTIONAL, a's stance toward b, and an org-level relation
// overrides its faction's. Presence says how a foreign faction stands in a settlement.
//
//   SIM.faction({id, name, parent?, culture?, colours?, sign?})
//   SIM.org({id, name, faction, kind?, resident?:bool, hostile?})
//   SIM.relation({a, b, stance:'allied'|'friendly'|'cordial'|'neutral'|'wary'|'hostile', trade?, travel?, settle?, trust?})
//   SIM.presence({id, faction, settlement, status:'NONE'|'VISITING'|'TRADING'|'RESIDENT'|'ESTABLISHED'|'PERSECUTED'|'EXPELLED'})
//   SIM.stance(a, b)              a's stance toward b (org ids or faction ids), falling back org -> faction -> 'neutral'
//   SIM.welcome(actorOrOrg, place) true when the place lets them in: place.access 'public' (default) | 'org' (its own
//                                 org only) | 'friendly' (orgs whose stance from the place's org is friendly or better)
(function(root){
  'use strict';
  var SIM = root.SIM;
  var RANK = { hostile:0, wary:1, neutral:2, cordial:3, friendly:4, allied:5 };
  SIM.STANCES = Object.keys(RANK);
  SIM.faction = function(o){ return SIM.add('faction', o); };
  SIM.org = function(o){ if(o.resident==null) o.resident=true; return SIM.add('org', o); };
  SIM.relation = function(o){ if(RANK[o.stance]==null) throw new Error('SIM.relation: unknown stance '+o.stance);
    if(o.id==null) o.id = o.a+'>'+o.b; return SIM.add('relation', o); };
  SIM.presence = function(o){ if(o.id==null) o.id = o.faction+'@'+o.settlement; return SIM.add('presence', o); };
  function factionOf(x){ var O=SIM.R.org[x]; return O ? O.faction : x; }
  function rel(a,b){ var R=SIM.R.relation[a+'>'+b]; return R ? R.stance : null; }
  SIM.stance = function(a, b){
    if(a===b) return 'allied';
    var fa=factionOf(a), fb=factionOf(b);
    if(fa===fb) return 'allied';
    return rel(a,b) || rel(a,fb) || rel(fa,b) || rel(fa,fb) || 'neutral';
  };
  SIM.rank = function(stance){ return RANK[stance]; };
  SIM.welcome = function(who, place){
    var org = typeof who==='string' ? who : who.org, acc = place.access || 'public';
    if(acc==='public') return SIM.rank(SIM.stance(place.org||place.faction||org, org)) >= RANK.wary;
    if(acc==='org') return org===place.org;
    if(acc==='friendly') return org===place.org || SIM.rank(SIM.stance(place.org, org)) >= RANK.friendly;
    return false;
  };
})(typeof window!=='undefined'?window:globalThis);

// ==================== simulation/77-sim-2-places.js
// ================================================================= CORE — simulation 2: places, activities, slots
// A PLACE advertises the activities it offers and how many people each can hold at once (its SLOTS), never a
// coordinate a population is told to walk to. Derived from placed geometry by the build (a house's beds, a shop's
// counter, a dock's net frames), then overridden by the hand-edited JSON.
//
//   SIM.activity({id, indoor?:bool, group?:bool, note?})          the vocabulary (ROADMAP section 26 plus a build's own)
//   SIM.place({id, name, kind, x, z, y?, ry?, door?:{x,z,y?}, layer?:'pedestrian', activities:{ACT:slots},
//              hours?:{ACT:[open,close]}, open?:[h0,h1], indoor?:{ACT:true}|true, org?, faction?, access?, tags?,
//              spots?:[[x,z,y?],...] (where people stand: tables, stalls, the counter), r?:metres (an open place's reach),
//              cap?:n (people present at once over ALL its activities, Shade's quarters: a bed and a seat at the hearth
//              are one person's room. Without it each activity's slots stand alone)})
//   SIM.offers(P, act) -> slots (0 if not offered)            SIM.isOpen(P, act, hour)
//   SIM.free(P, act) -> slots left (within cap)               SIM.reserve(actor, P, act) / SIM.release(actor)
//   SIM.placesFor(act, actor, hour, {near:[x,z], kinds:[...], ids:[...]}) -> candidates, nearest first, open, free and
//                                 letting the actor in (SIM.welcome)
//   SIM.slotsFromFurniture(pieces) -> {ACT: n}: a placed piece's job / type / role read as activity slots (PLAN 4.3)
(function(root){
  'use strict';
  var SIM = root.SIM;
  SIM.activity = function(o){ if(typeof o==='string') o={ id:o }; return SIM.add('activity', o); };
  SIM.place = function(o){
    if(o.x==null || o.z==null) throw new Error('SIM.place '+o.id+': needs x, z');

// Shade's audits, lifted (PLAN.md Phase 1): every activity a schedule asks for is offered somewhere; for each hour, the
// residents who want each activity fit the slots that offer it; every place is reachable on its layer from the host's
// reference point; plus the live census (who is doing what, how many moving, how many indoors).

//   SIM.REF = {layer, x, z, ports?}  the host's reference point for reachability (its market, its hub); ports:true also
//                                  routes to every port on its layer ('port:<id>' in unroutable when it cannot)
//   SIM.audit() -> {people, places, roles, transients, unknownActivities, capacity:[{hour, activity, want, slots, short}], unroutable, routeFail}
//                                  capacity fills each hour's wants into the open slots, the activity fewest places offer
//                                  first (Shade's order), a place's `cap` shared by all its activities; without caps that
//                                  is want > slots. SOCIALIZE, REST, IDLE fill last and are not reported (they fall back),
//                                  so a tie never lets them take a quarter's room before a meal or a bed
//   SIM.audits.push(fn(out))       a build's own checks (Shade's only way up, its convoy, its commutes) add their fields to
//                                  the same report

    SIM.all('role').forEach(function(R){ var seen={}; (R.sched||[]).forEach(function(a){ if(seen[a]) return; seen[a]=1;
      if(!A[a]) out.unknownActivities.push(R.id+':'+a+' (no such activity)');

      acts.slice().sort(function(a,b){ return fb(a)-fb(b) || open[a].length-open[b].length || (a<b?-1:1); }).forEach(function(k){ var need=want[k];
        open[k].forEach(function(P){ if(need<=0) return; var t=Math.min(need, P.activities[k], P.cap!=null ? room[P.id] : Infinity); if(P.cap!=null) room[P.id]-=t; need-=t; });
