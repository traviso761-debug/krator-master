   #include), and the hooks collided (one replaced the anchor another needed: the snow never reached a leaf card), recursed

     (the material's own customProgramCacheKey, else its hook's source) + '|' + o.key (default: the name; a spec's default adds
     a hash of its text). A function layer whose closure varies with the same source MUST pass o.key. Sets needsUpdate.
   spec: {uniforms: {} | fn(sh, r) -> {}, vertex: {head, at: [inject...]}, fragment: {...}, eye: bool, skipIf: RegExp | fn(sh),

     literal; e.after / e.before / e.replace the text (after: anchor + '\n' + text; before: text + '\n' + anchor). e.fallback (a
     chunk name, or {at, after | before | replace}) is used when e.at is missing; with neither found it throws (e.optional: unchanged).

     {key, run(shader, renderer)}, run after every layer, and the key joins the program key. run edits inside <project_vertex>,

// ==================== shader/06b-core-kcolor.js
/* core/shader/06b-core-kcolor.js — KCOLOR: colour space and exposure in one place (CORE-IMPROVEMENTS.md item 9a; README.md here).
   three r128 converts nothing for you. A colour written as a display hex ('#a8382a', 0xa8382a, [r, g, b] in 0..1 as a colour
   picker shows it) is sRGB; three's lights, fog, material colours and a shader's arithmetic are LINEAR. A display hex used as
   linear reads pale (k-guilin's near-white Lambert, eastabyss's white plume halo); a texture sampled raw in a hook reads pale
   (Farside's wrack). KCOLOR says which is which once.

   THE CONVENTION: a number, a '#hex' string, an [r, g, b] array or {r, g, b} is DISPLAY (sRGB) unless o.linear says otherwise;
   a THREE.Color (isColor) is already LINEAR (three's working space). Pure functions (no three.js, no DOM) except lin's out.
     KCOLOR.toLin(c) / KCOLOR.toSRGB(c)     one channel (0..1), the exact sRGB curve (three's SRGBToLinear / LinearToSRGB)
     KCOLOR.rgb(x) -> [r, g, b]              the channels as written, no conversion
     KCOLOR.linArr(x, o) -> [r, g, b]         linear; o.linear: x is linear already
     KCOLOR.lin(x, out, o) -> out             linear into a THREE.Color (out, or a new one from THREE): `KCOLOR.lin('#a8382a')`
     KCOLOR.mix(a, b, t, o) -> [r, g, b]      mixed in LINEAR light (a tint field's blend), linear out
     KCOLOR.hex(lin) -> 0xrrggbb               a linear colour back to a display hex
     KCOLOR.lum(lin) -> Y                      relative luminance (Rec. 709) of a linear colour
     KCOLOR.vec3(x, o) -> 'vec3(r,g,b)'        a GLSL literal, linear (KHOOK.glf's numbers when the page has KHOOK)
   GLSL (KCOLOR.GLSL, guarded, any stage): vec3 srgbToLinear(vec3), vec3 linearToSrgb(vec3), vec4 sampleSRGB(sampler2D, vec2)
     (a colour texture read in a hook), vec3 gamma22ToLinear(vec3) (the pow(c, 2.2) many pages were tuned with: same look,
     named). KCOLOR.include(sh) puts it at the head of both stages once.
   The renderer: KCOLOR.output(renderer, {exposure, tone}) sets sRGB output and the tone mapping (ACES unless tone says
   'linear' | 'reinhard' | 'cineon' | 'none'); KCOLOR.exposure(renderer, e) (the shared sky's hourly exposure);

// ==================== rand/08-core-rand.js
// ================================================================= CORE — rand: one generator, one hash, one noise
// GODOT-PLAN.md Phase 2, item 1. Every number here is reproducible bit for bit in GDScript (krand.gd beside this
// file) because nothing in it calls Math.sin, Math.pow or any other library function whose last bits differ by
// engine: the stream and the hash are 32-bit integer arithmetic, and the noise is +, -, *, / and floor on doubles,
// in a fixed order. golden.json holds the vectors both engines are tested against (test-rand.js, test_rand.py).
//
//   KRAND.stream(seed)             a mulberry32 stream: the SAME numbers as the rng()/reseed() every Krator lineage
//                                  already uses (kits/ancients 10-core.js, core/biome 10-core-head.js), so a build
//                                  that moves its draws onto a stream moves no rubble
//     s.next()  [0,1)   s.u32()  integer   s.range(a,b)   s.int(a,b) inclusive   s.pick(arr)   s.chance(p)
//     s.state() / s.setState(u32)          for saving and resuming a stream
//   KRAND.hash(seed, a, b, c...)   u32 from a seed and any number of int32 values (floats are floored first)
//   KRAND.unit(u32)                [0,1)
//   KRAND.h3(x,y,z, seed)          [0,1) at an integer lattice point: the portable replacement for the lineages'
//                                  sin-based h3 (which a GDScript port cannot reproduce). Floats are floored.
//   KRAND.vnoise(x,y,z, seed)      value noise in [0,1]: the lineages' vnoise (smoothstep trilinear) on h3 above
//   KRAND.fbm(x,y,z, octaves, seed)  the lineages' fbm (octaves default 3, frequency x2.03, amplitude 1/f)
//   KRAND.cell(seed, ix, iz)       a seed for one placement cell, so a tile built alone draws what it draws in a
//                                  full build (biomes/WORLD.md: placement seeded by cell)
//   KRAND.child(seed, name)        a seed for a named sub-stream ('trees', 'rubble'...), no collisions to manage
//
// Ranges: lattice coordinates and hash inputs are int32 (|x| < 2^31). Seeds are taken as u32 (seed>>>0).
// The noise of a NEW seed is not the old sin-based noise: moving a build's terrain or textures onto it moves them
// (GODOT-PLAN.md section 7, "Moving rubble": one build at a time, with a screenshot set).

// page: it owns the world clock (core/clock's KCLOCK, which the build lists before this file), steps it with the frame's

//     o.ground                        terrainH(x,z), or a KFIELD (its .h): the camera's floor, the pin, the walker
//     o.pick(ray) -> [x, y, z] | null the build's own pick for the pin, tried before the ground (Voth: inside a canton)
//     o.click(cx, cy) -> true         the build takes the click itself (the inspector is not asked)
//     o.floor, o.clear, o.clampCam    what the eye may not go under (default ground), the clearance (1.8 m), or a clamp
//     o.registry                      the build's registered volumes [{name, x, y?, z, r, h}] (inspector, probe)
//     o.views {name: [cx,cy,cz,tx,ty,tz] or () => that}, o.onView(name), o.start   the presets (verify.py clicks
//                                   '#ui button'); a function is called when its preset is chosen (a subject that moves)

//   KHOST.off(fn)

//

// ==================== walk/frame/95-walk-frame-host.js
// ================================================================= CORE WALK FRAME — host: the walker carried by the floor under it
// [web] core/walk/frame/95-walk-frame-host.js (core/simulation/PLAN-RIDING.md section 6). Opt-in: a page that has KWALKFRAME
// frames lists it after core/host's shell and calls KHOST.ride once it has taken the host, so no other page changes. It
// lives with the frames, as a module's own host fragments do (core/city's 5x-city-host-*), not in core/host: every build
// that imports core/host/host.py records core/host's listing, so a file added there marks ~90 builds stale.
//
//   KHOST.ride(H, {walk: W, t: () => motion seconds, seats?: F => [{at:[x,y,z], yaw}], sitKey:'e', reach:1.6}) -> R
//        each frame, after the keys and before the walker stands: the world registry's clock is set to t (KWALKFRAME.at),
//        and a walker standing on a frame floor is carried by the frame's motion since the last frame (KWALKFRAME.carry):
//        its feet and the camera's target moved, the view turned by the frame's turn, so the follow view stays in the
//        car's frame. Boarding is walking through an open door; E by a seat (seats(F), in the frame's coordinates) sits
//        the walker there, held in the frame; E again stands it in the aisle beside the seat.
//   R.state() -> {aboard: frame id | null, sitting: seat index | null, local: [x,y,z] | null}   (window._api.ride too)
(function(root){
'use strict';
const K=root.KHOST=root.KHOST||{};
K.ride=function(H,o){
 const W=o.walk,T=o.t,KF=root.KWALKFRAME;if(!W||!T||!KF)throw new Error('KHOST.ride: walk (a KWALK registry), t and KWALKFRAME are required');
 const C=H.cam,ctl=H.ctl,key=(o.sitKey||'e').toLowerCase(),reach=o.reach==null?1.6:o.reach;
 let last=null,sit=null,aboard=null;
 const feet=()=>C.walkAt?[C.walkAt[0],C.walkAt[2],C.walkAt[1]]:[ctl.target.x,ctl.target.y-ctl.eye,ctl.target.z];
 function place(p){const d=[p[0]-feet()[0],p[1]-feet()[1],p[2]-feet()[2]];ctl.target.x+=d[0];ctl.target.y+=d[1];ctl.target.z+=d[2];C.walkAt=[p[0],p[2],p[1]];}
 H.on(function rideCarry(){
  const t=T();
  if(ctl.walk&&last!=null&&t!==last){
   if(sit){const F=sit.F,w=KF.toWorld(F,sit.at,t);ctl.theta+=KF.pose(F,t).yaw-KF.pose(F,last).yaw;place(w);aboard=F;}
   else{const c=KF.carry(W,feet(),last,t);aboard=c.frame;if(c.frame){place(c.p);ctl.theta+=c.dyaw;}}}
  else if(!ctl.walk){sit=null;aboard=null;}
  KF.at(W,t);last=t;},'tick');
 root.addEventListener('keydown',function(e){
  if(!ctl.walk||e.key.toLowerCase()!==key||e.target&&/input|textarea|select/i.test(e.target.tagName))return;
  const t=T();
  if(sit){const F=sit.F,s=sit.at,aisle=[s[0]>0?s[0]-0.6:s[0]+0.6,s[1],s[2]];place(KF.toWorld(F,aisle,t));sit=null;return;}
  const st=KF.standing(W,feet(),t);if(!st||!o.seats)return;
  const F=st.frame,l=KF.toLocal(F,feet(),t);let best=null,bd=reach;
  (o.seats(F)||[]).forEach((S,i)=>{const d=Math.hypot(S.at[0]-l[0],S.at[2]-l[2]);if(d<bd){bd=d;best={i,at:S.at.slice(),yaw:S.yaw||0};}});
  if(!best)return;sit={F,i:best.i,at:best.at};place(KF.toWorld(F,best.at,t));
  ctl.theta=KF.pose(F,t).yaw+best.yaw+Math.PI;});

 root._api=root._api||{};root._api.ride=R.state;
 return R;};
})(typeof window!=='undefined'?window:globalThis);

// ==================== simulation/ride/lab/98-ride-lab-take.js
// ================================================================= RIDE LAB — the take: core/host, the rider, the checks' API
// [web] The page on core/host's shell with the opt-in ride host fragment (core/walk/frame/95-walk-frame-host.js): walk (F), walk through an
// open car door, ride; E by a seat sits, E again stands. The views look at the Line, Ledge's station, the gap and Twenny;
// "Walk at Ledge" stands the walker on Ledge's platform. window._api.lab is what verify.py drives.
var RLRIDE=null;
const LABH=KHOST.take({
 build:'ride-lab',title:'Ride lab',hint:'riding on core/walk/frame and core/simulation/ride: F walks; walk through an open door to board; E sits',
 scene,camera,renderer,ground:labGround,walk:KWALK,clear:1.2,maxR:3000,minR:2,
 views:{'The Line':[1050,520,520,1050,0,0],'Ledge station':[60,16,-46,60,1.5,0],'The gap':[1000,150,-230,1010,0,-30],'Twenny':[1980,16,-46,1980,1.5,0]},
 clock:{obj:LABCLOCK,speeds:[0,1,2,4,8,16]},
 registry:Object.keys(RL.L.stops).map(id=>{const s=RL.L.stops[id];return {name:s.name,x:s.x,y:1.1,z:-4,r:36,h:6};}),
 controls:[{button:'Walk at Ledge',on:()=>RLAPI.standAt(RL.L.stops.ledge.x-4,1.1,-3.6,Math.PI)}],
 stats:()=>{const t=LABCLOCK.t,rep=SIM.tradeReport(),A=SIM.rideAudit(),aboard=Object.keys(SIM.RIDE.riders).length,R=RLRIDE?RLRIDE.state():{aboard:null};
  const tr=RL.L.sources.map(S=>{const d=SIM.rideDwellAt(S.id,t);return S.id+': '+(d?'at '+d.stop+(d.open?' (doors open)':''):'running');}).join('\n');
  const goods=Object.keys(rep).map(id=>id+': '+rep[id].carriers.map(C=>C.phase+(C.cargo.length?' '+C.cargo.map(c=>c.good+' '+c.n).join(', '):'')).join('; ')).join('\n');
  return tr+'\n'+goods+'\ntravellers on journeys: '+aboard+', journeys '+RL.journeys+(RL.failed?' ('+RL.failed+' waited)':'')+'\ndoor windows kept: '+(A.ok?'yes':'NO')+'\nyou: '+(R.aboard?'aboard '+R.aboard+(R.sitting!=null?', seated':''):'on foot');},
 legend:[['#e0b050','a traveller'],['#b4552e','a porter (a crate: carrying)']],
});
RLRIDE=KHOST.ride(LABH,{walk:KWALK,t:()=>LABCLOCK.t,seats:()=>RIDELAB.CAR.seats});
LABH.on(function rideLab(dt,clock){RL.tick(clock.t);},'tick');
LABH.on(function rideLabDraw(dt,clock){labDraw(clock.t,dt,camera.position);},'view');
/* the verify's handles: everything it asks is read from SIM and the walk registry, never kept apart */
const RLAPI={
 standAt(x,y,z,theta){const C=LABH.cam;if(!LABH.ctl.walk)C.walk(true,true);C.walkAt=[x,z,y];LABH.ctl.target.set(x,y+LABH.ctl.eye,z);if(theta!=null)LABH.ctl.theta=theta;},
 feet(){const w=LABH.cam.walkAt;return w?[w[0],w[2],w[1]]:null;},
 /* the next dwell of a train at a stop after t: its door window */
 nextDwell(src,stop,after){for(let g=0;g<4000;g++){const d=SIM.rideDwell(src,g);if(d.stop===stop&&d.o0>after)return d;}return null;},
 doorWorld(src,k,doorId,t){const D=RIDELAB.CAR.doors.find(d=>d.id===doorId);return SIM.rideToWorld(SIM.rideCarPose(src,k,t),D.at);},
 setT(t){LABCLOCK.t=t;},clock(){return {t:LABCLOCK.t,hour:LABCLOCK.hour,day:LABCLOCK.day,scale:LABCLOCK.scale};},scale(s){LABCLOCK.scale=s;},
 run(min){RL.run(min);},
 ride:()=>RLRIDE.state(),
 audit:()=>{const A=SIM.rideAudit();return {ok:A.ok,boards:A.boards,alights:A.alights,outside:A.outside.length,over:A.over.length,journeys:RL.journeys,failed:RL.failed};},
 /* every rider in a frame leg now stands on its own car's floor (the walk side, posed by the same function) */
 onFloors(lift){const t=LABCLOCK.t;let n=0,miss=0,worst=0;KWALKFRAME.at(KWALK,t);
  RL.people.forEach(a=>{const p=SIM.pose(a,t);if(!p.frame)return;n++;const f=KWALK.floorBelow(p.x,p.z,p.y+(lift||0),0.6),fr=RL.L.frames.find(q=>q.src===p.frame.source&&q.k===p.frame.k).F;
   if(!f||f[1].frame!==fr)miss++;else worst=Math.max(worst,Math.abs(f[0]-p.y-(lift||0)));});return {n,miss,worst};},
 cargo(){const led=SIM.ledger(RL.snap0,SIM.ledgerSnap()),r=id=>SIM.TRADE.routes[id].landed;
  return {ledger:led.ok,problems:led.problems.slice(0,3),twennyGrain:SIM.econ('twenny').imported.grain||0,ledgeWax:SIM.econ('ledge').imported.wax||0,
   north:(r('rail.n')['ledge>gapn']||{}).grain||0,porters:(r('gap.porters')['gapn>gaps']||{}).grain||0,south:(r('rail.s')['gaps>twenny']||{}).grain||0,trips:RL.L.porters.trips};},
 porters(){const C=SIM.TRADE.routes['gap.porters'].carriers[0],a=SIM.R.actor[RL.L.porters.crew[0]],p=SIM.pose(a,LABCLOCK.t+0.5);return {phase:C.phase,moving:p.moving};},

};
window._api=window._api||{};window._api.lab=RLAPI;
