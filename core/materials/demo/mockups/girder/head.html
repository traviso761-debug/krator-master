<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Girder Material Mockup</title>
<style>
:root{--panel:#1d2420;--ink:#eaf0e4;--dim:#9fb0a0;--line:#37443b;--acc:#c8a050}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#b7c4ae;color:var(--ink);font:13px -apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}canvas.d{cursor:grabbing}
#bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-bottom:1px solid var(--line);z-index:3}
#bar b{font-size:14px}button{font:inherit;color:var(--ink);background:#2a352e;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}button:hover{border-color:var(--dim)}button.on{background:var(--ink);color:var(--panel)}
#notes{position:fixed;right:10px;bottom:10px;width:min(360px,calc(100vw - 20px));max-height:55vh;overflow:auto;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 12px;z-index:3;display:none;font-size:12px;line-height:1.4}
#notes h4{margin:6px 0 2px;font-size:12px;color:var(--acc)}#notes ul{margin:0;padding-left:16px}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:12px 20px;border-radius:8px;z-index:9}
</style></head><body>
<canvas id=c></canvas><div id=bar></div><div id=notes></div><div id=load>Loading textures…</div>
