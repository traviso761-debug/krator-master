<script>

// ==================== 10-core-head.js
// ================================================================= BIOME CORE — head
// The engine-independent kit every Krator biome fragment is written against.
// Nothing below names a world's kit. The host hands in what a biome needs
// through BIO.init(...) (see BIOME-API.md) and everything else lives here.
var BIO={host:null,stats:{},cur:null,version:'core-1'};
// EVERYTHING BELOW IS LOCAL. The core declares no generic global (rng, clamp,
// TAU...): a world that already has those would be clobbered. Biome fragments
// pull what they need from BIO.fn at the top of their own closure.
(function(){
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, mix=lerp;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---------------------------------------------------------------- PRNG
// The biome's OWN stream. A host that adds a biome must not see its rubble
// move, so the biome never draws from the host's generator.
let _bseed=1234567;
function reseed(s){_bseed=s>>>0;}
function rng(){_bseed|=0;_bseed=_bseed+0x6D2B79F5|0;let t=Math.imul(_bseed^_bseed>>>15,1|_bseed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rng();}
function ri(a,b){return a+Math.floor(rng()*(b-a+1));}
function pick(arr){return arr[Math.floor(rng()*arr.length)%arr.length];}

// ---------------------------------------------------------------- noise
function h3(x,y,z){const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);}
// Each h3 is a Math.sin, and sampling a terrain or a texture asks for the same lattice cells again and again: a
// cell's eight corners are kept in a small direct-mapped cache (exact: the same h3 values, the same arithmetic in
// the same order, so the same results bit for bit). It was most of every biome's load.
var _vnK,_vnV;
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
 if(_vnK===undefined){_vnK=new Float64Array(4096*3).fill(NaN);_vnV=new Float64Array(4096*8);}
 const s=(Math.imul(xi|0,73856093)^Math.imul(yi|0,19349663)^Math.imul(zi|0,83492791))&4095,k=s*3,o=s*8,V=_vnV;
 if(_vnK[k]!==xi||_vnK[k+1]!==yi||_vnK[k+2]!==zi){_vnK[k]=xi;_vnK[k+1]=yi;_vnK[k+2]=zi;
  V[o]=h3(xi,yi,zi);V[o+1]=h3(xi+1,yi,zi);V[o+2]=h3(xi,yi+1,zi);V[o+3]=h3(xi+1,yi+1,zi);
  V[o+4]=h3(xi,yi,zi+1);V[o+5]=h3(xi+1,yi,zi+1);V[o+6]=h3(xi,yi+1,zi+1);V[o+7]=h3(xi+1,yi+1,zi+1);}
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const a=V[o]+(V[o+1]-V[o])*u,b=V[o+2]+(V[o+3]-V[o+2])*u,c=V[o+4]+(V[o+5]-V[o+4])*u,d=V[o+6]+(V[o+7]-V[o+6])*u;
 const e=a+(b-a)*v,f=c+(d-c)*v;return e+(f-e)*w;}
function fbm(x,y,z,o){o=o||3;let a=0,f=1,s=0;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f)/f;s+=1/f;f*=2.03;}return a/s;}

// ---------------------------------------------------------------- host binding
// host = { THREE, scene, terrainH(x,z), mask(x,z), obstacles[], ticks(fn), seed,
//          origin[x,z] | [[x,z]...], center, fields{}, waterH(x,z), register(o),
//          lod{}, windows{}, eye(), err(msg), stat(key,tris,inst) }   (BIOME-API.md)
BIO.init=function(h){
 if(!h||!h.THREE)throw new Error('BIO.init: host needs THREE');
 // scene may arrive later (a world that creates its scene after its kit loads
 // calls BIO.setScene before build); it is only needed at bake
 BIO.host={
  THREE:h.THREE,scene:h.scene||null,
  terrainH:h.terrainH||((x,z)=>0),
  // the default mask: everything may root, or, when the host hands in its water
  // (sedesert-1), nothing roots under the local water surface. A world with
  // footprints or its own rule passes its own.
  mask:h.mask||(h.waterH?((x,z)=>{const d=BIO.terrainH(x,z)-BIO.waterH(x,z);return d<.15?0:d<.7?(d-.15)/.55:1;}):((x,z)=>1)),
  obstacles:h.obstacles||[],
  ticks:h.ticks||(fn=>{}),
  seed:h.seed==null?1:h.seed,
  // origin: [x,z] or a LIST of [x,z] -- the LOD curve is measured from the
  // nearest one, so a long showcase (a lake shore, a river) can keep detail
  // along a spine instead of round one point. center: the disc the grids
  // cover (default: the first origin).
  origin:(h.origin&&typeof h.origin[0]==='number')?[h.origin]:(h.origin||[[0,0]]),
  center:h.center||null,
  // fields: optional climate fields a multi-zone biome asks for, each
  // (x,z)->0..1. Missing ones fall back to BIO.fieldDefault. wet: 0 arid ..
  // 1 saturated; salt: 0 .. 1 crust; upland: 0 basin floor .. 1 the high edge;
  // flow: 0 still .. 1 a bank; mist: 0 .. 1 the cloud-forest band.
  fields:h.fields||{},
  // waterH(x,z) (sedesert-1, additive): the LOCAL water surface. The earlier kits keep
  // their water at y=0 (the default); a stream that descends, or a tarn in a hollow,
  // hands its own level in, and a biome reads depth as BIO.depth = waterH - terrainH.
  // Where there is no water at all the host returns -1e9.
  waterH:h.waterH||((x,z)=>0),
  // register(o) (sedesert-1, additive): a volume the world's inspector and probe can name
  // ({name,key,x,z,y,r,h}); a world without an inspector leaves it out
  register:h.register||(o=>{}),
  // lod (sedesert-1): the detail radii from the spine, a property of the world's spine, not of
  // a species pass: hero (full detail), mid, far (impostors stop), floor bands. BIO.radii().
  lod:Object.assign({hero:800,mid:1500,far:2200,floor:[500,1250]},h.lod||{}),
  // windows (sedesert-1): named rectangles [x0,z0,x1,z1] a biome may ask for (BIO.window('water')):
  // where the world's water is, so a water-bound pass looks nowhere else
  windows:h.windows||{},
  // eye (swbay-1): optional ()->[x,y,z], where the viewer is right now. Only a pass that
  // animates (fauna) reads it, to leave what is far alone; null means no LOD.
  eye:h.eye||null,
  // clock / wind (one world, one wind: biomes/WORLD.md): clock()->seconds drives the foliage's sway
  // instead of the core's own clock; wind()->[x,z] (1 = the calm breeze) bends it downwind. A world
  // with core/atmos binds clock:()=>ATMOS.clock.t and wind:()=>the base wind over its calm length.
  clock:h.clock||null,wind:h.wind||null,
  err:h.err||(m=>console.error(m)),
  stat:h.stat||null};
 reseed(BIO.host.seed*7919+11);
 return BIO;};
BIO.setScene=function(s){BIO.host.scene=s;};
BIO.err=function(m){if(BIO.host)BIO.host.err(m);else console.error(m);};
BIO.terrainH=function(x,z){return BIO.host?BIO.host.terrainH(x,z):0;};
BIO.mask=function(x,z){return BIO.host?BIO.host.mask(x,z):1;};
BIO.waterH=function(x,z){return BIO.host?BIO.host.waterH(x,z):0;};
// depth of the ground under the local water surface (negative: above it)
BIO.depth=function(x,z){return BIO.waterH(x,z)-BIO.terrainH(x,z);};
BIO.register=function(o){if(BIO.host)BIO.host.register(o);};
// the detail radii (sedesert-1, where it was BIO.LOD(); BIO.LOD is the runtime LOD's settings)
BIO.radii=function(){return BIO.host?BIO.host.lod:{hero:800,mid:1500,far:2200,floor:[500,1250]};};
BIO.window=function(n){return (BIO.host&&BIO.host.windows[n])||null;};
BIO.eye=function(){return BIO.host&&BIO.host.eye?BIO.host.eye():null;};
// the bounding box of the LOD spine, padded: every point within `pad` of an origin lies inside it
BIO.originBox=function(pad){const O=BIO.host?BIO.host.origin:[[0,0]];let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;for(const o of O){x0=Math.min(x0,o[0]);z0=Math.min(z0,o[1]);x1=Math.max(x1,o[0]);z1=Math.max(z1,o[1]);}return[x0-pad,z0-pad,x1+pad,z1+pad];};
// distance from the LOD origin, for the detail curve
BIO.lodD=function(x,z){const O=BIO.host?BIO.host.origin:[[0,0]];let m=1e9;for(let i=0;i<O.length;i++){const d=Math.hypot(x-O[i][0],z-O[i][1]);if(d<m)m=d;}return m;};
BIO.center=function(){const h=BIO.host;return h?(h.center||h.origin[0]):[0,0];};
// flow and mist are additive (rift-1): a river bank, and the cloud-forest band a ridge wears on its wet face.
// cold and rock are additive (nhighlands-1): 0 temperate .. 1 boreal (altitude and aspect: the boreal band
// comes down lower on the north-facing slopes), and 0 soil .. 1 boulder ground and crag. An older biome
// never reads them; a host that never heard of them gets 0 for both.
BIO.fieldDefault={wet:(x,z)=>BIO.terrainH(x,z)<2?1:.6,salt:(x,z)=>0,upland:(x,z)=>0,flow:(x,z)=>0,mist:(x,z)=>0,cold:(x,z)=>0,rock:(x,z)=>0};
// a field a world does not bind is 0, except the ones with a meaningful default (sedesert-1)
const ZEROF=(x,z)=>0;
BIO.field=function(n,x,z){const f=BIO.host&&BIO.host.fields[n];return f?f(x,z):(BIO.fieldDefault[n]||ZEROF)(x,z);};
BIO.hasField=function(n){return !!(BIO.host&&BIO.host.fields[n]);};
// LOD is a CURVE, not two steps: full detail under ~700 m, a quarter by 3 km.
BIO.lod=function(x,z){return clamp(1.18-BIO.lodD(x,z)/2600,.22,1);};

// ---------------------------------------------------------------- accounting
// Every instance and merged triangle is charged to BIO.cur ('jungle/hyper',
// 'jungle/floor'...), so a probe can assert per-pass budgets.
BIO.tally=function(tris,inst,meshes){const k=BIO.cur||'biome';
 const t=BIO.stats[k]||(BIO.stats[k]={tris:0,inst:0,meshes:0});
 t.tris+=tris||0;t.inst+=inst||0;t.meshes+=meshes||0;
 if(BIO.host&&BIO.host.stat)BIO.host.stat(k,tris||0,inst||0);};
BIO.totals=function(){let tris=0,inst=0,meshes=0;for(const k in BIO.stats){tris+=BIO.stats[k].tris;inst+=BIO.stats[k].inst;meshes+=BIO.stats[k].meshes;}return{tris,inst,meshes};};

BIO.fn={TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm};
})();

// ==================== 20-core-kit.js
// ================================================================= BIOME CORE — kit
// Two ways to put geometry in the world, both cheap:
//   INSTANCED ITEMS   BIO.def(name,geo,mat) once, BIO.put(name,...) thousands of
//                     times, one InstancedMesh per item at bake. Per-instance
//                     colour, and optional per-instance extras (aN normal, aC2
//                     second colour) for the foliage shaders, or any other
//                     named vec4 (aP0, aP1...) for the animation shaders.
//   MERGED BUCKET     BIO.tri/quad/tube/lathe/surf write vertex-coloured
//                     triangles into a bucket per material family; one Mesh per
//                     family at bake. Boles, limbs, logs, boulders go here.
// Both are charged to BIO.cur by the accounting in 10-core-head.js.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm}=BIO.fn;
// ---------------------------------------------------------------- kits (namespaces)
// Several kits can share one page (biomes/WORLD.md), and two kits may both call an item
// 'trunk' or a bucket 'bark0'. Each kit has its own REGISTRY of item definitions, their
// instances and its buckets: BIO.kit(name) makes `name` current, so BIO.defs, BIO.items,
// BIO.order and BIO.buckets point at its registry and BIO.kitName names it (material
// cache keys carry it). It returns the kit that was current. A kit calls it at the top of
// its first fragment and BIO.kitEnd(api) at the end of its last (after 75, if it has fauna): that wraps every function on its
// export object (build, dress...) to run in its registry, and restores the default kit.
// A page that never calls it works in the default kit '' exactly as before.
BIO.kits={};BIO.kitName=null;
BIO.kit=function(name){name=name||'';const prev=BIO.kitName;if(name===prev)return prev;let R=BIO.kits[name];
 if(!R)R=BIO.kits[name]={defs:{},items:{},order:[],buckets:{}};
 BIO.defs=R.defs;BIO.items=R.items;BIO.order=R.order;BIO.buckets=R.buckets;BIO.kitName=name;return prev;};
BIO.kitWrap=function(name,api){for(const k of Object.keys(api)){const f=api[k];if(typeof f!=='function'||f._kit!=null)continue;
  const w=function(){const prev=BIO.kit(name);try{return f.apply(this,arguments);}finally{BIO.kit(prev);}};w._kit=name;api[k]=w;}
 return api;};
BIO.kitEnd=function(api){const name=BIO.kitName;if(api)BIO.kitWrap(name,api);BIO.kit('');return api;};
// a material cache key in the current kit's name ('' adds nothing)
BIO.kitKey=function(k){return BIO.kitName?BIO.kitName+'|'+k:k;};
BIO.kit('');
// GROWABLE FLOAT32 STORES (nhighlands-1, internal): the items' matrices and colours and the buckets' vertices
// were plain arrays of doubles, eight bytes a float and a page crash at ~16M triangles on a 43 km^2 map. These
// keep four bytes a float and the same push() the builders already call; bake reads .a.
function F32(){this.a=new Float32Array(4096);this.length=0;}
F32.prototype.push=function(){const n=arguments.length;let a=this.a;if(this.length+n>a.length){const b=new Float32Array(Math.max(a.length*2,this.length+n));b.set(a);this.a=a=b;}
 for(let i=0;i<n;i++)a[this.length++]=arguments[i];return this.length;};
// sedesert's Store, merged (sedesert-1): the same store under its name, with its n and data()
Object.defineProperty(F32.prototype,'n',{get:function(){return this.length;}});
F32.prototype.data=function(){return this.a.slice(0,this.length);};   // a copy: the store can be dropped after bake
BIO.F32=F32;BIO.Store=F32;
// x: the extra named vec4 attributes an item asked for (hyperjungle-1: aP0, aP1 for 35-core-anim)
const newItem=attrs=>{const it={m:new F32(),c:new F32(),n:new F32(),c2:new F32(),x:{},k:[],count:0};
 if(attrs)attrs.forEach(a=>{if(a!=='aN'&&a!=='aC2')it.x[a]=new F32();});return it;};
BIO.def=function(name,geo,mat,opt){opt=opt||{};
 if(BIO.defs[name])BIO.err('BIO.def: '+name+' defined twice');
 const g=geo.index?geo.toNonIndexed():geo;
 BIO.defs[name]={geo:g,mat,tris:g.attributes.position.count/3,attrs:opt.attrs||null,label:opt.label||name};
 BIO.items[name]=newItem(opt.attrs);BIO.order.push(name);};
const _bm=new (function(){return {}})();   // scratch holder, filled after THREE binds
BIO._scratch=function(){const T=BIO.host.THREE;if(!_bm.m){_bm.m=new T.Matrix4();_bm.q=new T.Quaternion();_bm.e=new T.Euler();_bm.p=new T.Vector3();_bm.s=new T.Vector3();_bm.c=new T.Color();_bm.up=new T.Vector3(0,1,0);_bm.v=new T.Vector3();}return _bm;};
// rotation helpers: qEuler(rx,ry,rz) or qFacing([nx,ny,nz]) (local +z toward n)
function qEuler(rx,ry,rz){const S=BIO._scratch();S.e.set(rx||0,ry||0,rz||0,'YXZ');return new BIO.host.THREE.Quaternion().setFromEuler(S.e);}
function qFacing(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1),v);}
function qUp(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),v);}
// put(name, [x,y,z], quat|null, [sx,sy,sz]|s, colour(hex|Color|null), extra{n:[..], c2:hex})
BIO.put=function(name,pos,q,sc,col,extra){
 const it=BIO.items[name];if(!it){BIO.err('BIO.put: no item '+name);return;}
 if(!(isFinite(pos[0])&&isFinite(pos[1])&&isFinite(pos[2]))){BIO.err('BIO.put: NaN position for '+name);return;}
 const S=BIO._scratch();
 S.p.set(pos[0],pos[1],pos[2]);
 if(typeof sc==='number')S.s.set(sc,sc,sc);else S.s.set(sc[0],sc[1],sc[2]);
 S.m.compose(S.p,q||S.q.set(0,0,0,1),S.s);
 const e=S.m.elements;for(let i=0;i<16;i++)it.m.push(e[i]);
 if(col==null)it.c.push(1,1,1);
 else{if(col.isColor)S.c.copy(col);else S.c.set(col);S.c.convertSRGBToLinear();it.c.push(S.c.r,S.c.g,S.c.b);}
 const def=BIO.defs[name];
 if(def.attrs){
  if(def.attrs.indexOf('aN')>=0){const n=(extra&&extra.n)||[0,1,0];it.n.push(n[0],n[1],n[2]);}
  if(def.attrs.indexOf('aC2')>=0){const c2=extra&&extra.c2;if(c2==null)it.c2.push(S.c.r,S.c.g,S.c.b);else{if(c2.isColor)S.c.copy(c2);else S.c.set(c2);S.c.convertSRGBToLinear();it.c2.push(S.c.r,S.c.g,S.c.b);}}
  for(const a in it.x){const v=(extra&&extra[a])||[0,0,0,0];it.x[a].push(v[0]||0,v[1]||0,v[2]||0,v[3]||0);}}
 it.k.push(BIO._lodKey(pos[0],pos[2]));it.count++;BIO.tally(def.tris,1,0);};
// a beam of instanced item `name` (a unit cylinder along y, centred) from a to b
BIO.beam=function(name,a,b,r0,r1,col){const T=BIO.host.THREE,S=BIO._scratch();
 const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2],L=Math.hypot(dx,dy,dz);if(L<1e-4)return;
 S.v.set(dx/L,dy/L,dz/L);const q=new T.Quaternion().setFromUnitVectors(S.up,S.v);
 BIO.put(name,[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],q,[r0*2,L,(r1==null?r0:r1)*2],col);};

// ---------------------------------------------------------------- merged buckets
BIO.bucket=function(fam,mat,opt){opt=opt||{};
 if(!BIO.buckets[fam])BIO.buckets[fam]={mat,pos:new F32(),nor:new F32(),uv:new F32(),col:new F32(),k:[],tris:0,label:opt.label||fam,uvScale:opt.uvScale||[3,3]};
 return BIO.buckets[fam];};
const _lc={r:1,g:1,b:1};
// COLOURS ARE sRGB IN, LINEAR OUT. r128 sends instance and vertex colours to
// the shader untouched, and the renderer encodes its output to sRGB, so a raw
// hex would render a stop too bright. Everything passed here is a designer's
// sRGB colour (hex, Color, or [r,g,b] already linear) and is converted once.
function _col3(c){const S=BIO._scratch();if(c==null)return[1,1,1];if(Array.isArray(c))return c;
 if(c.isColor)S.c.copy(c);else S.c.set(c);S.c.convertSRGBToLinear();return[S.c.r,S.c.g,S.c.b];}
// one triangle, flat normal unless `n` is given; a,b,c CCW from outside
BIO.tri=function(fam,a,b,c,col,n){const K=BIO.buckets[fam];if(!K){BIO.err('BIO.tri: no bucket '+fam);return;}

// ---------------------------------------------------------------- the foliage hook
// o: { aN:bool, irid:bool, swayW:'glsl expr', swayA:0.2, axis:0|1, dist:bool }
//   swayW  weight of the displacement per vertex: '1.0' for a clump, '(-position.y)'

  sh.uniforms.uWindT=BIO.WIND.t;sh.uniforms.uWindV=BIO.WIND.v;sh.uniforms.uWindOn=BIO.WIND.on;
  if(!BIO.SUN.value)BIO.setSun([.45,.72,-.52]);

   .replace('#include <common>','#include <common>\nuniform float uWindT;\nuniform vec2 uWindV;\nuniform float uWindOn;\nvarying vec3 vFlWP;\nvarying float vFlD;\n'+

   .replace('#include <project_vertex>',[
    'vec4 mvPosition = vec4( transformed, 1.0 );',
    'float _sc = 1.0; float _ph = 0.0;',
    '#ifdef USE_INSTANCING',
    '  mvPosition = instanceMatrix * mvPosition;',
    '  _ph = dot(instanceMatrix[3].xyz, vec3(0.131,0.073,0.117));',
    '  _sc = length(instanceMatrix['+(o.axis||0)+'].xyz);',
    '#endif',
    'float _wg = '+(o.swayW||'1.0')+';',
    // the world's wind (uWindOn=1): the sway scales with its strength and the foliage leans downwind,

    'float _wk = mix(1.0, max(0.3, length(uWindV)), uWindOn);',
    'vec3 _lean = uWindOn * vec3(uWindV.x, 0.0, uWindV.y) * (0.9 + 0.6*sin(uWindT*0.45+_ph*2.1));',
    'mvPosition.xyz += _wg * _sc * (vec3(',
    '   sin(uWindT*0.9+_ph) + 0.45*sin(uWindT*2.3+_ph*1.7+position.x*5.0),',
    '   0.40*sin(uWindT*1.6+_ph*0.6+position.z*5.0),',
    '   cos(uWindT*0.7+_ph*1.3) + 0.45*sin(uWindT*2.9+_ph+position.y*5.0) ) * _wk + _lean) * '+(o.swayA==null?.06:o.swayA).toFixed(3)+';',
    'vFlWP = (modelMatrix * mvPosition).xyz;',
    o.aN?'vFlN = aN;':'',o.irid?'vFlC2 = aC2;':'',
    'mvPosition = modelViewMatrix * mvPosition;',
    'vFlD = -mvPosition.z;',
    'gl_Position = projectionMatrix * mvPosition;'].join('\n'));

   '{vec3 _up=normalize(normalMatrix*vec3(0.0,1.0,0.0)); transformedNormal=normalize(mix(normalize(transformedNormal),_up,0.45));}');

   .replace('#include <common>','#include <common>\nuniform float uWindT;\nuniform vec3 uSunDir;\nvarying vec3 vFlWP;\nvarying float vFlD;\n'+
    (o.aN?'varying vec3 vFlN;\n':'')+(o.irid?'varying vec3 vFlC2;\n':''))
   .replace('#include <map_fragment>','#include <map_fragment>\n diffuseColor.a *= 1.0 + clamp(vFlD/650.0, 0.0, 1.1);')
   .replace('reflectedLight.indirectDiffuse += ( gl_FrontFacing ) ? vIndirectFront : vIndirectBack;','reflectedLight.indirectDiffuse += 0.72*vIndirectFront + 0.28*vIndirectBack;')

// ================================================================= BIOME CORE — animation
// Things that MOVE, at no per-frame cost: an instanced item whose material
// carries a motion hook. Each instance is put at its path's CENTRE (so the
// probe and the inspector see it there) with two extra vec4 attributes,
//   aP0 = [cx, cy, cz, radius]    aP1 = [speed, phase, vertical amplitude, eccentricity]
// and the vertex shader moves and turns it along the path from the shared
// wind clock (BIO.WIND.t). The body is modelled with +x forward, +y up.
//   mode 'orbit'  a level ellipse round the centre (soaring flocks), banked
//   mode 'flit'   a lissajous wander inside a box (darting under the canopy,
//                 butterflies, motes), heading and pitch from the velocity
//   mode 'walk'   no path (the host or a tick moves the matrix); aP1.x is the
//                 gait phase, advanced by whoever moves it, aP1.y the flap phase
//   billboard     the item is a camera-facing card (motes)
//   flap          vertices beyond |z| > root hinge up and down (wings)
//   legs          vertices below y < legTop swing fore and aft, diagonal pairs
// Also charged to BIO.cur, baked with everything else.
BIO.animHook=function(o){o=o||{};
 const mode=o.mode||'orbit',flap=o.flap||null,legs=o.legs||null;
 const state=[
  'mat3 _hdg(float a){float c=cos(a),s=sin(a);return mat3(c,0.,s, 0.,1.,0., -s,0.,c);}',
  'mat3 _rz(float a){float c=cos(a),s=sin(a);return mat3(c,s,0., -s,c,0., 0.,0.,1.);}',
  'mat3 _rx(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0., 0.,c,s, 0.,-s,c);}',
  'void _anim(out mat3 M, out vec3 P){',
  mode==='orbit'?[
   ' float th = aP1.y + aP1.x * uWindT;',
   ' float e = max(aP1.w, 0.15);',
   ' P = vec3(cos(th)*aP0.w, aP1.z*(0.6*sin(th*2.3+aP1.y)+0.4*sin(th*0.7+2.0*aP1.y)), sin(th)*aP0.w*e);',
   ' vec2 d = normalize(vec2(-sin(th), cos(th)*e));',
   ' float yaw = atan(d.y, d.x);',
   ' float bank = -0.42*sign(aP1.x)*(0.7+0.3*sin(th*3.1+aP1.y));',
   ' float pit = 0.25*aP1.z*(1.38*cos(th*2.3+aP1.y))/max(1.0,aP0.w)*4.0;',
   ' M = _hdg(yaw) * _rz(clamp(pit,-0.3,0.3)) * _rx(bank);'].join('\n')
  :mode==='flit'?[
   ' float t = aP1.y + aP1.x * uWindT;',
   ' float e = max(aP1.w, 0.15);',
   ' P = vec3(sin(t)*aP0.w, aP1.z*sin(t*1.7+1.0), cos(t*0.83+0.5)*aP0.w*e);',
   ' vec3 v = vec3(cos(t)*aP0.w, aP1.z*1.7*cos(t*1.7+1.0), -0.83*sin(t*0.83+0.5)*aP0.w*e);',
   ' float yaw = atan(v.z, v.x);',
   ' float pit = atan(v.y, max(0.001,length(v.xz)))*0.6;',
   ' M = _hdg(yaw) * _rz(clamp(pit,-0.6,0.6));'].join('\n')
  :' P = vec3(0.0); M = mat3(1.0);',
  '}'].join('\n');

  sh.uniforms.uWindT=BIO.WIND.t;
  sh.vertexShader=sh.vertexShader
   .replace('#include <common>','#include <common>\nuniform float uWindT;\nattribute vec4 aP0;\nattribute vec4 aP1;\n'+state)
   .replace('#include <begin_vertex>',[
    'vec3 transformed = vec3( position );',
    flap?[' { float _w = max(0.0, abs(position.z) - '+(flap.root==null?.12:flap.root).toFixed(3)+');',

          '   transformed.z -= sign(position.z) * _w * (1.0 - cos(_f*'+(flap.amp||.35).toFixed(3)+')) * 0.5; }'].join('\n'):'',

          '   if(position.y < _lt){ float _k = (_lt - position.y)/_lt;',
          '     float _ph = aP1.x + (position.x > 0.0 ? 0.0 : 3.14159) + (position.z > 0.0 ? 0.0 : 3.14159);',

// ---------------------------------------------------------------- terrain
// Gently rolling hyperjungle floor: long swells with a finer roughness, and a
// shallow brook line running roughly north-south through the middle (a bare
// strip the biome's mask keeps clear -- it is riparian ground, tagged as such).
const TERR={R:3600,swell:38,rough:6};
function terrainH(x,z){
 const a=fbm(x*.00042+3.1,z*.00042-1.7,17,3)-.5,b=fbm(x*.0026-2,z*.0026+5,29,2)-.5;
 const brook=Math.exp(-Math.pow((x-90*Math.sin(z*.0012))/34,2));
 return TERR.swell*a*2+TERR.rough*b*2-brook*3.2;}
function brookDist(x,z){return Math.abs(x-90*Math.sin(z*.0012));}
// ---------------------------------------------------------------- the host binding
// This is the whole contract between a world and a biome. OBSTACLES is filled
// by whatever the host builds before the biome (the tower, in this file set).
const OBSTACLES=[];
BIO.init({THREE:THREE,scene:scene,terrainH:terrainH,
 mask:(x,z)=>{const b=brookDist(x,z);return b<14?0:b<26?(b-14)/12:1;},   // the brook bed is bare
 obstacles:OBSTACLES,ticks:tick,seed:7,origin:[0,0],err:reportErr});
BIO.setSun([-1200,900,-600]);
// the ground as one mesh, painted dark litter with the brook bed lighter
const TEX_GROUND=BIO.canvasTex(1024,1024,(g,w,h)=>{const id=g.createImageData(w,h),d=id.data;const S=TERR.R*2.2;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const wx=(x/w-.5)*S,wz=(y/h-.5)*S;
  const n=fbm(x/30,y/30,.3,2),n2=fbm(x/5,y/5,7,1);
  let r=30+(n-.5)*22+(n2-.5)*12,gg=42+(n-.5)*30+(n2-.5)*14,b=22+(n-.5)*14;
  const bk=clamp(1-brookDist(wx,wz)/28,0,1);           // silt and pebbles along the brook
  r=lerp(r,96+n2*30,bk);gg=lerp(gg,84+n2*22,bk);b=lerp(b,62,bk);
  d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;}
 g.putImageData(id,0,0);});
const MAT_GROUND=new THREE.MeshLambertMaterial({map:TEX_GROUND,color:0x8c8c86});   // litter under closed canopy: dark, no shadow maps here
(function(){const N=180,S=TERR.R*2.2,g=new THREE.PlaneGeometry(S,S,N,N);g.rotateX(-Math.PI/2);
 const p=g.attributes.position;for(let i=0;i<p.count;i++){p.setY(i,terrainH(p.getX(i),p.getZ(i)));}
 g.computeVertexNormals();const m=new THREE.Mesh(g,MAT_GROUND);m.userData.probeSkip=true;m.userData.inspectLabel='Forest floor';scene.add(m);
 // the brook water: a narrow ribbon at the bed level
 const W=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshStandardMaterial({color:0x2a5a4a,roughness:.2,metalness:.2,transparent:true,opacity:.8}));
 const pts=[];for(let z=-TERR.R;z<=TERR.R;z+=60)pts.push([90*Math.sin(z*.0012),z]);
 const geo=new THREE.BufferGeometry(),pos=[];
 for(let k=0;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];const ya=terrainH(a[0],a[1])+.35,yb=terrainH(b[0],b[1])+.35;
  pos.push(a[0]-9,ya,a[1], b[0]-9,yb,b[1], b[0]+9,yb,b[1],  a[0]-9,ya,a[1], b[0]+9,yb,b[1], a[0]+9,ya,a[1]);}
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.computeVertexNormals();
 const wm=new THREE.Mesh(geo,W.material);wm.userData.probeSkip=true;wm.userData.inspectLabel='The brook';scene.add(wm);})();

// ---------------------------------------------------------------- bark textures
// One canvas per species at bole-tile scale (a tile is ~10-20 m up a bole):
// ironbark furrows, ghostwood peel bands and lenticels, prism gum shed-bark
// colour strips, baobab wrinkles. A 5th, pale, is tinted for limbs. The two
// newer species (5 mahogany: flaky rectangular plates in deep fissures;
// 6 kapok: smooth bands studded with conical thorn bosses) are painted
// NEAR-GREY and take their colour from SPECIES.bark alone, as the eastern
// abyss kit learnt to (KNOWN_ISSUES: the older four are still pre-coloured).
HYPERJUNGLE.barkTex=function(kind){return BIO.canvasTex(256,512,(g,w,h)=>{
 const base=['#5a3424','#d9d4c4','#8c8666','#7a6e5e','#b8a494','#8e8a86','#b0b0aa'][kind];
 g.fillStyle=base;g.fillRect(0,0,w,h);

  for(let i=0;i<260;i++){const x=rng()*w,d=rng();

// ==================== 55-biome-hyperjungle-trees.js
// ================================================================= HYPERJUNGLE — trees
// The hero hypertrees of Girder's 60-trees.js, ported onto the biome core:
// fluted buttressed boles (BIO.lathe into 'bark'+sp), surface roots and every
// bough, secondary and twig as BIO.tube into 'limb', instanced leaf clumps hung
// along the boughs, ghostwood racemes and baobab pods. Girder's trees leaned
// on the city's structural branches for half their crown; here every tree
// grows three tiers of its own boughs (top tuft, crown fillers and a lower
// tier at u 0.50-0.75) so the crown is full on its own. Between them stand
// immature hypertrees ('trunk' item + rod boughs + clump cards) and beyond
// heroR the impostor far forest (vertex-coloured blob crowns, 'far' bucket).
// Placement goes through BIO.scatter / BIO.grid (host mask + keep-clear);
// every count scales with q; everything is charged to BIO.cur by the core.
// Every hero also exports PERCHES (points along its boughs with the bough
// radius there) for the floor pass (epiphyte gardens) and the fauna pass
// (roosts); nothing else needs to know a bough's geometry.
(function(){

// ---------------------------------------------------------------- trunk profile
// Girder's trunkR: bole radius of tree T at world height y. The baobab is a
// bottle; the others taper to a whip. Exported for the floor pass.

 for(let i=0;i<d.length;i+=4*13){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}

 for(let sp=0;sp<NSP;sp++){const B=SP[sp].bark;TINT.bole[sp]=[];TINT.limb[sp]=[];TINT.far[sp]=[];
  for(let k=0;k<3;k++){

   const act=[boleM[sp][0]*bt[0],boleM[sp][1]*bt[1],boleM[sp][2]*bt[2]];
   const lt=[Math.min(1,act[0]/Math.max(.02,limbM[0])),Math.min(1,act[1]/Math.max(.02,limbM[1])),Math.min(1,act[2]/Math.max(.02,limbM[2]))];
   TINT.bole[sp][k]=C(0).setRGB(bt[0],bt[1],bt[2]).convertLinearToSRGB();
   if(sp===1){lt[0]*=.90;lt[1]*=.89;lt[2]*=.86;}
   TINT.limb[sp][k]=C(0).setRGB(lt[0],lt[1],lt[2]).convertLinearToSRGB();

// ---------------------------------------------------------------- polyline helpers (Girder)
function treeCum(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y,pts[i].z-pts[i-1].z));return c;}

// and a sideways wiggle, so it ARCS -- never a straight rod
function treeGrow(o,d,len,r0,r1,n,curve,wig){let sx=-d[2],sz=d[0];const sl=Math.hypot(sx,sz)||1;sx/=sl;sz/=sl;

 const x=tx*a+sx*b,y=ty*a+c,z=tz*a+sz*b,l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];}
const clear3=(x,y,z,rad,vr)=>BIO.clearOf3(x,y,z,rad,vr);
// SPECIES COME IN STANDS (BIO.standAt's fbm patch field), but that field's
// values are bell-shaped, so an even split of its range gives an uneven
// species mix. The field is SAMPLED over the disc at build time and split at
// its measured quantiles for the target shares below (so the shares hold for
// any seed, radius or species count), with Girder's share of off-pattern
// trees. Order along the field = which stands border which.
const SHARE=[.22,.17,.22,.11,.17,.11];   // ironbark, ghostwood, prism gum, baobab, mahogany, kapok
let QUANT=null;
function standQuantiles(R){const v=[],o=BIO.center(),n=64;   // the grids' centre, [x,z] (the core keeps host.origin as a list)

// ---------------------------------------------------------------- one hero hypertree
// Lower-tier habit per species (the tier Girder's city branches used to be):
// count, bole height band, length (x crownR), elevation, curve, radius scale.
const LOWER=[
 {n:[6,8],u:[.50,.75],len:[.62,1.00],el:[-.02,.24],curve:-.14,rs:.48},   // ironbark: level tiers, drooping tips
 {n:[6,8],u:[.48,.72],len:[.58,.92],el:[.55,.95],curve:.06,rs:.45},      // ghostwood: rising steeply

 {n:[5,7],u:[.60,.80],len:[.66,.98],el:[.20,.50],curve:-.10,rs:.46},     // mahogany: a high umbrella, nothing below 60 %
 {n:[8,11],u:[.52,.82],len:[.78,1.08],el:[-.04,.10],curve:-.04,rs:.52}]; // kapok: level pagoda whorls, the widest spread
function buildHero(T,ti,q,st){

 const L=SP[sp].leaf.map(h=>bright(h,[1.45,.85,1.05,1.1,1.4,1.1][sp])),R=T.crownR,yc0=T.y0+T.H*T.crown0,yTop=T.y0+T.H,a0=(T.seed%628)/100;let k;
 if(sp===0){for(k=0;k<(cheap?3:4);k++){const t=k/3;blob(T.x+Math.sin(k*2.4+a0)*R*.06,mix(yc0+9,yTop-15,t),T.z+Math.cos(k*2.4+a0)*R*.06,R*mix(.80,.20,t),mix(23,18,t),L[(k+fi)%4],L[2],fi+k);}}

// ---------------------------------------------------------------- the pass
HYPERJUNGLE.buildTrees=function(R,heroR,q){
 reseed(550001);q=q==null?1:q;heroR=heroR||1500;R=Math.max(R||3000,heroR+200);tints();standQuantiles(R);
 const st={trunk:0,limb:0,bough:0,twig:0,root:0,far:0,sapTris:0,roots:0,topBoughs:0,boughs:0,twigs:0,spots:0,clumps:0,racemes:0,pods:0,capsules:0,flowers:0,sapClumps:0};
 const TREES=HYPERJUNGLE.TREES;TREES.length=0;const SAPS=HYPERJUNGLE.SAPLINGS;SAPS.length=0;
 const mk=(x,y,z,hero)=>{const sp=standSp(x,z),S=SP[sp];
  return{x:x,z:z,y0:y-.8,sp:sp,H:rr(S.H[0],S.H[1]),rb:rr(S.rb[0],S.rb[1]),crownR:rr(S.crownR[0],S.crownR[1]),crown0:S.crown0,seed:ri(0,999999),hero:hero};};
 // 1. HERO hypertrees: area-uniform over the hero disc, Girder's 165 m minimum spacing
 const nHero=Math.round(Math.PI*heroR*heroR/125000*q);
 BIO.scatter(nHero,0,heroR,165,(x,y,z)=>{TREES.push(mk(x,y,z,true));},{pad:34});
 const heroes=TREES.slice();
 // 2. FAR impostors from heroR out to R, one per ~150 m cell, no patchiness (the canopy must close)
 BIO.grid(165*Math.sqrt(1/Math.max(.25,q)),heroR+30,R,(x,z,d)=>{for(const T of heroes)if(Math.hypot(x-T.x,z-T.z)<T.crownR+60)return 0;return 1;},
  (x,y,z)=>{TREES.push(mk(x,y,z,false));},{patch:0,pad:20});
 const fars=TREES.filter(T=>!T.hero);
 // 3. SAPLINGS between the heroes, and a sparse ring out to heroR+400 so the impostor line is not a cliff
 const near=(x,z)=>{for(const T of TREES){const d=Math.hypot(x-T.x,z-T.z);if(d<trunkR(T,T.y0+5)*1.5+(T.hero?34:22))return false;}return true;};
 BIO.grid(74,0,heroR+400,(x,z,d)=>d<heroR?.85:.32*(1-(d-heroR)/400)+.06,(x,y,z,d)=>{if(!near(x,z))return;
  const sp=standSp(x,z,.35),H=20+40*Math.pow(rng(),1.4),cr=H*SAP_CR[sp]+2;
  if(!BIO.clearOf(x,z,cr+4))return;
  SAPS.push({x:x,z:z,y0:y-1,H:H,sp:sp,cr:cr,ring:d>=heroR});},{patch:.5,pad:6});
 // build
 heroes.forEach((T,ti)=>buildHero(T,ti,q,st));
 fars.forEach((T,fi)=>buildFar(T,fi,st));
 SAPS.forEach((Sd,si)=>buildSapling(Sd,si,q,st));
 const ct=BIO.defs.clump0.tris,bark=st.trunk+st.limb+st.bough+st.twig+st.root,leaves=st.clumps*ct,hang=st.racemes*BIO.defs.raceme.tris+(st.pods+st.capsules)*BIO.defs.pod.tris;
 const sap=st.sapTris+st.sapClumps*ct;
 const mix6=SP.map(S=>0);heroes.forEach(T=>mix6[T.sp]++);
 return{trees:TREES.length,hyper:heroes.length,far:fars.length,saplings:SAPS.length,heroMix:mix6,
  boughs:st.topBoughs,secondaries:st.boughs,twigs:st.twigs,roots:st.roots,clumps:st.clumps,racemes:st.racemes,pods:st.pods,capsules:st.capsules,flowers:st.flowers,sapClumps:st.sapClumps,
  tris:{trunk:st.trunk,limbs:st.limb,boughs:st.bough,twigs:st.twig,roots:st.root,bark:bark,leaves:leaves,hang:hang,far:st.far,saplings:sap,total:bark+leaves+hang+st.far+sap}};};

// approximate canopy top near (x,z): the highest crown within 200 m, else 60
HYPERJUNGLE._canopyH=function(x,z){let h=0;for(const T of HYPERJUNGLE.TREES){if(Math.hypot(x-T.x,z-T.z)<200)h=Math.max(h,T.y0+T.H);}return h||60;};
})();

// ==================== 58-biome-hyperjungle-fauna.js
// ================================================================= HYPERJUNGLE — fauna
// What moves in the belt, written against the same contract (BIO.host gives
// terrainH / mask / obstacles / ticks; the trees pass gives canopyH and the
// hero perches). Five kinds, every one an instanced item like any plant:
//   SKY RAYS      big broad-winged soarers in flocks wheeling above the canopy
//                 (shader 'orbit' paths, banked, a slow glide-flap)
//   CANOPY DARTS  small fast flitters in loose groups under the canopy
//                 (shader 'flit' paths in the openings)
//   BUTTERFLIES   hyperjungle-sized, drifting low in the openings and round
//                 the blooms (shader 'flit', painted wings tinted per instance)
//   SPORE MOTES   glowing drift in the damp and along the brook banks
//                 (billboarded additive discs, shader 'flit')
//   STRIDERS      long-legged grazers in herds on the open floor, walked on
//                 the CPU between waypoints (terrain-following, keep-clear,
//                 grazing pauses), legs swung in the shader ('walk')
//   BOUGH SLOTHS  hanging under the hero boughs, static
// Every animal is charged to BIO.cur ('jungle/fauna'); the counts scale with q.
(function(){
const T3=()=>BIO.host.THREE,PAL=HYPERJUNGLE.PAL;
const C=h=>new (T3().Color)(h);
function vary(hex,dh,ds,dl){const c=C(hex),h={};c.getHSL(h);c.setHSL(((h.h+rr(-dh,dh))%1+1)%1,clamp(h.s+rr(-ds,ds),0,1),clamp(h.l+rr(-dl,dl),.03,.97));return c;}
const damp=(x,z)=>fbm(x*.0052+21,z*.0052+13,777,2);            // the floor pass's damp field
const openK=(x,z)=>.38+.62*smooth(.32,.62,fbm(x*.0105+5,z*.0105-9,4242,2));

// ---------------------------------------------------------------- bodies
// +x forward, +y up, unit-ish size; assembled once, vertex-coloured, tinted

 return BIO.geo.assemble([[body,0x5a5e62,(x,y,z)=>y<0?1.25:1],[head,0x50545a],[tail,0x44484c],
  [BIO.geo.wing(1,.18,-.24,-.12,1.05,.22,.06),0x62666a],[BIO.geo.wing(-1,.18,-.24,-.12,1.05,.22,.06),0x62666a],
  [BIO.geo.wing(1,-.22,-.34,-.40,.28,.10,.02),0x50545a],[BIO.geo.wing(-1,-.22,-.34,-.40,.28,.10,.02),0x50545a]]);}

  [BIO.geo.wing(1,.08,-.08,-.04,.42,.14,.05),0x5e6e58],[BIO.geo.wing(-1,.08,-.08,-.04,.42,.14,.05),0x5e6e58],

 const body=new T.SphereGeometry(.22,9,6).scale(1.9,1.05,1).translate(0,.66,0);

 const parts=[[body,0x6a6e5a,(x,y,z)=>y<.62?1.28:1],[rump,0x646852],[neck,0x62665a],[head,0x5c6054],[ear1,0x4a4e44],[ear2,0x4a4e44],[tail,0x4a4e44]];
 // a dorsal ridge of three horny plates
 for(let k=0;k<3;k++){const p=new T.ConeGeometry(.045,.14,4).translate(.14-k*.16,.94,0);parts.push([p,0x8a7a58]);}

  const hoof=new T.CylinderGeometry(.045,.04,.05,5).translate(l[0],.025,l[1]);parts.push([hoof,0x2e3028]);});

function slothGeo(){const T=T3();

 const b1=new T.CylinderGeometry(.03,.025,.36,4).translate(-.14,-.2,.1),b2=new T.CylinderGeometry(.03,.025,.36,4).translate(-.14,-.2,-.1);
 return BIO.geo.assemble([[body,0x5a4a38],[head,0x6a5a48],[a1,0x4a3c2e],[a2,0x4a3c2e],[b1,0x4a3c2e],[b2,0x4a3c2e]]);}

// ---------------------------------------------------------------- textures, materials, items
reseed(580001);
HYPERJUNGLE.WINGTEX=BIO.alphaTex(256,(g,S)=>{   // one wing on a transparent canvas: dark rim, veins, eye spots; u 0 = the body root
 g.fillStyle=BIO.tex.grey(215);g.beginPath();g.moveTo(4,S*.5);g.quadraticCurveTo(S*.35,S*.02,S*.96,S*.10);g.quadraticCurveTo(S*.98,S*.55,S*.80,S*.72);g.quadraticCurveTo(S*.55,S*.98,S*.20,S*.90);g.quadraticCurveTo(S*.04,S*.75,4,S*.5);g.closePath();g.fill();

 g.strokeStyle=BIO.tex.grey(120);g.lineWidth=2;for(let k=0;k<7;k++){g.beginPath();g.moveTo(8,S*.5);g.quadraticCurveTo(S*.5,S*(.15+.1*k),S*.9,S*(.12+.1*k));g.stroke();}
 [[.62,.32,22],[.55,.68,16],[.80,.50,12]].forEach(e=>{g.fillStyle=BIO.tex.grey(40);g.beginPath();g.arc(S*e[0],S*e[1],e[2],0,TAU);g.fill();g.fillStyle=BIO.tex.grey(230);g.beginPath();g.arc(S*e[0],S*e[1],e[2]*.45,0,TAU);g.fill();});},[150,150,150]);
// Optional library sheets: a build sets HYPERJUNGLE.FAUNATEX = {wing, fur, hide, ray} (THREE.Texture or an image URL) BEFORE this fragment. `wing` is an alpha cut-out of ONE butterfly wing, root at the left edge; fur, hide and ray are near-colourless, so the instance tint decides
// the colour. Absent: the look is exactly the vertex-coloured one.
const FT=HYPERJUNGLE.FAUNATEX||{};
function ftex(name,rep){const v=FT[name];if(!v)return null;const T=T3(),t=(typeof v==='string')?new T.TextureLoader().load(v):v;

HYPERJUNGLE.FAUNAMAT={
 ray:BIO.animMat('ray',{mode:'orbit',flap:{rate:1.1,amp:.09,root:.14},vertexColors:true,tex:ftex('ray',2)}),
 dart:BIO.animMat('dart',{mode:'flit',flap:{rate:11,amp:.32,root:.06},vertexColors:true}),
 fly:BIO.animMat('fly',{mode:'flit',flap:{rate:7,amp:.6,root:.02},vertexColors:true,tex:ftex('wing')||HYPERJUNGLE.WINGTEX,alphaTest:.4}),
 mote:BIO.animMat('mote',{mode:'flit',billboard:true,basic:true,additive:true}),
 strider:BIO.animMat('strider',{mode:'walk',legs:{top:.62,amp:.16},vertexColors:true,tex:ftex('hide',2)}),

BIO.def('ray',rayGeo(),HYPERJUNGLE.FAUNAMAT.ray,{attrs:['aP0','aP1'],label:'Sky rays'});
BIO.def('dart',dartGeo(),HYPERJUNGLE.FAUNAMAT.dart,{attrs:['aP0','aP1'],label:'Canopy darts'});
BIO.def('fly',flyGeo(),HYPERJUNGLE.FAUNAMAT.fly,{attrs:['aP0','aP1'],label:'Butterflies'});
BIO.def('mote',moteGeo(),HYPERJUNGLE.FAUNAMAT.mote,{attrs:['aP0','aP1'],label:'Spore motes'});
BIO.def('strider',striderGeo(),HYPERJUNGLE.FAUNAMAT.strider,{attrs:['aP0','aP1'],label:'Striders (a herd)'});
BIO.def('sloth',slothGeo(),HYPERJUNGLE.FAUNAMAT.sloth,{label:'Bough sloths'});

// ---------------------------------------------------------------- placement helpers
const trunkR=HYPERJUNGLE.trunkR;
function heroesNear(x,z,r){return (HYPERJUNGLE.TREES||[]).filter(T=>Math.hypot(x-T.x,z-T.z)<r+T.crownR);}
// open air: no hero bole within rad of (x,z)
function clearAir(x,z,rad){for(const T of HYPERJUNGLE.TREES||[]){if(Math.hypot(x-T.x,z-T.z)<rad+trunkR(T,T.y0+30)+2)return false;}return true;}
function clearGround(x,z,rad){for(const T of HYPERJUNGLE.TREES||[]){if(Math.hypot(x-T.x,z-T.z)<rad+trunkR(T,T.y0+3)*1.8+3)return false;}
 for(const S of HYPERJUNGLE.SAPLINGS||[]){if(Math.hypot(x-S.x,z-S.z)<rad+2)return false;}return true;}
const REGI=(o)=>{if(typeof REGISTER==='function')REGISTER(o);};

// ---------------------------------------------------------------- the herds (CPU)
// Each strider walks between waypoints inside its herd's disc, turning
// smoothly, grazing between legs; y follows the terrain. The item is baked
// by the host like any other; the tick finds its InstancedMesh on the first
// frame and rewrites the matrices and the gait phases from then on.
const HERDS=[];
function herdTick(dt){const T=T3();if(!HERDS.length)return;
 const mesh=HERDS._mesh||(HERDS._mesh=BIO.baked.find(m=>m.name==='biome:strider'));if(!mesh)return;
 const aP1=mesh.geometry.getAttribute('aP1');if(!aP1)return;
 const M=new T.Matrix4(),P=new T.Vector3(),Q=new T.Quaternion(),S=new T.Vector3(),UP=new T.Vector3(0,1,0);
 dt=Math.min(dt,.1);
 HERDS.forEach(H=>H.animals.forEach(A=>{
  if(A.state==='graze'){A.timer-=dt;if(A.timer<=0){A.state='walk';pickTarget(H,A);}}
  else{const dx=A.tx-A.x,dz=A.tz-A.z,d=Math.hypot(dx,dz);
   if(d<1.5){A.state='graze';A.timer=rr(3,10);}
   else{const want=Math.atan2(dz,dx);let dh=want-A.hdg;dh=Math.atan2(Math.sin(dh),Math.cos(dh));A.hdg+=clamp(dh,-1.6*dt,1.6*dt);
    const v=A.speed*Math.max(.25,1-Math.abs(dh)/2);A.x+=Math.cos(A.hdg)*v*dt;A.z+=Math.sin(A.hdg)*v*dt;A.gait+=v*dt*2.6/A.s;
    if(BIO.mask(A.x,A.z)<=0||!BIO.clearOf(A.x,A.z,3)){A.state='graze';A.timer=1;}}}
  A.y=BIO.terrainH(A.x,A.z);
  P.set(A.x,A.y,A.z);Q.setFromAxisAngle(UP,-A.hdg);S.set(A.s,A.s,A.s);M.compose(P,Q,S);mesh.setMatrixAt(A.i,M);
  aP1.setX(A.i,A.gait);}));
 mesh.instanceMatrix.needsUpdate=true;aP1.needsUpdate=true;}
function pickTarget(H,A){for(let t=0;t<12;t++){const a=rr(0,TAU),d=H.r*Math.sqrt(rng()),x=H.x+Math.cos(a)*d,z=H.z+Math.sin(a)*d;
  if(BIO.mask(x,z)<=0||!BIO.clearOf(x,z,6)||!clearGround(x,z,4))continue;A.tx=x;A.tz=z;return;}A.tx=H.x;A.tz=H.z;}

// ---------------------------------------------------------------- the pass
HYPERJUNGLE.buildFauna=function(R,heroR,q){
 reseed(580101);q=q==null?1:q;R=R||3000;heroR=heroR||1500;
 const st={rays:0,flocks:0,darts:0,dartGroups:0,flies:0,motes:0,swarms:0,striders:0,herds:0,sloths:0};
 const o=BIO.center(),canopy=(x,z)=>HYPERJUNGLE._canopyH?HYPERJUNGLE._canopyH(x,z):120;
 // 1. SKY RAYS: flocks wheeling above the canopy of the hero disc
 const nFlock=Math.round(8*q);
 BIO.scatter(nFlock,150,heroR-150,420,(x,y,z)=>{const rad=rr(90,220);if(!BIO.clearOf(x,z,rad+40))return;
  const cy=canopy(x,z)+rr(30,120),n=ri(5,12),dir=rng()<.5?1:-1,w=dir*TAU/rr(38,70),ecc=rr(.55,1),tint=vary(pick([0x6a6e74,0x7a7060,0x5e6672,0x8a8070]),.02,.1,.08);
  for(let k=0;k<n;k++){const s=rr(6.5,11.5);
   BIO.put('ray',[x,cy+rr(-14,14),z],null,s,tint.clone().offsetHSL(0,0,rr(-.06,.06)),{aP0:[x,cy,z,rad*rr(.85,1.15)],aP1:[w*rr(.92,1.08),rr(0,TAU),rr(4,12),ecc]});st.rays++;}
  st.flocks++;REGI({name:'A flock of sky rays',kind:'fauna',label:'Sky rays',x:x,z:z,y:cy-40,r:rad+30,h:100});},{pad:60});
 // 2. CANOPY DARTS: loose groups flitting through the openings under the canopy
 const nGroups=Math.round(70*q);
 BIO.scatter(nGroups,40,heroR-60,90,(x,y,z)=>{const rad=rr(12,34);if(!clearAir(x,z,rad+4)||!BIO.clearOf(x,z,rad+6))return;
  const cy=y+rr(10,45),n=ri(2,6),tint=vary(pick([0x6a7a62,0x7a6a4a,0x5a7a7a,0x8a7a5a,0x4a6a5a]),.03,.12,.08);
  for(let k=0;k<n;k++){const s=rr(1.2,2.1);

// ================================================================= HYPERJUNGLE — floor
// Girder's 62-jungle.js understorey, ported onto the biome core: the dark
// floor under the hypertrees. Ferns, broad-leaf shrubs, aroids, palms and
// cycads, sub-canopy trees in the gaps, mossy boulders, mushrooms in the damp
// patches, fallen hypertree logs with their root plates and everything that
// grows on a log, lianas and moss beards on the hero boles, bracket fungi on
// their lower twenty metres; and the belt's own additions: giant tree ferns,
// stilt-rooted screwpines in the damp, heliconia / ginger clumps with their
// hanging bracts in the openings, and EPIPHYTE GARDENS (bromeliad rosettes,
// moss, hanging strands) on the hero boughs and up the boles, off the perch
// points the tree pass exports. The brook, cascade, footbridge and gates of the
// source are the host's business (its mask keeps the bed clear) and are not
// here. The floor is PLACEMENT: jittered grids with an fbm patch mask and an
// "openings" field, so it is dense thickets and stretches of open litter, not
// a sprinkle. Two LOD rings: the full mix out to ~1500 m from the origin, then
// a cheap mix of squashed cards, small ferns and card shrubs out to R, so the

function facingTri(a,b,c,dir,col){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];

function buildLog(o,st,q){const n=Math.ceil(o.L/7)+1,pts=[],px=-o.hz,pz=o.hx;
 for(let i=0;i<n;i++){const t=i/(n-1),s=t*o.L,off=o.bow*Math.sin(Math.PI*t),x=o.bx+o.hx*s+px*off,z=o.bz+o.hz*s+pz*off,r=mix(o.r0,o.r1,Math.pow(t,.9));
  const g0=Y(x,z),g1=Y(x-o.hx*12,z-o.hz*12),g2=Y(x+o.hx*12,z+o.hz*12);
  pts.push({x:x,y:(g0*2+g1+g2)/4+r*.30,z:z,r:r,s:s});}
 const wm=means().wood,base=rr(.75,1.05);
 pts.forEach((p,k)=>{const m=fbm(p.x*.05+3,p.z*.05-2,55,2);
  p.col=m>.55?C(0).setRGB(base*.7,base*1.05,base*.55).convertLinearToSRGB():C(0).setRGB(base*(1-.25*m),base*(.95-.25*m),base*(.85-.2*m)).convertLinearToSRGB();});

 // the root plate at the butt: a ragged disc of splayed dead wood, then short root tubes

 for(let i=0;i<nr;i++){const a=i/nr*TAU,rrim=o.r0*(1.15+.6*rng()),ca=Math.cos(a),sa=Math.sin(a),back=rr(.6,2.4);
  rim.push([P0.x+n1[0]*ca*rrim+tdir[0]*back,P0.y+sa*rrim,P0.z+n1[2]*ca*rrim+tdir[2]*back,i/nr*4,1]);
  ring.push([P0.x+n1[0]*ca*o.r0*.98-tdir[0]*.8,P0.y+sa*o.r0*.98,P0.z+n1[2]*ca*o.r0*.98-tdir[2]*.8,i/nr*4,0]);}

 for(let i=0;i<nr;i++){const j=(i+1)%nr,a2=(i+.5)/nr*TAU,rad=[n1[0]*Math.cos(a2),Math.sin(a2),n1[2]*Math.cos(a2)];
  const dc=woodTint(rr(.55,.9)),sc=tint(pick(PAL.litter),wm,1.2);
  facingTri(ctr,rim[i],rim[j],tdir,rng()<.4?sc:dc);facingTri(ring[i],rim[i],rim[j],rad,dc);facingTri(ring[i],rim[j],ring[j],rad,dc);}
 const nroot=ri(5,7);
 for(let i=0;i<nroot;i++){const ra=i/nroot*TAU+rr(-.3,.3),cr=Math.cos(ra),sr=Math.sin(ra),RL=o.r0*rr(1,1.9),rp=[];
  for(let k=0;k<4;k++){const f=k/3,out=o.r0*.55+RL*f,bk=1.2+RL*.5*f*f;
   rp.push({x:P0.x+n1[0]*cr*out+tdir[0]*bk,y:P0.y+sr*out-RL*.25*f*f,z:P0.z+n1[2]*cr*out+tdir[2]*bk,r:o.r0*mix(.22,.04,f)});}

 for(let i=0;i<5;i++){const sa2=rr(0,TAU),sr2=Pn.r*rr(.15,.8),bx2=Pn.x+px*Math.cos(sa2)*sr2-o.hx*1.2,by2=Pn.y+Math.sin(sa2)*sr2,bz2=Pn.z+pz*Math.cos(sa2)*sr2-o.hz*1.2,SL=rr(3,8);

 const G={pts:pts,cx:(pts[0].x+Pn.x)/2,cz:(pts[0].z+Pn.z)/2,cr:o.L/2+o.r0,hx:o.hx,hz:o.hz,L:o.L,px:px,pz:pz};

function logAt(G,s){const P=G.pts,f=clamp(s/G.L,0,1)*(P.length-1),i=Math.min(P.length-2,Math.floor(f)),u=f-i;

  if(rng()<.5){const sd=rng()<.5?1:-1,el=rr(.05,.7),fr=rr(.5,1.5);

   if(fy>Y(fx,fz)+.4){BIO.put('fungus',[fx,fy,fz],qEuler(0,rr(0,TAU),0),[fr,fr*rr(.22,.4),fr],fungusCol());st.brackets++;}}
  if(A.r>1.8&&rng()<.4){const sd3=rng()<.5?1:-1,mx2=A.x+G.px*sd3*A.r*.98,mz2=A.z+G.pz*sd3*A.r*.98;

// ---------------------------------------------------------------- the pass
HYPERJUNGLE.buildFloor=function(R,q){
 reseed(600001);q=q==null?1:q;R=R||3000;means();

 heroes.forEach(T=>{const p=boleProfile(T);PROF.set(T,p);hadd({x:T.x,z:T.z,r:p.ground+1.5,T:T});});

 const nearHero=(x,z)=>{let m=1e9;for(const T of heroes){const d=Math.hypot(x-T.x,z-T.z)-PROF.get(T).ground;if(d<m)m=d;}return m;};

 // ---- 1. fallen hypertrees: ~1 per 250 m cell inside the hero disc, lying between the boles ----
 BIO.grid(250,60,lodR-40,(x,z,d)=>.9*q,(x,y,z,d)=>{
  for(let tr=0;tr<6;tr++){const h=rr(0,TAU),L=rr(60,160),r0=rr(1.6,3);
   const o={hx:Math.cos(h),hz:Math.sin(h),L:L,r0:r0,r1:r0*rr(.42,.58),bow:rr(-3,3)};o.bx=x-o.hx*L/2;o.bz=z-o.hz*L/2;
   let ok=true;
   for(let s=-r0*2;s<=L+4&&ok;s+=6){const t=clamp(s/L,0,1),off=o.bow*Math.sin(Math.PI*t),sx=o.bx+o.hx*s-o.hz*off,sz=o.bz+o.hz*s+o.hx*off,r=mix(r0,o.r1,t);
    if(BIO.mask(sx,sz)<=0||!BIO.clearOf(sx,sz,r+4)||blockedAt(sx,sz,r+6)||logNear(sx,sz,r+14))ok=false;}

 // ---- 2. the understorey: three rings of jittered grid ----
 // type mix (Girder's): sub-canopy tree 7 %, palm 7 %, fern ~30 %, shrub 16 %, aroid 16 %,
 // ground tuft 10 %, fungi 5.5 %, boulders 4 %, the rest shrubs
 function plant(x,y,z,d,lv){
  if(!okGround(x,z,1.2))return;
  const t=rng(),patch=fbm(x*.006-11,z*.006+5,31,2);
  if(t<.05){if(lv>=1&&nearHero(x,z)>12&&okGround(x,z,4)){charge('subtrees',()=>subTree(x,y,z,lv));st.subtrees++;}else{charge('shrubs',()=>shrub(x,y,z,lv,false));st.shrubs++;}}
  else if(t<.12){if(lv===2||rng()<.5){charge('palms',()=>palm(x,y,z,lv));st.palms++;}else{charge('ferns',()=>fern(x,y,z,lv));st.ferns++;}}
  else if(t<.155){if(okGround(x,z,3)){charge('treeferns',()=>treeFern(x,y,z,lv));st.treeferns++;}else{charge('ferns',()=>fern(x,y,z,lv));st.ferns++;}}
  else if(t<.18){if(dampK(x,z)>.45&&okGround(x,z,3)){charge('screwpines',()=>screwpine(x,y,z,lv));st.screwpines++;}else{charge('gingers',()=>ginger(x,y,z,lv));st.gingers++;}}
  else if(t<.215+.06*(openK(x,z)-.6)){charge('gingers',()=>ginger(x,y,z,lv));st.gingers++;}
  else if(t<.44+.1*(patch-.5)){charge('ferns',()=>fern(x,y,z,lv));st.ferns++;}
  else if(t<.60){const big=rng()<.2;charge('shrubs',()=>shrub(x,y,z,lv,big));st.shrubs++;}
  else if(t<.76){charge('aroids',()=>aroid(x,y,z,lv));st.aroids++;}
  else if(t<.86){charge('tufts',()=>{tuft(x,y,z,rr(2.2,4.2));if(lv===2&&rng()<.25)blooms(x,y+.5,z,1.5,ri(2,4));});st.tufts++;}
  else if(t<.915){if(dampK(x,z)>.5)charge('fungi',()=>fungi(x,y,z,lv,st));else{charge('tufts',()=>tuft(x,y,z,rr(2,3.5)));st.tufts++;}}
  else if(t<.945){charge('boulders',()=>boulder(x,y,z,lv,st));}
  else{charge('shrubs',()=>shrub(x,y,z,lv,false));st.shrubs++;}}
 // near: full detail; mid: fewer parts; both patchy, thinner (never bare) in the openings
 BIO.grid(7.4,0,nearR,(x,z,d)=>.92*openK(x,z)*q,(x,y,z,d)=>plant(x,y,z,d,2),{patch:.9,patchScale:.016,pad:1.5});
 BIO.grid(15,nearR,lodR,(x,z,d)=>mix(.6,.3,smooth(nearR,lodR,d))*openK(x,z)*q,(x,y,z,d)=>plant(x,y,z,d,1),{patch:.9,patchScale:.016,pad:1.5});
 // ground cover between the plants: squashed cards and moss in the damp, cheap, so the litter is never a lawn
 const cover=(x,y,z,s)=>{if(!okGround(x,z,.5))return;
  if(dampK(x,z)>.52&&rng()<.3){charge('moss',()=>groundMoss(x,y,z,rr(1.2,2.8)));st.moss++;}
  else{charge('tufts',()=>tuft(x,y,z,s));st.tufts++;}};
 BIO.grid(5.5,0,nearR,(x,z,d)=>.5*openK(x,z)*q,(x,y,z,d)=>cover(x,y,z,rr(1.8,3.6)),{patch:.95,patchScale:.02,pad:.5});
 BIO.grid(13,nearR,lodR,(x,z,d)=>.42*openK(x,z)*q,(x,y,z,d)=>cover(x,y,z,rr(2.2,4)),{patch:.95,patchScale:.02,pad:.5});
 // far ring: the cheap mix out to R -- big squashed cards, small ferns, card shrubs -- at a coarser cell
 BIO.grid(24,lodR,R,(x,z,d)=>mix(.7,.4,smooth(lodR,R,d))*(.55+.45*openK(x,z))*q,(x,y,z,d)=>{
  if(blockedAt(x,z,1))return;const t=rng();
  charge('far',()=>{if(t<.18){fern(x,y,z,0);st.ferns++;}else if(t<.82){tuft(x,y,z,rr(4,8));st.tufts++;}else{shrub(x,y,z,0,false);st.shrubs++;}});},{patch:.9,patchScale:.016,pad:1});

 // ---- 3. on the hero boles: bracket fungi, moss skirts and beards low down, lianas from 30-80 m up ----
 heroes.forEach((T,ti)=>{const prof=PROF.get(T),d0=BIO.lodD(T.x,T.z),lk=clamp(BIO.lod(T.x,T.z),.4,1);
  const gy0=Y(T.x,T.z);
  const nb=Math.round((d0<700?ri(10,16):ri(5,8))*q*lk);
  charge('brackets',()=>{for(let i=0;i<nb;i++){const a=rr(0,TAU),y=gy0+rr(1.5,20),Rs=prof.at(a,y-T.y0),r=rr(1.4,4.2),hc=fungusCol();
   BIO.put('fungus',[T.x+Math.cos(a)*(Rs-.15*r),y,T.z+Math.sin(a)*(Rs-.15*r)],qEuler(0,rr(0,TAU),0),[r,r*rr(.2,.36),r],hc);st.brackets++;
   if(rng()<.5){const a2=a+rr(.04,.09),y2=y+r*rr(.5,.9),R2=prof.at(a2,y2-T.y0),r2=r*rr(.5,.8);
    BIO.put('fungus',[T.x+Math.cos(a2)*(R2-.15*r2),y2,T.z+Math.sin(a2)*(R2-.15*r2)],qEuler(0,rr(0,TAU),0),[r2,r2*.3,r2],shade(hc,rr(-.1,.1)));st.brackets++;}}});
  charge('moss',()=>{
   // moss beards hanging off the bark, and moss skirts plastered on it near the ground
   const nm=Math.round(ri(10,16)*q*lk);
   for(let i=0;i<nm;i++){const a3=rr(0,TAU),y3=gy0+rr(4,26),h=rr(5,14),Rs=Math.max(prof.at(a3,y3-T.y0),prof.at(a3,y3-h-T.y0))+.3;
    BIO.put('ribbon',[T.x+Math.cos(a3)*Rs,y3,T.z+Math.sin(a3)*Rs],qFacing([Math.cos(a3),0,Math.sin(a3)]),[rr(4,10),h,2],leafCol(PAL.moss,1.5));st.moss++;}
   const ns=Math.round(ri(10,16)*q*lk);
   for(let i=0;i<ns;i++){const a4=rr(0,TAU),y4=gy0+rr(.5,12),Rs=prof.at(a4,y4-T.y0)+.12,r4=rr(1.5,3.5);
    BIO.put('mossmat',[T.x+Math.cos(a4)*Rs,y4,T.z+Math.sin(a4)*Rs],qUp([Math.cos(a4),rr(-.1,.25),Math.sin(a4)]),r4,leafCol(PAL.moss,.95));st.moss++;}
   // a few ferns and aroids rooted on the buttress tops
   const nf=Math.round(ri(2,5)*q*lk);
   for(let i=0;i<nf;i++){const a5=rr(0,TAU),y5=gy0+rr(1,7),Rs=prof.at(a5,y5-T.y0)-.4;
    frondCrown(T.x+Math.cos(a5)*Rs,y5,T.z+Math.sin(a5)*Rs,rr(1.4,2.6),5,.15,.5,leafCol(PAL.fern,1.7));st.ferns++;}});
  // epiphyte gardens: bromeliads up the bole flanks (8-60 m) and along the bough perches
  if(d0<1500)charge('epiphytes',()=>{const near=d0<800,nb=Math.round(ri(3,7)*q*lk);
   for(let i=0;i<nb;i++){const a=rr(0,TAU),yy=rr(8,60),Rs=(yy<33?prof.at(a,yy):trunkR(T,T.y0+yy))+.1,nx=Math.cos(a),nz=Math.sin(a);
    bromeliad(T.x+nx*Rs,T.y0+yy,T.z+nz*Rs,[nx*.75,.62,nz*.75],rr(1,2.2));st.epiphytes++;}
   (T.perch||[]).forEach(P=>{if(P.r<1.3||rng()>(near?.55:.3)*q)return;garden(P,near,st);});});
  const nl=Math.round(ri(3,6)*q*lk),leafy=d0<900;
  charge('lianas',()=>{for(let i=0;i<nl;i++){const a=rr(0,TAU),yT=T.y0+rr(30,80),Rt=trunkR(T,yT)+.4;
   const top=[T.x+Math.cos(a)*Rt,yT,T.z+Math.sin(a)*Rt],a2=a+rr(-.3,.3),gd=prof.ground+rr(3,14);
   const gx=T.x+Math.cos(a2)*gd,gz=T.z+Math.sin(a2)*gd;if(BIO.mask(gx,gz)<=0||!BIO.clearOf(gx,gz,1))continue;

   const r=rr(.1,.22),hc=rodCol();

   if(rng()<.6){const L3=rr(10,30),xo=top[0]+rr(-.8,.8),zo=top[2]+rr(-.8,.8);   // a free-hanging aerial root beside it
    BIO.put('strand',[xo,top[1],zo],qUp([rr(-.15,.15),1,rr(-.15,.15)]).multiply(qEuler(0,rr(0,TAU),0)),[rr(.6,1.2),L3,L3*.1],leafCol(PAL.vine,1.4,.06));}
   card(gx,gy+1,gz,rr(2,3.2),2.2,leafCol(SHRUB,1.45),.3);st.lianas++;}});});

 const tt=st.tris;let total=0;for(const k in tt)total+=tt[k];tt.total=total;
 return{under:{ferns:st.ferns,shrubs:st.shrubs,aroids:st.aroids,palms:st.palms,subtrees:st.subtrees,boulders:st.boulders,fungi:st.fungi,logs:st.logs,
  lianas:st.lianas,moss:st.moss,brackets:st.brackets,tufts:st.tufts,treeferns:st.treeferns,screwpines:st.screwpines,gingers:st.gingers,epiphytes:st.epiphytes},tris:tt};};
})();

// ==================== 65-biome-hyperjungle-dress.js
// ================================================================= HYPERJUNGLE — growth on structures
// What the jungle does to a building left in it. The host hands over its
// shells as BufferGeometry[] in world space; this pass samples their faces
// (BIO.upFaces / downFaces / sideFaces / ledgePoints) and grows on them. It
// never touches the geometry -- a plant is never part of a building.
//
// Ported from the Hexahedron's 71b-flora.js dressing, which was the pass that
// made an arcology read as overgrown: moss on every ledge, mats rolled over on
// the soffits with roots and curtains hanging out of them, brackets on the
// arrises, and density falling off into the dark middle of an underside.
(function(){
const PAL=HYPERJUNGLE.PAL;
const C=hex=>new BIO.host.THREE.Color(hex);
const vcol=()=>C(pick(PAL.vine)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.05,.05));
const mcol=()=>C(pick(PAL.moss)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.06,.04));
const bloomCol=()=>C(pick(PAL.bloom));

// a MOSS PATCH lying on a surface with normal n (up for a ledge, down for a soffit)
function moss(p,n,r){const q=qUp(n);const s=r*rr(.7,1.3);
 BIO.put('mossmat',[p[0]+n[0]*.06,p[1]+n[1]*.06,p[2]+n[2]*.06],q,[s,1,s],mcol());}
// a HANGING CURTAIN off a point: 2-4 ribbons side by side across w, facing (dx,dz),
// a trailing strand, and the odd flower
function curtain(p,dx,dz,len,w,opt){opt=opt||{};const m=Math.hypot(dx,dz);
 if(m<1e-6){const a=rng()*TAU;dx=Math.cos(a);dz=Math.sin(a);}else{dx/=m;dz/=m;}
 const q=qFacing([dx,0,dz]),tx=-dz,tz=dx,nrb=2+Math.floor(rng()*3),c=opt.col||vcol();
 for(let i=0;i<nrb;i++){const o=(i-(nrb-1)/2)*w/nrb+rr(-.1,.1)*w,L=len*rr(.5,1);
  BIO.put('ribbon',[p[0]+tx*o+dx*rr(.05,.35),p[1]+rr(-.15,.05),p[2]+tz*o+dz*rr(.05,.35)],q,[w/nrb*rr(1,1.8),L,1],c.clone().multiplyScalar(rr(.82,1.12)));}
 if(rng()<.75){const o=rr(-w/2,w/2);BIO.put('strand',[p[0]+tx*o+dx*.4,p[1]-rr(0,.2),p[2]+tz*o+dz*.4],q,[rr(.14,.34),len*rr(.9,1.5),1],c.clone().multiplyScalar(.85));}
 if(opt.flowers&&rng()<.55){const fc=bloomCol();for(let b=0,nb=2+Math.floor(rng()*5);b<nb;b++){const s=rr(.3,.62);
  BIO.put('bloom',[p[0]+tx*rr(-.5,.5)*w+dx*.45,p[1]-rr(.2,len*.75),p[2]+tz*rr(-.5,.5)*w+dz*.45],qEuler(0,rng()*TAU,0),[s,s,s],fc);}}}
// AERIAL ROOTS off a ceiling: thin, long, hanging straight down
function roots(p,len,w){const q=qEuler(0,rng()*TAU,0),c=vcol();
 for(let i=0,n=1+Math.floor(rng()*3);i<n;i++)BIO.put('strand',[p[0]+rr(-w,w),p[1],p[2]+rr(-w,w)],q,[rr(.1,.3),len*rr(.6,1.2),1],c.clone().multiplyScalar(rr(.8,1.1)));}
// BRACKET FUNGUS on the side of something
function bracket(p,n,s){for(let b=0,nb=2+Math.floor(rng()*3);b<nb;b++){const sb=s*rr(.4,1);
 BIO.put('fungus',[p[0]+n[0]*.2+rr(-.6,.6)*s*(1-Math.abs(n[0])),p[1]+rr(0,2.2)*s,p[2]+n[2]*.2+rr(-.6,.6)*s*(1-Math.abs(n[2]))],
  qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[sb,sb*.4,sb],C(pick(PAL.fungus)));}}
// a PLANT on a ledge: fern rosette, tuft or small bush
function plant(p,s){const k=rng();const y=p[1];
 if(k<.45){const n=5+Math.floor(rng()*3),c=C(pick(PAL.fern));for(let i=0;i<n;i++){const a=i/n*TAU+rr(-.25,.25),L=s*rr(.85,1.4);
  BIO.put('frond',[p[0],y+s*.12,p[2]],qEuler(rr(.05,.30),-a,0),[L,L*rr(.7,1),L*rr(.7,1)],c.clone().multiplyScalar(rr(.82,1.2)));}}
 else if(k<.8){const c=C(pick(PAL.fern)).offsetHSL(rr(-.08,.08),0,rr(-.05,.08));
  BIO.put('ucard',[p[0],y+s*.35,p[2]],qEuler(rr(-.2,.2),rng()*TAU,rr(-.2,.2)),[s*1.2,s*.9,s*1.2],c);}
 else{const c=C(pick(PAL.fern)).offsetHSL(rr(-.1,.1),.05,.02);
  BIO.put('lobe',[p[0],y,p[2]],qEuler(0,rng()*TAU,0),[s,s*.7,s],c.clone().multiplyScalar(.82));
  for(let i=0;i<2;i++)BIO.put('ucard',[p[0]+rr(-.4,.4)*s,y+s*.5,p[2]+rr(-.4,.4)*s],qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[s*1.3,s,s*1.3],c.clone().multiplyScalar(rr(.9,1.2)));}}
// a SMALL TREE on a ledge, species-tagged, 4-14 m
function smallTree(p,h,sp){const S=HYPERJUNGLE.SPECIES[sp],bc=C(pick(S.bark));
 BIO.put('trunk',[p[0],p[1],p[2]],qEuler(rr(-.05,.05),0,rr(-.05,.05)),[h*.12,h,h*.12],bc);
 const R=h*.42,n=6+Math.floor(rng()*4);
 for(let i=0;i<n;i++){const a=rng()*TAU,r=rr(.2,1)*R,yy=p[1]+h*rr(.62,.98);
  const x=p[0]+Math.cos(a)*r,z=p[2]+Math.sin(a)*r;
  BIO.put('clump'+sp,[x,yy,z],qEuler(rr(-.4,.4),rng()*TAU,rr(-.4,.4)),R*rr(.55,.85),pick(S.leaf),{n:[Math.cos(a)*.7,.6,Math.sin(a)*.7],c2:S.leaf[2]});}}

// LEDGES: moss on the flat, plants toward the outer edge, lips and curtains off the edge
HYPERJUNGLE.dressLedges=function(geos,opt){opt=opt||{};
 const nM=opt.moss||400,nP=opt.plants||300,nE=opt.edges||140;
 BIO.upFaces(geos,nM,.6).forEach(f=>moss(f.p,f.n,rr(1.2,opt.mossR||3.5)));
 BIO.upFaces(geos,nP,.6).forEach(f=>{if(rng()<.12)smallTree(f.p,rr(4,opt.treeH||12),BIO.stand(f.p[0],f.p[2],HYPERJUNGLE.SPECIES.length));else plant(f.p,rr(1,opt.size||3));});
 BIO.ledgePoints(geos,nE,2.5).forEach(l=>{const p=[l.p[0]+l.n[0]*.3,l.p[1]-.1,l.p[2]+l.n[2]*.3];
  moss([l.p[0],l.p[1],l.p[2]],[0,1,0],rr(1,2.2));
  if(rng()<.7)curtain(p,l.n[0],l.n[2],rr(4,opt.hang||16),rr(2,5),{flowers:rng()<.4});});};
// SOFFITS: moss rolled over to face the ground, roots and beards hanging out of
// it, brackets, curtains where the rim is. Density rises toward the rim: the
// middle of a big underside is in permanent dark and grows almost nothing.
HYPERJUNGLE.dressSoffits=function(geos,opt){opt=opt||{};
 const S=BIO.downFaces(geos,opt.n||400,.6);if(!S.length)return;
 let cx=0,cz=0;S.forEach(f=>{cx+=f.p[0];cz+=f.p[2];});cx/=S.length;cz/=S.length;
 let rMax=1e-6;S.forEach(f=>{f.r=Math.hypot(f.p[0]-cx,f.p[2]-cz);if(f.r>rMax)rMax=f.r;});
 S.forEach(f=>{const u=f.r/rMax,lit=.15+.85*Math.pow(u,1.4);const R=(opt.mossR||5)*(.35+.65*lit);
  const dn=[0,-1,0];moss(f.p,dn,rr(R*.6,R));
  for(let q=0,nq=1+Math.floor(rng()*3);q<nq;q++)moss([f.p[0]+rr(-1,1)*R,f.p[1]-rr(0,.2),f.p[2]+rr(-1,1)*R],dn,rr(R*.25,R*.8));
  if(rng()<lit*.85)roots([f.p[0],f.p[1]-.15,f.p[2]],rr(4,opt.hang||16)*(.35+.65*lit),rr(.5,2.2));
  if(rng()<lit*.40)curtain([f.p[0],f.p[1]-.2,f.p[2]],f.p[0]-cx,f.p[2]-cz,rr(5,opt.hang||16),rr(2,6),{flowers:rng()<.5});
  if(rng()<.14)bracket([f.p[0],f.p[1]-rr(.5,2),f.p[2]],[0,0,0],rr(1,2.6));});};
// WALLS: vines climbing, brackets, moss streaks under the drips
HYPERJUNGLE.dressWalls=function(geos,opt){opt=opt||{};
 BIO.sideFaces(geos,opt.n||160).forEach(f=>{const k=rng();
  if(k<.45)curtain([f.p[0]+f.n[0]*.3,f.p[1],f.p[2]+f.n[2]*.3],f.n[0],f.n[2],rr(3,opt.hang||12),rr(1.5,4),{});
  else if(k<.7)bracket([f.p[0],f.p[1],f.p[2]],f.n,rr(.8,2.2));
  else moss([f.p[0]+f.n[0]*.05,f.p[1],f.p[2]+f.n[2]*.05],f.n,rr(.8,2));});};
HYPERJUNGLE.dressGeos=function(geos,opt){opt=opt||{};reseed(650001+(opt.seed||0));
 HYPERJUNGLE.dressLedges(geos,opt.ledges||{});HYPERJUNGLE.dressSoffits(geos,opt.soffits||{});HYPERJUNGLE.dressWalls(geos,opt.walls||{});};
})();

// ==================== 70-biome-hyperjungle.js
// ================================================================= HYPERJUNGLE — build / dress / canopyH
// The biome's public surface (BIOME-API.md). The passes live in 55 (trees),
// 58 (fauna), 60 (floor) and 65 (dress); this file only orders them and
// reports. opt.fauna:false leaves the animals out.
HYPERJUNGLE.build=function(opt){opt=opt||{};const R=opt.R||3000,q=opt.quality==null?1:opt.quality,heroR=opt.heroR||1400;
 const out={R,quality:q,trees:0,hyper:0,far:0,under:0};
 if(HYPERJUNGLE.buildTrees){BIO.cur='jungle/trees';Object.assign(out,HYPERJUNGLE.buildTrees(R,heroR,q));}
 if(HYPERJUNGLE.buildFloor){BIO.cur='jungle/floor';Object.assign(out,HYPERJUNGLE.buildFloor(R,q));}
 if(HYPERJUNGLE.buildFauna&&opt.fauna!==false){BIO.cur='jungle/fauna';Object.assign(out,HYPERJUNGLE.buildFauna(R,heroR,q));}
 BIO.cur=null;return out;};
HYPERJUNGLE.dress=function(geos,opt){if(HYPERJUNGLE.dressGeos){BIO.cur='jungle/dress';HYPERJUNGLE.dressGeos(geos,opt||{});BIO.cur=null;}};
HYPERJUNGLE.canopyH=function(x,z){return HYPERJUNGLE._canopyH?HYPERJUNGLE._canopyH(x,z):60;};
BIO.kitEnd(HYPERJUNGLE);   // its exports run in its registry; the default kit is current again

// ==================== 82-host-sky.js
// ================================================================= HOST — Krator sky (from the Hexahedron)
// Baked equirectangular dome (haze column, sun, cumulus, the volcano due south)
// and the gas giant as real geometry. Host-only: a biome never touches the sky.
const skyTex=BIO.canvasTex(4096,2048,(g,w,h)=>{
 const HZ=h*.5,DEG=h/180;
 // --- the column: 1.9 atm, so a milky zenith and a thick haze band ---------
 const grd=g.createLinearGradient(0,0,0,h);
 grd.addColorStop(0.00,'#5d7ba2');grd.addColorStop(0.14,'#6f8aa9');
 grd.addColorStop(0.30,'#8fa4b7');grd.addColorStop(0.42,'#aebdc2');
 grd.addColorStop(0.478,'#ccd6c9');grd.addColorStop(0.497,'#dde3d2');
 grd.addColorStop(0.503,'#c9d3c0');grd.addColorStop(0.60,'#93a48c');
 grd.addColorStop(0.78,'#6d8068');grd.addColorStop(1.00,'#53664f');
 g.fillStyle=grd;g.fillRect(0,0,w,h);
 const wrapE=(x,y,rx,ry,f)=>{g.fillStyle=f;for(let k=-1;k<=1;k++){
  g.beginPath();g.ellipse(x+k*w,y,rx,ry,0,0,TAU);g.fill();}};
 // --- THE SUN, at the azimuth the directional light actually uses ----------

// ==================== 90-host-camera.js
// ================================================================= HOST — camera, inspector, loop
const ctl={target:new THREE.Vector3(0,60,0),theta:0,phi:1.1,radius:600};
function setView(cx,cy,cz,tx,ty,tz){ctl.target.set(tx,ty,tz);const dx=cx-tx,dy=cy-ty,dz=cz-tz;ctl.radius=Math.sqrt(dx*dx+dy*dy+dz*dz);ctl.theta=Math.atan2(dx,dz);ctl.phi=Math.acos(clamp(dy/ctl.radius,-1,1));}
function applyCam(){const r=ctl.radius,sp=Math.sin(ctl.phi);camera.position.set(ctl.target.x+r*sp*Math.sin(ctl.theta),ctl.target.y+r*Math.cos(ctl.phi),ctl.target.z+r*sp*Math.cos(ctl.theta));
 const g=terrainH(camera.position.x,camera.position.z)+1.8;if(camera.position.y<g)camera.position.y=g;camera.lookAt(ctl.target);}
const VIEWS={
 'The hyperjungle':[-1400,120,-1300,-200,140,-200],
 'Under the canopy':[-420,14,-520,-180,60,-300],
 'Forest floor':[-230,4,-280,-120,8,-190],
 'A hypertree':[420,40,380,180,150,120],
 'The tower':[520,60,-560,240,120,-260],
 'Under the tower':[300,30,-330,240,150,-260],
 'The brook':[-60,9,-420,60,6,-200],
 'Canopy top':[-900,420,600,0,300,0],
 'From afar':[-2600,260,-2400,0,180,0],
 'Krator rising':[-600,120,600,1900,900,-2100],
};
// views on the newer species and the fauna, found from the built forest: the
// hero of that species nearest the origin, seen from 2.4 crown radii away
(function(){const TR=HYPERJUNGLE.TREES||[];
 const nearest=sp=>{let b=null;for(const T of TR){if(!T.hero||T.sp!==sp)continue;if(!b||Math.hypot(T.x,T.z)<Math.hypot(b.x,b.z))b=T;}return b;};
 const add=(name,T,k,hK)=>{if(!T)return;const d=T.crownR*k,a=Math.atan2(-T.z,-T.x)+.5;VIEWS[name]=[T.x+Math.cos(a)*d,T.y0+T.H*hK,T.z+Math.sin(a)*d,T.x,T.y0+T.H*.72,T.z];};
 add('A mahogany',nearest(4),2.4,.45);add('A kapok',nearest(5),2.4,.35);
 const M=nearest(4);if(M)VIEWS['Mahogany buttresses']=[M.x+M.rb*5,M.y0+9,M.z+M.rb*3,M.x,M.y0+14,M.z];
 const rg=typeof REG!=='undefined'?REG:[];const herd=rg.find(r=>r.kind==='fauna'&&/herd/.test(r.name)),flock=rg.find(r=>r.kind==='fauna'&&/flock/.test(r.name));
 if(herd)VIEWS['A herd']=[herd.x+70,herd.y+14,herd.z+40,herd.x,herd.y+4,herd.z];
 if(flock)VIEWS['Sky rays']=[flock.x-flock.r*1.2,flock.y+20,flock.z-flock.r*.4,flock.x,flock.y+60,flock.z];})();
const ui=document.getElementById('ui');const sel=document.createElement('select');sel.id='viewsel';for(const k in VIEWS){const o=document.createElement('option');o.textContent=k;sel.appendChild(o);}sel.onchange=()=>setView(...VIEWS[sel.value]);ui.appendChild(sel);
// hidden buttons, one per preset: verify.py drives the views through these
const _hb=document.createElement('div');_hb.style.display='none';ui.appendChild(_hb);for(const k in VIEWS){const b=document.createElement('button');b.textContent=k;b.onclick=()=>setView(...VIEWS[k]);_hb.appendChild(b);}
const insp=document.getElementById('insp');const ray=new THREE.Raycaster();
function inspectAt(cx,cy){const v=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);
 const hits=ray.intersectObjects(scene.children,true).filter(h=>!h.object.userData.probeSkip||h.object.userData.inspectLabel);
 if(!hits.length){insp.textContent='(nothing)';return;}const p=hits[0].point,o=hits[0].object;
 let best=null;for(const r of REG){const dx=p.x-r.x,dz=p.z-r.z;if(dx*dx+dz*dz<=r.r*r.r&&p.y>=(r.y||0)-2&&p.y<=(r.y||0)+r.h+5){if(!best||r.r<best.r)best=r;}}
 insp.textContent=(best?best.name:(o.userData.inspectLabel||o.name||'mesh'))+'\n'+p.x.toFixed(0)+', '+p.y.toFixed(0)+', '+p.z.toFixed(0)+'  range '+camera.position.distanceTo(p).toFixed(0)+' m';}
setView(...VIEWS[Object.keys(VIEWS)[0]]);
const cv=renderer.domElement;let drag=null;const keys={};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,b:e.button};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{if(drag&&drag.b===0&&Math.abs(e.clientX-drag.sx)<4&&Math.abs(e.clientY-drag.sy)<4)inspectAt(e.clientX,e.clientY);drag=null;});cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.b===0){ctl.theta-=dx*.005;ctl.phi=clamp(ctl.phi-dy*.005,.05,Math.PI-.05);}
 else{const f=ctl.radius*.0015;const rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta));
  ctl.target.addScaledVector(rt,-dx*f).addScaledVector(fw,-dy*f);}});
cv.addEventListener('wheel',e=>{ctl.radius=clamp(ctl.radius*(e.deltaY>0?1.1:.9),3,6000);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hud=document.getElementById('hud');let last=performance.now(),renderErr=false;
function frame(){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 const sp=ctl.radius*.6*dt;const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta)),rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));
 if(keys.w)ctl.target.addScaledVector(fw,sp);if(keys.s)ctl.target.addScaledVector(fw,-sp);if(keys.d)ctl.target.addScaledVector(rt,sp);if(keys.a)ctl.target.addScaledVector(rt,-sp);
 if(keys.q)ctl.target.y-=sp;if(keys.e)ctl.target.y+=sp;
 for(let i=0;i<TICKS.length;i++){try{TICKS[i](dt,now/1000);}catch(e){if(!renderErr){renderErr=true;reportErr('tick: '+e.stack);}}}
 applyCam();if(typeof sky!=='undefined'){sky.position.copy(camera.position);giant.position.copy(camera.position).addScaledVector(giantDir,GIANT_DIST);giantRing.position.copy(giant.position);}
 try{renderer.render(scene,camera);}catch(e){if(!renderErr){renderErr=true;reportErr('render: '+e.stack);}}
 hud.textContent=`cam ${camera.position.x|0},${camera.position.y|0},${camera.position.z|0}  tgt ${ctl.target.x|0},${ctl.target.y|0},${ctl.target.z|0}\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles/1e6).toFixed(2)}M  inst ${window._instances}`;
 requestAnimationFrame(frame);}
frame();window._ready=true;

// ==================== 91-host-probe.js
// ================================================================= HOST — probe (window._api)
// What verify.py --assert measures. Budgets per biome pass come from
// BIO.stats (charged by BIO.cur inside the biome).
// Raised from 5M / 1.4M per pass when the belt grew to six hypertree species,
// a 2 km hero disc, the extra understorey and the fauna (Sep 2026).
const BUDGET={
 showcase:{tris:11000000,calls:140},
 cls:{pass:6500000,host:600000},
 type:{'jungle/hyper':'pass','jungle/trees':'pass','jungle/floor':'pass','jungle/far':'pass','jungle/dress':'pass','jungle/fauna':'pass','host':'host'},
};
function _probePoints(){
 const pts=[],m=new THREE.Matrix4(),pos=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),bb=new THREE.Box3();
 scene.traverse(o=>{if(o.userData&&o.userData.probeSkip)return;
  if(o.isInstancedMesh){for(let i=0;i<o.count;i++){o.getMatrixAt(i,m);m.decompose(pos,q,sc);pts.push([pos.x,pos.y,pos.z]);}return;}
  if(!o.isMesh)return;bb.setFromObject(o);if(!isFinite(bb.min.x)||!isFinite(bb.max.x))return;
  pts.push([(bb.min.x+bb.max.x)/2,(bb.min.y+bb.max.y)/2,(bb.min.z+bb.max.z)/2]);});
 return pts;}
function regOccupancy(){const n=new Array(REG.length).fill(0);const P=_probePoints();
 REG.forEach((r,i)=>{for(const p of P){const dx=p[0]-r.x,dz=p[2]-r.z;if(dx*dx+dz*dz<=r.r*r.r&&p[1]>=(r.y||0)-2&&p[1]<=(r.y||0)+r.h+5)n[i]++;}});
 return REG.map((r,i)=>({name:r.name,type:r.type,n:n[i]}));}
function nanSweep(){const bad=[];let badInst=0;
 scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;if(o.userData&&o.userData.probeSkip)return;
  const p=o.geometry&&o.geometry.attributes&&o.geometry.attributes.position;if(p){const a=p.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){bad.push({geo:o.name||o.geometry.type,at:i});break;}}
  if(o.isInstancedMesh){const a=o.instanceMatrix.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){badInst++;break;}}});
 return {meshes:bad.length,first:bad.slice(0,8),instances:badInst,firstInstances:[]};}
function typeStats(){const out={};for(const k in BIO.stats){const t=BIO.stats[k],cls=BUDGET.type[k]||'pass';out[k]={tris:t.tris,inst:t.inst,meshes:t.meshes,cls,limit:BUDGET.cls[cls],over:t.tris>BUDGET.cls[cls]};}return out;}
window._api={BUDGET,REG,
 get totals(){const t=BIO.totals();return {tris:t.tris,inst:t.inst,meshes:t.meshes,registered:REG.length,types:Object.keys(BIO.stats).length};},
 typeStats,regOccupancy,nanSweep,
 setView:(cx,cy,cz,tx,ty,tz)=>setView(cx,cy,cz,tx,ty,tz),views:()=>Object.keys(VIEWS),
 biome:()=>window._biome};
window._registered=REG.length;
</script>
