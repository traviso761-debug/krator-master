<script>

// ==================== 10-core-head.js
// ================================================================= BIOME CORE — head
// The engine-independent kit every Krator biome fragment is written against.
// Nothing below names a world's kit. The host hands in what a biome needs
// through BIO.init(...) (see BIOME-API.md) and everything else lives here.
var BIO={host:null,stats:{},cur:null,version:'core-1'};
// EVERYTHING BELOW IS LOCAL. The core declares no generic global (rng, clamp,
// TAU...): a world that already has those would be clobbered. Biome fragments
// pull what they need from BIO.fn at the top of their own closure.
(function(){
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, mix=lerp;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---------------------------------------------------------------- PRNG
// The biome's OWN stream. A host that adds a biome must not see its rubble
// move, so the biome never draws from the host's generator.
let _bseed=1234567;
function reseed(s){_bseed=s>>>0;}
function rng(){_bseed|=0;_bseed=_bseed+0x6D2B79F5|0;let t=Math.imul(_bseed^_bseed>>>15,1|_bseed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rng();}
function ri(a,b){return a+Math.floor(rng()*(b-a+1));}
function pick(arr){return arr[Math.floor(rng()*arr.length)%arr.length];}

// ---------------------------------------------------------------- noise
function h3(x,y,z){const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);}
// Each h3 is a Math.sin, and sampling a terrain or a texture asks for the same lattice cells again and again: a
// cell's eight corners are kept in a small direct-mapped cache (exact: the same h3 values, the same arithmetic in
// the same order, so the same results bit for bit). It was most of every biome's load.
var _vnK,_vnV;
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
 if(_vnK===undefined){_vnK=new Float64Array(4096*3).fill(NaN);_vnV=new Float64Array(4096*8);}
 const s=(Math.imul(xi|0,73856093)^Math.imul(yi|0,19349663)^Math.imul(zi|0,83492791))&4095,k=s*3,o=s*8,V=_vnV;
 if(_vnK[k]!==xi||_vnK[k+1]!==yi||_vnK[k+2]!==zi){_vnK[k]=xi;_vnK[k+1]=yi;_vnK[k+2]=zi;
  V[o]=h3(xi,yi,zi);V[o+1]=h3(xi+1,yi,zi);V[o+2]=h3(xi,yi+1,zi);V[o+3]=h3(xi+1,yi+1,zi);
  V[o+4]=h3(xi,yi,zi+1);V[o+5]=h3(xi+1,yi,zi+1);V[o+6]=h3(xi,yi+1,zi+1);V[o+7]=h3(xi+1,yi+1,zi+1);}
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const a=V[o]+(V[o+1]-V[o])*u,b=V[o+2]+(V[o+3]-V[o+2])*u,c=V[o+4]+(V[o+5]-V[o+4])*u,d=V[o+6]+(V[o+7]-V[o+6])*u;
 const e=a+(b-a)*v,f=c+(d-c)*v;return e+(f-e)*w;}
function fbm(x,y,z,o){o=o||3;let a=0,f=1,s=0;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f)/f;s+=1/f;f*=2.03;}return a/s;}

// ---------------------------------------------------------------- host binding
// host = { THREE, scene, terrainH(x,z), mask(x,z), obstacles[], ticks(fn), seed,
//          origin[x,z] | [[x,z]...], center, fields{}, waterH(x,z), register(o),
//          lod{}, windows{}, eye(), err(msg), stat(key,tris,inst) }   (BIOME-API.md)
BIO.init=function(h){
 if(!h||!h.THREE)throw new Error('BIO.init: host needs THREE');
 // scene may arrive later (a world that creates its scene after its kit loads
 // calls BIO.setScene before build); it is only needed at bake
 BIO.host={
  THREE:h.THREE,scene:h.scene||null,
  terrainH:h.terrainH||((x,z)=>0),
  // the default mask: everything may root, or, when the host hands in its water
  // (sedesert-1), nothing roots under the local water surface. A world with
  // footprints or its own rule passes its own.
  mask:h.mask||(h.waterH?((x,z)=>{const d=BIO.terrainH(x,z)-BIO.waterH(x,z);return d<.15?0:d<.7?(d-.15)/.55:1;}):((x,z)=>1)),
  obstacles:h.obstacles||[],
  ticks:h.ticks||(fn=>{}),
  seed:h.seed==null?1:h.seed,
  // origin: [x,z] or a LIST of [x,z] -- the LOD curve is measured from the
  // nearest one, so a long showcase (a lake shore, a river) can keep detail
  // along a spine instead of round one point. center: the disc the grids
  // cover (default: the first origin).
  origin:(h.origin&&typeof h.origin[0]==='number')?[h.origin]:(h.origin||[[0,0]]),
  center:h.center||null,
  // fields: optional climate fields a multi-zone biome asks for, each
  // (x,z)->0..1. Missing ones fall back to BIO.fieldDefault. wet: 0 arid ..
  // 1 saturated; salt: 0 .. 1 crust; upland: 0 basin floor .. 1 the high edge;
  // flow: 0 still .. 1 a bank; mist: 0 .. 1 the cloud-forest band.
  fields:h.fields||{},
  // waterH(x,z) (sedesert-1, additive): the LOCAL water surface. The earlier kits keep
  // their water at y=0 (the default); a stream that descends, or a tarn in a hollow,
  // hands its own level in, and a biome reads depth as BIO.depth = waterH - terrainH.
  // Where there is no water at all the host returns -1e9.
  waterH:h.waterH||((x,z)=>0),
  // register(o) (sedesert-1, additive): a volume the world's inspector and probe can name
  // ({name,key,x,z,y,r,h}); a world without an inspector leaves it out
  register:h.register||(o=>{}),
  // lod (sedesert-1): the detail radii from the spine, a property of the world's spine, not of
  // a species pass: hero (full detail), mid, far (impostors stop), floor bands. BIO.radii().
  lod:Object.assign({hero:800,mid:1500,far:2200,floor:[500,1250]},h.lod||{}),
  // windows (sedesert-1): named rectangles [x0,z0,x1,z1] a biome may ask for (BIO.window('water')):
  // where the world's water is, so a water-bound pass looks nowhere else
  windows:h.windows||{},
  // eye (swbay-1): optional ()->[x,y,z], where the viewer is right now. Only a pass that
  // animates (fauna) reads it, to leave what is far alone; null means no LOD.
  eye:h.eye||null,
  // clock / wind (one world, one wind: biomes/WORLD.md): clock()->seconds drives the foliage's sway
  // instead of the core's own clock; wind()->[x,z] (1 = the calm breeze) bends it downwind. A world
  // with core/atmos binds clock:()=>ATMOS.clock.t and wind:()=>the base wind over its calm length.
  clock:h.clock||null,wind:h.wind||null,
  err:h.err||(m=>console.error(m)),
  stat:h.stat||null};

 return BIO;};
BIO.setScene=function(s){BIO.host.scene=s;};
BIO.err=function(m){if(BIO.host)BIO.host.err(m);else console.error(m);};
BIO.terrainH=function(x,z){return BIO.host?BIO.host.terrainH(x,z):0;};
BIO.mask=function(x,z){return BIO.host?BIO.host.mask(x,z):1;};
BIO.waterH=function(x,z){return BIO.host?BIO.host.waterH(x,z):0;};
// depth of the ground under the local water surface (negative: above it)
BIO.depth=function(x,z){return BIO.waterH(x,z)-BIO.terrainH(x,z);};
BIO.register=function(o){if(BIO.host)BIO.host.register(o);};
// the detail radii (sedesert-1, where it was BIO.LOD(); BIO.LOD is the runtime LOD's settings)
BIO.radii=function(){return BIO.host?BIO.host.lod:{hero:800,mid:1500,far:2200,floor:[500,1250]};};
BIO.window=function(n){return (BIO.host&&BIO.host.windows[n])||null;};
BIO.eye=function(){return BIO.host&&BIO.host.eye?BIO.host.eye():null;};
// the bounding box of the LOD spine, padded: every point within `pad` of an origin lies inside it
BIO.originBox=function(pad){const O=BIO.host?BIO.host.origin:[[0,0]];let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;for(const o of O){x0=Math.min(x0,o[0]);z0=Math.min(z0,o[1]);x1=Math.max(x1,o[0]);z1=Math.max(z1,o[1]);}return[x0-pad,z0-pad,x1+pad,z1+pad];};
// distance from the LOD origin, for the detail curve
BIO.lodD=function(x,z){const O=BIO.host?BIO.host.origin:[[0,0]];let m=1e9;for(let i=0;i<O.length;i++){const d=Math.hypot(x-O[i][0],z-O[i][1]);if(d<m)m=d;}return m;};
BIO.center=function(){const h=BIO.host;return h?(h.center||h.origin[0]):[0,0];};
// flow and mist are additive (rift-1): a river bank, and the cloud-forest band a ridge wears on its wet face.
// cold and rock are additive (nhighlands-1): 0 temperate .. 1 boreal (altitude and aspect: the boreal band
// comes down lower on the north-facing slopes), and 0 soil .. 1 boulder ground and crag. An older biome
// never reads them; a host that never heard of them gets 0 for both.
BIO.fieldDefault={wet:(x,z)=>BIO.terrainH(x,z)<2?1:.6,salt:(x,z)=>0,upland:(x,z)=>0,flow:(x,z)=>0,mist:(x,z)=>0,cold:(x,z)=>0,rock:(x,z)=>0};
// a field a world does not bind is 0, except the ones with a meaningful default (sedesert-1)
const ZEROF=(x,z)=>0;
BIO.field=function(n,x,z){const f=BIO.host&&BIO.host.fields[n];return f?f(x,z):(BIO.fieldDefault[n]||ZEROF)(x,z);};
BIO.hasField=function(n){return !!(BIO.host&&BIO.host.fields[n]);};
// LOD is a CURVE, not two steps: full detail under ~700 m, a quarter by 3 km.
BIO.lod=function(x,z){return clamp(1.18-BIO.lodD(x,z)/2600,.22,1);};

// ---------------------------------------------------------------- accounting
// Every instance and merged triangle is charged to BIO.cur ('jungle/hyper',
// 'jungle/floor'...), so a probe can assert per-pass budgets.
BIO.tally=function(tris,inst,meshes){const k=BIO.cur||'biome';
 const t=BIO.stats[k]||(BIO.stats[k]={tris:0,inst:0,meshes:0});
 t.tris+=tris||0;t.inst+=inst||0;t.meshes+=meshes||0;
 if(BIO.host&&BIO.host.stat)BIO.host.stat(k,tris||0,inst||0);};
BIO.totals=function(){let tris=0,inst=0,meshes=0;for(const k in BIO.stats){tris+=BIO.stats[k].tris;inst+=BIO.stats[k].inst;meshes+=BIO.stats[k].meshes;}return{tris,inst,meshes};};

BIO.fn={TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm};
})();

// ==================== 20-core-kit.js
// ================================================================= BIOME CORE — kit
// Two ways to put geometry in the world, both cheap:
//   INSTANCED ITEMS   BIO.def(name,geo,mat) once, BIO.put(name,...) thousands of
//                     times, one InstancedMesh per item at bake. Per-instance
//                     colour, and optional per-instance extras (aN normal, aC2
//                     second colour) for the foliage shaders, or any other
//                     named vec4 (aP0, aP1...) for the animation shaders.
//   MERGED BUCKET     BIO.tri/quad/tube/lathe/surf write vertex-coloured
//                     triangles into a bucket per material family; one Mesh per
//                     family at bake. Boles, limbs, logs, boulders go here.
// Both are charged to BIO.cur by the accounting in 10-core-head.js.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm}=BIO.fn;
// ---------------------------------------------------------------- kits (namespaces)
// Several kits can share one page (biomes/WORLD.md), and two kits may both call an item
// 'trunk' or a bucket 'bark0'. Each kit has its own REGISTRY of item definitions, their
// instances and its buckets: BIO.kit(name) makes `name` current, so BIO.defs, BIO.items,
// BIO.order and BIO.buckets point at its registry and BIO.kitName names it (material
// cache keys carry it). It returns the kit that was current. A kit calls it at the top of
// its first fragment and BIO.kitEnd(api) at the end of its last (after 75, if it has fauna): that wraps every function on its
// export object (build, dress...) to run in its registry, and restores the default kit.
// A page that never calls it works in the default kit '' exactly as before.
BIO.kits={};BIO.kitName=null;
BIO.kit=function(name){name=name||'';const prev=BIO.kitName;if(name===prev)return prev;let R=BIO.kits[name];
 if(!R)R=BIO.kits[name]={defs:{},items:{},order:[],buckets:{}};
 BIO.defs=R.defs;BIO.items=R.items;BIO.order=R.order;BIO.buckets=R.buckets;BIO.kitName=name;return prev;};
BIO.kitWrap=function(name,api){for(const k of Object.keys(api)){const f=api[k];if(typeof f!=='function'||f._kit!=null)continue;
  const w=function(){const prev=BIO.kit(name);try{return f.apply(this,arguments);}finally{BIO.kit(prev);}};w._kit=name;api[k]=w;}
 return api;};
BIO.kitEnd=function(api){const name=BIO.kitName;if(api)BIO.kitWrap(name,api);BIO.kit('');return api;};
// a material cache key in the current kit's name ('' adds nothing)
BIO.kitKey=function(k){return BIO.kitName?BIO.kitName+'|'+k:k;};
BIO.kit('');
// GROWABLE FLOAT32 STORES (nhighlands-1, internal): the items' matrices and colours and the buckets' vertices
// were plain arrays of doubles, eight bytes a float and a page crash at ~16M triangles on a 43 km^2 map. These
// keep four bytes a float and the same push() the builders already call; bake reads .a.
function F32(){this.a=new Float32Array(4096);this.length=0;}
F32.prototype.push=function(){const n=arguments.length;let a=this.a;if(this.length+n>a.length){const b=new Float32Array(Math.max(a.length*2,this.length+n));b.set(a);this.a=a=b;}
 for(let i=0;i<n;i++)a[this.length++]=arguments[i];return this.length;};
// sedesert's Store, merged (sedesert-1): the same store under its name, with its n and data()
Object.defineProperty(F32.prototype,'n',{get:function(){return this.length;}});
F32.prototype.data=function(){return this.a.slice(0,this.length);};   // a copy: the store can be dropped after bake
BIO.F32=F32;BIO.Store=F32;
// x: the extra named vec4 attributes an item asked for (hyperjungle-1: aP0, aP1 for 35-core-anim)
const newItem=attrs=>{const it={m:new F32(),c:new F32(),n:new F32(),c2:new F32(),x:{},k:[],count:0};
 if(attrs)attrs.forEach(a=>{if(a!=='aN'&&a!=='aC2')it.x[a]=new F32();});return it;};
BIO.def=function(name,geo,mat,opt){opt=opt||{};
 if(BIO.defs[name])BIO.err('BIO.def: '+name+' defined twice');
 const g=geo.index?geo.toNonIndexed():geo;
 BIO.defs[name]={geo:g,mat,tris:g.attributes.position.count/3,attrs:opt.attrs||null,label:opt.label||name};
 BIO.items[name]=newItem(opt.attrs);BIO.order.push(name);};
const _bm=new (function(){return {}})();   // scratch holder, filled after THREE binds
BIO._scratch=function(){const T=BIO.host.THREE;if(!_bm.m){_bm.m=new T.Matrix4();_bm.q=new T.Quaternion();_bm.e=new T.Euler();_bm.p=new T.Vector3();_bm.s=new T.Vector3();_bm.c=new T.Color();_bm.up=new T.Vector3(0,1,0);_bm.v=new T.Vector3();}return _bm;};
// rotation helpers: qEuler(rx,ry,rz) or qFacing([nx,ny,nz]) (local +z toward n)
function qEuler(rx,ry,rz){const S=BIO._scratch();S.e.set(rx||0,ry||0,rz||0,'YXZ');return new BIO.host.THREE.Quaternion().setFromEuler(S.e);}
function qFacing(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1),v);}
function qUp(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),v);}
// put(name, [x,y,z], quat|null, [sx,sy,sz]|s, colour(hex|Color|null), extra{n:[..], c2:hex})
BIO.put=function(name,pos,q,sc,col,extra){
 const it=BIO.items[name];if(!it){BIO.err('BIO.put: no item '+name);return;}
 if(!(isFinite(pos[0])&&isFinite(pos[1])&&isFinite(pos[2]))){BIO.err('BIO.put: NaN position for '+name);return;}
 const S=BIO._scratch();
 S.p.set(pos[0],pos[1],pos[2]);
 if(typeof sc==='number')S.s.set(sc,sc,sc);else S.s.set(sc[0],sc[1],sc[2]);

 else{if(col.isColor)S.c.copy(col);else S.c.set(col);S.c.convertSRGBToLinear();it.c.push(S.c.r,S.c.g,S.c.b);}

  if(def.attrs.indexOf('aN')>=0){const n=(extra&&extra.n)||[0,1,0];it.n.push(n[0],n[1],n[2]);}
  if(def.attrs.indexOf('aC2')>=0){const c2=extra&&extra.c2;if(c2==null)it.c2.push(S.c.r,S.c.g,S.c.b);else{if(c2.isColor)S.c.copy(c2);else S.c.set(c2);S.c.convertSRGBToLinear();it.c2.push(S.c.r,S.c.g,S.c.b);}}
  for(const a in it.x){const v=(extra&&extra[a])||[0,0,0,0];it.x[a].push(v[0]||0,v[1]||0,v[2]||0,v[3]||0);}}

// a beam of instanced item `name` (a unit cylinder along y, centred) from a to b
BIO.beam=function(name,a,b,r0,r1,col){const T=BIO.host.THREE,S=BIO._scratch();

 S.v.set(dx/L,dy/L,dz/L);const q=new T.Quaternion().setFromUnitVectors(S.up,S.v);
 BIO.put(name,[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],q,[r0*2,L,(r1==null?r0:r1)*2],col);};

// ---------------------------------------------------------------- merged buckets
BIO.bucket=function(fam,mat,opt){opt=opt||{};

const _lc={r:1,g:1,b:1};
// COLOURS ARE sRGB IN, LINEAR OUT. r128 sends instance and vertex colours to
// the shader untouched, and the renderer encodes its output to sRGB, so a raw
// hex would render a stop too bright. Everything passed here is a designer's
// sRGB colour (hex, Color, or [r,g,b] already linear) and is converted once.
function _col3(c){const S=BIO._scratch();if(c==null)return[1,1,1];if(Array.isArray(c))return c;
 if(c.isColor)S.c.copy(c);else S.c.set(c);S.c.convertSRGBToLinear();return[S.c.r,S.c.g,S.c.b];}
// one triangle, flat normal unless `n` is given; a,b,c CCW from outside

// ================================================================= BIOME CORE — strata (layered sedimentary rock)
// One shader function for every surface that shows bedded rock: the host's

// What makes it read as rock rather than as a stack of paint:
//   - a COLUMN of beds of irregular thickness (thick cross-bedded sandstones,
//     thin dark shales and mudstones, bleached bands), seeded, baked into a
//     1 x 1024 texture that repeats every `columnM` metres;
//   - the beds DIP gently and WARP (two octaves of noise in plan), so a bed
//     line wanders across a face instead of running level;
//   - LAMINAE inside every bed and CROSS-BEDDING on the sandstones;
//   - COLOUR THAT DRIFTS ALONG A BED: iron staining warms and cools each bed
//     in patches tens of metres long, so no band is one flat colour;
//   - DESERT VARNISH: dark streaks hanging from the top of each bed and fading
//     down it (the water that leaves them runs off the ledge above);
//   - SAND: dust settles on every up-facing ledge and banks against the foot;
//     a bleached CAP (the white Navajo-like top of a mesa) where the host asks.
//
//   const S=BIO.strata({seed, columnM, dip:[dx,dz,slope], warp:[m1,m2], palette,
//                       cap:[y0,y1] (bleaching from y0 to y1; off by default),
//                       foot:y (the floor the dust banks on; off by default), dust:0xhex})

//   S.parsVertex / S.vertex       declare and write vSWP, vSWN (world position, normal)
//   S.parsFragment                the function strataColor(vec3 wp, vec3 wn) -> vec3
//   S.inject(shader)              does all three for a stock material and returns the shader

  for(let i=0;i<70;i++){const x=rng()*w,y=rng()*h;g.fillStyle='rgba(185,185,185,'+(.3+rng()*.4).toFixed(2)+')';g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(10,40),y+rr(-3,3));g.lineTo(x+rr(8,30),y+rr(6,16));g.closePath();g.fill();}   // peeling flakes

const G={};
// a TUFT: three crossed vertical quads, origin at the base, up to y=1 (grass, needles, reeds, spires)
G.tuft=function(){const pos=[],uv=[],nor=[];
 for(let k=0;k<3;k++){const a=k/3*Math.PI+.2,ca=Math.cos(a),sa=Math.sin(a);
  const P=[[-.5,0],[.5,0],[.5,1],[-.5,1]].map(q=>[ca*q[0],q[1],sa*q[0],q[0]+.5,1-q[1]]);
  [0,1,2,0,2,3].forEach(i=>{pos.push(P[i][0],P[i][1],P[i][2]);uv.push(P[i][3],P[i][4]);nor.push(-sa,0,ca);});}
 return BIO.geo._make(pos,nor,uv);};
// a ROSETTE (agave / puya): three tiers of stiff pointed leaves, vertex-coloured
// pale at the base and full-colour at the tip, unit radius, origin at the ground
G.agave=function(){const pos=[],nor=[],uv=[],col=[];
 const tiers=[[10,1.0,.35,.34],[8,.72,.62,.3],[6,.44,.95,.24]];
 tiers.forEach((tr,ti)=>{const n=tr[0],R=tr[1],el=tr[2],wd=tr[3];const a0=ti*.27;
  for(let k=0;k<n;k++){const a=a0+k/n*TAU,ca=Math.cos(a),sa=Math.sin(a),px=-sa,pz=ca;
   const tip=[ca*R*Math.cos(el),Math.sin(el)*R+.05,sa*R*Math.cos(el)],mid=[ca*R*.5*Math.cos(el*.7),Math.sin(el*.7)*R*.5+.04,sa*R*.5*Math.cos(el*.7)],base=[ca*.06,.02,sa*.06];
   const W=wd*R;
   const q=[[base[0]-px*W*.3,base[1],base[2]-pz*W*.3],[base[0]+px*W*.3,base[1],base[2]+pz*W*.3],[mid[0]+px*W*.5,mid[1],mid[2]+pz*W*.5],[mid[0]-px*W*.5,mid[1],mid[2]-pz*W*.5],tip];
   const nrm=[-Math.sin(el)*ca,Math.cos(el),-Math.sin(el)*sa];
   const push=(p,c)=>{pos.push(p[0],p[1],p[2]);nor.push(nrm[0],nrm[1],nrm[2]);uv.push(0,0);col.push(c,c,c);};
   push(q[0],.6);push(q[1],.6);push(q[2],.9);push(q[0],.6);push(q[2],.9);push(q[3],.9);
   push(q[3],.9);push(q[2],.9);push(q[4],1.0);}});
 return BIO.geo._make(pos,nor,uv,col);};
// a ribbed succulent COLUMN: unit height (y 0..1), radius .5, domed top, vertex-coloured (ridges light, grooves dark)
G.column=function(){const pos=[],nor=[],uv=[],col=[];const seg=8,prof=[[0,.5],[.55,.49],[.86,.42],[1.0,.22]];
 const ring=(i)=>{const r=[];for(let s=0;s<seg;s++){const a=s/seg*TAU,rib=s%2?1:.84;r.push([Math.cos(a)*prof[i][1]*rib,prof[i][0],Math.sin(a)*prof[i][1]*rib,s%2?1:.78]);}return r;};

// ==================== 55-biome-sedesert-trees.js
// ================================================================= EASTERN HIGH DESERT — trees
// The thirteen tree-scale species of the eastern high desert, each with its
// own builder, placed by zone from the host's climate fields (wet / flow /
// upland / canyon / rim / rock / dune / oasis / slope) and terrainH. The zone
// weights are computed HERE from those fields, never from the host's map: a
// world that binds the same fields gets the same zoning. Beyond the LOD spine
// a tree (not a mesquite shrub) becomes an impostor in the 'far' bucket: blobs
// on a pole, or for the twist-candles spires standing in the local water. The
// small ones thin out with distance as well. Every count scales with q; the
// core charges BIO.cur.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;

const T3=BIO.host.THREE,C=SEDESERT.C;

// ---------------------------------------------------------------- zones from the fields
// Each weight 0..1. A plant's aridity tag is honoured by which weight it reads:
// 'arid' species read scrub / bad / mtn (dry ground only), 'humid' ones bank /
// oasis, 'semiarid' the rim and the benches as well as the floor.
const Y=(x,z)=>BIO.terrainH(x,z);
function zones(x,z){const F=n=>BIO.field(n,x,z);

 const open=(1-can)*(1-dune)*(1-ab),gentle=smooth(.55,.25,slope);
 return{wet,flow,up,can,rim,rock,dune,oasis,slope,ab,
  rip:can*smooth(.5,.85,wet)*gentle,                 // the canyon floor
  bank:can*flow*gentle,                              // its banks
  bench:smooth(.15,.45,can)*smooth(.95,.7,can),      // the walls' benches
  oasis:oasis*(1-can),
  scrub:open*(1-rock*.75)*smooth(.55,.1,up)*(1-oasis*.6)*gentle,
  bad:open*rock*smooth(.6,.2,up),
  mtn:open*smooth(.06,.3,up)*smooth(.95,.6,up),
  desert:dune};}
SEDESERT.zones=zones;
// the scrub's stands: which of the three big succulents dominates here (0 candelabra, 1 cardon, 2 Joshua tree)
SEDESERT.standOf=(x,z)=>BIO.standAt(x,z,3,.0022,71);

// ---------------------------------------------------------------- colour (the maths is the core's, BIO.col)
const {shade,bright,vary,texMean,tint}=BIO.col;
let MEAN=null;
function means(){if(MEAN)return MEAN;MEAN={bark:SEDESERT.BARKTEX.map(t=>texMean(t)),wood:texMean(SEDESERT.WOODTEX),rock:texMean(SEDESERT.ROCKTEX)};return MEAN;}
Object.assign(SEDESERT,{means,tint,bright,shade,vary});
// a species' bark colour on its texture: 39 distinct answers over 130k calls, so memoised
const BARKC={};
const barkCol=(S,k)=>{const key=S.key+(k%S.bark.length);return BARKC[key]||(BARKC[key]=tint(S.bark[k%S.bark.length],means().bark[S.barkK]));};

const rodCol=(S,k)=>shade(C(S.bark[k%S.bark.length]),-.25);
// a leaf colour from a palette: a jittered pick, brightened (the floor and the dressing use it too)
const leafCol=(set,k,dh,ds,dl)=>bright(vary(pick(set),dh==null?.05:dh,ds==null?.14:ds,dl==null?.07:dl),k==null?1.3:k);

const compCol=()=>bright(vary(pick(PAL.comp),.03,.10,.06),1.15);

// ---------------------------------------------------------------- polyline helpers (Girder's)
function treeGrow(o,d,len,r0,r1,n,curve,wig){let sx=-d[2],sz=d[0];const sl=Math.hypot(sx,sz)||1;sx/=sl;sz/=sl;

 for(let k=0;k<=n;k++){const t=k/n,w=(w1*Math.sin(t*Math.PI)+w2*Math.sin(t*TAU))*len;
  pts.push({x:o.x+d[0]*len*t+sx*w,y:o.y+d[1]*len*t+curve*len*t*t,z:o.z+d[2]*len*t+sz*w,r:mix(r0,r1,Math.pow(t,.8))});}

const clear3=(x,y,z,rad,vr)=>BIO.clearOf3(x,y,z,rad,vr);

// ---------------------------------------------------------------- keep-clear between trees
const HC=120,HASH={};
function hkey(x,z){return Math.floor(x/HC)+','+Math.floor(z/HC);}

SEDESERT.blocked=blocked;

// ---------------------------------------------------------------- foliage helpers
function clumpAt(item,x,y,z,size,flat,col,cx,cy,cz,ex,ey){
 const dx=(x-cx)/ex,dy=(y-cy)/ey,dz=(z-cz)/ex,qq=Math.hypot(dx,dy,dz);
 const ao=mix(.55,1,smooth(.3,.95,qq))*mix(.82,1,smooth(-.6,.35,dy))*rr(.9,1.1);

 BIO.put(item,[x,y,z],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),[size,size*flat,size],bright(col,ao),{n:[nx/nn,ny/nn,nz/nn]});}
function frondAt(item,x,y,z,a,L,pitch,col,wid){BIO.put(item,[x,y,z],qEuler(rr(-.1,.1),-a,pitch),[L,L*rr(.85,1.05),L*(wid||rr(1.1,1.4))],col);}
function frondCrown(item,x,y,z,Rf,n,p0,p1,col,wid){const a0=rr(0,TAU);for(let k=0;k<n;k++){const a=a0+k/n*TAU+rr(-.2,.2);frondAt(item,x,y,z,a,Rf*rr(.85,1.1),rr(p0,p1),bright(col,rr(.88,1.1)),wid);}}
// a SCATTER OF BLOOMS in a disc of radius r: one colour per head, every fourth bloom
// shaded (the tree heads); o.flat lays them on the ground with no shading (the floor)
function blooms(x,y,z,r,n,set,sz,o){o=o||{};const c=bright(vary(pick(set||PAL.comp),.03,.1,.08),1.15),tl=o.tilt==null?.5:o.tilt;
 for(let i=0;i<n;i++){const a=rr(0,TAU),d=r*Math.sqrt(rng()),s=sz?rr(sz[0],sz[1]):rr(o.s0==null?.3:o.s0,o.s1==null?.55:o.s1);
  BIO.put('bloom',[x+Math.cos(a)*d,y+(o.flat?rr(0,.4):rr(-.3,.4)*r),z+Math.sin(a)*d],qEuler(rr(-tl,tl),rr(0,TAU),rr(-tl,tl)),s,(o.flat||i%4)?c:shade(c,rr(-.1,.2)));}}
const bloomsAt=blooms;SEDESERT.blooms=blooms;
// the volume the world's inspector names a tree by
const regTree=(T,S,r,h)=>BIO.register({name:S.name,x:T.x,z:T.z,y:T.y0,r:r,h:h});

// ---------------------------------------------------------------- the builders
// Each: (T, st, lv) where T={x,z,y0,sp,H,rb,crownR,seed} and lv 2 near / 1 mid / 0 far
const B=[];

 rings.push({x:top.x,y:top.y,z:top.z,r:rAt(1),yy:boleH,col:barkCol(S,1)},{x:top.x,y:top.y+rAt(1)*.8,z:top.z,r:.05,yy:boleH+1,col:barkCol(S,1)});   // closed with a dome, never an open pipe

 function fork(o,d,lvl,r0){const len=H*S.forkLen[lvl]*rr(.85,1.15)*(lv===2?1:1.25),pts=treeGrow(o,d,len,r0,Math.max(.08,r0*.55),3,cfg.curve==null?.06:cfg.curve,cfg.wig==null?.06:cfg.wig);

   for(let k=-1;k<=1;k+=2){const dd=[d[0]*Math.cos(spread)+side[0]*Math.sin(spread)*k+Math.cos(tw)*.12,d[1]*Math.cos(spread)+(cfg.rise==null?.12:cfg.rise),d[2]*Math.cos(spread)+side[2]*Math.sin(spread)*k+Math.sin(tw)*.12],l=Math.hypot(dd[0],dd[1],dd[2]);

// ---------------------------------------------------------------- impostors (the far canopy)
// far:{spires:n} (the twist-candles): the clump as n twisted three-sided spires, 9 triangles each, set out as
// the hero sets its columns (the main one at the clump's foot, the rest round it). Each stands where the hero's
// column does: rooted in the bed under the LOCAL water (BIO.waterH: the river descends, the pond has its own
// level), its top at the bed + h, so what shows above the water is the hero's. The foot has a 1.5 m skirt: a
// host may draw its ground coarser than terrainH (the ideal host's 17.8 m triangles dip up to ~1.5 m under it on
// a bank), or its water clear, or not at all. A spire the water drowns, or that shows less than 0.8 m over the
// water and the ground, is not built. spiresOf(T) is the layout as data ({x,z,yb,h,foot,top,w,c,q}); it hashes
// the tree's own seed, not the biome's stream, so building one moves nothing else, and a host can lay it out
// for any clump to check it.
function spiresOf(T){const S=SP[T.sp],H=T.H,base=T.y0+.5,o=[];
 const hr=(k,a,b)=>a+(b-a)*h3(T.seed%9973,k,4.7),a0=hr(.5,0,TAU);
 for(let k=0,n=S.far&&S.far.spires||0;k<n;k++){const a=a0+k*GOLD,d=k?T.crownR*hr(k+.1,.2,.9):0,x=T.x+Math.cos(a)*d,z=T.z+Math.sin(a)*d;
  const g=BIO.terrainH(x,z),h=H*(k?hr(k+.2,.4,.9):1),yb=Math.min(g,base)-.2,top=yb+h*1.03;
  if(top-Math.max(BIO.waterH(x,z),g)<.8)continue;
  o.push({x,z,yb,h,foot:yb-1.5,top,w:T.rb*hr(k+.3,.7,1.3)*(.5+.5*h/H),c:(T.seed+k*3)%S.leaf.length,q:hr(k+.4,0,TAU)});}
 return o;}
SEDESERT.spiresOf=spiresOf;
function farSpires(T,st){const K=BIO.bucket('far'),S=SP[T.sp],kk=BIO._lodKey(T.x,T.z);let tris=0;
 const vtx=v=>{K.pos.push(v[0],v[1],v[2]);K.nor.push(v[3],v[4],v[5]);K.uv.push(0,0);K.col.push(v[6],v[7],v[8]);};
 const tri=(a,b,c)=>{vtx(a);vtx(b);vtx(c);K.k.push(kk);tris++;};   // a, b, c counter-clockwise from outside
 for(const P of spiresOf(T)){const c=bright(S.leaf[P.c],1.15).convertSRGBToLinear();
  // a ring at y: three corners on the lobes (the hero's radius x 1.28), turning 1.2 rad over the height as its lobes do
  const ring=y=>{const t=Math.max(0,(y-P.yb)/P.h),r=1.28*P.w*Math.pow(1-.72*t,.7),s=lerp(.66,1,t),o=[];
   for(let j=0;j<3;j++){const an=P.q-1.2*t+j*TAU/3,cx=Math.cos(an),cz=Math.sin(an);o.push([P.x+cx*r,y,P.z+cz*r,cx*.75,.66,cz*.75,c.r*s,c.g*s,c.b*s]);}return o;};
  const A=ring(P.foot),B=ring(P.yb+P.h*.55),tip=[P.x,P.top,P.z,0,1,0,c.r,c.g,c.b];   // the foot, the waist, the tip
  for(let j=0;j<3;j++){const j1=(j+1)%3;tri(A[j],B[j],A[j1]);tri(A[j1],B[j],B[j1]);tri(B[j],tip,B[j1]);}}
 K.tris+=tris;BIO.tally(tris,0,0);st.far+=tris;}
let ICO=null;
function buildFar(T,fi,st){const S=SP[T.sp];if(S.far&&S.far.spires)return farSpires(T,st);
 const K=BIO.bucket('far');if(!ICO)ICO=new T3.IcosahedronGeometry(1,1).attributes.position.array;const ip=ICO;
 const cheap=BIO.lodD(T.x,T.z)>BIO.LOD().far;let tris=0;
 function vtx(x,y,z,nx,ny,nz,r,g,b){K.pos.push(x,y,z);K.nor.push(nx,ny,nz);K.uv.push(0,0);K.col.push(r,g,b);}

   const m=1+.16*Math.sin(dx*4.1+k1)*Math.cos(dz*3.7+k2)+.1*Math.sin(dy*6.3+k2+dx*2);
   const sh=(.55+.45*smooth(-.7,.8,dy))*(.9+.2*Math.sin(dx*9+dz*7+k1)),t=smooth(-.2,.7,dy+.3*Math.sin(dx*5+k2));

  tris+=ip.length/9;}

// ---------------------------------------------------------------- the pass
SEDESERT.buildTrees=function(R,q){

    const lod=BIO.lod(x,z);return a*(opt.lodK?lerp(1,lod,opt.lodK):1)*q;},
   (x,y,z,d)=>{if(blocked(x,z,pad))return;
    const T=mk(x,y,z,sp);
    if(opt.size)opt.size(T,zones(x,z));
    const ld=BIO.lodD(x,z);T.lv=ld<hero?2:(ld<mid?1:0);
    if(T.lv===0&&!(S.far&&(!S.farIf||S.farIf(T))))return;
    TREES.push(T);hadd({x:x,z:z,r:T.rb*1.4+1});n++;},
   {patch:opt.patch==null?.6:opt.patch,patchScale:opt.patchScale||.01,noMask:!!S.depth,depth:S.depth||[-Infinity,-.3],pad:pad+2,box:opt.water?WATER:null});
  return n;}

 return{trees:TREES.length,heroes:st.heroes,far:st.fars,bySpecies:SP.map((S,i)=>S.key+':'+st.byS[i]).join(' '),forks:st.forks,clumps:st.clumps,blooms:st.blooms,pods:st.pods,fronds:st.fronds,columns:st.cols,spikes:st.spikes,candles:st.candles,
  tris:{trunk:st.trunk,limbs:st.limb,far:st.far,small:st.sapTris}};};

// ---------------------------------------------------------------- the passes (data: species, cell, acceptance from the zones, options)

const stand=SEDESERT.standOf;
SEDESERT.PASSES=[

 {sp:0,cell:48,accept:(Z)=>Z.rim*.4+Z.oasis*.45*(1-Z.flow*.6)+Z.bench*.22+Z.mtn*smooth(.22,.5,Z.wet)*.5+Z.rip*.04,opt:{pad:5,patch:.4,patchScale:.008}},

 {sp:6,cell:28,accept:(Z)=>Z.bank*.8+Z.rip*.4+Z.oasis*.5*(1-Z.flow*.5)+Z.scrub*.24*smooth(.08,.45,Z.wet)+Z.bench*.16,opt:{pad:2.5,patch:.45,patchScale:.012,
  size:(T,Z)=>{const S=SP[6],k=smooth(.12,.85,Z.wet);T.H=lerp(S.H[0]*.7,S.H[1],k)*rr(.85,1.1);T.crownR=lerp(S.crownR[0]*.6,S.crownR[1],k)*rr(.85,1.1);T.rb=lerp(S.rb[0],S.rb[1],k);}}},

 {sp:12,cell:16,accept:(Z)=>(Z.bank+Z.oasis*Z.flow)*.45,opt:{pad:1.5,lodK:.5,patch:.5,patchScale:.02,small:true,water:true}},
];
})();

// ================================================================= EASTERN HIGH DESERT — floor
// Everything under the trees, by zone, from the same climate fields the tree
// pass reads (SEDESERT.zones):
//   the SCRUB       spinifex hummocks on the red soil (the character of the
//                   place), dry grass, creosote and saltbush, stands of the
//                   tower of jewels, agaves, barrel cacti, prickly pear, cholla,
//                   hoodia clumps in pink flower, stones and boulders
//   the BADLAND     hoodoos, rubble, boulders, an agave or a barrel in a crack
//   the CANYON      reeds and sedge at the water, dry grass and creosote on the
//                   floor, bleached fallen mesquites, boulders off the walls
//   the POND        reeds round the margin, blooms, a playa of cracked mud
//   the MOUNTAINS   agaves, spinifex, grey boulders and scree
//   the RIM/BENCH   creosote, agave, stones
//   the RED DESERT  almost nothing: a tuft, a stone
// Three LOD bands along the spine (near / mid / far) at 8 / 16 / 32 m cells.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;

const Y=(x,z)=>BIO.terrainH(x,z);
const rockTint=(set,k)=>tint(vary(pick(set||PAL.rock),.02,.06,.06),means().rock,k==null?rr(.35,.6):k);

const blooms=(x,y,z,r,n,set,sz)=>SEDESERT.blooms(x,y,z,r,n,set,sz,{flat:true,tilt:.4,s0:.16,s1:.34});
// a RING SCATTER: n things round (x,z), the first at the centre, the rest dLo..dHi out (two draws each)
// a cluster round a point the mask accepted: each satellite tests the mask itself (a reed
// clump at a reserved place's edge put its outliers inside the place)
function around(x,z,n,dLo,dHi,fn){for(let i=0;i<n;i++){const a=rr(0,TAU),d=i?rr(dLo,dHi):0,px=x+Math.cos(a)*d,pz=z+Math.sin(a)*d;if(i&&BIO.mask(px,pz)<=0)continue;fn(px,pz,i,a);}}

// ---------------------------------------------------------------- fields local to the floor
const echK=(x,z)=>smooth(.5,.64,fbm(x*.0048+3,z*.0048-8,2121,2));      // the tower-of-jewels stands
const hoodK=(x,z)=>smooth(.5,.62,fbm(x*.0052-5,z*.0052+2,3131,2));     // the hoodia patches
const hummK=(x,z)=>fbm(x*.006+21,z*.006+13,777,2);                     // spinifex density
const okGround=(x,z,pad)=>!blocked(x,z,pad)&&BIO.clearOf(x,z,pad);

// cluster spills onto a cliff or into the water otherwise. The arguments (and
// their rr() draws) are evaluated before the test, so the random stream is unchanged.
const putRooted=(x,z,...a)=>{if(BIO.mask(x,z)<=0)return false;BIO.put(...a);return true;};

function tuft(item,x,y,z,h,w,col){BIO.put(item,[x,y-.05,z],qEuler(rr(-.06,.06),rr(0,TAU),rr(-.06,.06)),[w||h*.8,h,w||h*.8],col);}

function hummock(x,y,z,lv,k){const R=rr(.9,2.2)*(k||1),hc=leafCol(PAL.spinifex,1.3,.03);
 if(lv>=1)BIO.put('lobe',[x,y-.4,z],qEuler(0,rr(0,TAU),0),[R*.75,R*.5,R*.75],shade(vary(hc,.02,.08,.05),-.3));

 around(x,z,lv===2?ri(2,4):lv===1?2:1,.7,2.2,(hx,hz,k)=>{if(k&&BIO.depth(hx,hz)>.8)return;tuft('reed',hx,y,hz,h*rr(.75,1.1),h*rr(.7,1.0),leafCol(set,1.3,.025));});}

 if(lv===2){for(let i=0,m=ri(2,4);i<m;i++){const a=rr(0,TAU),d=i?Rs*rr(.3,.7):0,h=Rs*rr(.6,1.1);

  const w=[Z.scrub*.95,Z.bad*.5,Z.rip*1.3,Z.bank*1.2,Z.oasis*1.3,Z.mtn*.6,Z.rim*.7,Z.bench*.5,Z.desert*.1],P=[plantScrub,plantBad,plantRip,plantRip,plantOasis,plantMtn,plantRim,plantRim,plantDune];

// ================================================================= EASTERN HIGH DESERT — growth on structures
// What the high desert does to a building left in it: not much, and slowly.
// Lichen crusts on every sunlit ledge and down the wall under each drip,
// dust and grass in the corners, an agave or a barrel cactus in a crack, a
// desert rose or a young dragon tree where a ledge holds a little soil, and a
// climbing succulent hanging off the odd edge. The soffits stay almost bare.
// The host hands over its shells as BufferGeometry[] in world space; this pass
// samples their faces (BIO.upFaces / downFaces / sideFaces / ledgePoints) and
// grows on them. It never touches the geometry -- a plant is never part of a
// building.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;

const licCol=()=>leafCol(PAL.lichen,1.1,.03,.1,.06);
const vineCol=()=>leafCol(PAL.saltbush,1.2,.03,.08,.05);

// a LICHEN CRUST lying on a surface with normal n
function lichen(p,n,r){const q=qUp(n);const s=r*rr(.7,1.3);

function hangs(p,dx,dz,len,w){const m=Math.hypot(dx,dz);

// a PLANT on a ledge: the floor's own grass, agave, barrel and creosote, at the ledge's scale
function plant(p,s){const k=rng();const y=p[1];
 if(k<.4){for(let i=0,n=1+Math.floor(rng()*3);i<n;i++)tuft('grass',p[0]+rr(-.5,.5)*s,y,p[2]+rr(-.5,.5)*s,s*.8,s*.7,leafCol(PAL.drygrass,1.3,.03,.1,.06));}

function smallTree(p,h){

  const c=bright(vary(pick(PAL.comp),.03,.1,.06),1.15);for(let i=0,n=6+Math.floor(rng()*8);i<n;i++){const a=rng()*TAU,d=h*.35*Math.sqrt(rng());BIO.put('bloom',[p[0]+Math.cos(a)*d,p[1]+h*.6+rr(0,.3)*h,p[2]+Math.sin(a)*d],qEuler(rr(-.5,.5),rng()*TAU,rr(-.5,.5)),rr(.3,.5),c);}}

  const c=C(pick(S.leaf)),n=3+Math.floor(rng()*4);for(let i=0;i<n;i++){const a=i/n*TAU,d=h*.25;BIO.put('strap',[p[0]+Math.cos(a)*d,p[1]+h*.75,p[2]+Math.sin(a)*d],qEuler(rr(-.2,.2),rng()*TAU,rr(-.2,.2)),[h*.35,h*.2,h*.35],c.clone().multiplyScalar(rr(1.1,1.4)),{n:[Math.cos(a)*.5,.8,Math.sin(a)*.5]});}}}
// LEDGES: lichen on the flat, plants toward the outer edge, a succulent hanging off the odd edge
SEDESERT.dressLedges=function(geos,opt){opt=opt||{};

 BIO.upFaces(geos,nL,.6).forEach(f=>lichen(f.p,f.n,rr(.6,opt.lichenR||2)));

// ==================== 82-host-sky.js
// ================================================================= HOST — Krator sky (from the Hexahedron)
// Baked equirectangular dome (a dry, deep-blue column with an ochre dust haze,
// the sun, a few cumulus and cirrus, the Inner Wall mountains standing high in
// the west, the far side of the Abyss a haze line in the east, low mesas on
// every other horizon) and the gas giant as real geometry. Host-only: a biome
// never touches the sky.

// ---------------------------------------------------------------- the Inner Wall painter
// We are on the plateau of the eastern high desert. The Inner Wall -- the
// crater's great rampart -- stands in the west: a range of peaks 14-22 degrees
// high at azimuth 270, falling to a low blue rim to the north and south, and
// nothing to the east but the haze over the Abyss. u = ((270-az)/360) mod 1,
// so west (az 270) is u=0/1; north u=.75, south u=.25, east u=.5.
// how much a dome column at u faces azimuth az0: 1 straight at it, falling off as cos^p
function facing(u,az0,p){const az=((270-u*360)%360+360)%360,d=Math.abs(((az-az0)%360+540)%360-180);return Math.pow(Math.max(0,Math.cos(d*Math.PI/180)),p);}

  g.strokeStyle='rgba('+(rng()<.55?'56,50,58':'168,160,156')+','+(.10+rng()*.22).toFixed(2)+')';g.lineWidth=1+rng()*1.6;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-90,90),y+rr(-8,8));g.stroke();
  if(rng()<.12){g.strokeStyle='rgba(40,36,44,'+(.2+rng()*.22).toFixed(2)+')';g.lineWidth=rr(1.5,3.5);g.beginPath();g.moveTo(x,top+3);g.lineTo(x+rr(-6,6),mix(top,base,rr(.4,.9)));g.stroke();}}

  g.fillStyle='rgba(246,232,214,'+(.42*e).toFixed(2)+')';g.fillRect(x,top,2,3+e*9);
  g.fillStyle='rgba(40,36,44,'+(.2*e).toFixed(2)+')';g.fillRect(x,top+5+e*8,2,4+e*8);}

const skyTex=BIO.canvasTex(4096,2048,(g,w,h)=>{

 grd.addColorStop(0.30,'#6f92c2');grd.addColorStop(0.42,'#9fb4cc');

const look=(cx,cz,dyc,tx,tz,dyt)=>[cx,gh(cx,cz,dyc),cz,tx,gh(tx,tz,dyt),tz];
// the fauna nearest a point: a thermal, a flock, a band (the layout the fauna pass left)
function nearFauna(kind,x,z){const L=(SEDESERT.FAUNA_LAYOUT||{})[kind]||[];let b=null,bd=1e9;for(const f of L){const d=Math.hypot(f.x-x,f.z-z);if(d<bd){bd=d;b=f;}}return b||{x:x,z:z,y0:gh(x,z)+80,r:60,len:80};}
const TH=nearFauna('thermals',BUTTE.x-200,BUTTE.z-400),FL=nearFauna('flocks',POND.x,POND.z),BD=nearFauna('bands',600,zR(600));
// the nearest built hero of a species to a point, so a preset frames a real tree
function nearTree(sp,x,z,minH){return SEDESERT.nearestTree(sp,x,z,minH)||{x:x,z:z,y0:gh(x,z),H:8,crownR:5};}
// a camera d metres from a tree, looking at its crown
function atTree(T,d,az,dy){const cx=T.x+Math.cos(az)*d,cz=T.z+Math.sin(az)*d;return[cx,Math.max(gh(cx,cz,2),T.y0+(dy==null?T.H*.45:dy)),cz,T.x,T.y0+T.H*.6,T.z];}
const rimN=(x,k)=>zR(x)-Wc(x)*(k==null?1.1:k),rimS=(x,k)=>zR(x)+Wc(x)*(k==null?1.1:k);
const VIEWS={
 'The linear oasis':look(400,rimN(400,1.15),10,900,zR(900),4),
 'Dragon trees on the rim':atTree(nearTree(0,-150,rimS(-150,1.1)),42,.6),
 'Mesquite bosque':atTree(nearTree(6,1100,zR(1100)+10,10),46,2.2,5),
 'The wadi gorge':look(-2380,zR(-2380)+26,5,-2650,zR(-2650),12),
 'The rain-shadow pond':[POND.x-230,PL+22,POND.z-190,POND.x+20,PL+.5,POND.z+10],
 'The butte':look(BUTTE.x-1500,BUTTE.z-650,55,BUTTE.x,BUTTE.z,100),
 'Candelabra scrub':atTree(nearTree(1,P_CAND[0],P_CAND[1]),95,2.3),
 'Cardon stand':atTree(nearTree(2,P_CARD[0],P_CARD[1]),80,2.0),
 'Joshua trees':atTree(nearTree(11,P_JOSH[0],P_JOSH[1]),40,2.6),
 'Badlands and hoodoos':look(P_BAD[0]-260,P_BAD[1]+220,60,P_BAD[0]+40,P_BAD[1]-40,12),
 'Quiver trees at the wall foot':atTree(nearTree(5,P_QUIV[0],P_QUIV[1]),60,.2,6),
 'Trackless red desert':look(600,2250,14,900,2950,8),
 'The tower':look(TOWER.x-430,TOWER.z-260,40,TOWER.x,TOWER.z,90),
 'Under the tower':look(TOWER.x+40,TOWER.z-70,4,TOWER.x,TOWER.z,80),
 'Kites in a thermal':[TH.x-TH.r*2.4,gh(TH.x-TH.r*2.4,TH.z+TH.r,14),TH.z+TH.r,TH.x,TH.y0+10,TH.z],
 'Swifts over the water':[FL.x-FL.r*.9,FL.y0+2,FL.z+FL.r*.7,FL.x,FL.y0,FL.z],
 'Sand striders':look(BD.x-24,BD.z+18,2.4,BD.x,BD.z,2.2),
 'The cataract':[FALL.x+420,FALL.y-110,FALL.z+300,FALL.x+60,FALL.y-260,FALL.z],
 'The undercut lip':[LIP.x+150,LIP.floorY+18,LIP.z+110,LIP.x-8,LIP.floorY+24,LIP.z],
 'Behind the cataract':[LIP.x-18,LIP.floorY+9,LIP.z-10,LIP.x+300,LIP.floorY-25,LIP.z+28],
 'Into the Abyss':[3060,gh(3060,zR(3060)-220,26),zR(3060)-220,3700,-140,zR(3150)+60],
 'From afar':look(-2500,2550,360,0,0,40),
 'Krator rising':[-600,gh(-600,600,30),600,1900,900,-2100],
};
const ui=document.getElementById('ui');const sel=document.createElement('select');sel.id='viewsel';for(const k in VIEWS){const o=document.createElement('option');o.textContent=k;sel.appendChild(o);}sel.onchange=()=>setView(...VIEWS[sel.value]);ui.appendChild(sel);
// hidden buttons, one per preset: verify.py drives the views through these
const _hb=document.createElement('div');_hb.style.display='none';ui.appendChild(_hb);for(const k in VIEWS){const b=document.createElement('button');b.textContent=k;b.onclick=()=>setView(...VIEWS[k]);_hb.appendChild(b);}
const insp=document.getElementById('insp');const ray=new THREE.Raycaster();
function inspectAt(cx,cy){const v=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);
 const hits=ray.intersectObjects(scene.children,true).filter(h=>!h.object.userData.probeSkip||h.object.userData.inspectLabel);
 if(!hits.length){insp.textContent='(nothing)';return;}const p=hits[0].point,o=hits[0].object;
 // the smallest registered volume round the point, ignoring the map-wide one
 let best=null;for(const r of REG){if(r.r>1500)continue;if(regHas(r,p.x,p.y,p.z)&&(!best||r.r<best.r))best=r;}
 // a plant names itself (the item's label); a bole or a structure names its registered volume
 const lab=o.userData.inspectLabel||o.name||'mesh',isItem=o.isInstancedMesh&&o.userData.biome;
 let name=isItem?lab+(best?'  (under '+best.name+')':''):(best?best.name+'  ·  '+lab:lab);
 insp.textContent=name+'\n'+p.x.toFixed(0)+', '+p.y.toFixed(0)+', '+p.z.toFixed(0)+'  range '+camera.position.distanceTo(p).toFixed(0)+' m';}
setView(...VIEWS[Object.keys(VIEWS)[0]]);
const cv=renderer.domElement;let drag=null;const keys={};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,b:e.button};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{if(drag&&drag.b===0&&Math.abs(e.clientX-drag.sx)<4&&Math.abs(e.clientY-drag.sy)<4)inspectAt(e.clientX,e.clientY);drag=null;});cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.b===0){ctl.theta-=dx*.005;ctl.phi=clamp(ctl.phi-dy*.005,.05,Math.PI-.05);}
 else{const f=ctl.radius*.0015;const rt=new THREE.Vector3(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));const fw=new THREE.Vector3(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta));
  ctl.target.addScaledVector(rt,-dx*f).addScaledVector(fw,-dy*f);}});
cv.addEventListener('wheel',e=>{ctl.radius=clamp(ctl.radius*(e.deltaY>0?1.1:.9),3,6000);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hud=document.getElementById('hud');let last=performance.now(),renderErr=false,hudText='';
const fw=new THREE.Vector3(),rt=new THREE.Vector3();
function frame(){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 const sp=ctl.radius*.6*dt;fw.set(-Math.sin(ctl.theta),0,-Math.cos(ctl.theta));rt.set(Math.cos(ctl.theta),0,-Math.sin(ctl.theta));
 if(keys.w)ctl.target.addScaledVector(fw,sp);if(keys.s)ctl.target.addScaledVector(fw,-sp);if(keys.d)ctl.target.addScaledVector(rt,sp);if(keys.a)ctl.target.addScaledVector(rt,-sp);
 if(keys.q)ctl.target.y-=sp;if(keys.e)ctl.target.y+=sp;
 for(let i=0;i<TICKS.length;i++){try{TICKS[i](dt,now/1000);}catch(e){if(!renderErr){renderErr=true;reportErr('tick: '+e.stack);}}}
 applyCam();if(typeof sky!=='undefined'){sky.position.copy(camera.position);giant.position.copy(camera.position).addScaledVector(giantDir,GIANT_DIST);giantRing.position.copy(giant.position);}
 try{renderer.render(scene,camera);}catch(e){if(!renderErr){renderErr=true;reportErr('render: '+e.stack);}}
 const ht=`cam ${camera.position.x|0},${camera.position.y|0},${camera.position.z|0}  tgt ${ctl.target.x|0},${ctl.target.y|0},${ctl.target.z|0}\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles/1e6).toFixed(2)}M  inst ${window._instances}`;
 if(ht!==hudText){hudText=ht;hud.textContent=ht;}   // the DOM is written only when the numbers change
 requestAnimationFrame(frame);}
frame();window._ready=true;

// ==================== 91-host-probe.js
// ================================================================= HOST — probe (window._api)
// What verify.py --assert measures. Budgets per biome pass come from
// BIO.stats (charged by BIO.cur inside the biome).
const BUDGET={
 showcase:{tris:12800000,calls:120},   // measured at q=1 on this 6.8 km map (baseline.json), not a target (KNOWN_ISSUES)
 cls:{pass:7000000,host:900000},
 type:{'desert/trees':'pass','desert/floor':'pass','desert/fauna':'pass','desert/dress':'pass','host':'host'},
};
function _probePoints(){
 const pts=[],m=new THREE.Matrix4(),pos=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),bb=new THREE.Box3();
 scene.traverse(o=>{if(o.userData&&o.userData.probeSkip)return;
  if(o.isInstancedMesh){for(let i=0;i<o.count;i++){o.getMatrixAt(i,m);m.decompose(pos,q,sc);pts.push([pos.x,pos.y,pos.z]);}return;}
  if(!o.isMesh)return;bb.setFromObject(o);if(!isFinite(bb.min.x)||!isFinite(bb.max.x))return;
  pts.push([(bb.min.x+bb.max.x)/2,(bb.min.y+bb.max.y)/2,(bb.min.z+bb.max.z)/2]);});
 return pts;}
function regOccupancy(){const n=new Array(REG.length).fill(0);const P=_probePoints();
 REG.forEach((r,i)=>{for(const p of P)if(regHas(r,p[0],p[1],p[2]))n[i]++;});
 return REG.map((r,i)=>({name:r.name,n:n[i]}));}
function nanSweep(){const bad=[];let badInst=0;
 scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;if(o.userData&&o.userData.probeSkip)return;
  const p=o.geometry&&o.geometry.attributes&&o.geometry.attributes.position;if(p){const a=p.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){bad.push({geo:o.name||o.geometry.type,at:i});break;}}
  if(o.isInstancedMesh){const a=o.instanceMatrix.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){badInst++;break;}}});
 return {meshes:bad.length,first:bad.slice(0,8),instances:badInst,firstInstances:[]};}
function typeStats(){const out={};for(const k in BIO.stats){const t=BIO.stats[k],cls=BUDGET.type[k]||'pass';out[k]={tris:t.tris,inst:t.inst,meshes:t.meshes,cls,limit:BUDGET.cls[cls],over:t.tris>BUDGET.cls[cls]};}return out;}
// The host's own checks (verify.py runs them when present), each with a broken input that must fail.
// the cataract leaves from rock, its curtain clear of the rock; the cave open under its cap; nothing grows
// under the cap; no preset camera inside rock; the candles' far spires neither float nor sink
const rockTop=(x,z)=>{const t=BIO.carve.topAt(x,z);return t===null?terrainH(x,z):t;};
const buried=(x,y,z,e)=>terrainH(x,z)>y+e||(BIO.carve.rockAt(x,y,z)&&BIO.carve.rockAt(x,y+e,z)&&BIO.carve.rockAt(x+e,y,z)&&BIO.carve.rockAt(x-e,y,z)&&BIO.carve.rockAt(x,y,z+e)&&BIO.carve.rockAt(x,y,z-e));
const worldV=m=>{const a=m.geometry.attributes.position,o=[];m.updateMatrixWorld(true);const v=new THREE.Vector3();for(let i=0;i<a.count;i++){v.fromBufferAttribute(a,i).applyMatrix4(m.matrixWorld);o.push([v.x,v.y,v.z]);}return o;};
// the instanced items only (what the biome roots): a mesh's bounding-box centre is not a plant
const instPoints=()=>{const o=[],m=new THREE.Matrix4(),p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();
 scene.traverse(M=>{if(!M.isInstancedMesh)return;for(let i=0;i<M.count;i++){M.getMatrixAt(i,m);m.decompose(p,q,sc);o.push([p.x,p.y,p.z]);}});return o;};
// the surface as DRAWN: the ground's own triangles (terrainH holds only at their vertices, 17.8 m apart), or the
// pond's disc at PL where it covers them. Not the river's ribbon: it faces down, so from above it is culled and
// the river shows its bed (KNOWN_ISSUES); a foot under the ground is under the ribbon too
const drawnH=(function(){let P=null,X,Z,nx;const at=(A,v)=>{let lo=0,hi=A.length-2;while(lo<hi){const m=(lo+hi+1)>>1;if(A[m]<=v)lo=m;else hi=m-1;}return lo;};
 return (x,z)=>{if(!P){P=GROUND.geometry.attributes.position.array;nx=1;while(P[nx*3+2]===P[2])nx++;X=[];Z=[];
   for(let i=0;i<nx;i++)X.push(P[i*3]);for(let j=0;j<P.length/3/nx;j++)Z.push(P[j*nx*3+2]);}
  const i=at(X,x),j=at(Z,z),u=(x-X[i])/(X[i+1]-X[i]),v=(z-Z[j])/(Z[j+1]-Z[j]),h=(a,b)=>P[((j+b)*nx+i+a)*3+1];   // each cell split on its (i,j+1)-(i+1,j) diagonal (45, GROUND)
  const g=u+v<=1?h(0,0)+u*(h(1,0)-h(0,0))+v*(h(0,1)-h(0,0)):h(1,1)+(1-u)*(h(0,1)-h(1,1))+(1-v)*(h(1,0)-h(1,1));
  return Math.hypot(x-POND.x,z-POND.z)<163?Math.max(g,PL):g;};})();
// the twist-candles' far spires, laid out for every clump (SEDESERT.spiresOf: this spine keeps all of them heroes)
const candleSpires=()=>{const sp=SEDESERT.SPECIES.indexOf(SEDESERT.byKey.candle);return SEDESERT.TREES.filter(T=>T.sp===sp).flatMap(T=>SEDESERT.spiresOf(T));};
const HCHK={
 // the curtain: no vertex buried in rock, and its top row stands on rock (the river does not run out over air)
 curtain(V,name){const inRock=V.filter(v=>buried(v[0],v[1],v[2],.3)).length,top=Math.max(...V.map(v=>v[1])),T=V.filter(v=>v[1]>top-.01);
  const air=T.filter(v=>rockTop(v[0]-4,v[2])<v[1]-3).length;
  return{ok:!inRock&&!air,detail:name+': '+V.length+' vertices, '+inRock+' inside the rock; '+air+'/'+T.length+' of the top row over air 4 m back'};},
 carveOpen(Q){const q=Q.depth*.45,x=Q.c[0]-Q.n[0]*q,z=Q.c[1]-Q.n[1]*q,ym=Q.floorY+Q.h*.45,c=BIO.carve.covered(x,z);
  const open=!BIO.carve.rockAt(x,ym,z)&&terrainH(x,z)<ym,hood=c!==null&&BIO.carve.rockAt(x,c+2,z);
  return{ok:open&&hood,detail:Q.id+': the void at '+ym.toFixed(0)+' m '+(open?'open':'IN ROCK')+'; 2 m over its ceiling '+(c===null?'no ceiling':hood?'rock':'AIR')};},
 noHoodFlora(P){const bad=P.filter(p=>BIO.carve.topAt(p[0],p[2])!==null&&p[1]<(BIO.carve.covered(p[0],p[2])??1e9));
  return{ok:!bad.length,detail:bad.length?bad.length+' rooted under the cap (first at '+bad[0].map(v=>v|0)+')':P.length+' instances, none under the cap'};},
 camerasOut(C){const bad=C.filter(c=>buried(c.x,c.y,c.z,.3));return{ok:!bad.length,detail:bad.length?'in the rock: '+bad.map(c=>c.view).join(', '):C.length+' cameras in the open'};},
 // a spire stands in the water: its foot at or under the ground as drawn (it does not float over the bed), its
 // top 0.5 m clear of the water and of terrainH (it does not sink; the drawn ground's chords are KNOWN_ISSUES')
 spires(S,name){let fl=0,sk=0,hi=-1e9,lo=1e9;for(const s of S){const f=s.foot-drawnH(s.x,s.z),c=s.top-Math.max(terrainH(s.x,s.z),waterH(s.x,s.z));
   if(f>.05)fl++;if(c<.5)sk++;hi=Math.max(hi,f);lo=Math.min(lo,c);}
  return{ok:S.length>0&&!fl&&!sk,detail:name+': '+S.length+' spires; '+fl+' feet over the drawn ground (highest '+hi.toFixed(2)+' m), '+sk+' tops under 0.5 m clear (lowest '+lo.toFixed(2)+' m)'};}};
function hostChecks(){const R=[],add=(name,r)=>R.push(Object.assign({name},r));
 add('cataract-leaves-from-rock-clear-of-it',HCHK.curtain(worldV(FALL.mesh),'the cataract'));
 for(const Q of BIO.carve.patches)add('carve: '+Q.id+' open under rock',HCHK.carveOpen(Q));
 add('carve: nothing grows under the cap',HCHK.noHoodFlora(instPoints().filter(p=>Math.abs(p[0]-LIP.x)<80&&Math.abs(p[2]-LIP.z)<80)));
 add('preset-cameras-out-of-the-rock',HCHK.camerasOut(Object.keys(VIEWS).map(k=>({view:k,x:VIEWS[k][0],y:VIEWS[k][1],z:VIEWS[k][2]}))));
 add('candles: far spires neither float nor sink',HCHK.spires(candleSpires(),'the twist-candles'));
 return R;}
function hostNegatives(){const R=[],add=(name,r)=>R.push({name,failed:!r.ok,detail:r.detail});
 const V=worldV(FALL.mesh);add('the cataract pushed 12 m back into the promontory',HCHK.curtain(V.map(v=>[v[0]-12,v[1],v[2]]),'curtain-12'));
 add('the cataract started 30 m out over the Abyss',HCHK.curtain(V.map(v=>[v[0]+30,v[1],v[2]]),'curtain+30'));
 const Q=BIO.carve.patches[0];add('the cave probed 40 m above its floor',HCHK.carveOpen(Object.assign({},Q,{floorY:Q.floorY+40})));
 add('a plant on the cave floor',HCHK.noHoodFlora([[Q.c[0]-10,Q.floorY,Q.c[1]]]));
 add('a camera inside the cap',HCHK.camerasOut([{view:'in-cap',x:Q.c[0]-12,y:BIO.carve.covered(Q.c[0]-12,Q.c[1])+4,z:Q.c[1]}]));
 const S=candleSpires();add('the candle spires footed on the water, not the bed',HCHK.spires(S.map(s=>Object.assign({},s,{foot:Math.max(waterH(s.x,s.z),terrainH(s.x,s.z))})),'spires on the water'));
 add('the candle spires sunk to their tips',HCHK.spires(S.map(s=>Object.assign({},s,{foot:2*s.foot-s.top,top:s.foot})),'spires sunk'));
 return R;}
window._api={BUDGET,REG,hostChecks,hostNegatives,
 get totals(){const t=BIO.totals();return {tris:t.tris,inst:t.inst,meshes:t.meshes,registered:REG.length,types:Object.keys(BIO.stats).length};},
 typeStats,regOccupancy,nanSweep,
 setView:(cx,cy,cz,tx,ty,tz)=>setView(cx,cy,cz,tx,ty,tz),views:()=>Object.keys(VIEWS),
 biome:()=>window._biome};
window._registered=REG.length;
</script>
