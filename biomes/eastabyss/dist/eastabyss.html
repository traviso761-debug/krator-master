<script>

// ==================== 10-core-head.js
// ================================================================= BIOME CORE — head
// The engine-independent kit every Krator biome fragment is written against.
// Nothing below names a world's kit. The host hands in what a biome needs
// through BIO.init(...) (see BIOME-API.md) and everything else lives here.
var BIO={host:null,stats:{},cur:null,version:'core-1'};
// EVERYTHING BELOW IS LOCAL. The core declares no generic global (rng, clamp,
// TAU...): a world that already has those would be clobbered. Biome fragments
// pull what they need from BIO.fn at the top of their own closure.
(function(){
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, mix=lerp;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---------------------------------------------------------------- PRNG
// The biome's OWN stream. A host that adds a biome must not see its rubble
// move, so the biome never draws from the host's generator.
let _bseed=1234567;
function reseed(s){_bseed=s>>>0;}
function rng(){_bseed|=0;_bseed=_bseed+0x6D2B79F5|0;let t=Math.imul(_bseed^_bseed>>>15,1|_bseed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rng();}
function ri(a,b){return a+Math.floor(rng()*(b-a+1));}
function pick(arr){return arr[Math.floor(rng()*arr.length)%arr.length];}

// ---------------------------------------------------------------- noise
function h3(x,y,z){const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);}
// Each h3 is a Math.sin, and sampling a terrain or a texture asks for the same lattice cells again and again: a
// cell's eight corners are kept in a small direct-mapped cache (exact: the same h3 values, the same arithmetic in
// the same order, so the same results bit for bit). It was most of every biome's load.
var _vnK,_vnV;
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
 if(_vnK===undefined){_vnK=new Float64Array(4096*3).fill(NaN);_vnV=new Float64Array(4096*8);}
 const s=(Math.imul(xi|0,73856093)^Math.imul(yi|0,19349663)^Math.imul(zi|0,83492791))&4095,k=s*3,o=s*8,V=_vnV;
 if(_vnK[k]!==xi||_vnK[k+1]!==yi||_vnK[k+2]!==zi){_vnK[k]=xi;_vnK[k+1]=yi;_vnK[k+2]=zi;
  V[o]=h3(xi,yi,zi);V[o+1]=h3(xi+1,yi,zi);V[o+2]=h3(xi,yi+1,zi);V[o+3]=h3(xi+1,yi+1,zi);
  V[o+4]=h3(xi,yi,zi+1);V[o+5]=h3(xi+1,yi,zi+1);V[o+6]=h3(xi,yi+1,zi+1);V[o+7]=h3(xi+1,yi+1,zi+1);}
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const a=V[o]+(V[o+1]-V[o])*u,b=V[o+2]+(V[o+3]-V[o+2])*u,c=V[o+4]+(V[o+5]-V[o+4])*u,d=V[o+6]+(V[o+7]-V[o+6])*u;
 const e=a+(b-a)*v,f=c+(d-c)*v;return e+(f-e)*w;}
function fbm(x,y,z,o){o=o||3;let a=0,f=1,s=0;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f)/f;s+=1/f;f*=2.03;}return a/s;}

// ---------------------------------------------------------------- host binding
// host = { THREE, scene, terrainH(x,z), mask(x,z), obstacles[], ticks(fn), seed,
//          origin[x,z] | [[x,z]...], center, fields{}, waterH(x,z), register(o),
//          lod{}, windows{}, eye(), err(msg), stat(key,tris,inst) }   (BIOME-API.md)
BIO.init=function(h){
 if(!h||!h.THREE)throw new Error('BIO.init: host needs THREE');
 // scene may arrive later (a world that creates its scene after its kit loads
 // calls BIO.setScene before build); it is only needed at bake
 BIO.host={
  THREE:h.THREE,scene:h.scene||null,
  terrainH:h.terrainH||((x,z)=>0),
  // the default mask: everything may root, or, when the host hands in its water
  // (sedesert-1), nothing roots under the local water surface. A world with
  // footprints or its own rule passes its own.
  mask:h.mask||(h.waterH?((x,z)=>{const d=BIO.terrainH(x,z)-BIO.waterH(x,z);return d<.15?0:d<.7?(d-.15)/.55:1;}):((x,z)=>1)),
  obstacles:h.obstacles||[],
  ticks:h.ticks||(fn=>{}),
  seed:h.seed==null?1:h.seed,
  // origin: [x,z] or a LIST of [x,z] -- the LOD curve is measured from the
  // nearest one, so a long showcase (a lake shore, a river) can keep detail
  // along a spine instead of round one point. center: the disc the grids
  // cover (default: the first origin).
  origin:(h.origin&&typeof h.origin[0]==='number')?[h.origin]:(h.origin||[[0,0]]),
  center:h.center||null,
  // fields: optional climate fields a multi-zone biome asks for, each
  // (x,z)->0..1. Missing ones fall back to BIO.fieldDefault. wet: 0 arid ..
  // 1 saturated; salt: 0 .. 1 crust; upland: 0 basin floor .. 1 the high edge;
  // flow: 0 still .. 1 a bank; mist: 0 .. 1 the cloud-forest band.
  fields:h.fields||{},
  // waterH(x,z) (sedesert-1, additive): the LOCAL water surface. The earlier kits keep
  // their water at y=0 (the default); a stream that descends, or a tarn in a hollow,
  // hands its own level in, and a biome reads depth as BIO.depth = waterH - terrainH.
  // Where there is no water at all the host returns -1e9.
  waterH:h.waterH||((x,z)=>0),
  // register(o) (sedesert-1, additive): a volume the world's inspector and probe can name
  // ({name,key,x,z,y,r,h}); a world without an inspector leaves it out
  register:h.register||(o=>{}),
  // lod (sedesert-1): the detail radii from the spine, a property of the world's spine, not of
  // a species pass: hero (full detail), mid, far (impostors stop), floor bands. BIO.radii().
  lod:Object.assign({hero:800,mid:1500,far:2200,floor:[500,1250]},h.lod||{}),
  // windows (sedesert-1): named rectangles [x0,z0,x1,z1] a biome may ask for (BIO.window('water')):
  // where the world's water is, so a water-bound pass looks nowhere else
  windows:h.windows||{},
  // eye (swbay-1): optional ()->[x,y,z], where the viewer is right now. Only a pass that
  // animates (fauna) reads it, to leave what is far alone; null means no LOD.
  eye:h.eye||null,
  // clock / wind (one world, one wind: biomes/WORLD.md): clock()->seconds drives the foliage's sway
  // instead of the core's own clock; wind()->[x,z] (1 = the calm breeze) bends it downwind. A world
  // with core/atmos binds clock:()=>ATMOS.clock.t and wind:()=>the base wind over its calm length.
  clock:h.clock||null,wind:h.wind||null,
  err:h.err||(m=>console.error(m)),
  stat:h.stat||null};

 return BIO;};
BIO.setScene=function(s){BIO.host.scene=s;};
BIO.err=function(m){if(BIO.host)BIO.host.err(m);else console.error(m);};
BIO.terrainH=function(x,z){return BIO.host?BIO.host.terrainH(x,z):0;};
BIO.mask=function(x,z){return BIO.host?BIO.host.mask(x,z):1;};
BIO.waterH=function(x,z){return BIO.host?BIO.host.waterH(x,z):0;};
// depth of the ground under the local water surface (negative: above it)
BIO.depth=function(x,z){return BIO.waterH(x,z)-BIO.terrainH(x,z);};
BIO.register=function(o){if(BIO.host)BIO.host.register(o);};
// the detail radii (sedesert-1, where it was BIO.LOD(); BIO.LOD is the runtime LOD's settings)
BIO.radii=function(){return BIO.host?BIO.host.lod:{hero:800,mid:1500,far:2200,floor:[500,1250]};};
BIO.window=function(n){return (BIO.host&&BIO.host.windows[n])||null;};
BIO.eye=function(){return BIO.host&&BIO.host.eye?BIO.host.eye():null;};
// the bounding box of the LOD spine, padded: every point within `pad` of an origin lies inside it
BIO.originBox=function(pad){const O=BIO.host?BIO.host.origin:[[0,0]];let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;for(const o of O){x0=Math.min(x0,o[0]);z0=Math.min(z0,o[1]);x1=Math.max(x1,o[0]);z1=Math.max(z1,o[1]);}return[x0-pad,z0-pad,x1+pad,z1+pad];};
// distance from the LOD origin, for the detail curve
BIO.lodD=function(x,z){const O=BIO.host?BIO.host.origin:[[0,0]];let m=1e9;for(let i=0;i<O.length;i++){const d=Math.hypot(x-O[i][0],z-O[i][1]);if(d<m)m=d;}return m;};
BIO.center=function(){const h=BIO.host;return h?(h.center||h.origin[0]):[0,0];};
// flow and mist are additive (rift-1): a river bank, and the cloud-forest band a ridge wears on its wet face.
// cold and rock are additive (nhighlands-1): 0 temperate .. 1 boreal (altitude and aspect: the boreal band
// comes down lower on the north-facing slopes), and 0 soil .. 1 boulder ground and crag. An older biome
// never reads them; a host that never heard of them gets 0 for both.
BIO.fieldDefault={wet:(x,z)=>BIO.terrainH(x,z)<2?1:.6,salt:(x,z)=>0,upland:(x,z)=>0,flow:(x,z)=>0,mist:(x,z)=>0,cold:(x,z)=>0,rock:(x,z)=>0};
// a field a world does not bind is 0, except the ones with a meaningful default (sedesert-1)
const ZEROF=(x,z)=>0;
BIO.field=function(n,x,z){const f=BIO.host&&BIO.host.fields[n];return f?f(x,z):(BIO.fieldDefault[n]||ZEROF)(x,z);};
BIO.hasField=function(n){return !!(BIO.host&&BIO.host.fields[n]);};
// LOD is a CURVE, not two steps: full detail under ~700 m, a quarter by 3 km.
BIO.lod=function(x,z){return clamp(1.18-BIO.lodD(x,z)/2600,.22,1);};

// ---------------------------------------------------------------- accounting
// Every instance and merged triangle is charged to BIO.cur ('jungle/hyper',
// 'jungle/floor'...), so a probe can assert per-pass budgets.
BIO.tally=function(tris,inst,meshes){const k=BIO.cur||'biome';
 const t=BIO.stats[k]||(BIO.stats[k]={tris:0,inst:0,meshes:0});
 t.tris+=tris||0;t.inst+=inst||0;t.meshes+=meshes||0;
 if(BIO.host&&BIO.host.stat)BIO.host.stat(k,tris||0,inst||0);};
BIO.totals=function(){let tris=0,inst=0,meshes=0;for(const k in BIO.stats){tris+=BIO.stats[k].tris;inst+=BIO.stats[k].inst;meshes+=BIO.stats[k].meshes;}return{tris,inst,meshes};};

BIO.fn={TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm};
})();

// ==================== 20-core-kit.js
// ================================================================= BIOME CORE — kit
// Two ways to put geometry in the world, both cheap:
//   INSTANCED ITEMS   BIO.def(name,geo,mat) once, BIO.put(name,...) thousands of
//                     times, one InstancedMesh per item at bake. Per-instance
//                     colour, and optional per-instance extras (aN normal, aC2
//                     second colour) for the foliage shaders, or any other
//                     named vec4 (aP0, aP1...) for the animation shaders.
//   MERGED BUCKET     BIO.tri/quad/tube/lathe/surf write vertex-coloured
//                     triangles into a bucket per material family; one Mesh per
//                     family at bake. Boles, limbs, logs, boulders go here.
// Both are charged to BIO.cur by the accounting in 10-core-head.js.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm}=BIO.fn;
// ---------------------------------------------------------------- kits (namespaces)
// Several kits can share one page (biomes/WORLD.md), and two kits may both call an item
// 'trunk' or a bucket 'bark0'. Each kit has its own REGISTRY of item definitions, their
// instances and its buckets: BIO.kit(name) makes `name` current, so BIO.defs, BIO.items,
// BIO.order and BIO.buckets point at its registry and BIO.kitName names it (material
// cache keys carry it). It returns the kit that was current. A kit calls it at the top of
// its first fragment and BIO.kitEnd(api) at the end of its last (after 75, if it has fauna): that wraps every function on its
// export object (build, dress...) to run in its registry, and restores the default kit.
// A page that never calls it works in the default kit '' exactly as before.
BIO.kits={};BIO.kitName=null;
BIO.kit=function(name){name=name||'';const prev=BIO.kitName;if(name===prev)return prev;let R=BIO.kits[name];
 if(!R)R=BIO.kits[name]={defs:{},items:{},order:[],buckets:{}};
 BIO.defs=R.defs;BIO.items=R.items;BIO.order=R.order;BIO.buckets=R.buckets;BIO.kitName=name;return prev;};
BIO.kitWrap=function(name,api){for(const k of Object.keys(api)){const f=api[k];if(typeof f!=='function'||f._kit!=null)continue;
  const w=function(){const prev=BIO.kit(name);try{return f.apply(this,arguments);}finally{BIO.kit(prev);}};w._kit=name;api[k]=w;}
 return api;};
BIO.kitEnd=function(api){const name=BIO.kitName;if(api)BIO.kitWrap(name,api);BIO.kit('');return api;};
// a material cache key in the current kit's name ('' adds nothing)
BIO.kitKey=function(k){return BIO.kitName?BIO.kitName+'|'+k:k;};
BIO.kit('');
// GROWABLE FLOAT32 STORES (nhighlands-1, internal): the items' matrices and colours and the buckets' vertices
// were plain arrays of doubles, eight bytes a float and a page crash at ~16M triangles on a 43 km^2 map. These
// keep four bytes a float and the same push() the builders already call; bake reads .a.
function F32(){this.a=new Float32Array(4096);this.length=0;}
F32.prototype.push=function(){const n=arguments.length;let a=this.a;if(this.length+n>a.length){const b=new Float32Array(Math.max(a.length*2,this.length+n));b.set(a);this.a=a=b;}
 for(let i=0;i<n;i++)a[this.length++]=arguments[i];return this.length;};
// sedesert's Store, merged (sedesert-1): the same store under its name, with its n and data()
Object.defineProperty(F32.prototype,'n',{get:function(){return this.length;}});
F32.prototype.data=function(){return this.a.slice(0,this.length);};   // a copy: the store can be dropped after bake
BIO.F32=F32;BIO.Store=F32;
// x: the extra named vec4 attributes an item asked for (hyperjungle-1: aP0, aP1 for 35-core-anim)
const newItem=attrs=>{const it={m:new F32(),c:new F32(),n:new F32(),c2:new F32(),x:{},k:[],count:0};
 if(attrs)attrs.forEach(a=>{if(a!=='aN'&&a!=='aC2')it.x[a]=new F32();});return it;};
BIO.def=function(name,geo,mat,opt){opt=opt||{};
 if(BIO.defs[name])BIO.err('BIO.def: '+name+' defined twice');
 const g=geo.index?geo.toNonIndexed():geo;
 BIO.defs[name]={geo:g,mat,tris:g.attributes.position.count/3,attrs:opt.attrs||null,label:opt.label||name};
 BIO.items[name]=newItem(opt.attrs);BIO.order.push(name);};
const _bm=new (function(){return {}})();   // scratch holder, filled after THREE binds
BIO._scratch=function(){const T=BIO.host.THREE;if(!_bm.m){_bm.m=new T.Matrix4();_bm.q=new T.Quaternion();_bm.e=new T.Euler();_bm.p=new T.Vector3();_bm.s=new T.Vector3();_bm.c=new T.Color();_bm.up=new T.Vector3(0,1,0);_bm.v=new T.Vector3();}return _bm;};
// rotation helpers: qEuler(rx,ry,rz) or qFacing([nx,ny,nz]) (local +z toward n)
function qEuler(rx,ry,rz){const S=BIO._scratch();S.e.set(rx||0,ry||0,rz||0,'YXZ');return new BIO.host.THREE.Quaternion().setFromEuler(S.e);}
function qFacing(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1),v);}
function qUp(n){const T=BIO.host.THREE,v=new T.Vector3(n[0],n[1],n[2]).normalize();return new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),v);}
// put(name, [x,y,z], quat|null, [sx,sy,sz]|s, colour(hex|Color|null), extra{n:[..], c2:hex})
BIO.put=function(name,pos,q,sc,col,extra){
 const it=BIO.items[name];if(!it){BIO.err('BIO.put: no item '+name);return;}
 if(!(isFinite(pos[0])&&isFinite(pos[1])&&isFinite(pos[2]))){BIO.err('BIO.put: NaN position for '+name);return;}
 const S=BIO._scratch();
 S.p.set(pos[0],pos[1],pos[2]);
 if(typeof sc==='number')S.s.set(sc,sc,sc);else S.s.set(sc[0],sc[1],sc[2]);

 else{if(col.isColor)S.c.copy(col);else S.c.set(col);S.c.convertSRGBToLinear();it.c.push(S.c.r,S.c.g,S.c.b);}

  if(def.attrs.indexOf('aN')>=0){const n=(extra&&extra.n)||[0,1,0];it.n.push(n[0],n[1],n[2]);}
  if(def.attrs.indexOf('aC2')>=0){const c2=extra&&extra.c2;if(c2==null)it.c2.push(S.c.r,S.c.g,S.c.b);else{if(c2.isColor)S.c.copy(c2);else S.c.set(c2);S.c.convertSRGBToLinear();it.c2.push(S.c.r,S.c.g,S.c.b);}}
  for(const a in it.x){const v=(extra&&extra[a])||[0,0,0,0];it.x[a].push(v[0]||0,v[1]||0,v[2]||0,v[3]||0);}}

BIO.beam=function(name,a,b,r0,r1,col){const T=BIO.host.THREE,S=BIO._scratch();

 S.v.set(dx/L,dy/L,dz/L);const q=new T.Quaternion().setFromUnitVectors(S.up,S.v);
 BIO.put(name,[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],q,[r0*2,L,(r1==null?r0:r1)*2],col);};

// ---------------------------------------------------------------- merged buckets
BIO.bucket=function(fam,mat,opt){opt=opt||{};

const _lc={r:1,g:1,b:1};
// COLOURS ARE sRGB IN, LINEAR OUT. r128 sends instance and vertex colours to
// the shader untouched, and the renderer encodes its output to sRGB, so a raw
// hex would render a stop too bright. Everything passed here is a designer's
// sRGB colour (hex, Color, or [r,g,b] already linear) and is converted once.
function _col3(c){const S=BIO._scratch();if(c==null)return[1,1,1];if(Array.isArray(c))return c;
 if(c.isColor)S.c.copy(c);else S.c.set(c);S.c.convertSRGBToLinear();return[S.c.r,S.c.g,S.c.b];}
// one triangle, flat normal unless `n` is given; a,b,c CCW from outside

// SPECIES COME IN STANDS. A per-tree random draw mixes species so evenly the
// eye integrates them back into one colour; an fbm patch field a few hundred

// cell, jittered, tested against the host mask, an fbm patch mask (the floor

// rejection-sampling luck, and the count is predictable from the cell size.

//   900 .. 2250     the MARSH: lush, knee-trees, pools; the rain picks up eastward

   .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvIWP=(modelMatrix*vec4(transformed,1.0)).xyz;vIWN=normalize(mat3(modelMatrix)*objectNormal);');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform float uWindT;varying vec3 vIWP;varying vec3 vIWN;')
   .replace('#include <color_fragment>','#include <color_fragment>\n{vec3 V=normalize(cameraPosition-vIWP);vec3 N=normalize(vIWN);float fr=1.0-abs(dot(N,V));'+
    'float sh=0.5+0.5*sin(dot(vIWP,vec3(0.21,0.37,0.29))+uWindT*0.35);float k=smoothstep(0.12,0.82,fr*0.85+sh*0.3);'+
    'diffuseColor.rgb*=mix(vec3(0.78,1.18,0.92),vec3(1.45,0.82,0.74),k);}');};
 m.userData.bio={kind:'irid',key:BIO.kitKey(key||'x'),opts:{a:[0.78,1.18,0.92],b:[1.45,0.82,0.74]}};   // what it is, as data (42-core-export)

 g.fillStyle='#8c8c8c';g.fillRect(0,0,w,h);

   g.fillStyle='rgba(175,175,175,.6)';g.beginPath();g.moveTo(x,y-dy*.36);g.lineTo(x+dx*.34,y);g.lineTo(x,y+dy*.36);g.lineTo(x-dx*.34,y);g.closePath();g.fill();
   g.fillStyle='rgba(60,60,60,.7)';g.beginPath();g.ellipse(x,y+2,dx*.14,dy*.09,0,0,TAU);g.fill();}}
 else if(kind===1){
  for(let i=0;i<420;i++){const x=rng()*w,y=rng()*h;g.strokeStyle='rgba('+(rng()<.5?'50,50,50':'170,170,170')+','+(.3+rng()*.5).toFixed(2)+')';
   g.lineWidth=rr(1,3);g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-6,6),y+rr(14,60));g.stroke();}
  for(let i=0;i<60;i++){g.fillStyle='rgba(40,40,40,.5)';g.beginPath();g.ellipse(rng()*w,rng()*h,rr(5,12),rr(3,6),0,0,TAU);g.fill();}}
 else if(kind===2){
  for(let k=0;k<26;k++){const y=rng()*h;g.fillStyle='rgba('+(rng()<.5?'120,120,120':'165,165,165')+',.35)';g.fillRect(0,y,w,rr(4,26));}
  for(let i=0;i<110;i++){const x=rng()*w,y=rng()*h;g.fillStyle='rgba(60,60,60,'+(.4+rng()*.4).toFixed(2)+')';g.fillRect(x,y,rr(6,26),rr(1.5,3.5));}
  for(let i=0;i<40;i++){const x=rng()*w;g.strokeStyle='rgba(90,90,90,.2)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,-5);g.lineTo(x+rr(-8,8),h+5);g.stroke();}}
 else if(kind===3){
  for(let i=0;i<300;i++){const x=rng()*w,d=rng();g.strokeStyle='rgba('+(d<.5?'55,55,55':'170,170,170')+','+(.3+rng()*.5).toFixed(2)+')';
   g.lineWidth=d<.5?rr(2,5):rr(1,2);g.beginPath();g.moveTo(x,-10);g.bezierCurveTo(x+rr(-10,10),h*.33,x+rr(-10,10),h*.66,x+rr(-8,8),h+10);g.stroke();}
  for(let i=0;i<30;i++){g.fillStyle='rgba(40,40,40,.5)';const x=rng()*w,y=rng()*h;g.fillRect(x,y,rr(2,5),rr(30,110));}}
 else if(kind===4){
  for(let i=0;i<100;i++){const x=rng()*w;g.strokeStyle='rgba('+(rng()<.5?'70,70,70':'160,160,160')+',.45)';g.lineWidth=rr(1.5,3);g.beginPath();g.moveTo(x,-4);g.lineTo(x,h+4);g.stroke();}
  for(let y=20;y<h;y+=64){g.fillStyle='rgba(50,50,50,.75)';g.fillRect(0,y,w,5);g.fillStyle='rgba(190,190,190,.6)';g.fillRect(0,y+5,w,3);}}
 else{const rw=32;   // 5: the seal-tree. Flutes (a dark groove between pale ribs) and a vertical row of hexagonal leaf scars down every rib
  for(let x=0;x<w;x+=rw){g.fillStyle='rgba(165,165,165,.5)';g.fillRect(x+3,0,rw-8,h);g.fillStyle='rgba(55,55,55,.7)';g.fillRect(x,0,4,h);g.fillStyle='rgba(120,120,120,.35)';g.fillRect(x+rw-5,0,3,h);
   for(let y=(x/rw%2)*11;y<h;y+=22){const cx=x+rw/2+rr(-1,1),cy=y+rr(-1,1);

// ---------------------------------------------------------------- geometries local to this biome
const G={};
// a TUFT: three crossed vertical quads, origin at the base, up to y=1 (reeds, grass, samphire, club-moss)
G.tuft=function(){const pos=[],uv=[],nor=[];
 for(let k=0;k<3;k++){const a=k/3*Math.PI+.2,ca=Math.cos(a),sa=Math.sin(a);
  const P=[[-.5,0],[.5,0],[.5,1],[-.5,1]].map(q=>[ca*q[0],q[1],sa*q[0],q[0]+.5,1-q[1]]);
  [0,1,2,0,2,3].forEach(i=>{pos.push(P[i][0],P[i][1],P[i][2]);uv.push(P[i][3],P[i][4]);nor.push(-sa,0,ca);});}
 return BIO.geo._make(pos,nor,uv);};
// a FAN: one vertical quad, base at the origin, up to y=1, local +z its face
G.fan=function(){const pos=[],uv=[],nor=[];const P=[[-.5,0],[.5,0],[.5,1],[-.5,1]].map(q=>[q[0],q[1],0,q[0]+.5,1-q[1]]);
 [0,1,2,0,2,3].forEach(i=>{pos.push(P[i][0],P[i][1],P[i][2]);uv.push(P[i][3],P[i][4]);nor.push(0,0,1);});return BIO.geo._make(pos,nor,uv);};
// a ROSETTE (echeveria): three tiers of fleshy bent leaves, vertex-coloured
// pale at the base and full-colour at the tip, unit radius, origin at the ground
G.rosette=function(){const pos=[],nor=[],uv=[],col=[];
 const tiers=[[10,1.0,.30,.55],[8,.70,.55,.40],[6,.42,.85,.28]];
 tiers.forEach((tr,ti)=>{const n=tr[0],R=tr[1],el=tr[2],wd=tr[3];const a0=ti*.31;
  for(let k=0;k<n;k++){const a=a0+k/n*TAU,ca=Math.cos(a),sa=Math.sin(a),px=-sa,pz=ca;
   const tip=[ca*R,Math.sin(el)*R*.9+.05,sa*R],mid=[ca*R*.5,Math.sin(el)*R*.35+.04,sa*R*.5],base=[ca*.08,.02,sa*.08];
   const W=wd*R;
   const q=[[base[0]-px*W*.25,base[1],base[2]-pz*W*.25],[base[0]+px*W*.25,base[1],base[2]+pz*W*.25],[mid[0]+px*W*.5,mid[1],mid[2]+pz*W*.5],[mid[0]-px*W*.5,mid[1],mid[2]-pz*W*.5],tip];
   const nrm=[ -Math.sin(el)*ca,Math.cos(el),-Math.sin(el)*sa];
   const push=(p,c)=>{pos.push(p[0],p[1],p[2]);nor.push(nrm[0],nrm[1],nrm[2]);uv.push(0,0);col.push(c,c,c);};
   push(q[0],.55);push(q[1],.55);push(q[2],.85);push(q[0],.55);push(q[2],.85);push(q[3],.85);
   push(q[3],.85);push(q[2],.85);push(q[4],1.0);}});
 return BIO.geo._make(pos,nor,uv,col);};
// a LILY PAD: a flat disc with a notch, unit radius, vertex-coloured (lighter centre)
G.pad=function(){const pos=[],nor=[],uv=[],col=[];const n=11;
 for(let k=0;k<n;k++){const a0=(k/n)*TAU*.92+.25,a1=((k+1)/n)*TAU*.92+.25;
  const r0=1+.06*Math.sin(k*3.1),r1=1+.06*Math.sin((k+1)*3.1);
  [[0,0,0,1.12],[Math.cos(a1)*r1,0,Math.sin(a1)*r1,.92],[Math.cos(a0)*r0,0,Math.sin(a0)*r0,.92]].forEach(p=>{pos.push(p[0],p[1],p[2]);nor.push(0,1,0);uv.push(0,0);col.push(p[3],p[3],p[3]);});}
 return BIO.geo._make(pos,nor,uv,col);};
// a WHORL: eight needle-branches radiating in the xz plane, drooping a little (pipe reed)
G.whorl=function(){const pos=[],nor=[],uv=[];const n=7;
 for(let k=0;k<n;k++){const a=k/n*TAU+.15,ca=Math.cos(a),sa=Math.sin(a),px=-sa*.04,pz=ca*.04;
  const A=[ca*.08,0,sa*.08],B=[ca*1,-.16,sa*1];
  [[A[0]-px,A[1],A[2]-pz],[A[0]+px,A[1],A[2]+pz],[B[0]+px*.4,B[1],B[2]+pz*.4],[A[0]-px,A[1],A[2]-pz],[B[0]+px*.4,B[1],B[2]+pz*.4],[B[0]-px*.4,B[1],B[2]-pz*.4]].forEach(p=>{pos.push(p[0],p[1],p[2]);nor.push(0,1,0);uv.push(0,0);});}
 return BIO.geo._make(pos,nor,uv);};
// a ROPE: a tapering 6-sided tube along +x from 0 to 1, sagging in the middle and
// turning up at the tip (the araucaria branch), textured round its girth
G.rope=function(){const pos=[],nor=[],uv=[];const N=7,seg=5,rings=[];
 for(let i=0;i<=N;i++){const t=i/N,y=-.42*t+.52*t*t,r=.048*(1-.55*t)+.006,ring=[];
  const dy=-.42+1.04*t,tl=Math.hypot(1,dy),tx=1/tl,ty=dy/tl;   // tangent; the frame's normal is (-ty,tx,0), binormal z
  for(let s=0;s<=seg;s++){const a=s/seg*TAU,c=Math.cos(a),sn=Math.sin(a),nx=-ty*c,ny=tx*c,nz=sn;ring.push({p:[t+nx*r,y+ny*r,nz*r],n:[nx,ny,nz],u:s/seg*2,v:t*6});}
  rings.push(ring);}
 const pv=q=>{pos.push(q.p[0],q.p[1],q.p[2]);nor.push(q.n[0],q.n[1],q.n[2]);uv.push(q.u,q.v);};
 for(let i=0;i<N;i++)for(let s=0;s<seg;s++){const a0=rings[i][s],a1=rings[i][s+1],b0=rings[i+1][s],b1=rings[i+1][s+1];pv(a0);pv(b1);pv(a1);pv(a0);pv(b0);pv(b1);}
 [[0,1,2],[2,3,4],[4,0,2]].forEach(tr=>{tr.forEach(s=>{const q=rings[N][s];pos.push(q.p[0],q.p[1],q.p[2]);nor.push(1,0,0);uv.push(q.u,q.v);});});   // a tip cap
 return BIO.geo._make(pos,nor,uv);};
// a FLOATING LEAF: a pointed ellipse lying in the xz plane, unit long along x, vertex-coloured (paler along the midrib)
G.floatleaf=function(){const pos=[],nor=[],uv=[],col=[];const n=8;
 for(let k=0;k<n;k++){const a0=k/n*TAU,a1=(k+1)/n*TAU;
  const P=a=>{const c=Math.cos(a),s=Math.sin(a);return[c*.5,0,s*.19*(1-.35*c*c)];};
  [[0,0,0,1.14],P(a1).concat([.9]),P(a0).concat([.9])].forEach(p=>{pos.push(p[0],p[1],p[2]);nor.push(0,1,0);uv.push(0,0);col.push(p[3],p[3],p[3]);});}
 return BIO.geo._make(pos,nor,uv,col);};
// a CONE: a squat cone on its base, origin at the base (cycad cones, knee-tree knees)
G.cone=function(){const g=new T3.ConeGeometry(.5,1,7,1);g.translate(0,.5,0);return g;};
EASTABYSS.G=G;

// ==================== 55-biome-eastabyss-trees.js
// ================================================================= EASTERN ABYSS — trees
// The twenty tree species of the eastern abyss, each with its own builder,
// placed by zone from the host's climate fields (wet / salt / upland / flow)
// and terrainH. The zone weights are computed HERE from those fields, never
// from the host's map: a world that binds the same four fields gets the same
// zoning. Beyond the LOD spine the canopy species become blob impostors in
// the 'far' bucket (the hyperjungle's technique), the sky scale-tree's bole in
// 'fari' (its iridescence); the small species thin out with distance and become
// 20-triangle hulls shaped per habit. Every count scales with q; the core charges BIO.cur.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;
const SP=EASTABYSS.SPECIES,PAL=EASTABYSS.PAL,GOLD=2.399963;
const T3=BIO.host.THREE,C=h=>new T3.Color(h);
EASTABYSS.TREES=[];

// ---------------------------------------------------------------- zones from the fields
// Each weight 0..1. A plant's aridity tag is honoured by which weight it reads:
// 'arid' species read flatK (dry ground only), 'humid' ones marshK/jungK.
const Y=(x,z)=>BIO.terrainH(x,z);
function zones(x,z){const up=BIO.field('upland',x,z),wet=BIO.field('wet',x,z),salt=BIO.field('salt',x,z),flow=BIO.field('flow',x,z),h=Y(x,z)-BIO.waterH(x,z);   // h: the ground against the local water (0 in this host)
 return{up,wet,salt,flow,h,
  jung:smooth(.05,.20,up)*smooth(.86,.66,up)*smooth(.45,.7,wet),
  sav:smooth(.62,.86,up),
  marsh:smooth(.22,.03,up)*smooth(.5,.8,wet)*(1-salt*.7),
  flat:smooth(.28,.06,wet)*smooth(.3,.7,salt)*smooth(.15,.03,up),
  shore:smooth(1.6,.4,h)*smooth(.6,.85,wet)*smooth(.1,.02,up)};}
EASTABYSS.zones=zones;

// ---------------------------------------------------------------- colour
function shade(hex,f){const c=hex.isColor?hex.clone():C(hex);if(f>=0)c.lerp(C(0xffffff),f);else c.lerp(C(0x120f0a),-f);return c;}
function bright(col,k){const c=col.isColor?col.clone():C(col);c.convertSRGBToLinear();c.r=Math.min(1,c.r*k);c.g=Math.min(1,c.g*k);c.b=Math.min(1,c.b*k);return c.convertLinearToSRGB();}
const _hsl={h:0,s:0,l:0};
function vary(hex,dh,ds,dl){const c=hex.isColor?hex.clone():C(hex);c.getHSL(_hsl);c.setHSL(((_hsl.h+rr(-dh,dh))%1+1)%1,clamp(_hsl.s+rr(-ds,ds),0,1),clamp(_hsl.l+rr(-dl,dl),.03,.97));return c;}
function texMean(tex){const im=tex&&tex.image;if(!im||!im.getContext)return[.25,.25,.25];
 const d=im.getContext('2d').getImageData(0,0,im.width,im.height).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<d.length;i+=4*13){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
 const c=C(0).setRGB(r/n/255,g/n/255,b/n/255).convertSRGBToLinear();return[c.r,c.g,c.b];}
// the sRGB tint that renders `hex` on a texture of linear mean m
function tint(hex,m,k){const c=hex.isColor?hex.clone():C(hex);c.convertSRGBToLinear();k=k==null?1:k;
 c.setRGB(Math.min(1,c.r*k/Math.max(.02,m[0])),Math.min(1,c.g*k/Math.max(.02,m[1])),Math.min(1,c.b*k/Math.max(.02,m[2])));return c.convertLinearToSRGB();}
let MEAN=null;
function means(){if(MEAN)return MEAN;MEAN={bark:EASTABYSS.BARKTEX.map(t=>texMean(t)),wood:texMean(EASTABYSS.WOODTEX),rock:texMean(EASTABYSS.ROCKTEX),rope:texMean(EASTABYSS.ROPETEX)};return MEAN;}
EASTABYSS.means=means;EASTABYSS.tint=tint;EASTABYSS.bright=bright;EASTABYSS.shade=shade;EASTABYSS.vary=vary;
const barkCol=(S,k)=>tint(S.bark[k%S.bark.length],means().bark[S.barkK]);
// an untextured rod / lobe in a species' bark colour: the designer's colour, a shade down
const rodCol=(S,k)=>shade(C(S.bark[k%S.bark.length]),-.25);
const leafCol=(S,k)=>bright(vary(pick(S.leaf),.03,.10,.06),k==null?1.3:k);
const compCol=()=>bright(vary(pick(PAL.comp),.03,.10,.06),1.15);

// ---------------------------------------------------------------- polyline helpers (Girder's)
function treeGrow(o,d,len,r0,r1,n,curve,wig){let sx=-d[2],sz=d[0];const sl=Math.hypot(sx,sz)||1;sx/=sl;sz/=sl;
 const w1=rr(-1,1)*wig,w2=rr(-1,1)*wig,pts=[];
 for(let k=0;k<=n;k++){const t=k/n,w=(w1*Math.sin(t*Math.PI)+w2*Math.sin(t*TAU))*len;
  pts.push({x:o.x+d[0]*len*t+sx*w,y:o.y+d[1]*len*t+curve*len*t*t,z:o.z+d[2]*len*t+sz*w,r:mix(r0,r1,Math.pow(t,.8))});}
 return pts;}
const clear3=(x,y,z,rad,vr)=>BIO.clearOf3(x,y,z,rad,vr);

// ---------------------------------------------------------------- keep-clear between trees
const HC=120,HASH={};
function hkey(x,z){return Math.floor(x/HC)+','+Math.floor(z/HC);}
function hadd(o){const R=o.r+30;for(let z=Math.floor((o.z-R)/HC);z<=Math.floor((o.z+R)/HC);z++)for(let x=Math.floor((o.x-R)/HC);x<=Math.floor((o.x+R)/HC);x++){const k=x+','+z;(HASH[k]||(HASH[k]=[])).push(o);}}
function blocked(x,z,pad){const L=HASH[hkey(x,z)];if(!L)return false;for(let i=0;i<L.length;i++){const o=L[i];if(Math.hypot(x-o.x,z-o.z)<o.r+pad)return true;}return false;}
EASTABYSS.blocked=blocked;

// ---------------------------------------------------------------- cauliflory
// Flowers straight off the bark: clusters at random heights round the bole
// (and, for the bell-bark, along its boughs). Complementary to the lake.
function cauliflory(x,z,y0,H,rAt,n,size,st,uLo,uHi){uLo=uLo==null?.15:uLo;uHi=uHi==null?.75:uHi;
 for(let i=0;i<n;i++){const u=rr(uLo,uHi),y=y0+H*u,a=rr(0,TAU),R=rAt(u)+.12,col=compCol();
  const m=ri(6,12);for(let k=0;k<m;k++){const a2=a+rr(-.5,.5)/Math.max(.5,R),y2=y+rr(-.9,.9)*size*1.1,s=size*rr(.55,.9);
   BIO.put('bloom',[x+Math.cos(a2)*(R+s*.3),y2,z+Math.sin(a2)*(R+s*.3)],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),s,i%3?col:shade(col,rr(-.1,.2)));st.blooms++;}
  if(rng()<.2){const Lp=size*rr(3,5);BIO.put('pod',[x+Math.cos(a)*(R+.3),y-size*.6,z+Math.sin(a)*(R+.3)],qEuler(0,rr(0,TAU),0),Lp,bright(pick(PAL.accent),rr(.8,1.1)));st.pods++;}}}

// ---------------------------------------------------------------- beard moss
// Spanish-moss-like beards hung from a bough point; how many depends on how
// wet the ground is (none on the flats, thick in the marsh and the deltas).
function beardsAt(p,wet,k,st,long){const n=Math.round(rr(0,2.2)*k*smooth(.55,.95,wet));
 for(let i=0;i<n;i++){const L=long?rr(4,12):rr(2.5,8);BIO.put('beard',[p.x+rr(-.8,.8),p.y-(p.r||.3)*.5,p.z+rr(-.8,.8)],qEuler(0,rr(0,TAU),0),[rr(1.2,2.6),L,1.2],bright(vary(pick(PAL.mossPale),.02,.08,.06),1.25));st.moss++;}}
// ---------------------------------------------------------------- foliage helpers
function clumpAt(item,x,y,z,size,flat,col,cx,cy,cz,ex,ey){
 const dx=(x-cx)/ex,dy=(y-cy)/ey,dz=(z-cz)/ex,qq=Math.hypot(dx,dy,dz);
 const ao=mix(.5,1,smooth(.3,.95,qq))*mix(.8,1,smooth(-.6,.35,dy))*rr(.88,1.1);
 const nx=dx*.9+rr(-.3,.3),ny=dy*.7+.75+rr(-.15,.2),nz=dz*.9+rr(-.3,.3),nn=Math.hypot(nx,ny,nz)||1;
 BIO.put(item,[x,y,z],qEuler(rr(-.3,.3),rr(0,TAU),rr(-.3,.3)),[size,size*flat,size],bright(col,ao),{n:[nx/nn,ny/nn,nz/nn]});}
function frondAt(item,x,y,z,a,L,pitch,col,wid){BIO.put(item,[x,y,z],qEuler(rr(-.1,.1),-a,pitch),[L,L*rr(.85,1.05),L*(wid||rr(1.1,1.4))],col);}
function frondCrown(item,x,y,z,Rf,n,p0,p1,col,wid){const a0=rr(0,TAU);for(let k=0;k<n;k++){const a=a0+k/n*TAU+rr(-.2,.2);frondAt(item,x,y,z,a,Rf*rr(.85,1.1),rr(p0,p1),bright(col,rr(.88,1.1)),wid);}}
function fanAt(x,y,z,a,L,tilt,col,item){BIO.put(item||'fan',[x,y,z],qEuler(tilt,Math.atan2(Math.cos(a),Math.sin(a)),rr(-.08,.08)),[L*rr(.9,1.1),L,1],col);}
// the marsh's drier hummocks (where the beard oaks stand and the seal-trees do not): a noise field, not a host map
const hummock=(x,z)=>smooth(.50,.62,fbm(x*.0045+9,z*.0045+4,4141,2));
EASTABYSS.hummock=hummock;
// EPIPHYTE FERNS on a big bole: half-crowns of fronds rooted on the bark at
// random heights, pointing outward; only where it is wet
function epiFerns(x,z,y0,H,rAt,n,wet,st){n=Math.round(n*smooth(.55,.9,wet));
 for(let i=0;i<n;i++){const a=rr(0,TAU),u=rr(.08,.6),R=rAt(u)+.1,px=x+Math.cos(a)*R,pz=z+Math.sin(a)*R,py=y0+H*u,Rf=rr(1.2,2.6),col=bright(vary(pick(PAL.fern),.05,.12,.06),1.6);
  for(let k=0,m=ri(3,5);k<m;k++){const aa=a+rr(-1.1,1.1);frondAt('frond',px,py,pz,aa,Rf*rr(.8,1.1),rr(-.2,.4),bright(col,rr(.9,1.1)),1.2);}
  if(rng()<.5)BIO.put('mossmat',[px,py-.2,pz],qUp([Math.cos(a),rr(.1,.4),Math.sin(a)]),rr(.8,1.6),bright(vary(pick(PAL.moss),.03,.1,.06),.95));st.moss++;}}
// LIANAS: long strands hung from a bough point down toward the floor
function lianasAt(p,n,st){for(let i=0;i<n;i++){const L=rr(8,22);BIO.put('strand',[p.x+rr(-1,1),p.y-.2,p.z+rr(-1,1)],qEuler(0,rr(0,TAU),0),[rr(.25,.5),L,1],bright(vary(pick(PAL.vine||PAL.shrub),.03,.1,.06),1.1));st.lianas++;}}

// ---------------------------------------------------------------- the builders
// Each: (T, st, lv) where T={x,z,y0,sp,H,rb,crownR,seed} and lv 2 near / 1 mid / 0 far
const B=[];
// 0/1 the scale-trees: a straight pole, dichotomous forks, strap tufts at the tips, flowers up the bole
B[0]=B[1]=function(T,st,lv){const S=SP[T.sp],fam=T.sp===0?'bark0i':'bark'+S.barkK,H=T.H,rb=T.rb,ti=T.seed%3;
 const rAt=u=>rb*(1-.42*u)*(1+.7*Math.exp(-u*H/6));
 const rings=[],vs=9;for(let yy=0;yy<H*.74;yy+=vs*.5)rings.push({x:T.x,y:T.y0+yy,z:T.z,r:rAt(yy/H),yy:yy,col:barkCol(S,(Math.floor(yy/30)+ti)%3).lerp(C(PAL.moss[ti%3]),smooth(14,1,yy)*.45)});
 rings.push({x:T.x,y:T.y0+H*.74,z:T.z,r:rAt(.74),yy:H*.74,col:barkCol(S,1)},{x:T.x,y:T.y0+H*.74+rAt(.74)*.9,z:T.z,r:.05,yy:H*.74+1,col:barkCol(S,1)});   // closed: a dome, never an open pipe

 const spots=[];

  for(let i=1;i<pts.length;i++)if(!clear3(pts[i].x,pts[i].y,pts[i].z,pts[i].r+2,pts[i].r+2))return;
  st.limb+=BIO.tube(fam,pts,barkCol(S,2),{seg:r0>1.2?7:5,cap:lvl===S.forks-1});st.forks++;
  const e=pts[pts.length-1];if(lv>=1&&lvl>0)beardsAt(pts[2],T.wet,.9,st,true);
  if(lvl<S.forks-1){const sx=-d[2],sz=d[0],sl=Math.hypot(sx,sz)||1,side=[sx/sl,0,sz/sl],spread=rr(.35,.6),tw=rr(0,TAU);
   for(let k=-1;k<=1;k+=2){const dd=[d[0]*Math.cos(spread)+side[0]*Math.sin(spread)*k+Math.cos(tw)*.15,d[1]*Math.cos(spread)+rr(.05,.25),d[2]*Math.cos(spread)+side[2]*Math.sin(spread)*k+Math.sin(tw)*.15],l=Math.hypot(dd[0],dd[1],dd[2]);
    fork({x:e.x,y:e.y,z:e.z},[dd[0]/l,dd[1]/l,dd[2]/l],lvl+1,Math.max(.12,r0*.6));}}
  else{spots.push({p:e,s:len*.35},{p:pts[pts.length-2],s:len*.3});}}

 for(let k=0;k<nTop;k++){const a=a0+k*Math.PI+rr(-.3,.3),el=rr(.9,1.2);fork(top,[Math.cos(a)*Math.cos(el),Math.sin(el),Math.sin(a)*Math.cos(el)],0,rAt(.74)*.7);}
 if(!spots.length)spots.push({p:top,s:5},{p:{x:top.x,y:top.y+4,z:top.z},s:4});   // hemmed in by an obstacle: a tuft on the pole at least
 // the tufts: strap clumps at every fork tip, lit from the crown's centre
 const cy=T.y0+H*.92,ex=T.crownR,ey=H*.2,item='strap',sz0=T.sp===0?rr(9,13):rr(7,10),nC=lv===2?4:2;let mine=0;
 spots.forEach(s=>{for(let c=0;c<nC;c++){const a=rr(0,TAU),d=s.s*.7*Math.sqrt(rng()),x=s.p.x+Math.cos(a)*d,z=s.p.z+Math.sin(a)*d,y=s.p.y+rr(-.3,.7)*s.s*.6;
  if(!clear3(x,y,z,sz0*.5,sz0*.4))continue;clumpAt(item,x,y,z,sz0*rr(.85,1.2),.75,C(pick(S.leaf)),T.x,cy,T.z,ex,ey);st.clumps++;mine++;}
  if(rng()<.09){BIO.put('pod',[s.p.x,s.p.y-.3,s.p.z],qEuler(0,rr(0,TAU),0),rr(3,5)*(T.sp===0?1.3:1),bright(pick(PAL.accentDull),rr(.8,1.1)));st.pods++;}});

// the SMALL species far off (swlowlands' buildFarSmall, shaped per habit): one hull of
// 4*n triangles -- a foot, a ring of n, a second ring of n turned half a step, a crown
// point -- so the tree ferns, cycads, pipe reeds, palmettos, jade and the rest still read
// at range instead of stopping at the band edge. n is 5 (20 triangles) and 3 (12) past
// 2.2 km, as buildFar thins its blobs there. Colour from the seed, never rng(): the
// heroes built after it must draw the same numbers.
// habit: [ring A height, ring A radius, ring B height, ring B radius, crown point] as
// shares of H and crownR, and whether foot..A is bark (a bole, a stem, prop roots).

 11:[.45,.28,.74,.92,1.00,1],  // tide lycopsid: a drooping crown on a pole

// ---------------------------------------------------------------- the reed beds
// The mat reed grows in pure beds, not as scattered tufts: a bed is a disc of
// 7-18 m on still shallow water or the saturated bank beside it, stems on a
// jittered ~1.25 m spacing, all of a height. Run after the trees (a bed keeps
// out of a trunk, not the other way round). Every bed is exported in
// EASTABYSS.REEDBEDS ({x,z,r,n,depth}) and registered, so a world can put a
// reed-cutters' camp, a drying rack or a reed-boat slip on the bank of one.
EASTABYSS.REEDBEDS=[];
EASTABYSS.buildReedBeds=function(R,q){reseed(570011);q=q==null?1:q;R=R||3000;
 const S=SP.find(s=>s.key==='matreed');if(!S)return{beds:0,stems:0};const BEDS=EASTABYSS.REEDBEDS;BEDS.length=0;let stems=0;
 const spacing=S.bed.spacing,hc=S.leaf;let far=0;
 // past 1.9 km a bed is one far hull (farHull, a low drum in the bed's colour) in the 'far' bucket: sized
 // from a hash of its centre, never rng(), so every near bed draws the same numbers. Not exported or registered.
 const farBed=(cx,cy,cz)=>{const wl=BIO.waterH(cx,cz);if(cy-wl<-1.4||cy-wl>1.1||blocked(cx,cz,2))return;
  const Rb=mix(S.bed.R[0],S.bed.R[1],h3(cx*.013,cz*.017,5))*.8,nH=mix(S.H[0],S.H[1],h3(cz*.011,cx*.019,9)),i=Math.floor(h3(cx*.007,cz*.009,3)*hc.length)%hc.length;
  farHull(BIO.bucket('far'),cx,Math.max(cy,wl-.05)-.05,cz,nH,Rb,[.5,1,.92,.9,1,0],h3(cx,cz,1)*TAU,BIO.lodD(cx,cz)>2200?3:5,hullCols(hc[i],null));far++;};
 BIO.grid(64,0,R,(x,z)=>{const Z=zones(x,z),h=Z.h;if(h<-1.4||h>1.0)return 0;
   const still=1-Z.flow*.6;return (Z.shore*.55*still+Z.marsh*smooth(.8,.97,Z.wet)*.16*still+Z.marsh*Z.flow*.28+.25*smooth(.3,-.4,h)*smooth(-1.4,-.8,h)*Z.wet)*q;},
  (cx,cy,cz)=>{if(BIO.lodD(cx,cz)>1900){farBed(cx,cy,cz);return;}
   const ld=BIO.lodD(cx,cz),lv=ld<950?2:(ld<1600?1:0),Rb=rr(S.bed.R[0],S.bed.R[1])*(lv===0?.8:1),sp=spacing*(lv===2?1:lv===1?1.7:2.6);
   const nH=rr(S.H[0],S.H[1]),bedCol=vary(pick(hc),.02,.06,.04);let n=0,dsum=0;
   const N=Math.ceil(Rb*2/sp);
   for(let iz=0;iz<N;iz++)for(let ix=0;ix<N;ix++){const x=cx-Rb+(ix+rng())*sp,z=cz-Rb+(iz+rng())*sp,d=Math.hypot(x-cx,z-cz);if(d>Rb*(.85+.15*fbm(x*.3,z*.3,88,1)))continue;
    const y=Y(x,z),wl=BIO.waterH(x,z),dy=y-wl;if(dy<-1.4||dy>1.1)continue;if(!BIO.clearOf(x,z,.6)||blocked(x,z,.8))continue;
    const h=nH*rr(.9,1.08)*(lv===0?1.35:1),w=h*(lv===2?.42:.6);
    BIO.put('matreed',[x,Math.max(y,wl-.05)-.05,z],qEuler(rr(-.03,.03),rr(0,TAU),rr(-.03,.03)),[w,h,w],bright(vary(bedCol,.015,.05,.04),1.3));n++;dsum+=Math.max(0,-dy);}
   if(!n)return;stems+=n;const bed={x:cx,z:cz,r:Rb,n:n,depth:dsum/n,h:nH};BEDS.push(bed);
   if(lv===2&&typeof REGISTER==='function')REGISTER({name:'Mat-reed bed',kind:'stand',label:S.name,x:cx,z:cz,y:-1,r:Rb,h:nH+1});},
  {patch:.6,patchScale:.012,noMask:true,pad:.5});
 return{beds:BEDS.length,stems:stems,farBeds:far};};
EASTABYSS._canopyH=function(x,z){let h=0;for(const T of EASTABYSS.TREES){if(Math.hypot(x-T.x,z-T.z)<160)h=Math.max(h,T.y0+T.H);}return h||12;};

 {sp:4,cell:36,accept:(Z)=>Z.jung*.45+Z.sav*.22*(1-Z.up)+Z.marsh*.04,opt:{hero:800,mid:1400,far:false,pad:2,lodK:.6}},

 {sp:16,cell:26,accept:(Z)=>Z.jung*.42+Z.marsh*.12*smooth(.7,.95,Z.wet)+Z.jung*Z.flow*.2,opt:{hero:850,mid:1400,far:false,pad:2,lodK:.6}},

 {sp:19,cell:28,accept:(Z)=>Z.shore*.34+Z.marsh*Z.flow*.22+Z.jung*Z.flow*.1,opt:{hero:900,mid:1400,far:false,pad:2,lodK:.6,inWater:true}},

// ---------------------------------------------------------------- one tree alone (biomes/WORLD.md: trees as variants)
// make(sp,x,y,z): the pass's own tree record (H, rb, crownR, seed and wet from the kit's stream and fields: reseed first
// for a repeatable variant). grow(T,lv): build that one tree into this kit's buckets and items at level lv (2 hero, 1 mid,
// 0 far: the impostor for a species with one, the far hull for a small one) and nothing else: no keep-clear entry, no
// TREES record. An open world grows each species' variants once with these and instances them (openworld/README.md).
EASTABYSS.make=function(sp,x,y,z){const S=SP[sp];return{x:x,z:z,y0:y-.5,sp:sp,H:rr(S.H[0],S.H[1]),rb:rr(S.rb[0],S.rb[1]),crownR:rr(S.crownR[0],S.crownR[1]),seed:ri(0,999999),wet:BIO.field('wet',x,z)};};
EASTABYSS.grow=function(T,lv){means();
 const st={trunk:0,limb:0,far:0,farSmall:0,sapTris:0,forks:0,clumps:0,blooms:0,pods:0,moss:0,fronds:0,whorls:0,knees:0,fans:0,ropes:0,lianas:0,heroes:0,fars:0,byS:SP.map(()=>0)};
 T.lv=lv;if(lv===0){const P=EASTABYSS.PASSES.find(P=>P.sp===T.sp||(P.stand&&P.sp.indexOf(T.sp)>=0));if(P&&P.opt.far)buildFar(T,T.seed%7,st);else buildFarSmall(T,st);}
 else B[T.sp](T,st,lv);return st;};
})();

// ==================== 60-biome-eastabyss-floor.js
// ================================================================= EASTERN ABYSS — floor
// Everything under the trees, by zone, from the same climate fields the tree
// pass reads (EASTABYSS.zones):
//   the FLATS      near-bare crust: samphire in the lake's own colours where the
//                  ground is damp, pale salt grass, rosette succulents and
//                  jade along the river (the only arid plants in the kit)
//   the MARSH      reeds in green and lake-colour stands, cordgrass meadows
//                  (the gold-green sea of the reference plates), sedge tussocks,
//                  marsh shrubs, ferns under the knee-trees, samphire on the
//                  salty edges, moss in the wet; reeds standing in the shallows
//   the WATER      lily pads on still water only (pools, the lake's quiet
//                  margins), in the lake's complement, with the odd flower;
//                  rafts of floating leaves and water-hyacinth rosettes where
//                  the raft field says so
//   the JUNGLE     a club-moss carpet in three colours, giant ferns, shrubs,
//                  young pipe reeds, blooms on the floor, moss on everything,
//                  fallen scale-trees, mossy boulders -- the understorey is
//                  more colourful than the canopy over it
//   the SAVANNAH   dry grass, the purple Vain fronds in patches, frond shrubs,
//                  rosettes on the rocky ground, boulders
// Three LOD bands along the spine (near / mid / far) at 8 / 16 / 32 m cells.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;

const {bright,shade,vary,tint,means}=EASTABYSS;
const Y=(x,z)=>BIO.terrainH(x,z);
const leafCol=(set,k,dh)=>bright(vary(pick(set),dh==null?.05:dh,.14,.07),k==null?1.3:k);
const rockTint=(set,k)=>tint(vary(pick(set||PAL.rock),.02,.06,.06),means().rock,k==null?rr(.35,.6):k);
const rodCol=(hex)=>shade(vary(hex,.02,.08,.06),rr(-.45,-.2));

// ---------------------------------------------------------------- fields local to the floor
const reedRed=(x,z)=>smooth(.52,.64,fbm(x*.0038+3,z*.0038-8,2121,2));      // the lake-colour reed stands
const vainK=(x,z)=>smooth(.46,.62,fbm(x*.0052-5,z*.0052+2,3131,2));       // the Vain frond patches
const dampK=(x,z)=>fbm(x*.0062+21,z*.0062+13,777,2);
const raftK=(x,z)=>smooth(.50,.60,fbm(x*.0071-13,z*.0071+17,5151,2));       // where the still water carries leaf rafts instead of lilies
const meadowK=(x,z)=>smooth(.48,.60,fbm(x*.0033+41,z*.0033-23,6161,2));     // the cordgrass meadows of the marsh

// ---------------------------------------------------------------- small plants
function card(x,y,z,s,sy,col,tilt){BIO.put('ucard',[x,y,z],qEuler(rr(-(tilt||.2),tilt||.2),rr(0,TAU),rr(-(tilt||.2),tilt||.2)),[s,sy==null?s:sy,s],col);}

 for(let i=0;i<n;i++){const a=rr(0,TAU),d=r*Math.sqrt(rng()),s=sz?rr(sz[0],sz[1]):rr(.16,.34);BIO.put('bloom',[x+Math.cos(a)*d,y+rr(0,.4),z+Math.sin(a)*d],qEuler(rr(-.4,.4),rr(0,TAU),rr(-.4,.4)),s,c);}}

function fern(x,y,z,lv,set){const hc=vary(pick(set||PAL.fern),.06,.14,.07);
 frondCrown(x,y-.1,z,rr(1.8,3.6),lv===2?ri(5,7):lv===1?4:3,.08,.45,bright(hc,1.7));}
function giantFern(x,y,z,lv){const hc=vary(pick(rng()<.25?PAL.compDeep:PAL.fern),.05,.14,.07),R=rr(3,5.5);

 if(lv===2)frondCrown(x,y+.3,z,R*.5,3,.6,1.0,bright(shade(hc,.1),1.6),'bigfrond');}

  for(let i=0;i<2;i++){const a=rr(0,TAU),d=i?Rs*rr(.3,.7):0;card(x+Math.cos(a)*d,y+Rs*rr(.45,.7),z+Math.sin(a)*d,Rs*rr(1.5,1.9),Rs*rr(1.1,1.5),bright(vary(hc,.04,.1,.06),1.45),.25);}}

function clubmoss(x,y,z,lv){const t=rng(),set=t<.5?PAL.marshGreen:t<.8?PAL.comp:PAL.accentDull,h=rr(.35,.7)*(lv===0?1.8:1);

function reed(x,y,z,lv,red){const set=red?(rng()<.55?PAL.accentDull:PAL.accent):PAL.reedGreen,h=rr(1.6,3.2)*(lv===0?1.6:1),n=lv===2?ri(3,5):lv===1?2:1;
 for(let k=0;k<n;k++){const a=rr(0,TAU),d=k?rr(.8,2.6):0,hx=x+Math.cos(a)*d,hz=z+Math.sin(a)*d;if(k&&Y(hx,hz)-BIO.waterH(hx,hz)<-.4)continue;

function cordgrass(x,y,z,lv){const h=rr(1.2,2.2)*(lv===0?1.5:1),n=lv===2?ri(3,5):lv===1?2:1;for(let k=0;k<n;k++){const a=rr(0,TAU),d=k?rr(.7,2.2):0;tuft('grass',x+Math.cos(a)*d,y,z+Math.sin(a)*d,h*rr(.8,1.1),h*1.2,leafCol(PAL.cordgrass,1.3,.03));}}

function saltgrass(x,y,z,lv){const h=rr(.35,.8)*(lv===0?1.6:1);tuft('grass',x,y,z,h,h*1.3,leafCol(PAL.saltgrass,1.25,.02));}
function savgrass(x,y,z,lv){const h=rr(.9,1.7)*(lv===0?1.7:1),n=lv===2?ri(3,5):lv===1?2:1;for(let k=0;k<n;k++){const a=rr(0,TAU),d=k?rr(.8,2.4):0;tuft('grass',x+Math.cos(a)*d,y,z+Math.sin(a)*d,h*rr(.8,1.1),h*1.4,leafCol(PAL.savgrass,1.3,.03));}}
function rosette(x,y,z,lv,set,k){const R=rr(.35,.9)*(k||1),c=vary(pick(set||PAL.succulent),.03,.1,.06);
 BIO.put('rosette',[x,y-.02,z],qEuler(rr(-.06,.06),rr(0,TAU),rr(-.06,.06)),[R,R*.8,R],bright(c.lerp(C(PAL.accent[1]),rr(0,.25)),1.05));
 if(lv===2&&rng()<.15){BIO.beam('rod',[x,y,z],[x+rr(-.2,.2),y+R*2.2,z+rr(-.2,.2)],.03,.02,rodCol(0x8a6a4a));blooms(x,y+R*2.2,z,.25,ri(3,6),PAL.accent,[.08,.16]);}}
function vain(x,y,z,lv){const n=lv===2?ri(2,4):1,a0=rr(0,TAU);
 for(let k=0;k<n;k++){const a=a0+k*2.1+rr(-.3,.3),d=k?rr(.4,1.1):0,px=x+Math.cos(a)*d,pz=z+Math.sin(a)*d,h=rr(1.1,2.4),tilt=rr(.15,.55);

  if(lv>=1)BIO.beam('rod',[px,y-.1,pz],[px+Math.cos(a)*Math.sin(tilt)*h*.55,y+h*.55*Math.cos(tilt),pz+Math.sin(a)*Math.sin(tilt)*h*.55],.04,.03,rodCol(0x4a3a5a));

function frondShrub(x,y,z,lv){const hc=vary(pick(PAL.savleaf),.05,.12,.06),Rs=rr(1.2,2.4);

function boulder(x,y,z,lv,set,st){const n=lv===2?ri(1,2):1,Rb=rr(1,3);
 for(let i=0;i<n;i++){const a=rr(0,TAU),d=i?Rb*rr(.7,1.2):0,r=Rb*(i?rr(.35,.7):1),bx=x+Math.cos(a)*d,bz=z+Math.sin(a)*d,by=Y(bx,bz),h=r*rr(.55,.95);
  BIO.put('boulder',[bx,by+h*.3,bz],qEuler(rr(-.25,.25),rr(0,TAU),rr(-.25,.25)),[r*rr(.9,1.3),h*.8,r*rr(.9,1.3)],rockTint(set));st.boulders++;
  if(set===PAL.rock&&lv>=1){BIO.put('mossmat',[bx+rr(-.15,.15)*r,by+h*1.05,bz+rr(-.15,.15)*r],qEuler(rr(-.2,.2),rr(0,TAU),rr(-.2,.2)),r*rr(.6,.9),leafCol(PAL.moss,.95));st.moss++;}}}
function youngReed(x,y,z,lv){const n=ri(3,5),h=rr(2,5),hc=vary(pick(PAL.reedGreen),.03,.1,.05),rc=rodCol(0x6a8a5a);
 BIO.beam('rod',[x,y-.2,z],[x,y+h,z],.06+h*.012,.03,rc);
 for(let k=1;k<=n;k++){const R=rr(.7,1.4)*mix(1.1,.6,k/n);BIO.put('whorl',[x,y+h*k/n,z],qEuler(0,rr(0,TAU),0),[R,R,R],bright(hc,1.2));}}
// a RAFT of floating leaves: a dozen pointed leaves lying every which way on the water, a few tips lifted
function raft(x,y,z,lv,st){const w=BIO.waterH(x,z),set=PAL.floatleaf,n=lv===2?ri(6,10):ri(3,5),R=rr(1.5,3.2),c=vary(pick(set),.03,.1,.06);
 for(let k=0;k<n;k++){const a=rr(0,TAU),d=R*Math.sqrt(rng()),L=rr(.7,1.3);BIO.put('floatleaf',[x+Math.cos(a)*d,w+.06,z+Math.sin(a)*d],qEuler(rr(-.06,.06),rr(0,TAU),rr(-.25,.05)),[L,1,L],bright(vary(c,.02,.06,.05),1.05));}
 st.rafts++;
 if(lv===2&&rng()<.3){const c2=bright(vary(pick(PAL.hyacinth),.03,.08,.05),1.15),a=rr(0,TAU),hx=x+Math.cos(a)*R*.6,hz=z+Math.sin(a)*R*.6,r=rr(.5,.9);   // a water hyacinth: a fat pale rosette with a lavender spike
  BIO.put('rosette',[hx,w+.08,hz],qEuler(0,rr(0,TAU),0),[r,r*1.1,r],c2);
  if(rng()<.6){BIO.beam('rod',[hx,w+.1,hz],[hx,w+.1+r*1.6,hz],.04,.03,rodCol(0x6a7a4a));blooms(hx,w+.1+r*1.6,hz,.2,ri(3,6),PAL.vain,[.1,.18]);}}}
function lily(x,y,z,lv,st){const w=BIO.waterH(x,z),t=rng(),set=t<.55?PAL.pad:t<.8?[0x3a6a3a,0x4a7a40,0x2e5a30]:PAL.accent,R=rr(.45,1.4);
 BIO.put('pad',[x,w+.05,z],qEuler(rr(-.03,.03),rr(0,TAU),rr(-.03,.03)),[R,1,R],bright(vary(pick(set),.03,.1,.06),1.05));st.lilies++;
 if(lv===2&&rng()<.22)BIO.put('bloom',[x+rr(-.3,.3)*R,w+.22,z+rr(-.3,.3)*R],qEuler(rr(-.2,.2),rr(0,TAU),rr(-.2,.2)),rr(.25,.5),bright(rng()<.5?C(0xf4ecd8):C(pick(PAL.accent)).lerp(C(0xffffff),.35),1.1));
 if(lv===2&&rng()<.3){const R2=R*rr(.5,.8),a=rr(0,TAU);BIO.put('pad',[x+Math.cos(a)*R*1.4,w+.04,z+Math.sin(a)*R*1.4],qEuler(0,rr(0,TAU),0),[R2,1,R2],bright(vary(pick(set),.03,.1,.06),1.05));st.lilies++;}}
// a fallen scale-tree: a mossed tube with ferns and club-moss along its back
function log(x,y,z,st){const a=rr(0,TAU),L=rr(22,60),r0=rr(1,2),hx=Math.cos(a),hz=Math.sin(a),n=Math.ceil(L/8)+1,pts=[];
 for(let i=0;i<n;i++){const t=i/(n-1),px=x+hx*(t-.5)*L,pz=z+hz*(t-.5)*L;if(BIO.mask(px,pz)<=0||!okGround(px,pz,2))return false;
  pts.push({x:px,y:Y(px,pz)+r0*.35,z:pz,r:mix(r0,r0*.5,t),col:tint(pick(PAL.deadwood),means().wood,rr(.7,1)).lerp(C(PAL.moss[i%3]),rng()<.4?.5:0)});}
 BIO.tube('wood',pts,pts[0].col,{seg:9,cap:true});st.logs++;
 for(let s=3;s<L-2;s+=rr(3,6)){const t=s/L,i=Math.min(n-2,Math.floor(t*(n-1))),f=t*(n-1)-i,A=pts[i],Bq=pts[i+1],px=mix(A.x,Bq.x,f),pz=mix(A.z,Bq.z,f),py=mix(A.y,Bq.y,f),r=mix(A.r,Bq.r,f);
  const k=rng();if(k<.45){BIO.put('mossmat',[px,py+r*.95,pz],qEuler(rr(-.1,.1),rr(0,TAU),rr(-.1,.1)),r*rr(.6,1),leafCol(PAL.moss,.95));st.moss++;}
  else if(k<.75)frondCrown(px+rr(-.3,.3),py+r*.9,pz+rr(-.3,.3),rr(1,2),5,.05,.4,leafCol(PAL.fern,1.7));
  else tuft('clubmoss',px,py+r*.9,pz,rr(.4,.8),.8,leafCol(PAL.comp,1.35,.03));}
 return true;}

// ---------------------------------------------------------------- the zone planters
// Each takes (x,y,z,Z,lv,st) and places one plant of the zone's mix.
function plantJungle(x,y,z,Z,lv,st){const t=rng(),damp=dampK(x,z);
 if(t<.36){clubmoss(x,y,z,lv);st.clubmoss++;if(lv>=1){for(let k=0,m=lv===2?ri(1,3):1;k<m;k++)clubmoss(x+rr(-2,2),y,z+rr(-2,2),lv);}if(lv===2&&dampK(x,z)>.45){groundMoss(x+rr(-1,1),y,z+rr(-1,1),rr(1.2,2.4));st.moss++;}}
 else if(t<.52){if(lv>=1&&okGround(x,z,2.5)){giantFern(x,y,z,lv);st.ferns++;}else{fern(x,y,z,lv);st.ferns++;}}
 else if(t<.64){fern(x,y,z,lv,rng()<.2?PAL.compDeep:PAL.fern);st.ferns++;}
 else if(t<.76){shrub(x,y,z,lv,rng()<.25?PAL.compDeep:PAL.shrub);st.shrubs++;}
 else if(t<.84){if(damp>.5&&lv>=1){groundMoss(x,y,z,rr(1.4,3));st.moss++;}else{clubmoss(x,y,z,lv);st.clubmoss++;}}
 else if(t<.90){if(lv>=1&&Z.flow>.2){youngReed(x,y,z,lv);st.reeds++;}else{fern(x,y,z,lv);st.ferns++;}}
 else if(t<.95){blooms(x,y,z,rr(.8,1.8),ri(3,8),rng()<.7?PAL.comp:PAL.accent);st.blooms++;if(lv===2)clubmoss(x,y,z,lv);}
 else{boulder(x,y,z,lv,PAL.rock,st);}}
function plantMarsh(x,y,z,Z,lv,st){const t=rng(),red=rng()<reedRed(x,z),mk=meadowK(x,z);
 if(t<.55*mk){cordgrass(x,y,z,lv);st.tufts++;if(lv===2&&rng()<.5)cordgrass(x+rr(-2,2),y,z+rr(-2,2),lv);}
 else if(t<.46){reed(x,y,z,lv,red);st.reeds++;}
 else if(t<.62){sedge(x,y,z,lv);st.tufts++;}
 else if(t<.72){if(Z.salt>.25||rng()<.3){samphire(x,y,z,lv,1.2);st.samphire++;}else{reed(x,y,z,lv,red);st.reeds++;}}
 else if(t<.82){shrub(x,y,z,lv,rng()<.4?PAL.accentDull:PAL.marshGreen);st.shrubs++;}
 else if(t<.90){if(lv>=1&&okGround(x,z,2)){fern(x,y,z,lv);st.ferns++;}else{sedge(x,y,z,lv);st.tufts++;}}
 else if(t<.96){if(dampK(x,z)>.5&&lv>=1){groundMoss(x,y,z,rr(1.2,2.6));st.moss++;}else{reed(x,y,z,lv,red);st.reeds++;}}
 else{if(lv>=1&&Z.flow>.3){youngReed(x,y,z,lv);st.reeds++;}else{blooms(x,y,z,rr(.6,1.4),ri(2,5),rng()<.5?PAL.comp:PAL.accent);st.blooms++;}}}
function plantFlat(x,y,z,Z,lv,st){const t=rng(),damp=Math.max(Z.flow,smooth(.05,.35,Z.wet));
 if(t<.45*damp+.12){samphire(x,y,z,lv,.8+damp*.5);st.samphire++;}
 else if(t<.6){saltgrass(x,y,z,lv);st.tufts++;}
 else if(t<.6+.25*Z.flow){rosette(x,y,z,lv,PAL.succulent);st.rosettes++;}
 else if(t<.93){if(rng()<.5){saltgrass(x,y,z,lv);st.tufts++;}else return;}
 else{boulder(x,y,z,lv,PAL.saltrock,st);}}
function plantSav(x,y,z,Z,lv,st){const t=rng(),vk=vainK(x,z);
 if(t<.5*vk+.04){vain(x,y,z,lv);st.vain++;if(lv===2&&vk>.5)vain(x+rr(-2.5,2.5),y,z+rr(-2.5,2.5),1);}
 else if(t<.70){savgrass(x,y,z,lv);st.tufts++;if(lv===2&&rng()<.4)savgrass(x+rr(-1.5,1.5),y,z+rr(-1.5,1.5),lv);}
 else if(t<.82){frondShrub(x,y,z,lv);st.shrubs++;}
 else if(t<.90){rosette(x,y,z,lv,rng()<.5?PAL.savleaf:PAL.succulent,1.3);st.rosettes++;}
 else if(t<.95){blooms(x,y,z,rr(.6,1.5),ri(2,6),PAL.comp);st.blooms++;}
 else{boulder(x,y,z,lv,PAL.rock,st);}}
function plantShore(x,y,z,Z,lv,st){const t=rng();
 if(t<.45){reed(x,y,z,lv,rng()<.55);st.reeds++;}
 else if(t<.75){samphire(x,y,z,lv,1.1);st.samphire++;}
 else{sedge(x,y,z,lv);st.tufts++;}}

// ---------------------------------------------------------------- the pass
EASTABYSS.buildFloor=function(R,q){
 reseed(600011);q=q==null?1:q;R=R||3000;means();
 const st={clubmoss:0,ferns:0,shrubs:0,reeds:0,tufts:0,samphire:0,rosettes:0,vain:0,blooms:0,moss:0,boulders:0,lilies:0,rafts:0,logs:0};
 const cur=()=>{const t=BIO.stats[BIO.cur||'biome'];return t?t.tris:0;};
 // one plant of the right zone's mix at (x,z); density by zone
 function plant(x,y,z,lv){if(!okGround(x,z,.8))return;const Z=zones(x,z);
  const w=[Z.jung*1.35,Z.marsh*1.25,Z.flat*.16,Z.sav*1.2,Z.shore*.9],tot=w[0]+w[1]+w[2]+w[3]+w[4];if(tot<=0)return;
  let r=rng()*Math.max(1,tot),k=0;for(;k<4;k++){if(r<w[k])break;r-=w[k];}if(k>=4&&r>w[4])return;
  [plantJungle,plantMarsh,plantFlat,plantSav,plantShore][Math.min(k,4)](x,y,z,Z,lv,st);}
 // three bands along the LOD spine
 const bands=[[7,600,0,[-R,-640,R,640]],[14,1500,600,[-R,-1540,R,1540]],[30,1e9,1500,null]];
 bands.forEach((b,bi)=>{const lv=2-bi;
  BIO.grid(b[0],0,R,(x,z,d)=>{const ld=BIO.lodD(x,z);if(ld>=b[1]||ld<b[2])return 0;return .82*q*(lv===0?.7:1);},(x,y,z,d)=>plant(x,y,z,lv),{patch:.75,patchScale:.014,pad:.6,box:b[3]});});
 // the water: lily pads on still water, reeds standing in the shallows
 const wbands=[[7,600,0,[-R,-640,R,640]],[14,1500,600,[-R,-1540,R,1540]]];
 wbands.forEach((b,bi)=>{const lv=2-bi;
  BIO.grid(b[0],0,R,(x,z,d)=>{const ld=BIO.lodD(x,z);if(ld>=b[1]||ld<b[2])return 0;const h=Y(x,z)-BIO.waterH(x,z);if(h>.35||h<-2.6)return 0;   // h: the ground against the local water
    const Z=zones(x,z);const still=1-Z.flow;return .7*q*still*Z.wet*smooth(.02,-.15,h)*smooth(-2.6,-1.0,h)+.3*q*smooth(-.9,-.1,h)*smooth(.6,.85,Z.wet);},
   (x,y,z,d)=>{if(!BIO.clearOf(x,z,1))return;const w=BIO.waterH(x,z);if(y-w<-.9||rng()<.72){if(rng()<raftK(x,z))raft(x,y,z,lv,st);else lily(x,y,z,lv,st);}else{const Z=zones(x,z);reed(x,Math.max(y,w-.6),z,lv,rng()<.5);st.reeds++;}},{patch:.8,patchScale:.02,noMask:true,pad:.5,box:b[3]});});
 // fallen scale-trees in the jungle
 BIO.grid(170,0,R,(x,z,d)=>{if(BIO.lodD(x,z)>1500)return 0;return zones(x,z).jung*.8*q;},(x,y,z,d)=>{for(let t=0;t<4;t++)if(log(x+rr(-30,30),y,z+rr(-30,30),st))break;},{patch:0,pad:3});
 return{under:st};};
})();

// ==================== 65-biome-eastabyss-dress.js
// ================================================================= EASTERN ABYSS — growth on structures
// What the abyssal jungle does to a building left in it (the hyperjungle
// kit's pass, in this biome's palette: the mosses carry the lake's tinge, the
// flowers its complement, the ledge trees are tree ferns). The host hands over its
// shells as BufferGeometry[] in world space; this pass samples their faces
// (BIO.upFaces / downFaces / sideFaces / ledgePoints) and grows on them. It
// never touches the geometry -- a plant is never part of a building.
//
// Ported from the Hexahedron's 71b-flora.js dressing, which was the pass that
// made an arcology read as overgrown: moss on every ledge, mats rolled over on
// the soffits with roots and curtains hanging out of them, brackets on the
// arrises, and density falling off into the dark middle of an underside.
(function(){const {TAU,clamp,lerp,mix,smooth,reseed,rng,rr,ri,pick,h3,vnoise,fbm,qEuler,qFacing,qUp}=BIO.fn;
const PAL=EASTABYSS.PAL;PAL.vine=PAL.vine||[0x3d5a2a,0x2f4a24,0x4a6a30];
const C=hex=>new BIO.host.THREE.Color(hex);
const vcol=()=>C(pick(PAL.vine)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.05,.05));
const mcol=()=>C(pick(PAL.moss)).offsetHSL(rr(-.03,.03),rr(-.08,.08),rr(-.06,.04));
const bloomCol=()=>C(pick(PAL.comp));

// a MOSS PATCH lying on a surface with normal n (up for a ledge, down for a soffit)
function moss(p,n,r){const q=qUp(n);const s=r*rr(.7,1.3);
 BIO.put('mossmat',[p[0]+n[0]*.06,p[1]+n[1]*.06,p[2]+n[2]*.06],q,[s,1,s],mcol());}
// a HANGING CURTAIN off a point: 2-4 ribbons side by side across w, facing (dx,dz),
// a trailing strand, and the odd flower
function curtain(p,dx,dz,len,w,opt){opt=opt||{};const m=Math.hypot(dx,dz);
 if(m<1e-6){const a=rng()*TAU;dx=Math.cos(a);dz=Math.sin(a);}else{dx/=m;dz/=m;}
 const q=qFacing([dx,0,dz]),tx=-dz,tz=dx,nrb=2+Math.floor(rng()*3),c=opt.col||vcol();
 for(let i=0;i<nrb;i++){const o=(i-(nrb-1)/2)*w/nrb+rr(-.1,.1)*w,L=len*rr(.5,1);
  BIO.put('ribbon',[p[0]+tx*o+dx*rr(.05,.35),p[1]+rr(-.15,.05),p[2]+tz*o+dz*rr(.05,.35)],q,[w/nrb*rr(1,1.8),L,1],c.clone().multiplyScalar(rr(.82,1.12)));}
 if(rng()<.75){const o=rr(-w/2,w/2);BIO.put('strand',[p[0]+tx*o+dx*.4,p[1]-rr(0,.2),p[2]+tz*o+dz*.4],q,[rr(.14,.34),len*rr(.9,1.5),1],c.clone().multiplyScalar(.85));}
 if(opt.flowers&&rng()<.55){const fc=bloomCol();for(let b=0,nb=2+Math.floor(rng()*5);b<nb;b++){const s=rr(.3,.62);
  BIO.put('bloom',[p[0]+tx*rr(-.5,.5)*w+dx*.45,p[1]-rr(.2,len*.75),p[2]+tz*rr(-.5,.5)*w+dz*.45],qEuler(0,rng()*TAU,0),[s,s,s],fc);}}}
// AERIAL ROOTS off a ceiling: thin, long, hanging straight down
function roots(p,len,w){const q=qEuler(0,rng()*TAU,0),c=vcol();
 for(let i=0,n=1+Math.floor(rng()*3);i<n;i++)BIO.put('strand',[p[0]+rr(-w,w),p[1],p[2]+rr(-w,w)],q,[rr(.1,.3),len*rr(.6,1.2),1],c.clone().multiplyScalar(rr(.8,1.1)));}
// BRACKET FUNGUS on the side of something
function bracket(p,n,s){for(let b=0,nb=2+Math.floor(rng()*3);b<nb;b++){const sb=s*rr(.4,1);
 BIO.put('fungus',[p[0]+n[0]*.2+rr(-.6,.6)*s*(1-Math.abs(n[0])),p[1]+rr(0,2.2)*s,p[2]+n[2]*.2+rr(-.6,.6)*s*(1-Math.abs(n[2]))],
  qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[sb,sb*.4,sb],C(pick(PAL.fungus)));}}
// a PLANT on a ledge: fern rosette, tuft or small bush
function plant(p,s){const k=rng();const y=p[1];
 if(k<.45){const n=5+Math.floor(rng()*3),c=C(pick(PAL.fern));for(let i=0;i<n;i++){const a=i/n*TAU+rr(-.25,.25),L=s*rr(.85,1.4);
  BIO.put('frond',[p[0],y+s*.12,p[2]],qEuler(rr(.05,.30),-a,0),[L,L*rr(.7,1),L*rr(.7,1)],c.clone().multiplyScalar(rr(.82,1.2)));}}
 else if(k<.8){const c=C(pick(PAL.fern)).offsetHSL(rr(-.08,.08),0,rr(-.05,.08));
  BIO.put('ucard',[p[0],y+s*.35,p[2]],qEuler(rr(-.2,.2),rng()*TAU,rr(-.2,.2)),[s*1.2,s*.9,s*1.2],c);}
 else{const c=C(pick(PAL.fern)).offsetHSL(rr(-.1,.1),.05,.02);
  BIO.put('lobe',[p[0],y,p[2]],qEuler(0,rng()*TAU,0),[s,s*.7,s],c.clone().multiplyScalar(.82));
  for(let i=0;i<2;i++)BIO.put('ucard',[p[0]+rr(-.4,.4)*s,y+s*.5,p[2]+rr(-.4,.4)*s],qEuler(rr(-.3,.3),rng()*TAU,rr(-.3,.3)),[s*1.3,s,s*1.3],c.clone().multiplyScalar(rr(.9,1.2)));}}
// a SMALL TREE on a ledge: a tree fern, 4-12 m
function smallTree(p,h){const S=EASTABYSS.SPECIES[3],rb=h*.04+.25;
 BIO.put('trunk',[p[0],p[1],p[2]],qEuler(rr(-.05,.05),0,rr(-.05,.05)),[rb/.4,h,rb/.4],C(pick(S.bark)));
 const n=8+Math.floor(rng()*5),R=h*.45,a0=rng()*TAU,c=C(pick(S.leaf));
 for(let i=0;i<n;i++){const a=a0+i/n*TAU+rr(-.2,.2),L=R*rr(.85,1.1);BIO.put('bigfrond',[p[0],p[1]+h,p[2]],qEuler(rr(-.1,.1),-a,rr(-.1,.3)),[L,L,L*1.25],c.clone().multiplyScalar(rr(1.2,1.5)));}}
// LEDGES: moss on the flat, plants toward the outer edge, lips and curtains off the edge
EASTABYSS.dressLedges=function(geos,opt){opt=opt||{};
 const nM=opt.moss||400,nP=opt.plants||300,nE=opt.edges||140;
 BIO.upFaces(geos,nM,.6).forEach(f=>moss(f.p,f.n,rr(1.2,opt.mossR||3.5)));
 BIO.upFaces(geos,nP,.6).forEach(f=>{if(rng()<.12)smallTree(f.p,rr(4,opt.treeH||12));else plant(f.p,rr(1,opt.size||3));});
 BIO.ledgePoints(geos,nE,2.5).forEach(l=>{const p=[l.p[0]+l.n[0]*.3,l.p[1]-.1,l.p[2]+l.n[2]*.3];
  moss([l.p[0],l.p[1],l.p[2]],[0,1,0],rr(1,2.2));
  if(rng()<.7)curtain(p,l.n[0],l.n[2],rr(4,opt.hang||16),rr(2,5),{flowers:rng()<.4});});};
// SOFFITS: moss rolled over to face the ground, roots and beards hanging out of
// it, brackets, curtains where the rim is. Density rises toward the rim: the
// middle of a big underside is in permanent dark and grows almost nothing.
EASTABYSS.dressSoffits=function(geos,opt){opt=opt||{};
 const S=BIO.downFaces(geos,opt.n||400,.6);if(!S.length)return;
 let cx=0,cz=0;S.forEach(f=>{cx+=f.p[0];cz+=f.p[2];});cx/=S.length;cz/=S.length;
 let rMax=1e-6;S.forEach(f=>{f.r=Math.hypot(f.p[0]-cx,f.p[2]-cz);if(f.r>rMax)rMax=f.r;});
 S.forEach(f=>{const u=f.r/rMax,lit=.15+.85*Math.pow(u,1.4);const R=(opt.mossR||5)*(.35+.65*lit);
  const dn=[0,-1,0];moss(f.p,dn,rr(R*.6,R));
  for(let q=0,nq=1+Math.floor(rng()*3);q<nq;q++)moss([f.p[0]+rr(-1,1)*R,f.p[1]-rr(0,.2),f.p[2]+rr(-1,1)*R],dn,rr(R*.25,R*.8));
  if(rng()<lit*.85)roots([f.p[0],f.p[1]-.15,f.p[2]],rr(4,opt.hang||16)*(.35+.65*lit),rr(.5,2.2));

// ==================== 91-host-probe.js
// ================================================================= HOST — probe (window._api)
// What verify.py --assert measures. Budgets per biome pass come from
// BIO.stats (charged by BIO.cur inside the biome).
const BUDGET={
 showcase:{tris:11000000,calls:130},  // the ceiling the second pass was given (11M); measured ~7.4M before it (KNOWN_ISSUES)
 cls:{pass:8200000,host:900000},
 type:{'abyss/trees':'pass','abyss/reeds':'pass','abyss/floor':'pass','abyss/water':'pass','abyss/dress':'pass','abyss/fauna':'pass','host':'host'},
};
function _probePoints(){
 const pts=[],m=new THREE.Matrix4(),pos=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),bb=new THREE.Box3();
 scene.traverse(o=>{if(o.userData&&o.userData.probeSkip)return;
  if(o.isInstancedMesh){for(let i=0;i<o.count;i++){o.getMatrixAt(i,m);m.decompose(pos,q,sc);pts.push([pos.x,pos.y,pos.z]);}return;}
  if(!o.isMesh)return;bb.setFromObject(o);if(!isFinite(bb.min.x)||!isFinite(bb.max.x))return;
  pts.push([(bb.min.x+bb.max.x)/2,(bb.min.y+bb.max.y)/2,(bb.min.z+bb.max.z)/2]);});
 return pts;}
function regOccupancy(){const n=new Array(REG.length).fill(0);const P=_probePoints();
 REG.forEach((r,i)=>{for(const p of P){const dx=p[0]-r.x,dz=p[2]-r.z;if(dx*dx+dz*dz<=r.r*r.r&&p[1]>=(r.y||0)-2&&p[1]<=(r.y||0)+r.h+5)n[i]++;}});
 return REG.map((r,i)=>({name:r.name,type:r.type,n:n[i]}));}
function nanSweep(){const bad=[];let badInst=0;
 scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;if(o.userData&&o.userData.probeSkip)return;
  const p=o.geometry&&o.geometry.attributes&&o.geometry.attributes.position;if(p){const a=p.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){bad.push({geo:o.name||o.geometry.type,at:i});break;}}
  if(o.isInstancedMesh){const a=o.instanceMatrix.array;for(let i=0;i<a.length;i++)if(!isFinite(a[i])){badInst++;break;}}});
 return {meshes:bad.length,first:bad.slice(0,8),instances:badInst,firstInstances:[]};}
function typeStats(){const out={};for(const k in BIO.stats){const t=BIO.stats[k],cls=BUDGET.type[k]||'pass';out[k]={tris:t.tris,inst:t.inst,meshes:t.meshes,cls,limit:BUDGET.cls[cls],over:t.tris>BUDGET.cls[cls]};}return out;}
window._api={BUDGET,REG,
 get totals(){const t=BIO.totals();return {tris:t.tris,inst:t.inst,meshes:t.meshes,registered:REG.length,types:Object.keys(BIO.stats).length};},
 typeStats,regOccupancy,nanSweep,
 setView:(cx,cy,cz,tx,ty,tz)=>setView(cx,cy,cz,tx,ty,tz),views:()=>Object.keys(VIEWS),
 biome:()=>window._biome};
window._registered=REG.length;
</script>
